<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Google 服務啟動器｜Toby</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
:root{--ink:#202634;--muted:#687386;--bg:#f3f6fc;--line:#e7ebf3;--shadow:0 12px 28px rgba(41,57,91,.09)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;background:radial-gradient(ellipse at 5% 5%,#dce8ff 0,transparent 27rem),radial-gradient(ellipse at 96% 22%,#fff0c5 0,transparent 27rem),var(--bg)}
a{color:inherit}
main{width:min(1080px,100%);margin:auto;padding:22px 22px 50px}
.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:17px;padding:10px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);text-decoration:none;font-size:14px;font-weight:750;box-shadow:0 5px 14px #2537540b;transition:.18s}
.back:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.hero{position:relative;isolation:isolate;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:30px 32px;border-radius:28px;color:#fff;background:linear-gradient(115deg,#4285f4 0%,#7057e8 48%,#a852d2 100%);box-shadow:0 18px 38px #5b64cc37}
.hero:before,.hero:after{content:"";position:absolute;z-index:-1;border-radius:50%;background:#ffffff18}
.hero:before{width:230px;height:230px;right:-42px;top:-125px}
.hero:after{width:150px;height:150px;right:23%;bottom:-120px}
.headline{display:flex;align-items:center;gap:17px}
.google-mark{width:58px;height:58px;flex:0 0 58px;display:grid;place-items:center;border-radius:20px;background:#fff;color:#4285f4;font:bold 40px Arial,sans-serif;box-shadow:0 8px 20px #243c9b32}
h1{margin:0;font-size:clamp(28px,5.5vw,46px);line-height:1.14;letter-spacing:.01em}
.hero p{margin:9px 0 0;color:#eef3ff;font-size:15px}
.count{flex:0 0 auto;padding:11px 15px;border:1px solid #ffffff45;border-radius:16px;background:#ffffff20;text-align:center;color:#fff;font-size:13px}
.count strong{display:block;font-size:24px;line-height:1.2}
.search-wrap{margin:20px 0 18px}
form{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 15px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 8px 22px #26364f0b}
.search-icon{font-size:20px;color:#7c8493}
input{min-width:0;flex:1;border:0;outline:0;background:transparent;padding:9px 4px;color:var(--ink);font:inherit;font-size:15px}
button[type=submit]{border:0;border-radius:13px;padding:10px 16px;background:#202634;color:#fff;font:inherit;font-weight:750;cursor:pointer;transition:.18s}
button[type=submit]:hover{background:#4285f4;transform:translateY(-1px)}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:22px 2px 12px}
.section-head h2{margin:0;font-size:19px}
.section-head span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.service{--accent:#4285f4;--tint:#edf3ff;position:relative;isolation:isolate;display:flex;align-items:center;gap:13px;min-height:82px;padding:14px 14px;border:1px solid var(--line);border-radius:19px;background:#fff;color:var(--ink);text-decoration:none;box-shadow:0 5px 16px #2937520a;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s}
.service:before{content:"";position:absolute;z-index:-1;width:88px;height:88px;right:-45px;bottom:-56px;border-radius:50%;background:var(--tint);transition:transform .25s}
.service:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 36%,white)}
.service:hover:before{transform:scale(1.6)}
.service-icon{display:grid;place-items:center;flex:0 0 46px;width:46px;height:46px;border-radius:15px;background:var(--tint);color:var(--accent);font-size:23px;font-weight:850}
.service-name{flex:1;font-size:16px;font-weight:760;line-height:1.35}
.arrow{color:#9aa2af;font-size:17px;transition:transform .2s}
.service:hover .arrow{color:var(--accent);transform:translate(2px,-2px)}
footer{text-align:center;color:var(--muted);margin-top:24px;font-size:13px}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:700px){main{padding:15px 14px 38px}.hero{padding:24px 20px;border-radius:23px}.headline{gap:13px}.google-mark{width:48px;height:48px;flex-basis:48px;border-radius:16px;font-size:34px}.hero p{font-size:13px}.count{padding:9px 11px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.service{min-height:75px;gap:10px;padding:11px;border-radius:17px}.service-icon{width:40px;height:40px;flex-basis:40px;border-radius:13px;font-size:20px}.service-name{font-size:14px}}
@media(max-width:390px){.hero{align-items:flex-start}.count{font-size:11px}.count strong{font-size:20px}.grid{gap:8px}.service{min-height:72px;padding:9px}.service-name{font-size:13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
