<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4285f4">
<title>Google 服務啟動器｜Toby</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
:root{--ink:#202634;--muted:#687386;--bg:#f3f6fc;--line:#e7ebf3;--shadow:0 12px 28px rgba(41,57,91,.09)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;background:radial-gradient(ellipse at 5% 5%,#dce8ff 0,transparent 27rem),radial-gradient(ellipse at 96% 22%,#fff0c5 0,transparent 27rem),var(--bg)}
a{color:inherit}main{width:min(1080px,100%);margin:auto;padding:22px 22px 50px}
.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:17px;padding:10px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);text-decoration:none;font-size:14px;font-weight:750;box-shadow:0 5px 14px #2537540b;transition:.18s}.back:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.hero{position:relative;isolation:isolate;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:30px 32px;border-radius:28px;color:#fff;background:linear-gradient(115deg,#4285f4 0%,#7057e8 48%,#a852d2 100%);box-shadow:0 18px 38px #5b64cc37}.hero:before,.hero:after{content:"";position:absolute;z-index:-1;border-radius:50%;background:#ffffff18}.hero:before{width:230px;height:230px;right:-42px;top:-125px}.hero:after{width:150px;height:150px;right:23%;bottom:-120px}
.headline{display:flex;align-items:center;gap:17px}.google-mark{width:58px;height:58px;flex:0 0 58px;display:grid;place-items:center;border-radius:20px;background:#fff;color:#4285f4;font:bold 40px Arial,sans-serif;box-shadow:0 8px 20px #243c9b32}h1{margin:0;font-size:clamp(28px,5.5vw,46px);line-height:1.14;letter-spacing:.01em}.hero p{margin:9px 0 0;color:#eef3ff;font-size:15px}.count{flex:0 0 auto;padding:11px 15px;border:1px solid #ffffff45;border-radius:16px;background:#ffffff20;text-align:center;color:#fff;font-size:13px}.count strong{display:block;font-size:24px;line-height:1.2}
.search-wrap{margin:20px 0 16px}form{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 15px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 8px 22px #26364f0b}.search-icon{font-size:20px;color:#7c8493}input{min-width:0;flex:1;border:0;outline:0;background:transparent;padding:9px 4px;color:var(--ink);font:inherit;font-size:15px}button[type=submit]{border:0;border-radius:13px;padding:10px 16px;background:#202634;color:#fff;font:inherit;font-weight:750;cursor:pointer;transition:.18s}button[type=submit]:hover{background:#4285f4;transform:translateY(-1px)}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:22px 2px 12px}.section-head h2{margin:0;font-size:19px}.section-head span{color:var(--muted);font-size:13px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 13px;scrollbar-width:thin}.filter{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 13px;color:#566174;font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.16s}.filter:hover{transform:translateY(-1px);border-color:#9cbcff}.filter.active{background:#202634;color:#fff;border-color:#202634}.filter small{opacity:.75;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.service{--accent:#4285f4;--tint:#edf3ff;position:relative;isolation:isolate;display:flex;align-items:center;gap:13px;min-height:82px;padding:14px 48px 14px 14px;border:1px solid var(--line);border-radius:19px;background:#fff;color:var(--ink);text-decoration:none;box-shadow:0 5px 16px #2937520a;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s}.service:before{content:"";position:absolute;z-index:-1;width:88px;height:88px;right:-45px;bottom:-56px;border-radius:50%;background:var(--tint);transition:transform .25s}.service:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 36%,white)}.service:hover:before{transform:scale(1.6)}.service-wrap{position:relative;min-width:0}.help-btn{position:absolute;z-index:3;top:9px;right:9px;width:30px;height:30px;border:1px solid color-mix(in srgb,var(--accent) 24%,white);border-radius:50%;background:var(--tint);color:var(--accent);font:800 17px/1 system-ui,sans-serif;cursor:pointer;box-shadow:0 2px 6px #25375412;transition:transform .16s,background .16s}.help-btn:hover{transform:scale(1.1);background:white}.service-icon{display:grid;place-items:center;flex:0 0 46px;width:46px;height:46px;border-radius:15px;background:var(--tint);color:var(--accent);font-size:22px;font-weight:850}.service-name{flex:1;font-size:15px;font-weight:760;line-height:1.35}.arrow{color:#9aa2af;font-size:17px;transition:transform .2s}.service:hover .arrow{color:var(--accent);transform:translate(2px,-2px)}.empty{grid-column:1/-1;padding:36px;text-align:center;background:#fff;border:1px dashed #cbd3e2;border-radius:18px;color:var(--muted)}
.service-dialog{width:min(430px,calc(100% - 28px));border:1px solid var(--line);border-radius:24px;padding:24px;background:#fff;color:var(--ink);box-shadow:0 24px 70px #16244440}.service-dialog::backdrop{background:#17203388;backdrop-filter:blur(3px)}.dialog-top{display:flex;align-items:center;justify-content:space-between;gap:16px}.dialog-mark{width:52px;height:52px;display:grid;place-items:center;border-radius:17px;background:var(--dialog-tint,#eaf1ff);color:var(--dialog-accent,#4285f4);font-size:25px;font-weight:850}.dialog-close{width:36px;height:36px;border:0;border-radius:50%;background:#f1f3f7;color:#555e6e;font-size:23px;cursor:pointer}.dialog-category{display:inline-block;margin:18px 0 7px;padding:5px 10px;border-radius:999px;background:var(--dialog-tint,#eaf1ff);color:var(--dialog-accent,#4285f4);font-size:12px;font-weight:750}.service-dialog h2{margin:0;font-size:25px}.service-dialog p{color:#5d6677;line-height:1.7}.dialog-open{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:11px 15px;border-radius:13px;background:#202634;color:white;text-decoration:none;font-weight:750}.dialog-open:hover{background:#4285f4}\nfooter{text-align:center;color:var(--muted);margin-top:24px;font-size:12px;line-height:1.8}footer a{color:#4b6fd1}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:700px){main{padding:15px 14px 38px}.hero{padding:24px 20px;border-radius:23px}.headline{gap:13px}.google-mark{width:48px;height:48px;flex-basis:48px;border-radius:16px;font-size:34px}.hero p{font-size:13px}.count{padding:9px 11px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.service{min-height:75px;gap:10px;padding:11px 44px 11px 11px;border-radius:17px}.help-btn{top:8px;right:8px;width:28px;height:28px}.service-icon{width:40px;height:40px;flex-basis:40px;border-radius:13px;font-size:19px}.service-name{font-size:13px}}
@media(max-width:390px){.hero{align-items:flex-start}.count{font-size:11px}.count strong{font-size:20px}.grid{gap:8px}.service{min-height:72px;padding:9px 42px 9px 9px}.service-name{font-size:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
</head>
<body><main>
<a class="back" href="../"><span aria-hidden="true">←</span> 返回首頁</a>
<header class="hero"><div><div class="headline"><span class="google-mark" aria-hidden="true">G</span><div><h1>Google 服務啟動器</h1><p>依用途分類，快速找到適合的 Google 工具。</p></div></div></div><div class="count"><strong id="total">0</strong>個服務入口</div></header>
<div class="search-wrap"><form id="searchForm" role="search"><span class="search-icon" aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜尋服務名稱…" aria-label="搜尋 Google 服務"><button type="submit">搜尋服務</button></form></div>
<div class="section-head"><h2>✨ 探索 Google 工具</h2><span id="shown"></span></div>
<nav class="filters" id="filters" aria-label="服務分類"></nav>
<section class="grid" id="grid" aria-label="Google 服務"></section>
<footer>服務資訊參考 <a href="https://about.google/intl/zh-TW_tw/products/" target="_blank" rel="noopener">Google 官方產品清單</a>。部分服務可能依地區提供狀況而異。</footer>
<dialog class="service-dialog" id="serviceDialog" aria-labelledby="dialogTitle" aria-describedby="dialogDescription"><div class="dialog-top"><span class="dialog-mark" id="dialogMark" aria-hidden="true">?</span><button class="dialog-close" type="button" id="dialogClose" aria-label="關閉說明">×</button></div><span class="dialog-category" id="dialogCategory"></span><h2 id="dialogTitle"></h2><p id="dialogDescription"></p><a class="dialog-open" id="dialogOpen" target="_blank" rel="noopener">開啟服務 ↗</a></dialog>
</main>
<script>
const services=[["Google 搜尋","搜尋與 AI","G","https://www.google.com/","輸入關鍵字，搜尋網頁、圖片、影片、新聞與其他線上資訊。"],["Google 翻譯","搜尋與 AI","🌐","https://translate.google.com/","翻譯文字、文件、網站或語音，協助理解不同語言。"],["Google Lens","搜尋與 AI","⌕","https://lens.google.com/","用相機或圖片辨識物品、文字、地點，也能直接搜尋相似內容。"],["Gemini","搜尋與 AI","✦","https://gemini.google.com/","Google 的 AI 助理，可協助回答問題、整理想法、撰寫內容與探索主題。"],["NotebookLM","搜尋與 AI","📚","https://notebooklm.google.com/","以你提供的文件和來源為基礎，整理重點、回答問題並產生學習摘要。"],["Google 學術搜尋","搜尋與 AI","🎓","https://scholar.google.com/","搜尋學術論文、書籍與引用資料，方便查找研究文獻。"],["Google 搜尋趨勢","搜尋與 AI","↗","https://trends.google.com/","查看搜尋主題的熱度變化，探索不同地區與時間的搜尋趨勢。"],["Gmail","工作與學習","✉","https://mail.google.com/","收發電子郵件，並整理收件匣、標籤與聯絡往來。"],["Google 日曆","工作與學習","日","https://calendar.google.com/","建立行程、設定提醒，並與他人分享日曆或活動。"],["Google 聯絡人","工作與學習","👥","https://contacts.google.com/","集中管理聯絡資料，並在 Google 服務間同步使用。"],["Google Meet","工作與學習","🎥","https://meet.google.com/","進行視訊會議、遠距討論或線上課程。"],["Google Chat","工作與學習","💬","https://chat.google.com/","與個人或團隊即時傳訊息，並建立聊天室協作。"],["Google 文件","工作與學習","▤","https://docs.google.com/document/","建立、編輯及共同撰寫線上文字文件。"],["Google 試算表","工作與學習","▦","https://docs.google.com/spreadsheets/","整理資料、使用公式計算，並共同編輯線上表格。"],["Google 簡報","工作與學習","▧","https://docs.google.com/presentation/","製作簡報並與他人共同編輯或展示。"],["Google 表單","工作與學習","📝","https://docs.google.com/forms/","建立問卷、報名表與測驗，並收集和整理回覆。"],["Google Keep","工作與學習","💡","https://keep.google.com/","快速記錄文字、清單、圖片與提醒。"],["Google Tasks","工作與學習","✓","https://tasks.google.com/","建立待辦事項、設定期限，並搭配日曆安排工作。"],["Google Classroom","工作與學習","🏫","https://classroom.google.com/","管理課程、發布教材與作業，並查看學生繳交情況。"],["Google 協作平台","工作與學習","▣","https://sites.google.com/","不用寫程式即可建立並分享簡單的網站或專案頁面。"],["Blogger","工作與學習","✍","https://www.blogger.com/","建立部落格並發布文章，分享個人或專題內容。"],["Google 雲端硬碟","工作與學習","☁","https://drive.google.com/","儲存、整理及分享檔案，並存取雲端文件。"],["Google Vids","工作與學習","🎬","https://vids.google.com/","製作和協作編輯工作影片，適合簡報、教學與團隊溝通。"],["Google 地圖","生活與探索","📍","https://maps.google.com/","查找地點、規劃路線、查看交通狀況與周邊資訊。"],["Google 相簿","生活與探索","🖼","https://photos.google.com/","備份、整理、搜尋與分享照片和影片。"],["Google 新聞","生活與探索","📰","https://news.google.com/?hl=zh-TW&gl=TW&ceid=TW:zh-Hant","瀏覽並追蹤不同來源的新聞報導與主題。"],["Google 財經","生活與探索","💹","https://www.google.com/finance/","查看市場資訊、股票行情與財經新聞。"],["Google One","生活與探索","ⓖ","https://one.google.com/","管理 Google 雲端儲存空間及相關會員服務。"],["Google 旅遊","生活與探索","✈","https://www.google.com/travel/","搜尋航班、住宿與旅遊資訊，協助規劃旅程。"],["Google 地球","生活與探索","🌎","https://earth.google.com/web/","以地球儀、衛星影像與 3D 地圖探索各地環境。"],["Google Family Link","生活與探索","👨‍👩‍👧","https://families.google/familylink/","協助家長管理孩子的帳戶、裝置使用時間與內容設定。"],["Google Fit","生活與探索","♥","https://fit.google.com/","追蹤活動、運動與健康目標；可用功能依裝置和地區而異。"],["Google Home","生活與探索","⌂","https://home.google.com/","設定及管理相容的智慧家庭裝置與家庭自動化。"],["尋找我的裝置","生活與探索","⌖","https://www.google.com/android/find/","定位或管理已登入 Google 帳戶的 Android 裝置。"],["Google 訊息","生活與探索","▰","https://messages.google.com/web/","在網頁上連結手機，收發簡訊及支援的訊息內容。"],["Waze","生活與探索","🚙","https://www.waze.com/","查看即時路況、導航路線與使用者回報的道路資訊。"],["Google 錢包","生活與探索","▣","https://wallet.google.com/","管理支援的付款卡、票券與會員卡；功能依地區和裝置而異。"],["YouTube","影音與閱讀","▶","https://www.youtube.com/","觀看、搜尋與分享影片，也可追蹤喜愛的頻道。"],["YouTube Music","影音與閱讀","♫","https://music.youtube.com/","搜尋與播放歌曲、專輯、播放清單及音樂影片。"],["YouTube Kids","影音與閱讀","▶","https://www.youtubekids.com/","提供兒童使用的影片探索體驗，並提供家長控制選項。"],["Google Play","影音與閱讀","▷","https://play.google.com/store","瀏覽及取得 Android 應用程式、遊戲與數位內容。"],["Google Play 圖書","影音與閱讀","📖","https://play.google.com/books","購買或閱讀電子書與有聲書。"],["Google 藝術與文化","影音與閱讀","🎨","https://artsandculture.google.com/","探索博物館、藝術作品、文化主題與線上展覽。"],["Google Ads","開發與商務","📈","https://ads.google.com/","建立和管理廣告活動，觸及搜尋或其他 Google 廣告版位的受眾。"],["Google 商家檔案","開發與商務","🏪","https://www.google.com/business/","管理商家在 Google 搜尋與地圖上的公開資訊。"],["Google AdSense","開發與商務","$","https://adsense.google.com/","在符合資格的網站或內容中展示廣告並管理收益。"],["Google Analytics","開發與商務","◔","https://analytics.google.com/","分析網站或應用程式的訪客、流量來源與使用情形。"],["Google AdMob","開發與商務","📱","https://admob.google.com/","管理行動應用程式中的廣告與相關成效。"],["Google Tag Manager","開發與商務","🏷","https://tagmanager.google.com/","集中管理網站或應用程式的分析與行銷標籤。"],["Google Search Console","開發與商務","⌕","https://search.google.com/search-console/","查看網站在 Google 搜尋中的曝光、索引與技術狀況。"],["Google Fonts","開發與商務","Aa","https://fonts.google.com/","瀏覽並使用可應用於網站及設計的字型。"],["Google Cloud","開發與商務","☁","https://cloud.google.com/","使用 Google Cloud 的雲端運算、儲存與資料服務。"],["Firebase","開發與商務","🔥","https://firebase.google.com/","提供應用程式開發、資料儲存、驗證與分析等工具。"],["Google for Developers","開發與商務","\u003c/>","https://developers.google.com/","查找 Google 開發工具、API、文件與技術資源。"],["Google Ads Manager","開發與商務","▣","https://admanager.google.com/","管理廣告刊登、廣告庫存與收益相關作業。"],["Google Maps Platform","開發與商務","🗺","https://mapsplatform.google.com/","使用 Google 地圖相關 API 建置地圖、地點與路線功能。"],["Google Play 開發人員","開發與商務","▷","https://play.google.com/console/","透過 Play Console 管理 Android 應用程式、版本、商店頁面與成效。"]];
const cats=["全部",...new Set(services.map(s=>s[1]))];
const palette={"搜尋與 AI":["#7259e8","#f0edff"],"工作與學習":["#4285f4","#eaf1ff"],"生活與探索":["#22a06b","#e7f7ef"],"影音與閱讀":["#e34b65","#fff0f2"],"開發與商務":["#ed9d23","#fff5df"]};
let active="全部",query="";
const filters=document.getElementById("filters"),grid=document.getElementById("grid");
document.getElementById("total").textContent=services.length;
function drawFilters(){filters.innerHTML=cats.map(cat=>'<button class="filter '+(active===cat?'active':'')+'" type="button" data-cat="'+cat+'">'+(cat==="全部"?"🌈 ":"")+cat+' <small>'+ (cat==="全部"?services.length:services.filter(s=>s[1]===cat).length)+'</small></button>').join("");filters.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{active=b.dataset.cat;drawFilters();drawCards()}))}
function drawCards(){const found=services.map((s,index)=>({s,index})).filter(x=>(active==="全部"||x.s[1]===active)&&(x.s[0]+" "+x.s[1]).toLowerCase().includes(query));document.getElementById("shown").textContent="顯示 "+found.length+" / "+services.length+" 個入口";grid.innerHTML=found.length?found.map(x=>{const s=x.s,p=palette[s[1]]||["#4285f4","#eaf1ff"];return '<article class="service-wrap" style="--accent:'+p[0]+';--tint:'+p[1]+'"><a class="service" href="'+s[3]+'" target="_blank" rel="noopener"><span class="service-icon" aria-hidden="true">'+s[2]+'</span><span class="service-name">'+s[0]+'</span><span class="arrow" aria-hidden="true">↗</span></a><button class="help-btn" type="button" data-index="'+x.index+'" aria-label="查看 '+s[0]+' 的服務說明" title="服務說明">?</button></article>'}).join(""):'<div class="empty">沒有找到符合的服務，試試其他名稱或分類吧。</div>'}
grid.addEventListener("click",e=>{const button=e.target.closest(".help-btn");if(!button)return;const s=services[Number(button.dataset.index)],p=palette[s[1]]||["#4285f4","#eaf1ff"];const dialog=document.getElementById("serviceDialog");dialog.style.setProperty("--dialog-accent",p[0]);dialog.style.setProperty("--dialog-tint",p[1]);document.getElementById("dialogMark").textContent=s[2];document.getElementById("dialogCategory").textContent=s[1];document.getElementById("dialogTitle").textContent=s[0];document.getElementById("dialogDescription").textContent=s[4];const open=document.getElementById("dialogOpen");open.href=s[3];dialog.showModal()});
document.getElementById("dialogClose").addEventListener("click",()=>document.getElementById("serviceDialog").close());
document.getElementById("serviceDialog").addEventListener("click",e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
document.getElementById("search").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();drawCards()});
document.getElementById("searchForm").addEventListener("submit",e=>{e.preventDefault();drawCards()});
drawFilters();drawCards();
</script>
</body>
</html>
