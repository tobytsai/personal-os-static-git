const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const colors=["#f0b52e","#ed7862","#36a998","#8274df","#5595d6","#db739f"];
function renderFilters(){const n=document.getElementById("filters");n.innerHTML=categories.map(c=>'<button class="filter '+(active===c?"active":"")+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join("");n.querySelectorAll("button").forEach(b=>b.onclick=()=>{active=b.dataset.cat;renderFilters();renderAll()})}
function card(b,idx){const tone=colors[idx%colors.length],letter=Array.from(b.name.trim())[0]||"▦";return '<article class="board" style="--tone:'+tone+'"><a class="titlelink" href="'+esc(b.url)+'" target="_blank" rel="noopener noreferrer" data-open="'+esc(b.id)+'"><span class="boardicon">'+esc(letter)+'</span><h3 class="boardname">'+esc(b.name)+'</h3></a><div class="badges"><span class="badge">'+esc(b.category)+'</span>'+(b.archived?'<span class="badge archive">已封存</span>':'')+'</div><div class="boardfoot"><button class="why" data-id="'+esc(b.id)+'">？ 說明</button><span class="openhint">開啟 ↗</span><button class="star '+(favs.includes(b.id)?"on":"")+'" aria-label="'+(favs.includes(b.id)?"取消收藏":"加入收藏")+'" data-star="'+esc(b.id)+'">'+(favs.includes(b.id)?"★":"☆")+'</button></div></article>'}
function bind(container){container.querySelectorAll("[data-open]").forEach(a=>a.addEventListener("click",()=>{const id=a.dataset.open;recent=[id,...recent.filter(x=>x!==id)].slice(0,8);localStorage.setItem(recentKey,JSON.stringify(recent));setTimeout(renderSpecial,0)}));container.querySelectorAll("[data-star]").forEach(b=>b.onclick=()=>{const id=b.dataset.star;favs=favs.includes(id)?favs.filter(x=>x!==id):[id,...favs];localStorage.setItem(favKey,JSON.stringify(favs));renderAll()});container.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>showHelp(b.dataset.id))}
function renderInto(id,list,emptyId){const node=document.getElementById(id);node.innerHTML=list.map((b,i)=>card(b,i)).join("");document.getElementById(emptyId).style.display=list.length?"none":"block";bind(node)}
function renderSpecial(){const byId=new Map(boards.map(b=>[b.id,b]));renderInto("recentGrid",recent.map(id=>byId.get(id)).filter(Boolean),"recentEmpty");renderInto("favoritesGrid",favs.map(id=>byId.get(id)).filter(Boolean),"favoritesEmpty")}
function renderAll(){const filtered=boards.filter(b=>(active==="全部"||b.category===active)&&(!query||(b.name+" "+b.category).toLowerCase().includes(query.toLowerCase())));renderInto("allGrid",filtered,"allEmpty");document.getElementById("count").textContent=filtered.length+" / "+boards.length+" 個看板";document.getElementById("allTitle").textContent=active==="全部"?"🧭 全部看板":"🗂️ "+active;renderSpecial()}
function showHelp(id){const b=boards.find(x=>x.id===id);if(!b)return;document.getElementById("dialogTitle").textContent="？ "+b.name;document.getElementById("dialogBody").textContent=descriptions[b.category]+" 分類依看板名稱整理；點「開啟」前往 Trello。"+(b.archived?" 這個看板目前已封存。":"");document.getElementById("overlay").classList.add("show");document.getElementById("close").focus()}
document.getElementById("search").addEventListener("input",e=>{query=e.target.value;renderAll()});document.getElementById("close").onclick=()=>document.getElementById("overlay").classList.remove("show");document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")e.currentTarget.classList.remove("show")});document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("overlay").classList.remove("show")});renderFilters();renderAll();
</script><script src="../shared-nav.js?v=20261025-2" defer></script></body></html>
