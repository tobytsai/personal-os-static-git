<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>亮生活｜兒童 YouTube 啟動器</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f8fb;color:#253a50;font:16px system-ui,sans-serif}header{background:linear-gradient(120deg,#248da7,#6464b8);color:white;padding:24px max(18px,calc((100% - 1160px)/2))}header a{color:white}h1{font-size:30px;margin:12px 0 6px}header p{line-height:1.5}main{max-width:1160px;margin:auto;padding:20px}.panel{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 20px #24476d12;margin-bottom:16px}.bar{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;padding:11px;border:1px solid #c6dae4;border-radius:10px;background:#fff}input{flex:1;min-width:200px}select{min-width:180px}.muted{font-size:14px;color:#627681;line-height:1.6}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.filter{border-radius:999px;cursor:pointer;background:#f0f8fa;color:#23667b;padding:8px 14px}.filter[aria-pressed="true"]{background:#247e97;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:14px}.card{background:#fff;border:1px solid #dfebf0;border-radius:16px;overflow:hidden;box-shadow:0 4px 14px #29485b10}.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#e7f1f4}.body{padding:14px}.body h2{font-size:17px;line-height:1.45;margin:0 0 10px;overflow-wrap:anywhere}.tag{display:inline-block;background:#e8f6f0;color:#33765b;border-radius:999px;padding:4px 9px;font-size:13px}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.links a{background:#e7f3f9;color:#205f80;text-decoration:none;padding:8px 10px;border-radius:8px;font-size:14px}.links .watch{background:#dd4949;color:white}details{margin-top:10px}details summary{cursor:pointer;color:#286a84}details p{overflow-wrap:anywhere}.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin:22px}.pager button{cursor:pointer}.pager button:disabled{opacity:.45}.empty{padding:20px;color:#627681}@media(max-width:600px){main{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.body{padding:10px}.body h2{font-size:15px}select{width:100%}}
</style></head><body><header><a href="kids-youtube.html">← 返回兒童 YouTube 啟動器</a><h1>💡 亮生活</h1><p>探索人體與動物的有趣知識</p></header><main>
<section class="panel"><p class="muted">資料來自「蔡侯燁 → 亮生活」及亮生活 YouTube 頻道。頻道補充的卡片依標題分類並排列在前；影片內容及完整說明請參考來源。此頁資料為更新時的快照。</p><a href="https://airtable.com/apppZqeNsKgKw3DAv/tblMKiLWg3LaSzMcM/viwiJVv3TJcLjA9oK" target="_blank" rel="noopener">開啟 Airtable Grid view ↗</a></section>
<section class="panel"><div class="bar"><input id="search" type="search" placeholder="搜尋影片、主題或說明" aria-label="搜尋影片"><select id="category" aria-label="主題分類"><option value="">全部分類</option></select><select id="sourceFilter" aria-label="資料來源"><option value="">全部來源</option><option value="youtube">官方頻道補充</option><option value="airtable">Airtable 原有卡片</option></select></div><div class="filters" id="filters" role="group" aria-label="主題快速選擇"></div><p id="status" role="status" class="muted">正在載入影片…</p></section><div id="grid" class="grid"></div><div class="pager"><button id="prev">上一頁</button><span id="page"></span><button id="next">下一頁</button></div></main>
<script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let cards=[],filtered=[],page=0;const size=36;
function videoId(c){try{let u=new URL(c.url);if(!/(^|\.)youtube\.com$/.test(u.hostname))return '';let id=u.searchParams.get('v');return /^[\w-]{11}$/.test(id||'')?id:''}catch{return ''}}
function drawFilters(){const sel=$('category'),host=$('filters');host.replaceChildren();for(const opt of sel.options){let b=document.createElement('button');b.type='button';b.className='filter';b.textContent=opt.textContent;b.setAttribute('aria-pressed',String(opt.value===sel.value));b.onclick=()=>{sel.value=opt.value;refresh()};host.append(b)}}
function refresh(){let q=$('search').value.trim().toLowerCase(),cat=$('category').value,src=$('sourceFilter').value;filtered=cards.filter(c=>(!src||(c.origin||'airtable')===src)&&(!cat||c.category===cat)&&(!q||[c.title,c.category,c.excerpt].join(' ').toLowerCase().includes(q)));page=0;drawFilters();draw()}
function draw(){let max=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,max-1);$('status').textContent='顯示 '+filtered.length+' / '+cards.length+' 張影片卡片';$('grid').innerHTML=filtered.slice(page*size,(page+1)*size).map(c=>{let vid=videoId(c),source='https://airtable.com/apppZqeNsKgKw3DAv/tblMKiLWg3LaSzMcM/viwiJVv3TJcLjA9oK/'+c.id;return '<article class="card">'+(vid?'<img loading="lazy" src="https://i.ytimg.com/vi/'+vid+'/hqdefault.jpg" alt="" onerror="this.style.display=\'none\'">':'')+'<div class="body"><h2>'+esc(c.title)+'</h2><span class="tag">'+esc(c.category)+'</span>'+(c.origin==='youtube'?'<span class="tag">官方頻道補充</span>':'')+(c.duration?'<p class="muted">片長：'+esc(c.duration)+'</p>':'')+(c.excerpt?'<details><summary>影片介紹摘錄</summary><p class="muted">'+esc(c.excerpt)+'</p></details>':'')+(!vid?'<p class="muted">原始影片網址待確認，請查看 Airtable。</p>':'')+'<div class="links">'+(vid?'<a class="watch" href="https://www.youtube.com/watch?v='+encodeURIComponent(vid)+'" target="_blank" rel="noopener">▶ 觀看影片</a>':'')+(c.origin==='youtube'?'<a href="https://www.youtube.com/@brightside5192" target="_blank" rel="noopener">官方頻道 ↗</a>':'<a href="'+source+'" target="_blank" rel="noopener">Airtable ↗</a>')+'</div></div></article>'}).join('')||'<div class="empty">找不到符合的影片，試試其他關鍵字。</div>';$('page').textContent='第 '+(page+1)+' / '+max+' 頁';$('prev').disabled=page===0;$('next').disabled=page>=max-1}
$('prev').onclick=()=>{page--;draw();window.scrollTo(0,0)};$('next').onclick=()=>{page++;draw();window.scrollTo(0,0)};$('search').oninput=refresh;$('category').onchange=refresh;$('sourceFilter').onchange=refresh;
fetch('../data/kids-youtube/bright-life-cards.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{cards=data.slice().sort((a,b)=>(Number(b.origin==='youtube')-Number(a.origin==='youtube'))||(a.origin==='youtube'?0:a.category.localeCompare(b.category,'zh-Hant')||(Number(a.order)||9999)-(Number(b.order)||9999)));let counts=new Map();for(let c of cards)counts.set(c.category,(counts.get(c.category)||0)+1);for(let [name,count] of counts){let o=document.createElement('option');o.value=name;o.textContent=name+'（'+count+'）';$('category').append(o)}refresh()}).catch(()=>$('status').textContent='影片資料載入失敗，請稍後重新整理。');
</script><script src="../shared-nav.js?v=20261025-2" defer></script></body></html>
