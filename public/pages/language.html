grid.innerHTML=rows.map(x=>{let image=x.hasImage?'<div class="picture" role="img" aria-label="'+esc(x.name)+' 圖片" style="background-image:url(../assets/lingumi/'+Math.floor(x.i/50)+'.webp);background-position:'+((x.i%10)/9*100)+'% '+(Math.floor(x.i%50/10)/4*100)+'%"></div>':'';let airtable='https://airtable.com/apppZqeNsKgKw3DAv/tblBgpGpkfHGxOzPb/viwWEHILxYct1b6ca/'+x.id;let links=[['連結',x.link],['Jamboard',x.jamboard]].filter(a=>safe(a[1])).map(a=>'<a target="_blank" rel="noopener" href="'+esc(safe(a[1]))+'">'+a[0]+' ↗</a>').join('');return '<article class="card">'+image+'<div class="body"><h3>'+esc(x.name)+'</h3><span class="tag">'+esc(x.category||'未分類')+'</span>'+(x.stage?'<p class="meta">階段：'+esc(x.stage)+'</p>':'')+(x.lessons.length?'<p class="meta">課堂：'+esc(x.lessons.join('、'))+'</p>':'')+(x.notes?'<p class="meta">'+esc(x.notes)+'</p>':'')+'<div class="actions"><button type="button" data-say="'+x.i+'">🔊 聽發音</button><a target="_blank" rel="noopener" href="'+airtable+'">Airtable ↗</a>'+links+'</div></div></article>'}).join('')}
grid.addEventListener('click',e=>{let b=e.target.closest('[data-say]');if(!b)return;if(!('speechSynthesis'in window)){alert('此瀏覽器不支援朗讀。');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(data[Number(b.dataset.say)].name);u.lang='en-GB';speechSynthesis.speak(u)});
for(const el of [search,category,lesson])el.addEventListener('input',render);render();
