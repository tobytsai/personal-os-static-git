<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4eafa">
<meta name="description" content="以達利資料庫 Airtable artEmperor Grid view 整理的畫廊與展覽入口。">
<title>展覽啟動器｜Toby Personal OS</title>
<style>
:root{--ink:#31263d;--muted:#766b80;--line:#eadff0;--purple:#7449a5;--pink:#f1b6d4;--paper:#fffdfb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:radial-gradient(circle at 5% 8%,#ffe6b7 0 8rem,transparent 8.1rem),radial-gradient(circle at 96% 32%,#d8f1e7 0 10rem,transparent 10.1rem),linear-gradient(145deg,#f7effa,#fffdf9 56%,#f1f6fb)}
main{width:min(1200px,100%);margin:auto;padding:18px 20px 50px}.back{display:inline-flex;margin:0 0 14px;padding:9px 14px;border:1px solid #fff;border-radius:999px;background:#ffffffd9;color:#554661;text-decoration:none;font-size:13px;font-weight:850;box-shadow:0 5px 15px #35234012}
.hero{position:relative;isolation:isolate;overflow:hidden;padding:clamp(25px,5vw,44px);border-radius:30px;color:#fff;background:linear-gradient(118deg,#503575,#8050a9 54%,#ca6b9c);box-shadow:0 18px 42px #68418136}.hero:before,.hero:after{position:absolute;z-index:-1;content:"";border:2px solid #ffffff40;border-radius:50%}.hero:before{width:260px;height:260px;right:-45px;top:-135px}.hero:after{width:155px;height:155px;right:23%;bottom:-112px}.eyebrow{display:inline-block;padding:7px 11px;border:1px solid #ffffff66;border-radius:999px;background:#ffffff20;font-size:12px;font-weight:850;letter-spacing:.09em}h1{margin:14px 0 8px;font-size:clamp(34px,7vw,54px);line-height:1.13}.hero p{max-width:750px;margin:0;color:#f8effb;font-size:15px;line-height:1.8}.hero-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.hero-actions a{padding:9px 13px;border-radius:999px;background:#fff;color:#593c70;text-decoration:none;font-size:12px;font-weight:850}.stats{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}.stat{padding:9px 12px;border:1px solid #fff;border-radius:14px;background:#ffffffd9;color:#52425d;font-size:13px;font-weight:850}
.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) minmax(185px,260px) auto;gap:10px;margin:18px 0 13px}.search{position:relative}.search span{position:absolute;left:14px;top:50%;transform:translateY(-50%)}input,select{width:100%;height:46px;padding:0 14px;border:1px solid #e3d5eb;border-radius:14px;background:#fff;color:var(--ink);font:inherit;outline:none}input{padding-left:42px}input:focus,select:focus{border-color:#9363b8;box-shadow:0 0 0 3px #7449a51c}.toggle{border:1px solid #e3d5eb;border-radius:14px;background:#fff;color:#674383;padding:0 15px;font:800 13px system-ui;cursor:pointer;white-space:nowrap}.toggle[aria-pressed="true"]{background:#7449a5;color:#fff;border-color:#7449a5}.view-switch{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0 13px}.mode{padding:11px 16px;border:1px solid #e3d5eb;border-radius:14px;background:#fff;color:#674383;font:800 13px system-ui;cursor:pointer}.mode.active{background:#7449a5;color:#fff;border-color:#7449a5}.roster{margin:9px 0 12px;padding:9px 0;border-top:1px solid #eee5f2;color:#604875}.roster summary{font-size:12px;font-weight:850;cursor:pointer}.roster-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.relation-chip{display:inline-flex;padding:5px 8px;border:1px solid #e8def0;border-radius:999px;background:#faf6fc;color:#674383;font-size:11px;font-weight:750;text-decoration:none}.relation-chip:hover{background:#eee4f5}.no-link{color:#94899a;font-size:11px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:18px 3px 11px}.section-head h2{margin:0;font-size:20px}.hint{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:13px}.card{overflow:hidden;display:flex;flex-direction:column;min-width:0;border:1px solid #fff;border-radius:20px;background:#ffffffed;box-shadow:0 9px 24px #38264712;transition:transform .16s,box-shadow .16s}.card:hover{transform:translateY(-3px);box-shadow:0 15px 28px #3826471b}.cover{height:142px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#f5e5f0,#eeeafa 55%,#e6f4ef)}.cover img{width:100%;height:100%;object-fit:cover}.cover.logo img{width:min(76%,230px);height:100px;object-fit:contain}.cover .fallback{font-size:40px;opacity:.55}.body{display:flex;flex:1;flex-direction:column;padding:14px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.name{font-size:16px;font-weight:900;line-height:1.4;overflow-wrap:anywhere}.region{display:inline-block;margin-top:6px;padding:4px 8px;border-radius:999px;background:#f1e8f8;color:#674383;font-size:11px;font-weight:850}.star{flex:0 0 36px;width:36px;height:36px;border:0;border-radius:12px;background:#f5eff8;color:#8a7a91;font-size:20px;cursor:pointer}.star.active{background:#fff1c2;color:#d49305}.detail{margin:10px 0;color:#706579;font-size:12px;line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:58px}.meta{display:grid;gap:5px;margin:0 0 13px;color:#736a7b;font-size:11px;line-height:1.5}.meta a{color:#674383;text-decoration:none}.actions{display:flex;gap:7px;margin-top:auto}.actions a{flex:1;display:flex;align-items:center;justify-content:center;min-height:38px;padding:7px 6px;border-radius:11px;background:#7449a5;color:#fff;text-decoration:none;text-align:center;font-size:11px;font-weight:850}.actions a.secondary{background:#f3eaf7;color:#624079}.empty{grid-column:1/-1;padding:34px 18px;text-align:center;border:1px dashed #d6c8de;border-radius:17px;background:#ffffffa8;color:var(--muted)}footer{margin:24px 4px 0;color:var(--muted);font-size:11px;line-height:1.7}
@media(max-width:720px){main{padding:12px 13px 35px}.hero{border-radius:24px}.toolbar{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.toggle{min-height:44px}.grid{grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:9px}}
@media(max-width:440px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cover{height:108px}.body{padding:10px}.name{font-size:13px}.region{font-size:10px}.detail{font-size:11px;min-height:72px}.meta{font-size:10px}.actions{flex-direction:column}.actions a{min-height:34px}.star{width:32px;height:32px;flex-basis:32px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body><main>
<a class="back" href="../index.html">← 回到 Toby 首頁</a>
<header class="hero">
<span class="eyebrow">ARTEMPEROR · GALLERY & EXHIBITIONS</span>
<h1>展覽啟動器</h1>
<p>瀏覽達利資料庫的畫廊與藝術家資料。可從畫廊查看代理藝術家，也可從藝術家查看代理畫廊，並以地區或關鍵字搜尋。</p>
<div class="hero-actions"><a href="https://artemperor.tw/" target="_blank" rel="noopener noreferrer">↗ 前往 artEmperor</a><a href="../index.html">⌂ 啟動器首頁</a></div>
</header>
<div class="stats"><span class="stat">🖼️ 畫廊 <b id="galleryTotal">載入中…</b> 家</span><span class="stat">🎨 藝術家 <b id="artistTotal">載入中…</b> 筆</span><span class="stat">🔗 代理連結畫廊 <b id="agencyGalleryTotal">—</b> 家</span><span class="stat">✦ 收藏會保存在此瀏覽器</span></div>
<div class="view-switch" role="tablist" aria-label="瀏覽方式"><button class="mode active" id="galleryMode" type="button" role="tab" aria-selected="true">🏛️ 畫廊 → 藝術家</button><button class="mode" id="artistMode" type="button" role="tab" aria-selected="false">🎨 藝術家 → 代理畫廊</button></div>
<div class="toolbar">
<label class="search"><span>⌕</span><input id="query" type="search" placeholder="搜尋畫廊、地區、地址或介紹" aria-label="搜尋畫廊與藝術家"></label>
<select id="filterSelect" aria-label="依地區篩選"><option value="">全部地區</option></select>
<button class="toggle" id="favoritesOnly" type="button" aria-pressed="false">☆ 只看收藏</button>
</div>
<section>
<div class="section-head"><h2 id="sectionTitle">畫廊與代理藝術家</h2><span class="hint" id="resultCount">讀取資料中…</span></div>
<div class="grid" id="grid" aria-live="polite"><div class="empty">正在讀取畫廊資料…</div></div>
</section>
<footer>資料來源：Airtable「達利」資料庫「藝術畫廊」及「畫家」表（畫家 Grid view）。代理關係依「代理畫廊」連結整理；未連結者不會顯示代理資訊。</footer>
</main>
<script src="../shared-nav.js?v=20261025-2" defer></script>
<script>
const grid=document.getElementById("grid"),query=document.getElementById("query"),filterSelect=document.getElementById("filterSelect"),resultCount=document.getElementById("resultCount"),favoritesOnly=document.getElementById("favoritesOnly"),sectionTitle=document.getElementById("sectionTitle");
const galleryMode=document.getElementById("galleryMode"),artistMode=document.getElementById("artistMode");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const cleanUrl=s=>{if(!s)return"";let u=String(s).trim();if(!/^https?:\/\//i.test(u))u="https://"+u;try{const x=new URL(u);return x.protocol==="https:"||x.protocol==="http:"?x.href:""}catch{return""}};
const getFavs=()=>{try{return JSON.parse(localStorage.getItem("exhibitionLauncherFavs")||"[]")}catch{return[]}};
let galleries=[],artists=[],mode="gallery",onlyFavs=false,focusGalleryId="",focusArtistId="";
function regionName(value){return String(value||"地區未標示").trim()||"地區未標示"}
function favKey(item){return mode==="gallery"?"gallery:"+item.id:"artist:"+item.id}
function isFav(item){const list=getFavs();return list.includes(favKey(item))||(mode==="gallery"&&list.includes(item.name))}
function actionLink(url,label,secondary){const u=cleanUrl(url);return u?'<a class="'+(secondary?"secondary":"")+'" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+label+'</a>':""}
function makeGalleryCard(item){
 const name=esc(item.name),city=esc(regionName(item.city)),img=cleanUrl(item.image),fav=isFav(item);
 const phone=String(item.phone||"").trim(),tel=phone.replace(/[^+\d]/g,""),address=String(item.address||"").trim(),hours=String(item.hours||"").trim(),intro=String(item.intro||"").replace(/\s+/g," ").trim();
 const meta=[];
 if(address)meta.push("📍 "+esc(address));
 if(hours)meta.push("◷ "+esc(hours));
 if(phone)meta.push('☎️ <a href="tel:'+esc(tel)+'">'+esc(phone)+'</a>');
 const roster=(item.artists||[]).length?'<details class="roster"><summary>代理藝術家（'+item.artists.length+'）</summary><div class="roster-list">'+item.artists.map(a=>'<a class="relation-chip" href="#" data-open-artist="'+esc(a.id)+'">'+esc(a.name)+'</a>').join("")+'</div></details>':'<div class="no-link roster">畫家表尚未連結代理藝術家</div>';
 const links=actionLink(item.exhibitions,"✦ 展覽資訊",false)+actionLink(item.profile,"線上展廳",true)+actionLink(item.website,"官網",true)+actionLink(item.map,"Google 地圖",true)+actionLink(item.facebook,"Facebook",true);
 return '<article class="card"><div class="cover '+(img&&!item.cover?"logo":"")+'">'+(img?'<img src="'+esc(img)+'" alt="'+name+'" loading="lazy" onerror="this.parentElement.innerHTML=\'<span class=&quot;fallback&quot;>✦</span>\'">':'<span class="fallback">✦</span>')+'</div><div class="body"><div class="top"><div><div class="name">'+name+'</div><span class="region">'+city+'</span></div><button class="star '+(fav?"active":"")+'" type="button" aria-label="'+(fav?"取消收藏":"加入收藏")+'" data-fav-key="'+esc(favKey(item))+'" data-fav-name="'+name+'">'+(fav?"★":"☆")+'</button></div><p class="detail">'+(intro?esc(intro):"查看畫廊的線上展廳與代理藝術家。")+'</p>'+(meta.length?'<div class="meta">'+meta.join("<br>")+'</div>':'')+roster+'<div class="actions">'+links+'</div></div></article>';
}
function makeArtistCard(item){
 const name=esc(item.name),img=cleanUrl(item.image),fav=isFav(item);
 const reps=item.galleries||[];
 const galleryLinks=reps.length?reps.map(g=>'<a class="relation-chip" href="#" data-open-gallery="'+esc(g.id)+'">'+esc(g.name)+'</a>').join(""):'<span class="no-link">畫家表尚未連結代理畫廊</span>';
 const links=actionLink(item.profile,"線上展廳",false)+actionLink(item.website,"官網",true);
 return '<article class="card"><div class="cover">'+(img?'<img src="'+esc(img)+'" alt="'+name+'" loading="lazy" onerror="this.parentElement.innerHTML=\'<span class=&quot;fallback&quot;>✦</span>\'">':'<span class="fallback">🎨</span>')+'</div><div class="body"><div class="top"><div><div class="name">'+name+'</div><span class="region">藝術家</span></div><button class="star '+(fav?"active":"")+'" type="button" aria-label="'+(fav?"取消收藏":"加入收藏")+'" data-fav-key="'+esc(favKey(item))+'" data-fav-name="'+name+'">'+(fav?"★":"☆")+'</button></div><div class="roster"><strong>代理畫廊（'+reps.length+'）</strong><div class="roster-list">'+galleryLinks+'</div></div><div class="actions">'+links+'</div></div></article>';
}
function updateFilterOptions(){
 if(mode==="gallery"){
  const regions=[...new Set(galleries.map(x=>regionName(x.city)))].sort((a,b)=>a.localeCompare(b,"zh-Hant"));
  filterSelect.setAttribute("aria-label","依地區篩選");
  filterSelect.innerHTML='<option value="">全部地區（'+galleries.length+'）</option>'+regions.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join("");
  query.placeholder="搜尋畫廊、地區、地址或介紹";
  sectionTitle.textContent="畫廊與代理藝術家";
 }else{
  const counts={};artists.forEach(a=>(a.galleries||[]).forEach(g=>counts[g.name]=(counts[g.name]||0)+1));
  const names=Object.keys(counts).sort((a,b)=>a.localeCompare(b,"zh-Hant"));
  filterSelect.setAttribute("aria-label","依代理畫廊篩選");
  filterSelect.innerHTML='<option value="">全部藝術家（'+artists.length+'）</option>'+names.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'（'+counts[n]+'）</option>').join("");
  query.placeholder="搜尋藝術家或代理畫廊";
  sectionTitle.textContent="藝術家與代理畫廊";
 }
}
function render(){
 const term=query.value.trim().toLocaleLowerCase(),selected=filterSelect.value,favs=getFavs();
 const items=mode==="gallery"?galleries:artists;
 const filtered=items.filter(item=>{
  const related=mode==="gallery"?(item.artists||[]).map(a=>a.name).join(" "):(item.galleries||[]).map(g=>g.name).join(" ");
  const hay=mode==="gallery"?[item.name,item.city,item.address,item.intro,item.hours,related].join(" ").toLocaleLowerCase():[item.name,related].join(" ").toLocaleLowerCase();
  const relationMatch=!selected||(mode==="gallery"?regionName(item.city)===selected:(item.galleries||[]).some(g=>g.name===selected));
  const focusMatch=mode==="gallery"?(!focusGalleryId||item.id===focusGalleryId):(!focusArtistId||item.id===focusArtistId);
  return (!term||hay.includes(term))&&relationMatch&&(!onlyFavs||isFav(item))&&focusMatch;
 });
 resultCount.textContent="顯示 "+filtered.length+" / "+items.length+" 筆"+(mode==="gallery"?"畫廊":"藝術家");
 grid.innerHTML=filtered.length?filtered.map(mode==="gallery"?makeGalleryCard:makeArtistCard).join(""):'<div class="empty">沒有符合條件的資料，請調整篩選或搜尋文字。</div>';
 grid.querySelectorAll("[data-fav-key]").forEach(btn=>btn.addEventListener("click",()=>{
  const key=btn.dataset.favKey,name=btn.dataset.favName,list=getFavs(),next=list.includes(key)?list.filter(x=>x!==key):[...list,key];
  if(mode==="gallery"&&list.includes(name)&&!list.includes(key))next.push(key);
  localStorage.setItem("exhibitionLauncherFavs",JSON.stringify(next));render();
 }));
 grid.querySelectorAll("[data-open-artist]").forEach(link=>link.addEventListener("click",event=>{
  event.preventDefault();const id=link.dataset.openArtist;if(!artists.some(a=>a.id===id))return;
  focusArtistId=id;focusGalleryId="";query.value="";filterSelect.value="";setMode("artist");
 }));
 grid.querySelectorAll("[data-open-gallery]").forEach(link=>link.addEventListener("click",event=>{
  event.preventDefault();const id=link.dataset.openGallery;if(!galleries.some(g=>g.id===id))return;
  focusGalleryId=id;focusArtistId="";query.value="";filterSelect.value="";setMode("gallery");
 }));
}
function setMode(next){
 mode=next;focusGalleryId="";focusArtistId="";
 galleryMode.classList.toggle("active",mode==="gallery");artistMode.classList.toggle("active",mode==="artist");
 galleryMode.setAttribute("aria-selected",String(mode==="gallery"));artistMode.setAttribute("aria-selected",String(mode==="artist"));
 favoritesOnly.setAttribute("aria-pressed","false");favoritesOnly.textContent="☆ 只看收藏";onlyFavs=false;
 updateFilterOptions();render();
}
galleryMode.addEventListener("click",()=>setMode("gallery"));artistMode.addEventListener("click",()=>setMode("artist"));
query.addEventListener("input",()=>{focusGalleryId="";focusArtistId="";render()});
filterSelect.addEventListener("change",()=>{focusGalleryId="";focusArtistId="";render()});
favoritesOnly.addEventListener("click",()=>{onlyFavs=!onlyFavs;favoritesOnly.setAttribute("aria-pressed",String(onlyFavs));favoritesOnly.textContent=onlyFavs?"★ 顯示全部":"☆ 只看收藏";render()});
Promise.all([fetch("../data/artemperor-gallery-table.json"),fetch("../data/artemperor-artists.json")]).then(rs=>{
 if(rs.some(r=>!r.ok))throw new Error("data");
 return Promise.all(rs.map(r=>r.json()));
}).then(data=>{
 galleries=data[0];artists=data[1];
 document.getElementById("galleryTotal").textContent=galleries.length;
 document.getElementById("artistTotal").textContent=artists.length;
 document.getElementById("agencyGalleryTotal").textContent=galleries.filter(g=>(g.artists||[]).length).length;
 updateFilterOptions();render();
}).catch(()=>{
 document.getElementById("galleryTotal").textContent="—";document.getElementById("artistTotal").textContent="—";document.getElementById("agencyGalleryTotal").textContent="—";resultCount.textContent="無法載入資料";grid.innerHTML='<div class="empty">畫廊或藝術家資料目前無法載入，請稍後重新整理。</div>';
});
</script>
</body></html>
