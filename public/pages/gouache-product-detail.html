<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>產品資訊｜井象岩繪具</title><style>
body{margin:0;background:#f7f3ed;color:#362b28;font-family:system-ui,sans-serif;line-height:1.7}header,main{max-width:1100px;margin:auto;padding:24px}h1{margin:12px 0}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.gallery a:first-child{grid-column:span 2;grid-row:span 2}.gallery a{display:block;min-width:0}.gallery img{width:100%;display:block;border-radius:12px}.missing{padding:20px;background:#fff;border-radius:12px}.info{background:white;padding:22px;border-radius:14px;margin-top:20px}.info p{overflow-wrap:anywhere}@media(max-width:650px){.gallery{grid-template-columns:repeat(2,1fr)}.gallery a:first-child{grid-column:span 2;grid-row:auto}}
</style></head><body><header><a href="gouache-products.html">← 返回膠彩產品</a><h1 id="title">載入產品資料中…</h1><p id="summary"></p></header><main><section class="gallery" id="gallery" aria-label="產品圖片"></section><section class="info"><h2>產品資訊</h2><div id="facts"></div><p id="note">圖片沿用試算表原圖，圖中文字可能仍顯示原名；點擊圖片可查看原尺寸。顏色以實品為準。</p><p id="links"></p></section></main><script>
(async()=>{const $=id=>document.getElementById(id);const row=new URLSearchParams(location.search).get('row');if(!/^\d+$/.test(row||''))throw Error('找不到指定的產品');const res=await fetch('../data/gouache/products.json?v=20261105-green9');if(!res.ok)throw Error('產品資料載入失敗');const cards=await res.json();const c=cards.find(x=>String(x.row)===row);if(!c)throw Error('找不到指定的產品');const n=String(c.newName||c.name||'').trim(),raw=String(c.spec||'').trim(),number=/^(\d+)號?$/.exec(raw),label=number?number[1]+'號':(raw==='未標示'?'':raw),grades={'5':'粗目','7':'中目','9':'中目','10':'細目','11':'細目','12':'細目'},grade=number?grades[number[1]]:'',spec=grade?grade+' #'+number[1]+'號':label,title=n+label;document.title=title+'｜井象岩繪具';$('title').textContent=title;$('summary').textContent=['井象岩繪具',c.category,spec,c.weight].filter(Boolean).join(' · ');if(Array.isArray(c.thumbnailImages))$('note').textContent='新版產品圖片，點擊可查看原尺寸。顏色以實品為準。';if(row==='7')$('note').textContent='新版產品圖片，點擊可查看原尺寸。顏色以實品為準。';if(row==='6')$('note').textContent='新版產品圖片，點擊可查看原尺寸。顏色以實品為準。';if(row==='5')$('note').textContent='新版產品圖片，點擊可查看原尺寸。顏色以實品為準。';if(row==='4')$('note').textContent='新版產品圖片，點擊可查看原尺寸。顏色以實品為準。';if(row==='3')$('note').textContent='新版產品圖片，點擊可查看原尺寸。顏色以實品為準。';const facts=[['產品名稱',title],['原名',c.name],['規格',spec||'未標示'],['標示重量',c.weight||'未標示'],['分類',c.category]];for(const [k,v] of facts){const p=document.createElement('p');p.textContent=k+'：'+v;$('facts').append(p)}let images=Array.isArray(c.images)?c.images:[];for(let i=0;i<images.length;i++){try{let u=new URL(images[i]);if(u.protocol!=='https:'||u.hostname!=='drive.google.com')continue;let match=u.pathname.match(/^\/file\/d\/([\w-]+)\//);if(!match)continue;let a=document.createElement('a');a.href=u.href;a.target='_blank';a.rel='noopener';let img=document.createElement('img');img.src=(Array.isArray(c.thumbnailImages)&&c.thumbnailImages[i])?c.thumbnailImages[i]:row==='7'?'../assets/gouache/raspberry-red-12-new-'+(i+1)+'.jpg':row==='3'?'../assets/gouache/raspberry-red-7-new-'+(i+1)+'.jpg':row==='4'?'../assets/gouache/raspberry-red-9-'+(i+1)+'.webp':row==='5'?'../assets/gouache/raspberry-red-10-'+(i+1)+'.webp':row==='6'?'../assets/gouache/raspberry-red-11-'+(i+1)+'.webp':'https://drive.google.com/thumbnail?id='+encodeURIComponent(match[1])+'&sz=w1000';img.alt=title+'產品圖片 '+(i+1);img.loading=i?'lazy':'eager';img.onerror=()=>{img.remove();let p=document.createElement('span');p.className='missing';p.textContent='開啟產品圖片 '+(i+1)+' ↗';a.append(p)};a.append(img);$('gallery').append(a)}catch{}}if(!$('gallery').children.length){$('note').textContent='此產品目前沒有圖片連結。顏色以實品為準。'}let original=c.previousHtmlUrl||c.htmlUrl;if(original){try{let u=new URL(original);if(u.protocol==='https:'&&u.hostname==='jingxiang-products-2026-08.pages.dev'){let a=document.createElement('a');a.href=u.href;a.target='_blank';a.rel='noopener';a.textContent='查看原產品網頁 ↗';$('links').append(a)}}catch{}}})().catch(e=>{document.getElementById('title').textContent=e.message;document.getElementById('note').textContent='請回到產品列表重試。'});
</script></body></html>
