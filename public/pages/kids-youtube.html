<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>兒童 YouTube 啟動器</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#253a50;background:#f3f8fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#257da3,#585fbd);color:white;padding:24px max(18px,calc((100% - 1160px)/2))}header a{color:white}h1{font-size:30px;margin:12px 0 6px}header p{margin:5px 0;line-height:1.6}main{max-width:1160px;margin:auto;padding:20px}.panel{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 20px #24476d12;margin-bottom:16px}.bar{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;padding:11px;border:1px solid #c6dae4;border-radius:10px;background:#fff}input{flex:1;min-width:200px}select{min-width:180px}.crumb{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#e9f5fb;color:#236886;padding:7px 12px;border-radius:99px;font-weight:bold}.muted{font-size:14px;color:#627681;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:14px}.card{background:#fff;border:1px solid #dfebf0;border-radius:16px;overflow:hidden;box-shadow:0 4px 14px #29485b10}.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#e7f1f4}.body{padding:14px}.body h2{font-size:17px;line-height:1.45;margin:0 0 10px;overflow-wrap:anywhere}.tag{display:inline-block;background:#e8f6f0;color:#33765b;border-radius:999px;padding:4px 9px;font-size:13px}.description{white-space:pre-wrap;overflow-wrap:anywhere}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.links a{background:#e7f3f9;color:#205f80;text-decoration:none;padding:8px 10px;border-radius:8px;font-size:14px}.links .watch{background:#dd4949;color:white}.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin:22px}.pager button{cursor:pointer}.pager button:disabled{opacity:.45}.empty{padding:20px;color:#627681}@media(max-width:600px){main{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.body{padding:10px}.body h2{font-size:15px}.links a{font-size:13px}select{width:100%}}
</style></head><body><header><a href="../index.html">← 返回啟動器首頁</a><h1>🧸 兒童 YouTube 啟動器</h1><p>一起探索有趣的科學問題與生活知識</p></header><main>
<section class="panel"><div class="crumb"><span class="pill">兒童 YouTube</span><span class="pill">🔬 aumsum</span><a class="pill" href="kids-octonauts.html" style="text-decoration:none">🐙 Octonauts 海底小縱隊 →</a><a class="pill" href="kids-bright-life.html" style="text-decoration:none">💡 亮生活 →</a></div><p class="muted">依「蔡侯燁 → aumsum」資料表整理。影片內容與網址來自原始紀錄，分類未填的影片放在「尚未分類」；這是建立時的資料快照。</p><a href="https://airtable.com/apppZqeNsKgKw3DAv/tblibZt5gr3cR4sL5/viwNXE4KBfEeMBOoy" target="_blank" rel="noopener">開啟 Airtable Grid view ↗</a></section>
<section class="panel"><div class="bar"><input id="search" type="search" placeholder="搜尋主題、影片或說明" aria-label="搜尋影片"><select id="category" aria-label="主題分類"><option value="">全部分類</option></select></div><p id="status" role="status" class="muted">正在載入影片…</p></section><div id="grid" class="grid"></div><div class="pager"><button id="prev">上一頁</button><span id="page"></span><button id="next">下一頁</button></div></main>
<script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let cards=[],filtered=[],page=0;const size=36;
function youtubeId(c){try{let u=new URL(c.url.replace(/[\u200B-\u200D\uFEFF]/g,''));if(!/(^|\.)youtube\.com$/.test(u.hostname))return '';let id=u.pathname.startsWith('/shorts/')?u.pathname.split('/')[2]:u.searchParams.get('v');return /^[\w-]{11}$/.test(id||'')?id:''}catch{return ''}}
function refresh(){let q=$('search').value.trim().toLowerCase(),cat=$('category').value;filtered=cards.filter(c=>(!cat||(c.category||'尚未分類')===cat)&&(!q||[c.title,c.description,c.category,...c.subtopics].join(' ').toLowerCase().includes(q)));page=0;draw()}
function draw(){let max=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,max-1);$('status').textContent='顯示 '+filtered.length+' / '+cards.length+' 張影片卡片';$('grid').innerHTML=filtered.slice(page*size,(page+1)*size).map(c=>{let vid=youtubeId(c),source='https://airtable.com/apppZqeNsKgKw3DAv/tblibZt5gr3cR4sL5/viwNXE4KBfEeMBOoy/'+c.id;return '<article class="card">'+(vid?'<img loading="lazy" src="https://i.ytimg.com/vi/'+vid+'/hqdefault.jpg" alt="" onerror="this.style.display=\'none\'">':'')+'<div class="body"><h2>'+esc(c.title)+'</h2><span class="tag">'+esc(c.category||'尚未分類')+'</span>'+(c.subtopics.length?'<p class="muted">次主題：'+esc(c.subtopics.join('、'))+'</p>':'')+(c.description?'<p class="muted description">'+esc(c.description)+'</p>':'')+(!vid?'<p class="muted">原始影片網址待確認，請查看 Airtable。</p>':'')+'<div class="links">'+(vid?'<a class="watch" href="https://www.youtube.com/watch?v='+encodeURIComponent(vid)+'" target="_blank" rel="noopener">▶ 觀看影片</a>':'')+'<a href="'+source+'" target="_blank" rel="noopener">Airtable ↗</a></div></div></article>'}).join('')||'<div class="empty">找不到符合的影片，試試其他關鍵字。</div>';$('page').textContent='第 '+(page+1)+' / '+max+' 頁';$('prev').disabled=page===0;$('next').disabled=page>=max-1}
$('prev').onclick=()=>{page--;draw();window.scrollTo(0,0)};$('next').onclick=()=>{page++;draw();window.scrollTo(0,0)};$('search').oninput=refresh;$('category').onchange=refresh;
fetch('../data/kids-youtube/aumsum-cards.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{cards=data;let counts=new Map();for(let c of cards){let k=c.category||'尚未分類';counts.set(k,(counts.get(k)||0)+1)}for(let [name,count] of [...counts].sort((a,b)=>a[0]==='尚未分類'?1:b[0]==='尚未分類'?-1:a[0].localeCompare(b[0],'zh-Hant'))){let o=document.createElement('option');o.value=name;o.textContent=name+'（'+count+'）';$('category').append(o)}refresh()}).catch(()=>$('status').textContent='影片資料載入失敗，請稍後重新整理。');
</script><script src="../shared-nav.js?v=20261025-2" defer></script></body></html>
