from around Taiwan, In 2015, the Museum was opened. It has 1000 old tiles.","wiki":"","attachments":["PXL_20211120_061401459.jpeg"]},{"id":"recZm5kbGxuPHYqZN","name":"紅毛井","notes":"紅毛井\n紅毛井(蘭井)為嘉義市內留存最久的古蹟, 乃荷蘭人所開鑿。目前所見之水泥井圈為近代 改建之圓井,荷蘭時期原井外觀、材質尚待考\n證。","wiki":"https://zh.wikipedia.org/wiki/%E7%B4%85%E6%AF%9B%E4%BA%95_%28%E5%98%89%E7%BE%A9%E5%B8%82%29","attachments":["PXL_20211120_051729130.jpeg"]},{"id":"recafP4eKsigBma45","name":"花旗松","notes":"花旗松\nPseudotsuga menziesii\n產地\n原產於美國西北海岸地區海平面至 海拔2000公尺區域,目前於英國、 紐西蘭與澳洲等地亦有人工造林 木紋緊密,邊材呈淡黃色,心材為\n淡紅色,分界明顯,橫切面可看到\n顏色\n香氣\n特性\n波浪狀年輪\n有淡香氣\n材質堅韌、富有彈力,保存期限 長,固定力極佳,硬度及抗磨損性 皆高\n常作為建築的結構材,可用於戶外 或海上構造物;也常應用於景觀、 橋樑等用途","wiki":"","attachments":["PXL_20211120_055312869.jpeg","PXL_20211120_055348806.jpeg"]},{"id":"recalDzLw3qE8hzL7","name":"生態研究 Ecology Research","notes":"生態研究 Ecology Research\nCIC 嘉義市大部分土地已都市化,自然生態景觀保留在公園 綠地與城市邊緣郊區、農田,約佔市地5.26%的面積。 植物林相多屬於亞熱帶闊葉林,嘉義植物園可見到大量 的熱帶樹種,為人工栽培。動物的部分,在蘭潭水庫 掌溪區域可見到水鳥分佈;公園綠地則可以見到已經 適應人工環境的松鼠、領角鴞、黑冠麻鷺等,偶爾聽聞 臺灣獼猴迷途進入市區。而以「諸羅」為名的樹蛙,則 是最具代表性的動物。\nThe majority of land in Chiayi has been urbanized, while natural ecological landscapes retained in park green areas, suburbs and farmland makes up approximately 5.26% of the city. Forests are mostly composed of subtropical broad-leaved trees. At Lantan Reservoir and the Bazhang River area, scattered waterbirds can be seen; in the green park areas, squirrels, collared scops owls and Malayan night herons have adapted to the manmade environment. The animal most associated with the area is the farmland green treefrog, known as the \"Jhuluo tree frog\"","wiki":"","attachments":["PXL_20211120_052432336.jpeg"]},{"id":"recbDr02SrIg1qCJ4","name":"西門長老教會 禮拜堂","notes":"西門長老教會 禮拜堂\nXimen Presbyterian Church\n禮拜堂完工於昭和16年(1941),原屬於「日本基督教團嘉 義教會」,信徒多為日本人。主體建築形式為東洋風格之木 構建築,屋頂為日本黑瓦砌成的切妻造型式:壁面基座為磚 造,上為編竹夾泥牆,外層鋪設雨淋板。屋架、牆身、窗框 等為珍貴的阿里山檜木製成,結構迄今依然堅固完整。現今 為臺灣基督長老教會嘉義中會西門教會,民國94年(2005) 公告為市定古蹟。\nThe Ximen Presbyterian Church was completed in 1941. The main building is a Japanese style wooden building, and the roof is a Japanese kirizuma-zukuri style gable roof with black roof tiles. The building's frame, walls and window frames are made of precious Alishan cypress. Now it is Chiayi Ximen Church of the Presbyterian Church in Taiwan, and in 2005 it was declared a historical site.","wiki":"","attachments":["PXL_20211120_054350868.jpeg"]},{"id":"recbookyXd67Bm2pS","name":"日檜(日本扁柏) Chamaecyparis obtusa","notes":"日檜(日本扁柏) Chamaecyparis obtusa\n產地\n產於日本本州福島縣以南、四國\n地區、九州屋久島為止,分布於\n海拔1300~2800公尺\n顏色\n香氣\n特性\n心材為帶黃色調的白色,邊材則 偏白帶粉白色條紋,色澤高雅、\n年輪窄細\n香氣濃郁\n耐久性佳、耐水性強,含油份,\n裁切後強度會逐漸增加,並具有 韌性\n常作為建材、泡澡桶、木雕等\n用途","wiki":"","attachments":["PXL_20211120_055404735.jpeg","PXL_20211120_055408657.jpeg"]},{"id":"recc1cHdPtUCpCf1w","name":"臺灣相思樹","notes":"臺灣相思樹\n【學名】 Acacia confusa | 豆科金合歡屬|闊葉樹 【通稱】Formosa Acacia\n樹高達10~20公尺、直徑約1公尺,樹皮呈灰白色。由於根系抓地 力強,耐風且抗旱,因此常作防風林或保護水土之用。由於相思木 製成炭,燃燒時所產生的熱能,相較其他樹種多、煙不刺激眼睛, 過去常作為薪碳材(註)。生長迅速,材質堅重且耐摩擦,心材呈焦 茶色。原產於恆春半島,為臺灣原生種。在臺灣低海拔山區、丘陵 地普遍可見。\n註薪炭材:以提供燃料為主要目的的木材。","wiki":"","attachments":["PXL_20211120_060217668.jpeg"]},{"id":"recc4bKSwKejRw0WV","name":"眼科 Ophthalmology","notes":"眼科 Ophthalmology\n日治時期,嘉義市曾有柯眼科、周眼科、振山眼科、嘉 義眼科等。劉傳來於大正12 年(1923)畢業於臺北醫 學專門學校,兩年後進入日本醫學專門學校進修,隔年 返臺開設「振山眼科」醫院,擅長眼科手術。周再郡昭 和6年(1931)畢業於臺北醫學專門學校後,於臺北赤 十字病院(今國立臺灣大學附屬醫院)鑽研臨床眼科數 年後,返回嘉義開設「周眼科」醫院,對於砂眼防治特 別專長。林崑泉畢業於東京昭和醫學專門學校,昭和11 年(1936)開設「嘉義眼科」醫院,後因空襲燒毀,異 地蓋房重新開業改稱「林眼科診所」 。\nIn the period of Japanese Rule, Chiayi had the Ke, Chou, Zhenshan and Chiayi eye hospitals. Zhenshan Eye Hospital ran by Liu Chuan-lai specialized in eye surgery. Chiu Zai-jun's Chou Eye Hospital was skilled at trachoma prevention. Lin Kun-quan's Chiayi Eye Hospital was destroyed in an air raid and became Lin Ophthalmology Clinic when it reopened at a new site.","wiki":"","attachments":["PXL_20211120_053536449.jpeg"]},{"id":"reccBmn1tqjVJruPY","name":"木構造與工法的跨時空對話","notes":"木構造與工法的跨時空對話\n黃明威+王銘顯×陳冠帆×台灣木彤+台灣森科\n位在嘉義市火車站斜對面側的嘉義市立美術館,坐落在中山 路、光彩街、廣寧街與蘭井街圍繞而成的梯形基地上,原來的 建築包含了1棟需維護的市定古蹟、3棟一般建物,最早在日治 時期是臺灣總督府專賣局嘉義支局的辦公廳舍,由梅澤捨次郎 所設計,後來由菸酒公賣局嘉義分局使用。\n2012年,此處被選為嘉義市立美術館預定地後,在保留原有設 計特色的原則下,由黃明威及王銘顯兩位建築師引入新設計與 工法,特別呼應嘉義的「水都」美名,以木構造建整合新舊 建築物的結構與空間,讓新的嘉義市立美術館成為一個具有跨 時代意義,新舊融合的重要現代木構造案例。\n集成材樑柱系統","wiki":"","attachments":["PXL_20211120_055637128.jpeg"]},{"id":"reccXp1wLHrkcK8sG","name":"糖鐵與糖業","notes":"糖鐵與糖業\n因應糖業需要而興建的專業鐵路簡稱為「糖鐵」,為製糖株式會 社的私營鐵路,嘉義地區有多條糖鐵,而主要有北港線及朴子線 和嘉義火車站連結。糖鐵的功能在搬運甘蔗及製糖產品,以糖廠 為中心呈放射狀分佈。為了形成完整的運輸網路,亦與官營鐵路 在火車站接軌。除了運送貨物外,也有對外開放客貨運輸的「營 業線」。","wiki":"","attachments":["PXL_20211120_051947705.jpeg"]},{"id":"reccoIRMwmMOvgTCz","name":"嘉音 Chiayi Music","notes":"嘉音 Chiayi Music\n早期嘉義除了原住民音樂、傳統民間戲曲之外,西洋音樂隨著 傳教士而帶入嘉義。日治時期,於臺北求學的「周眼科醫院」 周再郡醫師,參加昭和6年(1931)「臺灣全島洋樂競演大 會」得到冠軍,成為臺灣第一位音樂比賽得主,返鄉行醫之餘 為地方音樂之發展有其貢獻。\n昭和9年(1934)舉辦的「鄉土訪問音樂會」與隔年「震災義 捐音樂會」,為臺灣的音樂盛事。留日音樂家利用暑期返鄉, 巡迴全臺各地演出,嘉義也是其中巡迴點之一。演出者都是音 樂菁英,小提琴演奏者翁榮茂則是出身嘉義,留學日本,為臺 灣早期提琴教育重要奠基者之一。\n戰後,留學日本的張登照為弦樂教育家:社會人士組成的合唱 團、樂團,也播下嘉義音樂發展的種子。爾後,嘉義各級學校 紛紛設立音樂班、大專院校開設音樂科系、國際化的管樂節與 流行音樂祭、各類型表演場地的建置、音樂愛好團體的推動, 讓嘉義的音樂表現越見興盛。\nIn the early days, Chiayi not only had aboriginal music and traditional folk drama, Western music was introduced to Chiayi by missionaries. During the 9th year of the Showa Reign (1934), \"Country Interview Concert\" and \"Earthquake Donation Concert in 1935\" were two big events hosted. Musician studying in Japan came back to perform across Taiwan in the summer vacation and Chiayi was one such place. After the war, schools at every level in Chiayi established music classes and universities set up music departments; together with the international band festival, pop music festival and establishment of various types of performance venues and promotion of music loving groups, Chiayi's musical expression thrived.","wiki":"","attachments":["PXL_20211120_061714423.jpeg","PXL_20211120_061714423.jpeg"]},{"id":"recdDiUyHWrO1e8HG","name":"紅毛井 Holland Well","notes":"紅毛井 Holland Well\n紅毛井又稱「蘭井」,十七世紀荷蘭人在南臺灣殖民統 治,於「諸羅山社」聚落挖鑿此井,做為生活水源。明 鄭時期曾整修此井;乾隆時期以「蘭井泉甘」之名列入 諸羅八景;日治初期,此井仍當地居民所用;昭和3年 (1928),報紙報導紅毛井已被磚石填滿民國59 年 (1970)市府重修此井並設鐵欄、立碑;1997年時再 次重修,將方井改為圓井。紅毛井是目前嘉義市内留存 最久的古蹟,鄰近設有蘭井里(後併入民族里) 蘭井 街等名稱,可說是嘉義城市形成的發源地。\nThis well was dug in Jhuluoshan settlement to provide water for daily use in the 1600s when the Dutch ruled Taiwan. Holland Well, also known as Lanjin, is the oldest historic site in Chiayi. Local place names include Lanjin Village (merged into Minzu Village later) and Lanjin Street. It can be said to be where Chiayi City originated.","wiki":"","attachments":["PXL_20211120_053327655.jpeg"]},{"id":"recdSe0FHbZEkIPgp","name":"木材加工","notes":"","wiki":"","attachments":["PXL_20211120_052031326.MP.jpg"]},{"id":"recdSl7w1IwPGiO7G","name":"歐洲雲杉 Picea abies","notes":"歐洲雲杉 Picea abies\n產地\n顏色\n遍產於歐洲各國,分布廣泛\n邊材與心材區別不明顯,木材顏色\n為乳白至淡黃色帶紅,紋理通直,\n均勻而細緻\n帶有清新松木香\n香氣\n特性\n質地輕盈、柔軟,容易裁鋸加工、\n重量輕,密度中等,結構強度高, 且木質均勻,適合作為建材\n常作為室內裝修材料、結構用材、\n家具用料及木工 DIY 材料","wiki":"","attachments":["PXL_20211120_055424068.jpeg"]},{"id":"recdbYMtKoPbXFt0Y","name":"想像一種永續的可能: 一座木造公共建築","notes":"想像一種永續的可能: 一座木造公共建築\n1906年,第一批森林調查員來到嘉義,拉開了阿里山百年林場的序幕。1915年後,嘉 義市成為阿里山林場木材的重要集散地,隨著嘉義製材所中東南亞最大貯木池與火車修 理廠完工,仰賴著阿里山林業所發展起來的嘉義市鎮有了「木都」之名,林森路被稱為 「木材街」,營林機關群則被稱為檜町。在這塊充滿林業記憶的街區中,將「樹根的型 態」轉化為建築設計的語彙,創造一個充滿生機的複合建築,室內可提供展示空間並作 為市民參與基地,戶外可做為生態探索的場域,一個以自然共構文化及歷史的館舍。\n以永續森林為概念所提出的公共建築設計\n有著木都美名的嘉義,是否會有一棟公共建築,可以串聯起人們對於森林及木建築之間 的連結及想像,讓參觀的民眾都能真切的感受到木造建築與森林間的永續循環?在本次 展覽中,建築設計師就提出在嘉義市的公共建築中,使用木構造來搭建主要建築空間, 並規劃部分空間來種植人工森林,讓這片人工森林在未來成為本棟建築木構件的維修材 料來源。藉由每次的砍伐人工林,以及計畫回植新樹苗的方式,展示永續循環的空間及 概念。在車站、圖書館、甚至是博物館等各類型的公共建築中,透過這樣的人工森林到 木造建築的永續循環教育現場,創造出屬於嘉義木都的城市特色以及景觀。\n","wiki":"","attachments":["PXL_20211120_060344473.jpeg","PXL_20211120_060352987_MP.jpg"]},{"id":"recem7f6jrm0R4aT8","name":"嘉作 Excellent Chiayi Creation","notes":"嘉作 Excellent Chiayi Creation\n嘉義市文學作品包含古典詩詞、現代詩、歌詞、小說和散 文等,也有以口傳的民間文學、民間詩、廟聯文學及歌仔 冊與褒歌等庶民文學。清領時期,由於地理位置鄰近府城 臺南而受到影響,文教機構如書院、義學、社學、民學等 廣泛設立,代表雅文化階層集會的詩社、文社頗多,文風 鼎盛。\n透過詩人林緝熙的這首〈諸羅秋望〉除了歌詠文化古都的 意涵,描寫眺望諸羅城秋天的景象,並提到嘉義民間存留 鄒魯文風,展現內心孺慕儒學的情懷,可見一斑。\n〈諸羅秋望〉 林緝熙\n孤城人語白雲低,淺水蘆花入望齊。兀突萬三千尺嶽, 紆迴一十八重谿。秋深南浦猶青草,雨霽東山有斷電。 鄒魯遺風存古邑,炊煙裊裊夕陽西。\nThe literature works in Chiayi City included classic poems, modern poetry, novels, and essays, etc. The literature of the common people was also passed down orally: civil literature, civil poems, temple literature, Taiwanese Opera, and folk songs. During the Qing Dynasty, Chiayi was influenced by Tainan because of geological proximity. Cultural and literature institutions, such as academies, free schools, social schools, and civil schools were widely founded. In the literature heyday, poetry societies and literature societies were established by the intellectuals.","wiki":"","attachments":["PXL_20211120_061624092.jpeg"]},{"id":"recf9rDpzXou0hELF","name":"彩墨 Chinese Color Paintings","notes":"彩墨\nChinese Color Paintings\n彩墨含南畫(水墨畫)、日本畫(膠彩畫)等媒材,在日治時 期「臺灣美術展覽」(臺展)以「東洋畫」稱之,為徵件所造 分之繪畫類別。「南畫」在當時泛指水墨風格的畫作,承襲中 國文人畫的表現,傳統文人畫家以「臨摹」創作,而臺展審召 注重寫生的表現形式,注重主題的細微觀察與寫實描繪,影響 當時的繪畫表現,嘉義的代表畫家為林玉山,與陳進、郭雪 並稱「臺展三少年」。在林玉山的指導下,嘉義躍升為臺灣重 要的東洋畫重鎮,臺、府展的成就十分耀眼。\n《愛》林玉山水墨畫。\n民國48年(1960),霞市立美南區共商,","wiki":"","attachments":["PXL_20211120_061529915.jpeg"]},{"id":"recfFgpsrEPwjdIsH","name":"桃城百味 Many Flavors of Taocheng (Peach City)","notes":"桃城百味\nMany Flavors of Taocheng (Peach City)\n數百年來,隨著歷史的流轉,不同的人們在嘉義這塊土地上匯流,播下多元 族群的種籽,並開出各樣文化的花。桃城,漸漸成了一座「富有韻味」的 城,散發出濃厚的文化色彩。\n在這裡,\n有庶民美食小吃,火雞肉飯、滷熟肉、沙鍋魚頭,是令人食指大動的美味。 有獨特文化地景,紅毛井、錫器店、裱畫店,是令人穿梭時光的韻味。 有多元族群,原住民、眷村與新住民,是令人流連忘返的風味。 匯聚了桃城的諸多樣貌,而這些樣貌也滋養這塊土地上的人們。 歡迎,熱情邀請各位歸客遊人,一起領略嘉義之美,一起品嘗桃城百味~~~\nFor hundreds of years, over time, different people have passed through this land Chiayi and left behind the seeds of ethnic diversity and blooming flowers of different cultures. Taocheng (Peach City) became a place rich in charm with a strong cultural character.\nHere, many aspects of Taocheng (Peach City) converge and nurture its people.\nWelcome, every visitor is invited to appreciate the beauty of Chiayi and savor its many flavors.\n","wiki":"","attachments":["PXL_20211120_053011022.jpeg"]},{"id":"recfFk28DGGL5LcIx","name":"台灣花磚博物館","notes":"台灣花磚博物館\n碳儲存量\n32,660kg=51棵柳杉\n前德豐材木商行(民間製材行)|\n建於1938年\n曾被稱為「木材街」的林森路,往東囊括檜町(今林森里、北門里、 中庄里)、向西至嘉義車站,是日治時期嘉義木材加工出口最大宗 的街道,匯聚多達150多家木材商行,台灣花磚博物館前身曾是 木材行,以臺灣總督府為設計概念,立面帶有巴洛克風的磚木二 層洋房。現為展示館,展示從臺灣各地搶救回來的花磚。","wiki":"","attachments":["PXL_20211120_055554668.jpeg"]},{"id":"recfG52lMZORHJUl3","name":"嘉義公園 Chiayi Park","notes":"嘉義公園 Chiayi Park\n創立於明治43年(1910),園內古木參天,涼亭水榭,假 山魚池,曲徑通幽,因為利用自然山水,風景雅緻,可謂 逍遙勝地。包含有史蹟資料館、射日塔、孔廟、福康安紀 念碑、震災紀念碑等史蹟,東北角與嘉義樹木園接壤,為 民眾休閒遊憩的最佳場所。\nOpened in 1910, its historic sites include as the Historical Relic Museum, Chiayi Tower, Confucius Temple, Fukangan Memorial Stele, and Earthquake Memorial Stele. It is a good place to go for leisure.","wiki":"","attachments":["PXL_20211120_061403978.jpeg"]},{"id":"recfPSfi3v0dZh6RY","name":"文化城市 Culture Has Made This City Great","notes":"文化讓城市變得偉大\n文化城市 Culture Has Made This City Great\n建城三百多年來,一如眾多經活化而重獲新生的歷史建物,這 個阿里山腳下的聚落亦根植於悠遠歷史養成的厚實底蘊,萌生 無數蛻變的契機。近年來,眾多懷抱理想的青年陸續返鄉,賦 予老舊空間新面貌,搭建起自己的理想人生,也隱然匯聚成一 股追尋美好城市生活的新興動能,為老城注入源源活水。\n此外,國際管樂節、桃城美展等文化活動的蓬勃運作,輔以博 物館、美術館等文化藝術場館的積極串連,嘉義市在積累百年 的美學能量之下,持續運用設計驅動城市創新,憑藉文化實力 滾動經濟發展。加上鐵路高架化工程展開,區域發展漸趨融 合,城市體質脫胎換骨,這座古城持續新生,迸發出未來發展 的無限可能,儼然已是世代宜居的西部新都心。","wiki":"","attachments":["PXL_20211120_054209034.jpeg"]},{"id":"recfY79ntDawduEYs","name":"營林俱樂部","notes":"營林俱樂部\n碳儲存量\n27,300kg=43棵柳杉\n接待賓客休閒娛樂的場所(公部門)︱約建於1914年\n隸屬於嘉義營林所出張所內,是臺灣總督府營林局的休閒娛樂場 所;為英國都鐸式半木構造建築風格,屋架為洋式木結構。後來因 應林務機關的不同需求,也曾經作為幼稚園、員工宿舍等用途。","wiki":"","attachments":["PXL_20211120_055615138.jpeg"]},{"id":"recftSRtmIqLVng1b","name":"Timberize Tokyo Timberize Taiwan","notes":"Timberize Tokyo Timberize Taiwan\n「timber」這個英文字,指可用於製成建材的原木。而把這個字動詞化的 timberize,則指稱將木材透過加工成型、應用於建築之中,讓不同種類與性 質的木材都能物盡其用的設計思考。\nTimberize系列建築展年表\n2009.12.05 Timberize TOKYO建築展:都市的木造建築展\n2010.07.24 Timberize建築展in靜岡」 2011.07.01 Timberize建築展in北海道 2012.11.17 Let's Timberizel in九州~探索木的新可能性 2014.09.24 Timberize TOKYO in新木場~都市木造將東京連接到未來 2015.08.01 Timberize TAIWAN 2015~都市高層木構建築臺日聯展 Timberize HIROSHIMA 2015~都市木造將廣島連接到未來 2016.11.18 CROSS LAMINATED TIMBERIZE in OSAKA 2017.07.01 Timberize TAIWAN 2017~臺灣木構造建築的可能型態 2020.10.31 Timberize TAIWAN 2020~>50M 都市木育\n2010.10.09 Timberize建築展in名古屋\n在節能減碳、尋求地球環境永續的時代命題下,推廣現代木構造的team Timberize於2009年開始在日本推動都市木造的思維,2010年舉辦第一屆 Timberize Tokyo建築展,並於2011年成立非營利法人組織,推廣高層、大 規模、防火及複合木質材料的都市木造可能性。\n2011.04 NPO法人team Timberize成立\n2015.10.09\n而近年來在臺灣努力推廣新式木構造的學者與建築設計人們,則與日本非營 利組織team Timberize合作策畫,於2015年在臺灣舉辦Timberize Taiwan建 築展,藉由延續Timberize Tokyo建築展精神,希望探找臺灣木造建築的各種 可能性,打造都市木造森林的展望。\n2015.10.15 Timberize OSAKA 2015~都市木造將大阪連接到未來","wiki":"","attachments":["PXL_20211120_060505698.jpeg"]},{"id":"recgaI6dPZTePPWun","name":"米店 Rice Shops","notes":"米店 Rice Shops\n自清代起,稻米即為嘉義重要的農產,販售米糧的商家 聚集,逐漸形成「米街」的稱號,約在今中山路與公明 路之間的成仁街。清代屬衙署的官會,位於今日的興 中街和成仁街之間的公明路,米街與官倉可見稻米產業 運銷之關聯。\n日治時期「米街」的店家逐漸遷移,後因許多藝術家與 此地有所關連,逐漸改稱為諧音的「美街」。今日米店 除了各式白米之外,因飲食習慣的改變,消費者喜歡於 白米中混入五穀雜糧增加纖維及多種營養素的攝取,米 店中增加胚芽米、糙米、紅藜麥、胚芽麥片、豆類、蕎 麥等穀糧的販售。\nRice has been an important agricultural product of Chiayi since the Qing Dynasty. The rice stores that gradually opened in the area gave Chengren Street between today's Zhongshan Road and Gongming Road the name \"Rice Street\". In the period of Japanese Rule, the rice shops successively moved out and it became known as \"Arts Street\" due to the many artists with a connection to the street.","wiki":"","attachments":["PXL_20211120_053257082.jpeg"]},{"id":"recgs0bw6ebcj2Dib","name":"糖果零食 Sweets and Snacks","notes":"糖果零食 Sweets and Snacks\n現今的糖果、餅乾種類繁多,本土廠商求新、求變並追 求精緻化的新產品不斷推陳出新,各國進口的新奇零 食,也來瓜分市場。長輩們兒時回憶的傳統零嘴,在時 代的演進之下,對於今日反而是「充滿新鮮感」的產 品。在嘉義有許多家糖果業者仍可找到這些產品,麻 荖、金柑糖、香蕉飴、冬筍餅、卡哩卡哩、彈珠汽水等 代,都可在此獲得滿足。\n等,不論是想回味童年的長輩,或是想嚐鮮體驗的新世\nTraditional snacks that old people remember from their childhood feel like new products after the passage of time. There are many sweet stores in Chiayi where these old time products such as sesame puffs, banana mochi rice cake, bamboo shoot biscuit, kali kali and marble soda can still be found. Whether old people wanting a nostalgic trip back or young people wanting a new experience, all can be satisfied at a sweet shop.","wiki":"","attachments":["PXL_20211120_054009921.jpeg"]},{"id":"rechm3sztAQQR8xnJ","name":"嘉義東市場","notes":"嘉義東市場\n87,800kg=137棵柳杉\n山產野味的第一站(公部門)|\n1914年完工啟用\n在清治時期即是住在山裡的農民把蔬果運下山販賣的第一個市 集,日治時期重新整頓後,使用大量檜木挑高建造而成;目前僅 存在臨北側 (中正路)與東側(忠孝路)的木構造建築是日治時 代後期興建。","wiki":"","attachments":["PXL_20211120_055623842.jpeg"]},{"id":"rechqq3cBbugCnl43","name":"木仁堂","notes":"","wiki":"","attachments":["PXL_20211120_060703208.jpeg","PXL_20211120_060709662.jpeg","PXL_20211120_060722094.jpeg","PXL_20211120_060715910.jpeg","PXL_20211120_060724959.jpeg","PXL_20211120_060728795.jpeg","PXL_20211120_060734327.jpeg"]},{"id":"rechrRH32LUWtOT3t","name":"1706 康熙45年","notes":"1706 康熙45年\n同知孫元衡興建諸羅縣縣學。\nGovernment sub-prefect Sun Yuan-heng established the Jhuluo County School.","wiki":"","attachments":["PXL_20211120_052745679.jpeg"]},{"id":"rechvx13qg6XI55Ol","name":"沙鍋魚頭 Fish Head Casserole","notes":"沙鍋魚頭 Fish Head Casserole\n嘉義的「沙」鍋魚頭,雖與江浙名菜「砂鍋魚頭」同 名,但細究食材與烹調方式,卻是不同的風味。江浙砂 鍋魚頭以五花肉、金華火腿、魚頭、豆腐、豆瓣醬等同\n時熬煮。\n而嘉義的臺式沙鍋魚頭,湯底中明顯的沙茶、扁魚、蝦 米、蒜頭、辣椒的鮮味,融合臺菜、潮汕、粤式等菜 系,獨創屬於嘉義的美味。以豬大骨、雞骨熬煮的高 湯,加上獨門的配方調味,放入大白菜、豬肉、豆皮、 豆腐、木耳等食材煮滾後,再加上乾炸過、取自水庫放 養的大頭鰱魚頭,成為知名的嘉義美食。\nChiayi's Taiwanese style fish head casserole has a tasty soup base containing shacha sauce, preserved fish, shrimp,garlic and chili and is a mix of Taiwanese, Chaozhou-Shantou and Cantonese cuisines. It is a delicious taste that belongs to Chiayi. The broth is made by boiling pig bones and chicken bones, then secret formula flavorings are added and then cabbage, pork, tofu skin, tofu and Jew's ear etc. are added and boiled. To this is then added the deep-fried head of a big mouthed carp reared in a reservoir.","wiki":"","attachments":["PXL_20211120_053048487.jpeg"]},{"id":"reciJYTXhG6aQ9NhK","name":"西畫 Western Paintings","notes":"西畫 Western Paintings\n日治時期的西洋畫是指受西方傳統繪畫所影響之繪畫風格,以 油畫表現為主。19世紀後期,日本明治天皇進行西化改革運 動,引進歐洲古典油畫的技術與風格。臺灣西畫啟蒙應屬石川 欽一郎,此時期的西畫深具臺灣「地方色彩」,描繪臺灣特有 的天候、地理、自然、人情與風俗等地方特徵。而臺灣畫家就 在日本美術教育、「帝展」 「臺展」及「府展」評審主導風 格下相互影響創作表現。\n《阿端的琢磨》,蔡瑞妙油畫。 民國85年(1996),嘉義市立美術館典藏。\n日治時期的西洋畫是指受西方傳統繪畫所影響之繪畫風格,以 油畫表現為主。19世紀後期,日本明治天皇進行西化改革運 動,引進歐洲古典油畫的技術與風格。臺灣西畫啟蒙應屬石川 欽一郎,此時期的西畫深具臺灣「地方色彩」,描繪臺灣特有 的天候、地理、自然、人情與風俗等地方特徵。而臺灣畫家就 在日本美術教育、「帝展」 「臺展」及「府展」評審主導風 格下相互影響創作表現。\n《阿端的琢磨》,蔡瑞妙油畫。 民國85年(1996),嘉義市立美術館典藏。","wiki":"","attachments":["PXL_20211120_061516058.jpeg"]},{"id":"reciRgvhE03tDS43l","name":"裱畫舖 Picture Framing Shop","notes":"裱畫舖 Picture Framing Shop\n日治時期,公明路與中山路之間的成仁街國書畫裝裱店 的集中,而由「米街」諧音轉意為「美街」 當時的許 多藝術家與此地有相關淵源,如林玉山、蒲添生、蘇孝 德、盧雲生等人。書畫家將作品送交裝裱,裱畫店經常 可以看見許多名家畫作,兼具畫廊的展覽功能。也或許 是這裡的居民因經營米店而經濟較為寬裕,能為子弟提 供較好的藝術資源與學習環境,而造就「美街」濃厚的 人文藝術氣息。\nIn the period of Japanese Rule, due to the large number of picture framing stores on Chengren Street between Gongming Road and Zhongshan Road, the nickname \"Rice Street\" was change to \"Arts Street.\" Artists would send their paintings to be framed and the works of various famous artists could often be seen in the stores, which also had a function as art galleries. Perhaps due to the relatively well-off circumstances of the people here who ran rice shops they were able to provide good art resources and learning environment for their children, giving \"Arts Street\" its strong arts atmosphere.","wiki":"","attachments":["PXL_20211120_053855751.jpeg"]},{"id":"recilm0oDfLKMhotc","name":"錢櫃","notes":"錢櫃\n此件錢櫃是由8片臺灣紅檜板材組製而成,放置 時以磚石墊高潮。内部抽屜共有10個之多,面 板挖一直孔,便於投錢於其內。為了預防竊盜, 面板有大鐵扣可加鎖頭,夜晚也可做為伙計歇 息之所。\n\n日治時期,嘉義市政府文化局典藏","wiki":"","attachments":["PXL_20211120_053451098.jpeg"]},{"id":"reckIcc108AUqASDG","name":"嘉義製材所","notes":"嘉義製材所\n於大正3年(1914)啟用的嘉義製材所,引進歐美最先進的設備 與技術,並將木材生產過程分工,規模及產能為東洋第一。製材 所内包含多棟建築及貯木池等,負責儲存砍伐下來的原木,並將 「原木」加工製成「木材」 製材所內的「動力室」為嘉義地區 第一座鋼骨鋼筋混凝土建築,為製材所内自備的火力發電設施。 。","wiki":"","attachments":["1563206288-2405422923.jpg","nEO_IMG_DSC09373-4.jpg"]},{"id":"recl9lmKVLzXP1atj","name":"文化絲路 Wander the Cultural Silk Road","notes":"徜徉文化絲路\n文化絲路 Wander the Cultural Silk Road\n\n近年來,隨著文化與觀光相關政策帶動、設計導入城市治理,嘉 義市這座歷史悠久的城市,在新舊故事交織下,開展出精緻而紛 呈的日常風景,儼然已是臺灣西部重要的文化都市。漫步嘉義街 頭,不時在巷弄之間遇見相映成趣的新式樓房與傳統街屋,流連 於年輕世代開設的獨立咖啡店、書店與藝文空間。在過往山區與 平地居民交流物資的傳統市場體會到人情的熱切流動,自頻繁的 藝術文化活動習染上畫都的美學氣息,從蘊含長年林業文化肌理 的街廓望見昔日的木都風華。循著歲月流轉,嘉義市已然串接起 長遠歷史脈絡的文化絲路,在今日,以一種優雅而自信的姿態, 在西部平原上發著光,等待人們再一次停下腳步,細細探訪","wiki":"","attachments":["PXL_20211120_054159734.jpeg"]},{"id":"reclX2Ml1T5MfOjFl","name":"諸羅 風光 Jhuluo Scenery","notes":"諸羅 風光 Jhuluo Scenery\n嘉義市地形90%屬海拔低於50公尺的嘉南平原,東 側為海拔 50 公尺以上的緩傾斜丘陵地形,地勢從東 向西緩降。橫亙城市東側天際線的是平均高度 2,500 公尺的阿里山山脈,往西的沖積平原延伸至臺灣海 峽,與嘉義縣分界的北界牛稠溪、南界八掌溪及蘭潭 是主要的水文景觀。市鎮因為開發早,歷史建物、古 蹟與現代建築混雜,隨著林業發達而廣用木料的屋 宅,而形成現在的嘉義城市風貌。\nChiayi is located on the Chiayi-Tainan Plain, of which over 90% is under 50 meters above sea level. To the east are gradually inclining hills which rise over 50 meters above sea level, and the terrain gradually descends from east to west. The Alishan mountain range extends all the way along the skyline to the east of the city, with an average elevation of 2,500 meters. The alluvial plain to the west extends all the way to the Taiwan Strait, and the Niuchou River forms the border of Chiayi County to the north of the city. The Bazhang River forms the southern city boundary, and Lantan Lake is the city's main hydrological feature.","wiki":"","attachments":["PXL_20211120_052110484.jpeg"]},{"id":"reclrZKllJIDbZANJ","name":"長義閣掌中劇團 Chang Yi Ge Glove Puppetry Troupe","notes":"長義閣掌中劇團 Chang Yi Ge Glove Puppetry Troupe\n民國36年(1947)創立,目前傳承至第4代,以現代化的營運行銷管理模 式,維持傳統劇團的運作。並與嘉義地區學校合作,培育後場音樂人才。表 演作品透過歷史考證、調查加以轉化詮釋,並以「文學諸羅」的概念創作作 品,包含「蕩寇英豪」、 「清天願」、「城隍爺」 「城隍爺」、「忠義十九公」等。\nFounded in 1947, using modern operational marketing and managerial methods, the operations of a traditional opera group are maintained. Through historical inspection and research, interpretation of works is carried out and the creative concept of \"Literature Jhuluo\" used to create. This includes villains, \"Wang Delu and Pirates\", \"Ching Tien Yuan\", \"Chenhuangye\", and \"19 Zhongyigongs\", etc..","wiki":"","attachments":["PXL_20211120_061651349.jpeg"]},{"id":"recmMAPqlQHlE1C5L","name":"新住民 New Immigrants","notes":"新住民 New Immigrants\n臺灣新住民泛指 1990 年代解嚴後,經過跨國通婚或其 他因素取得中華民國國籍者的通稱。時至2019 年末, 計,臺灣外籍與大陸(含港澳)配偶共有557,450人, 其中大陸及港澳地區配偶366,714人,外裔、外籍配偶 190,736 人。嘉義地區的新住民人數則以中國大陸為\n越來越多新移民女性/男性成為我們的家人,根據統\n首,其次為越南、印尼等。婚姻移民人口來自不同的國\n家,帶來了不一樣的文化、飲食、服飾等,豐富臺灣的\n多元文化。\nNew immigrants is the name given to people who obtained ROC nationality through marriage from the 1990s onwards after Martial Law ended. Most of the new immigrants in Chiayi are from Mainland China, followed by Vietnam and Indonesia. These marriage immigrants brought different cultures, cuisines and dress and have further enriched Taiwan's already diverse culture.","wiki":"","attachments":["PXL_20211120_053715925.jpeg"]},{"id":"recmnGyUlDMZtVKB8","name":"1945 民國34年","notes":"1945 民國34年\n第二次世界大戰結束,日本戰敗,中華民國政府接收臺灣,\n嘉義市改制為省轄市。\nThe end of World War II. Japan had lost the war, and the ROC government took over Taiwan. Chiayi was restructured as a provincial city.","wiki":"","attachments":["PXL_20211120_052816911.jpeg"]},{"id":"recmqkE6Zs72FGVia","name":"化石分佈 Fossil Distribution","notes":"化石分佈 Fossil Distribution\n嘉義東側的阿里山山脈,擁有不少陡峭的岩壁,許多溪 流源自於此。透過溪流的沖刷,形成化石出土的有利環 境,採集相對容易,因而造就嘉義市有不少化石蒐藏 奇石店家等。主要化石區有牛埔、灣潭、石磷、東 何厝、三層崎、澐水等化石區,其中以靠近觸口, 屬於「更新世」(約258萬~1萬年前)六重溪層的牛埔 化石區,出土的化石種類最多。\nThe Alishan mountain range to the east of Chiayi has many steep cliffs, with many streams originating from them. Erosion from these streams creates an ideal environment for fossil excavation. Collecting them is relatively easy, so there are many fossil collections and odd stone shops in Chiayi.\n西區 東區\n中埔鄉 海灘\n番路鄉\n三層 水","wiki":"","attachments":["PXL_20211120_052241403.jpeg"]},{"id":"recmy1QoLEWUtW27w","name":"魯班鎖 六子聯方","notes":"魯班鎖 六子聯方\nBurr puzzle\n魯班鎖是一種複雜的、高度技巧性的榫卯 關係,是中國木構結點榫卯技巧達到極致 的一種產物。卯榫是兩個木構件之間採用 一種凹凸處理的接合方式進行連接的結 構,凹進部分叫卯,凸出部分叫榫。其特 點是不需要使用釘子,利用卯榫原理即可 將物件牢固的結合在一起,顯示了古人巧 奪天工的創造成就。魯班鎖便是根據榫卯 相互契合的原理,一榫一卯,一凸一凹, 六根木頭吻合而成的古代建築榫卯技術應 用最經典款之一。六子聯方的精神就象徵 著我們社會文化中「團隊合作」的重要 性,每個人都有各自的專業,凸榫和凹槽 可以優缺點互補,一件事情要做到完美, 必須倚靠團隊的合作。 (展品提供:澤昕木業)","wiki":"","attachments":["PXL_20211120_055827915.jpeg"]},{"id":"recn6kpEj9F1ZrERZ","name":"剖香腳步驟","notes":"剖香腳步驟\n去節:將竹子放置椅馬仔上,且鋸斷竹節。\n→量尺寸:使用特製量尺上畫出特定長度。\n→鋸竹:將竹子分別鋸開後,去掉竹節,擷取中段部分成為竹筒。\n→浸竹:將鋸好的竹筒放入水中浸泡使其軟化,有助開剖作業。 →開竹:視竹筒直徑大小平均剖開8至12片竹簡。\n→去青取竹:將竹簡上面的綠色表皮,以及內層白笙去除,只\n取用竹肉。\n→剖片:將竹肉剖成6薄片。\n→切絲:將竹片切絲工法,交錯對剖4次以上,成為細竹枝。\n→展花曬乾:集5千至6千枝細竹枝為一手,成花朵狀,並且在\n太\n陽底下曝曬2至3日。\n→由製香師進行線香後製作業\n剖香腳-椅馬仔\n製作剖香腳之步驟,包含「去節」、「量尺寸」以及「鋸竹」,皆須將竹 子橫放在此｢椅馬仔｣上支撐。\n民初,邱錦雲小姐收藏","wiki":"","attachments":["PXL_20211120_053949503.jpeg","PXL_20211120_053954355.jpeg"]},{"id":"recn85haa5NAZiFAc","name":"多元文化看建築","notes":"多元文化看建築\n\n歷史建築包括:紅毛井、林母郭孺人暨二子壽域墓、一江山陣亡 將士紀念碑、雙忠廟、鎮南聖神宮、北社尾王姓宗祠、聖奧德天 主堂、原嘉義製材所、共和路與北門街林管處國有宿眷舍(檜意 森活村)、嘉義林區管理處辦公區內木構造建築群、玉山一二村 (林務局嘉義林管處老舊宿舍)、嘉義農業試驗分所辦公室、舊 嘉義市公所、嘉義第二司法新村、嘉義舊監獄演武場、東門派 出所、嘉義區監理所宿眷舍、水源地水錶室、水源地沉澱井暨 濾過井、原嘉義郡水利組合之水閘門及水道、舊嘉義菸葉廠、 原嘉義酒廠、原嘉義郵局、原嘉義電信局、原嘉義城隍廟戲臺 (林宅)、嘉義市東市場等26 處。\nC","wiki":"","attachments":["PXL_20211120_054326851.jpeg"]},{"id":"recnsEKgd3p3h3ojp","name":"嘉城三鐵","notes":"嘉城三鐵 Chiayi's Three Railways\n嘉義地區林業鐵路、糖業鐵路、縱貫鐵路的建構,在日治 時期已頗具規模。嘉義的產業與經濟蓬勃發展,依附著 「三鐵」的運轉。林木由林鐵從阿里山林場運往製材所; 糖鐵運送製糖的原料及產品、副產品,各式物產倚靠縱貫 鐵路輸送至全臺各地,也將外地客帶來嘉義,附近的關子 嶺溫泉、吳鳳廟、北港及新港媽祖廟、新高阿里山等觀光 景點,透過這些交通網絡串連起來!\nConstruction of the Forest Railway, Sugar Railway and Western Trunk Line were quite extensive in the Chiayi area under Japanese rule. Chiayi's flourishing industrial and economic development depended on the operation of this trio of railways. The forest line ran from Alishan Forest Station to the sawmill; the sugar line transported raw material for making sugar as well as products and by-products; each type of product relied on the Western Trunk Line to connect these transport networks and deliver goods all over Taiwan!","wiki":"","attachments":["PXL_20211120_051509157.jpeg","PXL_20211120_051515150.jpeg"]},{"id":"recoNNzsEm3xczhni","name":"老屋新生 New Life for Old Buildings","notes":"老屋新生 New Life for Old Buildings\n嘉義街區有許多木構建築及傳統建築,如中山路(大 通) 中正路(二通)週遭巷弄,還留有許多古色古香 的老屋。近年公部門持續推動的「舊屋力-老屋補助計 畫」,鼓勵老屋的保存與活化再利用,使舊有建築空間 與人文融合,藉此受到關注與保護。\n老屋不再代表著髒亂與無用,透過再造的方式讓老屋的 時間繼續流動,並具有保存價值。各行各業共同參 與,可保留原有用途,或轉換為展場、旅館、餐廳等多 元用途,化身成會說故事的建築,讓民眾可來場穿越嘉 義時空之旅。\nChiayi still has many wooden buildings and traditional buildings, with many old houses to be found in the lanes and alleys. In recent years the government has encouraged the preservation and active re-use of old houses, combining old building space and culture, attracting attention to the old buildings and so protecting them. Various businesses are taking part together; the original use can be retained or changed to exhibition space, hotel or restaurant etc., turning the buildings into places that tell a story and taking visitors on a trip back in time.","wiki":"","attachments":["PXL_20211120_054056397.jpeg"]},{"id":"recoPPIHrVQXI1iPG","name":"臺灣扁柏","notes":"臺灣扁柏\n【學名】Chamaecyparisobtusa var. formosana | 柏科扁柏屬|針葉樹 【通稱】Formosan Hinoki\n又稱｢黃檜｣,高度可達50公尺,胸徑約3.5公尺。樹幹通直,枝條平展、小枝細 長,樹皮灰紅色,有長片條狀剝落。生長緩慢,是貴重且最受歡迎的木材。多 為純林,或與紅檜、鐵杉混生,心材呈淺褐黃色,香氣濃郁。多產於臺灣中央山 脈海拔1300~2800公尺間,棲蘭山區是目前世界上面積最大的扁柏林。","wiki":"","attachments":["PXL_20211120_060149793.jpeg"]},{"id":"recpUwEAGVAQkndn0","name":"漫遊嘉藝","notes":"漫遊嘉藝\nChiayi Art Tour\n走過歷史長河的流轉,嘉義市在新舊故事交織下,開展出精緻而繽紛 的人文風土。各個文化展館與景點如同點點星光,交互纏繞並錯雜連 結在城市的大街小巷中,一步一履漫步在嘉義文化新絲路,體會新式 樓房與傳統街屋古城新生的活力,從蘊含林業文化紋理的街廓,望見 昔日的畫都風華。從市定古蹟火車站出發,走訪鄰近的嘉義文創園區 與嘉義市立美術館,接著前往嘉義製材所、檜意森活村、北門車站與 愛木村追尋木都文化的刻畫的痕跡;或是拜訪臺灣花磚博物館、祥太 文化館認識嘉義工藝之美:另有許世賢博士紀念館、嘉義舊監獄與嘉 義百年公園,嘉義不可錯過的經典場景。期待大家以晃遊的方式緩緩 漫步,重新認識這座城市,為古老美好注入新的活水。\nThe cultural venues and scenic spots of Chiayi are scattered around its streets and lanes. Walk along the Chiayi Culture New Silk Road to experience the new life vitality of new style buildings and traditional street houses. View the splendor of the old painting city from the blocks with the cultural features of the forestry industry. It is hoped everyone will walk around to become reacquainted with this city and add vitality to the old beauty.\nniayi's Mazu\nIntroduction to\nDr. Kuo Sie-Hien","wiki":"","attachments":["PXL_20211120_061350208_MP (1).jpg"]},{"id":"recqMRVlLpVkPRYWp","name":"臺灣杉","notes":"臺灣杉\n【學名】 Taiwania cryptomerioides Hayata | 杉科臺灣杉屬|針葉樹 【通稱】 Taiwania\n又稱「亞」,為臺灣特有種。樹高達60公尺、胸徑達2公尺。樹幹圓直少分 枝;樹皮呈灰紅褐色至灰白色,側枝修長略下垂。臺灣杉是地質時代,第 三紀所遺留下來的活化石,生長於1800~2500公尺之間,多與紅檜林混 生。心材 (註)呈紫紅色。由於生長快速,是中高海拔的主要造林樹種之 一是日治時期三大林場常見的樹種。\n註心材:指髓心與邊材之間(一般顏色較深)的木質部。","wiki":"","attachments":["PXL_20211120_060223930.jpeg"]},{"id":"recqN7j77f6PAtqAg","name":"1704 康熙 43年","notes":"1704 康熙 43年\n諸羅縣治自佳里興歸返諸羅山(即今嘉義市),諸羅知縣宋永清以木柵為\n城,為嘉義建城之始。\nGovernance of Jhuluo County returned from Jiali back to Jhuluoshan (present day Chiayi City). Jhuluo county magistrate Song Yong-qing had a wooden fence built, marking the beginning of Chiayi's city walls.","wiki":"","attachments":["PXL_20211120_052738827.jpeg"]},{"id":"recqOuQD8EV8iK69N","name":"雨中台北","notes":"雨是臺北的氣質。\n雨中台北\n不同的雨賦予了臺北不同個性:細微、空靈、黏膩、嘩 啦......臺北也在雨後煥然一新。\nTaipei in the Rain\n本案選址在現在的臺北市議會,採用CLT、膠合梁及 竹材搭配鋼構,將原市議會建築改建為3層樓議場與\n21層樓(88公尺)的市議會大樓。\n王銘顯×台灣木彤\n為了要代表臺北,新議會大樓超越以往建築僵硬的威 權印象,嘗試展現出臺北多變、清新的個性;建築拉 高處理,讓出地面空間提供市民活動使用。在建築外 觀上採用竹構帷幕來表現雨束,結構系統上亦採用竹 構作為束制懸臂樓板的穩定構件。透過本案設計,我 們希望新的議會建築能夠如雨般次次刷新這座城市, 一期期地代表著年輕的臺北。\n結構與細部說明 自由甲底的改薄站速\nE\n要日台股爆股· 竹 新樓板燒線。\nFE 財格 -曾超模之商族\n橙的吸的方\n「枸拉 台 銀 尼根除結\n2020年7月-3月 24052 m 2617 m² 21424m 21M\n(名\n澳中華北Taipelin the Rain\n樓地板面線\n查與辦公大楼\n主菜歐精無時事務所\n台灣大亚份有限公司\n主站齡、加爾、回話,撥優質、Colmestre-Caron\n港國人壽","wiki":"","attachments":["PXL_20211120_060330730.jpeg","PXL_20211120_060336552.jpeg","PXL_20211120_060333748.jpeg"]},{"id":"recr1qlUNfTZ3DazV","name":"1998 民國87年 ","notes":"1998 民國87年 \n市政府文化局舉辦「石猴戶外創作展」活動,1999年「嘉義 市石雕協會」成立並參與協辦。在市區重要路口、文化園區 內設立多件大型石猴公共藝術作品。\normed the\nThe Cultural Affairs Bureau held the Stone Monkey Outdoor Creative Exhibition, and in 1999 the Chiayi Stone Carving Society was established to assist with organizing the cultural event.","wiki":"","attachments":["PXL_20211120_052835941.jpeg"]},{"id":"recr6RdYP4s3rrvOK","name":"1906 明治39年","notes":"1906 明治39年\n梅山大地震後,嘉義街七成建築損毀,臺灣總督府趁機進行市 區改正,市街往城外擴張,嘉義於是有了現代城市的風貌。\nAfter the Meishan earthquake 70% of Chiayi's buildings were damaged, and the Governor-General of Taiwan took the opportunity to undertake urban improvements. The town's streets were expanded outward, and Chiayi took on the appearance of a modern city.","wiki":"","attachments":["PXL_20211120_052800900.jpeg"]},{"id":"recrMVrVL7HZq2vDj","name":"醫館 Hospitals","notes":"■ 醫館 Hospitals\n嘉義地區的現代醫療緣起於清代西方傳教士以醫療宣教 引入,光緒年間(1890年代)基督教徒陳老英,創辦嘉 義第一家西醫院「英安堂」醫館。明治28年(1895), 嘉義設置官立臺南縣嘉義支廳診斷所。臺灣總督府在 明治 33 年(1900)開設醫學校(今國立臺灣大學醫學 院) 培養臺灣本土的醫師。1904 年畢業的周福全創 辦「全生醫館」 1905 年畢業的林玉書開設「慎德醫 院」,皆為初期嘉義市的臺藉醫生。嘉義街助役的庄野橘 太郎著書《嘉義醫者町健康地》 可見當時嘉義推廣西方 醫學的成果。戰後,公明路多達十幾間醫院、診所,而有 「醫生街」的別稱。\nModern medicine in Chiayi can be traced back to the Western missionary doctors of the late Qing dynasty. In the 1890s, Christian convert Chen Lao-ying opened Chiayi's first Western medicine hospital Ying An Tang. Chiayi Doctors' Town Healthy Place written by Chiayi deputy township chief Shouno Kitaro shows the success of the effort to promote Western medicine in Chiayi. After World War II, Gongming Road had more than a dozen hospitals and clinics, becoming known as \"Doctors' Street.\"","wiki":"","attachments":["PXL_20211120_053510479.jpeg"]},{"id":"recrQmhhyxrH75WzC","name":"水錦光賽樂歌仔戲團 Shuijing Guang Sai Le Taiwanese Opera Group","notes":"水錦光賽樂歌仔戲團\nShuijing Guang Sai Le Taiwanese Opera Group\n前身為「新南光賽樂」,成立於大正10年(1921),由周許善(藝名金寶 旦)與其夫周為(藝名文玉旦)合創於嘉義,在全臺各戲院售票演出。近期 的表演在劇本改編引入新的表演特效、聲光雷射科技等效果,以期吸引更多 觀衆。\nFounded in the 10th Year of Taisho Reign (1921), by Zhou Hsu-shan (Stage name Jin Bao dan) and her husband Zhou-wei (Stage name Wen Yu-dan) in Chiayi. Tickets were sold for performances at theaters all over Taiwan. Recently, the performance displayed the edited script and added new performance effects and sound, and laser technology, in order to attract more viewers.","wiki":"","attachments":["PXL_20211120_061643718.jpeg"]},{"id":"recrXWQtQQW3C2bks","name":"學習單","notes":"","wiki":"","attachments":["PXL_20211120_050932849.jpg","PXL_20211120_050936506.jpg","PXL_20211120_050940652.jpg"]},{"id":"recrd3ZtIeMgOiiz8","name":"林鐵 與林業","notes":"林鐵 與林業\n明治36年(1903),臺灣總督府為開發阿里山森林,開始勘測 阿里山林業鐵路,1906年開始施工,1912 年完成嘉義市至阿里 山二萬坪之間的軌道通車,開始載運木材下山,並且隨著林業 發展陸續向林區內增建延長。阿里山鐵路初期以運材為主,後 來增加了載客的功能。路線由平地到高山,沿線可看到從熱 帶、亞熱帶、溫帶的林相變化。","wiki":"","attachments":["PXL_20211120_052025309.jpeg"]},{"id":"recswtPFFt9XL42xZ","name":"1920 大正9年","notes":"1920 大正9年\n改為州廳制,嘉義為五州之一臺南州治下。\nTaiwan was converted to the prefecture system, and Chiayi became one of five districts governed by Tainan Prefecture.","wiki":"","attachments":["PXL_20211120_052805091.jpeg"]},{"id":"rectD4svSp7Ou52Qy","name":"〈第一代嘉義火車站>模型","notes":"〈第一代嘉義火車站>模型\n陳振龍老師是位袖珍車站模型工藝家。在過去 曾參與建造阿里山眠車站,因有感於阿里山 林業鐵道檜木老車站陸續消失,所以開始投入 老車站的模型製作,並立志重現百年前的車站 風貌。從林鐵沿線舊車站、由北到南的木造老車 站,都在他的巧手下重現。\n2020年,嘉義市政府文化局收藏","wiki":"","attachments":["PXL_20211120_051555021.jpeg"]},{"id":"rectFhwy032BZIJD2","name":"1715 康熙54年","notes":"1715 康熙54年\n諸羅知縣周鍾瑄興建水利設施,引八掌溪水與莊民築「諸羅大陂」(道 爺圳)及「柳仔林陂」(將軍圳)灌溉農田,振興農業。同年周鍾瑄捐\n俸並發起募款創建嘉義城隍廟。\nJhuluo county magistrate Zhou Zhong-xuan established water conservancy facilities to irrigate farmland and stimulate agriculture. He had the Jhuluodapi (Daoyeh canal) and Liuzilinpi (Jiangjun canal) built to draw water from the Bazhang River. That same year Chou Chong-hsuan contributed his salary and raised money to found the Chiayi Chenghuang (city god) Temple.","wiki":"","attachments":["PXL_20211120_052745679.jpeg"]},{"id":"rectJkDkwTbwlm9aF","name":"菜車 Vegetable Trucks","notes":"菜車 Vegetable Trucks\n搭配大聲公廣播沿街叫賣的藍色小貨卡車,是臺灣特有 行動商店,帶著商品或服務,主動接近民眾,帶來更便 捷的生活。偏鄉地區購物不便,藍色小貨卡車像雜貨 店,帶著蔬果、豬魚、雜貨等,省去郊區居民交通往返 購物的麻煩。\n都會型的嘉義市購物便捷,西市、東市、各大超市提供 豐富的生活用品。街頭所見的叫賣行動小貨卡車反而是 梅山、阿里山的農家,將產地直送的鮮蔬、特產直接帶 往都會,省去物流、盤商的曲折。街頭偶遇的行動叫 賣,商品不但帶有強烈的季節感,也讓人有著隨機採購 的驚喜。\nBuying everyday goods in downtown Chiayi was easy, with the East and West markets and various large supermarkets. The vendors selling from small trucks on the street were farmers from Meishan (Mt. Mei) and Alishan (Mt. Ali) who brought their fresh produce to the downtown area to cut out the middlemen. The mobile sellers occasionally encountered on the street sold produce with a strong seasonal feel and offered the chance to make a surprise purchase.","wiki":"","attachments":["PXL_20211120_053549398.jpeg"]},{"id":"rectZWJ8xbBw7UVW0","name":"1661 明永曆15年","notes":"1661 明永曆15年\n鄭成功驅逐荷蘭人,於臺南設置「東都明京」承天府,管轄天興縣與萬年 縣,嘉義地區與今臺南市中北部地區隸屬於天興縣。\nKoxinga banished the Dutch and established the \"Easternmost Ming Capital\" Chengtian Prefecture in Tainan, which governed Tianxing County and Wannian County. The Chiayi area and present day north and central Tainan belonged to Tianxing County.","wiki":"","attachments":["PXL_20211120_052724393.jpeg"]},{"id":"rectiJisQDAl2cnBy","name":"乾隆年間諸羅縣城","notes":"乾隆年間諸羅縣城\nО 乾隆 52 年(1787)林爽文之役,諸羅城因堅不 投降,諸羅縣改名為「嘉義縣」 亂平後,重建 城垣為糖水灰城(以糯米汁、糖水拌合蚵殼灰做 為磚塊的黏著材料),俗稱三合土城。後於道光 13年(1833)以磚石為城。","wiki":"","attachments":["PXL_20211120_051744345.jpeg"]},{"id":"recuDdyBtRMuQXpfr","name":"嘉義市立美術館(舊菸酒公賣局) Chiayi Art Museum (former Tobacco and Liquor Monopoly Bureau)","notes":"嘉義市立美術館(舊菸酒公賣局) Chiayi Art Museum (former Tobacco and Liquor Monopoly Bureau)\n包含菸酒公賣局嘉義分局(1936)、酒類倉庫(1954)及菸 酒成品倉庫(1980)等範圍,於2020年改建為嘉義市唯一 的美術館。建物一角為弧形,外觀簡單,呈現對稱和諧而典 雅。立面為橫紋折線磚,具現代建築簡潔風格,兼具面磚大 量使用時期的特色。\n\nand related\nearly grand\nand Chen\nFormerly, it was the Chiayi branch of the Tobacco and Wine Monopoly Bureau. The building has one curved corner with a simple exterior, and a modern concise architectural style as well. A distinctive feature is the use of a large number of face bricks. The building was renovated and became Chiayi's only art museum in 2020.","wiki":"","attachments":["PXL_20211120_061414932.jpeg"]},{"id":"recuK5AglRezijhMk","name":"北美南方松","notes":"北美南方松\n【學名】Pseudotsuga menziesii|松科黃杉屬|針葉樹\n【通稱】Southern Pine\n南方松是生長在溫寒帶樹林的四種樹種之泛稱:短葉松、長葉松、 火炬松、濕地松;外觀特性極為相似,由於木紋清晰自然、成材期 短,約25年即可砍伐使用,邊材黃白色、心材為紅褐色。南方松是 世界上強度最高的樹種之一,因材質強韌,十分適合作為結構材。 分布約從美國德州東部一直延伸到維吉尼亞州。","wiki":"","attachments":["PXL_20211120_060221171_MP.jpg"]},{"id":"recuqtPkaQsENBFkw","name":"柳杉 Cryptomeria japonica","notes":"柳杉 Cryptomeria japonica\n產地\n原為日本二大造林樹種之一,後來移 植臺灣種植後,海拔1000~2000\n顏色\n公尺為宜\n邊材寬、黃白色,心材因產地而色調 不同,呈赤褐至暗褐色,年輪明顯 有香氣\n香氣\n特性\n質地輕盈、柔軟,耐水濕、富彈性; 手工鉋削或是機械加工均容易。易 乾燥,塗裝性佳\n可供建築結構體材料、橋樑建築; 亦可作為船舶、電桿、機械器具、 造紙、火柴棒等用材\n用途","wiki":"","attachments":["PXL_20211120_055355785.jpeg","PXL_20211120_055359190.jpeg"]},{"id":"recvGwiB65Z2Mzwj3","name":"木的製材","notes":"木的製材\n製材就是將砍伐的原木,加以剖切、乾燥、加工, 可因應需求,分割成不同的大小及斷面;建築物各 個不同結構構件,也有不同斷面需求,比較大斷面 的樑柱則需要生長較長的木材才可容易取得。為了 增加森林循環的效率,人工林常見的樹種常常為生 長較快、但樹徑較小的樹種,也會透過疏伐的方式 快速取得小徑木。當需要大斷面的樑柱時,則可透 過將製材分等、膠合的方式製作工程木材,滿足各 式各樣的的建築需求。\n臺、日、美的不同結構系統所使用的木材斷面\n北美 2X4 工法\n讀作 two by four 工法,在臺灣稱為「框組壁工法」,日本稱為 「枠組壁工法」,是源自西式木構造的platform framing(平台 式工法),於1830年代在美國出現,也是北美地區木屋的主要形 式。\n2×12\n12×10","wiki":"","attachments":["PXL_20211120_055732260.jpeg"]},{"id":"recvojUuABzlhi5Dk","name":"嘉義街貌","notes":"嘉義街貌\nAppearance of Chiayi's Streets\n日治時期因林業的發展與現代都市的規劃,形成現 在嘉義城市風貌的基礎。光彩街、蘭井街、長榮街 一帶,保留著優雅樸實的相連木造街屋。閩南式的 紅磚加上檜木搭建的屋舍,素材融合是街屋的特 色,散發著淡淡的日式風情。\nUnder Japanese rule, development of the logging industry and the city modernization program formed the basis of Chiayi's current urban style. Reflecting on the city's history, the vicinity of the \"Central Fountain\" was a part of the Qing dynasty Chiayi City Wall. Under Japanese rule, the wall was demolished and the main roads were connected by a circle, in 1913 a small fountain was installed in the center of the circle. To this day, the fountain, paired with eye-catching lighting effects and the neighboring night market, is one of Chiayi's major landmarks.\n。\n回望城市歷史,「中央噴水池」附近曾經是清朝嘉\n義城牆的一部分,舊稱「桃仔尾」 日治時期,\n拆除城牆,規劃交通要道通過成為圓環,大正2年\n(1913)圓環中央設小型噴水池。時至今日,噴水\n池搭配醒目多彩的燈光效果,又鄰近觀光客聚集的\n文化路夜市,成為代表嘉義市的地標之\n嘉義大通 《無貴寫真五》,民曆102年:2013服葉翠娥提供。","wiki":"","attachments":["PXL_20211120_052926387.jpeg"]},{"id":"recvpVASvTWIR40Kr","name":"現代木構造的五金鐵件","notes":"現代木構造的五金鐵件\n五金鐵件是現代新式木構造的重要角色,透過系統化的 金屬鐵件,不僅能大幅提升木構造的強度與耐震性,同 時也能透過標準化工序來減少生產成本。本區展出三組 目前國內代理的系統鐵件,一窺當代木構造接合技術的\n前端。\nBX KANESHIN\n「在日本,每年新住宅中有50%都是以木構建成。」木構造在日本的普及,與「金 物工法」有著密不可分的關連。「金物工法」(註)取代了傳統的榫接工法,為木構 造帶來更高的耐震強度與建造速度,同時也創造更大的設計自由與可能性,並降低 人力與造價。日本金物工法大廠BX KANESHIN,在日本實現了以金物工法搭建的眾 多精采案例,透過本展覽亦可了解到BX KANESHIN從金物設計、構造設計、運用諮 詢,一體實踐木構造建築的結構系統成型。(展品提供:德豐木業)\n註金物工法:即以五金構件來接合木構造的工法概稱","wiki":"","attachments":["PXL_20211120_060036615.jpeg"]},{"id":"recx33ykQhS5Xi8mr","name":"2017 民國106年","notes":"2017 民國106年\n嘉義市區鐵路高架化計畫動工,由交通部鐵道局規劃,包含市區內約 7.9公里長的鐵路高架化,以及改建嘉北火車站與嘉義火車站為高架火 車站,並恢復北回火車站(原北回歸線站)等,預定於2027年完工通 車。\nWork on Chiayi City overhead rail project commenced. Chiabei Station and Chiayi Station are to be upgraded to overhead rail stations, and are expected to be completed and operational by 2027.","wiki":"","attachments":["PXL_20211120_052846920.jpeg"]},{"id":"recx466eyiWRNojsi","name":"典型的儲碳城市","notes":"典型的儲碳城市\n嘉義木都\n日治初期,便開始積極探索、開發臺灣豐富的資源,其中阿里山林場是最早 開發的山林地。根據臺灣總督府初期委託藤田組的開發調查,當時山中蘊 藏最多的針葉樹種紅檜(Beniki),其次依序是臺灣扁柏(Hinoki,亦即 黃檜)、鐵杉、華山松與臺灣杉,有「阿里山五木」之稱。\n坐落在山腳下的嘉義,就成為林木開採後重要的集散與加工地;沿著運輸 林木的阿里山林業鐵路一路下山,到達平地的北門車站一帶,就匯聚了許 多製材加工廠,而有「檜町」之稱。因此木材的使用也深入當地民眾的生活, 有「木都｣美名的嘉義,在當時也興建了大量的木造建築。","wiki":"","attachments":["PXL_20211120_055532559.jpeg"]},{"id":"recxKz7JpTW3zBx5z","name":"1624 明天啟元年(17世紀)","notes":"1624 明天啟元年(17世紀)\n嘉義一帶為平埔族諸羅山社的區域,1624年荷蘭人以「荷蘭東印度公司」 之名占據臺灣,開始加強經營。荷蘭古文書及地圖上,將嘉義地區的原住 民村社稱之為「Tirosen(或為Tirocen、Tiracen)」社。\n17th Century: In 1624 the Dutch took Taiwan under the name of the Dutch East India Company, and began to increase operations in the area. Old Dutch documents and maps show the indigenous village in the Chiayi area as the \"Tirosen (also Tirocen or Tiracen) \" settlement.","wiki":"","attachments":["PXL_20211120_052724393.jpeg"]},{"id":"recxPB8O8gi4PJ2Tg","name":"木材聲學特性","notes":"木材聲學特性\n木製樂器因為材質特性具有彈性,所含 纖維也有吸音的效果,因此會過濾掉較 尖銳的音頻,反射出較柔和優美的聲 響。反之,如果使用水泥、石材或金屬等 材料,則會將聲音直接反射,聲響不如 經過木製樂器過濾後再反射般優美。\n此處展出的「源吉他」,是以國產材相思 木為木料開發的工品牌「蛋牌」所設 計的手工吉他。其中,愛心造型的響孔 會使高頻、中頻音更為集中;側板與面 板之間使用1公厘的結構接合;而使 用高硬度蛇紋木製成的琴橋則能提高 琴弦振動的傳導性。\nPLEACE DO NOT","wiki":"","attachments":["PXL_20211120_055947405.jpeg","PXL_20211120_055952822.jpeg"]},{"id":"recxXV1Tmz2zJ4s3Q","name":"畫會","notes":"畫會\nPainting Association\n日治時期的教育政策,「藝術」為其中的一環,西畫、膠彩 畫,透過國民教育體系,被引進一般課程中,成了當時臺灣 藝壇的主流。\n另外民間流行以畫會的組成,相關愛好者聚集討論畫作、切 磋畫技,彼此吸收、互動、相輔相成,並舉辦展覽、競賽 等,也無形中提升畫家們的社會地位,喚起大眾對於美術文 化的重視。\nIn the educational policies during Japanese rule, \"art\" was one of the elements. It was included in general courses. In civil painting association, enthusiasts gathered to discuss paintings, techniques, and hosted exhibitions and competitions. This intangibly upgraded the social status of painters, and emphasized the value of art culture for the people.\n奉祝展覽會紀念照於嘉義公會堂\n後排左起:池田憲男、石山定俊、翁崑德、戴文忠、黃水文、李秋禾、莊鴻運、宁 前排左起:林榮杰、發混輝、陳澄波、張李德和、矢澤一義、林玉山、蔡欣動\n\n《庭園春暖全家慶五德金雞入畫圖》,多人共筆水墨畫: 林玉山、曹根、黃鷗波、張權、劉耕谷、郭東榮。 民國82年(1993),嘉義市立美術館典藏。","wiki":"","attachments":["PXL_20211120_061538348.jpeg"]},{"id":"recygp7yTnLoT3RhG","name":"日本柳杉","notes":"日本柳杉\n【學名】Cyptomeria japonica | 杉科日本柳杉屬|針葉樹 【通稱】Japanese Cedar\n高度達40公尺,胸徑多在5公尺內,是日本特有種,也是主要造林 樹種。屬於較柔軟的針葉木,心材從淺紅褐色漸層至深褐色,與邊 材界限明顯。分布區域北從青森縣、南至九州屋久島,在廟宇、神 社內也很常見。日治時期引進臺灣的是原產於奈良的吉野柳杉, 特徵是心材顏色深沉偏黑","wiki":"","attachments":["PXL_20211120_060209885_MP.jpg"]},{"id":"recz42yQprCQoldAJ","name":"鹿寮里菸樓模型","notes":"鹿寮里菸樓模型\n菸樓始於日治時期,是貯藏菸草和烘製菸草 的建築,目前嘉義市尚存一棟位於紅毛埤之「 宋氏菸樓｣。此模型為大阪式菸樓形式,又稱 做「太子樓｣。由模型得以看到菸樓空間分為 乾燥室,調理空間,儲藏空間等三部份,精細 的構造令人嘆為觀止。早期嘉義菸葉廠最初 興建於1939年,當時名為專賣局嘉義支局「 北社尾葉菸草再乾燥工場」,從事菸葉除骨、 複薰等加工作業。「臺灣省菸酒公賣局嘉義菸 葉廠」於1947年(民國36年)列入臺灣省政府 編制,並改名「臺台灣菸酒公賣局」並於2002 年被裁撤,日治時期所興建的木造廠房,仍部 分保有日治時期的廠區配置空間,時稱「嘉義 菸廠」,為臺灣五大菸廠之一,於2019年12月 被登錄為嘉義市歷史建築。\n2020年,嘉義市政府文化局收藏","wiki":"","attachments":["PXL_20211120_054338551.jpeg"]},{"id":"reczBnaE2GpT8qI8w","name":"北回歸線 太陽館 Tropic of Cancer Solar Exploration Center","notes":"北回歸線 太陽館 Tropic of Cancer Solar Exploration Center\n北回歸線是太陽在北半球能夠垂直照射、距 雞赤道最透的位置點,約在北緯23.5度,在 臺灣設有標誌的地點有:嘉義縣水上鄉、花 蓮縣玉穗鄉與發濱鄉。嘉義縣水上鄉下寮村 自明治41年(1908)起即設立標塔成為觀光 景點,目前太空网浮外型的「北回歸線太福 館」,為第六代的建築體,內部以天文星象 等知識作為展覽主題\nThe monument erected in 1908 in Xiliao Village, Shuishang Township, Chlayl County became a tourist attraction. The current UFO shaped building of the Solar Exploration Center is a sixth generation building. and inside astronomy and astrology serve as exhibition themes","wiki":"","attachments":["PXL_20211120_054420065.jpeg"]},{"id":"reczEiyZAtvjraBV4","name":"1949年國民政府轉進臺灣,國軍與眷屬在此落地生根","notes":"1949年國民政府轉進臺灣,國軍與眷屬在此落地生根 嘉義市前後建有眷村計30餘座,2004年起因改建政策, 逐漸拆除、搬遷;雖然景物已逝,然眷村生活樣貌已是嘉 義人共同的生活記憶。\n本模型以嘉義市東門町「建國二村」為基礎,房舍多 為木造宿舍型態,眷村居民來自大陸各省份,不同的語言 及飲食文化,融合出眷村多元的生活樣貌,豐富精彩。","wiki":"","attachments":["PXL_20211120_053704555.jpeg","PXL_20211120_053631051.jpeg","PXL_20211120_053657639.jpeg"]},{"id":"reczWUpwNCZub1SES","name":"古城 風貌 Style of the Old Town","notes":"古城 風貌 Style of the Old Town\n嘉義市市鎮範圍較小,保留的古蹟與歷史 建築,分佈密度相對較高。受到保護的古 蹟與歷史建築,有的因其獨特的建築主體 與工法,或是無法取代的歷史價值與定位 而被留下。每一棟建物都是珍貴的文化資 產,除了調查、研究建構歷史脈絡之外, 主管單位運用不同的修復與營運方法,與 民間共同參與推動,進行永續的古蹟保存 與活化工作。探訪這些地點,將能深入領 略嘉義市鎮的歷史演變與人文風貌。\nChiayi City is quite small, but it has a dense distribution of preserved historical sites and buildings. Sites and buildings are protected because of their unique features and construction methods, or for their irreplaceable historical value and location. Visiting these sites, one can really appreciate Chiayi's historical development and cultural atmosphere.","wiki":"","attachments":["PXL_20211120_052953946.jpeg","PXL_20211120_052959293.jpeg"]},{"id":"reczib3hZvLKhq8Uh","name":"木建材的種類","notes":"木建材的種類\n森林裡的木頭並不是砍下馬上就能使用, 砍下來的木頭斷面不一,必須經過一系列 程序的加工,才可以製成應用於木造建築 中的建材唷!\nStep 2\n製材 自林地運出的原木,先去除分校 後,鋸裁成角材或板材,裁切時 將原木可利用的體積最大化。\nStep 3 乾燥\nstep1 砍伐\n在林地伐木、採收下來的樹幹便稱為原木, 直接運送到木材加工廠,\n期砍伐好的木材含水量高,容易造 成熱脹冷縮導致的變形問題,因此 必須先進行乾燥處理後才能使用。 將裁製好的板材、角材放置通風處 堆疊成線狀,自然乾燥;乾燥後的 木頭相對穩定且耐用。\nStep 4 分等\nStop 5 膠合\n乾燥後的木材。依據結構強度,使用目的與木 材的材料品質來分辦。\n分等後的木材,將尾端切成鋸齒就來接合船後兩段,並在接合 面上水面。這個方法可以讓小徑木也能構成大斷面的構件。","wiki":"","attachments":["PXL_20211120_055848153.jpeg","PXL_20211120_055851987.jpeg","PXL_20211120_055903496.jpeg"]}];
