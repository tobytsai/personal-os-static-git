"use strict";
const records=[{"id":"rec0XyVITBWd2FwTr","name":"楓木 Acer spp","notes":"楓木 Acer spp\n產地\n分布於北美中部至東部,大多產於\n顏色\n海拔1800公尺以下區域\n木材色為略偏橙色調的麥芽糖色,\n年輪不明顯,木肌緻密\n帶有淡淡楓糖香\n香氣\n特性\n容易加工、質地輕盈柔軟\n常用於家具材、化妝板(註)","wiki":"","attachments":["PXL_20211120_055453195.jpeg"]},{"id":"rec0ZNDINcpxdLNVH","name":"經濟產業","notes":"經濟產業\nEconomy and Industry\n嘉義市東傍阿里山山脈,西面臺灣海峽,南接八掌溪 北鄰牛稠溪,屬於嘉南平原的北端,南側北回歸線通 過,氣候溫暖、少雨。總面積約60 平方公里,在臺灣 22 個直轄市、縣(市)中,排名第21,僅大於連江縣。 因幅員狹小,被嘉義縣包圍,不論在歷史文化、經濟產 業或自然環境等各方面,與嘉義縣關係緊密。\n嘉南平原的農業、糖業,阿里山林業,皆以嘉義市為 集散地,人口聚集,帶動經濟、產業、都市的發展,為 雲嘉地區商業及生活的中心。\nChiayi City neighbors Alishan (Mt. Ali) to the east, and the Taiwan Strait to the west. It is at the northern extremity of the Chiayi-Tainan Plain, and the Tropic of Cancer passes through its southern end, so the climate is warm with little rain. The city's area is comparatively small, and it is encircled by Chiayi County, so it has a close relationship with Chiayi County on all sides. The agriculture and sugar industries of the Chiayi Tainan Plain and Alishan's forestry industry all use Chiayi City as their distribution center, forming the core of local industry and livelihood in the Yunlin and Chiayi area. 雲林縣\n大林舗\n南投縣\n新港鐵\n東石鄉\n東區\n朴子市\n水上地\n攤路總\n阿里山路\n區 預袋鎮\n申请鑑\n臺南市\n高雄市","wiki":"","attachments":["PXL_20211120_051524839.jpg"]},{"id":"rec0gWOqyw4usA1yg","name":"1947 民國36年","notes":"1947 民國36年\n228 事件爆發,嘉義市參議會議員潘木枝、盧炳欽、柯麟、 陳澄波等人,與軍方談判而受到逮捕拘禁,於3月25 日在嘉 義火車站前被槍決身亡。\nAfter the 228 incident, Chiayi members of the Provincial Assembly Pan Mu-zhi, Lu Bing-qin, Ke Lin, Chen Cheng-po etc., were arrested after negotiating with the military. On March 25th they were executed in front of Chiayi Railway Station.","wiki":"","attachments":["PXL_20211120_052816911.jpeg"]},{"id":"rec0wpxzDdQt2ActN","name":"城隍廟","notes":"城隍廟\n從紅毛井到城隍廟這一帶有著古城的氣息,城 隍廟在康熙54年(1715)由諸羅知縣周鍾瑄 發起募款創建,也是清代臺灣唯一因保護城池 而於光緒元年(1875)被皇帝敕封為「綏靖」 的縣級城隍。","wiki":"","attachments":["PXL_20211120_051812532.jpeg"]},{"id":"rec1GniIRVeatazh6","name":"嘉義市 史蹟資料館","notes":"嘉義市 史蹟資料館\nChiayi City Historical Relic Museum\n原為昭和18年(1943)落成的「原嘉義神社附屬館所」裡的 齋館與社務所。戰後,嘉義神社改為忠烈祠,附屬館所挪為 「國軍828醫院」 1987年醫院他遷後,附屬館所由嘉義市 政府接管,並進行修復。1998年公告為市定古蹟,2001年 活化利用為「嘉義市史蹟資料館」,2018 年委外經營,以 「昭和J18」為品牌,打造一個結合神社文化、文創、餐飲、 主題特展之複合式場館。\nThe Museum was originally the Dining Hall and Shrine office of the Chiayi Shrine, which were completed in 1943. In 1998 it was assigned as a historical site, and from 2001 operated as \"Chiayi City Historical Relic Museum\". In 2018 it was privatized, using the brand name Showa J18, and became a combined venue for cultural, culture and creative, culinary, and special themed exhibitions.\n大正時期的嘉義神社 《瑪蓉寫真一》,民國90年(2001),高振興提供。","wiki":"","attachments":["PXL_20211120_054345989.jpeg"]},{"id":"rec1SP8vzC70IelzF","name":"工程木材的種類","notes":"工程木材的種類\n在現代木造建築的世界中,使用的木材可分為 幾種不同的種類。集成材、CLT、LVL或是家 具常用的合板,分別是代表什麼意思呢?\n集成材 GLT\n集成材\nGlutam Glued Laminated Timber\n平行银合\n將原木削切為2~3公分厚的角材或板材後,將木纖維 以平行順紋的方式理合。\n直交集成板\nCLT Cross Laminated Timber\n角材或板材\n直交集成材 CLE\n將原木削切為2~3公分厚的角材或板材後,將木纖維 以直交/鐵櫃的方向證合,又稱為「縱橫多層次實木 結構積材」。相較於集成材在單一方向展現強度, CLT木材可在兩個方向呈現強度。通常用來做板或牆 等結構單元。\n直交聯合\n單板層積材 LVL\n平行银合\n單板層積材 LVL Laminated Veneer Lumber\n木鈴薄板\n將原木旋切為3~4公釐厚的木飾薄板後,將木纖維以平\n行順蚊的方式融合。依用途還可再分為結構支撐用以及\n室内装修使用。\n合板 Plywood\n合版 Plywood\n原木\n直交腰合\n將原木旋切為3~4公釐厚的木飾薄板後,將木塊堆以 直交/縱橫的方式膠合。尚可依據用途與加工處理細 分為普通合板、特殊合板,結構用合板。","wiki":"","attachments":["PXL_20211120_055844057.jpeg"]},{"id":"rec1gZtuOvZqp9v6u","name":"手工汽水 Handmade Soda","notes":"手工汽水 Handmade Soda\n嘉義市仍有少見的「手工汽水」攤車汽水伯,在杯中放 入碎冰、原味汽水、加上不同口味的濃縮果漿,就成為 古早味手工汽水。早期尚無便利商店、手搖茶飲也未問 世,簡單的街頭攤車提供時髦、新奇的飲料,豐富民眾 的味覺感官。現在仍能喝到當時的純樸味道,除了味覺 享受之外,更增添光陰的滋味。\n除了手工汽水之外,嘉義市街頭仍可看到一些傳統的小 米、狀元糕等,雖然沒有光鮮亮麗的店面,但是傳統實 在的口味,充滿嘉義人的回憶。\n推車攤販,綠豆粉粿、杏仁露、車輪餅、雞蛋糕、烤玉\nChiayi City still has a few \"handmade soda\" carts pushed around by \"Soda Uncles.\" Crushed ice is placed in a cup, then original flavor soda and concentrated fruit syrup of different flavors added to make old-style handmade soda. As well as handmade soda, the streets of Chiayi City still have vendors selling green bean jelly, almond soup, wheel biscuits, egg cake, roast sweet corn and top scholar cake from carts they push around. They don't have a fancy store but these traditional flavors are part of the collective memory of Chiayi people.","wiki":"","attachments":["PXL_20211120_053209738.jpeg"]},{"id":"rec1u9rGZwwVaV8t4","name":"眷村 Military Dependents' Villages","notes":"眷村 Military Dependents' Villages\n民國 38 年(1949)中華民國政府撤退到臺灣,大批政 府軍、公、教人員與其眷屬抵臺,政府機關於全臺中心 城市及軍事設施附近,興建或配置「眷村」解決住居的 需求。嘉義市最早的眷村為當時東門町原日本軍官宿舍 (陸軍「復國新村」、空軍「建國二村」舊址),之後 依需要陸續興建、整併,前後約有30餘處,概有空軍、 陸軍、聯勤、憲兵等,現已逐漸改建搬遷。目前,嘉義 市只剩下部份老眷村的建築,隨著時間演進,「眷村」 已成為獨特的文化資產。\nWhen the National Government withdrew to Taiwan in 1949, a large number of soldiers, civil servants and teachers and their families came to Taiwan. The earliest such villages were at the Japanese Officers' Dormitories at Dongmending (Army National Restoration New Village and Air Force National Construction 2nd Village); in all there were about 30 military dependents' villages; most have been demolished and redeveloped. Today, only parts of military dependents' settlements remain in Chiayi. As time has passed, they have become unique cultural heritage.","wiki":"","attachments":["PXL_20211120_053607059.jpeg"]},{"id":"rec23TltRz7DHMT0O","name":"森林裡的樹","notes":"森林裡的樹\n森林裡所種植的各式各樣樹種,並不是每一種樹都適合作為 木構造建築的材料。哪些樹是木構造建築常用的呢?以下介 紹臺灣常用於建築構造的樹木,一起來看看這些樹木各有什 麼樣的特徵吧!","wiki":"","attachments":["PXL_20211120_060145811_MP.jpg"]},{"id":"rec2M6gf9EKa0SVZE","name":"2020 民國109年","notes":"2020 民國109年\n嘉義市以「家意-以城為家City as Home」策展概念成功取得「2021年 臺灣設計展」的主辦權,以此號召全台之設計、建築、環境等藝文專業 人才,以嘉義市為核心,進行踏查研究,進而以設計策展為手法,呈現 嘉義市之城市建設、文史藝術、友善生活、宜居環境、產業發展等多元 面向。\nChiayi city won the right to host the 20201 Taiwan Design Expo with the theme \"Chiayi-City as Home\"\n土地銀行","wiki":"","attachments":["PXL_20211120_052850882.jpeg"]},{"id":"rec2jkj1hcdkkTk1l","name":"涼麵 Cold Noodles","notes":"涼麵 Cold Noodles\n偏向熱帶型氣候的嘉義市,清爽的涼麵是四季熱賣的小 吃,有別於其他地區不同的涼麵作法,也是觀光客踴躍 嘗試的體驗。嘉義涼麵使用白色的寬扁麵,以芝麻醬為 主要的調味,加上一大勺「白醋」(美乃滋之臺語)才 是嘉義道地的吃法。「白醋」增加醬汁的黏稠度,讓麵 條更容易沾裹醬料。配料以小黃瓜絲為多,新潮的店家 則加上五顏六色的蔬菜絲,增添視覺與口感的豐富度。 販賣涼麵的店家,通常會提供免費的麥茶,讓顧客飲用 解膩。\nChiayi's distinctive cold noodles feature white flat noodles with sesame sauce as the main flavoring and a large spoonful of \"white vinegar\"(mayonnaise in Taiwanese) on top. The mayonnaise increases the stickiness of the sauce and allows it to stick better to the noodles. The other ingredients are mainly cucumber shreds. More fashionable restaurants use vegetable shreds of different colors. Restaurants that sell cold noodles usually provide free barley tea to cut through the greasiness of the noodles.","wiki":"","attachments":["PXL_20211120_053109996.jpeg"]},{"id":"rec2kd9qPL9jKdCV2","name":"國際管樂節 aga International Band Festival","notes":"國際管樂節 aga International Band Festival\n「嘉義市國際管樂節」自1993年起連年舉辦,為全國歷史悠久 的城市音樂節慶,累積了厚實的音樂文化内涵。以「全民瘋管 樂,就是要你管」的核心理念,讓管樂表演成為市民生活的一 部分,讓欣賞音樂成為一件很自然的事。透過音樂藝術的潛移\n默化,傳達「文化生活」的價值。 活動舉辦迄今,逐年提升市民人文素養、建構在地文化認同、 打造城市文化品牌、帶動地方觀光發展,成功將嘉義市營造成 為臺灣的「人文城市管樂之都」,\nChiayi City Intermational Band Festival has been an annual event since 1993 and\nis the oldest city music festival, accumulating abundant music culture meaning. With the core idea of feveryone wild about wind music, e want you to care\", music performance becomes part of people's lives and enjoyment of music natural. The value of \"cultural le\" is subtly conveyed through music art. Year by year, the festival has raised the cultural level of citizens, built local cultural\nidentity, created a city cultural brand, driven local tourism development and has\nsuccessfully made Chiayi City becomes Taiwan's \"culture city and music capital\".","wiki":"","attachments":["PXL_20211120_061704220.jpeg"]},{"id":"rec2uegXxkw2tFKT3","name":"二萬平車站 日落雲海絕景","notes":"二萬平車站 日落雲海絕景\n因地勢寬廣而得名,是觀賞塔山磅礴山勢 的最佳地點,當雲海充塞山谷、夕日緩緩 下沉時,瞬息萬變的景象,堪稱絕景。\n祝山\n2216m\n2274m\n2451m\n多林車站 鄒族原鄉秘境\n對高岳\n林鐵全線最有秘境感的車站,鄒語地名 「哆囉嗎」,意為茂密的森林。站體有著 鄒族彩繪,步行30分鐘即可抵達臺版合 掌村「得恩亞納部落」。\n阿里山\n2000m\n2405m\n2138m\n二萬平\n神木\n二萬平雲海\n1516m\n1403m\n1711m\n0000\n1534m\n第一分道、第二分道\n奮起湖車站\n老街傳奇\n阿里山火車碰壁\n過去列車會在中午左右於此交會,進行加 水、添煤,並設有車庫進行維護、檢修,是林 鐵中途最大的車站。\n由於環繞爬坡的空間不足,過了 屏遮那車站後,列車會原地轉換 方向,持續爬升,此種鐵道工法即 為｢之字形折返路線」。\n由於林鐵興盛,奮起湖聚落也隨之發展, 成為鐵路沿線最熱鬧的交通集散地,以老 街、便當和四方竹聞名。老街從鐵路向下 延伸,石階步道一層接一層,氛圍十足, 周圍則以「杉林棧道、奮起步道、木馬棧 道｣3條步道連成一圈,讓旅客近距離體 驗森林。\n十字路車站 部落入口\n舊時古道和通往周圍部落通道的交叉點, 也是今日林鐵和阿里山公路的最接近的 地方,重要性可見一斑。下車走走,可以到 返鄉青年開設的店家,品嚐用新鮮在地食 材烹調的美食。\nForest Railway Alishan\n十字路和二萬平車站之間的 42號隧道施工中,由嘉義 出發的列車,僅行駛至十字 路車站。\n縣定古蹟","wiki":"","attachments":["PXL_20211120_054546841.jpeg"]},{"id":"rec3IyWTtpOwoCcb6","name":"SHERPA木構造建築接頭系統","notes":"SHERPA木構造建築接頭系統\n來自奧地利的SHERPA木構造建築接頭系統,概念 是基於一個非常簡單、巧妙與創新的想法:將兩個 鋁製元件以燕尾形接頭相互嵌入,達到接頭系統的 標準化。利用SHERPA木構造建築接頭系統,可將 木結構建築組裝標準化,縮短施工時間,提高競爭 力。這個系統經歐盟EOTA(註)認證,可提供最大的 安全性。本次展出的SHERPATREE,演示了 SHERPA木構造建築接頭系統的基本概念:不同的 構件尺寸、不同的荷重條件、不同的接合角度,都 能以同一方式將構件結合在一起。 (展品提供:交泰興股份有限公司)\n註歐盟EOTA:歐洲技術評估組織是歐洲的非營利性協會,其 主要目的是起草歐洲技術評估文件,一旦獲得批准,這些將 成為歐盟標準。","wiki":"","attachments":["PXL_20211120_060046294.jpeg"]},{"id":"rec3ukk2VuSji45r0","name":"臺灣柳杉","notes":"臺灣柳杉\n【學名】Cryptomeria japonica | 杉科柳杉屬|針葉樹 【通稱】Taiwan Cedar\n在原產地高度可達40公尺,胸徑約在2~5公尺間。樹幹通直,枝 條稍上舉,螺旋狀隨意分枝,排成圓柱狀;樹冠圓錐狀,至樹間呈 尖塔形狀。高速成長期約15~20年。臺灣柳杉是從日本引進移 植,由於緯度較低、生長快速,硬度也較日本柳杉低。生長於中海 拔500~1800公尺間,為常見造林樹種。","wiki":"","attachments":["PXL_20211120_060202525.jpeg"]},{"id":"rec3vQUIAnkPW3WG4","name":"百年林鐵 療癒體驗","notes":"DL-42\n百年林鐵 療癒體驗\n阿里山林業鐵路通車於1912年,至 今已逾百年歷史。日治時期,臺灣 總督府為載運阿里山林區的木材, 建造了這條鐵路,成為嘉義山區的 交通大動脈,扛起了運送沿線居民 •旅客、貨物的責任,以林業帶動 嘉義的都市發展。\n林鐵文化資產價值⊙\n獨立山螺旋\n今天,您可以搭乘這條與時俱進的 林業鐵路,慢活探索沿途風光, 感受聚落村莊的精采魅力、尋覓難 以抵達的秘境車站、欣賞車廂窗外 的林相變化、體驗登山鐵路的興建 技術,一覽阿里山林業鐵路的文化 價值與珍貴景觀。\n2 762mm 窄軌小火車\n環繞獨立山3圈, 爬升200公尺後以 「8」字形離開, 可在同一處看到火 車4次。\n使用窄軌和輕量化車 廂,以利爬坡轉彎, 名列亞洲海拔最高的 窄軌登山鐵道。\n林鐵 數护\n180度大彎道\n阿里山火車碰壁\n以180度大彎增加 爬坡距離,降低爬 升坡度。\n通車年|1912年/嘉毅一二萬平 主線總里程 | 71.6公里/嘉義一阿里山\n海拔最低點 | 30公尺/嘉義站:\n海拔最高點 | 2451公尺/祝山站\n車站數 | 20站\n機車數|復駛蒸汽機車3輛/現役柴油 主線鐵樑數|74座\n機車22輛\n主線隧道數 | 48座\n由於山地腹地不足 ,因此以「之」字 形讓火車一進一退 ,繼續爬升。\n5 最會爬坡的蒸汽機車SHAY 通車時即自美國引入Shay蒸汽機車頭,以直立式汽缸 著稱,爬坡能力強。","wiki":"","attachments":[]},{"id":"rec3yIfvbblxSHpgz","name":"展望諸羅","notes":"","wiki":"","attachments":["PXL_20211120_050911529.jpg"]},{"id":"rec40nf4FJtgl0eE8","name":"1970 民國59年","notes":"1970 民國59年\n時任嘉義市長的許世賢,在拓寬中山路時將圓環改建為七彩 噴水池。因四通八達且空間廣闊的優勢,成為嘉義市在選舉 投票的前夜,各黨派候選人最後造勢聚集的場合。\nWhile widening Zhongshan Road, Mayor Hsu Shih-hsien transformed the circle into a multicolored fountain.","wiki":"","attachments":["PXL_20211120_052823614.jpeg"]},{"id":"rec4OYsUhfkiTQdAN","name":"南北雜貨 Groceries and Dry Foods","notes":"南北雜貨 Groceries and Dry Foods\n嘉義東市場的起源可追溯至清末,因靠近梅山、阿里山 山區,為蔬果下山集中的市集,早期又稱為「草市」 市場內有許多南北雜貨店家,販售各式醬菜、五穀雜 糧、自製乾物、調味醬料等。隨著年節、歲時改變,也 提供相對應的應景食材、食品 嘉義地區的特色農特 產,更是店中的一大特色。筍乾、酸筍、醬筍、筍絲等 各式筍類加工品,佔了店面大半;梅山特產的醃梅、蜜 餞等,傳統古法醃漬的破布子、蔭瓜、蘿蔔、豆豉、酸 菜等不勝枚舉。當地的醬料產品、調味料,也可在此購 買。走一趟市場,堪稱走進了嘉義人的廚房。 。\nChiayi East Market dates back to the Qing dynasty. It was once known as Cao Market as it was a distribution center for fruit and vegetables due to its proximity to Alishan (Mt. Ali) and Meishan (Mt. Mei). The market has many stores selling goods from north and south, various sauces, grains, self-made dried foods and flavorings. Entering the market is like going into the kitchen of a Chiayi resident.","wiki":"","attachments":["PXL_20211120_053224991.jpeg"]},{"id":"rec4TrHTp2XcH2t4W","name":"嘉義製材所","notes":"嘉義製材所\n碳儲存量\n109,760kg=172棵柳杉\n木產業的第一站 (公部門)|\n1914年完工啟用\n有「東洋第一製材所」美名,是日治時期日本政府轄下佔地範圍最 廣的官營木材產業園區,採用當時歐美最先進的設備。第一代製 材所創建於1914年;現為重建於1942年的第二代,包括園區裡 的機具工廠與辦公室等均為木構造建築。阿里山的木材就在這 裡加工後運輸至國外,因此也是嘉義連結世界的重要節點。","wiki":"","attachments":["PXL_20211120_055607315.jpeg"]},{"id":"rec4ptQh4gSqorkfx","name":"阿里山開發年表","notes":"阿里山開發年表\n1896\n阿里山發現大片密林及針葉林\n1904\n阿里山鐵道定線,提出詳細經營計劃\n1906\n發現巨大檜木,奉為「神木」\n1910\n阿里山森林官營計劃預算通過\n1912\n購入美國製造的集材機,進入機械化集材\n詳細年表\n1914\n嘉義製材工場開始運作,翌年貯木池完工\n請掃描QR Code\n1927\n阿里山入選臺灣八景之一\n1945\n臺灣光復,設立林務局接收日治時期山林課業務\n1956\n阿里山神木遭雷擊起火\n1963\n玉山林管處結束直營伐木,阿里山鐵道改客運為主\n1978\n林場線鐵路全面停止通車\n1982\n阿里山公路通車\n資料來源\n《發現一百年前的阿里山》,蔡榮順,金龍文教基金會出版,2004;林務局網站","wiki":"","attachments":["PXL_20211120_060139215_MP.jpg"]},{"id":"rec58ZUxarwssQ8wt","name":"1931 昭和6年","notes":"1931 昭和6年\n\n嘉義縣改為嘉義支合併為嘉義縣,縣治設「臺南州立嘉義農林學校」(今國立嘉義大學)於昭和3年 (1928)成立野球部(棒球隊),昭和6年(1931)「嘉義 農林棒球隊」(簡稱嘉農 KANO)即奪得全臺高校棒球冠 軍,代表臺灣赴日參加第17回夏季甲子園(日本全國中學 棒球錦標賽),獲得亞軍載譽歸國。\neki, ceding Taiwan to Japan.\nand was governed by Tainan\necture to form Kagi (Chiayi)\ns changes to administrative\nChiayi Agriculture and Forestry Baseball Team (KANO) represented Taiwan at the 17th Summer Summer Köshien (Japan's national middle school baseball championship). They won second place and returned home to great acclaim.","wiki":"","attachments":["PXL_20211120_052812982_MP.jpg"]},{"id":"rec5DHZlPf6u0XXSr","name":"木材 的千變萬化","notes":"木材 的千變萬化\n木的特性\n蓋一棟木造建築時,建築就必須擔負起保護的功能,讓居住在其中的人們能夠安 心。那麼,在建築中,建材需要有哪些功能?而木材具有哪些特性,是適合作為建材 呢?這些特性是否也影響到使用的方式與表現?讓我們從木材的性質談起,看看木 材為什麼是一種值得推薦的建材。\n樹的橫切面\n微管束\n春材(早材)\n木材内部有很多導管進行水分輪導, 提供生長所需的養分,這些導管就叫 作微管束,功能跟我們喝飲料的吸管 很類似。\n在生長季節之初,生長速度較快,細 胞較大而壁薄,顏色較淡,材質粗糙, 比重小,稱為春材或早材。\n秋材(晚材)\n於生長末期,樹木的形成層活動 逐漸休止,此時生長緩慢,細胞 較小而壁厚,顏色較濃,材質緻 密,比重大,稱為秋材或晚材。 此生長週期速度的差異則會形 成年輪,通常年輪越密,木材之 比重及強度愈大。\n邊材\n心材\n是樹木外側的新生木質部,為主要運 送水分與養分的管道,含水量較高, 一般而言顏色較淡。\n心材為老化的邊材逐漸轉化而成的樹 木脊柱,基本由死细胞構成,已不具有 運輸功能,含水量低,顏色也較深。","wiki":"","attachments":["PXL_20211120_055925017.jpeg","PXL_20211120_055929432.jpeg"]},{"id":"rec5Iv02vDLY53uGw","name":"1895 明治28年","notes":"1895 明治28年\n清朝簽訂馬關條約,將臺灣割讓給日本,嘉義縣改為嘉義支 廳,由臺南縣管轄。1897年與雲林支廳合併為嘉義縣,縣治設 於嘉義,而後行政區一再變更。\nThe Qing government signed the Treaty of Shimonoseki, ceding Taiwan to Japan. Chiayi County became Kagi (Chiayi) Subprefecture, and was governed by Tainan County. In 1897 it was merged with Yunlin subprefecture to form Kagi (Chiayi) County, governed from Kagi (Chiayi) City. Numerous changes to administrative districts followed.","wiki":"","attachments":["PXL_20211120_052800900.jpeg"]},{"id":"rec5o6eJtKTlUzzL9","name":"嘉義舊監獄 Chiayi Old Prison","notes":"嘉義舊監獄 Chiayi Old Prison\n大正11年(1922)完工啟用,為臺灣唯一保存完整的日治時 期監獄建築,民國94年(2005)由內政部公告為國定古蹟。 監獄房舍空間配置採放射狀扇形設計,便於防止獄犯逃脫與 管理,並符合通風、採光、防潮與巡邏等需求。監舍、中央 臺、行政區大致保留原有形貌,門窗、壁板材料大多使用阿 里山檜木,特別要求堅固、耐用及防逃逸等專業施工,為全 世界目前僅存的兩座「賓夕凡尼亞式」監獄之一。\nThe prison was completed and began operation in 1922. It is Taiwan's only Japanese prison remaining intact. The prison building uses a radial circular design, which made it easy to supervise and prevent prisoners escaping, and met the requirements of ventilation, lighting, damp prevention and patrolling. The specially constructed doors, windows and walls are mostly made from Alishan cypress, as they required especially hard and durable wood to prevent escape.","wiki":"","attachments":["PXL_20211120_054437513_MP.jpg"]},{"id":"rec5tH5XrwKj0toIr","name":"1912 大正元年","notes":"1912 大正元年\n阿里山森林鐵道完成,鄰近嘉義市立博物館的北門驛為林鐵起 點,原木運抵平地初步整理、製材後,再透過嘉義火車站由縱 貫線運至各大城市或港口出口。\nAlishan Forest Railway was completed. The forest line started at Beimen Station near Chiayi Municipal Museum. After transportation and initial sorting and processing of the lumber, they would pass through Chiayi Station and on to major cities and ports via the Main Line.","wiki":"","attachments":["PXL_20211120_052805091.jpeg"]},{"id":"rec5uOC9RXZSoM5G3","name":"山毛櫸木 Fagus sylvatica","notes":"山毛櫸木 Fagus sylvatica\n產地\n顏色\n有產於歐洲瑞典南部到義大利中部的\n歐洲山毛櫸,亦有原生於日本與美 國的品種,分布海拔約在600~1800\n公尺區間\n木材呈現帶有紅色調的奶油色,邊材\n與心材分界模糊,紋理極細,帶有 芝麻般的斑點\n氣味微弱,有類似蠟燭的氣味 重量較重、材質堅硬但卻富有彈性,\n乾燥後木材性質穩定,硬度適中容\n易加工\n常製成家具或地板,由於韌性較高, 也常用於兒童玩具","wiki":"","attachments":["PXL_20211120_055435076.jpeg"]},{"id":"rec67hmy1FZBkfitk","name":"十字街","notes":"十字街\n根據康熙 56 年(1717)《諸羅縣志》所載之 「縣治圖」,城牆外觀為明顯木柵,連接東 西、南北四座「城柵」交會的街道為「十字 街」,交會處偏向西柵,約是現在公明路與吳 鳳北路交叉路口。","wiki":"","attachments":["PXL_20211120_051822081.jpeg"]},{"id":"rec69j61abYXGm4c2","name":"胡桃木 Juglans nigra","notes":"胡桃木 Juglans nigra\n產地\n顏色\n多產於北美西海岸地區,分布海拔 約為1600~2400公尺\n鼠灰色底夾雜黑色、深綠或紫色, 木紋通直、帶有各式各樣的瘤紋, 特別是接枝後的胡桃木會有大理石\n瘤紋\n香氣\n特性\n加工時能聞到淡淡甘甜香氣\n木性平實,容易加工\n常用於製作家具、高級裝潢材、化 妝板 (註)","wiki":"","attachments":["PXL_20211120_055447314.jpeg"]},{"id":"rec6EHDDe9yAAOUmG","name":"儲碳城市的誕生","notes":"儲碳城市 的誕生\n砍樹如何救地球\n碳的儲存與循環\n樹木在生長過程中會進行光合作用吸收二氧化碳、釋出氧氣,碳在樹體內 會以有機形式固定、儲存下來,因此森林是優良的固碳基地。一般而言,幼 齡樹因光合作用活性較強,固碳能力也較成年樹優異。\n若將人工林中的樹砍下作為建材使用,就能讓碳繼續在木材中維持儲存狀 態;當木材被用來蓋木屋,這種碳儲存的狀態就能繼續跟著木屋一起維 持約30~50年。當木屋朽壞,木建材能透過分解膠合技術再製成木家具, 繼續延續木材壽命;當木家具用壞了後,還能繼續拆解成更小的木材製品。 透過這樣的使用循環,碳被儲存在木材中的時間就能盡可能地延長。\n只要在砍下樹後的空地繼續植樹,就能開啟新一輪的固碳循環了。\n註幼齡樹:樹木生長到開花結果的成年期。 成年樹:開花結果之後的樹木。","wiki":"","attachments":["PXL_20211120_055519610.jpeg"]},{"id":"rec6XYNQtcS5YzBgo","name":"1989 民國78年","notes":"1989 民國78年\n臺灣第一座228紀念碑在嘉義市落成,位於彌陀路忠義橋橋 頭,2017年因道路拓寬計畫,將紀念碑遷移至垂楊路與彌 陀路路口的228紀念公園。\nTaiwan's first 228 incident monument was completed in Chiayi, at the end of Zhongyi Bridge on Mituo Road. In 2017 the monument was moved to the 228 Commemorative Park at the Chuiyang Road and Mituo Road intersection due to a road widening project.","wiki":"","attachments":["PXL_20211120_052823614.jpeg"]},{"id":"rec6YV7Jc2FqNhB6J","name":"金輪繼手 Kanawatsugi","notes":"金輪繼手 Kanawatsugi\n日式榫接中的「金輪繼手」是一種可以接合多 種木頭特性的續接法,展現出準確的切割精度 與装拆的巧思。\n花旗松集成材 Douglas Fir Glued Laminated Timber\n花旗松是結構力最強的商業樹種之一,有著易 乾燥、不易龜裂的特性,同時有優異的強度重 量比,因此機械切割效果極佳,普遍製作成集 成材。擁有極佳握钉力與固定力的花旗松,亦 具有木材的最高剛度,製成集成材後比相同 尺寸天然木料更強硬、比相同重量鋼材更具 韌性。 (展品提供:澤昕木業)\nCLT\nQT TOoss Laminated Timber 1 林心,日本位「酒交集成板」乙\n寝かせれば床となるため、シンプルに\n建てられる新たな業として\n直交集成板 \n\nCross Laminated Timber\n注目されています。\nCLT是將板材紋理依交錯方向重疊排列並點檢起 來的大型合板,是在1990年代發展起來的新型 熊木構造用材,在歐洲及北美也曾運用在10 樓以上的建築及大型商業設施,此處展出為日 本路建工業的CLT板材,為日本首間大規模產製 國產村CLT的工廠。 (展品提供:德豐木業)","wiki":"","attachments":["PXL_20211120_055821060.jpeg"]},{"id":"rec6aV37rP1MWmpqe","name":"嘉義鐵路與產業模型","notes":"'嘉義鐵路與產業模型\n本模型比例為1:87,呈現年代橫跨日治時期至近代的嘉義樣 貌。配合展出空間與觀看角度效果,模型的空間方位非實際的地 理方位。模型展出呈現嘉義物產富饒、三鐵(縱貫鐵路、林業 鐵路、糖業鐵路)共構、都市發展的情境氛圍為主。","wiki":"","attachments":["PXL_20211120_051857147.jpeg"]},{"id":"rec6qHTuAdqZiXxgB","name":"火雞肉飯 Turkey Rice","notes":"火雞肉飯 Turkey Rice\n, 臺灣原本沒有食用火雞的習慣,二戰結束後美軍駐臺 因西方感恩節有食用火雞的習俗,而引進火雞飼養。火 雞體型大、含肉量多,在嘉義地區大量飼養成為常見的 食材。\n火雞肉飯以悶煮後的白飯淋上店家特調的醬汁、放上火 雞肉絲或片、再灑上油蔥酥,就成為嘉義的代表美食。 很多店家會在火雞肉飯上放的醃黃蘿蔔(沢庵漬汁) 則是日治時期留下的飲食習慣。小小一碗火雞肉飯,看 到了臺、日、美的飲食文化組合,也包含著嘉義城的歷 史流轉。\nTaiwanese didn't originally eat turkey. The habit was acquired when US military personnel were based in Taiwan and turkeys were introduced after WWII. A bowl of white rice with the eatery's special sauce, turkey and fried shallots on top became a representative dish of Chiayi. Many eateries place pickled yellow radish on top, a habit left over from the period of Japanese Rule. Turkey rice is a mix of Taiwanese, US and Japanese food cultures and also reflects Chiayi's history.","wiki":"","attachments":["PXL_20211120_053036521.jpeg"]},{"id":"rec6rVFipwVwyvyaF","name":"新城故事 The Story of a New City","notes":"新城故事 The Story of a New City\n串起嘉義風華的「大通」 \"Datong\" connecting the splendor of Chiayi\n在日治時期就繁榮興盛的中山路昔稱「大通」 中山路的 起點是嘉義車站,穿過中央噴水池,另一端是明治43年 (1910)開闢,做為居民休閒遊憩的嘉義公園。在這二 點一線的空間中,人、事、物的起起落落,交織出百多年 來嘉義市的風華。過去曾是忠烈祠舊址的射日塔,可以說 是嘉義具代表性的新地標,建築上那與藍天相映的豔紫荊 花圖騰是嘉義市市花,象徵著嘉義的熱情與繁榮!\n","wiki":"","attachments":["PXL_20211120_054300270.jpeg"]},{"id":"rec7NQfhRkvB5oPTA","name":"錫器舖 Tinware Stores","notes":"錫器舖 Tinware Stores\n明清時期,中國大陸沿海地區民眾來臺開墾,也帶來錫 工藝的技術,在鹿港、嘉義、臺南等地發展,大抵分為 泉州派及福州派。嘉義及臺南多為泉州派,外觀簡約大 方,裝飾紋樣較素雅,垂珠、纓絡、流蘇等搭配也都是 表現上的特色。錫器主要使用在祭祀、宗教用品上,在 錫工藝的全盛時期,嘉義市中正路遍佈打錫店。隨著社 會變遷,民眾生活方式改變,錫製品逐漸被新材料所取 代,「打錫」這項工藝也逐漸沒落,但嘉義仍有少數打 錫鋪持續細心打造每件錫藝作品,希望能將這項傳統技 藝延續下去。\nIn the Ming-Qing dynasties, the migrants that came to Taiwan from the coast of southeast China brought tin craft with them. The tinware of Chiayi and Tainan was simple but stylish and was often decorated with elegant beads, jade or pearl necklaces and tassels. In early times, Zhongzheng Road in Chiayi had many tinware stores but as times changed and people's lifestyles changed, tin was gradually replaced by new materials. However, Chiayi still has a small number of tinware stores that skillfully make tin artworks and hope that this traditional craft can be passed on.","wiki":"","attachments":["PXL_20211120_053823470_MP.jpg"]},{"id":"rec8AfuTeTrlXwu7h","name":"木行橋","notes":"木行橋\nTimber Pedestrian Bridge\n臺北大巨蛋(Taipei Dome)是臺北市信義區一座興建 中的室內體育館。位於光復南路、忠孝東路與市民大道 之間,並且隔著忠孝東路與國父紀念館對望。園區設置 的項目除巨蛋外,另有商業用途的商場、影城、飯店、辦 公大樓、旅館等附屬設施,佔地大約10.2公頃。在800 多公尺的沿街面(忠孝東路、復興北路、市民大道),只 有三處紅綠燈可以連接其他街廓,與另一大型開放空 間——國父紀念館的空間關聯性極為薄弱。一個以人 為本的都市環境,卻不尊重人行的空間,是極為矛盾且 不合理的,因此本次提案設計了一座人行天橋,跨越忠 孝東路連結、延伸進入巨蛋園區及國父紀念館。\n擊壤設計×澤昕木業\n設計概念說明\n剖結構\n共屬於純壓力結構,可在有大跨度的情況下將受力轉由為各元 件的壓應力,而不會有張應力;有時會稱為拱圈作用。當供結構\n的發力帶到地面時,田結構會對某地區子一個外的力,稱為「銷 權力\n將質量均勻分他,不可以伸的長鏈懸掛於兩资點,因重力作用线 真下彎曲形规的曲線,稱為懸證線;這種曲線常用来指沙在水平 需影里因肉引力作用下的軟索星原之形狀,重力的反力會 沿著此軟姆回軽周炎影,薄經系統就是懸對線系統的調料,其系 統的音量也會沿著薄短回到支點,\n制,因重力作姆照與下層画图成之謎,對紐特\nFRODD\n薄殼結構就是曲面的薄壁結構,按截面生成的形式分為醋酸、圓 清淨粉-雙金豆粉和麵物線粒米。\n「該文提國小,德士·天的湿而瑞 用木珠海台系统(gridshell structure)。任們先利用感溫線稀找 可用的画 形狀,並路車行需求與行人活動尺度打出模。 對條件,機而產生天橋所需的屋面,有別的相機造,薄殼系統由 於只機關系變白銀,相對輕巧許多,此設計希望能在果體厚重的 大巨蛋旁,產生一抹輕籤的綠意。\n設計時間\n2020年7月~8月 2659 m²\n冰行購 Timber Pedestrian Bridge 臺北市忠孝東路传播大 奮與艾尼维網道现\n人行陸橋\n名\n地點\n用途: 设计院副\n中国人員\n潭沂水除無限公司: 肝洛括·林奕龍、滿手娜","wiki":"","attachments":["PXL_20211120_060235160.jpeg","PXL_20211120_060239696.jpeg","PXL_20211120_060243331.jpeg"]},{"id":"rec8MI5NFfMsL294P","name":"桃仔城 Taocheng (Peach City)","notes":"桃仔城\nTaocheng (Peach City)\n諸羅建城開始於康熙43年(1704),知縣宋永清建木柵城,設置 東、西、南、北四門,為臺灣最早建城的城垣。朱一貴事件後,因 防禦的考量,知縣孫魯在雍正元年(1723)改建為土城,城上有馬 道、城外設有防禦用淺溝。雍正5年新任知縣劉良璧重建門樓、砌 築排水用水涵,並在四個城門上設置火砲。城池範圍向西北擴張, 形狀頗似桃子,因而有「桃仔城」的別名。雍正12年,知縣陸鶴又 在土城外種上刺竹。至此諸羅縣城防禦系統完備,城內形成「居民 稠密.南北通衢」的樣貌。\n厝里\n【拱辰門)\n(北門)\nConstruction of Jhuluo began in 1704, when magistrate Song Yong-ching built Railing Wall Town (wooden fence wall), established the four gates at the east, west, north and south of the town. These were the first city gates in Taiwan.\n襟山門\n帶海門\n(西門):\nIn 1727 the newly appointed magistrate Liu Liang-bi rebuilt the gate buildings, installed drainage water culverts and installed artillery at the four gates. The city was expanded to the northwest, forming a shape very similar to a peach, resulting in the nickname Taocheng, meaning \"Peach City\".\n崇\n明治37年(1904)《臺灣堡圖》嘉義地區,圖上可看出清代城牆的範圍,東西城門命名凸顯嘉義市東側臨山、西側 面海的地理特色。 中央研究院《臺迪歷史文化地圖系統》第一版,臺北,中央研究院,2003年)","wiki":"","attachments":["PXL_20211120_051604100.jpeg"]},{"id":"rec8UskLSRJoFpVKO","name":"魯熟肉 Sausage and Side Dish Platter","notes":"魯熟肉 Sausage and Side Dish Platter\n「魯」熟肉可說是嘉義特有的小吃,與臺南「香腸熟 肉」類似。店家清晨即開始熟食的製做,香腸、豬血 糕、粉腸、肉捲、糯米腸、三色蛋等手路菜,每家的手 藝、配方不同,饕客各有所好。北部少見的蟳仔糕(臺 南稱蟳丸),則是自日治時期即留下的食譜。各式白煮 內臟、燙花枝,也是常見的食材。清燙、冰涼後的季節 食蔬稱為「涼菜」,也是嘉義獨特的稱呼。再搭配特別 調製的醬料、蒜泥、薑絲、白醋(美乃滋之臺語)等。 紅黃的熟食、粉白的內臟、青嫩的鮮蔬,魯熟肉攤開張 營業,就像色彩繽紛的美食調色盤。\nStalls begin preparing the sausages, pig's blood cake, bean starch paste, pork sausage rolls, glutinous rice sausages and three-color eggs early in the morning. Each has its own techniques and recipes. Crab cake isn't often seen in the north and is a dish leftover from the period of Japanese Rule. Various boiled offal, scalded cuttlefish and scalded seasonal vegetables that are first cooled and called \"cold dishes\" are served with special sauce, minced garlic, ginger shreds, and \"white vinegar (mayonnaise in Taiwanese). When a sausage and side dish platter stall opens, it presents a colorful food palette.","wiki":"","attachments":["PXL_20211120_053124165.jpeg"]},{"id":"rec8WsIKVO7y7iRtt","name":"老祖先的智慧 榫卯接合","notes":"老祖先的智慧\n榫卯接合\n現代木構造的技術進化-榫接與膠合\n傳統木構造工法主要透過卡榫搭接及對接等方式,進行各構件的接合;木 材的強度也多仰賴木頭原生的材料性質。在木構件的接合形式上,傳統木 構造發展出各式各樣的卡榫接合形式,現代木構造則多以鐵件來進行構件 的接合。而木構件的形狀也透過膠合技術、甚至能產生各種彎曲的形狀, 以因應不同結構型式的需求。這邊介紹來自國外常見的接合系統,以及目 前常見的工程用木材。\n榫接工藝的傳承: 嘉義木業工匠人才培育計畫\n從2019年開始,嘉義市政府文化局便開辦 「木業工匠人才培育研習課程」,招收對木 造設計與工程有興趣的民眾,一方面透過基 礎實作課程,來帶領學員們深入了解木構造 產業並從中找到自己有興趣深耕的專業環 節,同時也建立木造設計與工程的素養,讓 學員從樣圖繪製開始學習榫頭、接點、屋 面、牆面與樓板,以小而大漸進式上手木構 造不同部位的接合與應用,傳承嘉義在地技 術工藝的同時,也培養在地的木造人才。\n","wiki":"","attachments":["PXL_20211120_055838135.jpeg"]},{"id":"rec8cjji2U8rB9iDG","name":"2004 民國93年","notes":"2004 民國93年\n嘉義市立博物館開館,是一座多功能的綜合博物館,以「嘉 義人關心嘉義事」為其建館宗旨,展出內容涵蓋嘉義的「地 質、化石、美術」三大主題。\nChiayi Municipal Museum was opened. The multipurpose mixed museum was constructed for \"residents who care about Chiayi\". The exhibition contains three main themes: the geology, fossils, and art of Chiayi.\n3義橋橋","wiki":"","attachments":["PXL_20211120_052835941.jpeg"]},{"id":"rec8thm9qGxbbwwmA","name":"黃文醫院玄關櫃","notes":"黃文醫院玄關櫃\n以臺灣檜木製成,原置於黃文醫院入口玄關處。中間裝有鏡子一 面,做為整理儀容之用,左右前方貼心地設計給予雨傘與拐杖放 置的空間,上端旋轉車积可供吊掛衣帽前方面板雕飾著菊花紋 飾,代表當時家具高貴雅緻的風格。黃文醫院這棟將近百年的屋 齡,建於1931年,價值在於曾經見證市街繁華的「嘉義市銀座、 經歷戰爭空襲、諸羅山城二二八,屋裡所承載的歷史,曾經住過的 黃文醫師、曾發生過的故事,不僅與嘉義歷史有深厚連結,甚至與 近代醫療史、社會史也有著深厚關聯。\n1958年,嘉義市政府文化局典藏","wiki":"","attachments":["PXL_20211120_053522564_MP.jpg"]},{"id":"rec9Oky93krpTnyP3","name":"義興閣掌中劇團","notes":"義興閣掌中劇團\nYishengger Glove Puppetry Troupe\n成立於民國 42 年(1953),獨創金光戲「萬教風波仇-阿拉仔原始人連續 集」,在嘉義地區頗富盛名。近年第4代接班後,表演融合現代劇場技術及 新創元素,首創「布袋戲搖滾音樂劇」,受國內外許多媒體及劇評關注,走 出代表義興閣獨特的表演風格及經營路線。\nEstablished in 1953, it created the authentic golden light puppet show (Thousand religious wave and hate-The original series of Chinese) that was popular in the Chiayi region. In recent years, the performance integrated modern theater techniques and new creation elements. It produced the first \"Puppet Show Rock Music Drama\" and attracted attention from domestic and international media and critics. It has unique performance styles and operating direction.","wiki":"","attachments":["PXL_20211120_061649388.jpeg"]},{"id":"rec9ccx7CPTBLGjcv","name":"北美花旗松","notes":"北美花旗松\n【學名】Pseudotsuga menziesii|松科黃杉屬|針葉樹 【通稱】Douglas fir\n又稱為道格拉斯杉,樹高約50公尺、最高可達90公尺,胸徑約 12~20公尺。由於木理通直、木節較少,成長快速,乾燥後穩定性 高且耐摩擦,彈性亦高,因此常見於建築結構與室內裝修使用。心 材呈黃色到紅褐色,木材含樹脂帶有香氣。原產於美國西北部至 墨西哥一帶,現在大約分布自落磯山脈到太平洋沿岸。","wiki":"","attachments":["PXL_20211120_060213955.jpeg"]},{"id":"rec9igPmY9ScUwsqd","name":"石猴雕刻 Stone Monkey Sculpture","notes":"石猴雕刻 Stone Monkey Sculpture\n石猴雕刻是嘉義近年獨有的鄉土藝術創作,最大的表現特色在 於「返璞歸真,真情流露」。創作者利用嘉義地區溪流中,含 有貝類化石的溪石,雕刻出臺灣獼猴俏皮靈活的姿態。\n民國50年代左右,詹龍(1917~1990)為石猴創作的第一人, 原為石匠師傅,工作閒暇以雕刻石猴自娛,四十餘歲,全心投 入石雕創作。後期以猴雕技術開班授課、招收學徒,並吸引許 多同好加入,猴雕藝術在嘉義市蔚為風氣。這群石猴雕刻藝術 家多數未接受學院的訓練,為自行摸索或師徒傳承的「素人藝 術家」。\nStone monkey sculpture is a unique country art creation in Chiayi in recent years. Its biggest characteristic is \"Back to basics, reveal true sentiments\". Creators used brook stones that contain shell fossils. They sculpt lively monkey postures. Monkey sculpture art became popular in Chiayi City. Most artists do not receive training in academies. They are either self-taught or are mentored \"Amateur artist\",\n《天倫》,黃英哲 民國83年(1994),嘉義市立美術典藏。","wiki":"","attachments":["PXL_20211120_061442007.jpeg","PXL_20211120_061445993.jpeg"]},{"id":"recA3VK5CCayPVvIY","name":"化石研究 Fossil Research","notes":"化石研究 Fossil Research\n生物死後的身體大多數會成為其他動物的食物,只有在適 當的環境和時機比較有可能形成化石。\n化石形成的過程:\n生物死亡,被沈積物\n掩埋 肉被微生物分解,而。 的部分逐漸石化,形 殼變動或地形變化, 留下堅硬部分 成像石頭般的結構, 曝露於地表被發現\n軟的組織如皮膚和肌長時間的掩埋,堅硬 4 地底下的化石,因地\n嘉義縣阿里山至觸口一帶,發現許多珍貴的化石,除了貝 類之外,還有螃蟹、海膽、鯊魚牙齒、樹葉、藤壺、珊 瑚、牡蠣、有孔蟲、苔蘚蟲、魚、鯨等化石。\nAfter death most organisms will become food for another animal, but with the right environment and fortunate timing, some are preserved as fossils. Many precious fossils have been unearthed in the area between Alishan and Chukou. Besides shellfish, there are also fossils of crabs, sea urchins, shark teeth, tree leaves, balanidae, coral, oysters, foraminifera,moss animals, fish and whales.","wiki":"","attachments":["PXL_20211120_052320009.jpeg","PXL_20211120_052340631.jpeg","PXL_20211120_052347280.jpeg"]},{"id":"recABnA3fFXi3cHJa","name":"洋画3人展","notes":"洋画3人展\n張義雄(右四)、翁崑德(左四) 與林榮杰(右三)舉行「洋畫三人展」於嘉義 公會堂合影。左三為陳澄波(指導)、右一 石山定俊、右二翁焜輝。 昭和11年(1936),財團法人陳澄波文化基金會提供\n","wiki":"","attachments":["PXL_20211120_061503585_MP.jpg"]},{"id":"recAN5GTtLIYCS9nt","name":"嘉義東市場 Chiayi East Market","notes":"嘉義東市場 Chiayi East Market\n原址為清代諸羅縣衙署:明治39年(1906)毀於梅山地震, 1914年拆除改建為東市場。之後又經歷多次地震毀損、戰爭 空襲、火災燒毀、腐朽改建、擴增攤位等,成為現今東市場 之樣貌。目前僅有東北角(中正路與忠孝路)木構造建築為 日治後期所興建,屋頂的「太子樓」在大型建物常見為採光 及空氣流通之結構,2015年登錄為嘉義市歷史建築。\nThe original location of the market was the Qing dynasty Jhuluo County Government Office. In 1906 it was damaged in the Meishan earthquake, and subsequently demolished and rebuilt as the East Market in 1914. Currently only the northeast corner remains (Zhongzheng Road and Zhongxiao road), a wooden structure building built late in the period of Japanese rule. The \"Double Layer Roof Construction\" roof architectural feature was often seen in large scale buildings for lighting and ventilation. In 2015 the building was registered as a historic site of Chiayi.\n場市東晟嘉\n嘉義東市場\n《嘉義寫真一》,民國90年(2001),郭明義提供。","wiki":"","attachments":["PXL_20211120_054425957.jpeg"]},{"id":"recBCqhJnNceDgNE9","name":"SIMPSON STRONG-TIE","notes":"SIMPSON STRONG-TIE\n成立於1956年的SIMPSON STRONG-TIE木 構造接合件公司,為北美最具競爭力也是 最受到信任的接合鐵件生產及設計公司。 其設計理念在於不只解決工程上面臨的各 種問題,更從使用者角度來研發易於使用 的接合鐵件。時至今日,SIMPSON STRONG-TIE的目標不但是成為世界領先的 木結構專用鐵件設計公司,也希望透過設 計,開發出更安全、更使人信任的木構造 接合工法。\n","wiki":"","attachments":["PXL_20211120_060049883.jpeg"]},{"id":"recBYUvHctIdbu5zO","name":"新南光歌劇團 Xin Nan Guang Opera Group","notes":"新南光歌劇團 Xin Nan Guang Opera Group\n原由林塗生創立於臺南,極盛時期團員連同眷屬多達2百多人,早期曾參 與電視、電影演出。經營幾經轉手,民國50年代起落腳於嘉義後,曾多次 獲獎並應邀海外演出。目前以全臺廟會公演為主,拿手的劇目包含「唐明 皇」、「方世玉」 「楊家將」 「包公」、「光武中興」等。\nFounded by Lin Tu-sheng in Tainan. In the early days, he participated in TV shows and movies. In the early 1960s, he settled in Chiayi, received many awards, and was invited to perform overseas. Currently, it focuses on temple fair exhibitions and their famous repertoire includes \"Emperor Tang\", \"Fang Shiyu\", \"Saving General Yang\", \"Baogong\", and \"Emperor Guangwu Revitalizes the Han\" etc..","wiki":"","attachments":["PXL_20211120_061646182_MP.jpg"]},{"id":"recCA1mPQRqfRzeGM","name":"青辰美術協會","notes":"青辰美術協會\n昭和15 年(1940) 林榮杰、翁焜輝、翁崑德、張義雄等創辦「青 辰美術協會」,為嘉義第一個西畫團體,並邀請陳澄波擔任顧問, 當年8月舉辦第一回青辰美術展覽會。日治時期嘉義地區的繪畫風 氣興盛,但東洋畫人數及畫會活動皆遠多於西洋畫,「青辰美術 協會」或有引領嘉義西畫創作風氣之企圖。創會成員翁焜輝所編輯 的「記錄帖」中,詳細記錄了該會 1940年5月至1941年3月間的 歷次聚會與展覽資訊 。\n《梅蘭菊竹松》,多人共筆水墨畫:\n林玉山、黃鷗波、李秋禾、張李德和、吳學讓、朱芾亭。\n民國38年(1949) 嘉義市立美術館典藏。","wiki":"","attachments":["PXL_20211120_061549861.jpeg","PXL_20211120_061553438.jpeg"]},{"id":"recCRJakikWxwBpSj","name":"尋訪林鐵","notes":"交力坪車站\n懷舊柑仔店\n梨園寮車站 螢河鐵道\n以螢火蟲聞名的無人招呼站,每年4至5月 吸引大批攝影玩家,場景如夢似幻。\n林鐵列車過去在交力坪交會,因而得名。 當時聚落相當繁榮,今日只剩下一家有著 百年歷史、扛起郵件收發責任的欣茂商店 ,繼續提供村民和旅客最溫馨的服務。\n樟腦寮-獨立山車站\n「郊山健行首選\n尋訪林鐵\n從熱帶到温帶,搭林鐵探索森林生態和文化景觀\n獨立山螺旋路線的起點,在樟腦寮抬頭仰 望,可以看到多次火車爬升的樣貌。此站 也是臺灣少見的「折返式車站」,列車必須 倒退進站。\n從樟腦寮車站出發的獨立山國家步道,全 長2公里多,與林鐵一起爬升,穿越獨立山 螺旋和車站,最後抵達奉天岩,是全臺唯 一與鐵道相依的健行步道。\n水社寮車站 生態小站\n因鐵路而生的水社寮聚落,至今仍等候旅 客前來享受周遭豐富的生態,包括四天王 山、臥龍谷、四方竹林等。原本的水社寮車 站也因附近蝙蝠棲地,而於站內設置蝙蝠 生態教育館。\n997m\n1904m\n[梨園寮\n交力坪\n水社寮 180 1186m\n743m\n鹿麻產車站 漫遊欒樹之徑\n獨立山\n2004年整修完成,重現木造車站的優 雅姿態,成為熱門婚紗照拍攝景點。從 鹿麻產到竹崎車站的「滿竹自行車道」, 臺灣欒樹於秋季變色時,美不勝收。\n由\n543m\n324m\n江\n82m\n127m\n竹崎車站\n林鐵的守護者\n道\n( 30m/\n林鐵沿線最古樸的木造車站,已逾百年 歷史,1952年整建後使用至今,昔日蒸汽 機車頭會在此加水,並利用「三角線」更換 車頭、轉換方向。\n嘉義\n北門\n熱帶林 127-800公尺 暖帶林 800-1800公尺 溫帶林 1800-2451公尺\n平地段 30-127公尺\n竹崎是林鐵平地段和登山段的交界,曾因 林業而繁榮,見證著林鐵的興衰與復甦。 為了守護這條鐵路,一群自竹崎高中畢業 的青年們成立了「阿里山青年大使｣團隊, 替地方文史盡一份心力。","wiki":"","attachments":["PXL_20211120_054543063.jpeg"]},{"id":"recD8rqSklJLVt2G8","name":"櫻桃木 Martlodendrom parviflorum","notes":"櫻桃木 Martlodendrom parviflorum\n產地\n顏色\n產於北美地區,海拔高度分布廣泛 心材有粉色系與綠色系兩種,會隨\n時間慢慢接近麥芽色,邊材呈現\n白色;年輪不明顯,木肌緻密\n帶有櫻花香氣 質地堅硬、容易加工,切削面優美\n具光澤感\n香氣\n特性\n用途\n多用於家具製作、室內裝潢\n板:為表面經過特殊耐磨處理,具有耐酸、防火特性的板材。","wiki":"","attachments":["PXL_20211120_055459699.jpeg"]},{"id":"recDeHhWUMckOIEk1","name":"日式軸組工法","notes":"日式軸組工法\n日式軸組工法是日本現代木造建築大量生產、規格化的主要原因。 為因應大量生產,而將斷面尺寸規格為10.5公分、12公分、\n15 公分等經濟尺寸,讓木材能夠最大限度地使用。\n","wiki":"","attachments":["PXL_20211120_055747660.jpeg"]},{"id":"recDqJrKSPEus5rsd","name":"嘉義八景 The Eight Sights of Chiayi","notes":"嘉義八景 The Eight Sights of Chiayi\n自清領時期起,陸續有「諸羅六景」 「嘉義八景」等說 法,為宦遊雅士為特殊的地理、人文景觀歸納出的名號。 因景緻的更迭與觀看角度的變化,名單內的景點有不同的 編列。清代的古文、臺灣古典詩也可見文人以此為題的作 品。\n最早的「諸羅六景」記載於康熙56年(1717)編修的 《諸羅縣志》,為玉山雲淨、橫圃風清、北香秋荷、水沙 浮嶼、雞籠積雪、龍目甘泉,因當時新港溪以北皆屬諸羅 縣的範圍,因此景點位置遠至基隆。現今嘉義市為範圍 的「嘉義八景」 則始見於戰後民國37年(1948)由市 政府主導評選而定:蘭潭泛月(蘭潭) 檜沼垂綸(貯木 池)、彌陀曉鐘(彌陀寺)、康樂暮鼓(中正公園)、公 園雨霽(嘉義公園)、林場風清(嘉義植物園)、鷺橋跨 浪(白鷺橋)、橡苑聽鶯(北香湖) О\n玉山雪淨、蘭井泉甘、羨圃風清、北香秋荷、南浦春草、梅坑月霽、月嶺曉翠、牛溪晚嵐","wiki":"https://zh.wikipedia.org/wiki/%E8%AB%B8%E7%BE%85%E5%85%AB%E6%99%AF","attachments":["PXL_20211120_052116744.jpeg","PXL_20211120_052214881.jpeg","PXL_20211120_052221647.jpeg"]},{"id":"recE4k90upkfrIUcv","name":"葡萄柚綠茶 Grapefruit Green Tea","notes":"葡萄柚綠茶 Grapefruit Green Tea\n葡萄柚綠茶是嘉義頗富盛名手搖茶飲,加上社群媒體的 推播、網友分享,知名店家門外不分寒暑常可見到大排 長龍的顧客。手搖茶飲是臺灣近 30 年來熱銷的飲料, 各大連鎖店遍及全國,早期以奶類茶飲受到歡迎,除了 常勝產品「珍珠奶茶」紅遍國際之外,近年因養生意識 的提高,以相對較天然、健康的鮮果入茶,逐漸受到歡 迎。「葡萄柚綠茶」雖為普遍的產品,店家透過配方比 例的調整,強調以新鮮果汁、果肉添加,再加上鹹甘梅 提味,成為受到顧客歡迎的熱門產品。\nHand shaken drinks have been popular in Taiwan for almost 30 years and various large chains have stores all over Taiwan. Apart from Bubble Milk Tea that is popular internationally, healthier tea with fresh fruit is gradually winning the favor of customers. Although grapefruit green tea is an ordinary product, by adjusting the proportions of the recipe, adding fresh fruit and juice and a salty dried plum to add to the flavor, it has become a best-selling rink.","wiki":"","attachments":["PXL_20211120_053154474.jpeg"]},{"id":"recEMW1UsrQQBZ1fz","name":"邁向木造潮流 臺灣的想像","notes":"邁向木造潮流 臺灣的想像\n看過臺灣木造建築巡禮後,是否發現木造建築的類型比想像 的更多樣,除了可以當作住宅,還能做為大型公共建築,也可 以是熙來攘往的橋樑,更有建築師把木材溫潤的質感應用在 宗教建築上。臺灣的木造建築應該有更多想像。\n在國外,木造建築的類型多樣,建築高度也逐漸突破,量體越 趨增大,甚至可以超過10層樓。在臺灣,現行的建築法規不允 許木造建築高度超過4層樓,但是有許多建築師受到世界各 地高層木造的啟發,逐漸想像在臺灣如何蓋出高層/大規模木 造建築。因此,由臺灣的年輕建築師、結構工程師以及設計師 提出他們對於木造建築的想像,本展區我們可以看到5座建 築提案,以及屬於嘉義市的木造公共建築。\n接下來,就讓我們一起跟著設計師們的想像,探索臺灣都市中 可能的高層/大規模木造建築吧!","wiki":"","attachments":["PXL_20211120_060230138.jpeg"]},{"id":"recEQUBcPsP11tI2z","name":"雲遊者辦公所","notes":"雲遊者辦公所\n在都市中的雲遊者於天際浮游之間,挑戰超越50M、 12層樓高層之都市木構辦公大樓。基地位於基隆路 與忠孝東路交叉口交通要塞之位置,針對未來性改善 交通紓解之策略,先行規劃由二樓可銜接雙向連結人 行通道安全的人車分離計畫。\nWanderer\n方新樵×福樟實業\nWanderer雲遊者辦公所核心以四方交互交織的壁 式RC結構為垂直服務核之結構系統,四道RC壁式結 構牆連接各空間單元的膠合柱+格子樑木式混合構 造的辦公空間及懸浮陽台。透過懸挑反拉膠合樑與 CLT樓板的懸浮陽台結構,創造垂直與轉角向度的自 由立面空間,讓辦公的行者們移動如雲朵般的浮遊在 高層之中。\nO結構\n平台單\n設計單元解說\nWanderer雲遊者辦公所設定承租水平線性以A、B、C三種基本單 元為一層樓大小坪數需求對應的基本概念,對應A、B+C校大學 元組合的彈性規劃。垂直線性的承租以單樓層、雙樓層、四樓層之 三種彈性變化組合坐落在大樓的不同樓層之間,垂直向性的內部 溝通與交流,可以從內部垂直服務核處,反轉至建築外立面的懸 浮平台上,讓都會區真正的主角與真正的活動,真切的呈現在日 常生活之中。在垂直與轉角移動間,打開單視點與單角度的空間 城,讓辛勤的工作者可以在移動之間,轉換視野與心情。\n2020年五月-6月\n基地理標\n溜进者辦公用 Wandeser 莫北市伯教區出孝根邦大樓地址\n1520d 地上12層,地下4層\n地點\n用途 設計規劃 設計執行 結構設計 檢調人員\nAdamas Architect Atatiers 方卡譯建築設計\n度實有限公司\n根開設,機、季根誌、柳","wiki":"","attachments":["PXL_20211120_060303950.jpeg","PXL_20211120_060308589.jpeg","PXL_20211120_060312212.jpeg"]},{"id":"recEvVGTwTxxTFFC9","name":"嘉義城隍廟 Chiayi Chenghuang Temple","notes":"嘉義城隍廟 Chiayi Chenghuang Temple\n為諸羅知縣周鍾瑄於康熙54年(1715)建立,建築年代僅 次於臺灣府城隍廟(1669,臺南)、臺灣縣城隍廟(1712, 臺南),為臺灣第三座官設古城隍廟。現今所見之正殿建於 日治時期,聘請福建泉州匠師王錦主導,廟內石雕、彩 繪、交趾陶等裝飾皆為名師作品。廟內現存碑匾、和歌陶匾 及木雕八獅座武轎等皆為重要文物。\nThe Chenghuang (city god) Temple was founded by Jhuluo County magistrate Chou Chong-hsuan in 1715, while the main hall that can be seen today was built during Japanese rule. Master craftsman Wang Jin-mu from Quanzhou in Fujian, who was hired to direct the construction. The stone carvings, painted designs and Koji pottery inside the temple are all works by master craftsmen. The temple's stone plaque, waka pottery plaque and wood carved eight lion sedan chair are all important cultural artifacts.\n嘉義城隍廟。\n《嘉陵西二》。民國91年~2002","wiki":"","attachments":["PXL_20211120_054413443.jpeg"]},{"id":"recFG9HVeLHsTMkpV","name":"曲木大樓","notes":"這是一棟26層樓高的木構造材辦公大樓。\n曲木大樓\n一般高層辦公大樓常採用管式結構系統,因此類系統可 有效減少室內空間之落柱,並同時降低樓板之梁深,在室 內空間之彈性運用自由度及淨高上都有著顯著的效益。\nTubular Bentwood Tower\n王喆+方瑋×德豐木業\n本次的提案試圖進化傳統之管式結構系統,將原本粗壯 的外管結構構件,轉化成不同細小的膠合木或膠合層壓 木(GLT)構件,在外牆側創造一具有深度的桁架結構來 取代原管式結構的垂直結構元素,如此一來除能保有管 狀結構系統之既有優點外,亦可在外皮層上製造有效遮 陽,並在立面表情上創造出非連續性的韻律感。\n特別是在水平力的抵抗上,由低樓層到高樓層以漸變 方式嵌入了不同數量的板材,暗示著樹幹的沉重底部 和較輕的頂部,就如同是在混凝土森林中,一株獨特的\n大樹姿態。\n回回\n結構系統說明圖\n2020年1月~1年\nB天大樓Tubular Sentercod Tower 臺北市啓到該拉出频中心版社\n格 地點:\n地上6層,地下5層\n主题+方十分鐘 空軍戰用卡都市山腹上方理理结果:\n商型結核工程越加有限公社\n簡體驗份有限公司 載小版、紙、冷戰\n參與人員","wiki":"","attachments":["PXL_20211120_060316997.jpeg","PXL_20211120_060325193.jpeg","PXL_20211120_060321690.jpeg"]},{"id":"recFdqRHQiHR1hyNz","name":"木質生活好空間","notes":"木質生活好空間\n走進木造生活空間,撲鼻而來的就是陣陣的 木頭香。接著,木質空間溫潤的質感,讓人 沉澱心情,享受片刻的悠然自在。嘉義常見 的日式木造建築,都是用制式的工法完成。 舉凡空間的大小尺寸、各空間部位名稱、榻 榻米擺放的數量,乃至於柱樑的尺寸,木材 樹種的選擇,都隱藏著空間秩序與職人大工 的經驗傳承。\n我們現在所在位置是仿造日式空間秩序,經 由設計師改造,並且利用目前在嘉義隨手可 得以及常見的木材規格所打造出來的休憩空 間。透過設計師的巧思,一般民眾也可以輕 鬆的打造一個屬於自己的木造空間。請你坐 下來,一起來感受一下木頭帶給人的五感體 驗吧。","wiki":"","attachments":["PXL_20211120_060116865.jpeg","PXL_20211120_060125586.jpeg"]},{"id":"recFmPXTqikkbdP6i","name":"白橡木 Quercus alba","notes":"白橡木 Quercus alba\n產地\n顏色\n香氣\n特性\n以北美東部地區為主,廣泛分布於北\n半球區域\n邊材幅窄、呈白色,心材為米白接近 茶色,紋理通直,徑切面成銀色紋理\n有明顯木香\n質地沉重,乾燥時橫切面容易迸裂,\n但由於對液體阻絕性高,常用作酒桶\n常用於家具材、化妝板 (註),也是威 士忌酒桶常用的木料","wiki":"","attachments":["PXL_20211120_055441099.jpeg"]},{"id":"recFoTXexlNlWwRwb","name":"嘉義樹木園(嘉義植物園)","notes":"嘉義樹木園(嘉義植物園)\nChiayi Arboretum (Chiayi Botanical Garden)\n前身為明治41年(1908)臺灣總督府在嘉義埤仔頭設立的橡 膠苗圃,翌年在山仔頂闢設橡膠試驗地,後改稱為「林業試 驗場嘉義支場」,為臺灣總督府中央研究所林業部的下轄機 關,以引進熱帶與亞熱帶樹種,進行造林繁殖的試驗。戰後 由林業試驗所接收管轄,面積約有8.6公頃,為市區內重要的 休閒綠地,「嘉義八景」之「林場風清」即指嘉義植物園。\nInitially set up 1908 by the Governor-General of Taiwan as a rubber nursery in Pizaitou, Chiayi. The garden was administered by the Governor-General of Taiwan's Central Research Institute Forestry Division, which conducted forestation and breeding experiments by introducing tropical and subtropical tree species. Now it is an important urban green leisure space. The \"forest station scenery\" mentioned in the \"Eight Sights of Chiayi\" refers to Chiayi Botanical Garden.\n日治時期林業試驗地\n《美寫真》,民版91年(2002),高振興提供,","wiki":"","attachments":["PXL_20211120_054355322.jpeg"]},{"id":"recGMODesekym1p0U","name":"愛木村 i-Wood Village","notes":"愛木村\ni-Wood Village\n原為檜木製材廠,近年轉型為具教育意義與展示功能的觀 光工廠,並於2018年申請成為嘉義市地方文化館,館內 以介紹推廣嘉義木業發展史為主軸,也提供許多豐富有 趣的互動遊戲、DIY 木藝體驗、小小木工營等相關活動。\nme a Originally a Taiwan Cypress sawmill, it has bec urist factory in recent years. It has the theme of the development history of the wood industry in Chiayi and offers fun interactive games, DIY wood art experience, carpentry workshops for children and other activities.","wiki":"","attachments":["PXL_20211120_061411978.jpeg"]},{"id":"recGNsAgsUj4fsuBA","name":"杉木","notes":"杉木\n【學名】Cunninghamia lanceolata |杉科杉屬|針葉樹 【通稱】Chinese Fir\n樹高達60公尺、胸徑約3~8公尺之間,樹型端直,枝條平展;開 始生長時以左右分枝為主。原產於中國與越南北部,引進臺灣後, 因為木理通直、有香氣,材質輕軟但是保存期長、耐性高,成為傳 統建築中重要的樑柱原料。15至20年就可以成材,是500~1800 公尺中低海拔山區常見的造林樹種。","wiki":"","attachments":["PXL_20211120_060158919.jpeg"]},{"id":"recGR6zp1ckZEdnby","name":"北門驛木造車站","notes":"北門驛木造車站\n碳儲存量\n27,990kg=44棵柳杉\n嘉義市林業鐵路第一站|約建於1910~1912年間\n以阿里山紅檜為建材的典型日式車站建築,是阿里山林業鐵路\n連結市區的最重要一站,既是作為木材下山的集散場,也是物 資運送上山的起點。","wiki":"","attachments":["PXL_20211120_055610985.jpeg"]},{"id":"recILwq8YxLTzSJYy","name":"臺灣傳統木構造","notes":"臺灣傳統木構造\n臺灣的傳統木構造中使用的木材以圓型斷面、六角型斷面木料為多。\n圓型斷面\n六角断面\n日式軸組工法\n日式軸組工法是日本現代木造建築大量生產、規格化的主要原因。\n為因應大量生產,而將斷面尺寸規格為10.5公分、12公分、 15 公分等經濟尺寸,讓木材能夠最大限度地使用。","wiki":"","attachments":["PXL_20211120_055752053.jpeg"]},{"id":"recIzm2Pp8YhOEvxf","name":"歐洲雲杉","notes":"歐洲雲杉\n【學名】 Picea abies | 松科雲杉屬|針葉樹 【通稱】Norway spruce\n又稱為「挪威雲杉」,高約35~55公尺,在原產地可達60公尺,胸 徑約1~1.5公尺。大枝斜展,小枝通常下垂,樹冠繞著主幹成錐狀 層疊。心材與邊界限不明顯,木質鬆軟而輕,紋理細緻均勻。適 應性強、耐寒。原產北歐,為主要造林樹之一,也是歐洲常見的工 業用材樹種。","wiki":"","attachments":["PXL_20211120_060153415.jpeg"]},{"id":"recJ3t9fDJlyLXDPL","name":"豆花甜湯 Tofu Pudding Sweet Soup","notes":"豆花甜湯 Tofu Pudding Sweet Soup\n豆花是常見的臺灣傳統甜品,通常以豆花加上糖水及花 生、紅豆等配料,講究的店家強調使用黑糖水,冬天加 熱薑汁、夏天添上碎冰。而將糖水改為「豆漿」,豆花 搭配豆漿,兩種狀態的豆製品同時享用,成為嘉義特有 的食用方式,其他縣市也陸續有店家仿效。\n雙重的「豆」味,讓單純的甜品味道更為豐厚,一般早 餐店以豆漿搭配油條,在同樣的概念下,店家也提供油 條供顧客選用。將酥脆的油條以豆漿豆花稍微浸潤,再 與豆花同時入口,甜鹹軟脆多層次的口感,吸引外地民 衆嘗鮮。\nTofu pudding is a common traditional dessert in Taiwan. It is often served with syrup, peanuts and red beans. Uniquely, in Chiayi, tofu pudding is eaten with soy milk. Proprietors also provide dough sticks. Briefly soaking the crispy dough stick, then taking a bite together with tofu pudding offers a sweet and salty taste with a crispy and soft texture that attracts people from far and wide.","wiki":"","attachments":["PXL_20211120_053237637.jpeg"]},{"id":"recJT3VjImmZt19fp","name":"鯨骨研究","notes":"鯨骨研究\n鯨是海洋哺乳動物,在脊椎動物的演化過程中,水棲脊椎動物逐 漸演化並最後登上陸地。生活在海裡的鯨,祖先是大約5000 多 萬年前生活在巴基斯坦一帶的陸地動物。在演化過程中,鯨的祖 先的四肢逐漸改變為適合水中生活的結構,最近的研究發現,鯨 和陸棲的偶蹄類動物(如鹿)有親密的演化關係。嘉義市立博物 館保存的鯨下顎骨,由薛文吉於嘉義縣番路鄉牛埔村發現,但由 於結構不夠完整,至今仍難確定其身份","wiki":"","attachments":["PXL_20211120_052518166.jpeg","PXL_20211120_052524344.jpeg"]},{"id":"recJpz7LSogQJLixo","name":"諸羅古城門","notes":"諸羅古城門\n\n雍正5年(1727),改以磚石砌建門樓。東門 (襟山門),今忠義十九公廟邊;西門(帶 海門),今臺灣中小企業銀行南門(崇陽 門),今南門派出所圓環,北門(拱辰門) 今北門派出所圓環 。","wiki":"","attachments":["PXL_20211120_051703683.jpeg"]},{"id":"recJw3nGQSeObzSUt","name":"〈北門車站>模型","notes":"〈北門車站>模型\n此模型以原建築比例縮小20倍並使用臺灣檜 木製作而成,且皆依原建築工法組裝而成,柱 樑採外露式,樑柱之間設置牆身,門窗及開口 身外釘雨淋板,候車室入口為突出的車寄,如 實呈現北門車站樣貌,喚起後人歷史記憶,反 映時代精神。\n2020年,嘉義市政府文化局收藏","wiki":"","attachments":["PXL_20211120_051649804.jpeg"]},{"id":"recKhwPLK5qVpChb9","name":"書局 Book Store","notes":"書局 Book Store\n嘉義市面積不大,但冊列為「獨立書店」即有6、7家 之多,店家以呈現各自獨有的文化與精神,強化民眾閱 讀的深度為目標。日治時期,嘉義地區重要的出版社 「蘭記書局」創辦人黃茂盛可說是這種概念的先驅,其 興業初衷:「普及文化,推廣道德為重, .新學雖可 興,舊學未可廢。」在殖民政府打壓漢學的政策之下, 堅持推廣漢學、弘揚本土著作、出版大量藝術書籍,以 保存本土文化的多樣性。蘭記書局成立於1919年, 2004 年結束營業。\nHuang Mao-sheng, the founder of the most important book shop in Chiayi in the period of Japanese Rule, Lanji Book Store, said of his business intention: \"Popularize culture and promote morality...... New learning can become popular but old learning should not be abandoned\". With the colonial government implementing a policy of suppressing Chinese Studies, he insisted on promoting Chinese Studies and local literature and published a large number of art books to preserve the diversity of local culture. Lanji Book Store opened in 1919 and closed in 2004.","wiki":"","attachments":["PXL_20211120_053910987.jpeg"]},{"id":"recKrLSU7nSllmmhn","name":"木材防水特性","notes":"木材防水特性\n剛砍伐下的原木,仍然處於潮濕狀態,往往需要 經過乾燥過程才能成為建材。要作為木建材,必 須讓木材乾燥至含水率低於19%的狀態(Dry Wood)。而在臺灣的環境中,若含水率能低於 15%,木材使用性會更耐久。由於木材內部有許 多導管,一旦受潮,只要給予時間加以乾燥,就能 讓水分排出避免腐朽。為了讓木造建築的樑柱結 構保持乾燥,常會在樑柱與建築外層之間增加一 個換氣層,讓木構件能通風換氣、常保乾燥,以增 加其使用年限。","wiki":"","attachments":["PXL_20211120_055942308.jpeg"]},{"id":"recKvgSgdn8HfCNnH","name":"中藥鋪 Chinese Herbal Medicine Stores","notes":"中藥鋪 Chinese Herbal Medicine Stores\n嘉義東市場一帶,因中藥行、草藥鋪集中,便有「中藥 窟」的別稱,早期藥鋪通常兼醫療問診。傳統漢醫傳承 以師徒為主,無論是「望、聞、問、切」,或是開方, 全賴經驗的傳承。日治時期臺灣總督府設立醫學校、提 倡現代化的西式醫療;近代則因政策法令變更,醫療問 診須取得執照,醫、藥逐漸分家。傳統的中藥鋪逐漸轉 型,兼融食療的觀念或以漢方美容、漢方瑜珈,重新將 傳統中藥、草藥再帶入現代社會。\nThe East Market area is known as the \"Chinese herbal medicine village\" due to the various Chinese herbal medicine stores there. In earlier times, Chinese herbal medicine stores doubled up as hospitals, offering treatment. Traditional Chinese medicine were trained using master and apprentice system. The knowledge of diagnosis and prescription was based on the cumulative experiences of the masters and the ones before them. In modern times, scientific use of Chinese herbal medicine has allowed traditional Chinese medicine clinics to set up pharmacies. Traditional Chinese herbal medicine stores have gradually transformed and now offer food treatment, Chinese beauty treatment and Chinese yoga which allowed traditional Chinese herbal medicine to blend into modern society.","wiki":"","attachments":["PXL_20211120_053342991.jpeg"]},{"id":"recLFz5g6SdvE2EOG","name":"春萌畫會","notes":"春萌畫會\n昭和3年(1928)成立,林玉山與朱芾亭為共同發起人,參加者有 嘉義林東爷、蒲添生、徐清蓮、施玉山及臺南潘春源、黃靜山、吳 左泉、陳再添等人。「春萌畫會」以「因應臺展,平日應有相互切 磋之活動,以提升創作水準」為宗旨,前後至少曾舉辦七次展覽, 除第一屆設於臺南之外,其餘皆在嘉義。1950年前後,林玉山移 居臺北,「春萌畫會」的影響力更擴大到全臺。","wiki":"","attachments":["PXL_20211120_061547335.jpeg"]},{"id":"recLJaVRrUXVToAup","name":"1989 民國78年","notes":"1989 民國78年\n臺灣第一座228紀念碑在嘉義市落成,位於彌陀路忠義橋橋 頭,2017年因道路拓寬計畫,將紀念碑遷移至垂楊路與彌 陀路路口的228紀念公園。\nTaiwan's first 228 incident monument was completed in Chiayi, at the end of Zhongyi Bridge on Mituo Road. In 2017 the monument was moved to the 228 Commemorative Park at the Chuiyang Road and Mituo Road intersection due to a road widening project.","wiki":"","attachments":["PXL_20211120_052829628.jpeg"]},{"id":"recLU1VsYlWOIg4Fq","name":"阿里山為昔日臺灣三大林場之一","notes":"阿里山為昔日臺灣三大林場之一, 搭乘林鐵用最全面的視角認識臺灣 林業發展史,從阿里山上的集材設 施、樹靈塔,到嘉義市的製材所、 日式木造宿舍群,一路見證木材的 砍伐、運輸、加工及出口。\n來嘉義認識林業發展!\n搭林鐵體驗登山鐵道!固\n阿里山林業鐵路是文化資產鐵道,除特殊的建築 工法外,我們以「動態保存」的精神,修復蒸汽 機車、重製檜木車廂、開放車庫園區,提供各種 接觸鐵道文化的機會,再現林鐵往日風華。\n看窗外欣賞自然景觀! 4,\n阿里山林業鐵路集「產業鐵道」、「森林 鐵道」、「登山鐵道」的屬性於一身。從 嘉義出發後,途經平原農地、熱帶林、暖 帶林、溫帶林,爬升兩千多公尺抵達阿里 山國家森林遊樂區。透過窗外欣賞林相變 化本身,就是搭乘林鐵最大的樂趣。\n下火車探索山村聚落\n阿里山林業鐵路沿線聚落,昔日因林業發展和 運輸而興盛,今日依然保留著質樸的山村風情。 選擇一個小站下車,探索周遭秘境,在步道上尋 覓林鐵蹤影,享受在地自產自銷的小農美食。林 鐵不快,慢活正好。\n林鐵準備上路囉!!!","wiki":"","attachments":["PXL_20211120_054531375.jpeg"]},{"id":"recLbdwE88sKokdgA","name":"世界木造發展現況","notes":"世界木造發展現況\n世界\n木構造潮流\n世界高層木造建築的競賽,大約在2000年後展開。這是因為 2000年以前,歐洲各國建築法規對木造建築的高度限制平 均在2樓高度以下,而2000年開始,部分歐洲國家開始取消 對木構造建築的高度限制。\n在2000年到2010年間,德國柏林、瑞典、英國倫敦等地都出 現了7到10層樓高的建築。2010年後,歐洲各國開始實驗木 造建築的各種可能性,北美則在2010年開始逐步放寬木造 樓高限制,人們開始建造超過10層樓高的大樓。\n2020年,全歐洲逐漸取消對木造建築的樓高限制,而歐盟也 規定所有新建物皆須達到接近零耗能的標準。全世界第一棟 零耗能建築,就是位於美國西雅圖布里特中心;而目前世界 最高的木造大樓,則是美國密爾瓦基的Ascent大樓。","wiki":"","attachments":["PXL_20211120_060442052.jpeg"]},{"id":"recLdXGe9Z0l4hIZy","name":"木造建築 大哉問 ?","notes":"該怎麼 更有效率地 使用木材?\n用木頭蓋房子 有什麼好處?\n森林是 可以砍伐 的嗎?\n會呼吸的木房子 住起來舒服嗎?\n什麼是永續 循環建築?\n木造建築 大哉問 ?\n用來蓋房子 的木材如何 回收再利用?\n木造建築如何 成為維持地球 永續循環的 一個環節?\n如果想要蓋 一間木造房屋, 該怎麼展開 第一步呢?\n砍樹蓋房子真的 可以節能減碳嗎?\n木造的房子好住嗎? 能夠防火防水嗎?","wiki":"","attachments":["PXL_20211120_055230991.jpeg"]},{"id":"recLg4CFYh1Ucxsa6","name":"雕塑","notes":"雕塑\n《自由與平等》,蒲添生 民國80年(1991),嘉義市立美術館典藏。\nSculpture\n雕塑又稱立體造型,包括雕塑、陶藝、裝置藝術、公共藝術\n等。嘉義地區的雕塑早期以蒲添生較為知名,風格以寫實為\n主,後有蔡順和、蒲浩明(蒲添生之子)、李宗霖、林漢\n泉、林信安等。\n蒲添生(1912-1996),生於嘉義美街,祖父蒲榮玉是畫家兼 佛像雕刻師,父親蒲嬰從事裱畫業,因耳濡目染,對藝術發 生興趣。大正8年(1919)入嘉義第一公學校(今崇文國小) 就讀,陳澄波為其導師,後成為陳澄波之大女婿。1928年, 加入林玉山等畫家籌組的「春萌畫會」。1932年赴日進入日 本帝國美術學校,師從名雕塑家朝倉文夫。1941年,回臺發 展、從事創作,扮演臺灣近代雕塑史拓荒者的角色。\nIn the early days, Pu Tian-sheng was the most famous Chiayi scupltor. He played the role of the pioneer of Taiwan modern sculpture history. His style focused on realism. He was succeeded by Tsai Shuen-he, Pu Hao-ming (Son of Pu Tian sheng), Lin Zhong-ling, Lin Han-chuan, and Lin Hsin-an, etc. Pu Tian-sheng's (1912-1996) grandfather Pu Rong-yu was a painter and Buddha sculptor. Father Pu Yin was in the mount painting industry. He became interested in art from observation. During the 8th year of the Taisho Reign (1919), he attended Chiayi First Public School (Currently, Chung Wen Elementary School). Chen Cheng-po became his mentor in 1928. He attended the Chun- Meng Painting Society arranged by Lin Yu-shan and other painters. In 1932, he entered the Japanese Imperial Art School in Japan. Sculptor Fumio Asakura was his mentor. In 1941, he returned to Taiwan, and devoted himself in creation. He played a pioneer role in modern sculpture in Taiwan.","wiki":"","attachments":["PXL_20211120_061424723.jpeg","PXL_20211120_061738369.jpeg"]},{"id":"recLnJmzS222Wdr5w","name":"臺灣杉 Taiwania cryptomerioides","notes":"臺灣杉 Taiwania cryptomerioides\n產地\n屬臺灣重要造林樹種,生長於海拔\n顏色\n香氣\n特性\n1800~2600公尺\n邊材淡紅黃色,心材黃色或黃紅色,\n邊心材分界明顯\n無明顯特殊香氣\n質地輕盈柔軟,耐蟻性極強(不亞於\n紅檜),對蟲類蛀蝕之抗力特強;\n加工完成之材面良好,塗裝性佳\n可作為建築基礎材使用,亦可製作成 門窗、家具等;另外,也常作為化\n妝板 (註)、鑲板、合板等板材使用","wiki":"","attachments":["PXL_20211120_055417225.jpeg"]},{"id":"recLtNPzj1VxFCHBQ","name":"森林到木建築 永續循環","notes":"森林到木建築 永續循環\n在臺灣,森林資源使用與環保意識始終不斷地拉鋸。 木材成為建材,究竟對森林資源與環境生態有益或者 有害?砍樹蓋房子,會不會讓森林越來越少呢?\n在二十一世紀的現代,不管在北美、歐洲、日本,都 有計劃地栽植「人工林」,在之中種植作為建材的樹 木,如臺灣柳杉、北美花旗松、歐洲雲杉、日本柳杉 等。當樹木長到一定大小時,就可以砍下當建材,並 在原地種下另一顆小樹苗,確保人工林可以永續發 展。\n如此一來,既可保育原始森林長久孕育的生態,同時 透過不斷砍伐、回植人工林,就能更進一步地促成林 木資源的永續並同時兼顧環境生態保護了。","wiki":"","attachments":["PXL_20211120_055802343.jpeg","PXL_20211120_055808194.jpeg"]},{"id":"recMKqxk0JxFR8yzZ","name":"永續森林認證機制","notes":"森知識\n永續森林認證機制\n。 FSC™ 認證是由森林管理委員會(Forest Stewardship Council,FSC)核發的 認證,確保產品所使用之木材、木料是來自可循環永續的【良好管理森林】 其認證分為兩類:一為森林管理認證,主要用於天然林與人工林的管理機構; 另一認證為產銷監管鏈(Chain of Custody,CoC)認證,主要是認證產品從 森林到消費者的完整過程,都在管制下使用FSC™ 認證之材料。\nPEFC 森林驗證認可計畫(Programme for the Endorsement of Forest Certifi cation)則是由代表森林產業的各個產業團體所成立的森林驗證推動計畫,以 獨立、非營利及非政府組織的形態來推動第三者驗證制度,以促進赫爾辛基協 議(Helsinki Agreement)所定義的森林的經營、環境和社會效益。此認證 根據泛歐標準評估森林經營,引進區域認證概念,以有利環境、有益社會與經 濟可行的森林管理來推動永續發展。","wiki":"","attachments":["PXL_20211120_055813784.jpeg"]},{"id":"recMU0Ebvi8OKh0ZC","name":"木湯匙X30","notes":"木湯匙X30|單匙\n木椅2|單椅\n單匙4(W)X15(L)×0.8(D) cm 使用年限 10年\n44(W)X60(L)X51(D) cm.\n使用年限 20年\n老舊的木椅磨去朽壞的部分、再次拆解的話, 可以作為更小的材料,製作成30支木湯匙。 如此,這棟從一開始被砍下作為柱結構的樹, 又延續了第三段生命,成為可以使用的餐具。\n拆卸下來的木柱,可以切割成更小的木材再次 利用。如果把前一項柳杉木柱展件裁切後,可 製成兩張現場展示的木椅。原來撐著屋頂的木 柱,展開了第二段生命-讓人們舒舒服服地坐 在上頭的木椅,好好保養的話可以坐上20年。","wiki":"","attachments":["PXL_20211120_055254377.jpeg"]},{"id":"recMrMRvgKCXzH586","name":"共榮館","notes":"共榮館\n碳儲存量\n87,800kg=137棵柳杉\n過去往返阿里山的木構旅社|建於1921年\n坐落在忠孝路與蘭井街口的共榮館,距今一百年前曾經是嘉義 小鎮裡頂級酒家與旅社,空間規畫頗具規模。現存的木構造中 仍可看到二樓圓窗、弧形陽臺,目前作為民宅使用,一樓開有銀 樓、水果攤、金紙店與理髮店,充滿庶民的生活點滴。","wiki":"","attachments":["PXL_20211120_055618813.jpeg"]},{"id":"recMt4jtIGJHosDhW","name":"祥太文化館 Hosanna Museum","notes":"祥太文化館 Hosanna Museum\n成立於2003 年12月,館內主要蒐藏具臺灣本土特色與文化 價值之交趾陶及相關文物。包括清末民初的葉王、柯訓、 洪坤福、林添木、陳專友等臺灣早期宗師的珍貴作品。以 及史前陶製品,與珍貴的宋瓷器等,文化價值極高,被美 譽為「嘉義小故宮」 。\nIt mainly houses culturally valuable Taiwan Koji Pottery and related cultural relics. The exhibits are mainly the precious works of early grand masters such as Ye Wang, Ke Xun, Hong Kun-fu, Lin Tian-mu and Chen Zhuan-you from the late Qing to early Republican period.","wiki":"","attachments":["PXL_20211120_061408206.jpeg"]},{"id":"recMxhSCuxIMK3ywW","name":"嘉邑城隍廟","notes":"嘉邑城隍廟\n38,080kg=60棵柳杉\n在地文化信仰代表(閩式木構)|最早建於1715年\n經數次重建,現存廟宇為1937年由泉州溪底派匠師王錦木主司重 建,於1940年竣工,廟體為閩南式建築,斗拱皆以榫卯工法組成。","wiki":"","attachments":["PXL_20211120_055602124.jpeg"]},{"id":"recN3QJw56al81y3h","name":"木材自給率為何重要","notes":"木材自給率為何重要\n國產木材 VS 進口木材\n儘管臺灣林木資源豐富、森林覆蓋 率高達6成,也已經有近百年的開 發歷史,但由於經濟目的為導向 的人工林栽植計劃並不明確,因此 目前的木材自給率不及1%,使用 的木材也大多仰賴進口。\n然而,將木材作為帶有永續性質的 材料來思考時,進口所需的長距離 運送反而會增加碳排量;因此若能 使用最短距離、在地植種、生產的 國產材,提高臺灣島內的木材自給 率,才能養成臺灣的木材內需市 場,成為推動林業重啟的動能,回 歸全球永續的精神。\n因此,「在地生產、在地使用」是 推廣臺灣國產材最重要的目的,也 是活化臺灣林業的重要思維。\n我們一起來看看,目前臺灣常用的 木材有哪些是國產材呢?","wiki":"","attachments":["PXL_20211120_055301156.jpeg"]},{"id":"recNYhSmEhQvGFUcZ","name":"舊木料回收再利用","notes":"舊木料回收再利用\n嘉義的老屋建材銀行\n\n嘉義在過去因為有許多舊木造建築,因此有一些木家具或 是木門窗的工廠,會回收再利用從木造屋子拆解下來的舊 木料。這些工廠有一個很酷的名字叫「老屋建材銀行」。 從一棟幾十年的舊木屋取得的木料,體積相較於木門窗、 木家具或是木材小物都來得大,因此經過刨光處理後的舊 木料,可以用來製作更小型的木造製品,讓大家再繼續使 用幾年,也讓同一根木料能得到碳儲存的永續循環。\n木柱\n直徑約20cm,長120cm 使用年限50年\n從老屋拆卸下來的柳杉木柱,已經使用了超過 50年。這根尺寸長達2公尺、直徑達20公分的 木柱,是生長超過30年的柳杉。在屋中擔任 支撐屋頂的木柱,在老屋類朽後被拆除下來, 也卸下了第一階段角色任務。","wiki":"","attachments":["PXL_20211120_055245555.jpeg"]},{"id":"recOk9dCoHB500rBC","name":"森林的 多樣用途","notes":"森林的 多樣用途\n天然林vs. 人工林\n森林裡有很多樹種,然而並不是所有森林都適合砍伐作為林木資源。\n根據森林資源的永續觀念,可以將之區分為天然林與人工林。\n天然林是以自然的力量,不經過人為助長、自然形成的森林,通常孕 育著豐富的自然生態系。人工林則是人工栽種、培育、養護的森林,通 常以製成木材資源作為目標,因此會在森林經過一段時間生長後,適 當的砍伐利用,也會在原地回植新的樹苗。\n從「砍樹救地球」的永續觀點來看,砍伐作為木材的樹木,應該由人工 林來栽植、取得,並透過重複的種植、培育、伐木的循環,確保人工林 的永續利用。\n森知識\n天然林\n天然林與人工林的比較\n人工林\n天然林\n有計劃栽種,林相較一致\n草木灌木階段\n幼齡林階段\n多數種混生,林相複雜\n成熟林階段\n老齡林階段\n人工培育\n自然生成\n人工林\n生態系較簡單\n生態系較豐富\n人類活動干擾少\n為人力介入栽培\n幼龄林階段\n草木灌木階段\n成熟林階段\n疏伐\n以砍伐為目的\n以保育為目的\n皆伐","wiki":"","attachments":["PXL_20211120_055912495.jpeg"]},{"id":"recOnrCQ5TLn755vT","name":"阿里山 林業鐵路 Alishan Forest Railway","notes":"阿里山 林業鐵路 Alishan Forest Railway\n阿里山林業鐵路在伐木的年代結束之後,轉 型成觀光鐵路性質,本線起自嘉義火車站, 終點為阿里山站,營運中的支線包含祝山線 (觀日列車)、神木線、沼平線,另已停駛 水山線、眠月線、神木線終點為神木站,因 阿里山第一代神木而得名,神木樹種為紅 橋,樹齡達3000 餘年,目前已經煩倒橫置 於原地。\nAfter the logging boom came to an end, Alishan Forest Rallway was transformed into a tourist railway. The terminus of the Shenmu line is Shenmu Station, named after a first genomu (glant/sacred tree) in Alishan. The u tree is a red cypress over 3000 years old, and is currently lying on its side in its original place.","wiki":"","attachments":["PXL_20211120_054432033.jpeg"]},{"id":"recP433phIZvRbjm1","name":"刺繡工坊 Embroidery Workshop","notes":"刺繡工坊 Embroidery Workshop\n明清移墾時期,刺繡工藝師傅從中國大陸將刺繡技藝帶 入臺灣,並逐漸繁榮興盛創造出屬於臺灣的刺繡特色。 在刺繡產業繁盛時期,以神祇衣冠、八仙綵、旗幟、門 簾、枕頭套、被單、布袋戲偶衣服、歌仔戲服以及婚嫁 等等各式各樣織品為大宗。\namwe\n隨著時代的變遷,刺繡產業的變化,使得傳統刺繡工藝 沒落,當時繁盛景象己不復見。近年透過文化創意產業 的手法,將傳統工藝與現代設計結合,讓刺繡題材不框 限於傳統民俗或信仰相關物件。\nDuring the period of settlement in the Ming-Qing dynasties, embroidery craft masters brough the skills to Taiwan from China. The industry grew and embroidery with Taiwanese characteristics developed. At the height of the industry's prosperity, the main items made were god clothes and hats, 8 celestials embroidered cloth, flags, curtains, pillow cases, quilts, Budai puppet costumes, Gezai opera (traditional Taiwanese opera) costumes, wedding dresses and other fabric items. In recent years, traditional craft and modern design have been combined to take embroidery subjects beyond traditional folk customs and belief related objects.\nGREJA","wiki":"","attachments":["PXL_20211120_053925327.jpeg"]},{"id":"recP6WTcxqo5OK42a","name":"木材防火特性","notes":"木材防火特性\n木材雖然是一個易燃材料,然而木材遇火燃燒時,會在表面形成一層炭,稱為炭化層。 這一層炭化層可以阻絕空氣繼續進入木材内部,就能形成保護,使木材内部繼續受火 害的影響。通常建築結構中所使用的大斷面木材都可以用炭化來達到防火的效果,火 災時木材產生炭化層的平均速度為每分鐘0.6至0.8公厘。若是較小斷面的木材,則建議 使用水泥板或是石膏板被覆的作法達到防火的效果。\n炭化服\n工程木材種類:集成材(Glued Laminated Timber) 垂種:花旗松(Douglas fir) 世燥试路150分鐘 文化產生速率:0.6-0.7公/分鐘\n[原始斷西\n炭化\n建造一棟木建城\n■ 堤防木材\n其化深食輔由是木材证會(APA-The Engitierred Wood Associate)提供\n火災後\n火炎龍\n木造建築的防火機制\n木質樱合包屋型防火设计 調料来源:ETimberian TAMcAN-E布水面的牙","wiki":"","attachments":["PXL_20211120_055934469.jpeg","PXL_20211120_055937996.jpeg"]},{"id":"recP6vW5BbpG5rHVF","name":"嘉義畫派","notes":"嘉義畫派\n嘉義是日治時期全臺地方畫會密度最高的地區,嘉義地區的畫家多 次在臺展、府展入選,因而產生「嘉義畫派」一詞。不僅符合「時 代精神」,也不負官方政策的期待,藝評界對嘉義的藝術風格賦予 「嘉義青年畫派」或「諸羅派」之名。當時嘉義地方畫家人才濟 濟,畫家與藝文愛好者相互結社,風氣鼎盛,此時期在畫風取材上 以「地緣美術」為主,展現地域性的風土人文。","wiki":"","attachments":["PXL_20211120_061544307.jpeg"]},{"id":"recPDpaXbkXeMIwnN","name":"現代木造在嘉義","notes":"現代木造在嘉義\n嘉義市立美術館\n現代木構造進入嘉義市後,開始刻劃出過去「都」的新一代面貌: 首先,嘉義市立美術館現代木構造成功翻新了老舊鋼筋水泥建 築,這棟既嶄新又保留了原設計風貌的美術館,究竟有哪些引人入 勝的地方呢?若用木構造來搭建公共建築,又能如何提升城市景 觀?本展區除了介紹嘉義市在地現代木造建築代表作——嘉義市 立美術館之外,也提出一座木造公共建築的想像提案,邀請大家一 起來思考新一代木都的未來展望。","wiki":"","attachments":["PXL_20211120_055632105.jpeg"]},{"id":"recPjqZR6wT0nIdXN","name":"古典文學 Classic Literature","notes":"古典文學 Classic Literature\n嘉義文風的盛行,漢詩的創作與宗教祭祀有著密切的關 連,許多聯吟大會係由廟團舉辦,配合廟慶節日舉行,成 為祭祀活動的一環。從遊宦與在地詩人的唱酬,到本土科 甲人士的興起,皆與結社活動的興隆密切相關,無不假社 團以結文學同好。隨後家族書寫到八景詩的大量出現,可 以說構成了嘉義文學的主要特色,其中家族書寫以「賴 氏」、「張氏」的重要性最大,而家族的發展與嘉義文學 呈現相輔相成的關係。\n《一籃清豔燦秋風》,張李德和水墨畫。 民國39年(1950),國立臺灣美術館典藏。","wiki":"","attachments":["PXL_20211120_061631385.jpeg"]},{"id":"recQ4ftL8CIJoS01K","name":"木藝工坊 Wood Art Workshops","notes":"木藝工坊 Wood Art Workshops\n嘉義市因林業的發達,相關加工產業、木藝工坊衆多, 也促進「欄間木雕」(俗稱花板)的興盛。「欄間木 雕」多使用在日本和室建築裝飾,民國50年代,嘉義 市成為花板產業的集中地區,成品多外銷日本,極盛時 期多達千人從事花板相關工作。近年因日本建築轉為現 代風格,花板需求量銳減,嘉義花板工藝也逐漸式微, 目前僅存工藝師陳佐民。部份產業轉型為觀光工廠或文 創工坊,讓民眾更容易接觸到傳統產業,延續木藝的傳 承與推廣。\nDue to the highly developed wood industry, there were many processing operations and wood art workshops in Chiayi and this promoted the popularity of ranma panel carving (commonly known as patterned panels). Ranma panel carving was used for decoration mainly in Japanese style buildings. In the 1960s, Chiayi was the center of the ranma panel carving industry and exported to Japan. In recent years, demand for ranma panel carving has fallen and the ranma panel carving craft has faded. Today, only craftsman Chen Zuo-min remains. Some workshops have become tourist factories or cultural and creative workshops and have carried on promoting and passing on wood art.","wiki":"","attachments":["PXL_20211120_053809422.jpeg"]},{"id":"recR5W6lHEzuMXjOK","name":"草魚湯 Grass Carp Soup","notes":"草魚湯 Grass Carp Soup\n草魚為臺灣常見的養殖魚種,成魚體型大,以水生植 物、水草或投放牧草為食。嘉義的草魚湯食材來源充 沛,就近於雲嘉地區與虱目魚混養的魚塭採購,產地新 鮮直送的食材,也是成就美味的重要關鍵。草魚湯魚肉 大塊、口感柔嫩,熬煮成草魚湯搭配滷肉飯,或是製作 成草魚粥,都鮮美可口,部分店家甚至有隱藏版的魚 腸、魚卵等料理。店内分草魚的頭、肉、尾不同部位販 售,頭部肉質有咬勁、魚身肉大塊刺少,魚尾則膠質 多、刺也多,不同部位各有愛好者。\nChiayi has an abundant supply of ingredients for this soup. The grass carp can be sourced from ponds in the Chiayi-Yunlin area where the fish are reared together with milkfish. Big chunks of grass carp are cooked to make soup that is served with Rouzaofun (rice with chopped pork) or made into grass carp rice porridge. Some restaurants even have their house special grass carp sausage and roe and other dishes. The head, meat and tail of the fish are sold separately. The meat of the head is chewy, the meat of the body has large pieces and has few bones; the tail is rich in collagen but also has a lot of bones. People's favorite part differs person to person.","wiki":"","attachments":["PXL_20211120_053140012.jpeg"]},{"id":"recRKJNS1do0piBZt","name":"崙坪文化園區木構棚剖模大樣","notes":"崙坪文化園區木構棚剖模大樣\n崙坪文化園區的木構棚設計中,由於希望將集構巧妙隱藏,因此每組鐵件的 大小不一,搭配焊接角度有上百種組合。這次展示的十字鐵件加工方式,是 預先在集成材上完成預留溝與穿孔釘孔位的加工,再於現場組裝時,將十字 鐵件放入溝槽後,將穿孔釘打入安裝,使鐵件緊密接合。此木構棚所使用的 鐵件共計有 446 組。\n中層下層連接點\n穿孔訂单園\n上部木構件進行組裝\n木構件組裝完成後進行鎖固\n先在下層木構件上安裝接合鐵件","wiki":"","attachments":["PXL_20211120_060011069.jpeg","PXL_20211120_060014232.jpeg","PXL_20211120_060025133.jpeg","PXL_20211120_060030483.jpeg","PXL_20211120_060020738.jpeg","PXL_20211120_060017673.jpeg"]},{"id":"recRSUsvDXMrNlUXs","name":"傳統曲樂 Traditional Music","notes":"傳統曲樂 Traditional Music\n戲曲是民間熟知並相當重要的表演藝術,具有宗教慶典、生命祭 儀與族群凝聚等功能,《諸羅縣志》卷四《祀典志〉記載「大 合樂以祀先聖」、嘉慶14年(1809)王得祿(嘉義縣太保市 人),曾邀集諸生員、驚生練習祭孔,按時習樂、習舞,從事祀 孔典禮,創設「友聲社」;光緒5年(1879)張應生、歐玉堂、 林登雲等劇「兩難社」;光緒14年(1888)由軒轅氏提倡,其子 繼昌及賴建藩、巫朝鳳、林蔬芝、蔡天送再組成「貴和社」。至 昭和8年(1933)吳太和、賴柏舟、汪長生又粗「鳴玉社」,皆 設聖樂局,訓練樂舞生。民國35年(1946)「友聲社」、「蕭謎 社」和「鳴玉社」曾組成「崇聖國樂會」,這些樂社都曾經參與 祭孔大典的雅樂演奏。隨著時代的演變,傳統音樂在現代都市化 社會也逐漸式微。\nDrama was a well known and very important performance art. It had the functions of religious ceremonies, life rituals, and group gatherings. The 4th Section of \"Jhuluo County Record\",\"Sacrificial Ceremony Record\" recorded \"Big Musical Gathering to worship ancestors\" During the 14th year of the Jiaqing Reign (1809), Wang De-lu (Chiayi County Taibao City), invited students and children to practice how to worship, and regularly learn music and dance, and be involved in worship ceremonies. With the passage of time, traditional music gradually faded in modern urban society.\n上劃,全車程共圖堂家將團 (HE)(年代:1900)\n青宋昌博供。","wiki":"","attachments":["PXL_20211120_061559855.jpeg","PXL_20211120_061609941.jpeg"]},{"id":"recRd3tpiTtb93iAS","name":"尋古訪勝諸羅城 Seeking Out Ancient Jhuluo City","notes":"尋古訪勝諸羅城 Seeking Out Ancient Jhuluo City\n嘉義市的文化資產屬國定古蹟有嘉義城隍廟、嘉義舊監獄\n等2處。市定古蹟有清代葉明邨墓、清代王祖母許太夫人 墓、嘉義仁武宮、八獎(掌)溪義渡、道爺圳糯米橋、嘉 義營林俱樂部、阿里山鐵路北門驛、原嘉義農林學校校 長官舍、原嘉義神社附屬館所、嘉義火車站、嘉義蘇周 局、天理教東門教會、津本食堂喫茶部(黃文醫生故居)\n連宗祠、嘉義西門長老教會禮拜堂、菸酒公賣局嘉義分\n等15處。","wiki":"","attachments":["PXL_20211120_054317359.jpeg"]},{"id":"recRgKiSiTrdfxuvv","name":"林業物語","notes":"林業物語\n阿里山的開發\n臺灣島內蘊藏豐富的專業資源,較具規模的森林開發大約從 1900年代後日本統治臺灣時期開始。\n作為當時日本統治版圖中,地處偏南端的亞熱帶林業地域,日 1925年開始到1935年的「森林計畫事業」,更包含有森林調 查、區分調查及境界测量等各種不同項目,這也是「森林」第一 次被獨立出來成為一個事業經營的類別。\n本政府來臺後即展開一連串針對林業物種研究與調查。而從\n包含阿里山林場、八仙山林場與太平山林場,日治時期三大官 營伐木場,均以高品質檜木、扁柏等高價針葉樹為主,也是 森林被視為臺灣重要資源的開始。\n森知識","wiki":"","attachments":["PXL_20211120_060135471_MP.jpg"]},{"id":"recRiIOUvYVikMF3l","name":"嘉義地質 Geology of Chiayi","notes":"嘉義地質 Geology of Chiayi\n嘉義市的地質結構大多為年代較新的沖積層,而靠近山 麓地帶為礫岩及砂、頁岩互層的頭嵙山層,岩石、泥岩 構成的山層及臺地堆積層,地質的特性如下:\n1. 沖積層:由礫石、砂及泥土組成。\n2. 頭嵙山層本層:依岩性分為上下段,上段為砂岩和石 英質砂岩組成的火山礫岩;下段為由厚層砂岩和砂岩\n與頁岩或泥岩互層。\n3. 紅土臺地堆積層:多為礫石,由砂岩及石英質砂岩所 組成,表層覆蓋1~3公尺不等厚度的紅土。\nThe geological structure of Chiayi City is for the most part caused by relatively recent alluvial deposits, and Toukeshan Formation near the foothills area is a conglomerate made up of layers of sand and shale. The mountain layer is composed of rock, mudstone and a tableland layer. The geological characteristics are as follows:\n1. Alluvial deposit: formed from gravel, sand and soil 2. Toukeshan Formation: the top part is volcanic conglomerate formed of sandstone and quartz sandstone; the lower part is layers of\nsandstone and interbedded sandstone with shale or mudstone. 3. Laterite tableland accumulated layers: much is gravel, formed from sandstone and quartz sandstone, and the surface layer is covered in Laterite (red soils).","wiki":"","attachments":["PXL_20211120_052253868.jpeg"]},{"id":"recRzDBoUbTxYXvHR","name":"製香舖 Incense Shop","notes":"製香舖 Incense Shop\n嘉義地藏庵創立於康熙 56 年(1717),由於香火鼎 盛,線香需求量大,鄰近的凌霄厝(今雲霄社區)發展 出製作線香的產業聚集。線香的兩大關鍵為「剖香腳」 與「製香」,「剖香腳」將竹筒多次對剖成約0.3 公分 的細竹棒,再將香腳均勻沾黏香料粉,重複4次以上, 才完成線香。「剖香腳」不需複雜的材料與工作空間, 早期社區中許多婦女以此為副業貼補家用,成為南臺灣 知名的香腳產地,直到這項工法被機器製作取代。\nChiayi's Dicang Temple (Dicangan) was established in 1717. The large number of worshippers led to large demand for incense and so an incense production settlement formed at nearby Lingxiaocuo (today's Yunxiao Community). The two key steps to making incense are splitting the foot of the incense stick and making incense. Splitting the foot of the incense stick does not require complex materials or work space so this was often done by community women at home to bring in extra money. The community became a well-known incense foot production site in south Taiwan, its role only ending when the process was mechanized.\n剖香腳","wiki":"","attachments":["PXL_20211120_053938816.jpeg"]},{"id":"recSYQImE1HJFYFAT","name":"1982 民國71年","notes":"1982 民國71年\n7月1日嘉義市升格為省轄市。\nChiayi was upgraded to a provincial city on July 1st.","wiki":"","attachments":["PXL_20211120_052823614.jpeg"]},{"id":"recSiw4xzN4f2jk04","name":"建國二村 Jian Guo Second Village","notes":"建國二村 Jian Guo Second Village\n原址鄰近嘉義公園、嘉義高中,主要為空軍眷屬進住, 部分建築為日軍遺留的破舊日式官舍,少數眷戶圍牆內 尚有圓拱型防空洞,軍方並委請建築師新建房舍提供眷 戶居住。後期人數漸增,居民自行擴增、改建,形成多 元的眷村建築景觀。因眷戶聚集周邊成為知名的「國民 路美食街」及「空軍市場」\n眷村已於民國94年(2005)拆除,居民多搬遷至「經國 新城」 當地徒留「志航里」與「志航街」的名稱,仍 可窺見與「空軍」的淵源。 。\nThe original site of this settlement that housed mainly Air Force dependents is near Chiayi Park and Chiayi High School. The village buildings included dilapidated d Japanese style buildings left by the Japanese military and new buildings that the Air Force commissioned an architect to design. In the later period, as the number of residents grew, households extended the buildings themselves, creating a diverse architectural scene. Jian Guo Second Village was demolished in 2005 and the residents relocated to Jing Guo New Village.\n嘉義市眷村歷史文物網 http://www.cabcy.gov.tw/web/Village/","wiki":"","attachments":["PXL_20211120_053618431.jpeg","PXL_20211120_053624203.jpeg"]},{"id":"recSjyiDqHpsBf1px","name":"林業 Forestry","notes":"林業 Forestry. .\n嘉義製材所的天車 《嘉義寫真六》,民國106年(2017),林麗鳳提供。\n日治時期的阿里山林場是臺灣最大的林場,擁有豐富的 林木資源,最知名的樹種便是臺灣扁柏及紅檜。由於林 業的發達,也帶動製材業以及木材加工業的發展,增進 嘉義的經濟繁榮,當時相關從業人員佔全市人口一成以\n上,超過7000人。\n。 鄰近嘉義火車站 林森西路,成了居民口中的「木材 街」,兩旁幾乎都是製材行,周邊林務機關集中區域則 為「檜町」 時至今日生態保育意識抬頭,相關的產業 開始衰退,阿里山鐵道也如現今所見,慢慢地轉換成觀 光資源。\nAlishan Forest Station under Japanese rule was Taiwan's largest forestry station. The area had rich forest resources, and the most famous species of tree were Taiwan cypress and Taiwan red cypress. Development of the forestry industry also spurred the development of the sawmill and woodworking industries, promoting economic prosperity in Chiayi.\nLin Sen West Road next to Chiayi Railway Station became \"Wood Street\"\nin local parlance. Both sides of the street were line with sawmills, while\nthe surrounding forestry infrastructure area was known as the \"Cypress\nTrail\".","wiki":"","attachments":["PXL_20211120_052054848.jpeg"]},{"id":"recSzSBZsyxo9mo47","name":"現代木造的結晶 木材與金屬的結合","notes":"現代木造的結晶 木材與金屬的結合\n嘉義市立美術館剖模大樣\n嘉義市立美術館的改建案中,使用了如魚腹般的大跨距木桁架結構,打造出 充滿律動感的室內空間。以木結構為主體,不僅為空間帶來了張力,也為再 生型美術館開創觀覽的全新視野。\n本案的設計構想是在既有建築中,藉由新增的三角形量體為核心,形成明亮 的空間,並且讓建築型態從原本的碎裂趨於完整,透過新舊形式的共構,創\n造出嶄新的臺灣木構建築視野。","wiki":"","attachments":["PXL_20211120_060007729.jpeg"]},{"id":"recT1GXeutypMGjKX","name":"以木材打造的家園 彷彿生活在森林般自在","notes":"以木材打造的家園 彷彿生活在森林般自在\n擁有豐富森林資源與早期業開發經驗的嘉義,大街小巷中遍藏著木建築。過 去曾有一段時間,因為阿里山林業的開發,使得嘉義成為全臺最大的木造城市, 也一度擁有與海外銜接的製材、集材技術,建立起完整的產業鏈。然而在過 去長時間的禁伐政策主導下,「森林」漸漸地不再被視為可用資源,而僅僅是作 為自然遊憩景觀。\n森林一定不能砍伐嗎?從森林衍生的林木使用,是否有機會成為21世紀節能減 碳與永續循環的一種可能?木造建築是否也能成為支持地球資源永續的一個環 節?若能善用儲存著碳的木材來打造以木造城市,其效益就像建構一座巨大的 人造森林,能將森林資源最大化。\n｢森林之嘉:現代木造建築特展」,希望在這個有著「水都」美名的城市,與市民們 一起在日常生活中尋找木材DNA,嘉義市將成為全臺最綠的新一代宜居城市; 也希望透過呈現木構造的城市風景,孕育出屬於嘉義人的永續未來。","wiki":"","attachments":["PXL_20211120_055513985.jpeg"]},{"id":"recTInw87nVrVLghn","name":"演藝團隊 Performance team","notes":"演藝團隊\nPerformance team\n新的娛樂科技形態進入民眾生活,傳統的戲曲表演僅於廟會活\n動,或公部門補助等少數表演空間。近年因文化創意產業的概念\n提升,相關單位、學術團體與民眾的關注,傳統劇團力求轉型,\n並積極導入新的表演概念、技術效果等,傳統戲曲表演活動又慢\n慢回到民眾的視線內,就近期尚見演出之團隊進行介紹。\nNew entertainment technology entered people's lives. Traditional drama performance\nwas restricted to temple events, or few performance spaces receiving government\nsubsidies. In recent year, traditional troupes looked for transformation, actively.\nintroducing new performance concepts and technical effects, etc. Traditional drama\nand performance events gradually attracted the people once again. Recently, we can\nstill see the introductions of performance teams.","wiki":"","attachments":["PXL_20211120_061639135.jpeg"]},{"id":"recTZhTLz6vAsSGJf","name":"許世賢博士紀念館 Dr. Kuo Sie-Hien Memorial Hall","notes":"許世賢博士紀念館 Dr. Kuo Sie-Hien Memorial Hall\n- 嘉義媽祖婆 -\n許世賢士\n位於嘉義市世賢圖書館3樓,為感念「醫界女傑,政壇英 雌」許世賢博士為嘉義市所做的貢獻,展示相關文物、介 紹生平概略、政治貢獻等,藉以宣揚「世上無雙醫政治, 賢能第一女英才」風範與事蹟,傳承嘉義民主聖地的精神 而設立。\n在嘉義只要說到人等食\n起大拇指,大家就感地话一玩家社即墨黄金\n性首長,而對於推制出的人,不论用在製\n敬愛有加,許博会极光辉与我才後得\n老世的人生\nOn the third floor of Chiayi City Sie-Hien Library, it displays cultural relics related to Dr. Kuo promote the example and deeds of this pioneering female Taiwanese academic and politician.","wiki":"","attachments":["PXL_20211120_061357201_MP.jpg"]},{"id":"recU2WP52vmAeklSP","name":"臺日美度量衡比較","notes":"臺日美度量衡比較\n臺灣現行採用的度量衡制度,建立於日治時期臺灣總督府多次頒布的度量衡相關 法規,逐步以日本的尺貫法取代臺灣的度量衡制度。部分臺制度量衡單位的數值 與日制相同,如現今慣用的「台尺」。一台尺(日尺)等於30.3公分。臺灣常見的 木夾板3x6板,也是源自於其3尺 (90.9公分) x6尺(181.8公分) 的尺寸。 另外北美2x4工法使用美式度量衡,一英尺等於十二英吋(30.48公分)。北美2x4 工法是指主要結件的斷面尺寸為2吋(5.08公分)x4吋(10.16公分)的工法。然而構 件需經過乾燥處理後才能使用,因此尺寸為2吋x4吋的斷面經過乾燥後,所得的 規格尺寸大約為3.8公分x8.9公分。","wiki":"","attachments":["PXL_20211120_055742590.jpeg"]},{"id":"recUj1Naj7dDZePIY","name":"柳杉原木","notes":"柳杉原木\n原木材料為30~35年生柳杉(Cryptomeria japonica)原木,為 2019年11月於國立臺灣大學實驗林管理處內茅埔營林區第22林 班60-6號造林地採取。\n資料提供: 國立臺灣大學實驗林管理處","wiki":"","attachments":["PXL_20211120_060403959.jpeg","PXL_20211120_060410429.jpeg","PXL_20211120_060415506.jpeg"]},{"id":"recUtczsCAy3vPWyh","name":"我害怕住木屋 混合構造結構系統","notes":"我害怕住木屋 混合構造結構系統\n或許,有些人擔憂木構造的機能與造價,但又想體驗木屋的生活質感。近年 來,也有越來越多的木構造建築朝向混合結構系統的形式發展。在嘉義,也 存在著早期保留下來的磚木混合結構形式。這樣的混構造方式,也漸漸成為 現代木造建築的重要思考,在北美也有愈來越多的住宅建築,將2到4層不等 的輕木結構,直接建在1至2層的鋼筋混凝土樓層上,形成4到6層高的混合建 築結構系統。\n此類建築最大的優勢在於底層的混凝土建築可以達到較高的防火及防潮規 格,因此適合作為餐廳、商場等空間使用。上半部的木造建築因材料較輕,\nJackson Street Apartments\n華盛頓州西雅圖Seattle Washington\nJackson Street Apartments為一混合構造結構系統,由兩棟5層樓高\n及7層樓高的建築組成,由3層樓及5層樓的木構造放置於2層樓的鋼\n筋混凝土結構上。下部2層樓為商業用途及停車場,上部木構造為住\n宅用途,內含3960平方公尺的商業空間,及約532個居住單位。\nJackson street apartments 接近完工照\n施工現場照片\n\n同時具有能快速組裝的優點,是極具優勢的輕量化建築結構。此外,由於 木造房屋也可塑造較佳的生活空間及品質,適合作為住宅類型建築的主要 材料。\n目前臺灣建築技術規則中規定,木造住宅樓高最高僅能達4層樓及14公 尺,雖然相較於國外無法呈現中高樓層的混合構造結構系統。然而,從現 有法規架構思考4層樓乃至未來可能開放的6層樓木構造建築,探討混合構 造結構系統的可能性,對於臺灣現有單一的都市景觀而言,也會是建構臺 灣都市木造的第一步。\nKINETIK\n威斯康辛州密爾瓦基 Milwaukee Wisconsin\nKINETIK為一複合用途建築,總計6層樓高,由4層樓的木構造放置於 2層樓的鋼筋混凝土結構上。下部2層樓為商業用途及停車場,上部4 層樓為住宅用途。總樓地板面積為20340平方公尺,內含1485平方 公尺的商業空間,共有184個停車空間及140個居住單位。\n貼附木造建築外部防水層\n底部鋼筋混凝土上部疊上木構造建築\n建築透視模擬筆\n法","wiki":"","attachments":["PXL_20211120_060056018.jpeg","PXL_20211120_060059123.jpeg","PXL_20211120_060102828.jpeg"]},{"id":"recVHN2IbtQQceJxB","name":"如何計算碳儲存量?","notes":"如何計算碳儲存量?\n經過光合作用將碳儲存於體內的木材,只要不燃 燒或腐朽,碳素就可以保存在木材中。林務局目 前推行的碳儲存推估系統,是根據聯合國政府間 氣候變化專門委員會(Intergovernmental Panel on Climate Change, IPCC)所提出,以 生長量估算碳吸存量的計算公式,木材使用材積 之數量×木材絕乾比重×木材之碳含量百分比, 就能得到木材的碳儲存量。","wiki":"","attachments":["PXL_20211120_055525948.jpeg"]},{"id":"recVmgTX6VioaVke8","name":"構築 現代木造","notes":"構築 現代木造\n傳統木造工法強調職人手作技術,透過手工刻劃出各 部位的形式,例如各種榫接頭、樑柱、雕刻等,接著進行 組裝。而現代木造工法強調工業化及規格化,也會將木 材與其他材質搭配使用,並根據各材料特質進行混搭。\n在木料接合上,傳統工法常見的榫接頭,需於接合部鑿 出缺口,讓榫頭插入,因此容易造成刻鑿缺口處木料缺 損,產生被破壞風險。而在現代工法中,則利用鐵件取 代木料接合,因鐵件單位密度及強度高,裝設於刻鑿缺 口,相較於木造方式,可大幅降低被破壞風險,進而提 高建築物整體安全性能。\n接著,就讓我們看看現代木造有哪些常見的金屬接合 工法,以及嘉義市立美術館使用了哪些金屬接合部吧。","wiki":"","attachments":["PXL_20211120_060002877.jpeg"]},{"id":"recW74AxpzxHk55Ax","name":"1993 民國82年","notes":"1993 民國82年\n市政府文化局舉辦第一屆嘉義市國際管樂節,多年來已成為 臺灣具代表性的古典音樂活動,吸引國內、外管樂團體踴躍 參加。活動包含室内、室外的各種音樂會、踩街遊行等。\nThe City Government's Cultural Affairs Bureau held the first Chiayi City International Band Festival. Over the years the festival has become an annual classical music event in Taiwan, attracting enthusiastic participation from domestic and international bands.","wiki":"","attachments":["PXL_20211120_052829628.jpeg"]},{"id":"recWJKfmHWBrMKFE8","name":"古生物研究 Paleo-organism Research","notes":"古生物研究 Paleo-organism Research\n38 億年前,地球開始出現了生物,並持續演化至今。它 生物學家透過研究地底下的化石,嘗試了解這些遠古三 物的演化歷史,和建構這些生物的親緣關係。例如這些 研究可以得知馬是如何從最早體型如狗大小,逐漸演 成現今所見高大的馬。另一個例子是1990年代發現,身 上長著細毛的恐龍如何演變成為鳥的過程。近年來科學 家更利用古代DNA探討人類的演化問題,提供古生物研 究全新的視野 O\n3.8 billion years ago organisms began to appear on the Earth, and have continued to evolve to this day. By researching fossils in the ground paleontologists attempt to understand the evolutionary history of these ancient organisms and establish their phylogenetic relationships. In recent years, scientists have also made use of ancient DNA to investigate the question of human evolution, opening up new horizons for research into paleo-organisms.","wiki":"","attachments":["PXL_20211120_052613559.jpeg","PXL_20211120_052621725.jpeg","PXL_20211120_052627737.jpeg","PXL_20211120_052632968.jpeg","PXL_20211120_052638891.jpeg"]},{"id":"recWJZzKGmRYXb7kz","name":"特色名產 Special Products PREACE","notes":"特色名產 Special Products PREACE\n因國人休閒意識提升,旅遊成為大眾調劑身心,日常生 活的重要活動。到各地購買特產為紀念或送禮,也成為 旅遊内必要的行程。\n方塊酥是嘉義具代表性的點心,以麵粉、奶油或豬油、 芝麻、糖等原料製成的餅乾。由來有不同說法,有一說 為眷村的燒餅改良得更為酥脆、易保存;另一說則是將 中國北方烙餅與南方酥餅結合。無論哪種講法,都能展 現與眷村文化的關聯。蛋捲、蘇打餅則是近幾年新興的 點心,為求新鮮每天限量製作,常可見到排隊人潮。\nSquare Cookies are one of the best known desserts of Chiayi. These biscuits are made from flour, butter or lard, sesame, and sugar. There are different accounts of their origin; some say they were adapted from the clay oven cakes of military dependents' village; others say they are a combination of the pancakes of northern China and the crispy cakes of southern China. No matter, they are connected to military dependents' village culture. Eggs rolls and soda biscuits have come to the fore in recent years and are made on a daily basis to ensure freshness, causing queues to often form where they are sold.\n","wiki":"","attachments":["PXL_20211120_054039533.jpeg"]},{"id":"recWRu0NrIWZm1ujZ","name":"東門派出所","notes":"東門派出所\n碳儲存量\n32,660kg=51棵柳杉\n嘉義市僅存的日治時期警察機關建築|約建於1930年代\n原為日治時期嘉義警察署東門町警察官吏派出所,二戰後繼續作 為派出所使用至1987年,於2010年被登錄為嘉義市歷史建築。","wiki":"","attachments":["PXL_20211120_055558594.jpeg"]},{"id":"recWgBjDOEaPkKwiZ","name":"日本檜木日本扁柏","notes":"日本檜木日本扁柏\n【學名】Chamaecyparis obtusa |柏科扁柏屬|針葉樹 【通稱】Hinoki Cypress\n平均樹高約20~30公尺,可達50公尺高。生長緩慢,長成直徑30 公分約需80年左右。木理通直、肌紋細緻,有獨特香氣與光澤。樹 形成圓錐狀,淡色偏紅的心材與邊材界限並不明顯,耐久性與耐 水性佳。由於生長需要充足陽光,主要分布於日本福島縣以南,包 含四國、九州,至屋久島為止。","wiki":"","attachments":["PXL_20211120_060206697.jpeg"]},{"id":"recWiJDfcoFHK0hiM","name":"2012 民國101年","notes":"2012 民國101年\n「檜意森活村」開幕,為阿里山林業開發所建立的官方宿 舍,園區內包含29 棟歷史建築及市定古蹟。原為臺灣總督府 營林所的職員宿舍,建築群是傳統的日式風格,戰後由臺灣 省農林廳林務局接收。\nHinoki Village was opened to the public. The official guesthouse was initially built for developing the Alishan forestry industry. The park contains 29 historical buildings and sites.","wiki":"","attachments":["PXL_20211120_052839779.jpeg"]},{"id":"recXKIN8L9W430TSm","name":"算算看木建築的碳儲存","notes":"算算看木建築的碳儲存\n興建一棟建坪132平方公尺(約40坪)的木造建築,因為各種施工機具及能 源消耗,所以會造成約7,484公斤的碳排放量。然而,木造建築所使用的木 料,取自於人工林,並且在生長過程中亦會儲存碳於數體內。因此,132平 方公尺的木造建築所使用的木料,可儲存約26,524公斤碳量。\n興建木造建築的淨碳儲存量=儲存於木料內的碳-施工及耗能的碳排放量\n=26,524公斤-7,484公斤\n=19,040公斤\n相當於興建一棟建坪132平方公尺(約40坪)的木造建築,可以有19,040 公斤的淨碳儲存量,每平方公尺的碳儲存量為140公斤。\n柳杉的碳儲存\n以一棵柳杉胸徑50公分,樹高15公尺,樹幹體積約1立方公尺,其絕乾密度\n為350公斤/立方公尺計算,相當於可儲存640公斤的碳在樹體內。\n出處 《森林、木材利用與地球暖化防止》推廣手冊,行政院農委會林務局,2014","wiki":"","attachments":["PXL_20211120_055538273.jpeg"]},{"id":"recXVIz6azOC7ypfM","name":"無盡","notes":"為何是木構?為何是巨蛋?\n無盡\n種植新的木林,計畫性地孵育養成人工林,就能建立 持續循環的建築材料系統。\nENDLESS\n陳冠帆×實式木造\n在木質都市的理想中,最能讓人互動、感知材料的區 域就是公共空間。而其中,最具有邀請人們參與其中 的吸引力、並感受到木質建築特色的,非大型運動空 間莫屬。在這樣的思考下,面對超過50m水平尺度的 大型量體,該如何用木材料來思考、設計?\n設計概念說明\n#結構\n從單純的用,追求純粹的體,作為極具能力服眾空間的演出。\n本提案是一個巨大的水平森林結構採用不斷排量的波纹來傳迁木箱的柔軟韌性,同 時創造出空間的流動性。 由機型結構的交費,讓弧線形成不同厚列:從一條水平線生 按曲線的結構單元,進而發生中單元、大單元的組合,並透過這種單元的創生與延續過 程·高木材買的「結構」開掛一種全新的視角,透過CLT板材的慢食麵合方式新请出曲 線的木質構造,並在水平向度上藉由版的高低拉開與車课,造就出外部網道與半后外空 間的效果,時而彎曲的盛飯術線,也是樓板。\n結構的波動形成特殊的構造方式 講結構本身不只是外種的皮層,同時也是空間的一部分。\n結構系統\n在力學上,由上往下傳遞的力可以透過「拱的型抗性例流-拱力學的我們利用了拱 力學的特性,衍生出無數個大大小小的結構體 整锅狀結構彼此相依、綿延,環繞成 一個帶狀·甚至最終成為一個髮體的表現,這一整個T>50M)的水平開催結構體就像是 一個會頂般的存在,在不同高度上亦分別具備張力琪、壓力道的力學特性,最終｢整酸 體就構成一個如巨蛋般的存在。\n本提案中另一個力學考量在於,當版白水平向度開始 逐渐燈轉時,會慢慢量化成要直站立的姿態,這樣的 結構轉化,能藉由續般的構造來傳遞地力,豆 先的拱型作為里水平張鐵力的結構原型。 構造與施工策略思考\n不惜波鐵單元的律採班考\n結構由小到大彬標了多模技有趣的單元空間,在這些空間裡也港鐵了各種壞元素的設 新思考:從戶外到室内,從開技到私密,從節要到高科技,從大樹對小草、從皮層到結構 體-從光彩對黑暗,不同波形展現出多種表情,同時回應了未來木質都市存在可能。\n所谓的木材,並非是自古以来寺廟建築所使用的木 酒,而是指工程木材(Engeneered Wood·工程木 材)。目前在日本、美國都以工程木材的結構為主流結 圖方式,本提案中,以片开寬度2m、最大長度 12m作為一個由元,每個單元的結後相便因为在 相拼里成形的重點,因此五金構件的士相方式成為網 那結構的狀助,就如對森林里拉地图上生成,本案的 翻裝也慈征地面開始形成大跨度拱形波載,接著以第 二段鎖波蘭進代,以此類推生成各個不同空間。\n名:\n馬火/耐置规格\nENDLESS 日北方情報區大巨\nLT经理結構 地上出層,地下1N\n用途\n陳冠單 結構技師|原型結構工程顧有限公司\n烘塊來,王柏础、若金施,加理性","wiki":"","attachments":["PXL_20211120_060249370.jpeg","PXL_20211120_060254543.jpeg","PXL_20211120_060257938.jpeg"]},{"id":"recXjWu8cK1GDRH3w","name":"2018 民國107年","notes":"2018 民國107年\n嘉義市立博物館獲文化部核定補助進行開館14年來首次的全館整修, 並配合整修轉型為城市博物館,以「嘉義人關心嘉義事,異鄉人探索嘉 義市」的新願景,打造屬於嘉義市民的博物館,同時成為訪客認識嘉義 市的窗口。\nChiayi Municipal Museum was closed for replacement of exhibits, to become a city museum, with the objective of rebranding the museum.","wiki":"","attachments":["PXL_20211120_052846920.jpeg"]},{"id":"recXwkZs54mM9zrPk","name":"寫會覽展","notes":"寫會覽展\n畫都風雅 Elegant Painting City\n嘉義地區的美術發展,以日治時期最為鮮明。當時臺灣開 始邁向現代化發展,社會安定、藝術風氣興起。1927年 起臺灣總督府參考日本帝國美術院展覽會,每年開辦「臺 灣美術展覽」(簡稱臺展) 1938年起改制為「臺灣總 督府美術展覽會」(府展) 鼓勵繪畫創作。除了官方重 視藝術活動之外,民間籌組的畫會、畫社也帶動整體的美 術風氣。歷年來嘉義地區的藝術家成績非凡,《臺灣日日 新報》以「畫都」之美譽稱呼嘉義,在臺灣藝術史上佔有 重要的角色。\nDuring Japanese rule, Taiwan marched toward modern development, stable society, and emergence of popular arts. The government not only emphasized art events, civil painting societies, and painting clubs also promoted the overall art atmosphere. Over the years, the artists in the Chiayi area had great achievements. The Taiwan Daily Newspaper (Taiwan Ri Ri Xin Bao) called Chiayi \"Painting City\"; it played an important role in the art history of Taiwan.","wiki":"","attachments":["PXL_20211120_061521640.jpeg"]},{"id":"recYDMnv7gs5kEzfy","name":"保留舊有RC建築,","notes":"保留舊有RC建築,\n以木構造建來提高耐震度,增加空間舒適感\n建築設計上,首先保留基地原有3棟建築,包括興建於1936年 的菸酒公賣局嘉義分局、1954年酒類倉庫及1980年菸酒成品倉 庫,新建1棟三角形建物來串連3棟舊建築,並以CLT (Cross-Laminated Timber)技術整理外牆立面,減輕建築 重量並增加耐震度。木料能讓室內空間冬暖夏涼,也增加了建 築物內部的舒適度。建築群圍塑出的景觀庭成為屬於市民的 空間。\n木造挑高空間\n空厂\n嘉義市立美術館 Chiayi Art Museum 文化設施\n設計時間\n竣工\n書名: 地點\n用途\n設計模對\n2014年10月~2017年9月\n2020年7月 4262.35.me\n1965 mA\n黃明地球築師事務所+王越級建築結事務所 原型結構工程顧世有限公司\n王林斯建築師事和所: 黃明威·香酒館、林新、黃、劉育話、王清溪、郵票、 莊協楼·王錫·朱世權、李瓊如、蘇治聞、吳崇蘭、李远程\n5179 m²\n地下1層、地上4層\n結構设计\n參與人員","wiki":"","attachments":["PXL_20211120_055641552.jpeg","PXL_20211120_055646094.jpeg","PXL_20211120_055656228.jpeg","PXL_20211120_055705008.jpeg","PXL_20211120_055710767.jpeg","PXL_20211120_055717419.jpeg","PXL_20211120_055723265.jpeg"]},{"id":"recYMIsy58MixYxt3","name":"多媒體投影劇場","notes":"多媒體投影劇場\n城市今昔 The City Yesterday and Today\n嘉義的城市發展,環繞著「中央噴水池」流轉,城市的 改變與成長,也由此向外擴散。從都市曾經遭受地震、 空襲的衝擊;靠著林業發展茁壯;居民參與藝術、文 化、音樂、體育等活動,民眾關心公眾事務、社會國家 議題:街道巷弄、自然環境都可看到嘉義的獨特景緻。\n一起走進光影噴水池,發現屬於嘉義的城市今昔風貌!\nChiayi City developed around the Central Fountain and the city's changes and growth also spread out from this point. The city was once hit by air raids and earthquakes; due to the forestry industry it grew strong; residents take part in art, culture, music, sports and other activities; the people care about public affairs and social and national issues; on the streets, lanes and in the alleys and in the natural environment, scenes unique to Chiayi can be seen.\nLet us go into the time fountain together and see how Chiayi looked yesterday and how it looks today!","wiki":"","attachments":["PXL_20211120_052933894.jpeg"]},{"id":"recYZCzVqY5JwPAUo","name":"嘉「藝」城市新風貌 Chiayi's New Urban Art Style","notes":"嘉「藝」城市新風貌 Chiayi's New Urban Art Style\n鄰近射日塔的史蹟資料館裡,可以重新翻看嘉義的歷史記憶;從 北門驛漫步到曾是阿里山木材產業人員宿舍群的檜意森活村,則 讓人重回那段林業發展的時光。隨著香火鼎盛的城隍廟裡燒香膜 拜的老人走訪東市場,感受常民生活的氛圍是城市裡溫厚的人情 味。嘉義市維護珍貴歷史資產的用心處處可見,而近幾年加入文 化創意思維營運的嘉義舊監獄,與鄰近的宿舍群以及玉山旅社旁 的沉睡森林等場域,更讓人看見藝文城市的風貌。","wiki":"","attachments":["PXL_20211120_054305067.jpeg"]},{"id":"recYk4i8KSUaj10tE","name":"燈籠舗 Lantern Shop","notes":"燈籠舗 Lantern Shop\n燈籠是提供照明使用的工具,在早期社會是生活必需 品,隨著時代的演進,唯留特殊節日或宮廟中使用。在 嘉義仍有燈籠老店的師傅,謹守流傳數代的手作技法, 透過竹篾、糊紙,將其精髓一筆一畫展現,燈籠技藝不 僅保留傳統文化,更是成為藝術的表現。\n儘管隨著都市化、現代化的進展,傳統工藝也逐漸沒 落,但仍有像燈籠工藝一般,在師傅們的巧手與堅持 下,默默延續著傳統文化。與衆多先進的燈具相比,燈 能不是最明亮,但卻是最能令人發思古之幽情。\nThere are still craftsmen in old lantern shops in Chiayi who make lanterns the traditional way. Bamboo strips and paper mache are combined then the lanterns painted by hand to express their essence. Lantern art doesn't only preserve traditional culture, it has become the expression of art. The skilled hands and insistence of the craftsmen quietly continue this traditional culture. The lanterns made the old-fashioned way are not the brightest compared to modern ones but they evoke nostalgia for times past.","wiki":"","attachments":["PXL_20211120_054021089.jpeg"]},{"id":"recYl2A7D4P07fDMP","name":"1947 民國36年","notes":"1947 民國36年\n228 事件爆發,嘉義市參議會議員潘木枝、盧炳欽、柯麟、 陳澄波等人,與軍方談判而受到逮捕拘禁,於3月25 日在嘉 義火車站前被槍決身亡。\nAfter the 228 incident, Chiayi members of the Provincial Assembly Pan Mu-zhi, Lu Bing-qin, Ke Lin, Chen Cheng-po etc., were arrested after negotiating with the military. On March 25th they were executed in front of Chiayi Railway Station.","wiki":"","attachments":["PXL_20211120_052816911.jpeg"]},{"id":"recZGmkpWXd1ye2Tk","name":"購票資訊","notes":"購票資訊\n世界級林鐵等你来探索!\nA 車站購票\n聯絡資訊\n營業時間 各車站 08:00~17:00\n阿里山車站 08:30~16:30 購票地點|林鐵嘉義站、北門站、竹崎站\n交力坪站、奮起湖站、阿里山站\n官方網站\nhttps://afrch.forest.gov.tw/\n北門車站 (05) 2768094 (05) 2765909\n嘉義製材所\n阿里山車站 (05) 2679200\n阿里山林業村團體導覽預約 (05)2779843 分機360\nB 網路訂票\n開放時間 06:00~24:00\n訂票網址 | https://afrts.forest.gov.tw/\n主題列車\n為了讓旅客深入體驗沿線風景及社區特色,林鐵不定 期開行主題列車,使用蒸汽機車或檜木車廂,提供乘 車之外的加值行程,並依列車企劃訂定售價。\n左:蒸汽機車 右:榆木車廂\n專開列車\n為了滿足機關、團體、學校包車旅遊需求,林鐵提供 平日專開列車服務,並可選擇列車類型(蒸汽機車、 檜木車廂等),客製化停靠站,造訪正班車不停靠的 觀景平臺,觀賞獨立山螺旋線場景。\n木頭人市集\n上:花季列車 左:楓紅列車 右:撞來嘉\n嘉義製材所時空漫遊\n每月定期於嘉義製材所園區內舉辦的「木頭人市集」, 結合製材所園區空間,邀請友善土地農園、木藝手創、 咖啡甜點、多肉植栽等朋友們前來設攤,打造精緻且 有質感的藝文市集空間。\n交通資訊\n全程2.5小時\n7329A\n全程2.5小時\n7322D\n9\n奮起湖\n臺北 6小時\nBRT\n高鐵嘉義站\n9 嘉義站\n十字路/十字村\n9\n阿里\n山\n施工中!\n日月潭 3小時\nPT 全程2小時 7322C\n全程2小時\n7329","wiki":"","attachments":["PXL_20211120_054626457.jpeg"]},{"id":"recZLNuTb7cct2cN4","name":"BX KANESHIN","notes":"BX KANESHIN\n「在日本,每年新住宅中有50%都是以木構建成。」木構造在日本的普及,與「金 物工法」有著密不可分的關連。「金物工法」(註)取代了傳統的榫接工法,為木構 造帶來更高的耐震強度與建造速度,同時也創造更大的設計自由與可能性,並降低 人力與造價。日本金物工法大廠BX KANESHIN,在日本實現了以金物工法搭建的眾 多精采案例,透過本展覽亦可了解到BX KANESHIN從金物設計、構造設計、運用諮 詢,一體實踐木構造建築的結構系統成型。(展品提供:德豐木業)\n註金物工法:即以五金構件來接合木構造的工法概稱\n|内使い専用","wiki":"","attachments":["PXL_20211120_060041360.jpeg"]},{"id":"recZdCQiinanRAKuu","name":"臺灣花磚博物館 Museum of Old Taiwan Tiles","notes":"臺灣花磚博物館 Museum of Old Taiwan Tiles\n由營運團隊花費20年以上的時間,到處挽救修護整理老花 磚,於2015 年用逾千片的老花磚打造出臺灣首座花磚博物 館。花磚因手工、技藝與時間的堆積,成為了珍貴的歷史 遺產,每一片磚、每一張照片,都承載著一段段美麗的老 屋故事。\nThe operating team spent 20 years retrieving and repairing old tiles
