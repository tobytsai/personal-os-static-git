8.jpg","type":"image/jpeg"}]},{"id":"recpBCI5UN8FT23yl","name":"海洋生物","notes":"魟魚，鯊魚，小魚大魚","tags":["海洋生物"],"seq":8,"added":"2021-02-03","attachments":[{"id":"attHVFsRsEEK2u1Bw","filename":"IMG20210203104956.jpg","type":"image/jpeg"},{"id":"attWcDNH5Gqa2RtSp","filename":"IMG20210203104932.jpg","type":"image/jpeg"}]},{"id":"recpfUZAImFpy7iSw","name":"企鵝","notes":"滑冰企鵝","tags":["企鵝"],"seq":16,"added":"2021-02-05","attachments":[{"id":"att2MFsYgN28oR6fz","filename":"IMG20210202120131.jpg","type":"image/jpeg"}]},{"id":"recpwMz0WrSqVOand","name":"海洋生物","notes":"大魚吃小魚","tags":["海洋生物"],"seq":11,"added":"2021-02-03","attachments":[{"id":"attJWXYZa6uNW5ZFb","filename":"IMG20210203104913.jpg","type":"image/jpeg"}]},{"id":"recqpvpKTcfqKr4fJ","name":"","notes":"","tags":[],"seq":42,"added":"2021-02-17","attachments":[]},{"id":"recsuckxP9iBFw2aZ","name":"噴泉車和拖車，海豚救援車，118","notes":"這是我們去遠雄海洋遊樂場時看海豚和海獅表演後歐耶回來畫的。\n鯨豚擱淺救援車，有鯨豚造型的鯨豚救援車，一發現有擱淺的鯨豚，就會立刻出發救援，最後一張圖有紅十字和118，代表發現鯨豚擱淺需要撥打118救援。\n看完鯨豚的介紹，歐耶對於保護海洋生物有一種強烈的責任，他回來立馬畫了一輛，oh錯了，是好幾輛海豚救援車。\n第六張圖畫的是一輛海豚救援車，車上有十字架代表救援，118代表救援號碼，頂部有個圓形的是模擬海豚的氣孔可以噴氣灑水系統，由於擱淺的海豚會需要水，這輛救援車隨時會噴水給海豚，周圍那些線是水。這輛救援車沒有輪子，是滑行的，可以為了能夠在沙灘上行駛，也可以在海上行駛。\n","tags":["車車"],"seq":49,"added":"2021-02-28","attachments":[{"id":"attgA9lwTUl3lT8GH","filename":"IMG20210228222532.jpg","type":"image/jpeg"},{"id":"attXhMV2ZmGZ9vZBj","filename":"IMG20210228222955.jpg","type":"image/jpeg"},{"id":"att218k9X7GBTDPSd","filename":"IMG20210228223025.jpg","type":"image/jpeg"},{"id":"att97zr5mso0lyoQp","filename":"IMG20210228223649.jpg","type":"image/jpeg"},{"id":"att0OlRhpT7hp3I83","filename":"IMG20210228224038.jpg","type":"image/jpeg"},{"id":"attUWC4E1F7vCfrTH","filename":"IMG20210228224040.jpg","type":"image/jpeg"},{"id":"attTHW0lhDK8wia8L","filename":"IMG20210228224817.jpg","type":"image/jpeg"},{"id":"attNE7MwfrUUMFEjy","filename":"IMG20210228224822.jpg","type":"image/jpeg"},{"id":"attoaT3hMfuzerqct","filename":"IMG20210301085215.jpg","type":"image/jpeg"},{"id":"attLDtw7UKuwH7PCe","fil const images=r=>r.attachments.map(a=>({name:a.filename,key:r.id+"-"+a.id})).filter(x=>available.includes(x.key)).map(x=>({...x,url:"../assets/houye-art/"+x.key+".webp",originalUrl:originalFiles[x.key]?"https://drive.google.com/file/d/"+originalFiles[x.key]+"/view":""}));
const source=r=>"https://airtable.com/apppZqeNsKgKw3DAv/tbl4rWmrbO7DOV5XC/viwtVAX2PzMcTZZCY/"+r.id;
const key="houyeArtFavoritesV1";let favorites=[];try{const v=JSON.parse(localStorage.getItem(key)||"[]");if(Array.isArray(v))favorites=v}catch(e){}
let selected="全部",current=null,imageIndex=0;const dialog=document.getElementById("dialog"),detail=document.getElementById("detail"),search=document.getElementById("search"),sort=document.getElementById("sort");
const categories=[...new Set(works.flatMap(x=>x.tags))].sort((a,b)=>a.localeCompare(b,"zh-Hant"));
document.getElementById("statWorks").textContent=works.length+" 筆作品";
document.getElementById("statImages").textContent=available.length+" 張照片";
function tagList(r){return (r.tags.length?r.tags:["未分類"]).map(x=>'<span class="tag">'+esc(x)+'</span>').join("")}
function card(r){let pics=images(r),fav=favorites.includes(r.id);return '<article class="art"><div class="picture">'+(pics.length?'<img src="'+esc(pics[0].url)+'" loading="lazy" alt="'+esc(title(r))+' 的作品照片">':'<span aria-hidden="true">🎨</span>')+'</div><div class="body"><h3>'+esc(title(r))+'</h3><span class="muted">'+(r.added?'建檔 '+esc(r.added):'建檔日期未提供')+' · '+pics.length+' 張照片'+(r.attachments.some(a=>a.type.startsWith('video/'))?' · 含影片':'')+'</span><div class="tags">'+tagList(r)+'</div>'+(r.notes?'<p class="notes">'+esc(r.notes)+'</p>':'')+'<div class="actions"><button type="button" data-open="'+esc(r.id)+'">查看作品 →</button><button type="button" data-favorite="'+esc(r.id)+'" class="'+(fav?'on':'')+'" aria-pressed="'+fav+'">'+(fav?'★ 已收藏':'☆ 收藏')+'</button></div></div></article>'}
function draw(){let all=["全部","我的收藏","未分類",...categories];document.getElementById("chips").innerHTML=all.map(x=>'<button type="button" class="chip '+(selected===x?'on':'')+'" data-category="'+esc(x)+'" aria-pressed="'+(selected===x)+'">'+esc(x)+'</button>').join("");let q=search.value.trim().toLocaleLowerCase();let list=works.filter(r=>(selected==="全部"||(selected==="我的收藏"?favorites.includes(r.id):selected==="未分類"?!r.tags.length:r.tags.includes(selected)))&&(!q||[r.name,r.notes,...r.tags].join(" ").toLocaleLowerCase().includes(q)));list.sort((a,b)=>sort.value==="number"?(a.seq??99999)-(b.seq??99999):sort.value==="old"?a.added.localeCompare(b.added)||(a.seq??0)-(b.seq??0):b.added.localeCompare(a.added)||(b.seq??0)-(a.seq??0));document.getElementById("count").textContent="顯示 "+list.length+" / "+works.length+" 筆";document.getElementById("gallery").innerHTML=list.map(card).join("")||'<p class="empty">沒有符合條件的作品，試試其他關鍵字或分類。</p>'}
function showDetail(){let r=works.find(x=>x.id===current);if(!r)return;let pics=images(r);imageIndex=Math.max(0,Math.min(imageIndex,pics.length-1));let photo=pics[imageIndex];detail.innerHTML='<header><div><h2>'+esc(title(r))+'</h2><div class="tags">'+tagList(r)+'</div><span class="muted">'+(r.added?'建檔日期 '+esc(r.added):'建檔日期未提供')+'</span></div><button class="close" type="button" data-close aria-label="關閉">✕</button></header><div class="viewer">'+(photo?(photo.originalUrl?'<a href="'+esc(photo.originalUrl)+'" target="_blank" rel="noopener noreferrer" aria-label="在 Google Drive 查看原始照片"><img src="'+esc(photo.url)+'" alt="'+esc(title(r))+' 照片 '+(imageIndex+1)+'"></a>':'<img src="'+esc(photo.url)+'" alt="'+esc(title(r))+' 照片 '+(imageIndex+1)+'">'):'<span>此作品沒有照片</span>')+'</div>'+(pics.length?'<div class="image-nav"><button type="button" data-step="-1" '+(imageIndex===0?'disabled':'')+'>← 上一張</button><span class="muted">'+(imageIndex+1)+' / '+pics.length+'</span><button type="button" data-step="1" '+(imageIndex===pics.length-1?'disabled':'')+'>下一張 →</button></div><div class="thumbs">'+pics.map((p,i)=>'<button type="button" data-image="'+i+'" class="'+(i===imageIndex?'active':'')+'" aria-label="查看第 '+(i+1)+' 張"><img loading="lazy" src="'+esc(p.url)+'" alt=""></button>').join("")+'</div>':'')+(r.notes?'<p class="description">'+esc(r.notes)+'</p>':'')+(r.attachments.some(a=>a.type.startsWith('video/'))?'<p class="muted">🎬 此作品含影片，請由下方 Airtable 原始紀錄開啟。</p>':'')+'<div class="detail-footer">'+(photo&&photo.originalUrl?'<a href="'+esc(photo.originalUrl)+'" target="_blank" rel="noopener noreferrer">🔎 在 Drive 查看原圖 ↗</a>':'')+'<a href="'+esc(source(r))+'" target="_blank" rel="noopener noreferrer">開啟 Airtable 原始紀錄 ↗</a></div>';if(!dialog.open)dialog.showModal()}
document.addEventListener("click",e=>{let cat=e.target.closest("[data-category]");if(cat){selected=cat.dataset.category;draw();return}let f=e.target.closest("[data-favorite]");if(f){let id=f.dataset.favorite;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[id,...favorites];try{localStorage.setItem(key,JSON.stringify(favorites))}catch(e){}draw();return}let open=e.target.closest("[data-open]");if(open){current=open.dataset.open;imageIndex=0;showDetail();return}let close=e.target.closest("[data-close]");if(close){dialog.close();return}let step=e.target.closest("[data-step]");if(step){imageIndex+=Number(step.dataset.step);showDetail();return}let image=e.target.closest("[data-image]");if(image){imageIndex=Number(image.dataset.image);showDetail()}});
dialog.addEventListener("click",e=>{if(e.target===dialog)dialog.close()});search.addEventListener("input",draw);sort.addEventListener("change",draw);draw();
