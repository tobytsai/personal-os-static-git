<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5bbac0"><meta name="description" content="影像編輯、圖庫設計與字體資源，一頁快速開啟。">
<title>影像編輯啟動器｜Toby</title><link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
:root{--ink:#173b5c;--muted:#71808d;--teal:#5bbac0;--yellow:#ffbd17;--paper:#fff;--line:#e5edf0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:radial-gradient(circle at 8% 5%,#d7f8e7 0 9rem,transparent 9.1rem),radial-gradient(circle at 98% 34%,#ffe7b2 0 10rem,transparent 10.1rem),linear-gradient(145deg,#e6f8f8,#d8f1f3 52%,#eff8e9);overflow-x:hidden}a{color:inherit}
main{width:min(1120px,100%);margin:auto;padding:18px 22px 50px}.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;padding:9px 14px;border:1px solid #ffffff;border-radius:999px;background:#ffffffd9;color:#31535e;text-decoration:none;font-size:13px;font-weight:850;box-shadow:0 5px 15px #1d566011}
.hero{position:relative;isolation:isolate;overflow:hidden;padding:clamp(25px,5vw,43px);border-radius:30px;background:linear-gradient(120deg,#45aeb7,#69c3c4 52%,#84c9a3);color:#fff;box-shadow:0 18px 42px #2878852d}.hero:before,.hero:after{position:absolute;z-index:-1;content:"";border:2px solid #ffffff55;border-radius:50%}.hero:before{width:250px;height:250px;right:-55px;top:-130px}.hero:after{width:150px;height:150px;right:22%;bottom:-110px}
.eyebrow{display:inline-flex;padding:7px 11px;border:1px solid #ffffff66;border-radius:999px;background:#ffffff24;font-size:12px;font-weight:850;letter-spacing:.05em}h1{display:inline-block;margin:12px 0 9px;padding:8px 18px;border-radius:9px;background:var(--yellow);color:white;font-size:clamp(34px,7vw,53px);line-height:1.2;box-shadow:0 8px 18px #5471142e}.hero p{max-width:680px;margin:0;color:#f3ffff;font-size:15px;line-height:1.7}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.stats span{padding:7px 10px;border:1px solid #ffffff50;border-radius:999px;background:#ffffff24;font-size:12px;font-weight:750}
.searchbox{position:relative;margin:18px 0 10px}.searchbox:before{content:"⌕";position:absolute;left:15px;top:6px;color:#8d9ca1;font-size:24px}.search{width:100%;height:49px;padding:0 15px 0 44px;border:1px solid #e5eeee;border-radius:15px;background:#fff;outline:none;font:inherit;box-shadow:0 8px 20px #204e5910}.search:focus{border-color:#51abb3;box-shadow:0 0 0 4px #51abb322}
.filters{display:flex;gap:8px;overflow:auto;padding:3px 2px 8px}.filter{flex:none;padding:8px 13px;border:1px solid #dbe8e8;border-radius:999px;background:#ffffffdc;color:#33535b;font:inherit;font-size:12px;font-weight:850;cursor:pointer}.filter.active{background:#173b5c;color:#fff;border-color:#173b5c}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:19px 2px 11px}.sectionhead h2{margin:0;font-size:21px}.count{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{--tone:#42aeb7;position:relative;display:flex;min-width:0;min-height:155px;flex-direction:column;overflow:hidden;padding:16px;border:1px solid #fff;border-radius:21px;background:#fff;box-shadow:0 9px 21px #23566912;transition:transform .18s,box-shadow .18s}.card:before{position:absolute;top:0;left:0;right:0;height:5px;background:var(--tone);content:""}.card:after{position:absolute;right:-27px;bottom:-55px;width:112px;height:112px;border-radius:50%;background:color-mix(in srgb,var(--tone) 13%,white);content:"";pointer-events:none;transition:transform .2s}.card:hover{transform:translateY(-4px);box-shadow:0 15px 28px #23566920}.card:hover:after{transform:scale(1.18)}
.mainlink{position:relative;z-index:1;display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none}.brand{display:grid;flex:none;width:49px;height:49px;place-items:center;border-radius:16px;background:color-mix(in srgb,var(--tone) 13%,white);color:var(--tone);font-size:21px;font-weight:950;letter-spacing:-.06em}.brand.long{font-size:15px}.name{margin:0;font-size:17px;font-weight:900;overflow-wrap:anywhere}.cat{margin-top:3px;color:var(--muted);font-size:11px;font-weight:700}.desc{position:relative;z-index:1;margin:12px 0;color:#71808a;font-size:12px;line-height:1.55}.footrow{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}.help{border:0;border-radius:999px;background:#eef7f5;color:#315f5a;padding:7px 10px;font:800 11px system-ui;cursor:pointer}.help:hover,.help:focus-visible{background:#d8f0e9;outline:2px solid #60b8af;outline-offset:2px}.open{color:var(--tone);font-size:11px;font-weight:900;text-decoration:none}.empty{display:none;padding:26px;border:1px dashed #afcaca;border-radius:18px;background:#ffffffb5;color:#627b7e;text-align:center}
.overlay{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:18px;background:#17242f80}.overlay.show{display:grid}.dialog{width:min(460px,100%);padding:22px;border:1px solid #fff;border-radius:24px;background:#fff;box-shadow:0 22px 60px #07192650}.dialog h2{margin:0 0 8px;font-size:21px}.dialog p{margin:0;color:#63747c;line-height:1.7}.close{display:block;margin:17px 0 0 auto;padding:9px 14px;border:0;border-radius:12px;background:#173b5c;color:#fff;font:800 13px system-ui;cursor:pointer}
footer{margin-top:26px;color:#627b7e;text-align:center;font-size:11px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){main{padding:13px 13px 38px}.hero{border-radius:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{min-height:146px;padding:13px;border-radius:18px}.brand{width:40px;height:40px;border-radius:13px;font-size:18px}.name{font-size:14px}.desc{font-size:11px;margin:10px 0}.help{padding:6px 8px}.open{font-size:10px}}
</style>
</head>
<body><main>
<a class="back" href="../index.html">← 回到 Toby 首頁</a>
<header class="hero"><span class="eyebrow">🎨 CREATE · EDIT · DISCOVER</span><br><h1>影像編輯啟動器</h1><p>從修圖、排版到找靈感與挑字體，把常用影像工具收進一個繽紛工作台。點卡片即可前往服務，按「？」看簡介。</p><div class="stats"><span>🖼️ 影像編輯</span><span>🧩 圖庫設計</span><span>🔤 字體設計</span></div></header>
<div class="searchbox"><input class="search" id="search" type="search" placeholder="搜尋 Canva、圖庫、字體…"></div>
<nav class="filters" id="filters" aria-label="服務分類"></nav>
<div class="sectionhead"><h2 id="sectionTitle">✨ 全部工具</h2><span class="count" id="count"></span></div>
<section class="grid" id="grid"></section><div class="empty" id="empty">找不到符合的服務，試試其他關鍵字吧！</div>
<footer>部分平台可能需要登入或訂閱；使用圖庫素材時請留意各站授權條款。</footer>
</main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog"><h2 id="dialogTitle"></h2><p id="dialogBody"></p><button class="close" id="close">知道了</button></div></div>
<script>
const items=[
{n:"Photoshop",c:"影像編輯",i:"Ps",u:"https://www.adobe.com/products/photoshop.html",d:"Adobe 專業影像編輯與合成工具。"},
{n:"Canva",c:"影像編輯",i:"✿",u:"https://www.canva.com/",d:"用範本快速製作社群圖、簡報與各式視覺內容。"},
{n:"Canva 二維碼產生器",c:"影像編輯",i:"▦",u:"https://www.canva.com/qr-code-generator/",d:"在 Canva 設計流程中建立並排版 QR Code。"},
{n:"色彩 Adobe Color",c:"影像編輯",i:"◉",u:"https://color.adobe.com/",d:"探索色彩靈感、色輪與配色主題。"},
{n:"Acrobat",c:"影像編輯",i:"A",u:"https://www.adobe.com/acrobat.html",d:"編輯、轉換與管理 PDF 文件。"},
{n:"Booltool",c:"影像編輯",i:"B",u:"https://booltool.com/",d:"線上 AI 圖片與影片創作工具集合。"},
{n:"Kua.ai",c:"影像編輯",i:"K",u:"https://kua.ai/",d:"AI 輔助的行銷內容與視覺創作工具。"},
{n:"Fotor",c:"影像編輯",i:"🌈",u:"https://www.fotor.com/",d:"線上照片編輯、設計與 AI 圖像工具。"},
{n:"Meee",c:"影像編輯",i:"M",u:"https://meee.com.tw/",d:"影像編輯與創作服務入口。"},
{n:"Hedra",c:"影像編輯",i:"✺",u:"https://www.hedra.com/",d:"以生成式 AI 製作角色影像與影音內容。"},
{n:"Diffus",c:"影像編輯",i:"D",u:"https://diffus.me/",d:"探索 AI 圖像生成與創作工作流程。"},
{n:"Canvy",c:"影像編輯",i:"C",u:"https://canvy.ai/",d:"AI 視覺設計與圖片創作平台。"},
{n:"Wideo",c:"圖庫設計",i:"▶",u:"https://wideo.co/",d:"線上影片製作與動畫設計工具。"},
{n:"Pixelied",c:"圖庫設計",i:"P",u:"https://pixelied.com/",d:"線上圖像編輯器與平面設計工具。"},
{n:"圖司機",c:"圖庫設計",i:"圖",u:"https://www.tusij.com/",d:"用範本快速製作海報、社群圖與行銷素材。"},
{n:"圖怪獸",c:"圖庫設計",i:"獸",u:"https://818ps.com/",d:"線上圖片設計與範本編輯平台。"},
{n:"稿定設計",c:"圖庫設計",i:"稿",u:"https://www.gaoding.com/",d:"製作海報、簡報、社群配圖與電商視覺。"},
{n:"創客貼",c:"圖庫設計",i:"貼",u:"https://www.chuangkit.com/",d:"用線上範本設計海報、簡報與宣傳素材。"},
{n:"包圖網",c:"圖庫設計",i:"包",u:"https://ibaotu.com/",d:"搜尋設計模板、圖片與多媒體素材。"},
{n:"千圖網",c:"圖庫設計",i:"千",u:"https://www.58pic.com/",d:"提供圖片、向量、PSD 與設計模板素材。"},
{n:"攝圖網",c:"圖庫設計",i:"攝",u:"https://699pic.com/",d:"搜尋攝影圖片與視覺設計素材。"},
{n:"我圖網",c:"圖庫設計",i:"我",u:"https://www.ooopic.com/",d:"設計作品與圖片素材交易平台。"},
{n:"90設計",c:"圖庫設計",i:"90",u:"https://www.90sheji.com/",d:"電商海報與商品視覺設計工具。"},
{n:"Pngtree",c:"圖庫設計",i:"P",u:"https://pngtree.com/",d:"搜尋 PNG、向量、模板與背景素材。"},
{n:"快圖網",c:"圖庫設計",i:"快",u:"https://www.kuaipng.com/",d:"提供 PNG 圖片與免摳素材下載。"},
{n:"1號圖庫",c:"圖庫設計",i:"1",u:"https://www.1tupian.com/",d:"圖片素材與設計資源入口。"},
{n:"線上字體轉換器",c:"字體設計",i:"字",u:"https://www.haoduoziti.com/",d:"線上預覽與轉換不同風格的字體效果。"},
{n:"Google Fonts",c:"字體設計",i:"G",u:"https://fonts.google.com/",d:"瀏覽並取得開源字體家族。"},
{n:"圓仔體",c:"字體設計",i:"圓",u:"https://fonts.google.com/?query=rounded",d:"快速尋找圓潤可愛風格的字體。"},
{n:"筆靈 AI",c:"字體設計",i:"✎",u:"https://ibiling.cn/",d:"筆靈 AI 線上寫作與文字創作工具。"},
{n:"辰宇落雁體",c:"字體設計",i:"落",u:"https://github.com/Chenyu-otf/chenyuluoyan_thin",d:"開源手寫字體專案，可至作者頁面了解與下載。"}
];
const cats=["全部","影像編輯","圖庫設計","字體設計"];let active="全部",query="";
const grid=document.getElementById("grid"),filters=document.getElementById("filters");
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function renderFilters(){filters.innerHTML=cats.map(c=>'<button class="filter '+(c===active?"active":"")+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join("");filters.querySelectorAll("button").forEach(b=>b.onclick=()=>{active=b.dataset.cat;renderFilters();render()})}
function render(){const data=items.filter(x=>(active==="全部"||x.c===active)&&(!query||(x.n+" "+x.c+" "+x.d).toLowerCase().includes(query.toLowerCase())));grid.innerHTML=data.map((x,k)=>'<article class="card" style="--tone:'+["#f47755","#f4ad20","#3daeb8","#8f73e8","#49a879"][k%5]+'"><a class="mainlink" href="'+esc(x.u)+'" target="_blank" rel="noopener noreferrer"><span class="brand '+(x.i.length>1?"long":"")+'">'+esc(x.i)+'</span><span><h3 class="name">'+esc(x.n)+'</h3><span class="cat">'+esc(x.c)+'</span></span></a><p class="desc">'+esc(x.d)+'</p><div class="footrow"><button class="help" data-name="'+esc(x.n)+'">？ 服務說明</button><a class="open" href="'+esc(x.u)+'" target="_blank" rel="noopener noreferrer">前往服務 ↗</a></div></article>').join("");document.getElementById("count").textContent=data.length+" 個服務";document.getElementById("empty").style.display=data.length?"none":"block";document.getElementById("sectionTitle").textContent=active==="全部"?"✨ 全部工具":"✦ "+active;grid.querySelectorAll(".help").forEach(b=>b.onclick=()=>showInfo(b.dataset.name))}
function showInfo(name){const x=items.find(y=>y.n===name);if(!x)return;document.getElementById("dialogTitle").textContent="？ "+x.n;document.getElementById("dialogBody").textContent=x.d;document.getElementById("overlay").classList.add("show");document.getElementById("close").focus()}
document.getElementById("search").addEventListener("input",e=>{query=e.target.value;render()});document.getElementById("close").onclick=()=>document.getElementById("overlay").classList.remove("show");document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")e.currentTarget.classList.remove("show")});document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("overlay").classList.remove("show")});renderFilters();render();
</script><script src="../shared-nav.js" defer></script></body></html>
