alStorage.getItem(storageKey)||"[]");if(Array.isArray(x))fav=x}catch{}let kind="全部",topic="全部",query="",page=0;const size=36;

function list(){return items.filter(x=>(kind==="全部"||kind==="我的收藏"&&fav.includes(x.id)||x.kind===kind)&&(topic==="全部"||x.topic===topic)&&(x.name+" "+x.topic).toLocaleLowerCase().includes(query.toLocaleLowerCase()))}
