<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>注音符號｜字・簡易啟動器</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#263f38;font:16px system-ui,sans-serif}header{background:#286c5a;color:white;padding:26px max(20px,calc((100% - 1100px)/2))}header a{color:white}h1{margin:10px 0 4px}main{max-width:1100px;margin:auto;padding:20px}.bar{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;border:1px solid #cad9d2;border-radius:9px;background:white;padding:10px}input{flex:1;min-width:200px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:18px 0}.card{background:white;border:1px solid #dce8e0;border-radius:15px;padding:16px;text-align:left;cursor:pointer;color:inherit;min-height:120px}.card:hover{box-shadow:0 4px 15px #a8bcb655}.title{font-size:25px;font-weight:bold}.muted{color:#65776f;font-size:14px;margin:8px 0}.chars{display:flex;flex-wrap:wrap;gap:8px}.chars a,.links a{display:inline-block;background:#e5f3eb;color:#155941;padding:7px 11px;border-radius:8px;text-decoration:none}.chars a{font-size:22px;min-width:48px;text-align:center}dialog{border:0;border-radius:16px;width:min(820px,94vw);max-height:85vh;padding:24px;box-shadow:0 15px 50px #0004}dialog::backdrop{background:#0008}.close{float:right;cursor:pointer}.links{display:flex;gap:8px;flex-wrap:wrap}#status{margin-top:15px}.notes{white-space:pre-wrap}</style></head><body><header><a href="character-simple.html">← 返回字・簡易啟動器</a><h1>注音符號</h1><div>依照注音符號與聲調探索讀音及漢字</div></header><main><div class="bar"><input id="search" placeholder="搜尋注音符號或分類" aria-label="搜尋"><select id="category" aria-label="分類"><option value="">全部分類</option></select></div><div id="status" class="muted">正在載入資料…</div><div id="grid" class="grid"></div><div class="bar"><button id="prev">上一頁</button><span id="page"></span><button id="next">下一頁</button></div></main><dialog id="detail"><button class="close" id="close">關閉 ✕</button><div id="detailContent"></div></dialog><script>
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data=[],sounds=new Map(),filtered=[],charList=[],charPage=0;const chunk=100;
function safeUrl(url){try{let u=new URL(url);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
function draw(){let q=$('search').value.trim().toLowerCase(),cat=$('category').value;filtered=data.filter(r=>(!cat||r.category===cat)&&(!q||[r.name,r.category,r.notes].join(' ').toLowerCase().includes(q)));$('status').textContent='符合 '+filtered.length+' 筆／共 '+data.length+' 筆';$('grid').innerHTML=filtered.map((r,i)=>'<button class="card" data-i="'+i+'"><div class="title">'+esc(r.name||'未命名')+'</div><div class="muted">'+esc(r.category||'未分類')+'</div><div>關聯 '+r.sounds.length+' 個讀音</div></button>').join('')||'<p>找不到符合的卡片。</p>';if($('page'))$('page').textContent='';$('prev').hidden=true;$('next').hidden=true}
function renderChars(){let start=charPage*chunk,max=Math.max(1,Math.ceil(charList.length/chunk));$('charList').innerHTML=charList.slice(start,start+chunk).map(c=>'<a href="character-simple.html?record='+encodeURIComponent(c.id)+'">'+esc(c.name||'□')+'</a>').join('')||'沒有關聯字。';$('charPage').textContent='第 '+(charPage+1)+' / '+max+' 頁';$('charPrev').disabled=charPage===0;$('charNext').disabled=charPage>=max-1}
function openCard(r){let items=r.sounds.map(s=>sounds.get(s.id)).filter(Boolean),m=new Map();items.forEach(s=>s.chars.forEach(c=>m.set(c.id,c)));charList=[...m.values()];charPage=0;let audio=safeUrl(r.audio),related=r.sounds.map(s=>'<a href="character-phonetic.html?card='+encodeURIComponent(s.id)+'">'+esc(s.name||'未命名')+'</a>').join('');
$('detailContent').innerHTML='<h2>'+esc(r.name||'未命名')+'</h2><p class="muted">'+esc(r.category||'未分類')+' · '+items.length+' 個讀音 · '+charList.length.toLocaleString()+' 個字</p>'+(r.notes?'<p class="notes">'+esc(r.notes)+'</p>':'')+(audio?'<p><audio controls preload="none" src="'+esc(audio)+'"></audio></p><div class="links"><a href="'+esc(audio)+'" target="_blank" rel="noopener noreferrer">開啟原始音檔 ↗</a></div>':'')+'<div class="links"><a href="https://airtable.com/appf1ZIjcI2DnuQmq/tblX3tLR5oYrABNmM/'+encodeURIComponent(r.id)+'" target="_blank" rel="noopener noreferrer">Airtable 原始資料 ↗</a></div><h3>相關注音讀音</h3><div class="links">'+(related||'沒有關聯讀音。')+'</div><h3>相關字卡</h3><p class="muted">透過注音關聯資料表連結，可能包含多音字。</p><div id="charList" class="chars"></div><div class="bar"><button id="charPrev">上一頁</button><span id="charPage"></span><button id="charNext">下一頁</button></div>';
$('charPrev').onclick=()=>{charPage--;renderChars()};$('charNext').onclick=()=>{charPage++;renderChars()};renderChars();if(!$('detail').open)$('detail').showModal();history.replaceState(null,'','?card='+encodeURIComponent(r.id))}
$('grid').addEventListener('click',e=>{let b=e.target.closest('[data-i]');if(b)openCard(filtered[Number(b.dataset.i)])});$('close').onclick=()=>{$('detail').close();history.replaceState(null,'',location.pathname)};$('detail').addEventListener('cancel',()=>history.replaceState(null,'',location.pathname));$('search').addEventListener('input',draw);$('category').addEventListener('change',draw);
Promise.all([fetch('../data/character-simple/bopomofo-symbols.json').then(r=>{if(!r.ok)throw Error();return r.json()}),...([1,2].map(n=>fetch('../data/character-simple/phonetic-cards-'+n+'.json').then(r=>{if(!r.ok)throw Error();return r.json()})))]).then(([cards,...parts])=>{data=cards;parts.flat().forEach(x=>sounds.set(x.id,x));[...new Set(data.map(x=>x.category).filter(Boolean))].sort().forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;$('category').append(o)});draw();let id=new URLSearchParams(location.search).get('card'),r=data.find(x=>x.id===id);if(r)openCard(r)}).catch(()=>$('status').textContent='資料載入失敗，請稍後重新整理。');
</script></body></html>
