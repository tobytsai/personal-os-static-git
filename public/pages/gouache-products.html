<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>膠彩產品｜膠彩工作啟動器</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#493c4b;background:#f4edf3}*{box-sizing:border-box}body{margin:0}a{color:#674c70}header{background:linear-gradient(125deg,#94799f,#c5adbe);color:white;padding:26px max(18px,calc((100% - 1150px)/2))}header a{color:white}h1{margin:12px 0 6px;font-size:clamp(26px,5vw,38px)}header p{line-height:1.6;margin:4px 0}main{max-width:1150px;margin:auto;padding:20px}.panel{background:#fffdf9;border:1px solid white;border-radius:18px;padding:18px;box-shadow:0 5px 18px #5b425412;margin-bottom:16px}.bar{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;border:1px solid #d9cbdc;border-radius:10px;background:white;padding:11px}input{flex:1;min-width:200px}select{min-width:160px}.muted{font-size:14px;color:#786d7a;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}.card{background:#fffdf9;border:1px solid white;border-radius:17px;overflow:hidden;box-shadow:0 7px 20px #5b425417}.swatch{height:95px;display:flex;align-items:end;justify-content:end;padding:10px;background:#ece8e4}.swatch span{background:#fffd;color:#514956;border-radius:8px;padding:4px 7px;font-size:12px}.body{padding:14px}.body h2{font-size:19px;margin:0 0 5px}.subtitle{color:#776a7c;font-size:14px}.tag{display:inline-block;background:#f0e8f1;color:#715777;border-radius:999px;padding:4px 9px;font-size:13px;margin:8px 4px 0 0}.body p{font-size:14px;line-height:1.5;color:#716575}.body button{cursor:pointer;background:#fff1c8;color:#604b32;font-weight:700;width:100%;border:0}.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin:22px}.pager button{cursor:pointer}.pager button:disabled{opacity:.45}dialog{border:0;border-radius:18px;width:min(680px,94vw);max-height:85vh;padding:22px;color:#493c4b;box-shadow:0 15px 50px #0004}dialog::backdrop{background:#0008}.close{float:right;cursor:pointer}dl{display:grid;grid-template-columns:100px 1fr;gap:9px}dt{color:#786d7a}dd{margin:0;overflow-wrap:anywhere}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{background:#f4eaf4;border-radius:9px;padding:9px 11px;text-decoration:none}.empty{padding:20px;color:#786d7a}.filter-label{font-size:14px;font-weight:700;color:#6a5870;margin:16px 0 8px}.filter-buttons{display:flex;flex-wrap:wrap;gap:8px}.filter-button{cursor:pointer;white-space:nowrap;padding:8px 12px;border-radius:999px;background:#fff;color:#674c70;border:1px solid #d8c6dc}.filter-button[aria-pressed='true']{background:#674c70;color:white;border-color:#674c70}.filter-button:focus-visible{outline:3px solid #e2ac36;outline-offset:2px}@media(max-width:600px){main{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.body{padding:11px}.body h2{font-size:17px}select{width:100%}dl{grid-template-columns:80px 1fr}}
</style></head><body><header><a href="gouache-work.html">← 返回膠彩工作啟動器</a><h1>🎨 膠彩產品</h1><p>依產品明細整理的色彩、規格與圖片入口</p></header><main>
<section class="panel"><p class="muted">依試算表「產品明細」工作表逐列整理。色塊優先顯示「重設HEX」，僅供螢幕選色參考；顏料實際顏色請以實品為準。資料為建立時的快照。</p><a href="https://docs.google.com/spreadsheets/d/1jt9M3QSUiNqXfN12ouaPfG-Oec7FYhbRFuoaj7xcCC0/edit" target="_blank" rel="noopener">開啟產品明細試算表 ↗</a></section>
<section class="panel"><div class="bar"><input id="search" type="search" placeholder="搜尋名稱、編號、色組或規格" aria-label="搜尋產品"><select id="category" aria-label="大分類"><option value="">全部大分類</option></select><select id="group" aria-label="色組"><option value="">全部色組</option></select></div><div class="filter-label">大分類快速選擇</div><div class="filter-buttons" id="categoryButtons" role="group" aria-label="大分類快速選擇"></div><div class="filter-label" id="groupLabel">色組快速選擇｜全部大分類</div><div class="filter-buttons group-buttons" id="groupButtons" role="group" aria-label="色組快速選擇"></div><p id="status" role="status" class="muted">正在載入產品…</p></section><div class="grid" id="grid"></div><div class="pager"><button id="prev">上一頁</button><span id="page"></span><button id="next">下一頁</button></div></main><dialog id="detail"><button class="close" id="close">關閉 ✕</button><div id="detailBody"></div></dialog>
<script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let cards=[],filtered=[],page=0;const size=36;
const hex=x=>/^#[0-9a-f]{6}$/i.test(String(x||'').trim())?String(x).trim():'';
function productTitle(c){return String(c.group||c.newName||c.name||'').trim()}
function opts(id,values){let el=$(id),current=el.value;el.innerHTML='<option value="">'+(id==='category'?'全部大分類':'全部色組')+'</option>';let counts=new Map();values.filter(Boolean).forEach(v=>counts.set(v,(counts.get(v)||0)+1));for(let [v,n] of [...counts].sort((a,b)=>a[0].localeCompare(b[0],'zh-Hant',{numeric:true}))){let o=document.createElement('option');o.value=v;o.textContent=v+'（'+n+'）';el.append(o)}if(counts.has(current))el.value=current}
function renderButtons(id){let sel=$(id),host=$(id==='category'?'categoryButtons':'groupButtons');host.replaceChildren();for(const o of sel.options){let b=document.createElement('button');b.type='button';b.className='filter-button';b.textContent=o.textContent;b.setAttribute('aria-pressed',String(o.value===sel.value));b.addEventListener('click',()=>{sel.value=o.value;sel.dispatchEvent(new Event('change',{bubbles:true}))});host.append(b)}}
function refresh(){renderButtons('category');renderButtons('group');let q=$('search').value.trim().toLowerCase(),cat=$('category').value,group=$('group').value;filtered=cards.filter(c=>(!cat||c.category===cat)&&(!group||c.group===group)&&(!q||[productTitle(c),c.name,c.newName,c.code,c.sequence,c.spec,c.category,c.group,c.revisedHex].join(' ').toLowerCase().includes(q)));page=0;draw()}
function draw(){let max=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,max-1);$('status').textContent='顯示 '+filtered.length+' / '+cards.length+' 筆產品';$('grid').innerHTML=filtered.slice(page*size,(page+1)*size).map((c,i)=>{let color=hex(c.revisedHex)||hex(c.hex);return '<article class="card"><div class="swatch"'+(color?' style="background:'+color+'"':'')+'><span>'+esc(color||'無色碼')+'</span></div><div class="body"><h2>'+esc(productTitle(c))+'</h2>'+(c.newName?'<div class="subtitle">產品名稱：'+esc(c.newName)+'</div>':'')+(c.name&&c.name.trim()!==String(c.newName||'').trim()?'<div class="subtitle">原名：'+esc(c.name)+'</div>':'')+'<span class="tag">'+esc(c.category)+'</span>'+(c.group?'<span class="tag">'+esc(c.group)+'</span>':'')+'<p>'+esc([c.code?'編號 '+c.code:'',c.spec?'規格 '+c.spec:'',c.weight?'重量 '+c.weight:''].filter(Boolean).join(' · '))+'</p><button type="button" data-i="'+i+'">查看產品資料 →</button></div></article>'}).join('')||'<div class="empty">找不到符合的產品，試試其他條件。</div>';$('page').textContent='第 '+(page+1)+' / '+max+' 頁';$('prev').disabled=page===0;$('next').disabled=page>=max-1}
function openCard(c){let entries=[['產品名稱',c.name],['產品名稱新名',c.newName],['大分類',c.category],['大分類整理',c.family],['色組',c.group],['編號',c.code],['資料序號',c.sequence],['號數／規格',c.spec],['標示重量',c.weight],['原 HEX',c.hex],['重設 HEX',c.revisedHex],['色彩來源',c.colorSource]].filter(x=>String(x[1]||'').trim());let row='https://docs.google.com/spreadsheets/d/1jt9M3QSUiNqXfN12ouaPfG-Oec7FYhbRFuoaj7xcCC0/edit#gid=1292031392&range=A'+c.row;let images=c.images.filter(x=>{try{return new URL(x).hostname==='drive.google.com'}catch{return false}});$('detailBody').innerHTML='<h2>'+esc(productTitle(c))+'</h2><dl>'+entries.map(([k,v])=>'<dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd>').join('')+'</dl><div class="links">'+(typeof c.htmlUrl==='string'&&(c.htmlUrl.startsWith('https://jingxiang-products-2026-08.pages.dev/')||c.htmlUrl.startsWith('https://tobytsai.github.io/personal-os-static-git/pages/'))?'<a href="'+esc(c.htmlUrl)+'" target="_blank" rel="noopener">開啟產品 HTML 網頁 ↗</a>':'')+'<a href="'+row+'" target="_blank" rel="noopener">試算表原始列 ↗</a>'+images.map((url,i)=>'<a href="'+esc(url)+'" target="_blank" rel="noopener">產品圖片 '+(i+1)+' ↗</a>').join('')+'</div>'+(images.length?'':'<p class="muted">原表未提供圖片連結。</p>');$('detail').showModal()}
$('grid').onclick=e=>{let b=e.target.closest('[data-i]');if(b)openCard(filtered[page*size+Number(b.dataset.i)])};$('close').onclick=()=>$('detail').close();$('prev').onclick=()=>{page--;draw();window.scrollTo(0,0)};$('next').onclick=()=>{page++;draw();window.scrollTo(0,0)};$('search').oninput=refresh;$('group').onchange=refresh;$('category').onchange=()=>{let cat=$('category').value;$('group').value='';opts('group',cards.filter(c=>!cat||c.category===cat).map(c=>c.group));$('groupLabel').textContent='色組快速選擇｜'+(cat||'全部大分類');refresh()};
fetch('../data/gouache/products.json?v=20261103-raspberry').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{cards=data;opts('category',cards.map(c=>c.category));opts('group',cards.map(c=>c.group));refresh()}).catch(()=>$('status').textContent='產品資料載入失敗，請稍後重新整理。');
</script><script src="../shared-nav.js?v=20261025-2" defer></script></body></html>
