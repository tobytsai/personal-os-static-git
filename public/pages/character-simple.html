<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>字・簡易啟動器</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#263f38;font:16px system-ui,sans-serif}header{background:#286c5a;color:white;padding:26px max(20px,calc((100% - 1100px)/2));}header a{color:white}h1{margin:10px 0 4px}main{max-width:1100px;margin:auto;padding:20px}.bar{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;border:1px solid #cad9d2;border-radius:9px;background:white;padding:10px}input{flex:1;min-width:200px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:18px 0}.card{background:white;border:1px solid #dce8e0;border-radius:15px;padding:16px;text-align:left;cursor:pointer;color:inherit;min-height:160px}.card:hover{box-shadow:0 4px 15px #a8bcb655}.character{font-family:serif;font-size:48px;font-weight:bold;line-height:1.2}.muted{color:#65776f;font-size:14px}.pager{display:flex;justify-content:center;gap:12px;align-items:center;margin:20px}.pager button{cursor:pointer}dialog{border:0;border-radius:16px;width:min(720px,94vw);max-height:85vh;padding:24px;box-shadow:0 15px 50px #0004}dialog::backdrop{background:#0008}.close{float:right;cursor:pointer}dl{display:grid;grid-template-columns:85px 1fr;gap:10px}dt{color:#678074}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{background:#e5f3eb;color:#155941;padding:8px 12px;border-radius:8px;text-decoration:none}#status{margin-top:15px}
</style></head><body><header><a href="../index.html">← 返回啟動器</a><h1>字・簡易啟動器</h1><div>搜尋漢字、注音、拼音、部首與簡易碼</div><p><a href="simple-input.html">⌨️ 開啟簡易輸入法卡片 →</a>　<a href="character-structure.html">🧩 開啟結構卡片 →</a>　<a href="character-radical.html">📚 開啟部首卡片 →</a>　<a href="character-extra-strokes.html">✍️ 開啟部外筆劃卡片 →</a></p></header><main><div class="bar"><input id="search" placeholder="輸入字、注音、拼音、部首或簡易碼" aria-label="搜尋字"><select id="radical" aria-label="部首"><option value="">全部部首</option></select><select id="strokes" aria-label="筆畫"><option value="">全部筆畫</option></select></div><div id="status" class="muted" role="status">正在載入資料…</div><div id="grid" class="grid"></div><div class="pager"><button id="prev">上一頁</button><span id="page"></span><button id="next">下一頁</button></div></main><dialog id="detail"><button class="close" id="close">關閉 ✕</button><div id="detailContent"></div></dialog><script>
const $=x=>document.getElementById(x), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=[],filtered=[],page=0,inputCards=[],structureCards=[],radicalCards=[],extraStrokeIndex=new Map();const size=60;
const value=(r,k)=>r[k]||'';function options(id,values,sort){let el=$(id);[...new Set(values.filter(Boolean))].sort(sort).forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;el.append(o)})}function refresh(){const q=$('search').value.trim().toLowerCase(),rad=$('radical').value,st=$('strokes').value;filtered=data.filter(r=>(!rad||r.radical===rad)&&(!st||r.strokes===st)&&(!q||[r.char,r.bopomofo,r.pinyin,r.radical,r.code,r.cangjie,r.structure].join(' ').toLowerCase().includes(q)));page=0;draw()}function draw(){let max=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,max-1);$('status').textContent=`符合 ${filtered.length.toLocaleString()} 筆／共 ${data.length.toLocaleString()} 筆`; $('grid').innerHTML=filtered.slice(page*size,(page+1)*size).map((r,i)=>`<button class="card" data-i="${i}"><div class="character">${esc(r.char||'□')}</div><div>${esc(r.bopomofo||r.pinyin||'')}</div><div class="muted">${esc([r.radical,r.strokes,r.code?'簡易 '+r.code:''].filter(Boolean).join(' · '))}</div></button>`).join('');$('page').textContent=`第 ${page+1} / ${max} 頁`;$('prev').disabled=page===0;$('next').disabled=page>=max-1}function safeLink(url,label){try{let u=new URL(url);if(!['http:','https:'].includes(u.protocol))return '';return `<a href="${esc(u.href)}" target="_blank" rel="noopener noreferrer">${esc(label)} ↗</a>`}catch{return ''}}function openDetail(r){let extraStrokes=extraStrokeIndex.get(r.id)||[];let radicals=radicalCards.filter(c=>c.chars.some(x=>x.id===r.id));let structures=structureCards.filter(c=>c.chars.some(x=>x.id===r.id));let associated=inputCards.filter(c=>c.chars.some(x=>x.id===r.id));let pairs=[['注音',r.bopomofo],['拼音',r.pinyin],['部首',r.radical],['總筆畫',r.strokes],['字形結構',r.structure],['簡易碼',r.code],['倉頡碼',r.cangjie],['常用程度',r.usage],['基本解釋',r.meaning],['詳細解釋',r.detail]].filter(x=>x[1]);$('detailContent').innerHTML=`<div class="character">${esc(r.char)}</div><dl>${pairs.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl><h3>部外筆劃</h3><div class="links">${extraStrokes.length?extraStrokes.map(c=>`<a href="character-extra-strokes.html?card=${encodeURIComponent(c.id)}">${esc(c.name||"未命名")}</a>`).join(""):"尚無關聯"}</div><h3>相關部首</h3><div class="links">${radicals.length?radicals.map(c=>`<a href="character-radical.html?card=${encodeURIComponent(c.id)}">${esc(c.name||"未命名")}</a>`).join(""):"尚無關聯"}</div><h3>相關結構</h3><div class="links">${structures.length?structures.map(c=>`<a href="character-structure.html?card=${encodeURIComponent(c.id)}">${esc(c.name||"未命名")}</a>`).join(""):"尚無關聯"}</div><h3>相關簡易輸入法</h3><div class="links">${associated.length?associated.map(c=>`<a href="simple-input.html?card=${encodeURIComponent(c.id)}">${esc(c.name||"未命名")}</a>`).join(""):"尚無關聯"}</div><h3>其他資源</h3><div class="links">${safeLink(r.education,'教育百科')}${safeLink(r.dictionary,'漢語字典')}${safeLink(r.animation,'筆順動畫')}${safeLink(r.strokeGuide,'筆順指南')}${safeLink(r.practice,'筆順練習卡')}${safeLink('https://airtable.com/appf1ZIjcI2DnuQmq/tbl3nUbmbe6xufLkm/'+r.id,'Airtable 原始資料')}</div>`;$('detail').showModal()}$('grid').addEventListener('click',e=>{let b=e.target.closest('[data-i]');if(b)openDetail(filtered[page*size+Number(b.dataset.i)])});$('close').onclick=()=>$('detail').close();$('prev').onclick=()=>{page--;draw();window.scrollTo(0,0)};$('next').onclick=()=>{page++;draw();window.scrollTo(0,0)};['search','radical','strokes'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',refresh));Promise.all([fetch('../data/character-simple/extra-stroke-cards.json').then(r=>{if(!r.ok)throw Error();return r.json()}),fetch('../data/character-simple/radical-cards.json').then(r=>{if(!r.ok)throw Error();return r.json()}),fetch('../data/character-simple/structure-cards.json').then(r=>{if(!r.ok)throw Error();return r.json()}),fetch('../data/character-simple/input-cards.json').then(r=>{if(!r.ok)throw Error();return r.json()}),fetch('../data/character-simple/manifest.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(m=>Promise.all(m.files.map(f=>fetch('../data/character-simple/'+f).then(r=>{if(!r.ok)throw Error();return r.json()}))))]).then(([extras,radicals,structures,cards,d])=>{extras.forEach(c=>c.chars.forEach(x=>{let a=extraStrokeIndex.get(x.id)||[];a.push(c);extraStrokeIndex.set(x.id,a)}));radicalCards=radicals;structureCards=structures;inputCards=cards;data=d.flat();options('radical',data.map(r=>r.radical));options('strokes',data.map(r=>r.strokes),(a,b)=>parseInt(a)-parseInt(b));refresh();let id=new URLSearchParams(location.search).get('record');if(id){let r=data.find(x=>x.id===id);if(r)openDetail(r);else $('status').textContent='找不到指定的字卡。'}}).catch(()=>{$('status').textContent='資料載入失敗，請稍後重新整理。'});
</script></body></html>
