<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#20b5b7">
<title>斯瓦魯啟動器｜Personal OS</title>
<style>
*{box-sizing:border-box}
:root{--ink:#173e68;--muted:#70849a;--teal:#18b5b7;--aqua:#5ed6c0;--violet:#7965e9;--gold:#ffc94f}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:linear-gradient(145deg,#eafff4 0%,#e3f8f8 48%,#f1ecff 100%);overflow-x:hidden}
body:before,body:after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%}
body:before{width:380px;height:380px;right:-150px;top:80px;background:radial-gradient(circle,rgba(44,205,197,.28),transparent 70%)}
body:after{width:420px;height:420px;left:-190px;bottom:-180px;background:radial-gradient(circle,rgba(137,113,240,.2),transparent 70%)}
main{width:min(100%,900px);margin:auto;padding:18px 20px 54px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.back{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;background:rgba(255,255,255,.8);color:var(--ink);text-decoration:none;font-size:14px;font-weight:750;box-shadow:0 5px 16px rgba(37,100,117,.08);transition:transform .18s}
.back:hover{transform:translateX(-3px)}
.count{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.7);color:var(--muted);font-size:13px;font-weight:750}
.hero{position:relative;isolation:isolate;overflow:hidden;padding:28px clamp(22px,5vw,44px);border-radius:30px;background:linear-gradient(120deg,#1bb7b3 0%,#31b8b1 42%,#7567e8 100%);color:#fff;box-shadow:0 18px 40px rgba(56,133,157,.22)}
.hero:before{content:"";position:absolute;right:30px;top:-82px;width:250px;height:250px;border:2px solid rgba(255,255,255,.22);border-radius:50%;z-index:-1}
.hero:after{content:"✦";position:absolute;right:88px;top:38px;color:rgba(255,255,255,.54);font-size:45px;z-index:-1}
.eyebrow{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;margin-bottom:12px;border:1px solid rgba(255,255,255,.38);border-radius:999px;background:rgba(255,255,255,.16);font-size:12px;font-weight:800;letter-spacing:.07em}
h1{margin:0;font-size:clamp(34px,8vw,58px);line-height:1.08;letter-spacing:.02em}
.hero p{margin:11px 0 0;color:rgba(255,255,255,.92);font-size:clamp(14px,2.4vw,17px);line-height:1.65}
.section{margin-top:24px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:12px}
.section-head h2{margin:0;font-size:20px}
.section-head p{margin:0;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{--accent:#219fcb;position:relative;min-height:105px;display:grid;grid-template-columns:58px 1fr 24px;align-items:center;gap:12px;overflow:hidden;padding:15px 16px;border:1px solid rgba(255,255,255,.95);border-radius:21px;background:rgba(255,255,255,.91);color:var(--ink);text-decoration:none;box-shadow:0 9px 22px rgba(46,87,119,.09);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.card:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--accent);transform:scaleY(.35);transition:transform .2s;border-radius:0 5px 5px 0}
.card:after{content:"";position:absolute;width:92px;height:92px;right:-38px;bottom:-52px;border-radius:50%;background:color-mix(in srgb,var(--accent) 11%,transparent);transition:transform .25s}
.card:hover{transform:translateY(-4px) rotate(-.25deg);box-shadow:0 16px 30px rgba(46,87,119,.15);border-color:color-mix(in srgb,var(--accent) 32%,white)}
.card:hover:before{transform:scaleY(.78)}.card:hover:after{transform:scale(1.22)}
.card:focus-visible,.back:focus-visible{outline:3px solid #183e68;outline-offset:3px}
.icon{position:relative;z-index:1;width:54px;height:54px;display:grid;place-items:center;border-radius:18px;background:color-mix(in srgb,var(--accent) 13%,white);color:var(--accent);font-size:25px;font-weight:900;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 9%,white)}
.name{position:relative;z-index:1;font-size:clamp(16px,3vw,20px);font-weight:850;line-height:1.25}
.arrow{position:relative;z-index:1;color:var(--accent);font-size:20px;font-weight:850;transition:transform .18s}
.card:hover .arrow{transform:translate(3px,-2px)}
.facebook{--accent:#1877f2}.blog{--accent:#8e65d9}.stackby{--accent:#e9923a}.youtube{--accent:#f13c43}.chatgpt{--accent:#159f84}.odio{--accent:#e35e8d}
.email{grid-column:1/-1;display:flex;align-items:center;gap:12px;min-height:66px;padding:13px 17px;border-radius:18px;background:linear-gradient(100deg,#fff,#fff8d9);color:#425269;font-size:clamp(15px,3.5vw,19px);font-weight:750;overflow-wrap:anywhere;box-shadow:0 8px 20px rgba(46,87,119,.07)}
.email span:first-child{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:12px;background:#ffebad;color:#b77d11;font-size:19px}
footer{margin-top:23px;text-align:center;color:#788b99;font-size:12px}
@media(max-width:560px){main{padding:14px 13px 42px}.hero{border-radius:24px;padding:24px 20px}.hero:before{right:-55px;width:210px;height:210px}.hero:after{right:32px;top:36px}.grid{gap:10px}.card{min-height:91px;grid-template-columns:45px 1fr 18px;gap:9px;padding:12px 11px;border-radius:18px}.icon{width:43px;height:43px;border-radius:15px;font-size:21px}.name{font-size:16px}.section-head h2{font-size:18px}}
@media(max-width:370px){.grid{grid-template-columns:1fr}.email{grid-column:auto}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
