<title>斯瓦魯啟動器｜Personal OS</title>
<style>
*{box-sizing:border-box}
:root{--bg:#eff1df;--ink:#123f78;--olive:#706343;--card:#fff}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
main{max-width:760px;margin:0 auto;padding:18px 20px 42px}
.back{display:inline-flex;align-items:center;padding:9px 15px;margin:0 0 14px;border-radius:999px;background:#fff;color:var(--ink);text-decoration:none;font-weight:700}
h1{margin:0 0 20px;background:var(--olive);color:#fff;text-align:center;padding:12px 8px;font-size:clamp(28px,7vw,46px);letter-spacing:.05em}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
a.card{min-height:76px;display:grid;grid-template-columns:92px 1fr;align-items:center;gap:10px;padding:8px 16px;background:var(--card);border-radius:18px;text-decoration:none;color:var(--ink);font-size:clamp(20px,5vw,31px);text-align:center;box-shadow:0 3px 9px rgba(41,50,37,.06);transition:transform .15s,box-shadow .15s}
a.card:hover{transform:translateY(-2px);box-shadow:0 7px 16px rgba(41,50,37,.12)}
.icon{height:56px;display:grid;place-items:center;font-size:38px;font-weight:800;color:#2870ae}
.icon img{width:56px;height:56px;object-fit:contain;border-radius:12px}
.email{margin:8px 2px 0;padding:3px 0;background:#fff;color:#20242a;font-weight:700;font-size:clamp(17px,4.5vw,24px);overflow-wrap:anywhere}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}a.card{grid-template-columns:64px 1fr;min-height:82px;font-size:22px}.email{grid-column:1/-1}}
</style>
</head>
<body><main>
