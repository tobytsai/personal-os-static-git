<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>文字視頻｜字・簡易啟動器</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#263f38;font:16px system-ui,sans-serif}header{background:#286c5a;color:white;padding:26px max(20px,calc((100% - 1100px)/2))}header a{color:white}h1{margin:10px 0}main{max-width:1100px;margin:auto;padding:20px}.bar{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;border:1px solid #cad9d2;border-radius:9px;background:white;padding:10px}input{flex:1;min-width:200px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:18px 0}.card{background:white;border:1px solid #dce8e0;border-radius:15px;overflow:hidden}.card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#e5eee8}.body{padding:14px}.body h2{font-size:17px;line-height:1.4;margin:0 0 9px}.muted{font-size:14px;color:#65776f;line-height:1.5}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.links a{background:#e5f3eb;color:#155941;padding:8px 10px;border-radius:8px;text-decoration:none;font-size:14px}.pager{display:flex;justify-content:center;gap:12px;align-items:center;margin:20px}.pager button{cursor:pointer}.pager button:disabled{opacity:.5}.notice{line-height:1.6}.empty{padding:20px}.grid a:focus-visible{outline:3px solid #138a6e}@media(max-width:580px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.body{padding:10px}.body h2{font-size:15px}.links a{font-size:13px}}
</style></head><body><header><a href="character-simple.html">← 返回字・簡易啟動器</a><h1>🎬 文字視頻</h1><div>蔡侯燁 Airtable｜中華語文知識庫</div></header><main>
<p class="notice">收錄中華語文知識庫的影片；「漢字說故事」標題中明確列出單字的影片，可連到首頁對應字卡。資料為建立時的快照。</p>
<p><a href="https://airtable.com/apppZqeNsKgKw3DAv/tblqWyN3fnTt2LrlF/viwfaPcQTIfJy0A7J" target="_blank" rel="noopener">開啟 Airtable Grid view ↗</a></p>
<div class="bar"><input id="search" type="search" placeholder="搜尋影片標題或漢字" aria-label="搜尋影片"><select id="filter" aria-label="影片分類"><option value="">全部影片</option><option value="story">漢字說故事</option><option value="linked">有對應字卡</option><option value="other">其他文字影片</option></select></div><p id="status" class="muted" role="status">資料載入中…</p><div id="grid" class="grid"></div><div class="pager"><button id="prev">上一頁</button><span id="page"></span><button id="next">下一頁</button></div></main>
<script>
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let videos=[],filtered=[],chars=new Map(),page=0;const size=36;
function safe(url){try{let u=new URL(url);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
function videoId(url){try{let u=new URL(url);return /(^|\.)youtube\.com$/.test(u.hostname)&&/^[\w-]{11}$/.test(u.searchParams.get('v')||'')?u.searchParams.get('v'):''}catch{return ''}}
function refresh(){let q=$('search').value.trim().toLowerCase(),f=$('filter').value;filtered=videos.filter(v=>(!q||(v.title+' '+v.topic).toLowerCase().includes(q))&&(!f||(f==='story'&&v.title.includes('漢字說故事'))||(f==='linked'&&chars.has(v.topic))||(f==='other'&&!v.title.includes('漢字說故事'))));page=0;draw()}
function draw(){let max=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,max-1);$('status').textContent='顯示 '+filtered.length+' / '+videos.length+' 支影片';$('grid').innerHTML=filtered.slice(page*size,(page+1)*size).map(v=>{let yt=videoId(v.url),matches=chars.get(v.topic)||[],url=safe(v.url),img=yt?'<img loading="lazy" src="https://i.ytimg.com/vi/'+yt+'/hqdefault.jpg" alt="" onerror="this.style.display=\'none\'">':'';return '<article class="card" id="card-'+esc(v.id)+'">'+img+'<div class="body"><h2>'+esc(v.title)+'</h2><div class="muted">'+esc([v.duration,v.views].filter(Boolean).join(' · '))+'</div>'+(v.topic?'<p class="muted">標題字：'+esc(v.topic)+'</p>':'')+'<div class="links">'+(url?'<a href="'+esc(url)+'" target="_blank" rel="noopener">▶ 觀看影片</a>':'')+'<a href="https://airtable.com/apppZqeNsKgKw3DAv/tblqWyN3fnTt2LrlF/viwfaPcQTIfJy0A7J/'+esc(v.id)+'" target="_blank" rel="noopener">Airtable ↗</a>'+matches.map(x=>'<a href="character-simple.html?record='+encodeURIComponent(x.id)+'">字卡：'+esc(x.char)+' →</a>').join('')+'</div></div></article>'}).join('')||'<p class="empty">找不到符合的影片。</p>';$('page').textContent='第 '+(page+1)+' / '+max+' 頁';$('prev').disabled=page===0;$('next').disabled=page>=max-1}
$('prev').onclick=()=>{page--;draw();window.scrollTo(0,0)};$('next').onclick=()=>{page++;draw();window.scrollTo(0,0)};$('search').oninput=refresh;$('filter').onchange=refresh;
Promise.all([fetch('../data/character-simple/video-cards.json').then(r=>{if(!r.ok)throw Error();return r.json()}),fetch('../data/character-simple/manifest.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(m=>Promise.all(m.files.map(f=>fetch('../data/character-simple/'+f).then(r=>{if(!r.ok)throw Error();return r.json()}))))]).then(([v,parts])=>{videos=v;for(let r of parts.flat()){if(r.char){let a=chars.get(r.char)||[];a.push(r);chars.set(r.char,a)}}let id=new URLSearchParams(location.search).get('card');refresh();if(id){let n=filtered.findIndex(v=>v.id===id);if(n>=0){page=Math.floor(n/size);draw();document.getElementById('card-'+id)?.scrollIntoView({block:'center'})}}}).catch(()=>$('status').textContent='資料載入失敗，請稍後重新整理。');
</script></body></html>
