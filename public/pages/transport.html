<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#256da9">
<meta name="description" content="交通啟動器：集中管理臺鐵及其他交通資訊連結，支援分類、搜尋、收藏與最近開啟。">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>交通啟動器｜Toby Personal OS</title>
<style>
:root{--ink:#243249;--muted:#6c7b8f;--line:#dce6f2;--blue:#2472ab;--deep:#143d68;--paper:#fff;--shadow:0 9px 26px #193c6313}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 92% 0%,#caebff 0%,transparent 34%),linear-gradient(145deg,#edf6fc,#f7f9fc 65%,#eaf7f3);color:var(--ink);font:14px/1.65 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif}
a{color:inherit}button,input{font:inherit}button{cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #64b1f2;outline-offset:3px}
.wrap{width:min(1100px,100%);margin:auto;padding:22px 18px 70px}
.back{display:inline-flex;padding:8px 16px;background:#fff;border:1px solid var(--line);border-radius:99px;text-decoration:none;font-weight:800;margin-bottom:15px}
.hero{background:linear-gradient(115deg,#183c68,#236da3 60%,#39a5ae);border-radius:28px;color:#fff;padding:clamp(25px,5vw,42px);box-shadow:0 20px 42px #21538b32;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:220px;height:220px;border:2px solid #ffffff3d;border-radius:50%;right:-80px;bottom:-145px}
.eyebrow{font-size:11px;font-weight:850;letter-spacing:.16em;opacity:.88}
h1{font-size:clamp(32px,6vw,49px);margin:9px 0 7px;line-height:1.22}
.hero p{max-width:720px;margin:0;color:#e8f7ff;line-height:1.85}
.hero-info{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.hero-info span{font-size:12px;padding:7px 11px;border:1px solid #ffffff50;background:#ffffff19;border-radius:999px;font-weight:750}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:21px 0 14px}
.search{flex:1 1 240px;min-width:0;padding:12px 15px;border:1px solid var(--line);border-radius:15px;outline:none;background:#fff;box-shadow:var(--shadow);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;padding:9px 15px;border-radius:99px;color:#4f6780;font-weight:850}
.chip.active{color:#fff;background:var(--blue);border-color:var(--blue)}
.section{margin-top:25px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:12px}
.section-head h2{font-size:20px;margin:0}
.count{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;min-width:0;padding:21px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);transition:transform .16s,box-shadow .16s}
.card:hover{transform:translateY(-3px);box-shadow:0 13px 30px #193c6320}
.card .symbol{width:65px;height:65px;background:linear-gradient(135deg,#d9eaff,#dff7f3);border-radius:18px;display:grid;place-items:center;font-size:36px;margin-bottom:13px}
.card h3{font-size:19px;line-height:1.45;margin:0 36px 6px 0}
.card .meta{font-size:11px;color:#2472ab;font-weight:850;margin-bottom:9px}
.card p{font-size:13px;color:var(--muted);line-height:1.7;min-height:45px;margin:0 0 15px}
.card .action{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;color:#fff;background:var(--blue);border-radius:11px;text-decoration:none;font-weight:850}
.card .action:hover{background:var(--deep)}
.card .fav{position:absolute;top:17px;right:17px;background:#f5f9fd;border:1px solid var(--line);border-radius:12px;width:37px;height:37px;font-size:21px;color:#9eacb9}
.card .fav[aria-pressed="true"]{color:#dfab26;background:#fff8e4}
.empty{padding:20px;background:#ffffffb8;border:1px dashed #aec7dc;color:var(--muted);border-radius:16px}
.small-cards .card{padding:14px}
.small-cards .card .symbol{width:43px;height:43px;font-size:24px;margin-bottom:8px}
.small-cards .card h3{font-size:15px}
.small-cards .card p{min-height:0}
.note{font-size:12px;color:var(--muted);margin-top:25px}
[hidden]{display:none!important}
@media(max-width:600px){.wrap{padding:13px 12px 45px}.hero{padding:24px 20px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:14px}.card h3{font-size:15px;margin-right:25px}.card .fav{right:9px;top:9px;width:31px;height:31px;font-size:18px}.card .symbol{width:52px;height:52px;font-size:29px}.card p{font-size:12px;min-height:0}.card .action{padding:7px 9px;font-size:12px}.section-head h2{font-size:18px}}
</style>
</head>
<body>
<main class="wrap">
<a class="back" href="../index.html">← 返回 Toby 首頁</a>
<header class="hero">
<div class="eyebrow">PERSONAL OS · TRANSPORT</div>
<h1>🚆 交通啟動器</h1>
<p>整理交通工具的資訊與查詢入口。從台鐵分類快速前往列車動態，常用連結也能加入收藏。</p>
<div class="hero-info"><span>🗂️ 分類：台鐵</span><span>⭐ 收藏</span><span>🕘 最近開啟</span></div>
</header>
<div class="toolbar">
<input id="search" class="search" type="search" placeholder="搜尋交通工具或網站名稱…" aria-label="搜尋交通卡片">
<nav class="chips" aria-label="交通分類"><button type="button" class="chip active" data-cat="全部">全部</button><button type="button" class="chip" data-cat="台鐵">台鐵</button></nav>
</div>
<section class="section" id="mainSection">
<div class="section-head"><h2 id="listTitle">台鐵及其他交通資訊</h2><span class="count" id="itemCount">1 張卡片</span></div>
<div class="cards" id="cards">
<article class="card"><div class="symbol" aria-hidden="true">🚆</div><h3>臺鐵列車動態</h3><div class="meta">台鐵 · 第三方即時查詢</div><p>查詢車站、車次、列車動態及列車位置地圖。</p><a class="action" href="https://railway.chienwen.net/taiwan/" target="_blank" rel="noopener noreferrer">開啟列車動態 ↗</a></article>
</div>
</section>
<section class="section" id="favoritesSection" hidden><div class="section-head"><h2>⭐ 我的收藏</h2><span class="count" id="favoriteCount"></span></div><div class="cards small-cards" id="favorites"></div></section>
<section class="section" id="recentSection" hidden><div class="section-head"><h2>🕘 最近開啟</h2><span class="count" id="recentCount"></span></div><div class="cards small-cards" id="recent"></div></section>
<p class="note">本頁的收藏與最近開啟紀錄只保存在目前瀏覽器。臺鐵列車動態由第三方網站提供，實際行車與營運公告請以臺鐵官方資訊為準。</p>
</main>
<script>
const items=[{id:"tra-live",category:"台鐵",name:"臺鐵列車動態",url:"https://railway.chienwen.net/taiwan/",symbol:"🚆",desc:"查詢車站、車次、列車即時狀態與位置地圖。",source:"第三方列車動態查詢"}];
const favKey="toby-transport-favorites",recentKey="toby-transport-recent";
function load(key){try{const a=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(a)?a:[]}catch(e){return []}}
let favorites=load(favKey),recent=load(recentKey),category="全部";
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function card(item){return '<article class="card"><div class="symbol" aria-hidden="true">'+esc(item.symbol)+'</div><button class="fav" type="button" data-fav="'+esc(item.id)+'" aria-label="'+(favorites.includes(item.id)?"取消收藏":"加入收藏")+'" aria-pressed="'+favorites.includes(item.id)+'">'+(favorites.includes(item.id)?"★":"☆")+'</button><h3>'+esc(item.name)+'</h3><div class="meta">'+esc(item.category)+' · '+esc(item.source)+'</div><p>'+esc(item.desc)+'</p><a class="action" href="'+esc(item.url)+'" target="_blank" rel="noopener noreferrer" data-open="'+esc(item.id)+'">開啟網站 ↗</a></article>'}
function subset(ids){return ids.map(id=>items.find(x=>x.id===id)).filter(Boolean)}
function render(){let q=$("search").value.trim().toLowerCase();const filtered=items.filter(i=>(category==="全部"||i.category===category)&&(!q||(i.name+" "+i.category+" "+i.desc).toLowerCase().includes(q)));$("listTitle").textContent=category==="全部"?"全部交通資訊":category;$("itemCount").textContent=filtered.length+" 張卡片";$("cards").innerHTML=filtered.length?filtered.map(card).join(""):'<div class="empty">找不到符合條件的卡片。</div>';const f=subset(favorites),r=subset(recent);$("favoritesSection").hidden=!f.length;$("recentSection").hidden=!r.length;$("favorites").innerHTML=f.map(card).join("");$("recent").innerHTML=r.map(card).join("");$("favoriteCount").textContent=f.length+" 張";$("recentCount").textContent=r.length+" 張"}
document.querySelector(".chips").addEventListener("click",e=>{const b=e.target.closest("button[data-cat]");if(!b)return;category=b.dataset.cat;document.querySelectorAll("[data-cat]").forEach(x=>x.classList.toggle("active",x.dataset.cat===category));render()});
$("search").addEventListener("input",render);
document.body.addEventListener("click",e=>{const b=e.target.closest("[data-fav]");if(b){const id=b.dataset.fav;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[id,...favorites];localStorage.setItem(favKey,JSON.stringify(favorites));render();return}const a=e.target.closest("a[data-open]");if(a){recent=[a.dataset.open,...recent.filter(x=>x!==a.dataset.open)].slice(0,10);localStorage.setItem(recentKey,JSON.stringify(recent));render()}});
render();
</script>
<script src="../shared-nav.js" defer></script>
</body>
</html>
