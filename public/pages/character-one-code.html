<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>一碼輸入法｜字・簡易啟動器</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#263f38;font:16px system-ui,sans-serif}header{background:#286c5a;color:white;padding:26px max(20px,calc((100% - 1100px)/2))}header a{color:white}h1{margin:10px 0 4px}main{max-width:1100px;margin:auto;padding:20px}.bar{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;border:1px solid #cad9d2;border-radius:9px;background:white;padding:10px}input{flex:1;min-width:200px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin:18px 0}.card{background:white;border:1px solid #dce8e0;border-radius:15px;padding:16px;text-align:left;cursor:pointer;color:inherit;min-height:120px}.card:hover{box-shadow:0 4px 15px #a8bcb655}.character{font-family:serif;font-size:40px;font-weight:bold}.muted{color:#65776f;font-size:14px;margin:8px 0}.links{display:flex;flex-wrap:wrap;gap:8px}.links a{display:inline-block;background:#e5f3eb;color:#155941;padding:7px 11px;border-radius:8px;text-decoration:none}dialog{border:0;border-radius:16px;width:min(820px,94vw);max-height:85vh;padding:24px;box-shadow:0 15px 50px #0004;overflow:auto}dialog::backdrop{background:#0008}.close{float:right;cursor:pointer}.pager{display:flex;justify-content:center;gap:12px;align-items:center;margin:20px}.notes{white-space:pre-wrap}</style></head>
<body><header><a href="character-simple.html">← 返回字・簡易啟動器</a><h1>一碼輸入法</h1><div>依一碼按鍵瀏覽對應的字</div></header><main><div class="bar"><input id="search" placeholder="搜尋字或一碼按鍵" aria-label="搜尋"><select id="code" aria-label="一碼按鍵"><option value="">全部按鍵</option></select></div><div id="status" class="muted" role="status">正在載入資料…</div><div id="grid" class="grid"></div><div class="pager"><button id="prev">上一頁</button><span id="page"></span><button id="next">下一頁</button></div></main><dialog id="detail"><button class="close" id="close">關閉 ✕</button><div id="detailContent"></div></dialog><script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cards=[],filtered=[],chars=new Map(),page=0;const size=60;
function refresh(){let q=$('search').value.toLowerCase().trim(),code=$('code').value;filtered=cards.filter(r=>(!code||r.code===code)&&(!q||[r.character,r.code,r.name,r.notes].join(' ').toLowerCase().includes(q)));page=0;draw()}
function draw(){let max=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,max-1);$('status').textContent='符合 '+filtered.length+' 筆／共 '+cards.length+' 筆';$('grid').innerHTML=filtered.slice(page*size,(page+1)*size).map((r,i)=>'<button class="card" data-i="'+i+'"><div class="character">'+esc(r.character||'□')+'</div><div>一碼：'+esc(r.code||'未填寫')+'</div></button>').join('')||'<p>找不到符合的卡片。</p>';$('page').textContent='第 '+(page+1)+' / '+max+' 頁';$('prev').disabled=page===0;$('next').disabled=page>=max-1}
function openCard(r){let matches=chars.get(r.character)||[],links=matches.map(x=>'<a href="character-simple.html?record='+encodeURIComponent(x.id)+'">'+esc(x.char)+'</a>').join('');$('detailContent').innerHTML='<h2 class="character">'+esc(r.character||'未填寫')+'</h2><p><strong>一碼按鍵：</strong>'+esc(r.code||'未填寫')+'</p>'+(r.notes?'<p class="notes">'+esc(r.notes)+'</p>':'')+(r.category?'<p>分類：'+esc(r.category)+'</p>':'')+(r.assignee?'<p>Assignee：'+esc(r.assignee)+'</p>':'')+'<div class="links"><a href="https://airtable.com/appf1ZIjcI2DnuQmq/tblADLlkNSGXUfJbN/'+encodeURIComponent(r.id)+'" target="_blank" rel="noopener noreferrer">Airtable 原始資料 ↗</a></div><h3>相同字元的字卡</h3><p class="muted">依一碼記錄中的字與「字。簡易」字元完全相同自動對照。</p><div class="links">'+(links||'目前沒有相同字元的字卡。')+'</div>';if(!$('detail').open)$('detail').showModal();history.replaceState(null,'','?card='+encodeURIComponent(r.id))}
$('grid').addEventListener('click',e=>{let b=e.target.closest('[data-i]');if(b)openCard(filtered[page*size+Number(b.dataset.i)])});$('close').onclick=()=>{$('detail').close();history.replaceState(null,'',location.pathname)};$('detail').addEventListener('cancel',()=>history.replaceState(null,'',location.pathname));$('search').addEventListener('input',refresh);$('code').addEventListener('change',refresh);$('prev').onclick=()=>{page--;draw();window.scrollTo(0,0)};$('next').onclick=()=>{page++;draw();window.scrollTo(0,0)};
Promise.all([fetch('../data/character-simple/one-code-cards.json').then(r=>{if(!r.ok)throw Error();return r.json()}),fetch('../data/character-simple/manifest.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(m=>Promise.all(m.files.map(f=>fetch('../data/character-simple/'+f).then(r=>{if(!r.ok)throw Error();return r.json()}))))]).then(([d,parts])=>{cards=d.sort((a,b)=>a.code.localeCompare(b.code)||a.character.localeCompare(b.character,'zh-Hant'));parts.flat().forEach(x=>{if(x.char){let list=chars.get(x.char)||[];list.push(x);chars.set(x.char,list)}});[...new Set(cards.map(r=>r.code).filter(Boolean))].sort().forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;$('code').append(o)});refresh();let id=new URLSearchParams(location.search).get('card'),r=cards.find(x=>x.id===id);if(r)openCard(r)}).catch(()=>$('status').textContent='資料載入失敗，請稍後重新整理。');
</script></body></html>
