","url":"https://south.npm.gov.tw/ExhibitionsDetailC003110.aspx?Cond=ccf40d32-9114-4461-96fa-e66879eb5af6&appname=Exhibition3112&State=0","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblxLI1C9aGrnwkQO/viwUkxHNy76VYfi6D/recHFjnPBtdvotNgD","attachments":["Screenshot_20211207083604.jpg","【亞洲織品展】第一、二檔展件清單.pdf"],"links":[]},{"id":"recR7J2drjGatazaA","name":"嘉義文史展","notes":"","place":"南故宮","kind":"故宮資料","url":"https://south.npm.gov.tw/ExhibitionsDetailC003110.aspx?Cond=d2a3cf4a-838e-4174-a7c5-4042f8dc1df7&appname=Exhibition3112&State=0","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblxLI1C9aGrnwkQO/viwUkxHNy76VYfi6D/recR7J2drjGatazaA","attachments":["Screenshot_20211207084156.jpg"],"links":[]},{"id":"recTNSjbacVH4j0k2","name":"印尼蠟染特展","notes":"印尼蠟染特展\n\n蠟染是印度尼西亞傳統織品染製方法，2009年聯合國教科文組織將其列入非物質世界文化遺產。印尼人迄今仍於出生、婚嫁、喪禮等重要儀式中持續穿著。\n \n印尼語的蠟染為峇迪(Batik)，有繪畫、描寫之意，以銅壺筆(canting)作為染製工具為印尼獨有的工藝傳統。印尼蠟染發展於17世紀爪哇島中部，此時建立王室禁紋的傳統，透過紋飾規範不同階級的穿著；後期在印尼貿易發達的區域如爪哇北岸，各地商旅匯聚，使蠟染紋飾朝多元融合的方向發展。\n \n本次以院藏蠟染精品，規劃三個單元：「繪染世界─認識蠟染」、「宮廷古典─中爪哇蠟染」、「多元紛呈─北岸蠟染」，期待透過蠟染技法與紋飾發展的介紹，一窺印尼多采多姿的歷史與文化。\n\n\n繪染世界—認識蠟染\n\n峇迪(Batik)在印尼與菲律賓語具紋身意涵，由於蠟染紋飾與紋身圖案功能相似，具避禍保身之效，隨著時代變遷，蠟染取代紋身習俗，起源可能與紋身相關。蠟染是以蠟作為防染的染織技法。亞洲其他地區亦使用蠟染，但印尼以銅壺筆作為繪製工具，獨樹一格，創作出宛如繪畫般的細緻紋樣，十九世紀起為大量生產，改以銅模蓋印，也促進蠟染工業的發展。\n\n宮廷古典—中爪哇蠟染\n\n印尼蠟染發展以爪哇最盛，以靛藍、褐為主要用色，起源於十七世紀中爪哇馬塔蘭宮廷。中爪哇古典文化歷史悠久，雖曾吸收佛教、印度教文化元素，但當地以伊斯蘭信仰為主流，故紋飾多以植物、幾何圖案為主，並明確規範巴冷紋(Parang)、嘉應紋(Kawung)、蘇門紋(Semen)等紋飾為皇室的專屬紋樣。時至今日，皇室禁紋成為當代的蠟染流行紋樣。\n\n多元紛呈—北岸蠟染\n\n爪哇北岸自古即是貿易重鎮，來自印度的珍稀織品多在此交易。故此處早期蠟染多模仿印度繪染布設計，兼採中爪哇圖案佈局。由於此地匯聚印度人、阿拉伯人、華人、歐洲人等族群，為滿足不同喜好，紋飾設計多元發展，如深受華人喜愛的吉祥紋樣，或是印歐社群流行的寫實風格花束紋，各自引領製作風潮。","place":"南故宮","kind":"故宮資料","url":"https://south.npm.gov.tw/ExhibitionsDetailC003110.aspx?Cond=af77aef8-8be5-4e3c-ab56-56603d9eeb1e&appname=Exhibition3112&State=0","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblxLI1C9aGrnwkQO/viwUkxHNy76VYfi6D/recTNSjbacVH4j0k2","attachments":["海報(2).jpg","【印尼蠟染特展】(4).pdf"],"links":[]},{"id":"recTXrEN8RF1taxDz","name":"S301導覽大廳","notes":"","place":"南故宮","kind":"故宮資料","url":"https://south.npm.gov.tw/ExhibitionsDetailC003110.aspx?Cond=8e79832c-2548-48d1-ad87-81f3f1d43365&appname=Exhibition3112&State=0","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblxLI1C9aGrnwkQO/viwUkxHNy76VYfi6D/recTXrEN8RF1taxDz","attachments":["Screenshot_20211207084056.jpg"],"links":[]},{"id":"recW7stqlCuUEnKHh","name":"佛陀形影—院藏亞洲佛教藝術之美","notes":"","place":"南故宮","kind":"故宮資料","url":"https://south.npm.gov.tw/ExhibitionsDetailC003110.aspx?Cond=be0bda12-a244-4702-9c92-059f13f33c3b&appname=Exhibition3112&State=0","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblxLI1C9aGrnwkQO/viwUkxHNy76VYfi6D/recW7stqlCuUEnKHh","attachments":["Screenshot_20211207084654.jpg","【佛陀形影—院藏佛教藝術之美常設展】.pdf"],"links":[{"id":"recXGghfs5yEcGrPU","name":"佛陀形影—院藏亞洲佛教藝術之美"}]},{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展","notes":"","place":"南故宮","kind":"故宮資料","url":"https://south.npm.gov.tw/ExhibitionsDetailC003110.aspx?Cond=9963f5e2-df38-4cb3-bfdf-b689c14ca3f7&appname=Exhibition3112&State=0","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblxLI1C9aGrnwkQO/viwUkxHNy76VYfi6D/reclbrBsaOBZ292XY","attachments":["Screenshot_20211207083937.jpg","【東亞茶文化展】(1).pdf"],"links":[{"id":"recNSgqt0trUgsKEG","name":"唐風宋韻 中國茶文化"},{"id":"recycQKTn07wKV6ST","name":"東亞茶文化展"},{"id":"rec656Xu1zv6Uyzxf","name":"明人雅集 中國茶文化"},{"id":"recvGTeHMDw6JH5dy","name":"清代品茗 中國茶文化"},{"id":"rec2x0nEfDMkZnTda","name":"蒙藏奶茶"},{"id":"reczOxwVy8RIbvJDZ","name":"和敬清寂 日本茶文化"},{"id":"recPaBHR1hgR9siL8","name":"煎茶茗讌 日本茶文化"},{"id":"recbT8RDmX4RqUWOe","name":"臺灣工夫茶"},{"id":"reczX3ixWfSlHp8g3","name":"唐代 長沙窯 綠釉單柄壺"},{"id":"recacUqEeaDzrIWzX","name":"宋\n\n吉州窯 黑釉木葉紋茶碗\n"},{"id":"recWRs7WdYxydxZPE","name":"北宋\n定窯 牙白劃花回紋茶托"},{"id":"rec2nUp1jO7DZwlJX","name":"明 宣德\n青花轉枝海棠紋茶葉罐"},{"id":"rec3rKwYmcHuKiJNT","name":"明\n宣德 寶石紅茶鍾"},{"id":"rec5GD7tvUOu9S0Bd","name":"清 康熙\n青花山水人物六方茶葉罐"},{"id":"reckaQBxaOuhaVNjv","name":"清 乾隆六年\n洋彩番蓮紋紅地茶壺"},{"id":"recwX3s7axHPUp3in","name":"清 乾隆七年\n洋彩錦上添花紅地茶鍾一對"},{"id":"rechZAUIXpHnSVKyC","name":"清 乾隆\n瓷仿拉古里木紋茶碗及多穆壺"},{"id":"rec1dTGohjbSpJG2a","name":"清末民初\n「是禮」款紅磚茶擔"},{"id":"recrFocO4fWmHbzxM","name":"清末民初\n工夫茶器一組"}]},{"id":"recmFmDRJO7Oh6Vwa","name":"刻石取拓─故宮碑帖特展","notes":"刻石取拓─故宮碑帖特展\n\n　　書法是寫字的藝術，日本稱為｢書道｣，韓國稱為｢書藝｣。在使用漢字的東亞文化圈，是一項特別受到重視的文人技藝。學習書法，常用碑帖作為範本，碑帖是碑和帖的合稱。碑指石刻的拓本，帖為摹刻古人墨蹟佳作於木或石上所彙集成的法帖。以墨拓法將銘刻的文字轉印至紙上，可以複製多份，化身千百，廣為流傳。\n\n　　碑帖拓本作為一個古老的收藏類別，一般多以墨拓為主，俗稱「黑老虎」。因為拓本歷經翻刻，真假難辨，往往暗藏危機。「黑」字除指拓本的顏色外，並暗示著情況幽微難辨；收藏者若不仔細辨別，容易受到蒙蔽，重傷荷包，故稱「老虎」，使得碑帖研究更增添了幾分探案的刺激。\n\n　　由於書法載體主要是脆弱的紙絹材質，當真蹟不存時，拓本幾乎等同真蹟。例如書聖王羲之（303－361）被譽為天下第一行書的〈蘭亭序〉，據傳原作已隨唐太宗（598－649）埋葬昭陵，所幸有摹本刻石流傳，本次特選蘭亭序版本中最為著名的定武本為主要展件，首次南下展出。\n\n　　本院所藏碑帖拓本，除遷臺攜來者，有許多來自各界捐贈與陸續購藏，其中也有韓、日碑帖。常見的黑底白字拓本以外，尚有減地陽刻的白紙黑字拓，以及以硃砂朱墨製作的朱拓本。此外，也利用南院展廳挑高的優勢，特別展陳高達三公尺的特大拓件，以呈現大幅碑帖的氣勢。\n \n1.　千古蘭亭\n東晉穆帝永和9年（353）三月三日，王羲之寫下被譽為天下第一行書的〈蘭亭序〉，據說原作已隨唐太宗埋入昭陵。原蹟雖已失傳，卻有眾多臨摹本與拓本流傳於世。目前以北京故宮唐馮承素摹神龍本、本院藏元陸繼善雙鉤本為公認最能體現蘭亭真跡的鉤摹墨蹟本，刻帖則以定武蘭亭為最善本。雙鉤填墨費時費工，一次只能複製一件。摹刻上石的定武蘭亭，則可傳拓多份，造福更多習書之人，影響最巨。\n \n2.　東亞同珍\n在東亞的漢字文化圈，書法名蹟的藝術性往往突破國界藩籬，舉世同珍。如日本江戶時期第八代水戶侯德川齊修（1797-1829）命松平賴救（1756-1830）、大儒立原翠軒（1744－1823）等刻製的《垂裕閣法帖》中，即收有東漢、魏、南北朝至明歷代名家法書多種。清光緒初年出土於吉林，高句麗第19代國王談德（374 - 413）的墓碑〈高句麗好大王碑〉，也以似隸似楷，沉著古厚的書風，備受中國、日本、朝鮮、韓國等國矚目與肯定。\n \n3.　掌中巨碑\n雄偉的石碑往往高過丈餘，被稱為「整拓本」的完整拓片太過巨大，難以置於案頭臨帖習字。為了取用方便，往往按照整拓本的碑文順序，逐行剪條，且分頁裱貼，裝訂為冊，化整為零的剪裝本便應運而生。講究的剪裝本會盡量保留原碑的特色，除了依照原刻的文字順序外，跳行空格、損泐之字均不能剪棄，甚至每頁抬頭、年月、落款，以及首尾附題小跋的位置，均儘量剪裱，以供觀覽時參照比對。\n \n4. 　朱墨交輝\n俗稱「黑老虎」的碑帖拓本，除了常見的黑底白字，也有如罕見的〈北魏始平公造像題記〉，因為原碑減地陽刻，讓拓本呈現版畫般的視覺感受。為求變化以硃砂代替黑墨拓製而成的朱拓也很常見，甚至石青、石綠、銀色、金色等都可以用來當成製作拓片的顏料。此外，墨分五色，即使是黑底白字的拓本，由於拓製時用墨的乾濕濃淡不同，也會有濃如烏金，或薄如蟬翼等各具特色的效果趣味。","place":"南故宮","kind":"故宮資料","url":"https://south.npm.gov.tw/ExhibitionsDetailC003110.aspx?Cond=44394d27-cc5d-42cf-bffa-a967969d4275&appname=Exhibition3112&State=0","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblxLI1C9aGrnwkQO/viwUkxHNy76VYfi6D/recmFmDRJO7Oh6Vwa","attachments":["刻石取拓展海報_官網.jpg","【刻石取拓—故宮碑帖特展】0916更新.pdf"],"links":[]},{"id":"recsf0csUCTtAaQmo","name":"皇帝的多寶格","notes":"","place":"南故宮","kind":"故宮資料","url":"https://south.npm.gov.tw/ExhibitionsDetailC003110.aspx?Cond=0807dff4-cf87-4ad7-89b4-681292600119&appname=Exhibition3112&State=0","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblxLI1C9aGrnwkQO/viwUkxHNy76VYfi6D/recsf0csUCTtAaQmo","attachments":["Screenshot_20211207084608.jpg","皇帝的多寶格__展件清單(1).pdf"],"links":[]},{"id":"recvHVHd15oKNRVqP","name":"書畫典藏資料檢索系統","notes":"","place":"未標示","kind":"故宮資料","url":"https://painting.npm.gov.tw/","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblxLI1C9aGrnwkQO/viwUkxHNy76VYfi6D/recvHVHd15oKNRVqP","attachments":["Screenshot_20211207-113628.png"],"links":[]},{"id":"recXGghfs5yEcGrPU","name":"佛陀形影—院藏亞洲佛教藝術之美","notes":"常設展覽/ 佛教藝術展廳\n\n佛教起源於印度，是構成亞洲文化的重要成分。自西元前六世紀釋迦牟尼創教以來，至十二世紀末回教徒大舉入侵為止，歷經一千七百餘年的發展。在佛教發展的過程中，教理與時俱進，宗教內容不斷充實，思想體系也愈趨完備，隨著各個王朝統治階級的護持推廣、僧侶不斷弘揚、以及商旅往來等，印度佛教信仰日益擴大，影響及於中亞、中國、西藏、蒙古、斯里蘭卡、東南亞等地。東北亞因與中國往來頻繁，佛教也順勢傳到了朝鮮半島與日本。如今，佛教已在亞洲各地綻放出豐富多元的文化花朵。\n \n\n亞洲各地的佛教造像或經典雖然都以解決眾生痛苦，傳達成就佛果等宗教訊息，但各地的文化沃土有別，在當地養分的滋潤下，發展出許多「同源異流」的地方特色，造就出千變萬化的佛、菩薩、天王、護法等形象，與各式不同的寫經方式與裝裱形制，使得亞洲佛教藝術顯得異彩紛呈、璀璨奪目。\n \n\n本展覽分為「誕生的喜悅」、「佛陀的智慧」、「菩薩的慈悲」、「經藏的流轉」和「密教的神奇」五單元，以時間為軸，將各地的佛教造像與經典等並列，呈現佛教藝術的「不變」與「變」。引領觀眾欣賞同一時期、不同地區的佛教藝術之美，以及其深邃的宗教哲理。\n \n\n第一單元\n\n誕生的喜悅\n\n傳說中，迦毗羅衛國太子悉達多從其母摩耶夫人的右脇而生，繼而腳踏七步，步步生蓮，指天指地，宣告：「天上天下，唯我為尊，三界皆苦，吾當安之。」其後便有龍王吐出香水為太子洗浴。這則傳奇故事中的悉達多太子，就是後來的佛教創始者釋迦牟尼，而也因此通稱佛誕日為「浴佛節」。直至今天，每逢農曆四月初八的佛誕日，許多佛寺仍舉辦「浴佛」的宗教儀式。現存許多一手指天、一手指地的誕生佛像或與「浴佛節」的儀式有關。\n \n\n第二單元\n\n佛陀的智慧\n\n深具智慧的釋迦牟尼佛悟得解脫之道，祂是早期佛教所獨尊的宗教導師，但是主張「眾生皆有佛性」的大乘佛教，卻認為在不同的時空中，還有許多佛的存在，如彌勒佛、無量壽佛、藥師佛等。亞洲各地的佛像，或受印度影響，或從中國汲取養分，隨著各地佛教文化的日趨成熟，發展出獨特的藝術風格，並反映在各類佛陀的圖像中，形成不同的地方與民族特色。\n \n\n第三單元\n\n菩薩的慈悲\n\n「利他精神」是大乘佛教的精髓，發願度化眾生的菩薩就是大乘佛教最佳的代表。菩薩種類眾多，其中，以即將在未來世成佛的彌勒菩薩和大慈大悲的觀音菩薩尤受信眾推崇，造像數量可觀，流傳時間最長、分佈地區也最廣。同時，在佛教傳播的過程中，菩薩的信仰和圖像也與各地文化緊密結合，發展出與印度截然不同的菩薩圖像，例如中國的送子觀音、大理國的易長觀音等。\n\n第四單元\n\n經藏的流轉\n\n釋迦牟尼所說的教法最初以口語傳承，釋迦牟尼本人也認為教法應以當地的語言來傳授。進入文本時代，主要先是梵文、巴利文，後隨著佛教在各地的傳播，而有漢文、藏文、西夏文、蒙文、滿文、緬甸文等各種版本的佛典。經典以多種文字並存遂成為佛教文化的一大特徵。 本單元選展院藏各類佛典。以文字而論，包含前述漢文、藏文、滿文、西夏文等；技法含刻印、寫繪與織繡等；年代則橫跨10世紀後半至20世紀初。\n\n第五單元\n\n密教的神奇\n\n密教即「秘密佛教」，為佛教在印度發展的最後階段。此時為與印度教抗衡，佛教在以唯識哲學為基礎的本尊觀想法中，吸收了印度傳統的咒語、設壇（曼荼羅）、火供等儀式，並出現了大量多面多臂、忿怒相與女性尊等尊像。密續（Tantra，密教典籍）依據成立年代以及內容，一般可分為「事續」、「行續」、「瑜伽續」、「無上瑜伽續」四類，而無上瑜伽又可分為「父續」與「母續」。在中國唐代和日本的密教，以行續與瑜伽續為主，而西藏的密教，則以無上瑜伽為特色。密教美術的內容豐富，風貌多元。\n\n分類：故宮\n細節：佛陀形影—院藏亞洲佛教藝術之美","place":"關聯南故宮舊展覽","kind":"關聯展覽品","url":"","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblHLFrUcZrx3G1bd/recXGghfs5yEcGrPU","attachments":["Screenshot_20210424110305.jpg","1619245507114_1450186498583373154.jpg"],"links":[{"id":"recW7stqlCuUEnKHh","name":"佛陀形影—院藏亞洲佛教藝術之美"}]},{"id":"recNSgqt0trUgsKEG","name":"唐風宋韻 中國茶文化","notes":"中國飲茶文化淵遠流長，西元七世紀飲茶習慣已遍及全國。唐人烹茶，先將茶葉輾成粉末，投入茶鍑中煎煮，再分酌於茶碗飲用。茶碗以越窯青瓷及邢窯白瓷最為普遍，通稱「冰瓷雪碗」。\n宋人改將茶末置於茶盞，以茶瓶注湯點啜，故稱「點茶」。宋人也愛鬥茶，將茶湯打出茶沫湯花，為利觀察多用黑釉茶盞，一般則用青、白釉色茶碗。\n\n分類：故宮\n細節：東亞茶文化展\n再細分：中國茶文化—唐風宋韻","place":"關聯南故宮舊展覽","kind":"關聯展覽品","url":"","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblHLFrUcZrx3G1bd/recNSgqt0trUgsKEG","attachments":[],"links":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}]},{"id":"recycQKTn07wKV6ST","name":"東亞茶文化展","notes":"品茶，是生活，是時尚，是藝術，也是文化。\n茶的原鄉在中國，自古發展迄今，已由原初的解渴藥飲、煎煮點啜，到今日的沖泡慢品。隨著製茶方式的改變，茶器形式與品茗方法也隨之變化。漢地飲茶習俗，通過使臣與貿易的傳播，融入蒙藏人民的生活，發展出游牧民族的飲茶方式與器皿。\n唐宋時期，茶文化透過遣唐使、留學僧及商賈自中國傳入日本，並融入當地的文化精神與行茶禮儀，發展成一套嚴謹的日式茶道。明末，福建僧侶又將閩式飲茶法及宜興茶器帶入，結合日本文人清談的飲茶方法，形成「煎茶道」。\n明末清初，飲茶習慣也跟隨中國東南沿海移民的足跡傳到臺灣，延續閩粵地區「工夫茶」的飲茶傳統，發展至今已將喝茶氛圍推至藝術領域。\n展覽依前述脈絡分為「中國茶文化」、「日本茶文化」、「蒙藏奶茶」、「臺灣工夫茶」等四單元，展出院藏茶文化相關文物，並藉由明代茶寮、日本茶室、蒙藏奶茶區及現代茶席等情境空間展示，營造出不同的飲茶氛圍，呈現各區域特有的品茗文化與多元性。\n\n分類：故宮\n細節：東亞茶文化展","place":"關聯南故宮舊展覽","kind":"關聯展覽品","url":"","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblHLFrUcZrx3G1bd/recycQKTn07wKV6ST","attachments":["Screenshot_20210424095944.jpg"],"links":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}]},{"id":"rec656Xu1zv6Uyzxf","name":"明人雅集 中國茶文化","notes":"明人喫茶方式，是將茶葉直接投壺沖泡，再轉注茶鍾飲用，奠定了今日的泡飲方式。茶壺與茶鍾成為主要茶器。茶杯以「潔白如玉，可試茶色」的白瓷為尚，青花瓷茶器也頗流行。茶器除了既有的陶瓷製品外，明晚期宜興紫砂及朱泥茶壺的使用亦蔚為風尚。\n\n分類：故宮\n細節：東亞茶文化展\n再細分：中國茶文化—明人雅集","place":"關聯南故宮舊展覽","kind":"關聯展覽品","url":"","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblHLFrUcZrx3G1bd/rec656Xu1zv6Uyzxf","attachments":[],"links":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}]},{"id":"recvGTeHMDw6JH5dy","name":"清代品茗 中國茶文化","notes":"清代與明代的飲茶習尚大致相同，康熙、雍正、乾隆三朝是清宮茶器製造的盛世。例如，康熙朝西洋傳教士引進的琺瑯彩技法，隨即應用於茶器生產；景德鎮官窯生產繁榮，研發多樣的品類與裝飾技法，舉凡胎釉的精緻、材質的多樣性、茶器的造型、色釉及裝飾技法上都達到極高水平。\n\n分類：故宮\n細節：東亞茶文化展\n再細分：中國茶文化—清代品茗","place":"關聯南故宮舊展覽","kind":"關聯展覽品","url":"","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblHLFrUcZrx3G1bd/recvGTeHMDw6JH5dy","attachments":[],"links":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}]},{"id":"rec2x0nEfDMkZnTda","name":"蒙藏奶茶","notes":"清室入主中原仍保留飲用奶茶的習慣，為了接待蒙古貴族與西藏高僧，筵宴飲用奶茶，因此留下了豐富的奶茶器皿。蒙古地區常以濃郁茶汁加入酥油、鹽，並倒入牛奶或羊奶煮沸，攪拌後即成奶茶。藏族則將茶汁與酥油、鹽等佐料，放入長筒狀的多穆壺中不斷舂搗、拌勻，完成酥油茶。本單元特選精美的院藏奶茶器，藉以呈現清代茶文化的多元面貌。\n\n分類：故宮\n細節：東亞茶文化展\n再細分：蒙藏奶茶","place":"關聯南故宮舊展覽","kind":"關聯展覽品","url":"","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblHLFrUcZrx3G1bd/rec2x0nEfDMkZnTda","attachments":[],"links":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}]},{"id":"reczOxwVy8RIbvJDZ","name":"和敬清寂 日本茶文化","notes":"西元八世紀中葉，中國飲茶文化隨著遣唐使及僧人初傳日本。十二世紀末榮西禪師（1141-1215）從南宋帶回禪院喫茶法，掀起日本飲茶風氣。十五世紀，室町幕府將軍足利義政（1436-1490）融合武士、貴族、禪僧等文化，在書院茶室中舉行茶會，時稱「書院茶」。其後，村田珠光（1423-1502）創立古樸簡約的茶室，主張通過修行來領悟茶道的內在精神。千利休（1522-1591）提倡「和敬清寂」的茶道精神，不再拘泥來自中國的「唐物」茶器，簡素的和式茶器應運而生。\n\n分類：故宮\n細節：東亞茶文化展\n再細分：日本茶文化—和敬清寂","place":"關聯南故宮舊展覽","kind":"關聯展覽品","url":"","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblHLFrUcZrx3G1bd/reczOxwVy8RIbvJDZ","attachments":[],"links":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}]},{"id":"recPaBHR1hgR9siL8","name":"煎茶茗讌 日本茶文化","notes":"十七世紀中葉，明朝商人赴長崎從事貿易活動、以及福建高僧隱元和尚（1592-1672）東渡日本弘法，明末飲茶方式也隨之傳至日本。十八世紀「賣茶翁」高遊外（1675-1763）以不分貴賤及禪俗交融的精神，提倡從容自在的飲茶態度，在日本文人圈迅速流傳，時稱「煎茶道」。\n\n分類：故宮\n細節：東亞茶文化展","place":"關聯南故宮舊展覽","kind":"關聯展覽品","url":"","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblHLFrUcZrx3G1bd/recPaBHR1hgR9siL8","attachments":[],"links":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}]},{"id":"recbT8RDmX4RqUWOe","name":"臺灣工夫茶","notes":"明末清初，隨著中國東南沿海移民活動，飲茶習慣亦傳至臺灣，並逐漸生根發展。臺灣早期的茶文化，承繼自閩南「工夫茶」的傳統，以潮汕四寶的潮汕烘爐、玉書煨、孟臣壺、若深杯為主要的茶器。\n據《臺灣通史》記載，嘉慶年間自福建引進武夷茶，同治時期又有英商推廣種植烏龍茶並大量外銷。二十世紀後期烏龍茶成為臺灣茶的特色，注重茶的色香味，同時也帶動飲茶風氣的興盛。七Ｏ年代後，臺灣興起「新人文茶」現代茶藝，結合現代時尚與在地文化，形成精緻多元的品茗風潮。\n\n分類：故宮\n細節：東亞茶文化展\n再細分：臺灣工夫茶","place":"關聯南故宮舊展覽","kind":"關聯展覽品","url":"","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblHLFrUcZrx3G1bd/recbT8RDmX4RqUWOe","attachments":[],"links":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}]},{"id":"reczX3ixWfSlHp8g3","name":"唐代 長沙窯 綠釉單柄壺","notes":"唐代\n\n長沙窯 綠釉單柄壺\n\n通蓋高 18‧5公分 口徑 4‧9公分 足徑 7‧4公 分\n\n東亞茶文化展\n\n壺圓口，橢圓腹，短流，長方形空心橫柄，柄中段附圓穿孔，以便串連蓋上繫孔。全器除口沿及圈足無釉外，均施綠釉。釉色青綠乳濁，釉層較厚，釉面滿佈細碎開片紋，器蓋釉色偏藍，積釉處雜呈藍斑。\n\n側把單柄壺盛行於唐代晚期，浙江越窯、湖南長沙窯等南北各窯均有燒造，石製器亦有製作 。長沙窯製作多種日常茶器如單柄壺、茶瓶、茶碗、茶末盒等多帶器銘如「荼埦」、「荼盞子」、「大茶合」、「鎮國茶瓶」， 可見飲茶風氣在湖南地區頗為盛行。\n\n單柄壺在唐晚期與短流茶瓶一樣，皆作為注湯點茶之用，其形制與與院藏驪山石單柄壺，以及及國立臺中自然科學博物館收藏的一組唐代滑石茶器中的小型單柄壺極為接近，此為唐代晚期盛行於茶盞內點茶的帶柄 茶瓶，或亦可稱之為「急須」，因單柄壺形制在宋人黃裳〈龍鳳茶寄照覺禪師〉詩中稱「急須」為東南之茶器，用以煎煮茶湯， 這類造型，由唐至今造型、胎釉雖經演變，然千餘年來仍為茶家所愛，明清時期宜興紫砂或閩粵所製白泥尤為多見。 ​\n\n\n\n分類：故宮\n細節：東亞茶文化展","place":"關聯南故宮舊展覽","kind":"關聯展覽品","url":"","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblHLFrUcZrx3G1bd/reczX3ixWfSlHp8g3","attachments":["PB1B000065N000000000PAB.jpg","PB1B000065N000000000PAG.jpg","PB1B000065N000000000PAF.jpg"],"links":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}]},{"id":"recacUqEeaDzrIWzX","name":"宋\n\n吉州窯 黑釉木葉紋茶碗\n","notes":"宋\n\n吉州窯 黑釉木葉紋茶碗\n\n高 6.8公分 口徑 11.0公分 足徑 8.2公分\n\n斗笠形茶盞，通體施黑釉，口沿鑲扣銅邊，內底一點凸起，內壁貼飾枯葉紋，葉紋褐黃、帶藍白條縷斑紋。底足無釉，胎質粗鬆，呈色灰黃，碗壁顯見拉坯遺痕，外底圈足淺遺有沾釉痕跡。釉色漆黑，釉面偶現黃色棕 眼氣孔點。 \n\n剪紙貼花黑釉碗器為江西吉州窯獨創一格的裝飾技法，常見木葉、梅花、龍鳳、或文字等貼花圖案紋。黑釉木葉碗為 其代表作，其技法先於生坯器上施含鐵質的黑褐色底釉，後將處理過、沾染含鐵較低的褐黃釉木葉貼著於黑釉之上，一次燒成，因而產生黑地枯葉饒富趣味的裝飾，啜茶時枯葉若隱若現，別具情趣。這類木葉紋現經學者研究，應為桑葉紋，與江西百丈寺的禪院茶禮流行有關，《百丈清規》〈赴茶湯〉內不少條文中均提及茶在寺院的使用方式、作用和意義，此亦與南宋江西派詩人陳與義「柏樹解說法，桑葉能通禪」的禪茶文化美學相關。 \n\n典型宋代茶托形制「形如碗帶托盤，中空，下有足。」，上方深腹碗形為茶托的托圈，壁深用以承盞，中空無底。盤 口及圈足均鑲銅扣，圈口則未加圈扣。托盤寬圓平出微有弧度，圈足略高外撇，圈口及盤口皆刻劃回紋一周為飾，釉色牙白瑩潤 ，胎質細膩。 \n\n南宋末周密《齊東野語》書內曾提及宋人舉茶是茶盞與茶托一起，足見茶托與茶盞配套使用，遼宋壁畫或茶畫上所繪茶盞與茶托，一般都是成組出現，形影不離，舉茶時可隻手扣持盤沿，隻手持盞。此於南宋周季常‧林庭珪所繪〈五百羅漢圖〉（1178-88），或1959年出土的金代山西孝義縣張家莊金墓〈磚雕仕女圖〉上皆可見及宋人持盞方式。 \n\n宋代定窯燒造數量極大，除精品上貢外，一般民間日常用器亦有生產，碗盤類最為常見，茶托存世較少，可能是宮廷訂製器皿。北宋早期還見托圈有底，如定州靜志寺塔基出土帶「官」字款茶托，形為宋制，但有底，不中空，可視為唐五代至宋 代過渡時期製品。宋代中期以後托多為中空，汝窯、官窯、景德鎮青白瓷等或漆器、金銀器皆然。黑漆茶托搭配白釉茶盞，或朱漆茶托與黑釉茶盞成套，形成黑白、或紅黑對比的時尚美感。而《齊東野語》內則提及家中有喪則不宜舉用朱色茶托。\n\n\n\n分類：故宮\n細節：東亞茶文化展","place":"關聯南故宮舊展覽","kind":"關聯展覽品","url":"","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblHLFrUcZrx3G1bd/recacUqEeaDzrIWzX","attachments":["17023766.jpg","17023762.jpg"],"links":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}]},{"id":"recWRs7WdYxydxZPE","name":"北宋\n定窯 牙白劃花回紋茶托","notes":"北宋\n定窯 牙白劃花回紋茶托\n高 5.0公分 口徑 14.5公分 底徑 3.5公分\n斗笠形茶盞，通體施黑釉，口沿鑲扣銅邊，內底一點凸起，內壁貼飾枯葉紋，葉紋褐黃、帶藍白條縷斑紋。底足無釉，胎質粗鬆，呈色灰黃，碗壁顯見拉坯遺痕，外底圈足淺遺有沾釉痕跡。釉色漆黑，釉面偶現黃色棕 眼氣孔點。 \n\n剪紙貼花黑釉碗器為江西吉州窯獨創一格的裝飾技法，常見木葉、梅花、龍鳳、或文字等貼花圖案紋。黑釉木葉碗為 其代表作，其技法先於生坯器上施含鐵質的黑褐色底釉，後將處理過、沾染含鐵較低的褐黃釉木葉貼著於黑釉之上，一次燒成，因而產生黑地枯葉饒富趣味的裝飾，啜茶時枯葉若隱若現，別具情趣。這類木葉紋現經學者研究，應為桑葉紋，與江西百丈寺的禪院茶禮流行有關，《百丈清規》〈赴茶湯〉內不少條文中均提及茶在寺院的使用方式、作用和意義，此亦與南宋江西派詩人陳與義「柏樹解說法，桑葉能通禪」的禪茶文化美學相關。 \n\n典型宋代茶托形制「形如碗帶托盤，中空，下有足。」，上方深腹碗形為茶托的托圈，壁深用以承盞，中空無底。盤 口及圈足均鑲銅扣，圈口則未加圈扣。托盤寬圓平出微有弧度，圈足略高外撇，圈口及盤口皆刻劃回紋一周為飾，釉色牙白瑩潤 ，胎質細膩。 \n\n南宋末周密《齊東野語》書內曾提及宋人舉茶是茶盞與茶托一起，足見茶托與茶盞配套使用，遼宋壁畫或茶畫上所繪茶盞與茶托，一般都是成組出現，形影不離，舉茶時可隻手扣持盤沿，隻手持盞。此於南宋周季常‧林庭珪所繪〈五百羅漢圖〉（1178-88），或1959年出土的金代山西孝義縣張家莊金墓〈磚雕仕女圖〉上皆可見及宋人持盞方式。 \n\n宋代定窯燒造數量極大，除精品上貢外，一般民間日常用器亦有生產，碗盤類最為常見，茶托存世較少，可能是宮廷訂製器皿。北宋早期還見托圈有底，如定州靜志寺塔基出土帶「官」字款茶托，形為宋制，但有底，不中空，可視為唐五代至宋 代過渡時期製品。宋代中期以後托多為中空，汝窯、官窯、景德鎮青白瓷等或漆器、金銀器皆然。黑漆茶托搭配白釉茶盞，或朱漆茶托與黑釉茶盞成套，形成黑白、或紅黑對比的時尚美感。而《齊東野語》內則提及家中有喪則不宜舉用朱色茶托。\n\n分類：故宮\n細節：東亞茶文化展","place":"關聯南故宮舊展覽","kind":"關聯展覽品","url":"","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblHLFrUcZrx3G1bd/recWRs7WdYxydxZPE","attachments":["Screenshot_20210424101505.jpg"],"links":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}]},{"id":"rec2nUp1jO7DZwlJX","name":"明 宣德\n青花轉枝海棠紋茶葉罐","notes":"明 宣德\n青花轉枝海棠紋茶葉罐\n口呈斂圓內折，鼓腹，圈足外撇，帶蓮苞紐蓋。罐腹周壁繪轉枝海棠花紋，上下則各飾仰覆蓮瓣紋一周，撇足上畫五瓣花八朵。蓋面為逐次擴大的三階傘狀形，內層最小留白，中為蓮瓣紋，蓋沿為轉枝海棠花。蓋內附圈沿一周，牆沿略高可使罐蓋不易滑落。底平呈三階式，外層足底露胎，潔白細膩。青花濃豔，多帶褐綠結晶疵斑，白釉微泛青色，釉面多有使用擦痕。\n這類蓋罐作何器用，明代文獻並無記載，至於清代則常見與其他茶器擺設一起，北京故宮博物院所藏描繪〈乾隆皇帝雪景行樂圖〉中，乾隆皇帝的侍僕們正在忙以雪水烹煎三清茶的茶器當中，即見著與本器類似的茶罐置於其中，顯示這類蓋內帶高圈沿的蓋罐，可與蓋身貼合，不易滑動，亦可密封免於受潮，或多作儲藏茶葉使用，與故瓷005954相同，蓋內沿均有較深圈壁，多數的明清錫茶葉罐蓋亦復相同作法。\n\n分類：故宮\n細節：東亞茶文化展","place":"關聯南故宮舊展覽","kind":"關聯展覽品","url":"","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblHLFrUcZrx3G1bd/rec2nUp1jO7DZwlJX","attachments":["Screenshot_20210424101431.jpg"],"links":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}]},{"id":"rec3rKwYmcHuKiJNT","name":"明\n宣德 寶石紅茶鍾","notes":"明\n宣德 寶石紅茶鍾\n附凸緣玉璧茶托 （新石器時代龍山文化晚期至商代）\n高 5.2公分 口徑 10.2公分 足徑 4.3公分；璧高 1.4公分 口徑 6.8公分 緣徑 11.3公分\n典型撇口茶鍾造型，全器除足底外均施紅釉，釉色鮮紅，橘皮紋棕眼明顯，口足均露白邊一道，近底足處，白釉泛青。胎骨略厚，細白堅緻。外底白地上淺刻「大明宣德年製」六字二行楷款，外加雙圈。宣德寶石紅釉為世所稱，明代王世懋《窺天外乘》中即提及宣德窯：「以鮮紅為寶」。 \n寶石紅茶鍾口徑十公分左右，與所謂的明初洪武茶鍾，以及後來《江西省大志》上所載嘉靖白瓷暗龍紋茶鍾大小、形制相近，顯見茶鍾樣式自明初開始宮廷已規格化，宣德寶石紅茶鍾至於清代仍為乾隆皇帝喜愛，因此特別為其選配新石器時代的栗黃 凸緣玉璧作為茶托，凸緣壁上刻有乾隆34年(己丑‧1769)御製詩〈詠古玉椀托子〉：「圓如璧有足承之，置器何愁覆餗為。土浸 久成栗蒸色，石攻後異草垂時。不辭一旦絮城出，似恨當年玉椀離。淨几原堪作珍玩，曾經誰玩亦堪思。」。乾隆茶器的混搭風格與今日好茶人士一樣，援以古物今搭，創意配套。\n\n分類：故宮\n細節：東亞茶文化展","place":"關聯南故宮舊展覽","kind":"關聯展覽品","url":"","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblHLFrUcZrx3G1bd/rec3rKwYmcHuKiJNT","attachments":["Screenshot_20210424101406.jpg"],"links":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}]},{"id":"rec5GD7tvUOu9S0Bd","name":"清 康熙\n青花山水人物六方茶葉罐","notes":"清 康熙\n青花山水人物六方茶葉罐\n高17.1公分 口徑3.7公分 足徑3.7公分\n罐呈六方形，直口，斜肩，直壁，矮圈足，口足亦為六方形，帶平頂六方蓋。蓋面青花繪一蟠螭，蓋壁飾六字三種不同書體的「壽」字，加飾青線三道。罐肩滿畫靈芝如意紋，罐腹則飾山水人物畫，雲松下二老者，一抬頭持杖遙指飛翔而來的仙鶴，另一老者及一揹罐童子亦仰面迎望飛鶴，罐腹上下各飾回紋一周，足邊則為轉枝葉紋一周。胎質細膩，釉色鮮麗、濃淡層次分明，為典型康熙「墨分五色」青花釉色。底青花書「大清康熙年製」六字二行楷款。\n\n分類：故宮\n細節：東亞茶文化展","place":"關聯南故宮舊展覽","kind":"關聯展覽品","url":"","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblHLFrUcZrx3G1bd/rec5GD7tvUOu9S0Bd","attachments":["Screenshot_20210424101328.jpg"],"links":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}]},{"id":"reckaQBxaOuhaVNjv","name":"清 乾隆六年\n洋彩番蓮紋紅地茶壺","notes":"清 乾隆六年\n洋彩番蓮紋紅地茶壺\n高 16.5公分 口徑 5.5公分 足徑 5.7公分\n直圓口，短頸，橢圓腹，底微斂，長曲流，弓形把，把內側上方一通氣孔，矮圈足微撇，帶圓紐拱形蓋，紐側及蓋內各有一相連通氣孔。器內及底全施湖綠釉，器外除頸、圈足外，通體於紫紅地上錐刻卷草紋，餘隙彩繪洋蓮四朵，頸飾螭龍二對，肩為如意紋一周，底邊蕉葉紋一周，圈足則飾黃地花卉圖案紋一周。蓋紐塗金，圍繞蓮瓣紋一周，蓋面畫轉枝花葉紋四朵。胎薄透光，壺底藍料書「乾隆年製」四字二行篆款，外加雙方框。茶鍾口微敞，深直壁，矮圈足，內底微凸。器內白釉無紋，外壁紫紅地上錐劃卷草紋，其上加飾彩繪番蓮花三朵。胎骨略重，底青花書「大清乾隆年製」六字三行篆款。這類直弧，深壁，口徑九公分左右的碗器，形制常於宮廷繪畫中出現，作為啜茗茶鍾。 此為清宮檔案中乾隆六年、七年製作的「乾隆款洋彩錦花紅地茶鍾」，另還有相同技法、敞口、口徑較大約十二公分的「乾隆款洋彩錦上添花紅地茶碗」。 \n\n此類紫紅地錐刻洋彩器，剔、畫工精密，不僅器內外滿施彩釉，壺蓋內及底部，甚至圈足、蓋圈足底部也全施金彩。雖然紋飾繁褥，但見錐、畫工序之講究。茶壺與與茶鍾紋飾極為接近，惟茶壺款識為料款；茶鍾則為六字青花篆款。\n\n分類：故宮\n細節：東亞茶文化展","place":"關聯南故宮舊展覽","kind":"關聯展覽品","url":"","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblHLFrUcZrx3G1bd/reckaQBxaOuhaVNjv","attachments":["Screenshot_20210424101257.jpg"],"links":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}]},{"id":"recwX3s7axHPUp3in","name":"清 乾隆七年\n洋彩錦上添花紅地茶鍾一對","notes":"清 乾隆七年\n洋彩錦上添花紅地茶鍾一對\n高 5.5公分 口徑 9.2公分 足徑 3.9公分/一只\n直圓口，短頸，橢圓腹，底微斂，長曲流，弓形把，把內側上方一通氣孔，矮圈足微撇，帶圓紐拱形蓋，紐側及蓋內各有一相連通氣孔。器內及底全施湖綠釉，器外除頸、圈足外，通體於紫紅地上錐刻卷草紋，餘隙彩繪洋蓮四朵，頸飾螭龍二對，肩為如意紋一周，底邊蕉葉紋一周，圈足則飾黃地花卉圖案紋一周。蓋紐塗金，圍繞蓮瓣紋一周，蓋面畫轉枝花葉紋四朵。胎薄透光，壺底藍料書「乾隆年製」四字二行篆款，外加雙方框。茶鍾口微敞，深直壁，矮圈足，內底微凸。器內白釉無紋，外壁紫紅地上錐劃卷草紋，其上加飾彩繪番蓮花三朵。胎骨略重，底青花書「大清乾隆年製」六字三行篆款。這類直弧，深壁，口徑九公分左右的碗器，形制常於宮廷繪畫中出現，作為啜茗茶鍾。 此為清宮檔案中乾隆六年、七年製作的「乾隆款洋彩錦花紅地茶鍾」，另還有相同技法、敞口、口徑較大約十二公分的「乾隆款洋彩錦上添花紅地茶碗」。 \n\n此類紫紅地錐刻洋彩器，剔、畫工精密，不僅器內外滿施彩釉，壺蓋內及底部，甚至圈足、蓋圈足底部也全施金彩。雖然紋飾繁褥，但見錐、畫工序之講究。茶壺與與茶鍾紋飾極為接近，惟茶壺款識為料款；茶鍾則為六字青花篆款。\n\n分類：故宮\n細節：東亞茶文化展","place":"關聯南故宮舊展覽","kind":"關聯展覽品","url":"","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblHLFrUcZrx3G1bd/recwX3s7axHPUp3in","attachments":["Screenshot_20210424101225.jpg"],"links":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}]},{"id":"rechZAUIXpHnSVKyC","name":"清 乾隆\n瓷仿拉古里木紋茶碗及多穆壺","notes":"清 乾隆\n瓷仿拉古里木紋茶碗及多穆壺\n茶碗（高4.6公分 口徑13.6公分 底徑9.1公分）；穆壺（高46.5公分 口徑9.0公分 底徑13.5公分 通寬25.0公分）\n奶茶碗與多穆壺均為景德鎮御窯廠以瓷仿古拉里木紋理製作而成。多穆壺是滿蒙藏民族共通使用的奶茶用具。《西藏志》中有所謂「拉庫爾」木，拉庫爾亦稱拉古里木，木色黃褐，帶不規則紋理，傳說具解百毒、避邪功效，因此清宮非常珍重以拉庫爾木作成的木奶茶碗及多穆壺。除以珍貴木材製作之外，亦令景德鎮御窯廠仿製具西藏風格的茶具，形制、木頭紋理，維妙維肖。\n\n藏人熬製穌油茶多使用木筒形多穆壺，多穆為藏語，讀音為「Mdog-mo 董莫或多穆」，即奶茶壺之意。這件瓷製多穆壺口沿呈僧帽狀，帶拱形蓋上塑獅鈕頂，圓直筒身，器身上飾四道凸稜，夔龍把，鳳首流，全器除僧帽沿、四凸稜、及獅鈕施金彩外，器內外均掛仿木紋黃褐釉。\n\n奶茶碗寬口外撇，矮壁闊足，全器與多穆壺同，均施仿木紋黃褐釉。清宮在雍正七（1729）年已見檔案有「花梨木磁桶」的製作，由院藏雍正仿木紋花盆，模仿之逼真寫實，令人難辨真假。乾隆二十八（1763）年《活計檔》亦見載景德鎮御窯場為熱河行宮燒造「仿拉古里茶碗」的記事。寬口淺壁類似墩碗的奶茶碗，清宮自康熙朝以來時有製作，有金銀、玉、木質、匏製、象牙、宜興紫砂、及各種釉彩等，本院所藏康熙、雍正朝銅胎或瓷胎畫琺瑯尤為多見。\n\n分類：故宮\n細節：東亞茶文化展","place":"關聯南故宮舊展覽","kind":"關聯展覽品","url":"","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblHLFrUcZrx3G1bd/rechZAUIXpHnSVKyC","attachments":["Screenshot_20210424101152.jpg"],"links":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}]},{"id":"rec1dTGohjbSpJG2a","name":"清末民初\n「是禮」款紅磚茶擔","notes":"「是禮」款紅磚茶擔\n清末民初\n「是禮」款紅磚茶擔\n長38.4 寬17.1 高55.4 公分\n長方形紅磚胎茶擔為潮汕工夫茶特有造型，潮汕稱為「茶擔」，是放置各式茶器的櫃式茶棚，磚胎低溫燒成。這類形制茶擔雖有大小之分，但分格置器內容大同小異。器一般分 上中下三段，據茶學者考證，（註）上段右上放置茶爐，有三開口，上口為大圓孔以便納爐，前為八方扇形風口，背後則留一小 半圓形散熱口，因置風爐，故佔有上中段；上段左邊僅留上方的海棠形孔洞，以容海棠形茶葉罐，其下中段左面為方形大開口，可置茶壺、茶杯等茶器；下段整面於右面開口呈一斜放的花瓶瓶體，其上則為磚體刻印瓶口及插飾牡丹花一枝，上實下空巧妙地 形成瓶花裝飾，此格盛放爐炭，作用與炭籠相同，格後方亦有一小半圓孔洞，或亦作散氣之用。茶擔兩側亦分三段，下段各有一扇形開孔，以供手抬提放；茶擔背面除前述上下各留兩小半圓形開孔外，面平而無裝飾。 \n\n全器紋飾分佈於正面及兩側，正面正中門楣上方刻有「是禮」二字，點出茶擔的使用意涵；左上雕飾人物騎獸圖，通風口下方為太極八卦圖，下段為前述之瓶花裝飾，四周及邊框則圍飾回文、錦紋及朵花紋等。茶擔兩側上方各飾蓮花，中段一飾 蓮托寶瓶，一飾蓮繫雙筆，紋飾或為道教雜寶紋，與正面太極八卦紋相互呼應。 \n\n清末民國潮州文士翁輝東（1885-1965）在其著書內曾談及〈工夫茶〉有茶壺、蓋甌、茶杯等十八項茶器，其中最後 一項就是茶擔，可見茶擔盛行於潮汕地區。 \n\n分類：故宮\n細節：東亞茶文化展","place":"關聯南故宮舊展覽","kind":"關聯展覽品","url":"","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblHLFrUcZrx3G1bd/rec1dTGohjbSpJG2a","attachments":["Screenshot_20210424101120.jpg"],"links":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}]},{"id":"recrFocO4fWmHbzxM","name":"清末民初\n工夫茶器一組","notes":"清末民初\n工夫茶器一組\n白泥風爐（高21.6公分 口徑14.0公分 底徑12.8公分）\n​白泥風爐（高21.6公分 口徑14.0公分 底徑12.8公分）；白泥單柄壺（高7.5公分 口徑6.8公分 底徑8.0公分）；宜興窯朱泥壺（寬9.8公分 高9.8公分 口徑3.7公分 足徑3.4公分）；青花花卉紋茶杯一組四件（高3.0 公分 口徑5.0公分 足徑2.5公分）；青花萊菔紋茶盤（高3.8公分 口徑16.8公分 底徑13.0公分）\n\n整組為後配茶器：包含白泥風爐、白泥側把燒水壺、朱泥茶壺、青花花卉紋四小茶杯及青花茶池（亦稱茶船）等共五項茶器。此為清代以來閩粵地區常見的基本工夫茶器組合，清中葉閩粵工夫茶普遍使用所謂「潮汕四寶」茶器，亦稱「烏龍茶四寶」或「四寶茶器」 ，四寶為潮汕風爐、玉書煨、孟臣壺、若深杯等四種茶器。前兩器為燒煮湯水用器，後二器則為泡飲茶器。\n白泥風爐與單柄側把燒水壺乃潮汕工夫茶器中的特有造型，不僅流行於閩粵，亦外銷東南亞，十九世紀初外銷至日本後，至今仍是日本煎茶道最為普遍使用的茶器。兩器為近代作品，白泥玉書煨燒水壺胎薄，側把內中空，把下印「昌平」、 「寶山」款識；白泥風爐通風口呈鏤空卍字形，外圍菱形花邊，其上刻「百事如意」為十八世紀以後外銷日本煎茶道具上常見造型。\n朱泥梨形小壺，彎流曲把，平底內凹，底刻「龍溪魏梓敬珍藏」二行楷款。全器胎泥細膩，器面均帶微小突起砂質顆粒，即愛壺家所謂梨皮泥壺。\n小型茶壺為閩南、潮汕一帶喜用來泡飲烏龍茶工夫茶的重要茶器，此壺應為閩南龍溪魏姓愛茶者所持。這類略高的梨形小壺又稱「思亭壺」，傳為清初陸思亭（生卒不詳）所創，長久以來也是晚清工夫茶壺中常見的造型之一。\n青花茶盤通常作為燙壺與燙杯保溫或盛杯之用，盤以青花描繪萊菔（蘿蔔菜葉）紋。四小青花茶杯，外壁畫花卉紋，口沿鑲金，底青花書「錦福堂記」，常見於清末民初外銷泰國茶器。\n\n分類：故宮\n細節：東亞茶文化展","place":"關聯南故宮舊展覽","kind":"關聯展覽品","url":"","source":"https://airtable.com/appaeYjlB3Rdg8kgz/tblHLFrUcZrx3G1bd/recrFocO4fWmHbzxM","attachments":["Screenshot_20210424101045.jpg"],"links":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}]}];

let filtered=[];function draw(){const q=$("search").value.trim().toLowerCase(),kind=$("kind").value,place=$("place").value;filtered=records.filter(r=>(!kind||r.kind===kind)&&(!place||r.place===place)&&(r.name+" "+r.notes).toLowerCase().includes(q));$("status").textContent="顯示 "+filtered.length+" / "+records.length+" 筆紀錄（故宮資料 14 筆、關聯展覽品 20 筆）";$("grid").innerHTML=filtered.map((r,i)=>'<article class="card"><span class="muted">📁 '+esc(r.kind)+'｜'+esc(r.place)+'</span><h2>'+esc(r.name)+'</h2><p>'+esc(r.notes.slice(0,110))+(r.notes.length>110?"…":"")+'</p><button type="button" data-i="'+i+'">查看完整內容 →</button></article>').join("")||'<p>找不到符合的紀錄，請試試其他條件。</p>'}
function openRecord(r){const related=r.links.filter(x=>records.some(y=>y.id===x.id));const rel=related.length?'<h3>相關展覽與展覽品</h3><div class="links">'+related.map(x=>'<a href="?record='+encodeURIComponent(x.id)+'">'+esc(x.name)+' →</a>').join("")+'</div>':"";const ext=/^https?:\/\//i.test(r.url)?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">原始連結 ↗</a>':"";$("detailBody").innerHTML='<h2>'+esc(r.name)+'</h2><p class="muted">'+esc(r.kind)+'｜'+esc(r.place)+'</p><p class="text">'+esc(r.notes||"原始紀錄未填寫說明。")+'</p><p class="muted">附件：'+(r.attachments.length?esc(r.attachments.join("、")):"原始紀錄沒有附件")+'</p>'+rel+'<div class="links"><a href="'+esc(r.source)+'" target="_blank" rel="noopener">Airtable 原始紀錄與附件 ↗</a>'+ext+'</div>';$("detail").showModal()}
$("grid").onclick=e=>{const b=e.target.closest("[data-i]");if(b)openRecord(filtered[Number(b.dataset.i)])};$("close").onclick=()=>$("detail").close();$("search").oninput=draw;$("kind").onchange=draw;$("place").onchange=draw;draw();const selected=new URLSearchParams(location.search).get("record");if(selected){const r=records.find(x=>x.id===selected);if(r)openRecord(r)}
</script><script src="../shared-nav.js" defer></script></body></html>
