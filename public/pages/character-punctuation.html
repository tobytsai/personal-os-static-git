<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>標點符號輸入法｜字・簡易啟動器</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#263f38;font:16px system-ui,sans-serif}header{background:#286c5a;color:white;padding:26px max(20px,calc((100% - 1100px)/2))}header a{color:white}h1{margin:10px 0 4px}main{max-width:1100px;margin:auto;padding:20px}.bar{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;border:1px solid #cad9d2;border-radius:9px;background:white;padding:10px}input{flex:1;min-width:200px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin:18px 0}.card{background:white;border:1px solid #dce8e0;border-radius:15px;padding:16px;text-align:left;cursor:pointer;color:inherit;min-height:120px}.card:hover{box-shadow:0 4px 15px #a8bcb655}.symbol{font-size:36px;font-weight:bold}.muted{color:#65776f;font-size:14px;margin:8px 0}.links{display:flex;flex-wrap:wrap;gap:8px}.links a{display:inline-block;background:#e5f3eb;color:#155941;padding:7px 11px;border-radius:8px;text-decoration:none}dialog{border:0;border-radius:16px;width:min(820px,94vw);max-height:85vh;padding:24px;box-shadow:0 15px 50px #0004;overflow:auto}dialog::backdrop{background:#0008}.close{float:right;cursor:pointer}.pager{display:flex;justify-content:center;gap:12px;align-items:center;margin:20px}</style></head>
<body><header><a href="character-simple.html">← 返回字・簡易啟動器</a><h1>標點符號輸入法</h1><div>依原始資料瀏覽符號與輸入指令</div></header><main><div class="bar"><input id="search" placeholder="搜尋符號、輸入指令或分類" aria-label="搜尋"><select id="category" aria-label="分類"><option value="">全部分類</option></select><select id="code" aria-label="輸入指令"><option value="">全部指令</option></select></div><div id="status" class="muted" role="status">正在載入資料…</div><div id="grid" class="grid"></div><div class="pager"><button id="prev">上一頁</button><span id="page"></span><button id="next">下一頁</button></div></main><dialog id="detail"><button class="close" id="close">關閉 ✕</button><div id="detailContent"></div></dialog><script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cards=[],filtered=[],chars=new Map(),page=0;const size=60;
function options(id,values){[...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant')).forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;$(id).append(o)})}
function refresh(){let q=$('search').value.toLowerCase().trim(),cat=$('category').value,code=$('code').value;filtered=cards.filter(r=>(!cat||r.category===cat)&&(!code||r.code===code)&&(!q||[r.symbol,r.code,r.category,r.assignee].join(' ').toLowerCase().includes(q)));page=0;draw()}
function draw(){let max=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,max-1);$('status').textContent='符合 '+filtered.length+' 筆／共 '+cards.length+' 筆';$('grid').innerHTML=filtered.slice(page*size,(page+1)*size).map((r,i)=>'<button class="card" data-i="'+i+'"><div class="symbol">'+esc(r.symbol||'□')+'</div><div>指令：'+esc(r.code||'未填寫')+'</div><div class="muted">'+esc(r.category||'未分類')+'</div></button>').join('')||'<p>找不到符合的卡片。</p>';$('page').textContent='第 '+(page+1)+' / '+max+' 頁';$('prev').disabled=page===0;$('next').disabled=page>=max-1}
function openCard(r){let matches=chars.get(r.symbol)||[];let links=matches.map(x=>'<a href="character-simple.html?record='+encodeURIComponent(x.id)+'">'+esc(x.char)+'</a>').join('');$('detailContent').innerHTML='<h2 class="symbol">'+esc(r.symbol||'未填寫符號')+'</h2><p><strong>輸入指令：</strong>'+esc(r.code||'未填寫')+'</p><p><strong>分類：</strong>'+esc(r.category||'未分類')+'</p>'+(r.assignee?'<p><strong>Assignee：</strong>'+esc(r.assignee)+'</p>':'')+'<div class="links"><a href="https://airtable.com/appf1ZIjcI2DnuQmq/tblcvUUnYMYO7zJQx/'+encodeURIComponent(r.id)+'" target="_blank" rel="noopener noreferrer">Airtable 原始資料 ↗</a></div><h3>相同字元的字卡</h3><p class="muted">依符號與「字。簡易」的字元完全相同自動對照；原始資料表未設定關聯欄位。</p><div class="links">'+(links||'目前沒有相同字元的字卡。')+'</div>';if(!$('detail').open)$('detail').showModal();history.replaceState(null,'','?card='+encodeURIComponent(r.id))}
$('grid').addEventListener('click',e=>{let b=e.target.closest('[data-i]');if(b)openCard(filtered[page*size+Number(b.dataset.i)])});$('close').onclick=()=>{$('detail').close();history.replaceState(null,'',location.pathname)};$('detail').addEventListener('cancel',()=>history.replaceState(null,'',location.pathname));['search','category','code'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',refresh));$('prev').onclick=()=>{page--;draw();window.scrollTo(0,0)};$('next').onclick=()=>{page++;draw();window.scrollTo(0,0)};
Promise.all([fetch('../data/character-simple/punctuation-cards.json').then(r=>{if(!r.ok)throw Error();return r.json()}),fetch('../data/character-simple/manifest.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(m=>Promise.all(m.files.map(f=>fetch('../data/character-simple/'+f).then(r=>{if(!r.ok)throw Error();return r.json()}))))]).then(([d,parts])=>{cards=d;parts.flat().forEach(x=>{if(x.char){let list=chars.get(x.char)||[];list.push(x);chars.set(x.char,list)}});options('category',cards.map(r=>r.category));options('code',cards.map(r=>r.code));refresh();let id=new URLSearchParams(location.search).get('card'),r=cards.find(x=>x.id===id);if(r)openCard(r)}).catch(()=>$('status').textContent='資料載入失敗，請稍後重新整理。');
</script></body></html>
