蟑螂、海、七、白蟻和香蕉\nCGI動畫，HD影片截圖，彩色有聲,2021\n15分鐘，循環播放","attachments":["Exhibition_Image_3473_20211028172559800934.jpg","Exhibition_Image_3472_2021102817245836139.jpg","Exhibition_Image_3471_20211028172349313819.jpg"],"links":[]},{"id":"recOs36fb35mmIPaI","name":"陳麗可 | Barang-Barang 複合媒材, 2021","notes":"陳麗可 | Barang-Barang 複合媒材, 2021 尺寸依展場而定 此作品由金斯頓大學多里奇博物館「Stanley Picker」藝術獎助金（2018–2021）支持創作 的圖說 陳麗可 | Barang-Barang 複合媒材,2021 尺寸依展場而定 此作品由金斯頓大學多里奇博物館「Stanley Picker」藝術獎助金（2018–2021）支持創作","attachments":["Exhibition_Image_3447_20210928163328424514.jpg"],"links":[]},{"id":"recOwWuxNRHh30HUz","name":"走向世界：臺灣新文化運動中的美術翻轉力","notes":"策展人  余思穎\n\n展覽顧問  邱函妮\n\n \n\n今年適逢臺灣文化協會（簡稱「文協」）成立百週年。為回應1920年代文協作為臺灣最重要的民族運動與思想啟蒙機構，推動「文化向上」的新文化運動、爭取臺灣民眾參政權之請願運動與追求現代化的時代趨勢，特別以本館收藏1920至40年代日治時期第一代臺灣美術家經典代表作品為主，部分向國立臺灣美術館與私人藏家商借珍貴展品，策劃「走向世界：臺灣新文化運動中的美術翻轉力」。\n\n \n\n回顧1920年代，當時日本尚未在臺灣設置任何藝術專門學校與美術館等專業機構。若要實踐藝術創作志業，多半只能赴日或留歐、參加美術競賽獲奬而受肯定，因此需具備相當經濟背景的學子才有可能。在民族自尊心的驅使下，臺灣藝術家為能爭取與日本藝術家平等的地位，期許藉由美術創作以累積臺灣的文化深度，他們付出極大的努力留學、參與日本的官展；以及1927年之後，在總督府主導下於臺灣開辦的「臺展」、「府展」；或入選法國沙龍展。不僅在美術創作上獲得社會聲譽，也開創臺灣美術輝煌的年代。\n\n \n\n第一代臺灣藝術家「走向世界」，除留學日本及歐洲學習美術，亦旅行各地，開拓視野，再反思如何描繪出臺灣風情與特色，渴望迎接時代變化，爭取平等地位，與世界藝術潮流接軌。而「翻轉力」亦呼應蔣渭水喊出的口號：「同胞須團結，團結真有力！」在日治時代，「有力」代表的是向上、亦「翻轉」居於弱勢的處境與地位；對藝術家而言，也是內在自我認同的凝聚；與外在社會地位的翻轉。展覽從「在臺日籍畫家/教育者」、「美術競賽與臺灣藝術家」、「現代性與地方特色」、「現代女性形象」、「寫真術興起」等主題介紹並展出37位日本與臺灣藝術家的作品，呈現他們在時代使命感與無比的熱情下，所創造的臺灣獨特文化形象與藝術風貌。\n\n \n\n時間\n2021/10/02 - 2021/11/28\n地點\n三樓3A","attachments":["20210902153249794424.jpg"],"links":[{"id":"recxAIKm9GINHRP9t","name":"林壽鎰 | 鄉下姑娘 英國製玻璃底片、印像紙, 1929 5.1×3.7公分"},{"id":"recPevm9vD2FG2ehR","name":"郭雪湖 | 圓山附近"},{"id":"recxalBhgg7KOHjgD","name":"鄉原古統 | 臺灣山海屏風——內太魯閣 水墨"},{"id":"recjOSREJsJb4TTPM","name":"盧雲生 | 棃子棚 膠彩、絹, 1934 207×125.5公分"},{"id":"rec7Qk7KjKFcZc9fc","name":"倪蔣懷 | 臺北李春生紀念館（裏通） 水彩、畫布, 1929 43.4×58.5公分"},{"id":"recjfmnMXc3BHlYvl","name":"陳澄波 | 夏日街景 油彩、畫布, 1927 79×98公分"},{"id":"recvY3PKpB35J1w9X","name":"顏水龍 | 盧森堡公園 油彩、畫布, 1932 65.1×80.3公分"},{"id":"rectUU16V34uNo4FB","name":"廖繼春 | 有香蕉樹的院子 油彩、畫布, 19 地進行聲音記錄，透過聲音地圖網站介面，瀏覽與聆聽這塊土地上生活環境多樣的聲音狀態，而此計畫也將於2021年12月結束斷點。將十年的聲音資料庫以切片式的時間型態階段性呈現，透過聲音-影像的試驗，讓聲音拓衍我們的感知與身體。\n\n時間\n2021/09/04 - 2021/11/28\n地點\n三樓3B","attachments":["20210830171549724399.jpg"],"links":[{"id":"recg6KrbtjUl7cxxE","name":"吳燦政 | 台灣聲音地圖計畫—網路版"}]},{"id":"reccVAuT5SEGHe7uP","name":"Stefan Kaegi / 里米尼紀錄劇團  | 聖殿 演出紀錄, 2021   © Philippe Weissbrodt 的圖說","notes":"","attachments":["Exhibition_Image_3487_20211116181811492036.jpg"],"links":[]},{"id":"reccbTQHUiTaGclmB","name":"陳瀅如 | 致幻記 III：2-19-20","notes":"陳瀅如 | 致幻記 III：2-19-20\n影片截圖,2021\n4分28分","attachments":["Exhibition_Image_3475_20211028173217052929.jpg"],"links":[]},{"id":"recdhR4PNGJbLtdl0","name":"006 陳呈毓 | 舒緩震盪 震動器，鐵架，雕塑，發泡劑，鋼筋，樹枝，羊皮，樹脂，明膠，矽膠，織品, 2021 ","notes":"陳呈毓 | 舒緩震盪 震動器，鐵架，雕塑，發泡劑，鋼筋，樹枝，羊皮，樹脂，明膠，矽膠，織品, 2021 © 陳呈毓 的圖說","attachments":["Exhibition_Image_3451_20211004161951832446.jpg","1638005568078_8883791715426938209.jpg","1638005589378_6156608086106379933.jpg","1638005601640_1537001370503049995.jpg","1638005609519_3753024183481752760.jpg","1638005629178_8081985200115750616.jpg","PXL_20211127_093447955.jpg","Screenshot_20211127-173412.png"],"links":[]},{"id":"recdwZhBa0LtFaEMP","name":"雷貝嘉．霍恩 | 鉛筆面具 16釐米影像轉DVD，彩色，有聲, 1972 ","notes":"雷貝嘉．霍恩 | 鉛筆面具 16釐米影像轉DVD，彩色，有聲, 1972 © 雷貝嘉．霍恩，作品鳴謝霍恩藝術家文獻庫。 的圖說 雷貝嘉．霍恩 | 鉛筆面具 16釐米影像轉DVD，彩色，有聲,1972 © 雷貝嘉．霍恩，作品鳴謝霍恩藝術家文獻庫。","attachments":["Exhibition_Image_3449_20211004161616783746.jpg"],"links":[]},{"id":"recg6KrbtjUl7cxxE","name":"吳燦政 | 台灣聲音地圖計畫—網路版","notes":"吳燦政 | 台灣聲音地圖計畫—網路版 聲音多媒體裝置, 2011-2021 尺寸依場地而定 的圖說 吳燦政 | 台灣聲音地圖計畫—網路版 聲音多媒體裝置,2011-2021 尺寸依場地而定","attachments":["Exhibition_Image_3424_20210813103452946798.jpg"],"links":[]},{"id":"recgTAaz7MYLZZfnZ","name":"住家小宇宙\n\n兒童藝術教育中心","notes":"住家小宇宙\n\n兒童藝術教育中心\n觀賞一幅畫的時候，你會特別注意什麼？是畫的主題、構圖、媒材，還是色彩？除此之外，畫裡可能還有聲音、有觸感、有隱約存在的氣味，以及藝術家與作品的對話。\n\n \n\n「住家小宇宙」展出本館典藏的黃薇珉作品《住宿》。從這幅畫出發，將觀看畫作的視覺經驗，連結感知，開展創作活動與想像遊戲，成為孩子可以親身經歷的旅程。\n\n \n\n《住宿》的創作，起自黃薇珉對家、對安全居所的追求，漫長創作過程也觸發藝術家對人類居所在環境裡的探討。畫面中，精細縝密的筆觸，描繪一個個安全溫暖的家。散發溫暖的同時，它們卻又彼此疏離。對身處當代社會、受困在疫情中的我們，是寫照，也像是提醒。\n\n \n\n多數時候，家是庇護之所。對孩子而言，家屋空間更像是哲學家加斯東‧巴舍拉(Gaston Bachelard)所形容，是「在世間的小角落」、「最初的宇宙」，涵納生活、情感和記憶。孩子以在家裡滋長的安全感為基礎，得以建構接觸外界的基地，也得以擁有創造和想像的起點。\n\n \n\n從《住宿》出發，「住家小宇宙」邀請你走進繪畫裡，打開感官，傾聽畫作，重新邂逅自己的家。\n\n \n\n \n\n \n\n藝術家\n\n繪畫  黃薇珉 \n\n詩     夏夏\n\n音樂  羅棋諠","attachments":["20211126150316204674.jpg","Exhibition_Image_3488_20211125115200539722.jpg","Exhibition_Image_3490_20211125164626835532.jpg","Exhibition_Image_3489_20211125164518350554.jpg","Exhibition_Image_3491_20211125164712007732.jpg","Exhibition_Image_3492_20211125164749070596.jpg"],"links":[]},{"id":"recgmNIQI9nPY0mQT","name":"010朱浩培 & 李長明 | 菩提與榕之下(局部) 過期膠卷及數位輸出, 2018","notes":"朱浩培 & 李長明 | 菩提與榕之下(局部) 過期膠卷及數位輸出, 2018 © 朱浩培，李長明 的圖說 朱浩培 & 李長明 | 菩提與榕之下(局部) 過期膠卷及數位輸出,2018 © 朱浩培，李長明","attachments":["Exhibition_Image_3431_20211004162316881020.jpg","1638006079405_8480012347013228557.jpg"],"links":[]},{"id":"recjOSREJsJb4TTPM","name":"盧雲生 | 棃子棚 膠彩、絹, 1934 207×125.5公分","notes":"盧雲生 | 棃子棚 膠彩、絹, 1934 207×125.5公分 臺北市立美術館典藏, 第8回臺展東洋畫部：特選、臺展賞 的圖說 盧雲生 | 棃子棚 膠彩、絹,1934 207×125.5公分 臺北市立美術館典藏,第8回臺展東洋畫部：特選、臺展賞","attachments":["Exhibition_Image_3434_20210831180230944642.jpg"],"links":[]},{"id":"recjfmnMXc3BHlYvl","name":"陳澄波 | 夏日街景 油彩、畫布, 1927 79×98公分","notes":"陳澄波 | 夏日街景 油彩、畫布, 1927 79×98公分 臺北市立美術館典藏, 日本第８回帝展：入選 的圖說 陳澄波 | 夏日街景 油彩、畫布,1927 79×98公分 臺北市立美術館典藏,日本第８回帝展：入選","attachments":["Exhibition_Image_3436_20210831181440311155.jpg"],"links":[]},{"id":"reckT953McvqHvIUp","name":"接近─賴志盛\n\n三樓3C 藝想迴廊","notes":"藝想迴廊位於本館大廳挑高三層樓所圍塑的開放區域。有別於館內典型的白盒子展覽場，這裡是高而潘建築師很特殊而具個性的空間規劃。觀眾在此可以往下俯瞰大廳，其開放流動的場域特性，形成獨特的建築語彙。本館於2018年重新定位這個迴廊，陸續邀請當代藝術家聚焦於此環境特性進行限地製作；期待透過建築、空間與人之間不同語言巧妙的相聚，提供觀眾沉澱、互動與交流的場所。\n\n \n\n全新年度計畫「接近」由賴志盛製作，以「接近光與風一些」的概念介入空間。他將一樓大廳視為一潭池子，女兒牆是它的池岸，池子的周圍便是三樓迴廊。他在迴廊裡製作了高低不一的平台，持續延伸繞過女兒牆，最終抵達位於挑空處的懸台，探進北美館大廳的「池子」—一個原只能觀看、無法前往的地方。他的靈感來自於鳥類在高處築巢，建造一個生存的空間；以及人們在教堂樑柱上或高牆之間建造通道，走向高空中的懸台，在那裡祈福，以得到精神慰藉。\n\n \n\n在這裡，賴志盛並未創造所謂的作品；取而代之的，是建造一條跨越的路徑，邀請觀眾或踮腳或跨越至欄杆之外觀看，在不同的位置與視角去經歷這一方美術館風景；進而對於習以為常的廊道，產生嶄新的感受。觀眾站在突出懸台上，在觀看時同時也被觀看；或碰觸到實體的天花板及女兒牆，或探進「池」內的虛空間，和從一樓直通三樓散射的光與流動的空氣對話，共同形成了作品。\n\n \n\n賴志盛在「接近」中以擅長的細膩手法進行干預性的實踐，牽引著觀眾的視線及身體越過界線、鬆動與藝想迴廊的既有關係，重新喚醒人們探索周遭環境的感知能力及身體意識，在參觀過程中得以與藝術相遇，也與自身相遇。\n\n \n\n \n \n\n學術研究：翁子健\n\n空間設計：黃子瑞\n\n結構設計：張盈智\n\n施工整合：典禾室內裝修\n地點\n三樓3C 藝想迴廊\n活動\n靠近美術館|美術節˙兒童節系列活動\n連結\n接近─賴志盛│新聞稿","attachments":["20210413171647826265.jpg"],"links":[{"id":"rec0xtl5gdkMNx1Zq","name":"的圖說"}]},{"id":"recm2gkIsgGG9FMt3","name":"床外的藍天 005","notes":"這件作品以16張行軍床組成，想像妳飛到上空，你會看到他們排列成夜空中的大犬座形象。如果靠近仔細看，你可以發現，這些色彩飽和的床鋪，質感以及絢麗的顏色是針線創造出來的。床是做夢的場所，夢對陳慧嶠來說，是一種感知的途徑，理性思考與感性直覺交會的場所。","attachments":["Screenshot_20211127-173100.png","1638005511182_2465585160433417167.jpg","1638005528325_590107403309317683.jpg"],"links":[]},{"id":"recmKY3iz2E9UTGPu","name":"感性機器：後資本主義時代的自我療癒","notes":"感性與機器看似是對立的概念，我們從對立出發來療癒自我：後資本主義時代的各個領域都面臨過度製造，資訊爆炸使得時間破碎，我們懸置主體的感受，失去自我與外界連結，甚至在危機來臨以前，就因為各種奇觀而焦慮，本展首先試圖回應這種日常化的主體危機。此外，我們的身體與機器的界線越來越模糊，這不只是工業製造以及社會規訓的結果，後資本主義時代的身體與數位環境已經演化出共生的狀態。感性與機器在幾位藝術家的作品中共存：霍恩的行為裝置以及繪畫機器仿效著人類各種感性活動，綠橘的文字詩則顯現生物基因和資訊社會中的編碼互相指涉的關係，陳呈毓的冥想機器在奇觀以及主體之間搖擺，而陳慧嶠，埃利亞松，亞康法，朱浩培與李長明的裝置作品，試圖在感性的沈浸式環境以及理性的敘事間取得平衡。在本展中，身體與機器感性之間的類比與對話，或許可以作為後疫情時代藝術與社會的互動的一註腳。透過體驗式的作品展出，我們回顧1970年代以來感性(aﬀect)從身體藝術到多媒體裝置的藝術史路徑，延展到當代人類學式的環境探究，以及劇場及宗教常民文化。這八件行為以及數位科技的創作透過各種通道探索感性，其中七件是第一次在台北展出，兩件是全新製作。\n\n \n\n觀眾主體與藝術的感性溝通經驗可以視為一種自我療癒。療癒在這裡並不是指回歸到初始，它可以是一個淨化的以及訓練感官的方式。我們將這個展覽想像成一種療癒機器的總體，在與各種媒介的溝通過程中，觀眾可以練習各種自我沈澱或釋放的儀式。\n\n \n\n \n\n藝術家\n策展人\n林瑀希\n林瑀希為獨立藝術顧問，曾於紐約尚凱利藝廊、孟買夏可喜當代藝術擔任亞洲總監，在當代藝術市場擁有豐富的經歷，2008年開始，她致力於國際藝術家作品在亞洲的推廣，如榮獲威尼斯雙年展最高榮譽金獅終身成就獎非洲迦納藝術家El Anatsui，美國藝術家James Turrell、英國藝術家Antony Gormley、YBA藝術家Julian Opie及美國藝術家Gregory Crewdson等。\nmore\n李雨潔\n  香港嶺南大學視覺研究系助理教授(研究)，曾在雪梨新南威爾斯大學，倫敦泰德美術館研究中心，及紐約現代美術館任研究職。研究興趣包括亞洲行為藝術及後殖民論述。文章見於Third Text、World Art、Australian and New Zealand Journal of Art、post: notes on art in a global context等期刊。曾與Midori Yamamura共同編輯學術專書Visual Representations of the Cold War and Postcolonial Struggles。\n時間\n2021/09/18 - 2021/12/19\n地點\n地下樓E、F展覽室\n活動\n《感性機器》展覽線上座談","attachments":["20210824150338621326.jpg","1638004930869_648415666577459666.jpg"],"links":[{"id":"recpae8IMWbftRZYZ","name":"約翰·亞康法 | 機場（影像截圖） 三頻道錄像裝置，7.1聲道, 2016 53分鐘"},{"id":"reczp6uY9PqX7VSOy","name":"綠橘 | 太初有道 壓克力箱、5000-6000蠶繭, 2020-2021 60×60×15公分"},{"id":"recdhR4PNGJbLtdl0","name":"006 陳呈毓 | 舒緩震盪 震動器，鐵架，雕塑，發泡劑，鋼筋，樹枝，羊皮，樹脂，明膠，矽膠，織品, 2021 "},{"id":"recCzcx4n0mUDuML4","name":"陳慧嶠 | 床外的藍天 混合媒材：針線，絲綿，行軍床，毛巾電繡，臉盆，鋼杯，牙膏，牙刷，肥皂盒, 2018"},{"id":"recdwZhBa0LtFaEMP","name":"雷貝嘉．霍恩 | 鉛筆面具 16釐米影像轉DVD，彩色，有聲, 1972 "},{"id":"recF0byHkgY78Bax7","name":"009奧拉弗．埃利亞松 | 指北針家族 不銹鋼、木頭、磁鐵、顏料, 2013 共三件（直徑各為61×30cm，193×50.5cm，90cm）"},{"id":"recgmNIQI9nPY0mQT","name":"010朱浩培 & 李長明 | 菩提與榕之下(局部) 過期膠卷及數位輸出, 2018"}]},{"id":"recmhljHzVlCZ38xd","name":"書寫公廠、何敏慧與何秀玲 | 3069號新地球 線上圖文小說, 2021","notes":"書寫公廠、何敏慧與何秀玲 | 3069號新地球 線上圖文小說, 2021 尺寸依場地而定 藝術家自藏 的圖說 書寫公廠、何敏慧與何秀玲 | 3069號新地球 線上圖文小說,2021 尺寸依場地而定 藝術家自藏","attachments":["Exhibition_Image_3448_20210928163537207312.jpg"],"links":[]},{"id":"reco0aJVBskpAT49v","name":"陳瀅如 | 致幻記 III：2-19-20","notes":"陳瀅如 | 致幻記 III：2-19-20\n影片截圖,2021\n4分28分","attachments":["Exhibition_Image_3466_20211025155435959274.jpg","Exhibition_Image_3465_20211025155305802696.jpg"],"links":[]},{"id":"recpae8IMWbftRZYZ","name":"約翰·亞康法 | 機場（影像截圖） 三頻道錄像裝置，7.1聲道, 2016 53分鐘","notes":"約翰·亞康法 | 機場（影像截圖） 三頻道錄像裝置，7.1聲道, 2016 53分鐘 © Smoking Dogs Films, 圖像由 Smoking Dogs Films和里森畫廊提供 的圖說 約翰·亞康法 | 機場（影像截圖） 三頻道錄像裝置，7.1聲道,2016 53分鐘 © Smoking Dogs Films,圖像由 Smoking Dogs Films和里森畫廊提供","attachments":["Exhibition_Image_3430_20210824151135594677.jpg","1638005936334_8155563509030348914.jpg"],"links":[]},{"id":"recruDyDOZpJEFbKj","name":"林之助 | 小閒 膠彩、紙, 1939 195.5×152公分","notes":"林之助 | 小閒 膠彩、紙, 1939 195.5×152公分 臺北市立美術館典藏 的圖說 林之助 | 小閒 膠彩、紙,1939 195.5×152公分 臺北市立美術館典藏","attachments":["Exhibition_Image_3440_20210831182245409141.jpg"],"links":[]},{"id":"recs70LI0c0XjTetX","name":"羅智信 | 同步水槽 水槽、龍頭、儲水桶、馬達、水管、水果、碘溶液, 2019 ","notes":"羅智信 | 同步水槽 水槽、龍頭、儲水桶、馬達、水管、水果、碘溶液, 2019 尺寸依場地而定 的圖說 羅智信 | 同步水槽 水槽、龍頭、儲水桶、馬達、水管、水果、碘溶液,2019 尺寸依場地而定","attachments":["Exhibition_Image_3428_2021081310582866257.jpg","Exhibition_Image_3427_20210813105705630957.jpg"],"links":[]},{"id":"rectHKnhu2keg7qjb","name":"像是一個夜店的小便斗—羅智信個展\n\n三樓3B","notes":"術藝家羅智信關注生產架構與模式衍生而出的認知經驗，其創作著力於多樣化傳統與非典型的媒材實驗，試圖捕捉日常生活中不穩定、虛幻甚而是妄想的時刻，進而探索物質經過轉化運用後，與身體感官的連結及其所隱含的精神性狀態。本展「像是一個夜店的小便斗」可被視為羅智信近年持續實踐此創作手法的階段性歸結。藝術家藉由大型沈浸式空間裝置，運用影像、聲響、氣味、物件等多重元素的交疊，引領觀者進入一個「壞掉的夜店」場域，在沒有明確方向與時間的遊走過程，思索人與物質交會之下可能產生的感知情境。\n\n\n \n\n時間\n\n2021/09/04 - 2021/11/28\n\n地點\n\n三樓3B","attachments":["20210813153440811673.png"],"links":[{"id":"recs70LI0c0XjTetX","name":"羅智信 | 同步水槽 水槽、龍頭、儲水桶、馬達、水管、水果、碘溶液, 2019 "}]},{"id":"rectTPo0eUvNsjIb0","name":"Cécile B. Evans | 心之所欲","notes":"Cécile B. Evans | 心之所欲\nHD影片截圖,2016\n41分5秒, 循環播放\nCourtesy the artist and Galerie Emanuel Layr","attachments":["Exhibition_Image_3459_20211025154236390634.jpg","Exhibition_Image_3460_20211025154414797912.jpg","Exhibition_Image_3461_20211025154525813915.jpg"],"links":[]},{"id":"rectUU16V34uNo4FB","name":"廖繼春 | 有香蕉樹的院子 油彩、畫布, 1928 129.2×95.8公分","notes":"廖繼春 | 有香蕉樹的院子 油彩、畫布, 1928 129.2×95.8公分 臺北市立美術館典藏, 日本第9回帝展：入選 的圖說 廖繼春 | 有香蕉樹的院子 油彩、畫布,1928 129.2×95.8公分 臺北市立美術館典藏,日本第9回帝展：入選","attachments":["Exhibition_Image_3438_2021083118181859407.jpg"],"links":[]},{"id":"recvY3PKpB35J1w9X","name":"顏水龍 | 盧森堡公園 油彩、畫布, 1932 65.1×80.3公分","notes":"顏水龍 | 盧森堡公園 油彩、畫布, 1932 65.1×80.3公分 臺北市立美術館典藏 的圖說","attachments":["Exhibition_Image_3437_20210831181631671431.jpg"],"links":[]},{"id":"recwHwMeOOkxhPLHw","name":"《陽光之嘆》004","notes":"《陽光之嘆》是霍恩較為晚期的機動裝置之⼀，他漸漸使⽤機械取代⾝體性，由於會動以及發出聲⾳，這些機器好似有了⾃⼰的⽣命，並不斷介入觀看經驗。他的機動裝置帶有醫學儀器以及治療的隱喻，而組合中的物件形象讓⼈聯想到⼈體器官以及繪畫的本質。","attachments":["Screenshot_20211127-172456.png","1638005401104_6085470571688519168.jpg"],"links":[{"id":"recmKY3iz2E9UTGPu","name":"感性機器：後資本主義時代的自我療癒"}]},{"id":"recxAIKm9GINHRP9t","name":"林壽鎰 | 鄉下姑娘 英國製玻璃底片、印像紙, 1929 5.1×3.7公分","notes":"林壽鎰 | 鄉下姑娘 英國製玻璃底片、印像紙, 1929 5.1×3.7公分 臺北市立美術館典藏 的圖說 林壽鎰 | 鄉下姑娘 英國製玻璃底片、印像紙,1929 5.1×3.7公分 臺北市立美術館典藏","attachments":["Exhibition_Image_3443_20210831182733692923.jpg"],"links":[]},{"id":"recxalBhgg7KOHjgD","name":"鄉原古統 | 臺灣山海屏風——內太魯閣 水墨","notes":"鄉原古統 | 臺灣山海屏風——內太魯閣 水墨、紙, 1935 175.3×61.6公分（12片） 臺北市立美術館典藏, 第9回臺展東洋畫部：審查員 的圖說 鄉原古統 | 臺灣山海屏風——內太魯閣 水墨、紙,1935 175.3×61.6公分（12片） 臺北市立美術館典藏,第9回臺展東洋畫部：審查員","attachments":["Exhibition_Image_3432_20210831175322533425.jpg"],"links":[]},{"id":"recz7ZXlkyPfL37pH","name":"Kate Cooper | 感染驅動程序","notes":"Kate Cooper | 感染驅動程序\n影像截圖, 聲音, 彩色,2018\n7分29秒","attachments":["Exhibition_Image_3468_20211028171632230958.jpg"],"links":[]},{"id":"reczp6uY9PqX7VSOy","name":"綠橘 | 太初有道 壓克力箱、5000-6000蠶繭, 2020-2021 60×60×15公分","notes":"綠橘 | 太初有道 壓克力箱、5000-6000蠶繭, 2020-2021 60×60×15公分 © 綠橘 的圖說 綠橘 | 太初有道 壓克力箱、5000-6000蠶繭,2020-2021 60×60×15公分 © 綠橘","attachments":["Exhibition_Image_3452_20211004162127661743.jpg","1638005767422_1752675598239754433.jpg","1638005778964_1135386475854584700.jpg","1638005797806_1400303300017686953.jpg"],"links":[]},{"id":"reczsJX7iRFYdxPU3","name":"現代驅魔師","notes":"2002年，娜塔莎·維塔·莫爾（Natasha Vita-More）在未來學家雷蒙·庫茲維爾（Ray Kurzweil）的線上論壇網站發表她設計的未來人類身體構造稱之為“普里莫後人”（Primo 3M+）。這個關於未來人類的設計概念是把我們的壽命無限延長。她宣稱通過生物科技及人工智能將提供我們的身體具備更佳的擴展性和現代風格。比如，設計客製化大腦（Metabrain）；人類的納米技術結合人工智能建構脊柱通信系統⋯⋯Primo的設計預示一個可訂製、可變的、可升級的，並且具有感官能力的未來人類原型。\n\n \n\n「何為人」？\n\n \n\n從Primo這個未來人類身體設計概念，讓我們可以預見今日技術變革的節奏越來越迅速，人類這個物種生成了一個科技-結構的範式。雷蒙‧庫茲維爾在《奇點臨近》一書中，他從生物和技術兩方面，將人類進化的歷史概念分為六個紀元；而此時此刻來到了第五紀元：“奇點”(Singularity)降臨。他指出奇點就是人類與技術結合的頂點，它將克服人類進化的局限性。\n\n \n\n漢斯．莫拉維茨更大膽預測到 2040 年，機器將達到人類的智能水平，到 2050 年，它們將超越我們。他認為智能機器將成為我們的“繼承者“：它們從我們身上成長，學習我們的技能，分享我們的目標和價值，可以被視為我們心靈的孩子。他們二位都信誓旦旦地宣告21世紀未來幾十年技術朝向機器化發展，人機文明必將超越人類的智能。\n\n \n\n不論是哲學家、科學家、未來學家都以驚人的觀點預言以人類為本的世界觀的終結。庫茲維爾和莫拉維茨都認為在機器統治世界的未來，我們的思想，我們的身體，甚至我們的大腦將被智能機器取代，在人類與機器之間已經不存在差異。\n\n \n\n從每一個面向上，「人之為人」的條件已轉了一個大彎，不再依賴哲學本體論作為人安身立命之本。關於「人類」這個概念不單純是一種知性批判或想像，這一擊，徹底擊潰上帝─人類以某種形式存在的法則。哈拉瑞（Yuval Noah Harari）提出人類面臨的三大新議題，其中，當生物醫學工程、人機工程、無機生命工程持續進展，人類將從「智人」躍升成為「神人」，形同握有上帝的權力，那麼人類的終極命運將會如何？\n\n \n\n以上諸種論點在在驗證著人文主體的崩解。或者說，此時此刻人類中心主義已陷入泥沼而無法再自圓其說。這個展覽將圍繞和貫穿在後人類所體現的一連串思想及重新思考現代人類處境。如果「科技」扮演了「驅魔師」的角色，對人類進行全面「優化」，那麼傳統意義下的「人之本質」仍會存在嗎？\n\n \n\n展覽整體來說，將建立在科技-泛靈的思潮底下，令人聯想起後人類主義中心思想不斷升級之下的影響，包括科技人造物的“第二生命”形態、虛擬身體、高速演算法下資訊化經濟體系網絡，以及人與物和其他物種之間的鏈結等，產生一種多重感知的錯覺。陳瀅如、Kate Cooper、Cécile B. Evans、 Sidsel Meineche Hansen、Pakui Hardware、黃博志、Stefan Kaegi / Rimini Protokoll、劉家銘、吳書原+耿寧和驅魔師集會製作委員會將共同演繹跨學科美學的新派點。\n \n\n \n\n \n\n時間\n2021/11/27 - 2022/03/06\n地點\n一樓1A~1B","attachments":["2021110109425689252.jpg"],"links":[{"id":"reccVAuT5SEGHe7uP","name":"Stefan Kaegi / 里米尼紀錄劇團  | 聖殿 演出紀錄, 2021   © Philippe Weissbrodt 的圖說"},{"id":"recTzwq4932VgqqIX","name":"Pakui Hardware  | 下腹 裝置"},{"id":"recG5nJ9qA71FGwFo","name":"劉家銘 | 通靈板"},{"id":"recMvJq9jX86s71fB","name":"黃博志 | 椅子、砂紙、蟑螂、海、七、白蟻和香蕉"},{"id":"recXImwU4qikfBd7c","name":"Kate Cooper | 症狀機器"},{"id":"recz7ZXlkyPfL37pH","name":"Kate Cooper | 感染驅動程序"},{"id":"recZpWwpWk0TAgNPk","name":"Kate Cooper | 人為操縱"},{"id":"reccbTQHUiTaGclmB","name":"陳瀅如 | 致幻記 III：2-19-20"},{"id":"reco0aJVBskpAT49v","name":"陳瀅如 | 致幻記 III：2-19-20"},{"id":"recFmeXJabVA5khsd","name":"Sidsel Meineche Hansen | 3D迪克女孩(X級)"},{"id":"rectTPo0eUvNsjIb0","name":"Cécile B. Evans | 心之所欲"}]}];

function draw(){const q=$("search").value.trim().toLowerCase();filtered=records.filter(r=>(r.name+" "+r.notes).toLowerCase().includes(q));$("status").textContent="顯示 "+filtered.length+" / "+records.length+" 筆紀錄";$("grid").innerHTML=filtered.map((r,i)=>'<article class="card"><span class="muted">📁 舊展覽紀錄</span><h2>'+esc(r.name)+'</h2><p>'+esc(r.notes.slice(0,110))+(r.notes.length>110?"…":"")+'</p><button type="button" data-i="'+i+'">查看完整內容 →</button></article>').join("")||'<p>找不到符合的紀錄，請嘗試其他關鍵字。</p>'}
function openRecord(r){const related=[...r.links,...records.filter(x=>x.links.some(y=>y.id===r.id)).map(x=>({id:x.id,name:x.name}))];const unique=related.filter((x,i)=>related.findIndex(y=>y.id===x.id)===i);const rel=unique.length?'<h3>相關紀錄</h3><div class="links">'+unique.map(x=>'<a href="?record='+encodeURIComponent(x.id)+'">'+esc(x.name)+' →</a>').join("")+'</div>':"";$("detailBody").innerHTML='<h2>'+esc(r.name)+'</h2><p class="text">'+esc(r.notes||"原始紀錄未填寫說明。")+'</p><p class="muted">附件：'+(r.attachments.length?esc(r.attachments.join("、")):"原始紀錄沒有附件")+'</p>'+rel+'<div class="links"><a href="'+base+encodeURIComponent(r.id)+'" target="_blank" rel="noopener">Airtable 原始紀錄與附件 ↗</a></div>';$("detail").showModal()}
