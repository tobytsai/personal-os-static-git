const cards=[["01","常見單位換算","單位與測量","長度、面積、體積、重量和時間的常用換算。","1 公里＝1,000 公尺；1 公尺＝100 公分；1 公頃＝10,000 平方公尺；1 公升＝1,000 毫升；1 公斤＝1,000 公克；1 小時＝60 分鐘。原圖另有人民幣單位，屬不同地區的貨幣制度。","1v4PZ98K"],["02","常用數量關係","應用問題","每份數、倍數、速率、單價和四則運算的關係。","總數＝每份數 × 份數；距離＝速度 × 時間；總價＝單價 × 數量。除法換算時，除數不能為 0。","h1TeE2Ef"],["03","圖形公式：方形、長方形與三角形","圖形與幾何","正方形、長方形、正方體、長方體及三角形。","長方形面積＝長 × 寬；三角形面積＝底 × 高 ÷ 2；長方體體積＝長 × 寬 × 高；正方體表面積＝邊長² × 6。","Tpn5LfBv"],["04","圖形公式：平行四邊形、圓與立體","圖形與幾何","平行四邊形、梯形、圓形、圓柱與圓錐。","平行四邊形面積＝底 × 高；梯形面積＝（上底＋下底）× 高 ÷ 2；圓面積＝π × 半徑²；圓柱體積＝底面積 × 高；圓錐體積＝底面積 × 高 ÷ 3。","cwCbYLbQ"],["05","平均數、和差倍與行程問題","應用問題","平均數、和差問題、倍數、相遇、追及與流水。","平均數＝總和 ÷ 個數；和倍問題：小數＝總和 ÷（倍數＋1）。原圖的和倍公式誤寫為減 1，此處已更正。","i4Uc7HxV"],["06","濃度、利潤與盈虧問題","應用問題","濃度、利潤率、利息及盈虧的數量關係。","濃度＝溶質重量 ÷ 溶液重量；溶液重量＝溶質＋溶劑；利潤＝售價－成本。原圖利息稅率是特定情境示例，不應直接套用現行規定。","CEwu4VJw"],["07","植樹問題與間隔","應用問題","直線與環形路線的樹數與間隔數。","等距且兩端都種時，樹數＝間隔數＋1；一端種時，樹數＝間隔數；環形均勻種植時，樹數＝間隔數。","TQYJ8xGy"],["08","常用數值、平方與分數小數","數與運算","圓周率近似值、常見乘積、平方數與分數小數互換。","例如 25 × 4＝100；12²＝144；1/4＝0.25。原圖部分數值有筆誤，請以本卡經核對的例子為準。","IFsyPQiW"],["09","立方數、自然數與位值","數與運算","立方數、自然數、十進位與數位概念。","2³＝8，3³＝27；十進位中相鄰位值相差 10 倍。整數包含負整數、零與正整數；原圖定義未涵蓋負整數。","aVwwKKIp"],["10","整除、因數與倍數","因數與倍數","整除概念以及 2、3、5、9 的整除判斷。","例如 35 ÷ 7＝5，所以 7 是 35 的因數；各位數字和能被 3 整除，原數也能被 3 整除。","PohchQGW"],["11","奇偶數、質數與合數","因數與倍數","4、8、25 的整除判斷，以及奇偶數、質數和合數。","偶數可被 2 整除；大於 1 的整數若恰有兩個正因數，就是質數。1 既不是質數，也不是合數。","TAdfuzBE"],["12","質因數、公因數與互質","因數與倍數","質因數分解、最大公因數與互質。","12＝2² × 3；12 與 18 的公因數有 1、2、3、6，最大公因數為 6。兩正整數的最大公因數是 1，稱為互質。","mcGjlLQg"],["13","公倍數與小數的意義","因數與倍數","公倍數、最小公倍數及小數位值。","2 和 3 的公倍數有 6、12、18……，最小公倍數為 6；0.1 是十分之一，0.01 是百分之一。","xYXt5bzQ"],["14","小數的位值與種類","分數與小數","整數部分、小數部分、有限小數與循環小數。","小數點右邊依序是十分位、百分位、千分位。0.25 是有限小數；0.333… 是循環小數。","mxfoPTSi"],["15","循環小數與分數","分數與小數","循環節，以及分子、分母與分數單位。","0.545454… 的循環節是 54。把一個整體平均分成 4 份，其中 3 份可表示為 3/4；3 是分子，4 是分母。","tbMq593W"]];let active="全部",query="";const filters=document.getElementById("filters"),grid=document.getElementById("grid"),count=document.getElementById("count");const categories=["全部",...new Set(cards.map(c=>c[2]))];const esc=s=>String(s).replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));

document.getElementById("search").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render()});render();
