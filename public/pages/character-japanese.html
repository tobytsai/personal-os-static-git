<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>日文輸入法｜字・簡易啟動器</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#263f38;font:16px system-ui,sans-serif}header{background:#286c5a;color:white;padding:26px max(20px,calc((100% - 1100px)/2))}header a{color:white}h1{margin:10px 0 4px}main{max-width:1100px;margin:auto;padding:20px}.bar{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;border:1px solid #cad9d2;border-radius:9px;background:white;padding:10px}input{flex:1;min-width:200px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:18px 0}.card{background:white;border:1px solid #dce8e0;border-radius:15px;padding:16px;text-align:left;cursor:pointer;color:inherit;min-height:120px}.card:hover{box-shadow:0 4px 15px #a8bcb655}.title{font-size:25px;font-weight:bold}.muted{color:#65776f;font-size:14px;margin:8px 0}.chars{display:flex;flex-wrap:wrap;gap:8px}.chars a,.links a{display:inline-block;background:#e5f3eb;color:#155941;padding:7px 11px;border-radius:8px;text-decoration:none}.chars a{font-size:22px;min-width:48px;text-align:center}dialog{border:0;border-radius:16px;width:min(820px,94vw);max-height:85vh;padding:24px;box-shadow:0 15px 50px #0004}dialog::backdrop{background:#0008}.close{float:right;cursor:pointer}.links{display:flex;gap:8px;flex-wrap:wrap}#status{margin-top:15px}.notes{white-space:pre-wrap}</style></head><body><header><a href="character-simple.html">← 返回字・簡易啟動器</a><h1>日文輸入法</h1><div>瀏覽平假名、片假名與簡易碼</div></header><main><div class="bar"><input id="search" placeholder="搜尋假名、拼音、注音或簡易碼" aria-label="搜尋"><select id="category" aria-label="分類"><option value="">全部分類</option></select><select id="group" aria-label="段別"><option value="">全部段別</option></select></div><div id="status" class="muted">正在載入資料…</div><div id="grid" class="grid"></div><div class="bar"><button id="prev">上一頁</button><span id="page"></span><button id="next">下一頁</button></div></main><dialog id="detail"><button class="close" id="close">關閉 ✕</button><div id="detailContent"></div></dialog><script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data=[],filtered=[];
function draw(){let q=$('search').value.trim().toLowerCase(),cat=$('category').value,group=$('group').value;filtered=data.filter(r=>(!cat||r.category===cat)&&(!group||r.group===group)&&(!q||[r.name,r.roman,r.code,r.bopomofo,r.category,r.group,r.notes].join(' ').toLowerCase().includes(q)));$('status').textContent='符合 '+filtered.length+' 筆／共 '+data.length+' 筆';$('grid').innerHTML=filtered.map((r,i)=>'<button class="card" data-i="'+i+'"><div class="title">'+esc(r.name||'未命名')+'</div><p>'+esc(r.roman)+'</p><div class="muted">'+esc([r.category,r.group].filter(Boolean).join(' · '))+'</div><div>簡易碼 '+esc(r.code||'未填寫')+'</div></button>').join('')||'<p>找不到符合的卡片。</p>';$('prev').hidden=true;$('next').hidden=true}
function openCard(r){let audio='';try{let u=new URL(r.audio);if(u.protocol==='https:'&&u.hostname==='upload.wikimedia.org')audio=u.href}catch{}let source='';try{let u=new URL(r.audioSource);if(u.protocol==='https:'&&u.hostname==='commons.wikimedia.org')source=u.href}catch{}let symbolLinks=(r.symbols||[]).map(s=>'<a href="character-bopomofo.html?card='+encodeURIComponent(s.id)+'">'+esc(s.name)+'</a>').join('');let fields=[['拼音',r.roman],['注音',r.bopomofo],['簡易碼',r.code],['假名分類',r.category],['段別',r.group],['備註',r.notes]].filter(x=>x[1]).map(([k,v])=>'<p><strong>'+esc(k)+'：</strong>'+esc(v)+'</p>').join('');$('detailContent').innerHTML='<h2>'+esc(r.name||'未命名')+'</h2>'+fields+(audio?'<h3>日語發音</h3><audio controls preload="none" src="'+esc(audio)+'">您的瀏覽器不支援音訊播放。</audio><p class="muted">錄音：'+esc(r.audioCredit)+'（公共領域）</p><div class="links"><a href="'+esc(audio)+'" target="_blank" rel="noopener noreferrer">開啟音檔 ↗</a>'+(source?'<a href="'+esc(source)+'" target="_blank" rel="noopener noreferrer">音檔來源 ↗</a>':'')+'</div>':'')+'<h3>相關注音符號</h3><p class="muted">依原注音欄位拆分；點選符號可查看關聯讀音和字。</p><div class="links">'+(symbolLinks||'尚無關聯')+'</div><div class="links"><a href="character-simple.html">開啟字・簡易啟動器</a><a href="https://airtable.com/appf1ZIjcI2DnuQmq/tblmwQvnMZupRNPru/'+encodeURIComponent(r.id)+'" target="_blank" rel="noopener noreferrer">Airtable 原始資料 ↗</a></div>';if(!$('detail').open)$('detail').showModal();history.replaceState(null,'','?card='+encodeURIComponent(r.id))}
$('grid').addEventListener('click',e=>{let b=e.target.closest('[data-i]');if(b)openCard(filtered[Number(b.dataset.i)])});$('close').onclick=()=>{$('detail').close();history.replaceState(null,'',location.pathname)};$('detail').addEventListener('cancel',()=>history.replaceState(null,'',location.pathname));$('search').addEventListener('input',draw);$('category').addEventListener('change',draw);$('group').addEventListener('change',draw);
fetch('../data/character-simple/japanese-cards.json?v=audio20261101').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{data=d.sort((a,b)=>a.name.localeCompare(b.name,'ja'));for(let [id,key] of [['category','category'],['group','group']])[...new Set(data.map(x=>x[key]).filter(Boolean))].sort().forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;$(id).append(o)});draw();let id=new URLSearchParams(location.search).get('card'),r=data.find(x=>x.id===id);if(r)openCard(r)}).catch(()=>$('status').textContent='資料載入失敗，請稍後重新整理。');
</script></body></html>
