<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>自然科學博物館探索｜場館學習</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#273f42;background:#f0f8f4}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#e9f7ef,#f7fbfc 65%,#fcf5e7)}header{padding:26px max(18px,calc((100% - 1120px)/2));background:linear-gradient(120deg,#266857,#278b88,#738e64);color:white}header a{color:white}h1{font-size:clamp(28px,6vw,42px);margin:12px 0 5px}header p{line-height:1.6}main{max-width:1120px;margin:auto;padding:20px}.panel{background:white;border:1px solid #dcebe2;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 6px 20px #264f3710}.notice{background:#fff9e9;border-color:#f1dfae;color:#705d35;line-height:1.65}.bar{display:flex;gap:9px;flex-wrap:wrap}input,select,button{font:inherit;padding:10px 12px;border:1px solid #cdded6;border-radius:10px;background:#fff}input{flex:1;min-width:190px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{cursor:pointer;border-radius:999px;color:#317166;background:#eff9f4}.chip[aria-pressed="true"]{background:#277f72;color:white}.muted{font-size:14px;color:#687e78;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:14px}.card{background:white;border:1px solid #dcebe2;border-radius:18px;overflow:hidden;box-shadow:0 6px 18px #264f3712}.cover{width:100%;height:145px;background:linear-gradient(120deg,#d8eee4,#e9f4f0);display:grid;place-items:center;font-size:40px}.cover img{width:100%;height:100%;object-fit:cover}.body{padding:14px}.body h2{font-size:17px;margin:8px 0}.tag{display:inline-block;border-radius:999px;padding:4px 9px;background:#e5f4eb;color:#2d7664;font-size:13px;margin:0 4px 4px 0}.body p{color:#637a75;font-size:14px;line-height:1.6}.body button{background:#e8f6ef;color:#216d5b;font-weight:700;cursor:pointer}.empty{padding:20px;color:#617b70}dialog{border:0;border-radius:18px;width:min(700px,94vw);max-height:88vh;padding:22px;box-shadow:0 16px 55px #112d2444}dialog::backdrop{background:#102d2599}.close{float:right;cursor:pointer}.text{white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{padding:9px 12px;border-radius:9px;background:#e7f5ee;color:#256c5d;text-decoration:none;font-weight:700}@media(max-width:600px){main{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.body{padding:11px}.body h2{font-size:15px}.cover{height:110px}select{width:100%}}
</style></head><body><header><a href="self-study-venues.html">← 返回場館學習</a>　<a href="self-study.html">自學啟動器</a><h1>🦖 自然科學博物館探索</h1><p>從展覽紀錄與收藏資料，探索生命、地球與人類文化</p></header><main>
<section class="panel notice"><strong>歷史資料提醒</strong><br>以下來自 Airtable 的既有紀錄，多數建立於 2021 年。特展可能已結束，常設展位置與內容也可能調整；出發前請以科博館官方展覽資訊為準。</section>
<section class="panel"><div class="links"><a href="https://www.nmns.edu.tw/" target="_blank" rel="noopener">科博館官網 ↗</a><a href="https://airtable.com/appaeYjlB3Rdg8kgz/tbljUDkVadJJNdg7c/viwwJfQAeqm1D2PsO" target="_blank" rel="noopener">Airtable Grid view ↗</a></div><p class="muted">卡片依原資料的展覽類別與位置整理；未填寫的欄位保留為未分類或未標示。資料為建立時的快照。</p></section>
<section class="panel"><div class="bar"><input id="search" type="search" placeholder="搜尋展覽、主題或說明" aria-label="搜尋展覽"><select id="category" aria-label="展覽類別"><option value="">全部展覽類別</option></select><select id="place" aria-label="位置"><option value="">全部位置</option></select></div><div id="chips" class="chips" role="group" aria-label="展覽類別快速選擇"></div><p class="muted" id="status" role="status">正在載入資料…</p></section><div class="grid" id="grid"></div></main>
<dialog id="detail"><button class="close" id="close">關閉 ✕</button><div id="detailBody"></div></dialog>
<script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let cards=[],filtered=[];
function options(id,values){let el=$(id),counts=new Map();values.forEach(x=>counts.set(x,(counts.get(x)||0)+1));for(let [v,n] of [...counts].sort((a,b)=>a[0].localeCompare(b[0],'zh-Hant',{numeric:true}))){let o=document.createElement('option');o.value=v;o.textContent=v+'（'+n+'）';el.append(o)}}
function drawChips(){const sel=$('category'),host=$('chips');host.replaceChildren();for(const o of sel.options){let b=document.createElement('button');b.type='button';b.className='chip';b.textContent=o.textContent;b.setAttribute('aria-pressed',String(o.value===sel.value));b.onclick=()=>{sel.value=o.value;refresh()};host.append(b)}}
function refresh(){let q=$('search').value.trim().toLowerCase(),cat=$('category').value,place=$('place').value;filtered=cards.filter(c=>(!cat||c.category===cat)&&(!place||c.place===place)&&(!q||[c.name,c.notes,c.category,c.place,c.date].join(' ').toLowerCase().includes(q)));$('status').textContent='顯示 '+filtered.length+' / '+cards.length+' 筆紀錄';drawChips();$('grid').innerHTML=filtered.map((c,i)=>'<article class="card"><div class="cover">'+(c.hasImage?'<img loading="lazy" src="../assets/natural-museum/'+esc(c.id)+'.webp" alt="" onerror="this.style.display=\'none\'">':'🦖')+'</div><div class="body"><span class="tag">'+esc(c.category)+'</span><span class="tag">'+esc(c.place)+'</span><h2>'+esc(c.name)+'</h2>'+(c.date?'<p>'+esc(c.date)+'</p>':'')+'<p>📁 舊資料｜展況請查官網</p><button type="button" data-i="'+i+'">查看紀錄 →</button></div></article>').join('')||'<p class="empty">沒有符合的紀錄，請試試其他條件。</p>'}
function openCard(c){let url='https://airtable.com/appaeYjlB3Rdg8kgz/tbljUDkVadJJNdg7c/viwwJfQAeqm1D2PsO/'+c.id;$('detailBody').innerHTML='<h2>'+esc(c.name)+'</h2><p class="muted">'+esc(c.category)+' · '+esc(c.place)+(c.date?' · '+esc(c.date):'')+'</p><p class="text">'+esc(c.notes||'原始紀錄未填寫說明。')+'</p><p class="muted">原始紀錄可能是過去展覽，現場展況請查詢官網。</p><div class="links"><a href="'+url+'" target="_blank" rel="noopener">Airtable 原始紀錄與附件 ↗</a><a href="https://www.nmns.edu.tw/" target="_blank" rel="noopener">科博館官網 ↗</a></div>';$('detail').showModal()}
$('grid').onclick=e=>{let b=e.target.closest('[data-i]');if(b)openCard(filtered[Number(b.dataset.i)])};$('close').onclick=()=>$('detail').close();$('search').oninput=refresh;$('category').onchange=refresh;$('place').onchange=refresh;
fetch('../data/self-study-natural-museum/cards.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{cards=data;options('category',cards.map(x=>x.category));options('place',cards.map(x=>x.place));refresh()}).catch(()=>$('status').textContent='資料載入失敗，請稍後重新整理。');
</script><script src="../shared-nav.js" defer></script></body></html>
