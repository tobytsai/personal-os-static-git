<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7055ee">
<meta name="description" content="把常用 AI 服務整理在一起，快速搜尋並開啟。">
<title>AI 啟動器｜Personal OS</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
*{box-sizing:border-box}
:root{--ink:#26233a;--muted:#77758a;--paper:#fff;--line:#eeebf5;--purple:#7256ee;--pink:#ff7298;--yellow:#ffd74f}
body{margin:0;background:#f7f5ff;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
button,input{font:inherit}
.page{width:min(1120px,100%);margin:auto;padding:24px 24px 52px}
.back{display:inline-flex;align-items:center;gap:8px;margin:0 0 18px;padding:9px 14px;color:#5145a1;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:999px;font-weight:700;box-shadow:0 5px 16px #4032770b}
.hero{position:relative;overflow:hidden;padding:clamp(25px,5vw,54px);border-radius:34px;background:linear-gradient(125deg,#7457f0 0%,#9268f2 54%,#c06ee8 100%);color:#fff;box-shadow:0 18px 45px #7354d52c}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero:before{width:270px;height:270px;right:-55px;top:-145px;background:#ffffff20}
.hero:after{width:190px;height:190px;right:16%;bottom:-140px;background:#ffda5c44}
.hero-inner{position:relative;z-index:1;max-width:740px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid #ffffff55;border-radius:999px;background:#ffffff1c;font-size:13px;font-weight:700}
h1{margin:16px 0 7px;font-size:clamp(38px,7vw,64px);line-height:1.08;letter-spacing:.01em}
.lede{margin:0;color:#f3efff;font-size:clamp(15px,2.3vw,19px);line-height:1.65}
.hero-bottom{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:23px}
.stat{padding:9px 13px;border-radius:13px;background:#ffffff22;border:1px solid #ffffff39;font-size:13px}
.sparkle{position:absolute;right:9%;top:23%;font-size:clamp(48px,10vw,100px);opacity:.26;transform:rotate(12deg)}
.controls{margin:24px 0 17px;padding:15px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 26px #4d3b810b}
.search-wrap{position:relative}
.search-wrap:before{content:"⌕";position:absolute;top:8px;left:15px;font-size:25px;color:#89839e}
.search{display:block;width:100%;height:48px;padding:0 16px 0 47px;border:1px solid #e9e5f2;border-radius:15px;background:#fbfaff;outline:none;color:var(--ink)}
.search:focus{border-color:#9a87ff;box-shadow:0 0 0 4px #8a73ff20}
.filters{display:flex;gap:8px;overflow:auto;padding:13px 0 1px;scrollbar-width:thin}
.filter{flex:0 0 auto;border:1px solid #e9e5f2;background:#fff;color:#514e61;border-radius:999px;padding:8px 13px;cursor:pointer;font-size:13px;font-weight:700;transition:.16s}
.filter:hover{transform:translateY(-1px);border-color:#b7aaff}
.filter.active{background:#26233a;border-color:#26233a;color:#fff}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:22px 2px 13px}
.section-head h2{margin:0;font-size:21px}
.count{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{--tone:#7457f0;position:relative;display:flex;flex-direction:column;min-height:192px;padding:17px 18px 16px;overflow:hidden;border:1px solid #eeeaf5;border-radius:23px;background:#fff;color:var(--ink);text-decoration:none;box-shadow:0 7px 20px #32254d0b;transition:transform .18s,box-shadow .18s,border-color .18s}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--tone)}
.card:after{content:"";position:absolute;width:105px;height:105px;right:-44px;bottom:-47px;border-radius:50%;background:var(--tint,#f0ecff);transition:transform .2s}
.card:hover{transform:translateY(-4px);border-color:#ded7f2;box-shadow:0 15px 30px #32254d16}
.card:hover:after{transform:scale(1.25)}
.card-top,.card-title,.description,.open-label{position:relative;z-index:1}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{width:49px;height:49px;display:grid;place-items:center;border-radius:16px;background:var(--tint,#f0ecff);color:var(--tone);font-size:22px;font-weight:850;letter-spacing:-.04em}
.category{padding:6px 9px;background:var(--tint,#f0ecff);color:var(--tone);border-radius:999px;font-size:11px;font-weight:750;white-space:nowrap}
.card-title{margin:17px 0 5px;font-size:20px;line-height:1.2}
.description{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.open-label{margin-top:auto;padding-top:14px;color:var(--tone);font-size:12px;font-weight:800}
.open-label span{display:inline-block;transition:transform .16s}
.card:hover .open-label span{transform:translate(3px,-2px)}
.empty{grid-column:1/-1;padding:32px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #d9d3e8;border-radius:20px}
footer{text-align:center;color:#858197;font-size:12px;padding:25px 10px 0}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.page{padding:16px 16px 38px}}
@media(max-width:520px){.page{padding:12px 12px 32px}.hero{padding:27px 21px;border-radius:26px}.hero:before{right:-120px}.sparkle{right:7%;top:14%;font-size:52px}.controls{padding:12px;margin-top:16px;border-radius:18px}.grid{gap:10px}.card{min-height:170px;padding:14px 13px;border-radius:19px}.logo{width:42px;height:42px;border-radius:14px;font-size:19px}.category{padding:5px 7px;font-size:10px}.card-title{font-size:17px;margin-top:14px}.description{font-size:12px}.section-head h2{font-size:19px}}
@media(max-width:360px){.grid{grid-template-columns:1fr}.card{min-height:155px}}
</style>
</head>
<body>
<main class="page">
<a class="back" href="../">← <span>返回首頁</span></a>
<header class="hero">
<div class="hero-inner">
<span class="eyebrow">✦ Toby 的 AI 工具箱</span>
<h1>AI 啟動器</h1>
<p class="lede">聊天、搜尋、寫作、創作，一個入口快速開啟常用 AI 服務。</p>
<div class="hero-bottom"><span class="stat">✨ 精選 AI 工具</span><span class="stat" id="heroCount">13 個入口</span><span class="stat">🔎 可搜尋與分類</span></div>
</div><div class="sparkle" aria-hidden="true">✦</div>
</header>
<section class="controls" aria-label="搜尋與分類">
<div class="search-wrap"><input class="search" id="search" type="search" placeholder="搜尋服務，例如 ChatGPT、寫作、研究…" autocomplete="off" aria-label="搜尋 AI 服務"></div>
<nav class="filters" id="filters" aria-label="服務分類"></nav>
</section>
<div class="section-head"><h2>挑選一個服務</h2><span class="count" id="count" aria-live="polite"></span></div>
<section class="grid" id="grid" aria-label="AI 服務"></section>
<footer>選擇卡片即可在新分頁開啟服務</footer>
</main>
<script>
const services=[
{name:"Claude",url:"https://claude.ai/",mark:"✳",category:"聊天助理",tone:"#c76a42",tint:"#fff0e8",description:"與 Claude 對話、整理資料並協助寫作。",keywords:"對話 寫作 摘要"},
{name:"ChatGPT",url:"https://chatgpt.com/",mark:"✳",category:"聊天助理",tone:"#119b7b",tint:"#e3f7f0",description:"對話、構思、學習與多種日常 AI 任務。",keywords:"對話 學習 寫作"},
{name:"Poe",url:"https://poe.com/",mark:"▣",category:"聊天助理",tone:"#8051cf",tint:"#f0e9ff",description:"在同一處體驗多種 AI 助理與聊天機器人。",keywords:"對話 模型"},
{name:"Gemini",url:"https://gemini.google.com/",mark:"✦",category:"聊天助理",tone:"#5865db",tint:"#e9edff",description:"Google AI 助理，支援對話、構思與探索。",keywords:"對話 Google"},
{name:"Microsoft Copilot",url:"https://copilot.microsoft.com/",mark:"◈",category:"聊天助理",tone:"#4169d8",tint:"#e9efff",description:"Microsoft 的 AI 助理，支援問答與內容創作。",keywords:"對話 Microsoft"},
{name:"Perplexity",url:"https://www.perplexity.ai/",mark:"P",category:"搜尋研究",tone:"#178e96",tint:"#e3f7f7",description:"以來源連結輔助搜尋、探索與研究問題。",keywords:"搜尋 研究 引用"},
{name:"Kimi",url:"https://www.kimi.com/",mark:"☼",category:"搜尋研究",tone:"#e48a38",tint:"#fff2df",description:"探索資訊、閱讀內容並與 AI 助理互動。",keywords:"搜尋 閱讀"},
{name:"Google AI Studio",url:"https://aistudio.google.com/",mark:"✦",category:"開發工具",tone:"#5368d9",tint:"#e9edff",description:"試用 Gemini 模型並建立 AI 原型。",keywords:"Google Gemini 開發"},
{name:"ProductScope",url:"https://app.productscope.ai/",mark:"▰",category:"行銷創作",tone:"#3359a6",tint:"#e9efff",description:"用 AI 協助電商產品研究與行銷內容。",keywords:"電商 行銷 商品"},
{name:"Marky",url:"https://www.mymarky.ai/",mark:"⌁",category:"行銷創作",tone:"#c45f91",tint:"#ffedf5",description:"協助規劃與製作社群媒體內容。",keywords:"社群 行銷 內容"},
{name:"Kua.ai",url:"https://kua.ai/",mark:"K",category:"行銷創作",tone:"#8053cd",tint:"#f0e9ff",description:"AI 內容與行銷工具，協助產出文章素材。",keywords:"寫作 內容 行銷"},
{name:"Katteb",url:"https://katteb.com/",mark:"K",category:"行銷創作",tone:"#2455a4",tint:"#e9efff",description:"AI 寫作工具，提供內容生成與改寫功能。",keywords:"寫作 內容"},
{name:"Booltool",url:"https://booltool.boolv.tech/",mark:"▱",category:"行銷創作",tone:"#8151dc",tint:"#f0e9ff",description:"一組 AI 內容製作與行銷輔助工具。",keywords:"圖片 影片 行銷"}
];
const categories=["全部",...new Set(services.map(s=>s.category))];
let selected="全部",query="";
const grid=document.getElementById("grid"),filters=document.getElementById("filters"),search=document.getElementById("search");
function render(){
 filters.innerHTML=categories.map(c=>'<button type="button" class="filter'+(selected===c?' active':'')+'" aria-pressed="'+(selected===c)+'" data-category="'+c+'">'+(c==="全部"?"✨ 全部":c)+'</button>').join("");
 const q=query.toLocaleLowerCase();
 const shown=services.filter(s=>(selected==="全部"||s.category===selected)&&(!q||(s.name+" "+s.description+" "+s.category+" "+s.keywords).toLocaleLowerCase().includes(q)));
 document.getElementById("count").textContent=shown.length+" 個服務";
 document.getElementById("heroCount").textContent=services.length+" 個入口";
 grid.innerHTML=shown.length?shown.map(s=>'<a class="card" href="'+s.url+'" target="_blank" rel="noopener noreferrer" style="--tone:'+s.tone+';--tint:'+s.tint+'"><div class="card-top"><span class="logo" aria-hidden="true">'+s.mark+'</span><span class="category">'+s.category+'</span></div><h3 class="card-title">'+s.name+'</h3><p class="description">'+s.description+'</p><div class="open-label">開啟服務 <span>↗</span></div></a>').join(""):'<div class="empty">沒有找到符合條件的服務，試試其他關鍵字或分類。</div>';
}
filters.addEventListener("click",e=>{const b=e.target.closest("button[data-category]");if(!b)return;selected=b.dataset.category;render()});
search.addEventListener("input",()=>{query=search.value.trim();render()});
render();
</script>
<script src="../shared-nav.js?v=20261025-2" defer></script></body>
</html>
