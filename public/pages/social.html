<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#bd875d"><meta name="description" content="把常用社群平台整理在一起，依用途分類並快速開啟。"><title>社群啟動器｜Personal OS</title><link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
*{box-sizing:border-box}:root{--ink:#263c3b;--muted:#748380;--coral:#ef775d;--gold:#ffbf24;--teal:#9bc9c4;--paper:#fffdf8}
body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:radial-gradient(ellipse at 6% 15%,#b8d8d4 0 8%,transparent 8.2%),radial-gradient(ellipse at 97% 60%,#f8d8bd 0 10%,transparent 10.2%),linear-gradient(145deg,#fff7e9,#f6ede1 55%,#e4f1ed);overflow-x:hidden}
.page{width:min(1120px,100%);margin:auto;padding:20px 22px 48px}.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:16px;padding:9px 14px;border:1px solid #fff;border-radius:999px;background:#ffffffd9;color:#365b54;text-decoration:none;font-weight:800;box-shadow:0 5px 16px #294b1b12}
.hero{position:relative;isolation:isolate;overflow:hidden;padding:clamp(26px,5vw,48px);border-radius:32px;background:linear-gradient(128deg,#b97d58,#d69a65 50%,#77bcb3);color:#fff;box-shadow:0 18px 42px #7c573a36}.hero:before,.hero:after{position:absolute;z-index:-1;content:"";border:2px solid #ffffff42;border-radius:50%}.hero:before{width:270px;height:270px;right:-55px;top:-138px}.hero:after{width:170px;height:170px;right:22%;bottom:-120px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid #ffffff5c;border-radius:999px;background:#ffffff20;font-size:12px;font-weight:850;letter-spacing:.06em}h1{display:inline-block;margin:14px 0 10px;padding:8px 20px;border-radius:11px;background:var(--gold);color:#fff;font-size:clamp(34px,7vw,56px);line-height:1.15;box-shadow:0 8px 20px #75471c38}.hero p{max-width:690px;margin:3px 0 0;color:#fffaf1;font-size:clamp(14px,2.2vw,18px);line-height:1.7}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.meta span{padding:7px 10px;border:1px solid #ffffff40;border-radius:999px;background:#ffffff20;font-size:12px;font-weight:750}
.search-wrap{position:relative;margin:20px 0 12px}.search-wrap:before{content:"⌕";position:absolute;left:15px;top:7px;color:#87938e;font-size:25px}.search{width:100%;height:50px;padding:0 16px 0 45px;border:1px solid #e7e4da;border-radius:16px;background:#fff;outline:none;color:var(--ink);box-shadow:0 8px 20px #6a6c4d12}.search:focus{border-color:#70aaa3;box-shadow:0 0 0 4px #70aaa326}
.filters{display:flex;gap:8px;overflow:auto;padding:3px 2px 9px;scrollbar-width:thin}.filter{flex:none;padding:8px 13px;border:1px solid #e8e3d9;border-radius:999px;background:#ffffffde;color:#4d625d;font:inherit;font-size:12px;font-weight:850;cursor:pointer}.filter.active{border-color:#304f4b;background:#304f4b;color:#fff}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:20px 2px 12px}.section-head h2{margin:0;font-size:21px}.count{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{--tone:#e8775e;position:relative;display:flex;min-width:0;min-height:164px;flex-direction:column;overflow:hidden;padding:17px;border:1px solid #fff;border-radius:23px;background:#fff;color:var(--ink);box-shadow:0 9px 22px #654c3714;transition:transform .18s,box-shadow .18s}.card:before{position:absolute;left:0;right:0;top:0;height:6px;background:var(--tone);content:""}.card:after{position:absolute;right:-27px;bottom:-57px;width:115px;height:115px;border-radius:50%;background:color-mix(in srgb,var(--tone) 13%,white);content:"";transition:transform .2s}.card:hover{transform:translateY(-4px);box-shadow:0 15px 30px #654c3722}.card:hover:after{transform:scale(1.18)}
.card-main{display:flex;min-width:0;align-items:center;gap:13px;color:inherit;text-decoration:none}.brand{display:grid;flex:none;width:52px;height:52px;place-items:center;border-radius:17px;background:color-mix(in srgb,var(--tone) 12%,white);color:var(--tone);font-size:24px;font-weight:950;letter-spacing:-.06em}.brand.long{font-size:17px}.platform-name{margin:0;font-size:19px;font-weight:900;overflow-wrap:anywhere}.platform-cat{margin:4px 0 0;color:var(--muted);font-size:11px;font-weight:700}.desc{position:relative;z-index:1;margin:14px 0 12px;color:#687a73;font-size:12px;line-height:1.6}.card-actions{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}.why{border:0;border-radius:999px;background:#f2f5ed;color:#48645b;padding:7px 10px;font:800 11px system-ui;cursor:pointer}.why:hover,.why:focus-visible{background:#dceee7;outline:2px solid #77bcb3;outline-offset:2px}.open{color:var(--tone);font-size:11px;font-weight:900;text-decoration:none}.open:hover{text-decoration:underline}
.empty{grid-column:1/-1;padding:28px;border:1px dashed #c7d8ce;border-radius:18px;background:#ffffffa8;color:var(--muted);text-align:center}

.quick-panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0 16px}
.shelf{min-width:0;padding:16px 18px;background:#ffffffdd;border:1px solid #fff;border-radius:20px;box-shadow:0 8px 22px #654c3710}
.shelf-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.shelf-head h2{margin:0;font-size:17px}.shelf-count{flex:none;font-size:12px;color:var(--muted);font-weight:800}
.shelf-hint{margin:-3px 0 10px;font-size:12px;color:var(--muted);line-height:1.5}
.shelf-items{display:flex;flex-wrap:wrap;gap:8px}
.shelf-link{display:inline-flex;max-width:100%;min-width:0;align-items:center;gap:7px;padding:9px 11px;border:1px solid #e6e5db;border-radius:12px;background:white;color:var(--ink);font-size:12px;font-weight:750;text-decoration:none;transition:background .15s,transform .15s}
.shelf-link:hover{background:#f1f8f1;transform:translateY(-1px)}
.shelf-icon{flex:none;font-weight:950}.shelf-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shelf-empty{margin:2px 0;color:var(--muted);font-size:12px;line-height:1.6}
.favorite-btn{position:absolute;z-index:3;top:14px;right:14px;display:grid;place-items:center;width:36px;height:36px;border:1px solid #e4e7dd;border-radius:50%;background:#fff;color:#9eaaa1;font-size:22px;cursor:pointer}
.favorite-btn.saved{background:#fff5d4;border-color:#f0d698;color:#d79b1f}
.favorite-btn:focus-visible{outline:3px solid #77bcb3;outline-offset:2px}
.card-main{padding-right:40px}
dialog{width:min(490px,calc(100% - 28px));padding:0;border:0;border-radius:24px;background:var(--paper);color:var(--ink);box-shadow:0 22px 70px #18252255}dialog::backdrop{background:#182522bb;backdrop-filter:blur(3px)}.dialog-inner{padding:22px}.dialog-top{display:flex;align-items:flex-start;gap:12px}.dialog-top .brand{width:48px;height:48px}.dialog-title{flex:1;margin:2px 0;font-size:22px}.close{flex:none;width:35px;height:35px;border:0;border-radius:50%;background:#edf2e9;color:#36534d;font-size:22px;cursor:pointer}.dialog-tag{display:inline-flex;margin:12px 0;padding:6px 10px;border-radius:999px;background:#eff5e8;color:#456552;font-size:11px;font-weight:850}.dialog-desc{margin:0 0 18px;color:#61736e;line-height:1.7;font-size:14px}.dialog-link{display:block;padding:12px;border-radius:13px;background:#294f49;color:#fff;text-align:center;text-decoration:none;font-weight:850}
footer{padding-top:26px;text-align:center;color:#7b8982;font-size:11px}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.quick-panels{grid-template-columns:1fr}}
@media(max-width:500px){.page{padding:14px 12px 35px}.hero{padding:25px 19px;border-radius:25px}.grid{grid-template-columns:1fr;gap:10px}.card{min-height:145px;padding:15px;border-radius:20px}.platform-name{font-size:18px}.section-head h2{font-size:19px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style></head>
<body><main class="page"><a class="back" href="../">← 返回首頁</a>
<header class="hero"><span class="eyebrow">💬 PERSONAL OS · SOCIAL HUB</span><br><h1>社群啟動器</h1><p>把日常互動、影音分享、即時通訊和興趣交流集中在一頁，依分類找到你要開啟的平台。</p><div class="meta"><span>🌈 6 個分類</span><span>✨ 16 個入口</span><span>🔎 可搜尋、可查看說明</span><span>⭐ 收藏・最近開啟10筆</span></div></header>
<div class="search-wrap"><input class="search" id="search" type="search" placeholder="搜尋平台、粉絲專頁或用途…" aria-label="搜尋社群平台"></div><nav class="filters" id="filters" aria-label="社群平台分類"></nav>

<div class="quick-panels" aria-label="收藏與最近開啟">
  <section class="shelf" aria-labelledby="favoriteHeading">
    <div class="shelf-head"><h2 id="favoriteHeading">⭐ 我的收藏</h2><span class="shelf-count" id="favoriteCount">0 個收藏</span></div>
    <div class="shelf-items" id="favoriteItems"></div>
  </section>
  <section class="shelf" aria-labelledby="recentHeading">
    <div class="shelf-head"><h2 id="recentHeading">🕘 最近開啟</h2><span class="shelf-count" id="recentCount">0 / 10</span></div>
    <p class="shelf-hint">自動記錄最近開啟的 10 個不同項目，最新的排最前面。</p>
    <div class="shelf-items" id="recentItems"></div>
  </section>
</div>
<div class="section-head"><h2>🎈 社群平台與收藏連結</h2><span class="count" id="count" aria-live="polite"></span></div><section class="grid" id="grid" aria-label="社群平台"></section><footer>Personal OS · 社群啟動器</footer></main>
<dialog id="infoDialog"><div class="dialog-inner"><div class="dialog-top"><span class="brand" id="dialogBrand"></span><h2 class="dialog-title" id="dialogTitle"></h2><button class="close" type="button" aria-label="關閉">×</button></div><span class="dialog-tag" id="dialogCategory"></span><p class="dialog-desc" id="dialogDescription"></p><a class="dialog-link" id="dialogLink" target="_blank" rel="noopener noreferrer">開啟連結 ↗</a></div></dialog>
<script>
const platforms=[{"name":"Facebook","url":"https://www.facebook.com/","icon":"f","cat":"Facebook","color":"#1877f2","desc":"與朋友互動、追蹤社團與粉絲專頁，也適合分享生活近況。"},{"name":"綺麗畫廊","url":"https://www.facebook.com/share/1BAJdZmbe2/","icon":"f","cat":"Facebook","color":"#1877f2","desc":"綺麗畫廊的 Facebook 分享連結，方便查看該頁面與貼文；開啟時可能需要登入 Facebook。"},{"name":"Instagram","url":"https://www.instagram.com/","icon":"◎","cat":"社群動態","color":"#d9468f","desc":"以照片、限時動態與短影音分享生活、創作和靈感。"},{"name":"Threads","url":"https://www.threads.net/","icon":"@","cat":"社群動態","color":"#292929","desc":"以文字對話為主的社群平台，可分享想法並參與公開討論。"},{"name":"X","url":"https://x.com/","icon":"𝕏","cat":"社群動態","color":"#202124","desc":"追蹤即時消息、觀點與公開討論，也可發布短篇貼文。"},{"name":"YouTube","url":"https://www.youtube.com/","icon":"▶","cat":"影音創作","color":"#ff0033","desc":"觀看與分享影片、直播和音樂內容，也能經營自己的頻道。"},{"name":"抖音（中國大陸版）","url":"https://www.douyin.com/","icon":"抖","cat":"影音創作","color":"#171717","desc":"抖音中國大陸版，以短影音、直播和生活內容為主，連結至抖音官方網站。"},{"name":"TikTok（國際版）","url":"https://www.tiktok.com/","icon":"♪","cat":"影音創作","color":"#171717","desc":"TikTok 國際版，以短影音為主，可瀏覽、創作並分享全球內容。"},{"name":"LINE","url":"https://line.me/","icon":"L","cat":"即時通訊","color":"#06c755","desc":"與親友傳訊、通話，並使用官方帳號與社群功能。"},{"name":"WhatsApp","url":"https://www.whatsapp.com/","icon":"☎","cat":"即時通訊","color":"#25d366","desc":"透過訊息、語音或視訊與個人及群組聯絡。"},{"name":"Telegram","url":"https://telegram.org/","icon":"➤","cat":"即時通訊","color":"#28a8e9","desc":"提供訊息、群組與頻道，方便追蹤主題社群和公告。"},{"name":"Discord","url":"https://discord.com/","icon":"◉","cat":"即時通訊","color":"#5865f2","desc":"加入伺服器與主題社群，透過文字、語音和視訊交流。"},{"name":"Reddit","url":"https://www.reddit.com/","icon":"R","cat":"興趣與知識","color":"#ff4500","desc":"依興趣加入各主題社群，閱讀討論、提問與分享經驗。"},{"name":"Pinterest","url":"https://www.pinterest.com/","icon":"P","cat":"興趣與知識","color":"#bd081c","desc":"收藏和探索圖片靈感，整理設計、手作、料理與旅行點子。"},{"name":"小紅書","url":"https://www.xiaohongshu.com/","icon":"書","cat":"興趣與知識","color":"#ff2442","desc":"探索生活方式、旅行、美妝、美食與創作分享內容。"},{"name":"LinkedIn","url":"https://www.linkedin.com/","icon":"in","cat":"專業交流","color":"#0a66c2","desc":"建立職涯人脈、展示專業經歷，並追蹤產業與工作機會。"}];
const categories=["全部","★ 收藏",...new Set(platforms.map(p=>p.cat))];
const platformByUrl=new Map(platforms.map(p=>[p.url,p]));
const favKey="personal-os-social-favorites-v1";
const recentKey="personal-os-social-recent-v1";
function readSaved(key){
 try{
  const value=JSON.parse(localStorage.getItem(key)||"[]");
  return Array.isArray(value)?[...new Set(value.filter(url=>typeof url==="string"&&platformByUrl.has(url)))]:[];
 }catch{return []}
}
function save(key,urls){try{localStorage.setItem(key,JSON.stringify(urls))}catch{}}
let favorites=readSaved(favKey),recent=readSaved(recentKey).slice(0,10);
let active="全部",term="";
const grid=document.getElementById("grid"),filters=document.getElementById("filters"),search=document.getElementById("search");
const dialog=document.getElementById("infoDialog");
const dialogLink=document.getElementById("dialogLink");
function renderShelf(id,urls,placeholder){
 const host=document.getElementById(id);
 host.replaceChildren();
 if(!urls.length){
  const empty=document.createElement("p");empty.className="shelf-empty";empty.textContent=placeholder;host.append(empty);return;
 }
 urls.forEach(url=>{
  const p=platformByUrl.get(url);if(!p)return;
  const a=document.createElement("a");a.className="shelf-link";a.href=p.url;a.target="_blank";a.rel="noopener noreferrer";a.dataset.trackUrl=p.url;
  const icon=document.createElement("span");icon.className="shelf-icon";icon.style.color=p.color;icon.textContent=p.icon;
  const name=document.createElement("span");name.className="shelf-name";name.textContent=p.name;
  a.append(icon,name);host.append(a);
 });
}
function renderShelves(){
 document.getElementById("favoriteCount").textContent=favorites.length+" 個收藏";
 document.getElementById("recentCount").textContent=recent.length+" / 10";
 renderShelf("favoriteItems",favorites,"還沒有收藏。點選下方卡片的 ☆ 就可以加入。");
 renderShelf("recentItems",recent,"尚無紀錄。開啟任何卡片後，就會顯示在這裡。");
}
function toggleFavorite(url){
 favorites=favorites.includes(url)?favorites.filter(x=>x!==url):[...favorites,url];
 save(favKey,favorites);
 render();
}
function render(){
 filters.replaceChildren();
 categories.forEach(cat=>{
  const b=document.createElement("button");
  b.className="filter"+(active===cat?" active":"");b.type="button";b.textContent=cat;
  b.setAttribute("aria-pressed",String(active===cat));
  b.addEventListener("click",()=>{active=cat;render()});
  filters.append(b);
 });
 const q=term.trim().toLocaleLowerCase();
 const list=platforms.filter(p=>
  (active==="全部"||(active==="★ 收藏"?favorites.includes(p.url):p.cat===active))&&
  (!q||(p.name+" "+p.cat+" "+p.desc).toLocaleLowerCase().includes(q))
 );
 document.getElementById("count").textContent=list.length+" 個入口";
 grid.replaceChildren();
 list.forEach(p=>{
  const card=document.createElement("article");card.className="card";card.style.setProperty("--tone",p.color);
  const saved=favorites.includes(p.url);
  const star=document.createElement("button");star.type="button";star.className="favorite-btn"+(saved?" saved":"");
  star.textContent=saved?"★":"☆";star.setAttribute("aria-pressed",String(saved));
  star.setAttribute("aria-label",(saved?"取消收藏：":"加入收藏：")+p.name);
  star.addEventListener("click",()=>toggleFavorite(p.url));
  const a=document.createElement("a");a.className="card-main";a.href=p.url;a.target="_blank";a.rel="noopener noreferrer";a.dataset.trackUrl=p.url;
  a.innerHTML='<span class="brand"></span><span><h3 class="platform-name"></h3><span class="platform-cat"></span></span>';
  a.querySelector(".brand").textContent=p.icon;if(p.icon.length>2)a.querySelector(".brand").classList.add("long");
  a.querySelector(".platform-name").textContent=p.name;a.querySelector(".platform-cat").textContent=p.cat;
  const desc=document.createElement("p");desc.className="desc";desc.textContent=p.desc;
  const actions=document.createElement("div");actions.className="card-actions";
  const why=document.createElement("button");why.type="button";why.className="why";why.textContent="? 平台說明";
  why.setAttribute("aria-label","查看"+p.name+"說明");
  why.addEventListener("click",()=>{
   const brand=document.getElementById("dialogBrand");brand.textContent=p.icon;
   brand.style.color=p.color;brand.style.backgroundColor=p.color+"20";
   document.getElementById("dialogTitle").textContent=p.name;
   document.getElementById("dialogCategory").textContent=p.cat;
   document.getElementById("dialogDescription").textContent=p.desc;
   dialogLink.href=p.url;dialogLink.dataset.trackUrl=p.url;
   dialog.showModal();
  });
  const open=document.createElement("a");open.className="open";open.href=p.url;open.target="_blank";
  open.rel="noopener noreferrer";open.dataset.trackUrl=p.url;open.textContent="開啟連結 ↗";
  actions.append(why,open);card.append(star,a,desc,actions);grid.append(card);
 });
 if(!list.length){
  const e=document.createElement("div");e.className="empty";
  e.textContent=active==="★ 收藏"&&!favorites.length?"尚未收藏項目，請先點選卡片的 ☆。":"沒有符合條件的項目，試試其他分類或關鍵字。";
  grid.append(e);
 }
 renderShelves();
}
search.addEventListener("input",()=>{term=search.value;render()});
document.addEventListener("click",event=>{
 const target=event.target;
 if(!(target instanceof Element))return;
 const link=target.closest("a[data-track-url]");
 if(!link)return;
 const url=link.dataset.trackUrl;
 if(!platformByUrl.has(url))return;
 recent=[url,...recent.filter(item=>item!==url)].slice(0,10);
 save(recentKey,recent);
 setTimeout(renderShelves,0);
});
dialog.querySelector(".close").addEventListener("click",()=>dialog.close());
dialog.addEventListener("click",e=>{if(e.target===dialog)dialog.close()});
render();
</script><script src="../shared-nav.js?v=20261025-2" defer></script></body></html>
