路人。 所以我們從節氣菜園、節氣料理、記憶地圖、爺奶手藝、社區走讀五大面向來成立爺奶學堂，以阿公阿嬤的生活智慧為根基，讓他們站在孩子面前，成為活的教科書與共學的導師，傳授務農智慧、農村技藝與在地故事，促進跨世代學習與情感交流，使農村文化在日"},{"name":"園堡共好食農教育","category":"社造博覽會","url":"https://trello.com/c/6O8RfveV/76-%E5%9C%92%E5%A0%A1%E5%85%B1%E5%A5%BD%E9%A3%9F%E8%BE%B2%E6%95%99%E8%82%B2","desc":"大溪區 園堡社區（侯霽芸） 園堡共好食農教育 4\\.JPG 大溪園堡為一個靠近大溪交流道的老社區，住戶只有 73 戶，住戶之間感情淡薄，大家都說遠親不如近鄰，所以今年開始舉辦一些簡單活動，希望能開啟一個社區共好的氛圍來連結住戶感情，增加社區人情味，成為日久他鄉是故鄉的好所在。 所以我們一方面從多肉植物手作開始，以園藝療法與社區共學為出發，讓居民動手做、一起玩，培養情感與成就感，並美化社區角落。另一方面則進行從菜園到餐桌的食農教育，規劃社區閒置空間與農園，由此來創造居民參與、共創共享、在地連結與世代共學的平台，期望由此活絡社區情感，活化社區的生命力。 --"},{"name":"半農時代-小草調查日記","category":"社造博覽會","url":"https://trello.com/c/C81IfjAL/77-%E5%8D%8A%E8%BE%B2%E6%99%82%E4%BB%A3-%E5%B0%8F%E8%8D%89%E8%AA%BF%E6%9F%A5%E6%97%A5%E8%A8%98","desc":"八德區 時代園邸管理委員會 半農時代-小草調查日記 3\\.jpg 時代園邸管理委員會執行社造計畫已有二年的經驗，兩年來，我們協助新移住居民融入在地文化增加認同感，並讓社區居民認識公寓大廈內的設備及公寓大廈管理的方式，增加社區居民對於社區公共事務的瞭解，並期待更進一步凝聚社區居民的向心力。 所以我們由社區居民自主成立了共享綠地志工團，透過一系列農事的學習，鼓勵住戶參與，引導大家持續關心環境的議題，培力社區志工思考及共商討論解決社區問題的方法，希望透過改善社區後中庭空間，將時代園邸社區打造成更讓人宜居的友善社區，強化住戶對社區的認同。 --- 創作說明圖："},{"name":"編織少年的心森網","category":"社造博覽會","url":"https://trello.com/c/qTTfGQ6j/90-%E7%B7%A8%E7%B9%94%E5%B0%91%E5%B9%B4%E7%9A%84%E5%BF%83%E6%A3%AE%E7%B6%B2","desc":"龍潭區 王瓊瑩 編織少年的心森網 7\\.HEIC 根據兒童福利聯盟 2023 年的調查，國中生面臨課業壓力大、人際關係挑戰與未來的不確定性三大挑戰，導致12.9% 的國中生憂鬱程度嚴重，且許多人不願尋求幫助，以致內心孤單，壓力持續累積，尤其在家庭支持系統較低的他們，特別容易被壓垮。 所以我們進入校園特殊班，透過園藝療法與瑜珈等方式，幫助孩子釋放壓力、提升自我覺察與情緒調節能力，並且鼓勵家長參與，提升家長對青少年情緒的理解，學習如何支持孩子的心理健康，建立良好的親子互動溝通模式，同時導入社區參與，編織點線面的支持網絡來點亮孩子的希望與自信。 --- 創作說"},{"name":"張厝生態文化教育之原生與外來種探索","category":"社造博覽會","url":"https://trello.com/c/fDMXqcfM/91-%E5%BC%B5%E5%8E%9D%E7%94%9F%E6%85%8B%E6%96%87%E5%8C%96%E6%95%99%E8%82%B2%E4%B9%8B%E5%8E%9F%E7%94%9F%E8%88%87%E5%A4%96%E4%BE%86%E7%A8%AE%E6%8E%A2%E7%B4%A2","desc":"龜山區 桃園市龜山新嶺愛鄉協會 張厝生態文化教育之 原生與外來種探索 1759519399610\\.jpg 桃園龜山張厝社區位處淺山地區，社區成員皆為張家子孫，聚落保存完整為龜山地區發展史的重要一環，同時因低度開發保留了豐富的自然生態環境，有著多樣性的臺灣原生種（與入侵的外來種）以及與在地風土習俗相關的民俗植物，是一處包含了文化生活與自然知識的戶外天然教室。 所以我們秉持「社區即學校」的理念，連結社區耆老的智慧及壽山國小的師生家長共同參與，推動生態文化教育。以「原生植物與外來種辨識」為主軸，透過文化體驗與環境教育，建立在地知識的傳承平台，培養學童關懷土地"},{"name":"綠藝好生活-社區環境改造計畫","category":"社造博覽會","url":"https://trello.com/c/TwdsMNeb/92-%E7%B6%A0%E8%97%9D%E5%A5%BD%E7%94%9F%E6%B4%BB-%E7%A4%BE%E5%8D%80%E7%92%B0%E5%A2%83%E6%94%B9%E9%80%A0%E8%A8%88%E7%95%AB","desc":"中壢區 綠藝心賞社區管理委員會 綠藝好生活-社區環境改造計畫 9\\.jpg 中壢的綠藝心賞社區為 19 年的中老型社區，原本是幽靜美麗的居家好環境，但年久失修造成公共空間的雜亂及嚴重漏水問題，故希望能喚起大家對公共空間的重視，讓住戶因為共同的需求而凝聚在一起，開始共學、共聚、共營友善生活圈，成為一個互助關懷的大家庭。 所以我們首先舉辦社區公共設施導覽活動，讓新舊住民共同瞭解公設現況，並且討論室內公共空間的漏水狀況與改善方法，在社造計畫的引導下，鼓勵住戶共同關心，透過一起動手施作來解決社區問題改善居住環境，並由此來增進社區居民的交流，大家共同學習與成長，建"},{"name":"福廊風華-古道再生計畫","category":"社造博覽會","url":"https://trello.com/c/LQrZyf9U/93-%E7%A6%8F%E5%BB%8A%E9%A2%A8%E8%8F%AF-%E5%8F%A4%E9%81%93%E5%86%8D%E7%94%9F%E8%A8%88%E7%95%AB","desc":"大溪區 一德社區 福廊風華-古道再生計畫 6\\.jpg 桃園大溪一德里的福廊古道，長約一公里，是一條承載歷史記憶與自然景觀的古道，過去曾是人們往來的重要通道，也是社區文化與生態旅遊的重要資源，但如今古道的文化價值隱沒於時代變遷之中，我們希望讓這條古道重新成為社區凝聚力的象徵，並藉此提升社區的環境教育與美學價值。 所以我們以「福廊古道」為核心場域，透過耆老訪談、故事採集與生命史書寫保存文化記憶，並結合自然素材進行美學共創，喚起人與環境的感官對話，再以感知走讀與策展展演，讓參與者重新認識福廊的地景紋理，由此來打造一條連結人與土地文化情感與生態意識的古道。 -"},{"name":"水噹噹168—營造桃園水圳亮點","category":"社造博覽會","url":"https://trello.com/c/ZIcONHnd/97-%E6%B0%B4%E5%99%B9%E5%99%B9168-%E7%87%9F%E9%80%A0%E6%A1%83%E5%9C%92%E6%B0%B4%E5%9C%B3%E4%BA%AE%E9%BB%9E","desc":"中壢區 得意一生公寓大廈管理委員會 水噹噹168—營造桃園水圳亮點 10\\.jpg 中壢得意一生大樓社區後方圍牆外，與中原大學交界處有一水圳，原是一處親水秘境，但因位處三不管地帶，日久雜草叢生環境髒亂乏人問津，一牆之隔在無形中彷彿也隔離了社區住戶與周邊環境的連結，原本的清幽小徑因此成為長期的嫌惡環境。 所以我們展開了對水圳環境的關注與具體行動，與市府所有權機關取得聯繫與同意後，號召社區住戶開始清整水圳垃圾，並開設園藝課程，共同綠美化水圳環境，同時回過頭來改善修整社區花園植栽，在行動過程中喚醒居民環境意識，建立宜居共識，期盼創造桃園市最美之一的都市水圳景觀"},{"name":"大家來淨化老街溪-老街溪語水岸新聲","category":"社造博覽會","url":"https://trello.com/c/UChfBeEe/98-%E5%A4%A7%E5%AE%B6%E4%BE%86%E6%B7%A8%E5%8C%96%E8%80%81%E8%A1%97%E6%BA%AA-%E8%80%81%E8%A1%97%E6%BA%AA%E8%AA%9E%E6%B0%B4%E5%B2%B8%E6%96%B0%E8%81%B2","desc":"中壢最重要的河川，述說了自然生態環境教育與地方的文化生活紋理，承載著中壢發展脈絡與歷史記憶的動脈。但在都會化急速發展下，老街溪與中壢發展臍帶相連的緊密關係逐漸淡薄，重新尋回人與水文的連結，是我們最心心念念的工作。 所以我們從中壢芝芭里的休閒農業發展回溯河川與土地的相依，以公民科學的精神，邀請周邊居民共同進行生態調查、論壇與生態人文走讀遊程設計，培養市民持續關懷老街溪的生活態度，期望能由此創造中壢都市田園中人與環境永續的健康綠生活，營造多元共榮的老街溪流域。 --- 創作說明圖："},{"name":"溪流之心，文化之魂—社子溪永續共榮計畫","category":"社造博覽會","url":"https://trello.com/c/Ikz1z0zz/99-%E6%BA%AA%E6%B5%81%E4%B9%8B%E5%BF%83%EF%BC%8C%E6%96%87%E5%8C%96%E4%B9%8B%E9%AD%82-%E7%A4%BE%E5%AD%90%E6%BA%AA%E6%B0%B8%E7%BA%8C%E5%85%B1%E6%A6%AE%E8%A8%88%E7%95%AB","desc":"新屋區 桃園海客協會 溪流之心，文化之魂— 社子溪永續共榮計畫 12\\.jpg 桃園市新屋區的社子溪擁有豐富的自然生態與人文歷史，然而隨著都市發展與環境變遷，該區域的生態環境與傳統文化正面臨衰退的挑戰。為守護這片珍貴的自然與人文資源，我們希望整合生態保育、文化傳承及社區發展，打造具有教育、旅遊與環保意義的環境教育場域。 所以我們辦理生態觀察工作坊，邀請在地居民、社區志工與學生參與調查記錄，並透過親子手作課程引導大家親近水域，最後製作出一份以「社子溪侯鳥生態地圖」為主題的參與式生態地圖，將行動成果落實在地生活場域中，藉此來促進社區更多的參與，提升居民的環境"},{"name":"ppongan-上巴陵的水蜜桃阿公","category":"社造博覽會","url":"https://trello.com/c/CpRwkohr/105-ppongan-%E4%B8%8A%E5%B7%B4%E9%99%B5%E7%9A%84%E6%B0%B4%E8%9C%9C%E6%A1%83%E9%98%BF%E5%85%AC","desc":"ppongan-上巴陵的水蜜桃阿公 IMG_5212.HEIC Ppongan 在泰雅語中意指「聽講」，是我們聆聽阿公述說生命故事的初衷。陳榮貴先生是桃園復興區上巴陵部落一位 82 歲的泰雅族阿公，秉持著信仰和共好的心，無私的將自己辛勤耕耘大半輩子的水蜜桃技術分享給部落的族人，是打造拉拉山水蜜桃盛名的幕後推手之一，也被後人尊稱為水蜜桃阿公。 所以我們以阿公的故事為出發點，透過一系列訪談、田野文字紀錄與影音紀錄，探索至今還在種植水蜜桃的耆老們的生命歷程，不僅保存他們所代表的一代人對土地、勞動、家庭與信仰的見證，也希望激發青年對部落歷史的關注與參與，使生命故"},{"name":"雪霧鬧的記憶之地","category":"社造博覽會","url":"https://trello.com/c/3ZBoP1d4/106-%E9%9B%AA%E9%9C%A7%E9%AC%A7%E7%9A%84%E8%A8%98%E6%86%B6%E4%B9%8B%E5%9C%B0","desc":"復興區 桃園市創生事務發展協會 雪霧鬧的記憶之地 14\\.jpg 雪霧鬧（Sbunaw）部落是由多個大小不拘的小部落所組成，發展最大基礎在於部落豐富的文化資源，但部落青年對部落的瞭解仍顯不足，我們需要一步步的將部落的歷史點滴紀錄下來，轉換成具有價值的行動，讓青年能在部落內扎根成長，成為文化傳承者與推動者。 所以我們透過耆老訪談、青年參與、地圖設計與解謎遊戲規劃，以文化作為連結世代與認同的媒介，建立一份能夠承載文化記憶與故事的部落地圖，並透過解謎遊戲的互動方式，讓部落族人及外地朋友認識雪霧鬧，希望藉由培力青年承擔文化傳承創新的角色，讓部落文化得以世代傳承並"},{"name":"Makapahay馬卡巴嗨：伊娜的雙門冰箱","category":"社造博覽會","url":"https://trello.com/c/giH4phwr/107-makapahay%E9%A6%AC%E5%8D%A1%E5%B7%B4%E5%97%A8%EF%BC%9A%E4%BC%8A%E5%A8%9C%E7%9A%84%E9%9B%99%E9%96%80%E5%86%B0%E7%AE%B1","desc":"Makapahay馬卡巴嗨：伊娜的雙門冰箱 5\\.jpg 「馬卡巴嗨 (Makapahay)」 源自阿美族語，意指 「美麗、漂亮」，承載著我們對文化之美的珍視與追求。撒烏瓦知（Saowac）部落為東岸阿美族遷移至北臺灣的重要據點之一，我們希望藉由在部落的工作實踐，重建一條從田野走入都市、從冰箱走向餐桌的文化路徑，將傳統生活智慧轉譯為當代知識。 所以我們以「依娜的雙門冰箱」為主題，建立「阿美族都市野菜生活文化庫」，系統性的梳理族人在疾病與困境中所使用的食材與儀式，強化飲食文化的知識脈絡和語境連結，並藉此保存長輩的口述記憶與文化智慧，將原先僅存於長者經驗中的"},{"name":"忠貞打歌樂傳薪／傳心計畫","category":"社造博覽會","url":"https://trello.com/c/YtIBtp4s/108-%E5%BF%A0%E8%B2%9E%E6%89%93%E6%AD%8C%E6%A8%82%E5%82%B3%E8%96%AA%EF%BC%8F%E5%82%B3%E5%BF%83%E8%A8%88%E7%95%AB","desc":"平鎮區 桃園市雲南民俗打歌促進協會 忠貞打歌樂傳薪／傳心計畫 16\\.jpg 「打歌」源自泰緬孤軍於1950 年代帶入桃園龍岡的民俗歌舞，融合雲南少數民族，於臺灣在地展現多元跨族裔特色。這項集歌唱、舞蹈、器樂於一身的表演藝術，根植於雲南禮俗，卻因傳人凋零與人才匱乏面臨存續危機，我們希望透過持續的教育推廣及社區參與，來讓這項珍貴的文化資產永續傳承。 所以我們秉持「共創」精神，鼓勵不同世代的成員協作採集耆老的口述記憶與技藝，製作包含歌詞、舞步與雲南話教學的文化素材，並透過社區體驗與成果展覽，將這項瀕危的滇緬泰傳統表演藝術傳遞給新生代與在地社群，讓多元的打歌文"},{"name":"員本好食．客味新尞","category":"社造博覽會","url":"https://trello.com/c/bXOIEXNR/109-%E5%93%A1%E6%9C%AC%E5%A5%BD%E9%A3%9F%EF%BC%8E%E5%AE%A2%E5%91%B3%E6%96%B0%E5%B0%9E","desc":"富岡員本社區是典型的客家農村社區，擁有濃厚的客家飲食文化，居民多為客家族群，習慣重油、重鹹與醃漬食品，這對年長者的健康，尤其是心血管與腎臟問題，帶來一定風險。改善年長者的飲食習慣，讓他們能夠攝取更健康營養的食物，將能一定程度解決社區內的健康問題。 所以我們從居民的日常生活出發，透過食譜蒐集、料理改良、實作工作坊與刊物編撰等過程，讓居民能親身參與一場關於飲食文化傳承與健康轉化的行動，提升營養價值同時保留文化內涵，更貼近現代的健康需求，也讓每一位長者感受到社區的關懷與溫暖，共同推動社區的健康發展環境。 --- 創作說明圖："},{"name":"新台味 心之味-酸甜苦辣 新「造」咖","category":"社造博覽會","url":"https://trello.com/c/FqtKIIuS/110-%E6%96%B0%E5%8F%B0%E5%91%B3-%E5%BF%83%E4%B9%8B%E5%91%B3-%E9%85%B8%E7%94%9C%E8%8B%A6%E8%BE%A3-%E6%96%B0%E3%80%8C%E9%80%A0%E3%80%8D%E5%92%96","desc":"桃園區 桃園市新移民女性關懷協會 新台味 心之味-酸甜苦辣 新「造」咖 18\\.jpg 今年對於協會的姊妹們來說是一個重要轉折，象徵大家從過去兩年社造工作的參與者，走向主動行動的實踐者。帶著更多反思重新出發，今年特別關注的是：新住民女性如何在生活中參與公共事務？這些看似平凡的日常文化與生命故事，又能如何開啟社區的對話？ 所以我們以姊妹們的人生故事和生活文化為起點，透過培力工作坊、小旅行、Podcast、成果沙龍等方式，一方面讓姊妹們更理解什麼是「公共參與」，強化自我認同感及跨文化敏感度，另一方面也讓更多在地居民能聽見新住民的聲音。我們期待，對內能夠更有自"},{"name":"雁行之旅－熟能聲巧，藝起來","category":"社造博覽會","url":"https://trello.com/c/jEy1T9KM/111-%E9%9B%81%E8%A1%8C%E4%B9%8B%E6%97%85%EF%BC%8D%E7%86%9F%E8%83%BD%E8%81%B2%E5%B7%A7%EF%BC%8C%E8%97%9D%E8%B5%B7%E4%BE%86","desc":"桃園區 桃園市築夢家族社區兒童發展協會 雁行之旅－熟能聲巧，藝起來 19\\.jpg 築夢家族由一群特殊孩子（慢飛天使）與家長、志工組成，目標以培力孩子生活獨立自主為主，藉由孩子們的學習成長，鼓勵他們走出戶外，擴大視野建立自信來因應未來回歸社會的挑戰，創造更多的感動與希望。 所以我們積極培力孩子與青年志工的Podcast能力，讓他們透過故事分享培養與人互動的自信與能力，讓更多人聽見他們的勇敢，並進一步鼓勵他們由「分享者」轉為「引導者」與「紀錄者」，培養敘事能力梳理參與夥伴的人生故事，期望能深化其自我認同與理解他人，找到人生方向與實踐場域，開啟另一種成長的人"},{"name":"【溪影時光】影像敘事工作坊-大溪女路建置計畫","category":"社造博覽會","url":"https://trello.com/c/zbjTilEp/112-%E3%80%90%E6%BA%AA%E5%BD%B1%E6%99%82%E5%85%89%E3%80%91%E5%BD%B1%E5%83%8F%E6%95%98%E4%BA%8B%E5%B7%A5%E4%BD%9C%E5%9D%8A-%E5%A4%A7%E6%BA%AA%E5%A5%B3%E8%B7%AF%E5%BB%BA%E7%BD%AE%E8%A8%88%E7%95%AB","desc":"桃園大溪河西地區，不僅保留眷村、軍事遺址及農村景觀，更蘊含豐富多元的人文組成。我們期待發掘在地多元族群的女性故事，特別是眷村女性、新住民女性、以及移工女性的故事，發展獨特的「女路微旅行」路線，呈現不同族群女性在此地的生活經驗與貢獻。 所以我們與三里里長合作，深化與地方組織及居民的連結，並透過「溪影時光：鏡頭下的社區女性故事」影像敘事工作坊，培力社區民眾運用手機進行影像記錄、訪談敘事及生命史採集，由此來發掘在地女性歷史、培力社區婦女共同詮釋在地女性的堅韌故事，創造對於在地女性歷史與性別平權議題的公共對話場域。 --- 創作說明圖："},{"name":"妳我之間-影像陪伴計劃","category":"社造博覽會","url":"https://trello.com/c/QM8iZR7h/113-%E5%A6%B3%E6%88%91%E4%B9%8B%E9%96%93-%E5%BD%B1%E5%83%8F%E9%99%AA%E4%BC%B4%E8%A8%88%E5%8A%83","desc":"桃園區 精靈無比工作室 妳我之間-影像陪伴計劃 21\\.jpg 紀實影像可以成為對生活的實踐，因此行動以「女性視角」及「性別平權」的角度切入，從日常生活中觀察與探討不同世代的女性面貌，以及在社會中所扮演的角色，並在學習與創作中，運用影像表達女性觀點，描繪女性的各種面貌與探索各種可能性，期望在交流與共學過程中，收穫性別平權的價值。 所以我們以公民影像教育與推廣為主軸，著墨於女性視角及性別平權議題，聚焦於「人際關係」觀察與探討，透過提供影像創作資源，協同參與者一同採集與記錄地方故事，鼓勵參與者充分表達以及傾聽多元觀點，由此來書寫女性的各種生活路徑，讓對平權議"},{"name":"龍潭安全共融親子友善街道","category":"社造博覽會","url":"https://trello.com/c/CWml4yLC/114-%E9%BE%8D%E6%BD%AD%E5%AE%89%E5%85%A8%E5%85%B1%E8%9E%8D%E8%A6%AA%E5%AD%90%E5%8F%8B%E5%96%84%E8%A1%97%E9%81%93","desc":"龍潭區 社團法人臺灣龍潭親子建設推廣聯盟 龍潭安全共融親子友善街道 22\\.JPG 龍潭區的大多數街道缺乏適合兒童步行與遊戲的環境，同時交通安全設施仍不夠完善，孩子自行步行上學暴露在一定的風險之中。兒童行動權跟兒童遊戲權是緊密相連的人本觀念，缺一不可，但龍潭地區的城市發展仍以車輛為主體，導致兒童的生活空間受到極大壓縮。 所以我們透過人本街道、人行安全講座及親子走讀工作坊來吸引更多社區居民的關注，並透過親子友善的規劃來鼓勵吸引親子共同參與，同時辦理成果展與經驗分享會，凝聚居民與政府的共識，藉此來改善人行環境，提升公共空間品質，讓龍潭的街道成為更適合親子共學"},{"name":"故城新韻2.0","category":"社造博覽會","url":"https://trello.com/c/JnZkBKJB/115-%E6%95%85%E5%9F%8E%E6%96%B0%E9%9F%BB20","desc":"新屋區 黃元彥 故城新韻2.0 23\\.jpg 故城新屋具備完備的天然資源、街區商店、人文建築，為桃園市境內最高齡化的行政區域，同時也是新舊交織的古樸小鎮。我們希望讓更多的地方居民能夠走入在地店家、水巷、老屋、埤圳，除了增進在地學子對於家鄉社區的關懷認同，也讓社區成人透過書寫來梳理自身的社區生命經驗。 所以我們由地方學教育的角度出發，邀請社區居民與在地學子共同參與，藉由徒步踏查、社區微旅行活動設計與地方人文與自然之書寫，形成共學共作的社會實踐學習，為範圍 3 公里大小的新屋故城區建構完整的街區學習地圖、描繪城鄉生活之獨特景致與人文情懷。 --- 創作說明"},{"name":"悠遊平鎮的大小腳","category":"社造博覽會","url":"https://trello.com/c/1XCEy6dc/116-%E6%82%A0%E9%81%8A%E5%B9%B3%E9%8E%AE%E7%9A%84%E5%A4%A7%E5%B0%8F%E8%85%B3","desc":"平鎮區 劉士鳳 悠遊平鎮的大小腳 24\\.jpg 平鎮有著許多的藝文活動與在地故事，是一個宜居的好地方，我們希望能讓在地人更瞭解自己家鄉的人文風情、地方歷史紋理及藝文活力，更愛自己的家鄕，並增進跨世代之間的溝通討論，凝聚對家鄉的認同情感，將地方的美好分享給更多的在地住民。 所以我們以平鎮區公所的「平鎮人文平台」為核心操作介面，以記錄平鎮人文風景的攝影作品徵件活動為操作方法，讓參與者能彼此分享社區故事，傳遞在地生活經驗，提昇平鎮多元人文風景的可見度，以此來促成社區居民跨世代的互動及共創，凝聚住民的凝聚力與向心力，創造屬於平鎮的文化生活圈。 --- 創作說明"},{"name":"《山海記述》石門水庫移民遷村故事","category":"社造博覽會","url":"https://trello.com/c/8370M1jW/117-%E3%80%8A%E5%B1%B1%E6%B5%B7%E8%A8%98%E8%BF%B0%E3%80%8B%E7%9F%B3%E9%96%80%E6%B0%B4%E5%BA%AB%E7%A7%BB%E6%B0%91%E9%81%B7%E6%9D%91%E6%95%85%E4%BA%8B","desc":"觀音區 巫秀千 《山海記述》石門水庫移民遷村故事 25\\.jpg 1960年代，政府為興建石門水庫，徵收淹沒區的田地和房舍，在地居民因此遷村至桃園沿海各個地方，後泰雅族卡拉社又從中庄二次遷移至大潭區域。數十年來，這段從遷徙到落地生根的過程從未有詳實田調紀錄，至今第二、三代也幾乎遺忘這段歷史，所以重新尋回移住民的故事，讓共同的記憶流傳下去，變得刻不容緩。 所以我們除了持續進行「以人為本」的移民口述記事，以遷移的角度轉譯為地理模型（水底的故鄉）及走讀小旅行外，同時記述從內山到沿海人與神的共同移動，從中探討信仰文化中的共生關係，讓先民的故事得以世代的延續下去。"},{"name":"箍仔內的人生","category":"社造博覽會","url":"https://trello.com/c/mpvyNdKN/118-%E7%AE%8D%E4%BB%94%E5%85%A7%E7%9A%84%E4%BA%BA%E7%94%9F","desc":"桃園大園的竹圍里，為一個典型的閩南農村聚落，充滿濃濃的人情味，並且有著豐富的聚落文化及生活景觀，但因為桃園航空城的建設規劃，社區面臨了遷村的巨大衝擊，許多住戶已遷移至外地定居，安身立命之地不再，只留存對於社區生活的共同記憶。 所以我們持續進行社區記憶的保存工作，讓美好回憶與長年情誼可以持續傳遞下去。過往因為生活或產業所需，社區有各式各樣的傳統工藝，於是今年致力於社區傳統工藝資源的調查，並邀請遷移戶回鄉與竹圍國中小學童一起傳承實作，並透過社區實境體驗，讓工藝回到社區重建生活場景，延續對家鄉的珍貴記憶。 --- 創作說明圖："},{"name":"石頭庄特派小記者培力計畫","category":"社造博覽會","url":"https://trello.com/c/mHD7LTdS/78-%E7%9F%B3%E9%A0%AD%E5%BA%84%E7%89%B9%E6%B4%BE%E5%B0%8F%E8%A8%98%E8%80%85%E5%9F%B9%E5%8A%9B%E8%A8%88%E7%95%AB","desc":"中壢區 聚拾聚落（余至真） 石頭庄特派小記者培力計畫 27\\.jpg 孩子在家庭與學校的移動路徑中，在不同社區空間語彙中所隱藏的各種人、事、物，包含店家職人、風土習俗、環境生態、建築廟宇、自然景觀、特色產業、在地知識、多元文化等，交織成我們關於社區生活的記憶，但這些社區的點點滴滴卻往往在孩子的成長過程中缺席，成為只是路過的景致，對社區熟悉但缺乏記憶。 所以我們舉辦小記者培力工作坊，鼓勵親子共同參與，從一位小記者的眼光來觀察社區，並且學習運用攝影、影像製作剪輯與編輯採訪技巧來進行記錄，發行社區報，打造對於社區的記憶，也讓更多社區居民知道自己社區的故事。 -"},{"name":"綠水巷與老宅故事—影像見證桃園的變革","category":"社造博覽會","url":"https://trello.com/c/hVwM2PXT/79-%E7%B6%A0%E6%B0%B4%E5%B7%B7%E8%88%87%E8%80%81%E5%AE%85%E6%95%85%E4%BA%8B-%E5%BD%B1%E5%83%8F%E8%A6%8B%E8%AD%89%E6%A1%83%E5%9C%92%E7%9A%84%E8%AE%8A%E9%9D%A9","desc":"桃園區 桃園市公民記者文化發展協會 綠水巷與老宅故事—影像見證桃園的變革 28\\.jpg 桃園是一個快速變遷中的年輕城市，位處都會區的社區樣貌也因此不斷更迭。同安里作為桃園區人口最多的里之一，過去十年人口成長率高達 36.96%，區域發展迅速。然而隨著人口快速增長，社區環境、文化保存與新舊住民共好等議題也逐漸浮現。 所以我們培力社區居民與更多民眾，運用手機影片製作來記錄報導「自己住的地方正在發生什麼事？」，培養對社區的關注與行動力，除了報導社區的公共事務外，更希望開啟學員探索社區議題的能力，讓學員之後也能將這樣的觀察力延伸到更多面向的公共議題上，持續發揮"},{"name":"「從天空到地底」AI公民記者新聞新視角","category":"社造博覽會","url":"https://trello.com/c/zLazGPT5/80-%E3%80%8C%E5%BE%9E%E5%A4%A9%E7%A9%BA%E5%88%B0%E5%9C%B0%E5%BA%95%E3%80%8Dai%E5%85%AC%E6%B0%91%E8%A8%98%E8%80%85%E6%96%B0%E8%81%9E%E6%96%B0%E8%A6%96%E8%A7%92","desc":"桃園區 潘慈秀 「從天空到地底」AI公民記者新聞新視角 DSC_9664.jpg 現代科技包括網路自媒體、手機、各種方便取用的APP與最新的AI技術的興起，提供了我們更方便與強大的工具來投入對自身社區的關注，運用手機攝影、影片製作與網路平台的發表及討論，社造也能將當代科技轉化成為公民科技，成為我們關注在地公共議題的利器。 所以我們投入了社區公民記者的培力工作，並且延續過往對社區資源調查的累積，將行動聚焦於陽明社區公園裡的傾斜大榕樹以及荒廢的樹林公園，探討榕樹的傾斜原因及安全現況，並透過訪談進一步瞭解樹林空間的前世今身，更深度的瞭解社區議題，也成為了下一步"},{"name":"跟小桃走~南門市場","category":"社造博覽會","url":"https://trello.com/c/SOf28Kmr/81-%E8%B7%9F%E5%B0%8F%E6%A1%83%E8%B5%B0%E5%8D%97%E9%96%80%E5%B8%82%E5%A0%B4","desc":"桃園區 小桃走讀（林怡君） 跟小桃走~南門市場 30\\.jpg 桃園的南門傳統市場，集各種生鮮食材、南北雜貨、多樣美食與服飾美容於一身，從食材知識、行業職人、店家故事、多語環境、五感體驗到人情典故，是一個地方知識的寶庫，也是一個充滿無窮探索趣味的樂園。 所以我們連結了桃園國小師生、家長、校園與青年志工，帶著孩子走進南門市場進行學習，在傳統空間中醞釀出對自己家鄉的情感。我們期盼小桃走讀不只是一次次的舊城漫步，更是一場持續累積的學習旅程。未來，希望透過帶領學生從生活經驗出發，逐步認識家鄉的歷史紋理與文化特色，進一步延伸至思考城市的未來樣貌。 --- 創作說明"},{"name":"想巷有光：孩子的光亮日常","category":"社造博覽會","url":"https://trello.com/c/uCPo2CXx/83-%E6%83%B3%E5%B7%B7%E6%9C%89%E5%85%89%EF%BC%9A%E5%AD%A9%E5%AD%90%E7%9A%84%E5%85%89%E4%BA%AE%E6%97%A5%E5%B8%B8","desc":"平鎮區 新勢社區 想巷有光：孩子的光亮日常 31\\.jpg 「想巷」是一條窄巷，由在地新勢里夥伴共同命名，位於平鎮區延平路與德育路間長約 75 米，是中壢國中學生最重要的通學巷道，巷道連通豬埔仔與馬寮老屋群，是平鎮最具文史意涵的舊城區巷道。原本破舊、髒亂、陰暗，2024年透過社規師計畫完成修繕與改造後，環境重獲新生。 所以我們進一步努力讓窄巷成為詮釋平鎮文化活力的人本空間。我們連結學校、里辦與地方社群，培力青年與民眾，運用不同的工作坊、踏查與市集操作，將平鎮的生活美學、文化底蘊及社區參與導入巷弄空間，建構跨世代的共好行動，一起來想像更美好的在地生活。 -"},{"name":"野暖：龍岡馬祖廟宇誌","category":"社造博覽會","url":"https://trello.com/c/hC2nSwxa/85-%E9%87%8E%E6%9A%96%EF%BC%9A%E9%BE%8D%E5%B2%A1%E9%A6%AC%E7%A5%96%E5%BB%9F%E5%AE%87%E8%AA%8C","desc":"中壢區 鄭瑋萱 野暖：龍岡馬祖廟宇誌 32\\.JPG 「野暖」（ia noung）一詞來自馬祖語。「野」是非常的意思，「暖」則是溫暖熟悉的感覺。在馬祖戰地政務時期，許多馬祖的神與人一起橫跨黑水溝，在桃園安身立命，移民廟宇不僅承載原鄉的信仰，更是串聯童年記憶與凝聚社群情感的場域，也是許多後代認識自身文化的重要地景。 所以我們以龍岡地區的一間馬祖廟宇—龍角峯伍位靈公，作為探索信仰與地方文化的路徑，透過廟宇的探訪，串聯龍岡的馬祖移民，紀錄龍岡的馬祖文化地景，並且運用LINE的互動體驗與文化辦桌的創新設計，串聯起在地馬祖移民社群的故事。 --- 創作說明圖："},{"name":"三元宮石藝奇緣-石雕故事與文化探險計畫","category":"社造博覽會","url":"https://trello.com/c/sFiWemKU/86-%E4%B8%89%E5%85%83%E5%AE%AE%E7%9F%B3%E8%97%9D%E5%A5%87%E7%B7%A3-%E7%9F%B3%E9%9B%95%E6%95%85%E4%BA%8B%E8%88%87%E6%96%87%E5%8C%96%E6%8E%A2%E9%9A%AA%E8%A8%88%E7%95%AB","desc":"八德區 開薰運動休閒成長協會 三元宮石藝奇緣-石雕故事與文化探險計畫 33\\.jpg 桃園八德的三元宮已有252年歷史，113年列為市定古蹟，在新舊快速變遷的都會地區，擁有一座珍貴的文化資產難能可貴，提醒著我們先人走過的足跡與地方的歷史脈絡。但閱讀文化資產需要專業的知識背景並不容易，轉譯並重建其知識系統，因此成為文化資產活化與傳承的關鍵之一。 所以我們將行動聚焦於三元宮豐富的石雕文化，從組建包含專家、退休教育人士與社區志工的專案團隊，到建立關於石雕的知識系統，再透過生動活潑的尋寶遊戲鼓勵民眾親近探索，一步步將文化資產與在地生活重新連結起來，豐富了在地知識"},{"name":"故事-閩東語復振","category":"社造博覽會","url":"https://trello.com/c/XKloO9wL/87-%E6%95%85%E4%BA%8B-%E9%96%A9%E6%9D%B1%E8%AA%9E%E5%BE%A9%E6%8C%AF","desc":"八德區 桃園市閩東語教育文化推廣協進會 故事-閩東語復振 34\\.png 桃園是馬祖人在臺灣本島最重要的聚居地，形成具歷史與文化意涵的多重社群空間。八德區的瑞祥里與瑞發社區，是馬祖同鄉會所在地，社群緊密。而大湳的永福街被稱為「馬祖街」，為生活與信仰中心。至於中壢龍岡的忠貞新村與華勛新村，則保留了馬祖語言與文化傳統。三區共同構成馬祖人在桃園的主要聚落，語言與文化底蘊深厚。 所以我們將以馬祖原鄉生活與文化特色為主，以馬祖四時記事、戰地馬祖及擺暝等三個主題，搭配繪本來創作故事箱，並巡迴分享故事箱主題，來推動閩東語教學的深化、族語傳承的活化以及在地文化的延展。 "},{"name":"手作記憶的味道—飲食文化與果醬抹刀的對話","category":"社造博覽會","url":"https://trello.com/c/vrfVyN5v/88-%E6%89%8B%E4%BD%9C%E8%A8%98%E6%86%B6%E7%9A%84%E5%91%B3%E9%81%93-%E9%A3%B2%E9%A3%9F%E6%96%87%E5%8C%96%E8%88%87%E6%9E%9C%E9%86%AC%E6%8A%B9%E5%88%80%E7%9A%84%E5%B0%8D%E8%A9%B1","desc":"中壢區 石刃手工刀（盧韻如） 手作記憶的味道— 飲食文化與果醬抹刀的對話 35\\.JPG 刀具是中壢三大地方產業之一，每一把刀，都見證著日常餐桌上的故事，我們吃的不只是食物，而是記憶的味道。一道菜，一個故事，交織出的是人生的溫度。臺灣物產豐饒，飲食文化深厚，承載的不僅是家鄉的滋味，更是工藝與產業的歷史記憶。 所以我們以「回溯記憶的味道 × 手作果醬抹刀」為主軸，串連飲食記憶、打鐵工藝與地方產業，透過三階段課程（飲食記憶分享、抹刀製作、果醬手作），引導參與者從個人經驗出發，深入理解中壢在地打鐵文化，並以創作轉化為可觸可感的文化器物，實踐生活中的工藝復興與文"},{"name":"初心純粹精忠山泉水","category":"社造博覽會","url":"https://trello.com/c/VHnWPdIY/100-%E5%88%9D%E5%BF%83%E7%B4%94%E7%B2%B9%E7%B2%BE%E5%BF%A0%E5%B1%B1%E6%B3%89%E6%B0%B4","desc":"龜山區 張孫宥心 初心純粹精忠山泉水 36\\.jpg 桃園龜山精忠里有一處山泉水的取水處，是熱心居民挖掘引流的虎頭山山泉水，水質純淨甘甜，吸引許多民眾前來取水，熱心民眾無償捐贈水塔，里長協助進行管理，因水量有限所以限制每人每日取水量，卻引來不同民眾的抨擊與遷怒，原先美意不料竟成為社區的爭端。 所以我們運用社造的方法，調查訪談了山泉水的故事以及社區居民的意見，並結合環境教育及科學課程，邀請親子學習運用現代科技來監測水質水位，一步步用民眾參與而非強制管理的方式讓居民討論這個議題，最後形成共識成為社區公約，落實了地方公共事務由居民參與自決的民主精神。 --- "},{"name":"流域心聲：正義伯公守護的家園-田調培力工作坊","category":"社造博覽會","url":"https://trello.com/c/J2rDdL5L/101-%E6%B5%81%E5%9F%9F%E5%BF%83%E8%81%B2%EF%BC%9A%E6%AD%A3%E7%BE%A9%E4%BC%AF%E5%85%AC%E5%AE%88%E8%AD%B7%E7%9A%84%E5%AE%B6%E5%9C%92-%E7%94%B0%E8%AA%BF%E5%9F%B9%E5%8A%9B%E5%B7%A5%E4%BD%9C%E5%9D%8A","desc":"平鎮區 社團法人宇宙地球村代間數位教育協會 流域心聲： 正義伯公守護的家園-田調培力工作坊 37\\.jpg 平鎮的伯公信仰，既是客家文化中與人們最親近的日常生活，同時也是先人遷徙墾植的見證者與田頭水尾的守護者，伯公信仰體現了先民與土地的緊密依存關係，鋪陳出常民文化生活的脈絡，是地方文史踏查的重要線索。而在平鎮快速都市化的變遷下，伯公信仰與地方文化的梳理，更是凝聚社區居民的重要工作。 所以我們以平鎮的正義伯公、信義福德祠為起點，透過一系列的田調培力與實地走訪，藉由收集居民的故事與口述歷史，從信仰連結到老街溪與新街溪的流域文化，以此來凝聚社區居民更多的在地情"},{"name":"南崁四社文化祭-南崁溪文史踏查","category":"社造博覽會","url":"https://trello.com/c/kLImcun0/102-%E5%8D%97%E5%B4%81%E5%9B%9B%E7%A4%BE%E6%96%87%E5%8C%96%E7%A5%AD-%E5%8D%97%E5%B4%81%E6%BA%AA%E6%96%87%E5%8F%B2%E8%B8%8F%E6%9F%A5","desc":"龜山區 桃園市文化創意觀光發展協會 南崁四社文化祭-南崁溪文史踏查 38\\.jpg 凱達格蘭族是臺灣原住民平埔族群之一，主要居住在桃園市龜山區、蘆竹區、八德區，包括龜崙社、南崁社、坑子社、霄裡社，稱為南崁四社。這些社群在清朝時受到漢人開墾的影響，族人逐漸改漢姓並與漢人通婚，族群的身影在漢化的影響下，今日的桃園已難覓其蹤跡。 所以我們從龜山的龜崙社頭目永媽隆與其兄長分鬮的古文書開始調查，並連結到龜崙社後裔參與自己文化的保存與傳承工作，進而將調查範圍擴大至蘆竹，引起南崁社及坑子社耆老的重視及參與，共同討論成立龜崙社文史館的可能及意願，希望子孫記得自己的族裔，"},{"name":"消失的大湖在哪裡？","category":"社造博覽會","url":"https://trello.com/c/1qEhzdPm/103-%E6%B6%88%E5%A4%B1%E7%9A%84%E5%A4%A7%E6%B9%96%E5%9C%A8%E5%93%AA%E8%A3%A1%EF%BC%9F","desc":"龜山區 翁建道 消失的大湖在哪裡？ 39\\.jpg 坪頂大湖開闢於清乾隆時期，於民國 70 年代後逐漸填平消失。占地超過 7 甲的大湖曾是過往龜山坪頂（今林口一部分）一地居民的共同記憶，它不僅提供田園灌溉及日常生活所需，更與清代漢人拓墾歷史息息相關，但隨著時間的流逝，坪頂人對大湖的記憶日漸模糊，不僅年輕一輩不瞭解，年長者對大湖的歷史亦陷於口耳相傳，以致眾說紛紜。 所以我們一方面進行史料蒐集與田野調查訪談，喚起坪頂老一輩居民對大湖的共同回憶，另外透過日治時期土地申告書、地圖及 50 年代航照圖再現大湖現今的地理位置。同時經由辦理研習、走讀、編輯手冊等讓在地"},{"name":"龜山風土色彩採集","category":"社造博覽會","url":"https://trello.com/c/L6klioFC/104-%E9%BE%9C%E5%B1%B1%E9%A2%A8%E5%9C%9F%E8%89%B2%E5%BD%A9%E6%8E%A1%E9%9B%86","desc":"龜山區 張浩鉅 龜山風土色彩採集 40\\.JPG 龜山區擁有豐富的山林、水文系統及人文資源，而這些資源同時也蘊含著豐富的色彩。近年來政府從中央到地方皆持續推動臺灣設計展、城市美學、校園美感設計等行動，而這些行動往往需要仰賴許多地方的元素，其中包含色彩。因此，一個屬於龜山地域風土的色彩採集行動油然而生！ 所以我們將從龜山的山林、水文及人文面向切入，並與大專院校的青年共同採集，培力認識地方的視野，同時形成教案進到地方小學進行色彩體驗課程，並辦理體驗課程給社區民眾參與，一步步發展出屬於龜山的色票，讓美感融入民眾日常以及校園生活當中，進而提升地方生活美學素養。 "},{"name":"一梱年的部落記憶-移動的文化","category":"成果報告","url":"https://trello.com/c/OSsW3F9m/64-%E4%B8%80%E6%A2%B1%E5%B9%B4%E7%9A%84%E9%83%A8%E8%90%BD%E8%A8%98%E6%86%B6-%E7%A7%BB%E5%8B%95%E7%9A%84%E6%96%87%E5%8C%96","desc":"一梱年的部落記憶－移動的文化 一、計畫基本資料 計畫年度： 110年 計畫類型： 社群培植 補助局處： 文化局 二、計畫主軸 本計畫以部落歷史、族語文學與移動記憶為核心，透過口述採集、文獻田野調查、小說創作、族語翻譯及部落記憶之旅，保存泰雅族部落的歷史事件、文化經驗與族群記憶。 三、執行內容 1. 部落口述採集與小說創作 執行期間： 110年1月至5月 執行場域： Gogan群流域部落 主要工作包括： 進行部落口述採風 蒐集地方文獻與歷史資料 進行小說文獻田野調查 以部落事件為素材進行小說創作 記錄耆老口述的歷史與生活經驗 2. 族語翻譯工作 執行期間："},{"name":"印象南崁-音樂藝術下鄉","category":"成果報告","url":"https://trello.com/c/cFLpl2XQ/65-%E5%8D%B0%E8%B1%A1%E5%8D%97%E5%B4%81-%E9%9F%B3%E6%A8%82%E8%97%9D%E8%A1%93%E4%B8%8B%E9%84%89","desc":"印象南崁－音樂藝術下鄉 一、計畫基本資料 計畫年度： 110年 計畫類型： 社群培植 補助局處： 文化局 執行團隊： 桃園市南崁兒童弦樂團協會 二、計畫理念 本計畫以「音樂做服務」為核心，透過舊樂器再利用、兒童弦樂培訓與社區公益演出，讓音樂走入南崁的校園、傳統市場與公共空間，推動「生活音樂、音樂生活」。 三、執行目標 1. 珍惜樂器，推動資源再利用 收集並整理舊提琴，讓閒置樂器重新被使用。 2. 打開民眾愛樂的心 招募學生、家長與成人參與弦樂團。 邀請音樂教師投入社區音樂教育。 3. 大手牽小手，讓音樂走入鄉里 透過市場演出與公益音樂會，讓音樂成為日常生"},{"name":"众製輿圖-女人遊開箱計畫","category":"成果報告","url":"https://trello.com/c/LIzEa2Ei/66-%E4%BC%97%E8%A3%BD%E8%BC%BF%E5%9C%96-%E5%A5%B3%E4%BA%BA%E9%81%8A%E9%96%8B%E7%AE%B1%E8%A8%88%E7%95%AB","desc":"眾製輿圖－女人遊開箱計畫 一、計畫基本資料 計畫年度： 110年 計畫類型： 社群培植 補助局處： 文化局 二、計畫理念 本計畫以「女性生命故事」為核心，透過兒童課程、在地女性訪談、影像紀錄、人物誌編輯與社區工作坊，認識不同世代女性的生活經驗與創業歷程。 計畫希望讓孩子重新認識家庭中的女性，也讓居民看見身邊默默投入地方、共同支撐城市生活的女性身影。 三、計畫目標 1. 引導兒童認識家庭女性的生活與角色。 2. 記錄在地不同世代女性的生命故事。 3. 以影像與文字保存地方生活記憶。 4. 促進受訪女性與社區居民交流。 5. 透過工作坊發展女性經驗與地方文化"},{"name":"做粿縛粽，過年過節-粿粄文化的轉譯與世代交流","category":"成果報告","url":"https://trello.com/c/WvX7Y41b/67-%E5%81%9A%E7%B2%BF%E7%B8%9B%E7%B2%BD%EF%BC%8C%E9%81%8E%E5%B9%B4%E9%81%8E%E7%AF%80-%E7%B2%BF%E7%B2%84%E6%96%87%E5%8C%96%E7%9A%84%E8%BD%89%E8%AD%AF%E8%88%87%E4%B8%96%E4%BB%A3%E4%BA%A4%E6%B5%81","desc":"做粿縛粽，過年過節 粿粄文化的轉譯與世代交流 一、計畫基本資料 計畫年度： 110年 計畫類型： 社群培植 補助局處： 文化局 二、計畫理念 本計畫以大溪傳統粿粄與米食文化為核心，透過田野調查、攤商訪談、影像記錄、米食地圖與文化講座，認識地方米食的製作技藝、生活記憶與節慶文化。 計畫希望將長輩與攤商累積的傳統手藝，轉化為年輕世代容易理解與參與的文化內容，促進粿粄文化的保存、轉譯與世代傳承。 三、執行內容 1. 疫情 習場域，透過長輩與學生共同參與，認識河川生態、環境議題與地方生活。 計畫希望將老街溪打造為全民可參與的生態戶外教室，讓不同世代從「認識河流」開始，進一步投入守護河川的行動。 三、計畫目標 1. 建立老街溪河川環境教育場域。 2. 促進長輩與學生跨世代共同學習。 3. 培養居民河川觀察與環境守護能力。 4. 建立社區、學校與河"},{"name":"樂活農場˙老幼共贏","category":"成果報告","url":"https://trello.com/c/wpO7oICO/209-%E6%A8%82%E6%B4%BB%E8%BE%B2%E5%A0%B4%CB%99%E8%80%81%E5%B9%BC%E5%85%B1%E8%B4%8F","desc":"樂活農場・老幼共贏 一、計畫基本資料 計畫年度： 111年 計畫類型： 社群培植 補助局處： 文化局 主要場域： 樂活農場、泉水窩江夏堂 DIY 教室 二、計畫緣起 本計畫延續110年度「樂活農場公園化」社區營造計畫，將樂活農場的行動延伸至附近幼兒園，推動長輩與幼兒共同學習、共同耕作。 計畫以樂活農場作為示範農園，招募社區樂齡居民組成「不老農耕隊」，由長輩帶領幼兒園師生進行農事、環境與生活文化學習，實踐： \u003e 老有所用，幼有所長，老幼共贏。 三、計畫目標 1. 建立長輩與幼兒共同學習的農事場域。 2. 組織社區樂齡居民成立不老農耕隊。 3. 提供退休及社"},{"name":"公民來做主 創聲在青埔","category":"成果報告","url":"https://trello.com/c/SnQghMFe/210-%E5%85%AC%E6%B0%91%E4%BE%86%E5%81%9A%E4%B8%BB-%E5%89%B5%E8%81%B2%E5%9C%A8%E9%9D%92%E5%9F%94","desc":"公民來做主・創聲在青埔 一、計畫基本資料 計畫年度： 111年 計畫類型： 社群培植 補助局處： 文化局 核心主題： 融合教育、多元文化、公共參與 主要場域： 桃園市中壢區青埔地區 二、計畫理念 本計畫以「融合教育」為倡議主題，透過居民招募、願景工作坊、Podcast、影像紀錄與創意宣傳冊，帶領青埔居民認識公共議題，學習如何提出倡議，並成為參與地方公共事務的行動公民。 計畫希望從居民的生活經驗出發，讓青埔展現多元、包容、友善與有愛的地方特色。 三、計畫目標 1. 了解什麼是倡議，以及為什麼需要倡議。 2. 認識由下而上的公共管理方式。 3. 聚焦「融合教"},{"name":"棲殘的竹圍","category":"成果報告","url":"https://trello.com/c/vm5gLGy4/211-%E6%A3%B2%E6%AE%98%E7%9A%84%E7%AB%B9%E5%9C%8D","desc":"棲殘的竹圍 計畫基本資料 項目 內容 計畫年度 111年 計畫類型 社群培植 補助局處 文化局 計畫核心 面對竹圍地區搬遷與重建，透過田野調查、居民訪談及社區支持行動，保存居民的生活記憶，陪伴搬遷戶與留居居民走過環境變動與心理調適的過程。 執行背景 本年度第一期志願搬遷補助金釋出後，搬遷與重建牽動居民生活。許多家庭面臨物品無法完整帶走、居住空間不足，以及對故園與生活記憶難以割捨等問題。 部分長者因不捨故居而選擇留下，也有搬遷後的居民因思念家園而感到不安與難過。團隊基於對家鄉與土地的情感，走訪竹圍大街小巷，進入居民家庭，透過田野調查了解居民的生活處境與情緒"},{"name":"龜山社造1.0","category":"成果報告","url":"https://trello.com/c/VfS6ijFN/212-%E9%BE%9C%E5%B1%B1%E7%A4%BE%E9%80%A010","desc":"龜山社造1.0 計畫基本資料 項目 內容 計畫年度 112年 計畫類型 社群培植 補助局處 文化局 執行單位 桃園市龜山區公所 計畫核心 以「山城、老街、磚窯、人文、社區、青年」為重要元素，從社區提案出發，串聯地方組織、學校、青年與公部門，推動龜山地方文化保存、青年參與及社區共創。 執行內容 一、十二棵老樹與過溪聚落 以過溪聚落的12棵老樹作為地方媒介，討論老樹與聚落生活、居民記憶及地方環境之間的關係，思考如何透過老樹保存與公共參與，重新認識過溪的地方特色。 二、青年運用閒置空間工作坊 邀請龜山在地夥伴及中國科技大學室內設計系兼任講師，分享日本與臺灣青年"},{"name":"走進新屋半農生活提案","category":"成果報告","url":"https://trello.com/c/JnVEzPjy/213-%E8%B5%B0%E9%80%B2%E6%96%B0%E5%B1%8B%E5%8D%8A%E8%BE%B2%E7%94%9F%E6%B4%BB%E6%8F%90%E6%A1%88","desc":"走進新屋半農生活提案 計畫基本資料 項目 內容 計畫年度 112年 計畫類型 社群培植 補助局處 青年事務局 執行團隊 屋蹟 計畫理念 新屋不只是旅遊目的地，也可以成為人們短期居住、創作、學習與生活的地方。 本計畫以「日、週、月」三種生活型態設計體驗遊程，讓參與者從短暫參訪開始，逐步建立與新屋土地、居民及生活的連結。 三種生活型態 一、日型態｜初步認識新屋 適合單日參訪的旅客，透過走讀與體驗認識新屋的聚落、農田、海岸與地方故事。 二、週型態｜發現生活連結 適合短期居住者，在單日遊程之外，進一步參與地方生活、農事體驗與社區活動，逐漸產生「想再來一次」的情感"},{"name":"東勢庄地方特色產業推廣-Q粄","category":"成果報告","url":"https://trello.com/c/39kE1ecW/214-%E6%9D%B1%E5%8B%A2%E5%BA%84%E5%9C%B0%E6%96%B9%E7%89%B9%E8%89%B2%E7%94%A2%E6%A5%AD%E6%8E%A8%E5%BB%A3-q%E7%B2%84","desc":"東勢庄地方特色產業推廣—Q粄 計畫基本資料 項目 內容 計畫年度 112年 計畫類型 社群培植 補助局處 文化局 計畫理念 以客家米食文化為核心，透過粄食製作、地方導覽、產品創新與包裝設計，將傳統手藝轉化為具有地方特色的產業，串聯客家飲食、聚落故事與農村小旅行。 計畫核心 客家米食 地方產業 技藝傳承 產品創新 導覽培訓 農村小旅行 推廣的五種Q粄 1. 紅粄 2. 草包 3. 水粄（蘿蔔糕） 4. 牛搵水 5. 客家大福 執行內容與時程 一、資源整合與工作規劃 7月4日 召開資源整合與海選會議，討論製作粄食種類，並遴選合作講師。 二、Q粄製作工作坊 日"},{"name":"珍愛桃園~中路埤圳文化新串聯","category":"成果報告","url":"https://trello.com/c/keWa6nhu/215-%E7%8F%8D%E6%84%9B%E6%A1%83%E5%9C%92%E4%B8%AD%E8%B7%AF%E5%9F%A4%E5%9C%B3%E6%96%87%E5%8C%96%E6%96%B0%E4%B8%B2%E8%81%AF","desc":"珍愛桃園～中路埤圳文化新串聯 計畫基本資料 項目 內容 計畫年度 112年 計畫類型 社群培植 補助局處 文化局 主要場域 桃園區中路地區埤塘與埤圳周邊 計畫理念 以中路地區的埤塘、埤圳、水圳聚落與地方生活為核心，串聯社區、居民、學校、公部門與青年團隊，保存水利文化及居民生活記憶，推動地方交流與社區永續發展。 一、社區網絡與社群培力 延續111年成立的「珍愛桃園～中路埤圳文化新串聯」LINE社群，持續邀請埤圳周邊新興社區及有志於社區營造的夥伴加入。 本年度另成立「中路埤塘社造塘小鴨班」群組，共59人，並首次有公寓大廈社區「洪國真愛社區」加入。 同時透過「"},{"name":"埤塘中的遺跡--塘涵，先民的水利結構","category":"成果報告","url":"https://trello.com/c/srqUr8Aj/216-%E5%9F%A4%E5%A1%98%E4%B8%AD%E7%9A%84%E9%81%BA%E8%B7%A1-%E5%A1%98%E6%B6%B5%EF%BC%8C%E5%85%88%E6%B0%91%E7%9A%84%E6%B0%B4%E5%88%A9%E7%B5%90%E6%A7%8B","desc":"埤塘中的遺跡——塘涵，先民的水利結構 計畫主題 透過埤塘文化生態導覽、塘涵模型復刻及實地安裝，認識桃園埤塘水利系統，理解先民運用石造塘涵調節水位、灌溉農田的生活智慧。 一、塘涵模型復刻活動 活動過程由講師一邊示範、一邊說明塘涵的構造與功能，並鼓勵學員參與： 回答講師提問 協助傳遞製作材料 觀察塘涵的結構與工法 動手完成塘涵模型 認識紅磚及石材在水利設施中的運用 活動最後，由講師將紅磚固定，完成塘涵復刻模型。學員也將自己製作的模型帶到實品前合影，留下學習紀錄。 二、埤塘文化生態導覽 參與者先到農場風雨教室集合，了解活動流程與塘涵的歷史演變。 導覽內容包括："},{"name":"點亮城市微光-下社172","category":"成果報告","url":"https://trello.com/c/78cVsnXP/217-%E9%BB%9E%E4%BA%AE%E5%9F%8E%E5%B8%82%E5%B 80%A0%E7%AD%96%E7%95%A5%E5%88%86%E6%9E%90","desc":""},{"name":"作者介紹","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/zbT3LAaA/142-%E4%BD%9C%E8%80%85%E4%BB%8B%E7%B4%B9","desc":"作者簡介 洪震宇 清華大學社會學碩士、政治大學社會系畢業。現為自由作家。 台灣少數連結人文與商業的創作者與實踐者。曾任《天下雜誌》副總編輯、創意總監，規劃過三一九鄉專輯；以及《GQ》國際中文版副總編輯。 長期推動風土節氣飲食、在地旅行與社區組織運作，2012年受邀於TED╳Taipei發表演說，曾獲選為《Shopping Design》2013年年度影響力人物，被稱為是「台灣新品種旅行設計師」。 目前致力於成為跨領域專業的溝通者，希望將複雜的事情變得簡單、有趣，更有深度。擔任跨專業領域培訓教練，引導企業、地方組織、公益團體、教育界與政府部門，培養故事力、"},{"name":"書名頁","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/n3LJIAWU/144-%E6%9B%B8%E5%90%8D%E9%A0%81","desc":"旅人的思維 當一個好奇的旅人，類似扮演一個人類學家，透過觀察與提問，追根究柢，從平凡中看到驚奇，才能找出在地的風土文化脈絡，以及讓人感興趣的亮點。 編劇的洞察 要培養編劇的洞察力，要先了解人與人的關係，人與物的關係，以及人與環境的關係，接著打散重組，讓原本的關係產生新意義，帶給人不同的感受。 導演的實踐 導演不是坐在導演椅上發號司令，而是要建立工作流程，並指導每個環節的演員，根據劇本賦予的任務，呈現各自的故事，同時還要溝通協調，掌握現場執行細節。 看到風，聽到土，你需要方向嗎？ 曾旭正（國立台南藝術大學教授、國發會前副主委） 台灣是個奇特的島嶼，地理多元"},{"name":"• 推薦：看到風，聽到土，你需要方向嗎？","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/VloXkNKd/177-%E6%8E%A8%E8%96%A6%EF%BC%9A%E7%9C%8B%E5%88%B0%E9%A2%A8%EF%BC%8C%E8%81%BD%E5%88%B0%E5%9C%9F%EF%BC%8C%E4%BD%A0%E9%9C%80%E8%A6%81%E6%96%B9%E5%90%91%E5%97%8E%EF%BC%9F","desc":"看到風,聽到土,你需要方向嗎? 曾旭正(國立台南藝術大學教授、國發會前副主委) 台灣是個奇特的島嶼,地理多元、物產豐富、生態複雜、人文薈萃、眾聲喧嘩,簡單地說,豐富多樣就是它的總體特徵。在這樣的土地社會中,要做設計既困難也容易! 容易的是,有諸多素材可以在各方面運用;難的是,不容易掌握核心、做得道地,在道地與創新之間又有許多抉擇不易。這在烹飪、服裝、產品設計、遊程規劃、環境營造、景觀設計乃至於各類的藝術創作中都面對相同的挑戰。近年來,因著社區營造打開了地方經營的問題意識,如何掌握一地的風土人情,說出動人的故事遂成為眾人的期盼,許多有志之士的共同摸索。 在"},{"name":"• 推薦：從思維開始改變，新方法翻轉地方","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/WsVmr7g9/176-%E6%8E%A8%E8%96%A6%EF%BC%9A%E5%BE%9E%E6%80%9D%E7%B6%AD%E9%96%8B%E5%A7%8B%E6%94%B9%E8%AE%8A%EF%BC%8C%E6%96%B0%E6%96%B9%E6%B3%95%E7%BF%BB%E8%BD%89%E5%9C%B0%E6%96%B9","desc":"從思維開始改變,新方法翻轉地方 余宛如(立法委員、生態綠共同創辦人) 震宇《風土經濟學》的出版可說正是時候,我在這本書裡,找到了很多共鸣,在閱讀的時候,許多年輕朋友的臉龐出現在腦海裡,這些不但是我熟悉的故事,也是一直激勵我推動地方創生的能量。 十幾年前,我走訪各地,看見偏鄉農民因為公平貿易而翻轉人生,下定決心把公平貿易帶來台灣,成立了華人世界第一家公平貿易公司「生態綠」,而開始跟社會企業結緣,因此有幸成為台灣第一個社會企業聚落的維運者,作為社會企業的加速基地,開始深度凝視台灣多元的社會企業個案,走入偏鄉,跟許多熱愛台灣土地的朋友作夥,互相砥礪。 因為經濟"},{"name":"• 推薦：立基於這座島嶼的風土實戰紀錄","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/9e9fOH4Z/175-%E6%8E%A8%E8%96%A6%EF%BC%9A%E7%AB%8B%E5%9F%BA%E6%96%BC%E9%80%99%E5%BA%A7%E5%B3%B6%E5%B6%BC%E7%9A%84%E9%A2%A8%E5%9C%9F%E5%AF%A6%E6%88%B0%E7%B4%80%E9%8C%84","desc":"立基於這座島嶼的風土實戰紀錄 王村煌(薰衣草森林董事長) 台灣終於有了一本屬於我們自己的地方創生方法論。 從社區總體營造到地方創生,台灣走過漫長的三十年時光,對於地方與故鄉,除了傳統 的人、文、地、產、景由下而上的了解、詮釋、認同之外,回到根本的經濟與人口問題構面,台灣的城鄉差距仍然在不斷的擴大,鄉村人口依然持續的老化與減少。 但是我們還是可以看見台灣有些地方,在這股洪流當中卻逆勢成長,不但居民的收入提升,年輕人返鄉成為一股地方的向上力量,更難能可貴的是漸漸朝地方品牌與地方光榮感前 台東的池上及台中的新社即是活生生的例子。 以我的家鄉台中新社為例,九二一"},{"name":"• 推薦：我們需要一百個洪震宇","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/Zp8ogoKB/174-%E6%8E%A8%E8%96%A6%EF%BC%9A%E6%88%91%E5%80%91%E9%9C%80%E8%A6%81%E4%B8%80%E7%99%BE%E5%80%8B%E6%B4%AA%E9%9C%87%E5%AE%87","desc":"推薦:我們需要一百個洪震宇 我們需要一百個洪震宇 沈方正(老爺酒店集團執行長) 閱讀好友洪震宇的書稿,在篇章問可說是點頭如搗蒜,心有戚戚焉。台灣近十年來觀光業突飛猛進,來華旅客人次由四百萬直上千萬,但是只創造了人數、產值、投資,卻沒有創造出「內容」。而國人國內旅遊次數也不斷更新,但是大多倚靠中央及地方政府放煙火式的辦活動、蓋天梯、蓋教堂、蓋步道………………,對台灣各地方可謂「創」而不「生」。 近兩年大陸旅客減少而觀光投資逆向增加,產業結構出現警訊,我一再呼籲正是我們停下來思考的時刻,地方觀光的發展是否應從量的提升轉換到質的改善。書中提到的風土設計、旅人思"},{"name":"• 前言：風土經濟學，創造台灣「一」的力量","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/g2Vgs29j/173-%E5%89%8D%E8%A8%80%EF%BC%9A%E9%A2%A8%E5%9C%9F%E7%B6%93%E6%BF%9F%E5%AD%B8%EF%BC%8C%E5%89%B5%E9%80%A0%E5%8F%B0%E7%81%A3%E3%80%8C%E4%B8%80%E3%80%8D%E7%9A%84%E5%8A%9B%E9%87%8F","desc":"前言:風土經濟學,創造台灣「一」的力量 風土經濟學,創造台灣「一」的力量 有一天,我接到某地方政府的邀約,希望為六十位科長級以上的公務人員導讀《獻米給教宗的男人》(ローマ法王に米を食べさせた男)一書。這本書是一位日本偏鄉的低階公務員高野誠鮮所寫,描述他如何透過各種創新行銷方式,扭轉偏鄉的命運。由於這位作者的態度、思維與方法,跟我的經驗有異曲同工之處,我為這本書撰寫推薦序,甚至拍攝推薦影片。 這是我第一次接到針對中高階主管公務人員的演講邀請,非常興奮,因為有機會深度交流,也期待他們能轉換思維,成為改變地方的推手。演講時,我決定不複述這本書的內容, 而是採用"},{"name":"第一部：風土如何經濟——機會與挑戰","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/mMn0xob5/172-%E7%AC%AC%E4%B8%80%E9%83%A8%EF%BC%9A%E9%A2%A8%E5%9C%9F%E5%A6%82%E4%BD%95%E7%B6%93%E6%BF%9F-%E6%A9%9F%E6%9C%83%E8%88%87%E6%8C%91%E6%88%B0","desc":""},{"name":"第1課 老風土，新商機","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/N7N0ThSL/171-%E7%AC%AC1%E8%AA%B2-%E8%80%81%E9%A2%A8%E5%9C%9F%EF%BC%8C%E6%96%B0%E5%95%86%E6%A9%9F","desc":"老風土,新商機 風土資源具備了哪些優勢?能帶動什麼樣的體驗經濟? 風土經濟學第1課的主題「老風土,新商機」,談的是看似很傳統的風土,在這個網路科技盛行、經濟變動快速的時代,憑什麼能為地方創造新商機? 在探究老風土要如何創造新商機之前,我們先研究一下,「風土」這兩個字到底有什麼深意?談及風土,歐美世界都會提到法文Terroir這個字,中文即翻譯為風土。這個名詞過去主要應用在葡萄酒產業,尤其是法國十多個產區的葡萄酒,Terroir意思是在特定地理空間限制下,這個地方獨有的氣候、土壤、溫度、品種與種植方式。 Terroir其實有政治介入的影響。法國政府透過組織"},{"name":"第2課 青年返鄉新挑戰","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/0XGvETU5/170-%E7%AC%AC2%E8%AA%B2-%E9%9D%92%E5%B9%B4%E8%BF%94%E9%84%89%E6%96%B0%E6%8C%91%E6%88%B0","desc":"青年返鄉新挑戰 返鄉青年面臨哪些接踵而來的挑戰?但看似龐大的問題不一定要馬上解決? 青年返鄉務農,從事社區工作,經營民宿、餐飲與生活空間,已經蔚為風潮。加上許多大學紛紛成立與在地連結的產學合作、人文創新中心,都是希望餐飲、觀光、設計、文創相關科系的學生,能夠參與社區合作,透過解決地方問題,達到學以致用的目的。 另外,這十年來,政府陸續推動各種計劃,例如農村再生、青年洄游,甚至是地方創生,經費不斷挹注在地方單位、顧問公司、學校組織與青年學生身上,想透過官方力量,改善城鄉差距日益龐大的問題。 由於我長期在台灣各地從事旅行規劃、顧問輔導與政府部門的評審工作,經"},{"name":"第3課 活化風土資源，複眼新視角","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/xlMT1fSa/169-%E7%AC%AC3%E8%AA%B2-%E6%B4%BB%E5%8C%96%E9%A2%A8%E5%9C%9F%E8%B3%87%E6%BA%90%EF%BC%8C%E8%A4%87%E7%9C%BC%E6%96%B0%E8%A6%96%E8%A7%92","desc":"第3課 活化風土資源,複眼新視角 Lesson 3 活化風土資源,複眼新視角 如何養成昆蟲般的複眼?如何同時扮演高空的老鷹,以及掘土的蚯蚓? 進入具體實踐之前,重要關鍵不在著手執行,而是我們的視野與想像力。 前提是我們的視野是否夠寬闊,視角是否多樣化,才能重新看待既熟悉又陌生的家鄉, 究竟是荒原,還是花園。發現自己的特色與優勢後,接著才能進一步思考,如何運用不同的視角與思考脈絡,檢視我們家鄉與事業現有的風土資源,沒資源如何創造資源,有資源如何整合資源,誘發更多可能。 成為風土設計師最重要的先決條件,就是擁有多樣化的視角。這就像是昆蟲的複眼,藉以同時檢視與"},{"name":"第二部：風土如何設計——風土經濟學基礎工程","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/kEr7W8ps/168-%E7%AC%AC%E4%BA%8C%E9%83%A8%EF%BC%9A%E9%A2%A8%E5%9C%9F%E5%A6%82%E4%BD%95%E8%A8%AD%E8%A8%88-%E9%A2%A8%E5%9C%9F%E7%B6%93%E6%BF%9F%E5%AD%B8%E5%9F%BA%E7%A4%8E%E5%B7%A5%E7%A8%8B","desc":""},{"name":"● 風土設計方法論（一）旅人的思維","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/VXSmVzmm/167-%E2%97%8F-%E9%A2%A8%E5%9C%9F%E8%A8%AD%E8%A8%88%E6%96%B9%E6%B3%95%E8%AB%96%EF%BC%88%E4%B8%80%EF%BC%89%E6%97%85%E4%BA%BA%E7%9A%84%E6%80%9D%E7%B6%AD","desc":""},{"name":"第4課 旅人的思維（1）——成為客觀的人類學家","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/GIzA0xzl/166-%E7%AC%AC4%E8%AA%B2-%E6%97%85%E4%BA%BA%E7%9A%84%E6%80%9D%E7%B6%AD%EF%BC%881%EF%BC%89-%E6%88%90%E7%82%BA%E5%AE%A2%E8%A7%80%E7%9A%84%E4%BA%BA%E9%A1%9E%E5%AD%B8%E5%AE%B6","desc":"第4課旅人的思維(1)--成為客觀的人類... Lesson 4 旅人的思維(1) ——————成為客觀的人類學家 要如何在尋常生活裡,扮演充滿熱情且追根究柢的人類學家? 前三堂課,我們談的是風土經濟學的機會與挑戰,教大家運用不同的視角與思考脈絡, 檢視家鄉與事業現有的風土資源,透過重組與整合,創造更多資源。 接下來會聚焦在「風土如何設計」,這是風土經濟學的基礎工程,將以七堂課來說明。我將風土設計歸納成三個階段,也就是:旅人的思維、編劇的洞察,以及導演的實踐。透過具體的案例與方法,有步驟地分析與拆解,帶領大家思考,如何將風土資源轉換成經濟商機。 設計是什"},{"name":"第5課 旅人的思維（2）——感受旅人的感受","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/DO94pvdS/165-%E7%AC%AC5%E8%AA%B2-%E6%97%85%E4%BA%BA%E7%9A%84%E6%80%9D%E7%B6%AD%EF%BC%882%EF%BC%89-%E6%84%9F%E5%8F%97%E6%97%85%E4%BA%BA%E7%9A%84%E6%84%9F%E5%8F%97","desc":"Lesson 5 旅人的思維(2) ——————感受旅人的感受 先當旅人,才能了解旅人?自己被感動,才知道如何感動他人? 上一堂課討論的是讓自己像一個好奇的旅人,運用人類學的思維,在熟悉的環境中,轉換角度找到風土資源的亮點。對於重視消費者、使用者需求的當代商業創新來說,人類學是一門顯學,能幫助我們突破表象,掌握背後的深層內涵。而其中的關鍵,就是脈絡思考。 脈絡是什麼呢?脈絡是時間與空間交織而成的情境,脈絡思考就是觀察現象、掌握細節之後,能夠退一步思考,了解這些事情、行為與想法,是在什麼時空環境下發生的。只要掌握脈絡,就有創新的可能性。 把脈絡思考的方法運"},{"name":"第6課 旅人的思維（3）——建立外來者與在地人的雙贏","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/apQvAv46/164-%E7%AC%AC6%E8%AA%B2-%E6%97%85%E4%BA%BA%E7%9A%84%E6%80%9D%E7%B6%AD%EF%BC%883%EF%BC%89-%E5%BB%BA%E7%AB%8B%E5%A4%96%E4%BE%86%E8%80%85%E8%88%87%E5%9C%A8%E5%9C%B0%E4%BA%BA%E7%9A%84%E9%9B%99%E8%B4%8F","desc":"第6課 旅人的思維（3）——建立外來者與在地人的雙贏 這有兩個問題。第一，免費未必是好事，可能會吸引不對的人，反而浪費資源，也無法達到效果。第二，對自己的家鄉沒有信心，政府資源就得不斷投入，像個無底洞，產生負向循環。 如果找到滿足市場的需求，以及解決旅宿業者的痛點，自然就會有故事號召力，建立市場與地方的雙贏。 我一開始也沒有什麼好點子，當沒有靈感想法時，與其坐在辦公桌上想點子，不如就用腳思考——去現場了解狀況，才能刺激想法。我先去拜訪有個農村，對象主要是在經營民宿、茶園、果園、糕餅製造及餐飲業者。 我先走訪一家位在負責照顧的民宿，民宿老闆需要整理房間、庭"},{"name":"● 風土設計方法論（二）編劇的洞察","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/o0GyDYQL/163-%E2%97%8F-%E9%A2%A8%E5%9C%9F%E8%A8%AD%E8%A8%88%E6%96%B9%E6%B3%95%E8%AB%96%EF%BC%88%E4%BA%8C%EF%BC%89%E7%B7%A8%E5%8A%87%E7%9A%84%E6%B4%9E%E5%AF%9F","desc":""},{"name":"第7課 編劇的洞察（1）——洞察亮點","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/tYHTVLt2/162-%E7%AC%AC7%E8%AA%B2-%E7%B7%A8%E5%8A%87%E7%9A%84%E6%B4%9E%E5%AF%9F%EF%BC%881%EF%BC%89-%E6%B4%9E%E5%AF%9F%E4%BA%AE%E9%BB%9E","desc":"第7課 編劇的洞察（1）——洞察亮點 編劇的洞察（1）——洞察亮點 要怎麼找出地方的亮點？如何培養敏銳的洞察能力？ 風土設計前三堂課，強調「旅人的思維」，讓自己在現場永遠充滿好奇，同時要站在旅人的立場，感受旅人的需求，創造在地的風土體驗。接下來這兩堂課，進入「編劇的洞察」主題。這是一個關鍵點，要從以旅人思維來取到的田野調查資料，洞察出獨特亮點，才能轉換成有趣的規劃內容，帶來驚奇與感動。 編劇的洞察有兩個層次：先透過洞察找到創意，接著規劃出讓旅人體驗感受的故事劇本。就像唯有先完成精彩的舞台劇劇本，才能讓團隊在風土舞台上充分發揮，更而創造體驗經濟。 這堂課，"},{"name":"第8課 編劇的洞察（2）——串連亮點","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/JjHjL9p4/161-%E7%AC%AC8%E8%AA%B2-%E7%B7%A8%E5%8A%87%E7%9A%84%E6%B4%9E%E5%AF%9F%EF%BC%882%EF%BC%89-%E4%B8%B2%E9%80%A3%E4%BA%AE%E9%BB%9E","desc":"第8課 編劇的洞察 (2) ——串連亮點 編劇的洞察 (2) ——串連亮點 如何讓旅人放大感官，看到、聞到、聽到、嗅到與觸摸到在地氛圍情境？ 上一堂課主題「編劇的洞察 (1)：討論發掘家鄉風土優勢之後，要運用編劇的洞察能力，先找出不同亮點，設計出讓人難忘的體驗內容。這一堂的主題，要帶大家思考，如何將洞察到的新特色，像一名編劇一樣，整合串連這些亮點，編寫出讓旅人體驗感受的故事劇本，可以讓你的團隊、樂觀扮演不同角色，並根據劇本來演練多樣，才能在這個風土舞台上，做出最自然生動的演出呢？ 我們在第1課「老風土，新橋樑」提到經濟發展模式金字塔，底層的商品經濟是銷售"},{"name":"● 風土設計方法論（三）導演的實踐","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/KXYy4xOy/159-%E2%97%8F-%E9%A2%A8%E5%9C%9F%E8%A8%AD%E8%A8%88%E6%96%B9%E6%B3%95%E8%AB%96%EF%BC%88%E4%B8%89%EF%BC%89%E5%B0%8E%E6%BC%94%E7%9A%84%E5%AF%A6%E8%B8%90","desc":""},{"name":"第9課 導演的實踐（1）——幕後的導演","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/FT3tZCzI/160-%E7%AC%AC9%E8%AA%B2-%E5%B0%8E%E6%BC%94%E7%9A%84%E5%AF%A6%E8%B8%90%EF%BC%881%EF%BC%89-%E5%B9%95%E5%BE%8C%E7%9A%84%E5%B0%8E%E6%BC%94","desc":"第9課 導演的實踐 (1) ——幕後的導演 導演的實踐 (1) ——幕後的導演 導演並不是坐在導演椅上發號施令？導演角色更重要的是執行力？ 這一堂課的主題「導演的實踐 (1)」，要帶大家一起思考，當規劃出吸引人的行程之後，該如何具體落實？你是風土經濟的設計師、規劃者，更是一位落實理念的實踐行動者，就像導演一樣，根據劇本內容，把每個環節做好，每個演員各司其職，才能做出一場精彩的風土舞台劇。 導演是風土經濟學中最重要的激波事務。要把故事說好，必須兼具多樣化的視角，也就是第3課提到的「複製新視角」。風土設計師需要具備四個複製新視角，要同時擁有家鄉的局內人員局外"},{"name":"第10課 導演的實踐（2）——幕前的帶路人","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/9negI5zw/158-%E7%AC%AC10%E8%AA%B2-%E5%B0%8E%E6%BC%94%E7%9A%84%E5%AF%A6%E8%B8%90%EF%BC%882%EF%BC%89-%E5%B9%95%E5%89%8D%E7%9A%84%E5%B8%B6%E8%B7%AF%E4%BA%BA","desc":"第10課 導演的實踐 (2) ——幕前的帶路人 導演的實踐 (2) ——幕前的帶路人 帶路人就是一個穿著女兒服的主持人，但緊密處打在地方業者與小農身上？ 上一堂「導演的實踐 (1)」所採訪的主題是：如果你的合作夥伴、你的事業團隊像個劇團，地方員上就是你們的舞台；而你這位規劃者，宛如一位幕後的導演，必須兼具局內人員局外人雙重視野、策略網與執行端兩種立場角度，才能帶領團隊完成精彩演出。 這一堂課的主題「導演的實踐 (2)」，要帶大家討論的是，風土舞台上，除了每位演員各司其職，負責串聯的帶路人更具負責任。帶路人的角色跟傳統導遊不同，體驗旅程需要一個中介者，他更"},{"name":"第三部：風土如何感動——風土設計實戰篇","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/kLFIVQBK/157-%E7%AC%AC%E4%B8%89%E9%83%A8%EF%BC%9A%E9%A2%A8%E5%9C%9F%E5%A6%82%E4%BD%95%E6%84%9F%E5%8B%95-%E9%A2%A8%E5%9C%9F%E8%A8%AD%E8%A8%88%E5%AF%A6%E6%88%B0%E7%AF%87","desc":""},{"name":"第11課 設計餐廳民宿的風土餐桌（1）","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/exmfTaxA/156-%E7%AC%AC11%E8%AA%B2-%E8%A8%AD%E8%A8%88%E9%A4%90%E5%BB%B3%E6%B0%91%E5%AE%BF%E7%9A%84%E9%A2%A8%E5%9C%9F%E9%A4%90%E6%A1%8C%EF%BC%881%EF%BC%89","desc":"第11課 設計餐廳民宿的風土餐桌 (1) 風土餐桌為何是風土經濟學的核心與縮影？主題與答案為何要走出舒適圈？ 第三部分的主題「風土如何感動——風土設計實戰篇」，將以五個教學與規劃與執行的簡案，分成三個主題，討論如何設計讓人難忘的深度體驗。 這一堂課將帶大家一起思考，一家餐廳、一間民宿，如何設計出具在地特色、又有故事的風土餐桌，廚師、設計者、管家都要如何密切合作，創造感動與回憶。 旅人遠道而來，觀察景深，日後展演神樂道的，往往不是大山大水的壯麗風景，不是大魚大肉的高檔食材，而是在地的風土飲食與人情故事。那可能是在某個偶然情境下，吃到的幾道在地料理，聽說的在"},{"name":"第12課 設計餐廳民宿的風土餐桌（2）","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/qzg8fIcl/155-%E7%AC%AC12%E8%AA%B2-%E8%A8%AD%E8%A8%88%E9%A4%90%E5%BB%B3%E6%B0%91%E5%AE%BF%E7%9A%84%E9%A2%A8%E5%9C%9F%E9%A4%90%E6%A1%8C%EF%BC%882%EF%BC%89","desc":"第12課 設計餐廳民宿的風土餐桌 (2) 當在地食材成為尋常必備招牌，什麼才是進一步打動人心的關鍵？ 對於專程而來、充滿期待的旅人來說，風土餐桌是最容易滿足五感觸感的饗宴。而好食材、好料理、好故事，是風土餐桌的最佳核心。 我有位身為企業董事長的朋友，因為聽了某家中部民宿主人的創業演講，非常感動，決定親自前往那家民宿，感受在地文化與熱情。雖然是在傳統三合院享用晚餐，吃的是以在地食材做成的便當，但菜色滋味普遍，民宿員工說菜時，表達方式生硬，像是對面出來的，無法引起共鳴，跟他認識的感受有明顯落差，內心很是失望。隔天退房後，他四處走走，在附近遇到一位剛入飯館的中"},{"name":"第13課 鄉鎮村落如何設計自己的風土餐桌","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/ZVVgCLpM/154-%E7%AC%AC13%E8%AA%B2-%E9%84%89%E9%8E%AE%E6%9D%91%E8%90%BD%E5%A6%82%E4%BD%95%E8%A8%AD%E8%A8%88%E8%87%AA%E5%B7%B1%E7%9A%84%E9%A2%A8%E5%9C%9F%E9%A4%90%E6%A1%8C","desc":"第13課 鄉鎮村落如何設計自己的風土餐桌 空間與時間，如何讓風土餐桌變得獨一無二？ 前面就講帶大家討論，一家餐廳、一間民宿，如何設計出具在地特色、又有故事的風土餐桌？廚師、說菜者、設計者這三方，要如何密切合作，創造旅人難忘的感動與回憶。 這一堂課把範圍拉大，一個社區、一個村落、甚至一個鄉鎮，要如何整合資源，設計具有生活、生產與生態特色的風土餐桌。創造家鄉的風土經濟？我將以兩個角度來討論小村鄉鎮的風土餐桌。一個是如何重新整合原有的風土資源，透過在地空間，讓旅人實踐體驗地的生活樣貌。另一個角度是善用家鄉的傳統節慶活動，讓風土餐桌的體驗內容更豐富有趣。 上鄉歌"},{"name":"第14課 設計深度體驗的風土旅行（1）","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/HmaXbaQ0/153-%E7%AC%AC14%E8%AA%B2-%E8%A8%AD%E8%A8%88%E6%B7%B1%E5%BA%A6%E9%AB%94%E9%A9%97%E7%9A%84%E9%A2%A8%E5%9C%9F%E6%97%85%E8%A1%8C%EF%BC%881%EF%BC%89","desc":"第14課 設計深度體驗的風土旅行 (1) 看似面貌模糊、人際網絡疏離的鄉鎮，怎麼找出亮點，凝聚力量？ 上一堂課的主題，是思索如何設計自己的風土餐桌，接下來兩堂課的主題，則是擴大範圍，討論如何用更多個特色餐桌，不同體驗內容，帶動一個小地方的風土經濟。我會從風土設計的基礎工程出發，包括旅人的思維、編劇的洞察與導演的實踐，一步步闡述，如何讓一個平凡的小地方，創造出自己的價值。 這堂課先分享由我規劃的新北市雙溪旅行經驗。雙溪在在新北市瑞芳，鄰近九份奧金瓜石，是一個容易被忽略的地方，還經常被誤會是以鐵路與天燈間名、吸引許多觀光客的平溪。相對於九份、平溪的熱鬧繁盛，"},{"name":"第15課 設計深度體驗的風土旅行（2）","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/CMjGYITp/152-%E7%AC%AC15%E8%AA%B2-%E8%A8%AD%E8%A8%88%E6%B7%B1%E5%BA%A6%E9%AB%94%E9%A9%97%E7%9A%84%E9%A2%A8%E5%9C%9F%E6%97%85%E8%A1%8C%EF%BC%882%EF%BC%89","desc":"第15課 設計深度體驗的風土旅行 (2) 例如從大陸西線來布袋、從事到日餐館的長花，她在大陸從沒有過海，也不會游泳，從沒想過自己有一天會每日與海為伍。她的公婆較傳統，只把網頁給人描繪，即使有情不好，也只能接受大量簡報出的條件。長花夫妻開始思考如何分散風險，她想要轉型，希望藉由這次課程找到方向。 第二次課程練習出野調查。當一個好奇的人類學家，要學習深度訪談與察言觀色，才能摸索出隱藏的故事，最後必須整理訪談重點，並找出亮點。 第三次課程：我們親身拜訪產地，觀察細節、挖掘故事，最後再回到課堂上，討論重點特色。例如我們到從事生態養殖的風日魚場，魚場主人邱經美帶我"},{"name":"第四部：風土如何創新——通往過去，就能創造未來","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/JZNGwjYy/151-%E7%AC%AC%E5%9B%9B%E9%83%A8%EF%BC%9A%E9%A2%A8%E5%9C%9F%E5%A6%82%E4%BD%95%E5%89%B5%E6%96%B0-%E9%80%9A%E5%BE%80%E9%81%8E%E5%8E%BB%EF%BC%8C%E5%B0%B1%E8%83%BD%E5%89%B5%E9%80%A0%E6%9C%AA%E4%BE%86","desc":""},{"name":"第16課 芋頭四兄弟，風土設計品牌學","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/8Ly69UI1/150-%E7%AC%AC16%E8%AA%B2-%E8%8A%8B%E9%A0%AD%E5%9B%9B%E5%85%84%E5%BC%9F%EF%BC%8C%E9%A2%A8%E5%9C%9F%E8%A8%AD%E8%A8%88%E5%93%81%E7%89%8C%E5%AD%B8","desc":""},{"name":"第17課 活化既有，創造真實體驗——拿山刀的風土設計師","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/syQXnx5R/149-%E7%AC%AC17%E8%AA%B2-%E6%B4%BB%E5%8C%96%E6%97%A2%E6%9C%89%EF%BC%8C%E5%89%B5%E9%80%A0%E7%9C%9F%E5%AF%A6%E9%AB%94%E9%A9%97-%E6%8B%BF%E5%B1%B1%E5%88%80%E7%9A%84%E9%A2%A8%E5%9C%9F%E8%A8%AD%E8%A8%88%E5%B8%AB","desc":"第17課 活化既有，創造真實體驗——拿山刀的風土設計師 深山田野看似資源匱乏，卻可能擁有最豐富且獨特的風土經濟條件？ 這堂課的主題「活化既有，創造真實體驗」，將帶著大家討論，看似沒有特色的家鄉，要如何活化既有，無中生有？消費者真的需要美貌美的硬體建設嗎？他們內心到底想要什麼？ 風土經濟學強調，在這個人入選用網路科技的「快經濟」時代下，小鎮農村要突顯「慢經濟」的魅力，透過體驗經濟創造自己的地方價值。當世界一直推陳出新，不斷興建大硬體、大建設，在過度包裝、眼花撩亂的訊息中，人們越來越渴望擁有真實感，這種需求可以說是一種鄉愁，而這種真實感，是對生活、生產與生態"},{"name":"第18課 青年返鄉，風土再設計——風土創業的時代","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/69ogt2xd/148-%E7%AC%AC18%E8%AA%B2-%E9%9D%92%E5%B9%B4%E8%BF%94%E9%84%89%EF%BC%8C%E9%A2%A8%E5%9C%9F%E5%86%8D%E8%A8%AD%E8%A8%88-%E9%A2%A8%E5%9C%9F%E5%89%B5%E6%A5%AD%E7%9A%84%E6%99%82%E4%BB%A3","desc":"第18課 青年返鄉，風土再設計——風土創業的時代 返鄉創業，如何透過再設計，讓自己成為一個地方的人口與平台？ 青年返鄉，或是投身自己喜愛的地方，讓他做成為創業的故鄉，是近年正熱的風潮。這堂課要帶著大家討論，青年返鄉無視地方文化與經濟，需要具備的風土設計思維。 第一步先聚焦：從小範圍做起，再一步步挖掘與整合地方資源，慢慢擴大影響力，並善用年輕人對外溝通連結的社群經營能力，才能創造地方、文化與個人事業三流的風土經濟。 風土經濟學並不追求大眾市場，而是專注於眾市場。大眾市場追求快速、平價與便利，分眾市場則是重視深度的溝通對話，找尋重視獨特性、細膩感受與深度體驗"},{"name":"第19課 小，更有力量——創造獨一無二的風土經濟學","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/ZnqKShJf/147-%E7%AC%AC19%E8%AA%B2-%E5%B0%8F%EF%BC%8C%E6%9B%B4%E6%9C%89%E5%8A%9B%E9%87%8F-%E5%89%B5%E9%80%A0%E7%8D%A8%E4%B8%80%E7%84%A1%E4%BA%8C%E7%9A%84%E9%A2%A8%E5%9C%9F%E7%B6%93%E6%BF%9F%E5%AD%B8","desc":"好的，這是您要求的完整中文內容： 第19課 小，更有力量——創造獨一無二的風土經濟學 擁有奢華設施與周全服務的虛擬風土，卻可能缺少了關鍵的元素？ 風土經濟學不是封閉在特定地域，也非固守老舊傳統，而是與時俱進，具有網路時代的開放精神。 從人類學角度，每個鄉鎮農村都是一個部落，有獨特的飲食習慣、風俗文化、生產方式與信仰體係，更因此具備微型的風土特色。跟許多大型城市相比，這些看似遙遠的農村小鎮，反而保留更多、更完整的在地特色。 然而，許多奢華的飯店、民宿或莊園Villa，只是把風土當作流行風尚，打造封閉式的虛擬實境，風土只是背景與包裝，缺乏實質的情境、情節與情"},{"name":"第20課 是創生還是創傷？我們與理想的距離","category":"風土經濟學：地方創生的21堂風土設計課","url":"https://trello.com/c/2v14wIV5/146-%E7%AC%AC20%E8%AA%B2-%E6%98%AF%E5%89%B5%E7%94%9F%E9%82%84%E6%98%AF%E5%89%B5%E5%82%B7%EF%BC%9F%E6%88%91%E5%80%91%E8%88%87%E7%90%86%E6%83%B3%E7%9A%84%E8%B7%9D%E9%9B%A2","desc":"好的，以下是您要求的完整中文內容： 第20課 是創生還是創傷？我們與理想的距離 是創生還是創傷？我們與理想的距離 要如何將挫折變成轉折，得到那枚真正的勳章？ 在地方工作並不比在企業內任職輕鬆。因為人少、資源少，要做的事情卻不少，尤其當事情摻雜了人情，是助力，也可能是阻力，往往讓簡單事情複雜化，很難只用理性邏輯與效率來溝通與執行。 對於地方工作者來說，除了熱情與使命，也 const favKey="communityLauncherFavorites",recentKey="communityLauncherRecent";
let active="全部",onlyFav=false,favs=JSON.parse(localStorage.getItem(favKey)||"[]"),recent=JSON.parse(localStorage.getItem(recentKey)||"[]");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const shortUrl=u=>u.replace(/\/.*$/,"");
const cats=document.querySelector("#filters"),grid=document.querySelector("#grid"),query=document.querySelector("#q");
document.querySelector("#total").textContent=cards.length;document.querySelector("#catTotal").textContent=categories.length;
function categoryCounts(){return Object.fromEntries(categories.map(c=>[c,cards.filter(x=>x.category===c).length]))}
const counts=categoryCounts();
cats.innerHTML=["全部",...categories].map(c=>'<button class="filter" type="button" data-category="'+esc(c)+'" aria-pressed="'+(c==="全部")+'">'+esc(c)+' <small>'+(c==="全部"?cards.length:counts[c]||0)+'</small></button>').join("");
cats.addEventListener("click",e=>{const b=e.target.closest("[data-category]");if(!b)return;active=b.dataset.category;cats.querySelectorAll(".filter").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
document.querySelector("#showFav").addEventListener("click",e=>{onlyFav=!onlyFav;e.currentTarget.classList.toggle("secondary",!onlyFav);e.currentTarget.textContent=onlyFav?"⭐ 顯示全部":"⭐ 只看收藏";render()});
document.querySelector("#clearRecent").addEventListener("click",()=>{recent=[];localStorage.setItem(recentKey,"[]");renderRecent()});
query.addEventListener("input",render);
function renderRecent(){const el=document.querySelector("#recent");const items=recent.map(id=>cards.find(c=>c.url===id)).filter(Boolean).slice(0,8);el.innerHTML=items.length?items.map(c=>'<a href="'+esc(c.url)+'" target="_blank" rel="noopener" data-open="'+esc(c.url)+'">'+esc(c.name)+'</a>').join(""):'<p class="empty">點開任一 Trello 卡片後，這裡會顯示最近開啟項目。</p>'}
function render(){const q=query.value.trim().toLocaleLowerCase();const matches=cards.filter(c=>(active==="全部"||c.category===active)&&(!onlyFav||favs.includes(c.url))&&(!q||(c.name+" "+c.desc+" "+c.category).toLocaleLowerCase().includes(q)));document.querySelector("#favTotal").textContent=favs.length;grid.innerHTML=matches.length?matches.map(c=>'<article class="card"><div class="card-head"><div><div class="name">'+esc(c.name)+'</div><span class="category">'+esc(c.category)+'</span></div><button class="star '+(favs.includes(c.url)?"active":"")+'" type="button" aria-label="收藏 '+esc(c.name)+'" data-star="'+esc(c.url)+'">'+(favs.includes(c.url)?"★":"☆")+'</button></div><p class="detail">'+esc(c.desc||"點擊下方按鈕查看 Trello 卡片內容。")+'</p><div class="actions"><a href="'+esc(c.url)+'" target="_blank" rel="noopener" data-open="'+esc(c.url)+'">🔗 開啟 Trello 卡片</a></div></article>').join(""):'<div class="empty-grid">沒有符合條件的卡片，試試其他關鍵字或分類。</div>'}
grid.addEventListener("click",e=>{const star=e.target.closest("[data-star]");if(star){const id=star.dataset.star;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];localStorage.setItem(favKey,JSON.stringify(favs));render();return}const open=e.target.closest("[data-open]");if(open){const id=open.dataset.open;recent=[id,...recent.filter(x=>x!==id)].slice(0,12);localStorage.setItem(recentKey,JSON.stringify(recent));setTimeout(renderRecent,0)}});
document.querySelector("#recent").addEventListener("click",e=>{const a=e.target.closest("[data-open]");if(!a)return;const id=a.dataset.open;recent=[id,...recent.filter(x=>x!==id)].slice(0,12);localStorage.setItem(recentKey,JSON.stringify(recent));setTimeout(renderRecent,0)});
render();renderRecent();
</script></body></html>
