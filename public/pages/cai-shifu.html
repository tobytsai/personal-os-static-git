let selected="全部",term="";
const favoritesKey="caiShifuLauncherFavorites",recentKey="caiShifuLauncherRecent";
const favs=()=>JSON.parse(localStorage.getItem(favoritesKey)||"[]");
const recents=()=>JSON.parse(localStorage.getItem(recentKey)||"[]");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function store(key,value){localStorage.setItem(key,JSON.stringify(value))}
function toggleFavorite(i){const f=favs();const next=f.includes(i)?f.filter(x=>x!==i):[...f,i];store(favoritesKey,next);render()}
function openProduct(i){const r=recents().filter(x=>x!==i);store(recentKey,[i,...r].slice(0,8));renderShelves()}
function showInfo(i){const p=PRODUCTS[i];document.getElementById("dialogTitle").textContent=p.name;document.getElementById("dialogTag").textContent=p.category;document.getElementById("dialogText").textContent=p.summary||"這張 Trello 產品卡目前沒有文字摘要。開啟卡片可查看工作室後續補充的裱框參考與內容。";document.getElementById("dialogLink").href=p.url;document.getElementById("dialogLink").style.display="inline-flex";document.getElementById("modal").classList.add("show")}
function renderShelves(){const f=favs(),r=recents();const fill=(id,items,empty)=>{const el=document.getElementById(id);el.innerHTML=items.length?items.map(i=>'<a class="mini" href="'+esc(PRODUCTS[i].url)+'" target="_blank" rel="noopener" onclick="openProduct('+i+')">'+esc(PRODUCTS[i].name)+' ↗</a>').join(""):'<span class="empty">'+empty+'</span>'};fill("favorites",f,"收藏的產品會列在這裡。");fill("recent",r,"開啟產品卡後，最近使用項目會列在這裡。")}
function render(){const f=document.getElementById("filters");f.innerHTML=cats.map(c=>'<button class="filter '+(selected===c?"active":"")+'" onclick="setCategory('+JSON.stringify(c)+')">'+esc(c)+(c==="全部"?" · "+PRODUCTS.length:"")+'</button>').join("");const filtered=PRODUCTS.map((p,i)=>({...p,i})).filter(p=>(selected==="全部"||p.category===selected)&&(!term||(p.name+" "+p.category+" "+p.summary).toLowerCase().includes(term.toLowerCase())));document.getElementById("count").textContent="顯示 "+filtered.length+" / "+PRODUCTS.length+" 張";document.getElementById("cards").innerHTML=filtered.length?filtered.map(p=>'<article class="product" style="--tint:'+colorFor(p.category)+'"><div class="product-top"><span class="tag">'+esc(p.category)+'</span><button class="star '+(favs().includes(p.i)?"on":"")+'" aria-label="收藏 '+esc(p.name)+'" title="收藏" onclick="toggleFavorite('+p.i+')">'+(favs().includes(p.i)?"★":"☆")+'</button></div><h3>'+esc(p.name)+'</h3><div class="card-actions"><a class="open" href="'+esc(p.url)+'" target="_blank" rel="noopener" onclick="openProduct('+p.i+')">開啟 Trello ↗</a><button class="question" aria-label="說明 '+esc(p.name)+'" title="產品說明" onclick="showInfo('+p.i+')">？</button></div></article>').join(""):'<div class="nothing">找不到符合條件的產品，試試其他關鍵字或分類。</div>';renderShelves()}
function colorFor(c){return c==="畫作與書藝"?"#e6ddff":c==="親子與紀念"?"#ffe4dc":c==="運動與娛樂"?"#d8efff":"#fff0bf"}
function setCategory(c){selected=c;render()}
document.getElementById("search").addEventListener("input",e=>{term=e.target.value;render()});
document.getElementById("close").onclick=()=>document.getElementById("modal").classList.remove("show");
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")e.currentTarget.classList.remove("show")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("modal").classList.remove("show")});
document.getElementById("helpAll").onclick=()=>{document.getElementById("dialogTitle").textContent="怎麼使用蔡師傅裱框啟動器？";document.getElementById("dialogTag").textContent="快速說明";document.getElementById("dialogText").textContent="分類：點選上方分類快速瀏覽不同類型的裱框產品。\n搜尋：輸入關鍵字篩選產品名稱與摘要。\n星號：按 ☆ 收藏，卡片會加入「我的收藏」方格；再按一次可取消。\n最近開啟：點「開啟 Trello」後，產品會記錄在最近開啟方格。\n？：查看這項產品的摘要；按對話框內按鈕可前往 Trello 原始產品卡。";document.getElementById("dialogLink").style.display="none";document.getElementById("modal").classList.add("show")};
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")document.getElementById("dialogLink").style.display="inline-flex"});
document.getElementById("close").addEventListener("click",()=>document.getElementById("dialogLink").style.display="inline-flex");
render();
</script></body></html>
