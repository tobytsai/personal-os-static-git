function show(p,{fromURL=false}={}){if(!$('detail').open)returnFocus=document.activeElement;currentProduct=p;if(!fromURL&&!restoring)history.pushState(null,'',stateURL(p.row));const host=$('detailBody');host.replaceChildren();const h=node('div','detail-head');h.append(node('div','brand',brand(p)),node('h2','detail-title',title(p)),node('div','meta',[specLine(p),p.weight,p.category,p.group].filter(Boolean).join(' · ')));h.querySelector('h2').id='detailHeading';const tools=node('div','dialog-tools');const share=node('button','minor','複製產品連結');share.onclick=()=>copyText(stateURL(p.row).href);const copy=node('button','minor','複製 HEX');copy.disabled=!hex(p.hex);copy.onclick=()=>copyText(p.hex);const family=node('button','minor','比較同色不同粒度');family.onclick=()=>compareFamily(p);tools.append(share,copy,family);const notice=node('p','muted');notice.setAttribute('role','status');h.append(tools,notice);for(const [btn,value] of [[share,()=>stateURL(p.row).href],[copy,()=>p.hex]])btn.onclick=async()=>{try{await navigator.clipboard.writeText(value());notice.textContent='已複製';}catch{window.prompt('請複製下方文字',value());}};host.append(h);const nav=node('div','gallery-nav');const back=node('button','','上一張'),next=node('button','','下一張'),counter=node('span','','1 / 5');counter.setAttribute('role','status');nav.append(back,counter,next);host.append(nav);const gallery=node('section','gallery');gallery.setAttribute('aria-label','圖1至圖5');p.images.forEach((item,i)=>{const f=node('figure'),ph=photo(p,item,i,false);f.id='product-image-'+(i+1);f.setAttribute('aria-label',imageNames[i]);if(item.full){const a=link(item.full,'');a.setAttribute('aria-label','查看'+title(p)+'原尺寸圖'+(i+1));a.append(ph);f.append(a);}else f.append(ph);const cap=node('figcaption');cap.append(node('div','brand',brand(p)+' · '+imageNames[i]),node('div','name',title(p)));const sp=node('div','spec');sp.append(node('span','',specLine(p)),node('span','',p.weight||'重量未標示'));cap.append(sp);const src=node('div','source');if(item.full
