<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>井象岩繪具｜五圖產品網站</title>
<style>
:root{color-scheme:light;--paper:#f7f3ec;--ink:#332b27;--muted:#766b62;--line:#ded6ca;--accent:#68536d;--white:#fffdf8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;line-height:1.55}a{color:var(--accent)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c19339;outline-offset:3px}header{background:#e8dce7;border-bottom:1px solid #d6c5d4;padding:26px max(18px,calc((100% - 1180px)/2)) 32px}header h1{font-family:serif;font-size:clamp(28px,5vw,46px);margin:20px 0 6px;letter-spacing:.06em}header p{margin:4px 0;color:#5f4f61}.eyebrow{font-size:.78rem;letter-spacing:.16em;font-weight:700}main{max-width:1180px;margin:auto;padding:18px}.panel{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}.stats{display:flex;flex-wrap:wrap;gap:18px}.stats strong{font-size:1.45rem;display:block}.muted{color:var(--muted);font-size:.87rem}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.filters button{background:white;border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--ink)}.filters button[aria-pressed=true]{background:var(--accent);color:white;border-color:var(--accent)}.controls{display:flex;gap:9px;flex-wrap:wrap}input,select{border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);padding:11px;min-width:0}input{flex:1 1 220px}select{flex:1 1 145px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(218px,1fr));gap:15px}.card{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 4px 14px #5b49330b}.cover{display:grid;place-items:center;background:#efe9e0;aspect-ratio:1/1;overflow:hidden}.cover img{width:100%;height:100%;object-fit:contain;display:block}.noimg{padding:15px;text-align:center;color:var(--muted);font-size:.85rem}.swatch{height:8px}.body{padding:13px}.brand{font-size:.74rem;letter-spacing:.07em;color:var(--muted)}h2{font-family:serif;margin:4px 0;font-size:1.2rem}.meta{font-size:.86rem;color:var(--muted)}.open{margin-top:12px;width:100%;border:1px solid var(--line);background:#f2e8f1;color:#55425b;border-radius:9px;padding:9px;font-weight:700}.pager{display:flex;justify-content:center;align-items:center;gap:14px;margin:24px}.pager button{border:1px solid var(--line);background:white;border-radius:8px;padding:9px 12px}.pager button:disabled{opacity:.4}dialog{width:min(1080px,96vw);max-height:92vh;padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--paper);color:var(--ink);box-shadow:0 15px 50px #0005}dialog::backdrop{background:#0009}.close{float:right;border:1px solid var(--line);border-radius:8px;background:white;padding:9px 12px}.detail-title{font-family:serif;font-size:clamp(24px,4vw,36px);margin:8px 0}.detail-head{padding:8px 0 18px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}.gallery figure{margin:0;min-width:0;background:var(--white);border:1px solid var(--line);border-radius:13px;overflow:hidden}.gallery figure:first-child{grid-column:span 2;grid-row:span 2}.gallery .photo{display:grid;place-items:center;aspect-ratio:1;background:#efe9e0;overflow:hidden}.gallery img{width:100%;height:100%;object-fit:contain;display:block}.gallery figcaption{padding:12px}.gallery .name{font-family:serif;font-weight:700;font-size:1.05rem}.gallery .spec{display:flex;justify-content:space-between;gap:6px;font-size:.85rem;color:var(--muted)}.gallery .source{font-size:.79rem;display:flex;gap:10px;flex-wrap:wrap;margin-top:7px}.info{margin-top:15px}.info dl{display:grid;grid-template-columns:100px 1fr;gap:7px;font-size:.9rem}.info dd{margin:0;overflow-wrap:anywhere}.info dt{color:var(--muted)}.warn{background:#fff1d7;padding:12px;border-radius:9px;font-size:.87rem}.empty{padding:22px;color:var(--muted)}@media(max-width:600px){main{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.body{padding:10px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.gallery figure:first-child{grid-row:auto}.gallery figcaption{padding:8px}.panel{padding:12px}.detail-head{padding-top:36px}dialog{padding:13px}}
</style></head><body><header><a href="gouache-work.html">← 返回膠彩工作啟動器</a><p class="eyebrow">JINGXIANG ART MATERIALS</p><h1>井象岩繪具｜產品圖鑑</h1><p>一色一品 · 五圖展示 · 規格與色彩資料</p></header><main><section class="panel"><div class="stats" id="stats"></div><p class="muted">指定試算表（2026-11-03 備份）資料快照。保留圖1～圖5原順序；已有相符新版縮圖優先使用，點圖開啟 Google Drive 大圖。原始圖片不改動。色碼為螢幕參考，請以實品為準。</p><a href="https://docs.google.com/spreadsheets/d/1gBXb2v-1inyG6nXZgt3sNUnF-x8dyUsIq3tkoPe9bk0/edit" target="_blank" rel="noopener">原始產品明細 ↗</a> · <a href="gouache-products.html">既有膠彩產品卡片</a></section><section class="panel"><div class="controls"><input id="search" type="search" placeholder="搜尋新名、原名、色組、編號或規格" aria-label="搜尋產品"><select id="category" aria-label="產品分類"></select><select id="group" aria-label="色組"></select></div><div id="categoryButtons" class="filters" aria-label="快速分類"></div><div id="groupButtons" class="filters" aria-label="快速色組"></div><p id="status" class="muted" role="status">載入中…</p></section><div id="grid" class="grid"></div><div class="pager"><button id="prev">上一頁</button><span id="page"></span><button id="next">下一頁</button></div></main><dialog id="detail"><button id="close" class="close">關閉 ✕</button><div id="detailBody"></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),node=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n;};
const hex=x=>/^#[0-9a-f]{6}$/i.test(x||'')?x:'';
const specNum=p=>/^(\d+)號?$/.exec(p.spec||'')?.[1]||'',specLabel=p=>specNum(p)?specNum(p)+'號':p.spec==='未標示'?'':p.spec,grade=p=>({'5':'粗目','7':'中目','9':'中目','10':'細目','11':'細目','12':'細目'}[specNum(p)]||''),specLine=p=>[grade(p),specNum(p)?'#'+specNum(p)+'號':specLabel(p)].filter(Boolean).join(' ')||'規格未標示',title=p=>p.newName+(specLabel(p)||''),brand=p=>p.category==='新岩'||p.family==='岩繪具新岩'?'井象岩繪具新岩':'井象岩繪具';
const photoId=u=>/^https:\/\/drive\.google\.com\/file\/d\/([\w-]+)\/view(?:\?|$)/.exec(u||'')?.[1],preview=(u,w)=>{const id=photoId(u);return id?'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w'+w:''};
function link(url,txt){const a=node('a','',txt);a.href=url;a.target='_blank';a.rel='noopener';return a;}
function photo(p,item,i,small){const holder=node('div',small?'cover':'photo'),src=item.thumb||preview(item.full,small?450:1000);if(!src){holder.append(node('div','noimg','圖'+(i+1)+' 尚未提供'));return holder;}const img=node('img');img.alt=title(p)+'｜產品圖'+(i+1);img.loading=small||i?'lazy':'eager';img.decoding='async';let fallback=item.thumb?preview(item.full,small?450:1000):'';img.onerror=()=>{if(fallback){const next=fallback;fallback='';img.src=next;return;}img.remove();holder.append(node('div','noimg','圖片暫無法預覽，請開啟大圖'));};img.src=src;holder.append(img);return holder;}
let cards=[],filtered=[],page=0;const size=24;
function options(id,values){const s=$(id),prev=s.value;s.replaceChildren(new Option(id==='category'?'全部分類':'全部色組',''));const counts=new Map();values.filter(Boolean).forEach(v=>counts.set(v,(counts.get(v)||0)+1));[...counts].sort((a,b)=>a[0].localeCompare(b[0],'zh-Hant',{numeric:true})).forEach(([v,n])=>s.add(new Option(v+'（'+n+'）',v)));if(counts.has(prev))s.value=prev;}
function buttons(id){const s=$(id),h=$(id+'Buttons');h.replaceChildren();for(const o of s.options){const b=node('button','',o.textContent);b.type='button';b.setAttribute('aria-pressed',String(s.value===o.value));b.onclick=()=>{s.value=o.value;s.dispatchEvent(new Event('change'));};h.append(b);}}
function groupOptions(){options('group',cards.filter(p=>!$('category').value||p.category===$('category').value).map(p=>p.group));}
function refresh(){const c=$('category').value,g=$('group').value,q=$('search').value.trim().toLowerCase();filtered=cards.filter(p=>(!c||p.category===c)&&(!g||p.group===g)&&[p.name,p.newName,p.code,p.sequence,p.group,p.spec,p.category,p.hex].join(' ').toLowerCase().includes(q));page=0;buttons('category');buttons('group');draw();}
function draw(){const max=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(Math.max(0,page),max-1);$('grid').replaceChildren();$('status').textContent='顯示 '+filtered.length+' / '+cards.length+' 項產品';for(const p of filtered.slice(page*size,(page+1)*size)){const a=node('article','card');a.append(photo(p,p.images[0],0,true));const s=node('div','swatch');if(hex(p.hex))s.style.background=p.hex;a.append(s);const b=node('div','body');b.append(node('div','brand',brand(p)),node('h2','',title(p)),node('div','meta',[specLine(p),p.weight].filter(Boolean).join(' · ')),node('div','meta',p.images.filter(i=>i.full||i.thumb).length+' / 5 張圖'));const open=node('button','open','查看五圖與規格');open.onclick=()=>show(p);b.append(open);a.append(b);$('grid').append(a);}if(!filtered.length)$('grid').append(node('div','empty','沒有符合條件的產品。'));$('page').textContent=(page+1)+' / '+max;$('prev').disabled=page===0;$('next').disabled=page>=max-1;}
function show(p){const host=$('detailBody');host.replaceChildren();const h=node('div','detail-head');h.append(node('div','brand',brand(p)),node('h2','detail-title',title(p)),node('div','meta',[specLine(p),p.weight,p.category,p.group].filter(Boolean).join(' · ')));host.append(h);const gallery=node('section','gallery');gallery.setAttribute('aria-label','圖1至圖5');p.images.forEach((item,i)=>{const f=node('figure'),ph=photo(p,item,i,false);if(item.full){const a=link(item.full,'');a.setAttribute('aria-label','查看'+title(p)+'原尺寸圖'+(i+1));a.append(ph);f.append(a);}else f.append(ph);const cap=node('figcaption');cap.append(node('div','brand',brand(p)+' · 圖'+(i+1)),node('div','name',title(p)));const sp=node('div','spec');sp.append(node('span','',specLine(p)),node('span','',p.weight||'重量未標示'));cap.append(sp);const src=node('div','source');if(item.full)src.append(link(item.full,'原尺寸 ↗'));if(item.original&&item.original!==item.full)src.append(link(item.original,'原表圖片 ↗'));if(!item.full&&!item.thumb)src.append(node('span','muted','待補圖'));else if(!item.thumb)src.append(node('span','muted','原圖／文字待核對'));cap.append(src);f.append(cap);gallery.append(f);});host.append(gallery);const info=node('section','panel info');info.append(node('h2','','產品資訊'));const dl=node('dl');for(const [k,v] of [['產品新名',title(p)],['原名',p.name],['產品編號',p.code],['分類',p.category],['原色組',p.group],['號數／目數',specLine(p)],['重量',p.weight],['CMYK',p.cmyk],['RGB',p.rgb],['HEX（參考）',p.hex]])if(v){dl.append(node('dt','',k),node('dd','',v));}info.append(dl);const note=p.images.every(i=>i.thumb)?'已沿用既有相符的新版縮圖，原始照片保留。':p.images.some(i=>i.full||i.thumb)?'部分原始圖尚未完成新版文字校對；上方標題以此表的名稱、號數與重量為準。':'此列未提供五張產品圖，不以其他商品圖片替代。';info.append(node('p','warn',note));info.append(link('https://docs.google.com/spreadsheets/d/1gBXb2v-1inyG6nXZgt3sNUnF-x8dyUsIq3tkoPe9bk0/edit#gid=1292031392&range=A'+p.row,'查看原始資料列 ↗'));host.append(info);if(!$('detail').open)$('detail').showModal();$('detail').scrollTop=0;}
$('search').oninput=refresh;$('category').onchange=()=>{$('group').value='';groupOptions();refresh();};$('group').onchange=refresh;$('prev').onclick=()=>{page--;draw();window.scrollTo(0,0);};$('next').onclick=()=>{page++;draw();window.scrollTo(0,0);};$('close').onclick=()=>$('detail').close();
fetch('../data/gouache/catalog-20261103.json?v=5').then(r=>{if(!r.ok)throw Error('資料載入失敗');return r.json();}).then(d=>{cards=d;const complete=d.filter(p=>p.images.every(i=>i.original)).length,local=d.filter(p=>p.images.every(i=>i.thumb)).length;for(const [n,t] of [[d.length,'產品'],[complete,'原表五圖完整'],[local,'既有新版五圖縮圖'],[d.length-complete,'原表待補圖']]){const s=node('div');s.append(node('strong','',String(n)),node('span','muted',t));$('stats').append(s);}options('category',d.map(p=>p.category));groupOptions();refresh();const row=new URLSearchParams(location.search).get('row');if(row){const p=d.find(p=>String(p.row)===row);if(p)show(p);}}).catch(e=>$('status').textContent=e.message+'，請重新整理。');
</script><script src="../shared-nav.js?v=20261025-2" defer></script></body></html>
