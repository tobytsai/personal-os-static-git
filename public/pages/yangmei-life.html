  <link rel="icon" type="image/svg+xml" href="../icons/taoyuan-life.svg">
  <style>
    :root {
      --ink: #28324b;
      --muted: #586478;
      --accent: #5945ae;
      --line: #e2ddef;
      --paper: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: linear-gradient(145deg, #f5f0ff, #fffdf6 62%, #eaf8f2);
      font: 1rem/1.6 system-ui, -apple-system, "Noto Sans TC", sans-serif;
    }
    main { width: min(100%, 1160px); margin: auto; padding: 22px clamp(12px, 3vw, 28px) 72px; }
    a { color: var(--accent); }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .breadcrumbs { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: .9rem; }
    .breadcrumbs a { padding: 8px 0; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.15; margin: .5rem 0 1rem; }
    h2 { font-size: clamp(1.2rem, 2.5vw, 1.48rem); line-height: 1.35; margin: 0; }
    .map-section {
      padding: clamp(12px, 2.5vw, 24px);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 12px 34px #3c2f6210;
    }
    .map-heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; margin-bottom: 14px; }
    .map-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .map-actions a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 12px;
      text-decoration: none;
      font-size: .875rem;
      font-weight: 700;
    }
    .map-actions a:first-child { background: var(--accent); color: white; border-color: var(--accent); }
    .map-actions a:hover { text-decoration: underline; }
    .story-map { display: block; width: 100%; height: 740px; border: 0; border-radius: 14px; background: #fffaf4; }
    .local-resources { margin-top: 28px; }
    .resources { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 265px), 1fr)); gap: 12px; margin-top: 12px; }
    .resource { display: block; border: 1px solid var(--line); border-radius: 16px; background: var(--paper); padding: 16px; text-decoration: none; }
    #jinxi-village-chief-link { scroll-margin-top: 84px; }
    .resource strong { display: block; }
    .resource:hover strong { text-decoration: underline; }
    .resource span { color: var(--muted); font-size: .9rem; }
  </style>
  <script>
    function forwardJinxiReference() {
      const hash = location.hash;
      if (['#jinxi-community-report', '#jinxi-election-bulletin', '#jinxi-policy-analysis'].includes(hash)) {
        location.replace('jinxi-village-chief.html' + hash);
      }
    }
    forwardJinxiReference();
    window.addEventListener('hashchange', forwardJinxiReference);
  </script>
