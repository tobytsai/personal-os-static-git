*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#262a30;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}main{max-width:1100px;margin:auto;padding:22px 16px 70px}h1{font-size:clamp(24px,4vw,34px);margin:8px 0}p{margin:8px 0}.sub{color:#5f6775}.box{background:white;border:1px solid #e0e3eb;border-radius:16px;padding:17px;margin:15px 0}a{color:#574597}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,button{font:inherit;border:1px solid #d6d9e2;border-radius:10px;background:#fff;padding:9px 12px;color:#343341;cursor:pointer;text-decoration:none}.primary{background:#6757ba;color:#fff;border-color:#6757ba}.danger{color:#a33b43}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input{flex:1 1 230px}.toolbar select{flex:1 1 160px}input,select,textarea{font:inherit;border:1px solid #cdd2dc;border-radius:9px;padding:10px;width:100%;background:#fff}label{display:grid;gap:5px;font-weight:650}textarea{min-height:85px;resize:vertical}.entries{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.entry{background:#fff;border:1px solid #e1e3eb;border-radius:15px;padding:15px;display:flex;flex-direction:column;gap:6px}.entry h3{margin:0;font-size:18px;overflow-wrap:anywhere}.entry p{margin:0;overflow-wrap:anywhere}.ja{color:#6a6473}.tag{color:#6551a1;font-size:13px}.note{color:#626b77;font-size:14px;white-space:pre-wrap}.entry .actions{margin-top:auto;padding-top:8px}.entry button{font-size:14px;padding:6px 11px}.empty{color:#666}dialog{width:min(560px,calc(100% - 24px));border:0;border-radius:16px;padding:20px;box-shadow:0 10px 50px #0005}dialog::backdrop{background:#0009}dialog form{display:grid;gap:12px}dialog h2{margin:0}.status{color:#704a09}details ul{padding-left:22px}small{color:#67717d}@media(max-width:600px){.entries{grid-template-columns:1fr}main{padding:14px 12px 55px}}
</style></head><body><main><a href="./finished-examples.html">← 返回額緣高橋啟動器</a><h1>📖 裱框日中術語表</h1><p class="sub">整理畫框、材料、工法與展示物，供商品卡片翻譯時參考。</p><div class="box"><p>可新增、編輯、刪除及搜尋詞條。修改儲存在<strong>目前裝置的瀏覽器</strong>，不會自動同步至其他裝置；請定期匯出備份。</p><div class="actions"><button class="primary" id="add">＋ 新增詞條</button><button id="export">匯出備份</button><button id="import">匯入備份</button><button id="reset">恢復初版</button><input type="file" id="file" accept="application/json,.json" hidden></div><p id="status" class="status" role="status" aria-live="polite"></p></div><div class="box toolbar"><input id="search" type="search" placeholder="搜尋日文、中文或說明" aria-label="搜尋術語"><select id="category" aria-label="選擇分類"><option value="">全部分類</option></select></div><p id="count" class="sub"></p><section id="entries" class="entries"></section><details class="box"><summary><strong>翻譯原則與參考資料</strong></summary><ul><li>保留型號、品牌、尺寸、數量與日文原名；中文為工作譯名。</li><li>參照原文、圖片與商品頁確認用途，不能確定時保留原詞並標示待確認。</li><li>マット、浮かし、色紙與コースター等詞須按上下文翻譯。</li><li>使用此表不會自動更改商品卡片或原始術語表文件。</li></ul><p>參考：<a href="https://www.gakubuti.net/contents/dictionary" target="_blank" rel="noopener noreferrer">官方用語辭典</a> · <a href="https://www.gakubuti.net/contents/mat" target="_blank" rel="noopener noreferrer">裱框卡紙</a> · <a href="https://www.gakubuti.net/contents/solid" target="_blank" rel="noopener noreferrer">立體框</a> · <a href="https://www.gakubuti.net/contents/backing" target="_blank" rel="noopener noreferrer">裱褙</a></p></details></main><dialog id="dialog"><form id="form"><h2 id="formtitle">新增詞條</h2><label>日文<input name="ja" required maxlength="200"></label><label>繁體中文<input name="zh" required maxlength="200"></label><label>分類<input name="category" list="categories" required maxlength="100"><datalist id="categories"></datalist></label><label>使用說明<textarea name="note" maxlength="2000"></textarea></label><div class="actions"><button class="primary" type="submit">儲存</button><button id="cancel" type="button">取消</button></div></form></dialog><script>
const defaults=[{"id": "base-1", "category": "框型與用途", "ja": "額縁／フレーム", "zh": "畫框／框架", "note": "整體稱畫框；單指框體時用框架。"}, {"id": "base-2", "category": "框型與用途", "ja": "額装／額装する", "zh": "裱框／裝框", "note": "指將作品配置、固定於框內。"}, {"id": "base-3", "category": "框型與用途", "ja": "一般額", "zh": "一般畫框", "note": "常用於紙本平面作品；適用內容以商品為準。"}, {"id": "base-4", "category": "框型與用途", "ja": "油絵額", "zh": "油畫框", "note": "適用畫布厚度仍需核對。"}, {"id": "base-5", "category": "框型與用途", "ja": "水彩額", "zh": "水彩畫框", "note": "不推定只可用於水彩。"}, {"id": "base-6", "category": "框型與用途", "ja": "デッサン額", "zh": "素描框／紙本畫框", "note": "視用途可標「素描／紙本畫框」。"}, {"id": "base-7", "category": "框型與用途", "ja": "日本画額", "zh": "日本畫框", "note": "指框型用途，非作品材質保證。"}, {"id": "base-8", "category": "框型與用途", "ja": "色紙額", "zh": "色紙框", "note": "日式色紙為厚紙板作品，非泛指彩色紙。"}, {"id": "base-9", "category": "框型與用途", "ja": "小色紙", "zh": "小色紙", "note": "規格依商品頁確認。"}, {"id": "base-10", "category": "框型與用途", "ja": "賞状額", "zh": "證書框", "note": "可供獎狀等使用，以商品尺寸為準。"}, {"id": "base-11", "category": "框型與用途", "ja": "写真額", "zh": "照片框", "note": ""}, {"id": "base-12", "category": "框型與用途", "ja": "ポスター額", "zh": "海報框", "note": ""}, {"id": "base-13", "category": "框型與用途", "ja": "手ぬぐい額", "zh": "手拭巾框", "note": ""}, {"id": "base-14", "category": "框型與用途", "ja": "立体額", "zh": "立體框／深框", "note": "具容納厚度的空間；實際深度須核對。"}, {"id": "base-15", "category": "框型與用途", "ja": "ボックス額／アートボックス", "zh": "盒型框／立體展示框", "note": "商品系列名稱可保留原名。"}, {"id": "base-16", "category": "框型與用途", "ja": "アクリル箱", "zh": "壓克力展示盒", "note": "不必然含外框。"}, {"id": "base-17", "category": "框型與用途", "ja": "仮縁／仮額", "zh": "展覽用簡框（仮縁）", "note": "常用於畫布展示；不一定附面板或背板，規格依商品頁。"}, {"id": "base-18", "category": "框型與用途", "ja": "浮かし型仮縁", "zh": "懸浮式展覽簡框", "note": "框與畫布邊緣留縫的框型；勿混同作品墊高。"}, {"id": "base-19", "category": "框型與用途", "ja": "前開き／前開式", "zh": "前開式", "note": "具體開啟方式應核對。"}, {"id": "base-20", "category": "框型與用途", "ja": "オーダーフレーム", "zh": "訂製畫框", "note": "是否可選顏色和尺寸依商品頁。"}, {"id": "base-21", "category": "框型與用途", "ja": "既製品／既製サイズ", "zh": "現成品／標準尺寸", "note": ""}, {"id": "base-22", "category": "框型與用途", "ja": "専用額", "zh": "專用框", "note": "原名稱中要保留所展示物品。"}, {"id": "base-23", "category": "框型與用途", "ja": "額装例／額装実例", "zh": "裱框實例", "note": "實例不一定代表可單獨購買商品。"}, {"id": "base-24", "category": "材料與零件", "ja": "額装マット／紙マット", "zh": "裱框卡紙／襯卡", "note": "窗口開孔的襯卡，不譯成「墊子」。"}, {"id": "base-25", "category": "材料與零件", "ja": "マット材", "zh": "卡紙材料", "note": "依材料上下文判斷；不是所有マット都是卡紙。"}, {"id": "base-26", "category": "材料與零件", "ja": "窓抜き", "zh": "開窗／卡紙開窗", "note": ""}, {"id": "base-27", "category": "材料與零件", "ja": "ダブルマット", "zh": "雙層卡紙", "note": ""}, {"id": "base-28", "category": "材料與零件", "ja": "裏板", "zh": "背板", "note": "支撐、固定作品的後板；不同於裱褙。"}, {"id": "base-29", "category": "材料與零件", "ja": "表面カバー", "zh": "正面保護面板", "note": "材質須依商品頁。"}, {"id": "base-30", "category": "材料與零件", "ja": "アクリル板", "zh": "壓克力板", "note": ""}, {"id": "base-31", "category": "材料與零件", "ja": "ガラス", "zh": "玻璃", "note": "不可自動假定為防反射或 UV 規格。"}, {"id": "base-32", "category": "材料與零件", "ja": "浮かし材", "zh": "墊高材料／隔離墊材", "note": "依其用途決定；不直接譯浮框。"}, {"id": "base-33", "category": "材料與零件", "ja": "木枠", "zh": "木內框／畫布木框", "note": "須辨別外部畫框與畫布支撐木架。"}, {"id": "base-34", "category": "材料與零件", "ja": "パネル", "zh": "畫板／裱畫板", "note": "看上下文，不一律譯成面板。"}, {"id": "base-35", "category": "材料與零件", "ja": "キャンバス", "zh": "畫布", "note": ""}, {"id": "base-36", "category": "材料與零件", "ja": "吊金具／吊り下げ金具", "zh": "吊掛五金", "note": "是否附贈依商品頁。"}, {"id": "base-37", "category": "材料與零件", "ja": "吊紐", "zh": "吊繩", "note": ""}, {"id": "base-38", "category": "材料與零件", "ja": "フック", "zh": "掛鉤", "note": ""}, {"id": "base-39", "category": "材料與零件", "ja": "ピクチャーレール", "zh": "畫軌／掛畫軌道", "note": ""}, {"id": "base-40", "category": "材料與零件", "ja": "イーゼル／額立て", "zh": "畫架／立框架", "note": "依物件用途區分。"}, {"id": "base-41", "category": "材料與零件", "ja": "裏打用紙", "zh": "裱褙紙", "note": ""}, {"id": "base-42", "category": "材料與零件", "ja": "シーリングテープ", "zh": "密封膠帶", "note": "依原文判斷用途。"}, {"id": "base-43", "category": "材料與零件", "ja": "バリアシート", "zh": "阻隔膜", "note": "具體阻隔性能依官網。"}, {"id": "base-44", "category": "材料與零件", "ja": "保存かぶせ箱", "zh": "保存用套蓋盒", "note": ""}, {"id": "base-45", "category": "裱框技法與規格", "ja": "裏打ち", "zh": "裱褙／背襯處理", "note": "指作品背面加工，不等同裝背板。"}, {"id": "base-46", "category": "裱框技法與規格", "ja": "浮かし額装", "zh": "墊高式裱框", "note": "作品背面加墊使作品高於底面；與浮框留縫不同。"}, {"id": "base-47", "category": "裱框技法與規格", "ja": "保存額装", "zh": "保存性裱框", "note": "強調保存考量，不代表永久不劣化。"}, {"id": "base-48", "category": "裱框技法與規格", "ja": "面金", "zh": "面金／卡紙內緣裝飾條", "note": "日式特殊配件，先保留原詞便於查核。"}, {"id": "base-49", "category": "裱框技法與規格", "ja": "覆輪", "zh": "覆輪／邊緣裝飾條", "note": "對應部件需依案例核對，勿與面金混為同物。"}, {"id": "base-50", "category": "裱框技法與規格", "ja": "深さ／内寸", "zh": "深度／內尺寸", "note": "區分框內深度、可容納厚度與外尺寸。"}, {"id": "base-51", "category": "裱框技法與規格", "ja": "外寸", "zh": "外尺寸", "note": ""}, {"id": "base-52", "category": "裱框技法與規格", "ja": "対応サイズ", "zh": "適用尺寸", "note": ""}, {"id": "base-53", "category": "裱框技法與規格", "ja": "特注サイズ", "zh": "特訂尺寸", "note": ""}, {"id": "base-54", "category": "裱框技法與規格", "ja": "マット付／マット付き", "zh": "附卡紙", "note": "若為遊戲墊等其他用途需另譯。"}, {"id": "base-55", "category": "裱框技法與規格", "ja": "セット工賃込", "zh": "含裝框加工工資", "note": "原文未含的項目不可自行補充。"}, {"id": "base-56", "category": "裱框技法與規格", "ja": "〜用／専用", "zh": "適用於〜／專用", "note": "依原文區分。"}, {"id": "base-57", "category": "裱框技法與規格", "ja": "￥〜", "zh": "日圓〜起", "note": "不換算台幣，規格與價格以官網為準。"}, {"id": "base-58", "category": "容易誤譯的展示物", "ja": "コースター", "zh": "杯墊", "note": "在這些收藏展示商品中不是雲霄飛車；需依上下文確認。"}, {"id": "base-59", "category": "容易誤譯的展示物", "ja": "トレーディングカード／トレカ", "zh": "收藏卡／集換式卡牌", "note": "依產品類別。"}, {"id": "base-60", "category": "容易誤譯的展示物", "ja": "プレイマット", "zh": "遊戲墊", "note": "不是裱框卡紙。"}, {"id": "base-61", "category": "容易誤譯的展示物", "ja": "タペストリー", "zh": "掛軸布／布掛畫", "note": "依商品內容，與傳統書畫掛軸區別。"}, {"id": "base-62", "category": "容易誤譯的展示物", "ja": "手ぬぐい", "zh": "日式手拭巾", "note": ""}, {"id": "base-63", "category": "容易誤譯的展示物", "ja": "うちわ", "zh": "團扇", "note": ""}, {"id": "base-64", "category": "容易誤譯的展示物", "ja": "ぬいぐるみ", "zh": "絨毛玩偶", "note": ""}, {"id": "base-65", "category": "容易誤譯的展示物", "ja": "新聞見開き", "zh": "報紙跨頁", "note": "「見開き」依內容譯為展開跨頁。"}, {"id": "base-66", "category": "容易誤譯的展示物", "ja": "抱き枕カバー", "zh": "抱枕套", "note": ""}];
const key='takahashiGlossaryV1';const $=id=>document.getElementById(id);let entries,editId=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function valid(a){return Array.isArray(a)&&a.length<=10000&&a.every(x=>x&&typeof x.id==='string'&&typeof x.ja==='string'&&x.ja.trim()&&typeof x.zh==='string'&&x.zh.trim()&&typeof x.category==='string'&&x.category.trim()&&typeof x.note==='string')&&new Set(a.map(x=>x.id)).size===a.length}
try{const raw=localStorage.getItem(key);const v=raw===null?null:JSON.parse(raw);if(raw!==null&&!valid(v))throw Error();entries=v===null?structuredClone(defaults):v}catch(e){entries=structuredClone(defaults);$('status').textContent='儲存資料無法讀取，暫時顯示初版。請匯入之前的備份。'}
function save(next){try{localStorage.setItem(key,JSON.stringify(next));entries=next;return true}catch(e){$('status').textContent='儲存失敗，請檢查瀏覽器儲存空間或設定。';return false}}
function render(){const cats=[...new Set(entries.map(x=>x.category))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));let selected=$('category').value;$('category').innerHTML='<option value="">全部分類</option>'+cats.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');$('category').value=cats.includes(selected)?selected:'';$('categories').innerHTML=cats.map(x=>'<option value="'+esc(x)+'">').join('');let q=$('search').value.trim().toLocaleLowerCase();let list=entries.filter(x=>(!$('category').value||x.category===$('category').value)&&(!q||[x.ja,x.zh,x.note,x.category].some(s=>s.toLocaleLowerCase().includes(q))));$('count').textContent='顯示 '+list.length+' 筆，共 '+entries.length+' 筆';$('entries').innerHTML=list.length?list.map(x=>'<article class="entry"><span class="tag">'+esc(x.category)+'</span><h3>'+esc(x.zh)+'</h3><p class="ja" lang="ja">'+esc(x.ja)+'</p><p class="note">'+esc(x.note)+'</p><div class="actions"><button data-edit="'+esc(x.id)+'">編輯</button><button class="danger" data-delete="'+esc(x.id)+'">刪除</button></div></article>').join(''):'<p class="empty">沒有符合條件的詞條。</p>'}
function showForm(x){editId=x?.id||null;$('formtitle').textContent=x?'編輯詞條':'新增詞條';for(const k of ['ja','zh','category','note'])$('form').elements[k].value=x?.[k]||'';$('dialog').showModal()}
$('add').onclick=()=>showForm(null);$('cancel').onclick=()=>$('dialog').close();$('search').oninput=render;$('category').onchange=render;
$('form').onsubmit=e=>{e.preventDefault();let f=e.currentTarget;let item={id:editId||('custom-'+Date.now()+'-'+Math.random().toString(36).slice(2)),ja:f.elements.ja.value.trim(),zh:f.elements.zh.value.trim(),category:f.elements.category.value.trim(),note:f.elements.note.value.trim()};if(!item.ja||!item.zh||!item.category)return;let next=editId?entries.map(x=>x.id===editId?item:x):[...entries,item];if(save(next)){ $('dialog').close();$('status').textContent='已儲存到這個瀏覽器。';render()}};
$('entries').onclick=e=>{const b=e.target.closest('button');if(!b)return;let x=entries.find(v=>v.id===(b.dataset.edit||b.dataset.delete));if(!x)return;if(b.dataset.edit)showForm(x);else if(confirm('確定刪除「'+x.zh+'」？')){if(save(entries.filter(v=>v.id!==x.id))){$('status').textContent='已刪除詞條。';render()}}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({format:'takahashi-glossary',version:1,entries},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='takahashi-glossary-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>5000000)throw Error();let data=JSON.parse(await f.text());if(data.format!=='takahashi-glossary'||data.version!==1||!valid(data.entries))throw Error();if(confirm('匯入將取代這個瀏覽器目前的 '+entries.length+' 筆詞條。建議先匯出備份。確定匯入 '+data.entries.length+' 筆？')&&save(data.entries)){$('status').textContent='已匯入備份。';render()}}catch(err){$('status').textContent='備份格式不正確，或檔案過大；目前資料未變更。'}finally{e.target.value=''}};
$('reset').onclick=()=>{if(confirm('恢復初版會取代目前所有詞條與修改。請先匯出備份。確定繼續？')&&save(structuredClone(defaults))){$('status').textContent='已恢復初版術語表。';render()}};render();
</script></body></html>
