}
function choose(name){document.querySelectorAll(".district").forEach(b=>b.classList.toggle("active",b.dataset.area===name));if(name==="全部桃園"){selected.classList.remove("show");grid.hidden=false;return}grid.hidden=true;selected.classList.add("show");document.getElementById("selectedTitle").textContent="📍 "+name;document.getElementById("selectedIntro").textContent=intros[name];renderDistrictContent(name)}
nav.innerHTML=["全部桃園",...districts].map(n=>'<button class="district '+(n==="全部桃園"?"active":"")+'" data-area="'+n+'">'+n+"</button>").join("");
nav.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>choose(b.dataset.area)));
grid.innerHTML=districts.map(n=>'<article class="area"><div><h3>'+n+'</h3><p>'+intros[n]+'</p></div><button data-pick="'+n+'">查看分類 →</button></article>').join("");
grid.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>{choose(b.dataset.pick);nav.querySelector('[data-area="'+b.dataset.pick+'"]').scrollIntoView({behavior:"smooth",block:"nearest"})}));
</script></body></html>
