"attachments":["1619145582253_5919495246293934878.jpg"]},{"id":"rec0QXuRqA6Tx0xRF","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619145966861_1019192155348421894.jpg"],"displayTitle":"熱蘭遮城磚造城牆","titleBasis":"依展場照片內容整理"},{"id":"rec0TghchVFxThizO","name":"","notes":"","cat":"奇美博物館","details":["羅丹"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619160869556_7602314886366327740.jpg","1619160881784_698979421165618402.jpg","1619161067212_2420298433112856381.jpg"],"displayTitle":"羅丹｜待辨識紀錄（ThizO）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"rec0a0qJENMkcmhRy","name":"玉鑄\n\n新石器時代 國立自然科學博物館典藏","notes":"","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1618993247292_2140806361332090805.jpg"]},{"id":"rec0ag9a2Icc5tXvI","name":"","notes":"","cat":"奇美博物館","details":["羅丹"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619160370334_6705169856149531421.jpg"],"displayTitle":"吻 The Kiss","titleBasis":"依展場照片標示"},{"id":"rec0d9iFCsR0QuQec","name":"卸下聖體\n\nThe Deposition","notes":"卸下聖體\n\nThe Deposition\n\n(傅)葛斯帕·貝瑟拉 ( 1520-1568) 年代不詳、油彩、孟布\n\nAttributed to Gaspar BECERRA (Sparish, 1520-1568)\n\nUndated, Oil on canvas\n\n貝瑟拉的人物可見米開朗基羅筆下肌肉 壯碩的人物類型、精確的解剖結構與前 縮法的影響,為矯飾主義的發展注入新 力量·耶稣赤裸慘白的色、精壯起伏 的肌理,與白色裹屍布成為視覺焦點; 眾多人物充滿淚水的表情,與半隱沒在 晦暗中的身軀,加深了哀戚的氣氛。\n\n0009417","cat":"奇美博物館","details":["藝術廳","13至16 世紀:神性與人性"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619167762439_6593934450259502127.jpg","1619167770452_3333481876986843159.jpg"]},{"id":"rec0eOAlcu8SiJgKI","name":"明宣宗書上林冬暖詩　軸","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第一檔）","period":"","number":"故書000016N000000000","url":"","wiki":"","years":[{"id":"recj9BkloPzQZSvTC","name":"明朝"}],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec0n162PwbaLkPqp","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619147088366_2889429054543158165.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（LkPqp）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"rec0w4f2Jrysl5wG4","name":"誕生佛","notes":"明（1368-1644）西元16 世紀\n誕生佛\n彭楷棟先生捐贈\n銅鎏金 通高20 公分\n寺院於佛誕日（四月八日）舉行浴佛活動，以淨水、茶湯或五色水等，提供信徒灌沐誕生佛像，故亦稱為灌佛會。由於此儀式的特殊性，現存的造像大多為銅製，而且以尺寸偏小的居多，約十至三十公分之間。\n\n此尊誕生佛像的外形與圖錄3相近，頂無肉髻相，光素無紋宛若新生兒。方頭大耳，帶有白毫的天庭飽滿，雙頰豐腴，上下眼瞼勾以深深的眼線，再配合上揚的菱角嘴，使得五官扁平的臉龐露出微笑。全身圓滾肥厚，上身較長，著鑲有連珠紋邊飾的牡丹肚兜，吊帶巧妙地掩飾臂膀的銜接處，與上述的誕生佛像相同。肚兜緊貼著軀體，不但強調祂凸出的上腹部，也略顯其腰身，應為約十六世紀明代晚期之作。","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第1單元　誕生的喜悅","period":"明（1368-1644）西元16 世紀","number":"贈銅000215","url":"","wiki":"","years":[{"id":"recj9BkloPzQZSvTC","name":"明朝"}],"exhibitions":[],"artists":[],"attachments":["20190524183732786742.jpg","1619242395964_6835865149880889742.jpg","1619242413001_8296236192003472370.jpg"]},{"id":"rec0zKT9ZOLRACWpj","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619147065019_9009159382289307236.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（ACWpj）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"rec14TAeSPUeQ6Haq","name":"緬甸字體巴利文貝葉經典》","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第4單元　經藏的流轉","period":"緬甸 / 西元19-20世紀","number":"故善025795〜025797、 故善025811〜025860、 故善025869〜025932","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619245907569_4898731559664744148.jpg","1619245927051_227097059835641245.jpg","1619245951713_7010448257039655121.jpg","1619245964056_79560903631917482.jpg","1619245973374_7969656766382386012.jpg","1619245985249_3246576876021481502.jpg","1619245994124_1327266682065418238.jpg","1619246005112_8786262015020515675.jpg"]},{"id":"rec17Llc es":"藝術的寓意 Allegory of Arts\n\n(傳)漢斯·逢·亞琛\n\n( 1552-1615)\n\n年代不詳,油彩、木板\n\nAttributed to Hans von ACHEN\n\n(German, 1552-1615) Undated, Oil on panel\n\n維納斯回頭與丘比特對望展現優美的扭 轉身軀,展現矯飾主義偏愛刻畫的人物 體態。維納斯身旁散落著樂器與書籍, 唯有左手拿著象徵畫家的調色盤及畫 筆,旨在強調當時繪畫與畫家地位的提 升以外,也體現十六世紀藝術理論強調 「愛」為藝術創作生命力的思潮。\n\n0007838","cat":"奇美博物館","details":["藝術廳","13至16 世紀:神性與人性"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619167633913_1876408150082088263.jpg","1619167642660_7261603134360798146.jpg","1619167650738_1718967491002740165.jpg"]},{"id":"rec1aNvCaMg6wBH7F","name":"","notes":"","cat":"故宮","details":["青銅饗宴：古代的禮儀與樂曲"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619250149654_8654302796377889905.jpg"],"displayTitle":"青銅饗宴：古代的禮儀與樂曲｜待辨識紀錄（wBH7F）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"rec1dTGohjbSpJG2a","name":"清末民初\n「是禮」款紅磚茶擔","notes":"「是禮」款紅磚茶擔\n清末民初\n「是禮」款紅磚茶擔\n長38.4 寬17.1 高55.4 公分\n長方形紅磚胎茶擔為潮汕工夫茶特有造型，潮汕稱為「茶擔」，是放置各式茶器的櫃式茶棚，磚胎低溫燒成。這類形制茶擔雖有大小之分，但分格置器內容大同小異。器一般分 上中下三段，據茶學者考證，（註）上段右上放置茶爐，有三開口，上口為大圓孔以便納爐，前為八方扇形風口，背後則留一小 半圓形散熱口，因置風爐，故佔有上中段；上段左邊僅留上方的海棠形孔洞，以容海棠形茶葉罐，其下中段左面為方形大開口，可置茶壺、茶杯等茶器；下段整面於右面開口呈一斜放的花瓶瓶體，其上則為磚體刻印瓶口及插飾牡丹花一枝，上實下空巧妙地 形成瓶花裝飾，此格盛放爐炭，作用與炭籠相同，格後方亦有一小半圓孔洞，或亦作散氣之用。茶擔兩側亦分三段，下段各有一扇形開孔，以供手抬提放；茶擔背面除前述上下各留兩小半圓形開孔外，面平而無裝飾。 \n\n全器紋飾分佈於正面及兩側，正面正中門楣上方刻有「是禮」二字，點出茶擔的使用意涵；左上雕飾人物騎獸圖，通風口下方為太極八卦圖，下段為前述之瓶花裝飾，四周及邊框則圍飾回文、錦紋及朵花紋等。茶擔兩側上方各飾蓮花，中段一飾 蓮托寶瓶，一飾蓮繫雙筆，紋飾或為道教雜寶紋，與正面太極八卦紋相互呼應。 \n\n清末民國潮州文士翁輝東（1885-1965）在其著書內曾談及〈工夫茶〉有茶壺、蓋甌、茶杯等十八項茶器，其中最後 一項就是茶擔，可見茶擔盛行於潮汕地區。 ","cat":"故宮","details":["東亞茶文化展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[{"id":"recTL4AlTXJe0JgVt","name":"清朝"}],"exhibitions":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}],"artists":[],"attachments":["Screenshot_20210424101120.jpg"]},{"id":"rec1hobvtchfhpKJO","name":"12明鄭時期","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619149407561_4544353999887863356.jpg","1619149426868_1014902141620867537.jpg"]},{"id":"rec1lVzylhHSRlohn","name":"北宋－金 定窯 牙白劃花敞口茶盞","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—唐風宋韻","period":"","number":"故瓷015041","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec1m5FLMwElzuIcm","name":"貨郎圖　軸 軸 故畫003127","notes":"","cat":"故宮","details":["畫琳瑯—貨郎圖特展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1620457962149_4972287480364689304.jpg","PXL_20210508_071039073.jpg","1620457972300_8041679434191929645.jpg","1620457983228_4101057293501344339.jpg"]},{"id":"rec1mUsjeElWArb3V","name":"西周晚期\n散盤","notes":"西周晚期\n散盤\n散盤的契約形式內文，是金文中少見的特例，其內容記夨國與散國的邊界紛爭，經會同各方官員履勘定界，最後由夨國立誓，完成割地契約。全文三百五十字，書法奇肆宕逸，結構豐富多變，是書法史上篆書的極品。","cat":"故宮","details":["人氣國寶展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[{"id":"recwR1PHYemP0Fomt","name":"西周"}],"exhibitions":[],"artists":[],"attachments":["20201022164114950713.jpg","1619244566824_5458012732266614798.jpg","1619244575574_6296774300915438519.jpg","1619244583909_7354613093480708093.jpg","1619244704816_7377800209233755481.jpg"]},{"id":"rec1o4vyoi6uKrk7y","name":"清 康熙 五彩龍鳳紋茶葉罐","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—清代品茗","period":"","number":"中瓷001526 ","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec1zGfWtq9KaismF","name":"藥師佛","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第2單元　佛陀的智慧","period":"韓國 / 三國時期（西元前57-西元668）西元7世紀中葉","number":"贈銅000229","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619243172802_7398403439615874882.jpg","1619243183526_5324053401023764498.jpg"]},{"id":"rec2EXcq4q0JyfHp7","name":"","notes":"","cat":"奇美博物館","details":["自動樂器"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619162970139_7048334014264340111.jpg","1619162978610_5134106821173233792.jpg"],"displayTitle":"自動樂器｜待辨識紀錄（yfHp7）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"rec2Pgf2BmvCdA7gL","name":"渡船\n\nThe Ferry","notes":"渡船\n\nThe Ferry\n\n\n亞德里安·摩荷\n\n(法國,1843-1906)\n\n1884,油彩、畫布\n\nAdrien MOREAU\n\n(French, 1843-1906) 1884, Oil on canvas\n\n摩荷喜歡在畫中混合十七世紀荷蘭風俗 畫特色,或是古代服飾與軼事元素,有 時甚至添加自己的想像。本畫以塞納河 畔為背景,灰藍天色映照河面,呈現一 片灰濛景觀。一群身穿十七世紀裝束的 貴族、軍人、農夫和乞丐等民眾搭船渡 河的景象,宛如一幅歷史風俗畫。\n\n0001451","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619166681280_505385201379629616.jpg","1619166690626_7802892071588188600.jpg"]},{"id":"rec2TRUl54KsrWtqK","name":"集古名繪　冊　宋蘇漢臣市擔嬰戲 冊 故畫003481-10","notes":"","cat":"故宮","details":["畫琳瑯—貨郎圖特展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1620458226421_2766935962887323712.jpg","1620458215979_5843271947452575823.jpg","1620458237362_2049142134162826555.jpg"]},{"id":"rec2b6lMc22fhOVw8","name":"觀音菩薩","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第3單元　菩薩的慈悲","period":"遼（907-1125）西元11世紀","number":"贈銅000192","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619247223352_7054231439123296518.jpg","1619247241296_2497139181925101979.jpg"]},{"id":"rec2cdIMatIaeSR3H","name":"","notes":"","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1636867652692_2420205347485790496.jpg","1636867666981_6540949436060900492.jpg"],"displayTitle":"玉言故事展｜待辨識紀錄（eSR3H）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"rec2hjUDRIJC9cvLE","name":"","notes":"","cat":"故宮","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619244734430_2340345268442463548.jpg"],"displayTitle":"故宮｜待辨識紀錄（9cvLE）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"rec2lO89Tpgsdp5GQ","name":"明 萬曆 五彩雲龍紋茶葉罐","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—明人雅集","period":"","number":"故瓷005954","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec2mpytDlbN0ndSL","name":"清 乾隆 鬥彩白地綠龍蓋罐","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—清代品茗","period":"","number":"中瓷004469","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec2nUp1jO7DZwlJX","name":"明 宣德\n青花轉枝海棠紋茶葉罐","notes":"明 宣德\n青花轉枝海棠紋茶葉罐\n口呈斂圓內折，鼓腹，圈足外撇，帶蓮苞紐蓋。罐腹周壁繪轉枝海棠花紋，上下則各飾仰覆蓮瓣紋一周，撇足上畫五瓣花八朵。蓋面為逐次擴大的三階傘狀形，內層最小留白，中為蓮瓣紋，蓋沿為轉枝海棠花。蓋內附圈沿一周，牆沿略高可使罐蓋不易滑落。底平呈三階式，外層足底露胎，潔白細膩。青花濃豔，多帶褐綠結晶疵斑，白釉微泛青色，釉面多有使用擦痕。\n這類蓋罐作何器用，明代文獻並無記載，至於清代則常見與其他茶器擺設一起，北京故宮博物院所藏描繪〈乾隆皇帝雪景行樂圖〉中，乾隆皇帝的侍僕們正在忙以雪水烹煎三清茶的茶器當中，即見著與本器類似的茶罐置於其中，顯示這類蓋內帶高圈沿的蓋罐，可與蓋身貼合，不易滑動，亦可密封免於受潮，或多作儲藏茶葉使用，與故瓷005954相同，蓋內沿均有較深圈壁，多數的明清錫茶葉罐蓋亦復相同作法。","cat":"故宮","details":["東亞茶文化展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[{"id":"recj9BkloPzQZSvTC","name":"明朝"}],"exhibitions":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}],"artists":[],"attachments":["Screenshot_20210424101431.jpg"]},{"id":"rec2uNMmDLex4S4oL","name":"","notes":"","cat":"奇美博物館","details":["17至18世紀：宮廷與市井"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619169240411_2699334632010987779.jpg","1619169249854_7680962168549352704.jpg"],"displayTitle":"17至18世紀：宮廷與市井｜待辨識紀錄（4S4oL）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"rec2x0nEfDMkZnTda","name":"蒙藏奶茶","notes":"清室入主中原仍保留飲用奶茶的習慣，為了接待蒙古貴族與西藏高僧，筵宴飲用奶茶，因此留下了豐富的奶茶器皿。蒙古地區常以濃郁茶汁加入酥油、鹽，並倒入牛奶或羊奶煮沸，攪拌後即成奶茶。藏族則將茶汁與酥油、鹽等佐料，放入長筒狀的多穆壺中不斷舂搗、拌勻，完成酥油茶。本單元特選精美的院藏奶茶器，藉以呈現清代茶文化的多元面貌。","cat":"故宮","details":["東亞茶文化展"],"sub":"蒙藏奶茶","period":"","number":"","url":"","wiki":"","years":[{"id":"recTL4AlTXJe0JgVt","name":"清朝"}],"exhibitions":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}],"artists":[],"attachments":[]},{"id":"rec2ywOsUJcfGzbg5","name":"清 乾隆六年 洋彩番蓮紋紅地茶壺","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—清代品茗","period":"","number":"故瓷017183","url":"","wiki" sub":"翰墨空間（第一檔）","period":"","number":"贈書000376N000000000","url":"http://chinapalacemuseum.com/%E6%B8%85%E5%8A%89%E6%98%A5%E9%9C%96%E8%A1%8C%E6%9B%B8%E4%B8%83%E8%A8%80%E8%81%AF_%E8%BB%B8_%E8%B4%88-%E6%9B%B8-000376-00000/","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec3WSMKK49EPTg1Q","name":"晚唐－五代 邢窯 白瓷茶瓶","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—唐風宋韻","period":"","number":"中瓷004017","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec3aHx7bPRBCed5p","name":"六朝梁張僧繇雪山紅樹圖","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第二檔）","period":"","number":"故畫000001N000000000","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec3i3HRQPxUjf5nI","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619145614055_4445845299108245641.jpg"],"displayTitle":"安平古堡歷史年表","titleBasis":"依展場照片標示"},{"id":"rec3rKwYmcHuKiJNT","name":"明\n宣德 寶石紅茶鍾","notes":"明\n宣德 寶石紅茶鍾\n附凸緣玉璧茶托 （新石器時代龍山文化晚期至商代）\n高 5.2公分 口徑 10.2公分 足徑 4.3公分；璧高 1.4公分 口徑 6.8公分 緣徑 11.3公分\n典型撇口茶鍾造型，全器除足底外均施紅釉，釉色鮮紅，橘皮紋棕眼明顯，口足均露白邊一道，近底足處，白釉泛青。胎骨略厚，細白堅緻。外底白地上淺刻「大明宣德年製」六字二行楷款，外加雙圈。宣德寶石紅釉為世所稱，明代王世懋《窺天外乘》中即提及宣德窯：「以鮮紅為寶」。 \n寶石紅茶鍾口徑十公分左右，與所謂的明初洪武茶鍾，以及後來《江西省大志》上所載嘉靖白瓷暗龍紋茶鍾大小、形制相近，顯見茶鍾樣式自明初開始宮廷已規格化，宣德寶石紅茶鍾至於清代仍為乾隆皇帝喜愛，因此特別為其選配新石器時代的栗黃 凸緣玉璧作為茶托，凸緣壁上刻有乾隆34年(己丑‧1769)御製詩〈詠古玉椀托子〉：「圓如璧有足承之，置器何愁覆餗為。土浸 久成栗蒸色，石攻後異草垂時。不辭一旦絮城出，似恨當年玉椀離。淨几原堪作珍玩，曾經誰玩亦堪思。」。乾隆茶器的混搭風格與今日好茶人士一樣，援以古物今搭，創意配套。","cat":"故宮","details":["東亞茶文化展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[{"id":"recj9BkloPzQZSvTC","name":"明朝"}],"exhibitions":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}],"artists":[],"attachments":["Screenshot_20210424101406.jpg"]},{"id":"rec3yOUwXywjTtXga","name":"元 茶洋窯 醬釉茶盞","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"南購瓷000109","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec40EwC5EdBL89Nb","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619148777823_8540603708368342087.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（L89Nb）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"rec41qBsRCWF0Vbd8","name":"岩石特徵與礦物組成","notes":"岩石特徵與礦物組成\n\nRock characteristics and mineral constituents\n\n臺灣閃玉呈暗綠色至黃綠色、半透明或不透明、具發達的片理、含有黑點 礦物,並常與石榴子石、滑石、黃鐵礦等礦物共生。閃玉因斷層滑移產生 的高温伴隨脱水作用將蛇紋岩換質而成,當岩層受到擠壓,在閃玉和蛇紋 岩的滑動面上常形成纖維狀的透閃石石棉或蛇紋石石棉。因石棉出現在片 岩與蛇紋岩接觸帶上,因此,礦工便沿著石棉礦脈尋找閃玉。閃玉屬於角 閃石類礦物,為透閃石-陽起石混合之固溶體,並以透閃石為主。以臺灣 閃玉為例,內部還常含有少量的鉻鐵礦、透輝石、鈣鋁榴石、矽硼鈣石或 符山石等礦物。","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1618993981529_9160656639452060694.jpg","1618993993332_617093407121395172.jpg","1618994003740_3943489184544368465.jpg","1618994014111_5350997989571806522.jpg","1618994025472_8459550587234360054.jpg","1618994035358_2807760744645234075.jpg","1618994049348_3822708268663584016.jpg","1618994061172_263817522621186479.jpg","1618994077145_7889652299621141762.jpg","1618994090650_5701593234280202788.jpg"]},{"id":"rec46LFUfDj1Ds6Lw","name":"宋 耀州窯 青瓷印花菊花紋茶盞 一對 ","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—唐風宋韻","period":"","number":"故瓷013974 故瓷008726","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec4FnzyWazhVcgij","name":"","notes":"","cat":"奇美博物館","details":["羅丹"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619159639376_5002430981871735243.jpg","1619159649666_6710093212544576610.jpg"],"displayTitle":"羅丹｜待辨識紀錄（Vcgij）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"rec4Nw1n73uNdzM52","name":"11明鄭時期","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619149374524_58593099983524 "years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec4yUkNCgVsP9Sve","name":"","notes":"","cat":"故宮","details":["青銅饗宴：古代的禮儀與樂曲"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619250385138_558997136941244960.jpg"],"displayTitle":"青銅饗宴：古代的禮儀與樂曲｜待辨識紀錄（P9Sve）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"rec4yf3XWzojJ0yf8","name":"清人\n天后安瀾","notes":"清人\n天后安瀾\n本幅收在《天開壽域南極圖》冊第11開，「壽域」為長生域土，全冊均為祝壽而作，採右圖左文配置。左幅題詩以泥金書寫，邊框飾以多色的泥金纏枝紋，光彩煥然。右幅以乘坐輦車、隨從簇擁的媽祖為中心，一旁有仙人作揖相迎。輦車行經處風平浪靜，對比周圍洶湧波濤，呼應題詞「海不揚波」，彰顯天后的海洋守護神形象。","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第一檔）","period":"","number":"","url":"","wiki":"","years":[{"id":"recTL4AlTXJe0JgVt","name":"清朝"}],"exhibitions":[],"artists":[],"attachments":["Screenshot_20210424102227.jpg"]},{"id":"rec5Bdg8mp4k5GxYC","name":"","notes":"","cat":"奇美博物館","details":["17至18世紀：宮廷與市井"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619169523653_4240245836151330536.jpg","1619169532604_8853707224105503229.jpg"],"displayTitle":"17至18世紀：宮廷與市井｜待辨識紀錄（5GxYC）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"rec5Ciu2LC7JvGIOL","name":"越南黎朝 白瓷印花菊花鳥紋茶鍾 附凸緣玉璧茶托","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—明人雅集","period":"","number":"故瓷017727 故瓷017727-N1","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec5GD7tvUOu9S0Bd","name":"清 康熙\n青花山水人物六方茶葉罐","notes":"清 康熙\n青花山水人物六方茶葉罐\n高17.1公分 口徑3.7公分 足徑3.7公分\n罐呈六方形，直口，斜肩，直壁，矮圈足，口足亦為六方形，帶平頂六方蓋。蓋面青花繪一蟠螭，蓋壁飾六字三種不同書體的「壽」字，加飾青線三道。罐肩滿畫靈芝如意紋，罐腹則飾山水人物畫，雲松下二老者，一抬頭持杖遙指飛翔而來的仙鶴，另一老者及一揹罐童子亦仰面迎望飛鶴，罐腹上下各飾回紋一周，足邊則為轉枝葉紋一周。胎質細膩，釉色鮮麗、濃淡層次分明，為典型康熙「墨分五色」青花釉色。底青花書「大清康熙年製」六字二行楷款。","cat":"故宮","details":["東亞茶文化展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[{"id":"recTL4AlTXJe0JgVt","name":"清朝"}],"exhibitions":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}],"artists":[],"attachments":["Screenshot_20210424101328.jpg"]},{"id":"rec5JG1tD0pm3sv6z","n ],"attachments":[]},{"id":"rec5xM57AAU3ylkkm","name":"清 康熙 磁胎畫琺瑯彩五色西番花紅地茶碗 一對","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—清代品茗","period":"","number":"故瓷011367 故瓷011368 ","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec648xRbrRPz4phx","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619146752623_5185384029937027533.jpg","1619146771111_7173479370533430557.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（z4phx）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"rec64BFgaMaazCE64","name":"島嶼尖端的渡船伕 Boatman by the Island","notes":"島嶼尖端的渡船伕 Boatman by the Island\n\n尚-巴普堤斯特·卡米爾·柯洛 (法國:1796-1875) 年代不詳,油彩、畫布\n\nJean-Baptiste Camille COROT\n\n(French, 1796-1875) Undated, Oil on canvas\n\n柯洛是十九世紀法國最具影響力的風景畫 家,畫中有獨特的田園詩意和朦朧之美。 帆船與船伕是柯洛相當喜愛的主題,畫中 的大樹帶出停泊後方的帆船與小屋,以及 左側遠方行駛的小船與河岸。畫面以綠色 調勾勒林木原野,並以淺灰色調和藍白色 系的天際與水面,交融的色澤烘托出柔 和、矇嶽且天水交映的浪漫氣氛。\n\n0000015","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619166261685_2096489471116161081.jpg","1619166276131_6026777396056631822.jpg"]},{"id":"rec656Xu1zv6Uyzxf","name":"明人雅集 中國茶文化","notes":"明人喫茶方式，是將茶葉直接投壺沖泡，再轉注茶鍾飲用，奠定了今日的泡飲方式。茶壺與茶鍾成為主要茶器。茶杯以「潔白如玉，可試茶色」的白瓷為尚，青花瓷茶器也頗流行。茶器除了既有的陶瓷製品外，明晚期宜興紫砂及朱泥茶壺的使用亦蔚為風尚。","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—明人雅集","period":"","number":"","url":"","wiki":"","years":[{"id":"recj9BkloPzQZSvTC","name":"明朝"}],"exhibitions":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}],"artists":[],"attachments":[]},{"id":"rec65ujHFEKIF40aN","name":"明文震孟草書七言律詩","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第二檔）","period":"","number":"購書001461N000000000","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec672a9vqLlhiWeA","name":"藏文《甘珠爾大藏》","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第4單元　經藏的流轉","period":"清乾隆35年（1770）內府泥金寫本","number":"故藏000111〜000122","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec68V7I9gzXboMZ8","name":"西周晚期\n永寶用鐘","notes":"西周晚期\n永寶用鐘\n此鐘器身有銘文「永寶用」三字，表達祭祀者對於自身無愧先祖的惕勵，以及對於子孫繼承家業的期許。此鐘的形制和紋飾與本院典藏國寶〈西周晚期 宗周鐘〉相似，只是尺寸較小，紋飾略為簡化。鐘體下方「鼓」部正中是敲擊揚聲之處，本鐘右側有一隻簡化的鳳鳥，標記著可敲擊出不同頻率音響的位置。","cat":"故宮","details":["青銅饗宴：古代的禮儀與樂曲"],"sub":"","period":"","number":"","url":"","wiki":"","years":[{"id":"recwR1PHYemP0Fomt","name":"西周"}],"exhibitions":[],"artists":[],"attachments":["20200521164041767533.jpg"]},{"id":"rec6DraVZaDoIkYrd","name":"納穆娜","notes":"納穆娜 Namouna\n\nNamouna\n\n亨利·亞德里安·塔諾斯 (法國,1865-1923) 1887,油彩、畫布\n\nHenri Adrien TANOUX\n\n(French. 1865-1923) 1887, Oil on canvas\n\n納穆娜曾為情聖哈山的奴隸,但因愛上 了哈山,所以在離開之後想盡辦法改變 樣貌,只求再度回到愛人的身邊。最 終,哈山感受到納穆娜誠摯的愛,進而 將對她的性愛慾望昇華成真正的愛。本 作描繪納穆娜重新以奴隸身份晋見哈 山,但怕被識破故以左手臂遮住自己的\n\n0010571\n\n作品中文名稱\nChinese Title\t納穆娜\n作品英文名稱\nEnglish Title\tNamouna\n作者中文姓名\nArtist (Chinese Name)\t亨利‧亞德里安‧塔諾斯\n作者原文姓名\nArtist\tHenri Adrien TANOUX\n國籍\nNationality\t法國\n生卒年\nArtist Dates\t1865-1923\n年代\nDate Made\t1887\n簽名\nSignature\t右下角 : Adrien Tanoux. 1887\n材質\nMedium\t油彩、畫布\n尺寸\nDimensions\t301.5 x 401.5 公分\n典藏編號\nAccession Number\t0010571\n \n亨利‧亞德里安‧塔諾斯（Henri Adrien Tanoux, 1865-1923）大都以油畫為其創作媒材，雖然畫家亦以印象畫派形式做風景畫練習, 他的藝術創作主要包含肖像畫、世俗作品和裸體畫。塔諾斯在元素的選擇和表現形式多以傳統沙龍繪畫為主，且偏好新古典主義的人物形式；然而，在他的創作中，塔諾斯仍能藉由光線的安排及多樣的筆法，傳神的描繪出各種材質特色，打破制式化的線性輪廓。\n\n塔諾斯的世俗畫為他在沙龍展帶來盛名，左拉（Èmile Zola, 1840-1902） 將當時代沙龍對日常生活繪畫的喜愛歸因於此類作品對資產階級具有娛樂價值。事實上，作品對城市或鄉下低層生活的描寫是畫家對社會議題陳述。塔諾斯將鄉間的生活注入牧羊田園般的理想化想像，描繪農場女工休憩時的景象，或對不同社會階層場景的表現。\n\n塔諾斯也是當時代著名的肖像畫家，著名的人士如法國總理菲利‧福爾（Félix Faure, 1841-1899）皆曾是他筆下的人物，除了官方或平民肖像創作外，塔諾斯亦描繪東方且較情色的人物畫。\n\n塔諾斯最後的創作階段主以表現裸體畫，且常以東方場景作為元素；他的老師雷尼爾（Antony Régnier, 1835-1909）和博納（Léon Bonnat, 1833-1922）早已跟隨安格爾（Jean-Auguste-Dominique Ingres, 1780-1867）和德拉克羅瓦（Eugène Delacroix, 1798-1863）描繪當時法國對東方世界的遐想，此一思潮源於十八世紀末拿破崙的埃及戰役所興起東方研究的熱潮。這一東方主題深獲喜愛，它是一種以男性角度來描繪後宮場景，將陌生的地方視為情色的釋放，這是當時歐洲對東方集體既有的想像。塔諾斯也運用此一思潮，將裸體作為道德敘事般的場景，女性的裸體儼然成為畫中的主題。(蔡敏玲)","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["CWAPA-0010571-Si-001-i.jpg","1619164660619_2661445030631848894.jpg","1619164686953_4240839672427236582.jpg"]},{"id":"rec6EqXPSWc9nmV6t","name":"","notes":"","cat":"奇美博物館","details":["17至18世紀：宮廷與市井"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619169262778_8707343689961527166.jpg","1619169271973_8181298246155049563.jpg"],"displayTitle":"17至18世紀：宮廷與市井｜待辨識紀錄（nmV6t）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"rec6FRB8eeV0v7PKL","name":"","notes":"","cat":"奇美博物館","details":["藝術修復"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619161585611_3854867572554660251.jpg","1619161596264_3368644286683162286.jpg"],"displayTitle":"藝術修復｜待辨識紀錄（v7PKL）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"rec6NlYq7QKUfj54N","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619148822927_211266295027581156.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（fj54N）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"rec6SC52F9xkFnbOn","name":"青花苔石詩文圖茶壺","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"南購瓷000157 ","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec6Uksf02lTO2QS0","name":"","notes":"江兆申（1925-1996），〈山水─黃葉村〉，1984，\r\n彩墨、紙，65.3×100 公分。\r\nChiang Chao-Shen (1925-1996), Landscape: Huang-Yeh \r\nVillage, 1984, colored ink on paper, 65.3 × 100 cm.","cat":"國美館","details":["海外存珍"],"sub":"乙、豐采──豐實、沈澱、光采","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[],"displayTitle":"江兆申｜山水─黃葉村","titleBasis":"依原始說明"},{"id":"rec6dYe6ghktOhqA9","name":"明 宣德 青花轉枝海棠紋茶葉罐","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—明人雅集","period":"","number":"故瓷014346","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec6hoPtDGFH2edHc","name":"施洗者約翰 St. John the Baptist","notes":"施洗者約翰 St. John the Baptist\n\n(曹)克里斯多夫·昌里耶\n\n約1682102年開、大挖石\n\n拿里那是雌东晋傑(Piere Puget H20-41694) 的再生,但早在1660年間就成為小有名氣 的呼望家。曾為許多教會或貴族製作雕 望。居住在哈斯的施洗者约翰,總是穿著 駱駝皮毛里手拿長柄十字架,身旁的羔羊 則是伴隨他出現的固定元素。","cat":"奇美博物館","details":["17至18世紀：宮廷與市井"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619168566676_3080987382599064716.jpg","1619168574885_930684900226123252.jpg"]},{"id":"rec6sGBBFFpVUYT3E","name":"臺灣閃玉是怎麼形成的? ","notes":"臺灣閃玉是怎麼形成的? How is Taiwan nephrite formed?\n\n臺灣閃玉的岩石結構與葉蛇紋石蛇紋岩者類似,且閃玉中出現蛇紋石、 鉻鐵礦和鉻尖晶石包裹體,研判是由蛇紋岩經鈣富集之熱水換質作用的 產物。結合多位學者研究結果,臺灣閃玉(以透閃石為主)的形成條件大 致為:換質溫度300-420℃,壓力2.2-3.5千帕,相當於地表下8到13公 里的深度,而形成時間大約距今3.3±1.7百萬年,可能是目前世界上發 現最年輕的閃玉(俞震甫等,2014)。綜合這些分析資料研判,臺灣閃玉可 能是在呂宋島弧與歐亞大陸邊緣碰撞引發岩體抬升時期,因斷層滑移產 生的高温伴隨脱水作用將蛇紋岩換質成閃玉。","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1618993778388_2007273425671669804.jpg","1618993799835_3491470112237229040.jpg","1618993815981_3872359632096616194.jpg","1618993830251_7419956782242281959.jpg","1618993841079_1517099259460060985.jpg","1618993852379_5317899801058978520.jpg","1618993864142_3070372309294411928.jpg","1618993875782_3497282119704427756.jpg"]},{"id":"rec6w76l5nkBxGahi","name":"唐宋名繢　冊　宋蘇漢臣貨郎圖 冊 故畫001234-5","notes":"","cat":"故宮","details":["畫琳瑯—貨郎圖特展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1620458288475_3198013103866782569.jpg","1620458278937_1482679192455942694.jpg","1620458296604_3767796686979391908.jpg","1620458306374_8424285986408290624.jpg"]},{"id":"rec6zWGxkQDdIf2E0","name":"民國吳敬恆墨寶","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第二檔）","period":"","number":"贈書000011N000000000","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]}, ":"rec7b6IxGVmVnLUWU","name":"明\t文徵明\t書太上老君說常清靜經\t冊","notes":"","cat":"故宮","details":["筆墨見真章"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec7hzQNXs0fndvBF","name":"","notes":"","cat":"奇美博物館","details":["羅丹"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619160169480_6631993917810541402.jpg","1619160181756_5506734844855494717.jpg"],"displayTitle":"羅丹｜待辨識紀錄（ndvBF）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"rec7iv4CPJqh5GK8B","name":"","notes":"","cat":"故宮","details":["青銅饗宴：古代的禮儀與樂曲"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619250455528_1174186905856057720.jpg","1619250468719_2664331149789577813.jpg","1619250478258_3261812702092085253.jpg"],"displayTitle":"青銅饗宴：古代的禮儀與樂曲｜待辨識紀錄（5GK8B）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"rec7pMfkrNC0S614g","name":"清 何紹基 行書七言聯","notes":"清 何紹基 行書七言聯\n\n何紹基(1799-1873),字子貞、湖南道州 人·道光十六年(1836)進士,畫法早歲得力於 顏真卿(709-785),於北碑、漢隸亦有鑽研, 風格獨特鮮明。\n\n此聯「卷石為山猶磊码,微風遇水亦波\n\n滿」,書寫時刻意強調墨色濃淡枯潤的演繹變 化,完整體現「帶燥方潤,將濃遂枯。」用畫\n\n的理論與技巧,精神飽滿,酣暢淋漓。","cat":"故宮","details":["筆墨見真章"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1620456568904_7459451529990567066.jpg","1620456658024_7372484678567121231.jpg","1620456668891_2558451919067690837.jpg"]},{"id":"rec7tdVnzJjV41Dcu","name":"清\n乾隆時期裝 天府球琳盒","notes":"清\n乾隆時期裝 天府球琳盒\n乾隆八年時，受蟲蛀的影響，將先前整理過的九份百什件下令重新裝配，這些百什件都被乾隆皇帝取了名字，選展這件叫〈天府球琳〉。\n由一個兩層的日本蒔繪漆盒組裝。乾隆皇帝利用漆盒原有的空間，做成上下屜，依古玩的高矮胖瘦所製作的格子，還有大小不同的暗屜，暗屜上還有做成冊頁封板之裝飾。在下層小屜中的暗屜內有「天府球琳」收藏清冊，清楚記載著此件所收藏的古玩。\n此外，也為其設計一個大小尺寸剛好的嵌骨紫檀木的華麗外套箱。這種有外箱，內盒再加上摺子的百什件，為乾隆初年百什件的代表作品。","cat":"故宮","details":["皇帝的多寶格"],"sub":"","period":"","number":"","url":"","wiki":"","years":[{"id":"recTL4AlTXJe0JgVt","name":"清朝"}],"exhibitions":[],"artists":[],"attachments":["20200221141800050756.jpg"]},{"id":"rec7uDtN7pYe8eTBo","name":"取暖的工匠\n\nWorkmen by the Stove","notes":"取暖的工匠\n\nWorkmen by the Stove\n\n尚‧尤金·布隆\n\n(法國,1852-1927)\n\n1906,油彩、畫布\n\nJean Eugène BULAND\n\n( French, 1852-1927) 1906, Oil on canvas\n\n兩位工匠坐在火爐前取暖,挺立於中央 的男子以肅穆的神情注視著觀者;一旁 的戴帽男子,向前駝背的身軀與略為伸 向火爐的雙手,流露其在寒冬裡極欲取 暖的神態。人物們逼真的神態以及衣 服、木板、鐵片和白煙等各種質感的傳 神表現,展現著布隆嫻熟的繪畫技巧。","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619166549630_7113350053878355121.jpg","1619166564867_7811053977839442084.jpg"]},{"id":"rec7vA7vOj9YBWhmY","name":"清 雍正 瑪瑙茶鍾","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—清代品茗","period":"","number":"故雜000321 ","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec7x8piA8223tIm2","name":"裝飾佛","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第2單元　佛陀的智慧","period":"巴基斯坦斯瓦特地區 / 西元7世紀","number":"贈銅000050","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619243295348_8103199571819659346.jpg","1619243306729_4774659373282126936.jpg"]},{"id":"rec826ZVSF1WJEnkR","name":"玉斧\n\n新石器時代 國立自然科學博物館典藏","notes":"","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1618993228632_5616457162442938061.jpg"]},{"id":"rec84nR48j8GCelM6","name":"明文伯仁品茶圖　軸","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—唐風宋韻","period":"","number":"故畫002209 ","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec8CgGN2qHm11S4R","name":"明鄭成功草書中堂","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第一檔）","period":"","number":"贈書000582N000000000","url":"https://catalog.digitalarchives.tw/item/00/60/7d/10.html","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec8FdiWzHUiS7uMt","name":"陳進 (1907-1998)，〈廟前〉","notes":"陳進 (1907-1998)，〈廟前〉，1953，\r\n膠彩 、絹，44.3×52.5 公分。\r\nChen Chin (1907-1998), In the Front of a Temple, \r\n1953, gouache on silk, 44.3 × 52.5 cm.","cat":"國美館","details":["海外存珍"],"sub":"甲、蓊鬱─百歲前輩典範","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["Screenshot_20210424233347.jpg"]},{"id":"rec8GI7z8qVEoAChf","name":"宜興窯朱泥壺 魏志榮先生捐贈","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"清末民初 工夫茶器一組","period":"","number":"南普贈000010","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec8HGcWW0qUrRw0k","name":"清 乾隆 瓷仿拉古里木紋茶碗","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"蒙藏奶茶","period":"","number":"故瓷004207","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec8Svv7ZiSfKLoau","name":"明 萬曆 嬌黃撇口茶碗","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—明人雅集","period":"","number":"故瓷013186","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec8f1txSPCduJDXQ","name":"南宋 福建 黑釉茶盞","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—唐風宋韻","period":"","number":"南贈瓷000002","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec8fKK4GM0d7E0lE","name":"奧南的盧河谷地 Loue Valley in Ornans","notes":"奧南的盧河谷地 Loue Valley in Ornans\n\n\n居斯塔夫·庫爾貝\n\n(法國,1819-1877)\n\n年代不詳,油彩、畫布\n\n\nGustave COURBET (French, 1819-1877) Undated, Oil on canvas\n\n\n庫爾貝是寫實主義的創始人,也是反抗 傳統學院風格的先鋒人物。其風景畫多 以家鄉奧南為主,本畫即為當地的山 谷。溪流從高大山脈間的交錯處潺潺而 過,而灰黑的山石在各種層次的筆法 下呈現崎嶇與陡峭之勢,配合山岩上 的草皮、林木與前景的綠色平原,傳神 地展現原始粗曠的自然野景。","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619166575978_6815418219419824183.jpg","1619166584607_9085151183114670746.jpg"]},{"id":"rec8foXyyTG1sY44S","name":"","notes":"","cat":"故宮","details":["青銅饗宴：古代的禮儀與樂曲"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619250074607_8355846240175426801.jpg"],"displayTitle":"青銅饗宴｜展覽概述","titleBasis":"依展場照片標示"},{"id":"rec8gLa1qw3NGkTwA","name":"知名玉石文化","notes":"知名玉石文化\n\nWell-known jade cultures\n\n中國玉石文化與遺址\n\nChinese jade culture and sites\n\n華人崇尚玉石的傳統其來有自,各地遺址出土不少玉器為證,其 中較具代表性者有紅山文化與良渚文化等,均屬於新石器時期。 紅山文化出土玉器種類繁多,包含各種動物形器、馬蹄形器、玉 神面具等,尤以動物形器量多質精,是中國古玉起源與基礎。馬 蹄形玉器也是紅山文化獨有的器形,呈長筒形且一端斜切的扁圓 體,目前多半認為與宗教有關。以出土玉器聞名的良渚文化,廣 布於長江流域下游太湖流域,出土大量璧、琮、鉞等禮器,雕琢 精緻、品項豐富,使其在同時期的中國乃至環太平洋擁有玉傳統 的族群文化中獨占鰲頭。","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1618993437156_308412011423284122.jpg"]},{"id":"rec8mBlNT3uqZA8FM","name":"名賢妙蹟　冊　宋李嵩市擔嬰戲 冊 故畫001255-3 國寶","notes":"","cat":"故宮","details":["畫琳瑯—貨郎圖特展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec902FBn5hDUZOs0","name":"","notes":"","cat":"故宮","details":["青銅饗宴：古代的禮儀與樂曲"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619250579628_7687863693172053476.jpg","1619250590447_5796425864203257816.jpg","1619250603299_5892841136567503057.jpg","1619250613296_5560804335363580273.jpg"],"displayTitle":"商代晚期｜亞醜方尊","titleBasis":"依展場照片標示"},{"id":"rec94mfOJRCrw4elj","name":"","notes":"","cat":"奇美博物館","details":["19世紀沙龍廳"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619166144753_6233539565922861655.jpg","1619166112172_7066179128809670375.jpg"],"displayTitle":"19世紀沙龍廳｜待辨識紀錄（w4elj）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"rec95b27spfmGcN65","name":"民國溥儒關渡天后宮碑","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第一檔）","period":"","number":"寄存002026N000000000","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rec98r5f0gqhbd1Z4","name":"坐佛三尊像佛板","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第2單元　佛陀的智慧","period":"唐（618-907） 西元7-8世紀","number":"贈銅000165","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619243040104_53 且成熟的讽節器與喪葬品。周朝祭祀有六禮器:蒼 壁禮天,黃琮禮地,青珪禮東方,赤璋禮南方,白琥禮西方,玄璜禮北方。玉璧是固型且中間有回 孔的片狀玉器,玉琮則是中間有同洞的柱狀器:上尖下方的片狀玉器是于理,形似玉挂的璋則是一 潘斜刃,一端穿孔的扁平長方體,又稱半珪;刻有虎紋或難成虎形的玉器是玉城,上弦月形的半圆 佩飾谓之璜。除此之外,尚可分為佩飾器、喪葬器,劍武器和服飾器等幾種類型。","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1618992822937_3574619922775270325.jpg","1618992833574_5327084518538714325.jpg","1618992854571_8573751309303035337.jpg","1618992871262_353657814434077934.jpg","1618992884819_2178835958669746434.jpg","1618992898847_5247409313912149139.jpg","1618992910203_8125182187352059804.jpg"]},{"id":"recBxkwkua1znsLmu","name":"","notes":"","cat":"故宮","details":["青銅饗宴：古代的禮儀與樂曲"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[],"displayTitle":"青銅饗宴：古代的禮儀與樂曲｜待辨識紀錄（nsLmu）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recC0SLDMad2QJM8S","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619146044568_5516581373475212988.jpg","1619146059800_6658241274920891813.jpg","1619146071735_7686728730824580847.jpg","1619146083440_5559070830999018948.jpg","1619146096620_730986233057102583.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（QJM8S）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recC7LuafBD0owaxe","name":"最後的眼淚\n\nThe Last Tears","notes":"最後的眼淚\n\nThe Last Tears\n\n那爾西斯·威吉勒·迪亞茲·德·拉·培納\n\n(法國。1807-1876)\n\n年代不詳,油彩、畫布\n\nNarcisse Virgile DIAZ de LA PEÑA\n\n(Freerich, 1807-1876)\n\nUndated, Oil on canvas\n\n培納的風景盆或是浴女畫作較為著名, 本作則是少數詮釋個人精神層面之作。 灰黑烏雲壟罩下的抑鬱天空,罩著粉紅 外衣的女子带領著一位背向觀者的裸女 乘風飛揚,試圖表現未來身亡時「能去 除垂魂中悲傷的眼淚,卸下俗世的包 袱,而到達天堂體會永恆」的概念。","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619165174370_8632337181348698343.jpg","1619165186710_230441221130324917.jpg"]},{"id":"recC7QAfEWubu30jZ","name":"清聖祖康熙行書　軸","notes":"","cat": ，是貴霜王朝 （西元1世紀-320）常見的造像。女藥叉像神情柔和，嘴角含笑，雙乳豐滿，全身S形的扭擺連動著細腰與寬臀，肌膚圓潤緊實，造像風格與該地許多西元二至三世紀的作品一致。\n\n女藥叉信仰源於印度先民崇拜的地母神、樹精，豐乳寬臀的造型即為豐饒多產的象徵，而攀扶樹枝的姿式又可能與祈求豐饒的古老儀式有關。這種女藥叉信仰後被佛教所收攝，成為佛教的守護神之一，進而出現在佛塔欄楯中。","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"","period":"貴霜王朝（西元1 世紀-320）","number":"南購雜000001","url":"https://south.npm.gov.tw/SelectionsDetailC004100.aspx?Cond=62e5a2e8-77a4-4b72-9cb5-ccc019183d59","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["20190524183645657509.jpg","1619242302867_5776897549248078685.jpg","1619242322226_2276353703504642102.jpg"]},{"id":"recDqpogeKrSiMgmp","name":"明 永樂 甜白暗花雙龍紋茶鍾","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—明人雅集","period":"","number":"故瓷017641","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recDxac8mLCwbfkpx","name":"","notes":"","cat":"奇美博物館","details":["羅丹"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619159697652_2441141261384331101.jpg","1619159708810_2375048236163044168.jpg"],"displayTitle":"羅丹｜待辨識紀錄（bfkpx）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recE3PkqvV5mb6kRp","name":"聖母瑪利亞、耶穌嬰兒與 聖塞巴斯汀和聖洛可 Virgin Mary, Jesus Infant with Saint Sebastian and Saint Roch","notes":"聖母瑪利亞、耶穌嬰兒與 聖塞巴斯汀和聖洛可 Virgin Mary, Jesus Infant with Saint Sebastian and Saint Roch\n\n安德烈亞·薩巴提尼\n\n(新大利,1484-1530 ) 1524,油彩,由木板時至亚布\n\nAndrea SABBATINI (Italian, 1484-1530\n\n1524, Oil, panel laid down on canvas\n\n聖母子两侧的男子分別是聖塞巴斯汀和 聖洛可。兩人皆為瘟疫患者的守護者, 分別以受難的形象出現:聖塞巴斯汀被 綑綁在樹幹且身中數箭,聖洛可則拿著 掛有行囊的手杖並指向大腿上因黑死病 而導致的疤疤。從兩位聖人的身份可推断 本作應與十六世紀黑死病的肆虐有關。","cat":"奇美博物館","details":["藝術廳","13至16 世紀:神性與人性"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619167203469_3727240960977311858.jpg","1619167216089_6495015974367557244.jpg"]},{"id":"recE58rO1R8hzsmro","name":"— 玉 石 典 型 —","notes":"具有溫潤瑩秀光澤的玉石，讓華人發展出一套識玉、治玉、賞玉、惜玉的傳統與文化。東亞早在八千年前已有使用玉器，中國歷史時代早期，玉更被製成重要的禮器。玉的質樸與成品自古深植在華人社會與生活，無論是文字的運用或是相關器物的使用，因而形成獨特的玉石傳統與文化。","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["index-icon-1-753x764.jpg"]},{"id":"recE6SMN4AlOAfxpL","name":"","notes":"","cat":"北美館","details":["塩田千春：顫動的靈魂"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1620471376942_8518762327587989765.jpg","1620471387753_953378357336681327.jpg","1620471397436_6610913121043864452.jpg"],"displayTitle":"塩田千春：顫動的靈魂｜待辨識紀錄（AfxpL）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recEAwG8yVfA1Fqjj","name":"濕婆","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"印度教","period":"柬埔寨 / 高棉王朝(802-1432) 西元12-13世紀","number":"贈銅000072 ","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619247411107_3667450053322587014.jpg","1619247425113_3935258887287703965.jpg"]},{"id":"recEDRMTdcPtYwS7w","name":"藏文《龍藏經》","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第4單元　經藏的流轉","period":"清康熙8年（1669）內府泥金寫本","number":"故藏000001〜000024、 故藏000026〜000090、 故藏000092〜000110","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619246327246_8301887197406376443.jpg","1619246340985_3583861775820792986.jpg","1619246358207_8225428360756599989.jpg"]},{"id":"recEEEyW0eFMtNyIq","name":"卸下聖體 The Deposition","notes":"卸下聖體 The Deposition\n\n傑拉德·大衛工作坊 (法蘭德斯,1460-1523) 年代不詳,油彩、木板\n\nWorkshop of Gerard DAVID\n\n(Flemish, 1460-1523) Undated, Oil on panel\n\n身處義大利文藝復興蔓延北方之際的大\n\n衛,向來堅持遵循法蘭德斯的繪畫傳 統。畫中自十字架卸下的耶稣屍首由亞 利馬太的約瑟承接,一旁的聖母瑪利亞 輕吻著耶穌手背,而抹大拉瑪利亞和福 音書作者約翰則在一旁拭淚和觀看。\n\nhttps://peekingbehind.chimeimuseum.org/Theme/paintings/2011251742370\n\n畫家是誰？\n\n\n傑拉德‧大衛（Gerard David, 1460-1523）主要活躍於布魯日地區(比利時西北部)，被認為是十五世紀最後一位遵循楊・范・艾克（Jan van Eyck, 1422-1441）寫實傳統的早期尼德蘭繪畫大師。作品以宗教畫為主，廣受當時市場喜愛，擅長細膩精確地刻畫手法，尤其對於聖母形象和風景的描繪有其獨特韻味。\n\n\n畫了什麼？\n \n畫作典故\n\n\n畫面描寫\n\n\n\n「卸下聖體」是基督教繪畫中相當重要的題材，出現的人物有時會因依據的文本不同而出現差異，文本中所提到的人物如：百夫長6 （centurion）前往查看耶穌是否已身亡、亞利馬太的約瑟（Joseph of Arimathea）向彼拉多領回耶穌的身體安葬，抹大拉的瑪利亞（Mary Magdalene）、雅各和約西的母親瑪利亞（Mary the mother of James and Joses）、撒羅米（Salome）等人，以及帶著沉香和沒藥前來參與耶穌埋葬的尼哥底母（Nicodemus）等，皆有可能出現在卸下聖體的圖像表現之中，並依照不同時代的慣用手法有不同的描繪方式。\n\n\n雖然「卸下聖體」的相關經文中並未提到福音書作者聖約翰，但在許多「卸下聖體」的圖像中都會加入聖約翰，作為見證耶穌屍身自十字架被挪下來的人物之一，就像奇美博物館收藏的這幅〈卸下聖體〉。\n\n \n\n\n其他相似的版本在哪裡？\n\n畫家大衛所創作的〈卸下聖體〉應該是當時相當受到歡迎的作品，有許多傳為出自大衛工作坊的同名且類似圖像的作品。最著名的是目前藏於美國弗里克收藏（The Frick Collection）的〈卸下聖體〉。耶穌蒼白的身軀成為畫面中心，四周人物充滿悲戚。人物的面容、肢體、服飾和風景都描繪得相當細膩，有著一種沈靜、無言的悲戚。\n \n \n\n卸下聖體\n《卸下聖體》，傑拉德・大衛工作坊，1500年後，油彩、木板, 20 x 14公分，烏菲茲美術館。\nGalleria degli Uffizi, Florence, Tuscany, ItalyPhoto © Fine Art Images/Bridgeman Images.\n\n\n與奇美博物館〈卸下聖體〉最為相像的則是現藏於烏菲茲美術館（the Uffizi Gallery）的〈卸下聖體〉（The Deposition）。整體的構圖相似度高，但在人物的位置安排上卻有所變動。例如：抹大拉的瑪利亞位於梯子下方。人物的衣著也有所不同。例如將抱著耶穌屍身的男子，不論是頭髮或衣著都與奇美版本有所差異。\n","cat":"奇美博物館","details":["藝術廳","13至16 世紀:神性與人性"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619167488143_3492257769045181268.jpg","1619167499350_1693564875066542436.jpg"]},{"id":"recEFSzeS5AzP74fY","name":"羊脂白玉","notes":"","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1618993042262_1675912152906141907.jpg","1618993060214_7262129425077589386.jpg"]},{"id":"recEOGcRD2wup7G1i","name":"聖母子在榮光中(聖壇正面鑲板) Madonna and Child","notes":"聖母子在榮光中(聖壇正面鑲板) Madonna and Child\n\nin the Glory (Altar frontal)\n\n作者不詳 (加泰隆尼亞)\n\n約1200年\n\n蛋彩、木板\n\nAnonymous (Catalonia)\n\nca.1200\n\nTempera on panel\n\n托扶著聖母子光圈的四位天使分別 是:加百列(S. GABRIEL ),米迦勒(S. MICHAEL)、基路伯智天使(CHERUBIM) 與撒拉弗熾天使(SERAPHIM)。聖母拿 著紅色果實象徵她是「新夏娃」,而耶穌 則舉手祝福並拿著象徵智慧與誠命的害 本,突顯智慧君王的本質。","cat":"奇美博物館","details":["藝術廳","13至16 世紀:神性與人性"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619166980971_3214026336590891269.jpg","1619166992890_176657828907943850.jpg"]},{"id":"recEOzAV8LAehrGTU","name":"佛並坐(殘件)","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第2單元　佛陀的智慧","period":"吉林省半拉城遺址出土 / 北朝(420-589) 西元6世紀上半葉 ","number":"中日雕000007","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619242830931_5693005879528276138.jpg","1619242844607_535296372122236425.jpg"]},{"id":"recEUX0Zl1STj1XuQ","name":"白陶竹文圖風爐","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"南購瓷000160","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recEa7fsq0w48BwRQ","name":"立佛","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第2單元　佛陀的智慧","period":"韓國 / 統一新羅時期（668-935） 西元8世紀前半","number":"贈銅000247","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619243148756_3064966092838328168.jpg","1619243159115_4108702730934332288.jpg"]},{"id":"recEn4xHOSoSoxVSy","name":"治玉工藝技術","notes":"《禮記。學記》記載「玉不琢，不成器」，亦即是說玉石若無經過雕琢，便無法成為玉器。閃玉通常呈緻密塊狀產出，因具有纖維交織結構，質地堅韌，為最具韌性的寶石。臺灣史前玉器造型獨特而優美，其工藝技術令人讚嘆；近代雕琢工具與技術益加精進，兩相比較得以一窺其中奧妙。","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["index-icon-5-753x764.jpg"]},{"id":"recEpjhdxByd98NMe","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619148840018_281242541726107357.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（98NMe）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recErxFPGAUjLpcVk","name":"日本 江戶時代 三足銅風爐","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"南購銅000031 ","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recEw2TsEmMoscVmA","name":"","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第1單元　誕生的喜悅","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619247687212_9093884878663001670.jpg","1619247698478_5799961897734899883.jpg"],"displayTitle":"佛陀形影—院藏亞洲佛教藝術之美｜待辨識紀錄（scVmA）","tit 3278384642348747.jpg","1619244652537_1413060216185247585.jpg"]},{"id":"recFNpiYR2B1wYVTA","name":"明沈周畫山水","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第二檔）","period":"","number":"故畫001316N000000000","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recFPqjE9tY9HzaCN","name":"清\n玉人與熊","notes":"清\n玉人與熊\n利用天然黑白兩色之玉石，以長線條雕出白玉人渾圓壯碩的體型；以短線陰刻，黑玉熊毛茸茸的身軀。工匠以慧心巧思，雕出人與熊角力的瞬間。那一瞬間，不是緊張的肉搏，而是玉人與熊都笑了，手牽手的翩然起舞。此件玉雕，與其他小件古玩，貯於百什件中，顯示百什件所收多為精巧好玩之物。","cat":"故宮","details":["人氣國寶展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[{"id":"recTL4AlTXJe0JgVt","name":"清朝"}],"exhibitions":[],"artists":[],"attachments":["20210222115002087100.jpg","1619244501528_6313817141992933134.jpg","1619244526058_1070880787802093802.jpg","1619244538158_7057670813820185369.jpg","1619244549749_1445984861124292874.jpg"]},{"id":"recFSKVWw6CBc7ycs","name":"民國于右任草書辭鬥口農場詩","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第二檔）","period":"","number":"贈書000937N000000000","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recFVj9ssyiZNDY75","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619145702498_1180513038751637206.jpg","1619145734541_6823401094441408176.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（NDY75）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recFcY2jJpevEe93d","name":"","notes":"","cat":"奇美博物館","details":["自動樂器"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619162873468_6795646461685488745.jpg","1619162883294_8290355693509500975.jpg"],"displayTitle":"自動樂器｜待辨識紀錄（Ee93d）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recFdyClDUuyAzETV","name":"南宋 吉州窯 黑釉木葉紋茶盞","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—唐風宋韻","period":"","number":"故瓷013950","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recFnlshn4v4 ents":[]},{"id":"recGO4q1Rv7Wqliw9","name":"觀音菩薩","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第3單元　菩薩的慈悲","period":"明（1368-1644）西元16世紀","number":"贈銅000207","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619247334276_5180558300471525508.jpg","1619247348972_4738892769881974483.jpg"]},{"id":"recGXaZZih4We9NkC","name":"誕生佛","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第1單元　誕生的喜悅","period":"明（1368-1644） 西元16世紀","number":"贈銅000218","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619242499604_3966838114677091740.jpg","1619242510685_8502089914016597445.jpg","1619242520548_2166108244137662894.jpg"]},{"id":"recGZnflahHlJpU6i","name":"","notes":"","cat":"奇美博物館","details":["17至18世紀：宮廷與市井"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619169477862_5216287756042045115.jpg","1619169487209_5992792637464719848.jpg"],"displayTitle":"17至18世紀：宮廷與市井｜待辨識紀錄（JpU6i）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recGa8HnIg2aSWj2m","name":"大遷徙：盧明德","notes":"\n \n大遷徙：盧明德\n\n\n\n\n\n盧明德 | 媒體是一切\n複合媒材、霓虹燈,2001\n\n75x630cm\n\n臺北市立美術館典藏\n\n\n盧明德 | 打狗系列7\n複合媒材,2001\n\n123x245cm\n\n藝術家自藏\n\n\n盧明德 | 進化與啟示7\n複合媒材,1992\n\n140x270cm\n\n藝術家自藏\n\n\n盧明德 | 魔術師的遊戲\n複合媒材,1991\n\n118x102cm\n\n臺北市立美術館典藏\n\n\n\n\n\nPrevious\nNext\n \n\n「遷徙」是指動物或人類因為某種原因，而進行一種大規模、長距離改變居住地的遷移行為。此次回顧展引用大遷徙的概念，作為盧明德個人創作歷程、觀察藝術時代脈動及人與自然關係三個面向的展現。\n\n \n\n盧明德早期創作從「純綷繪畫性語言的追尋」開始，直到1981年前往日本筑波大學藝術研究所研習綜合造型，接觸到當代藝術表現的多樣化形式與跨媒材的可能性，發展出其「複合媒體藝術論」之創作理論架構。從1980年代至今，盧明德的創作一直緊扣著當代的社會議題與跨領域之間的合作交流，甚至是跨物種、跨時空的實驗，並以平面繪畫、錄影裝置、立體雕塑、空間裝置、現成物件、身體表演、劇場形式，甚至結合生態學家、地質學家、科學家等各種協同創作方式，交錯進行跨領域的對話。\n\n \n\n展覽邀請莊普、許遠達、蔣伯欣、鄭乃銘籌組成展覽顧問團隊，協助展呈及研究，回顧盧明德50餘年來的創作生涯。展覽以「大遷徙」故事性文本貫穿8個展間，試圖以劇場形式進行空間規劃，為歷年來之作品賦予新的脈絡，並透過展呈各式創作媒體的演化與遞嬗，賦予「媒體是一切」的自由向度與時代意涵。媒材運用上，首次嘗試「花間迷走球幕影像裝置」以及方舟概念的動物群大遷徙動線的劇場轉譯，隱喻人類世紀大遷徙的預言。\n\n \n\n \n\n \n\n時間\n2021/04/17 - 2021/07/18\n地點\n二樓2A~2B\n活動\n定時導覽│大遷徙：盧明德\n團體預約導覽│大遷徙：盧明德\n親子導覽｜大遷徙：盧明德","cat":"北美館","details":["大遷徙：盧明德"],"sub":"","period":"","number":"","url":"https://www.tfam.museum/Exhibition/Exhibition_page.aspx?ddlLang=zh-tw&id=685&allObj=%7B%22JJMethod%22%3A%22GetEx%22%2C%22Type%22%3A%221%22%7D","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["20210323182228667153.jpg","20210323182213604476.jpg","20210323182353542838.jpg","20210323182531309281.jpg","1620472140969_2596444831100683380.jpg"]},{"id":"recGbU41Aip2ys52U","name":"","notes":"","cat":"奇美博物館","details":["17至18世紀：宮廷與市井"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619169415551_5613021709365928206.jpg","1619169425855_4491383086677805519.jpg"],"displayTitle":"17至18世紀：宮廷與市井｜待辨識紀錄（ys52U）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recGcZCeVJWlUsC89","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619148750744_7688364183738373711.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（UsC89）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recGjSEhqo9EnCG1k","name":"宋薛紹彭 雜書","notes":"宋薛紹彭 雜書\n\n薛紹彭(十一世紀後半),長安\n\n人。字道祖,號翠微居士,爲河東(山 西)薛氏名門後裔。精於鑑賞,並擅長 書法。書學二王,深得晉人韻態,書史 謂其書如王謝家子弟,風神俊朗。宋高 宗(1107-1187)對其推崇有加,也間接 影響元代書法的復古風氣。\n\n本幅書詩文尺牘四段,行筆以拙藏 巧,平直蒼勁。行筆內斂,鋒藏不露, 具有素樸的古意。\n\n《雜書卷》，行草書，紙本，26.1x303.5cm。台北故宮博物院藏。\n\n\n薛紹彭\n\n薛紹彭，長安（今陝西西安）人。生卒年月不詳。北宋書法家。宋神宗時人。字道祖，號翠微居士。恭敬公薛向之子，以翰墨名世。自謂河東三鳳後人。官至秘閣修撰，出為梓桐槽。時以翰墨名世，善品評鑑賞。與米芾為友，每以鑑定相尚，得失評較。曾刻孫過庭《書譜》傳世，後人推為精本。米芾嘗言：「薛紹彭與余，以書畫情好相同，嘗見有問，余戲答以詩日，」世言米薛或薛米，猶如兄弟或弟兄。」工正、行、草書，筆致清潤遒麗，具晉、唐人法度，歷來書家對其評價甚高。與米芾齊名，人稱「米薛」。\n\n薛紹彭善行草，楷書也有較高造詣。同時善詩，其詩清麗沉著，有魏晉人風。 薛紹彭的行草書取法王羲之、王獻之，從\u003c蘭亭序>得益較多。楷書師法鍾繇。傳統功力深厚，含蓄雅正,法度森嚴，有較多的古法，但不泥古。也有人批評他的書法變化較少和缺乏風韻，與蘇軾、黃庭堅、米芾等崇尚變化的書法家相比，未免有些遜色。傳世的書法作品有《蘭亭臨寫本》、《雲頂山詩卷》、《昨日帖》、《晴和帖》、《二像帖》、《隨事吟帖》、 《大年帖》等。《大年帖》藏故宮博物院，為行書信札，用筆圓潤、含蓄、精到，結字嚴密、鋒藏不露，書風溫雅秀潤，是薛紹彭的代表作。摹刻有《蘭亭序》，帖後刻有他楷書題詩，書法風格接近鍾繇，在宋人楷書中是很有特色的。","cat":"故宮","details":["人氣國寶展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhib 馬以那第 ( 1460-1513) 年代不詳,油彩、木板\n\nSebastiano MAINARDI (Italian. 1460-1513) Undated, Oil on panel\n\n生下耶稣後的聖母立即以崇敬的姿態向 新生兒禮拜,她的身型相當巨大,不僅 強調她對此誕生神蹟的禮讚,更希望透 過她對耶穌的崇敬試圖喚起觀者以同樣 誠摯的心來敬仰上帝。跪立在聖母身旁 的小施洗者约翰則凸顯出耶穌救購者的 身份。","cat":"奇美博物館","details":["藝術廳","13至16 世紀:神性與人性"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619167184604_4476845477089935688.jpg","1619167194689_488261870505071782.jpg"]},{"id":"recH6ox7HhTiCUVHD","name":"宋\t張即之\t書李衎墓志銘\t卷","notes":"縱28.2厘米，橫601.2厘米。凡158行，每行8字，共1206字。張即之《李衎墓誌銘》，紙本，楷書。\n\n 此點書法既既非唐楷，又又噹噹朝朝先輩的意趣，而不是大膽的突破了傳統技法，以以情感歧視自由表現。。點劃間有清晰的交聯，並且很注意線條粗大，輕重，方圓的比例，即“重如崩雲，輕如蟬翼”之間的矛盾，造成了非常的誇張和異乎尋常的表現。","cat":"故宮","details":["筆墨見真章"],"sub":"","period":"","number":"","url":"https://kknews-cc.cdn.ampproject.org/v/s/kknews.cc/culture/b88e5o.amp?amp_gsa=1&amp_js_v=a6&usqp=mq331AQHKAFQArABIA%3D%3D#amp_tf=%E4%BE%86%E6%BA%90%EF%BC%9A%251%24s&aoh=16204548685003&csi=1&referrer=https%3A%2F%2Fwww.google.com&ampshare=https%3A%2F%2Fkknews.cc%2Fculture%2Fb88e5o.html","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1620456428400_7667460405403828629.jpg","1620454845248_3020161347092289887.jpg","4814245406.jpg","5933192729.jpg","6275713494.jpg","4723432484.jpg","4815136943.jpg","4723966366.jpg","5933644285.jpg","6598012079.jpg","5386970027.jpg","5387454044.jpg","4724917846.jpg","4815584106.jpg","4725337291.jpg","5934268633.jpg","4725803405.jpg","5713597726.jpg","6598662148.jpg","5934885343.jpg","5388322345.jpg","4816434186.jpg","6276650313.jpg","6599172397.jpg","7342758736.jpg","6277121195.jpg","6277615053.jpg","7343813681.jpg","5714423767.jpg","6601839762.jpg","1620456486364_1527956915924762526.jpg"]},{"id":"recHENub7DNNuC9SE","name":"日本 江戸時代 乾山款鐵繪蔓草紋茶碗","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"南購瓷000118","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recHFXjXIHWkMbQsW","name":"","notes":"","cat":"奇美博物館","details" an，1839-1937）是法國十九世紀晚期、二十世紀初期的風景畫、風俗畫與插畫家。目前我們對於亞當的生平所知並不多，但可以知道的是他曾進入巴黎美術學院接受正規、嚴謹的繪畫訓練，並經常參與當時的巴黎沙龍展，參展作品獲得多次獎項肯定。畫風精緻細膩、平穩嚴謹，可見其紮實的學院功底。\n\n\n〈暮秋習作〉畫了什麼？\n\n畫中描繪一位女子在秋天傍晚眺望遠方的情景。她靠在矮牆上，雙眼注視著遠方的景致，後方則有一隻的小狗陪著她。人與狗各看向一方，動作彼此對應，顯得相當可愛。沿牆排列的樹木枝葉稀疏與散落一地的土黃色枯葉，配合著略為昏黃的天空，處處傳遞著秋瑟之景，正如其名。","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619166334344_5173454555523626666.jpg","1619166344885_3364228698660892047.jpg"]},{"id":"recIhCxgcoVMhHACP","name":"白泥單柄壺","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"清末民初 工夫茶器一組","period":"","number":"研13(研究品) ","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recIjijIRRoSVLh6k","name":"青花魚藻詩文圖方水注","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"南購瓷000158","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recItXmlWGOj8B0I2","name":"藏文《龍藏經》","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第4單元　經藏的流轉","period":"清康熙8年（1669）內府泥金寫本","number":"故藏000001〜000024、 故藏000026〜000090、 故藏000092〜000110","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619246253008_7506729818137710483.jpg","1619246265833_3804634023573116902.jpg","1619246276382_8184837293789192441.jpg"]},{"id":"recJ09OG2bkOSaND5","name":"青花前赤壁圖方茶葉罐","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"南購瓷000154","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recJ1Aks4I6GJsKsz","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619146555614_5060207416556015762.jpg","1619146577918_5123622920191955614.jpg","1619146601376_1971976581774565302.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（JsKsz）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recJ23B4ZZsMzmHBt","name":"北極海船難\n\nShipwreck in the Arctic Ocean","notes":"北極海船難\n\nShipwreck in the Arctic Ocean\n\n法蘭斯瓦·奧古斯特·里亞赫 ( 1798-1882) 1842、油彩、畫布\n\nFrançois Auguste BIARD (French, 1798-1882 ) 1842 Off on canvas\n\n里亞赫曾在路易-菲立普國王的邀請 下,偕同科學探險隊前往北極地區考 察。畫中記錄著愛斯基摩人搭救過難船 員的景象,救援的愛斯基摩人與神情痛 苦的船員們形成對比 (紅衣男子據傳為車 家本人)。支離破碎的甲板、船桅與船 身,則深刻的表現出船難的駭人之處。","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619164911198_5006781461819143236.jpg","1619164932514_681944675967357614.jpg"]},{"id":"recJ3hlvp2VkKJ2aZ","name":"","notes":"","cat":"北美館","details":["塩田千春：顫動的靈魂"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1620470109344_3356495279516101205.jpg","1620470123523_5005126052401283560.jpg","1620470137699_2135357070569987704.jpg","PXL_20210508_103635277.jpg","PXL_20210508_103635277.jpg"],"displayTitle":"塩田千春：顫動的靈魂｜待辨識紀錄（KJ2aZ）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recJ8uhnBhOKFgAQY","name":"釋迦牟尼佛","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第2單元　佛陀的智慧","period":"斯里蘭卡 / 堪地王朝（1592-1815）西元18世紀","number":"贈銅000068","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recJFNKkyt2d27P03","name":"","notes":"","cat":"奇美博物館","details":["17至18世紀：宮廷與市井"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619169327629_8564119765398270283.jpg","1619169336445_6478156437112956904.jpg"],"displayTitle":"17至18世紀：宮廷與市井｜待辨識紀錄（27P03）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recJGXOj79JfrIrdw","name":"明 萬曆 青花高士圖六稜提梁茶壺","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—明人雅集","period":"","number":"故瓷017806","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recJJisc9sDj7DMuJ","name":"","notes":"","cat":"奇美博物館","details":["19世紀沙龍廳"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attac ub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619164753552_6149698876397228943.jpg","1619164741580_7490419141574813547.jpg"]},{"id":"recKT7bUVZ8b9Hwy2","name":"清 嘉慶 洋彩番蓮紋白地茶鍾","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—清代品茗","period":"","number":"故瓷014749","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recKU3a5B25XRqieR","name":"","notes":"","cat":"奇美博物館","details":["藝術修復"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619161551433_756192004412192460.jpg"],"displayTitle":"藝術修復｜待辨識紀錄（RqieR）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recKV6mEEgRtIDbo5","name":"漢 瓦當 墨拓本","notes":"漢 瓦當 墨拓本\n\n本幅依其邊輪形狀研判應非瓦當,而是 銅洗、銅鏡之類的器具。「牛馬煩。奴婢昌。 宜子孫。」九字應該鑄刻在內底或內底的背 面,意在祈求、祝福家畜、奴婢、子孫興 旺,屬於吉語類的銘文,得以想見當時奢華 風氣。書法篆隸互參,用筆清秀,間架勻稱 和諧,依器形由上往下略為縮小、變形,佈 局寬綽疏朗。\n\n葉公超先生捐贈。","cat":"故宮","details":["筆墨見真章"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1620455968170_8584843611490193034.jpg","1620455639670_7465086924732821884.jpg","1620455658614_1195919979879021778.jpg","1620456469619_1867337995603817905.jpg"]},{"id":"recKbOdGRcigCd8CC","name":"席德進（1923-1981），〈渡船〉","notes":"席德進（1923-1981），〈渡船〉，1980，\r\n水彩、紙，64.8×102 公分。\r\nShiy Der-Jinn (1923-1981), Ferry Boats, \r\n1980, watercolor on paper, 64.8 × 102 cm.","cat":"國美館","details":["海外存珍"],"sub":"乙、豐采──豐實、沈澱、光采","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["Screenshot_20210424234613.jpg"]},{"id":"recKhVxJHT7GG9jow","name":"","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第4單元　經藏的流轉","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619246290871_238341712399033251.jpg","1619246302570_847966917955288382.jpg","1619246313281_3918774807956928568.jpg"],"displayTitle":"佛陀形影—院藏亞洲佛教藝術之美｜待辨識紀錄（G9jow）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recKmoLQZ8vR5OugO","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619146702199_5249121522003770897.jpg","1619146726325_3590775487037192326.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（5OugO）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recKo6ZixUicOT5y5","name":"筆墨見真章","notes":"書法是漢文化圈特有的藝術，長久以來在中國文化傳統中蔚成體系，也自然應用在日常生活裡，了無古今的隔閡。有關中國書法從古到今發展的歷程，始終是大家關心的課題，本項展覽即由此出發，揭示其間發展的脈絡。\n\n　　秦漢時代是書法發展的關鍵時期，一方面三代以來古文大篆書寫、銘刻分歧的現象，歸於統一，產生標準書體小篆；另方面春秋戰國時代萌芽的新興書體隸書，也在此際從篆書簡省蛻化成熟，發展為漢代通行的書體。由於時代潮流趨向簡便快捷，隸書又持續蛻變分化，遂有草書、行書和楷書的形成。書體遞變原非朝夕立就，因此進入魏晉南北朝之後，過渡型書風以及各體參雜的混合書風時而可見，顯示書體蛻變遷延歲月，方能在結構和筆法上建立自己的規律。\n\n　　隋唐時代是另一個關鍵時期，政治統一帶來南北各地書風會流，筆法發展臻於完備，從此楷書成為歷代通行的書體。入宋以後，為保存前賢書法長遠流傳，刻帖日漸盛行。但是宋人並不以繼承傳統為足，書法取向表現個人情性、得其天趣。\n\n　　元代繼起，轉而提倡復古，晉唐書法傳統得以延續。然而，不受傳統束縛的意念也活躍起來，至明代浮現縱橫跳脫的氣息。明人書法面貌至為紛雜，行草書尤其活潑自由，適與當時依循傳統法度者形成對比。其間突顯個性自成一格的書家，也走出實現自己的路徑，不為時代潮流所吞沒。\n\n　　清代以降，三代秦漢古文篆隸陸續出土，堪稱是得天獨厚。在務實的學術風氣影響之下，清人摩挲碑版，從而與刻帖相互為用，書法發展的視野得以串聯古今，終能在篆書、隸書兩方面汲古創新，引領新方向。","cat":"故宮","details":["筆墨見真章"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["Screenshot_20210508135219.jpg"]},{"id":"recKrUG55SLVurZOI","name":"清 嘉慶 洋彩御製詩文海棠式綠地茶盤","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—清代品茗","period":"","number":"故瓷012502","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recKupwjnZJtbPL0v","name":"聖家庭 The Holy Family","notes":"聖家庭 The Holy Family\n\n尤斯·范·克雷夫和工作坊 (法蘭德斯,約1485-1540/1541) 約1525-1540,油彩、木板\n\nJoos van CLEVE and workshop ( Flemish, ca.1485-1540/1541) c ca. 1525-1540, Oil on panel\n\n范·克雷夫有「北方達文西」之稱。畫 中靜物、風景與嬰孩的光澤軟髮透露尼 德蘭精緻寫實的特色,而聖嬰腹部如成 年男子般起伏有致的肌理,與聖母子臉 部細膩柔和的光影,又反映著達文西浙 層渲染的手法。聖母手上的康乃馨、散 落在桌面的紅酒杯,與檸檬則象徵著耶 穌的受難。","cat":"奇美博物館","details":["藝術廳","13至16 世紀:神性與人性"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619167448789_3744462509392993930.jpg","1619167457598_7489613450737751388.jpg"]},{"id":"recL7Wzwlaj6Ih61u","name":"基督在靈薄獄中 Christ in Limbo","notes":"基督在靈薄獄中 Christ in Limbo\n\n傑洛尼米斯·波許的追隨者\n\n(尼德蘭,1450-516 ) 十六世紀前半葉\n\n油彩.木板\n\nFollower of Hieronymus BOSCH\n\n(Netherlander, 1450-1516) First half of the 16th century Oil on panel\n\n波許擅長運用大膽奇想的出風描寫對貪 婪人性的省思與諷刺,影響歐洲北方市 壇深遠。此作主題源自《尼哥底母福音 書》,描述耶穌受钉刑死後,曾到靈薄獄 解救舊約時代的義人們。畫中的耶穌穿 著紅袍並拿著象徵勝利的十字村旌旗, 前來帶領養人們離開地獄邊境。","cat":"奇美博物館","details":["藝術廳","13至16 世紀:神性與人性"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619167383456_1234813338279218269.jpg","1619167397292_2803119468073955470.jpg"]},{"id":"recL8TXu75b91zpWw","name":"明 萬曆 甜白八方茶鍾","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—明人雅集","period":"","number":"故瓷013188","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recLD8EW9ygedTS6v","name":"在三位一體教堂裡\n\nIn Trinity Church","notes":"在三位一體教堂裡\n\nIn Trinity Church\n\n亨利·傑維\n\n(法國,1852-1929)\n\n年代不詳,油彩、畫布\n\nHenri GERVEX\n\n(French, 1852-1929)\n\nUndated, Oil on canvas\n\n身穿典雅華服的貴婦,以及穿著西裝的 男士們皆聚集在教堂一處的欄杆前觀看 及聆聽,他們專注的神情和平靜的面容 顯露出當下平和且莊嚴的氣氛。畫中穿 著藍衣的女子是傑維的情婦,而畫面左 下方的白髮男士則被推測是設計這座教 堂的建築師。\n\n0001256","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619166700715_8564615027906945754.jpg","1619166708933_5351074415675861533.jpg"]},{"id":"recLP8U4Weq3P66sW","name":"清三可汗手蹟　冊　高宗乾隆行書七言絕句","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第一檔）","period":"","number":"贈書000372N000000004","url":"https://painting.npm.gov.tw/Painting_Page.aspx?PaintingId=24109","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recLeG30vxqL47qQc","name":"","notes":"","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1618992772945_3098534551956158536.jpg"],"displayTitle":"玉言故事展｜待辨識紀錄（47qQc）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recLrfmvepJCdWzri","name":"清三可汗手蹟　冊　世宗雍正行草七言絕句","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第一檔）","period":"","number":"贈書000372N000000003","url":"https://digitalarchive.npm.gov.tw/Painting/Content?pid=24108&Dept=P","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recLvQYabizHQLOp7","name":"明 德化窯 瑩白扁圓茶壺","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—明人雅集","period":"","number":"故瓷015656","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recM2xB8WxaisCDlP","name":"無量壽佛","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第2單元　佛陀的智慧","period":"北魏太和9年（485）","number":"贈銅000123","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619242699600_4915240394192987526.jpg","1619242710996_5082456011769159466.jpg"]},{"id":"recM6OIlNs882KsNG","name":"耶穌誕生\n\nThe Nativity","notes":"耶穌誕生\n\nThe Nativity\n\n多明尼克·第·桑諾比, (義大利,1467-1481年活躍於佛羅倫斯) 年代不詳,蛋彩、金箔和木板\n\n先前被稱為強森耶穌誕生畫畫師\n\nDomenico di ZANOBI, called Master of the Johnson Nativity\n\n(Italian, 1467-1481 active in Florence) Undated, Tempera and gilding on panel\n\n本作描寫聖母瑪利亞誕下耶穌後,隨即 雙手合十恭敬地跪在耶穌嬰孩前的情 景。藉由她的虔誠順服來強調她對此神 蹟的禮讚。左側的小施洗者約翰暗示著 耶穌救贖者的身份,而右側狀似沉思的 老人為約瑟,遠方則有著天使告知牧羊 人彌賽亞即將誕生的場景。\n\n0010004","cat":"奇美博物館","details":["藝術廳","13至16 世紀:神性與人性"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619167143680_4517484864913978550.jpg","1619167153140_4174701742176712440.jpg"]},{"id":"recM85sFMhEvDoaxa","name":"清 乾隆 瓷仿拉古里木多穆壺","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"蒙藏奶茶","period":"","number":"中瓷005262","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recMB8Ex5us17Lxd3","name":"明\n鬥彩　雞缸杯\n","notes":"明\n鬥彩　雞缸杯\n雞缸杯是明朝成化官窯（1465-87）的代表作之一。器表裝飾兩組公雞、母雞和三隻小雞闔家出遊的景象。它們或覓食，或相向嬉戲，充滿童趣的圖案以「鬥彩」技法勾勒、繪製。因「鬥」字含有組合的意思，因此才將同時裝飾釉下青花和釉上紅、綠、黃、紫各種顏色的紋樣稱為「鬥彩」。","cat":"故宮","details":["皇帝的多寶格"],"sub":"","period":"","number":"","url":"","wiki":"","years":[{"id":"recj9BkloPzQZSvTC","name":"明朝"}],"exhibitions":[],"artists":[],"attachments":["2020022114113483120.jpg"]},{"id":"recMKK7TWX7R1ThZE","name":"","notes":"","cat":"故宮","details":["青銅饗宴：古代的禮儀與樂曲"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619250125922_4261694608749393402.jpg"],"displayTitle":"青銅饗宴：古代的禮儀與樂曲｜待辨識紀錄（1ThZE）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recMOYQnyvt21vsPG","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619145981204_1334394910980594833.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（1vsPG）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recMRJwfY7c5rww3H","name":"豐收\n\nThe Hay Harvest","notes":"豐收\n\nThe Hay Harvest\n\n\n朱利安·杜培\n\n(法國,1851-1910) 1881、油彩、畫布\n\nJulien DUPRE\n\n(French 1851-1910) 1881, Oil on canvas\n\n杜培喜愛取材農民採收乾草的情景,而 這帽【豐收】曾於1881年入圍沙龍展並獲 得評論家的讚賞。畫中農民正急忙將乾 草放到滿載的貨車上,而遠方黑雲遍布 的天空暗示著黑夜或豪雨的到來。杜培 嫻熟精湛的畫功,將收割時的忙亂場 录,安排地井然有序,人物的姿態亦相 當生動。\n\n000121","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619166502604_998305751560023161.jpg","1619166513565_5898823010348327678.jpg","1619170213947_2068531693231295742.jpg","1619170226404_1316485935608531927.jpg","1619170299304_4114818572728884880.jpg","1619170309441_7771470892554310986.jpg"]},{"id":"recMYtfBdox749YvW","name":"日本 江戶時代 竹茶杓 千宗旦作","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"南購雕000014","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recMbrTBeFdoz2tbV","name":"","notes":"","cat":"奇美博物館","details":["藝術修復"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619164454561_4867569415495102466.jpg","1619164463213_3895111961134504298.jpg"],"displayTitle":"藝術修復｜待辨識紀錄（z2tbV）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recMc2BakfyZWz9Nu","name":"明\n宣德 寶石紅釉僧帽壺","notes":"明\n宣德 寶石紅釉僧帽壺\n這件紅釉僧帽壺的器底刻有乾隆皇帝〈題霽紅僧帽壺〉詩。詩末署「乾隆乙未仲春月御題」紀年銘（乾隆四十年，1775）。傳世隨附木座，底面上刻有與器底相同詩文，木座外圍上下左右\n另刻「雍邸清玩」四字銘。說明本件作品自雍正皇帝為雍親王時即已進入王府收藏，對照〈深柳讀書堂美人圖〉之「鑑古」一軸，或可印證此段流傳過程。","cat":"故宮","details":["皇帝的多寶格"],"sub":"","period":"","number":"","url":"","wiki":"","years":[{"id":"recj9BkloPzQZSvTC","name":"明朝"}],"exhibitions":[],"artists":[],"attachments":["20200221141532034106.jpg"]},{"id":"recMho1ucHvTVVryn","name":"明陳繼儒自書詩帖","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第二檔）","period":"","number":"故書000033N000000000","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recMkviAZTiI7IxCg","name":"填琺瑯八吉祥","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第2單元　佛陀的智慧","period":"原存熱河(今歸河北省)避暑山莊 / 清（1644-1911）西元18世紀","number":"中銅002159〜 002162、中銅002209 〜002212","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recMrSPP2pKKDZ5bY","name":"南宋 建窯 醬釉兔毫紋茶盞","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—唐風宋韻","period":"","number":"南贈瓷000001","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recMzm3Gxt6JA3MJb","name":"","notes":"","cat":"奇美博物館","details":["藝術修復"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619161613424_4270721336841978620.jpg","1619161633321_729005049608848918.jpg"],"displayTitle":"藝術修復這件事","titleBasis":"依展場照片標示或內容整理"},{"id":"recN1x8VwQEUAWiki","name":"舞者\n\nTwo Dancers","notes":"舞者\n\nTwo Dancers\n\n查理·赫爾曼斯\n\n(比利時,1839-1924) 年代不詳、油彩、木板\n\nCharles HERMANS (Belgian. 1819.1924) Undated, oil on panel\n\n這兩位身穿綠色緊身舞衣的女子,是赫 爾曼斯【化裝舞會】景中身穿红色紧身 狮我的一對少女,雙手插腰的女子望著 遠處,而輕靠在她們頸後方的姊妹也好 奇地探頭威望。赫爾曼斯德進兩位女子 的神情和姿態,忠實地呈現旁觀者進一 探究竟的心组和模樣。","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619166777688_1985924750603804441.jpg","1619166786902_1874575932704581191.jpg"]},{"id":"recNPOh5JxEboiNT1","name":"","notes":"","cat":"奇美博物館","details":["羅丹"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619160062878_4536228507536977011.jpg","1619160082372_1679949335676386533.jpg"],"displayTitle":"羅丹｜待辨識紀錄（oiNT1）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recNPmfjYZr1LBkCA","name":"聖馬丁的仁慈 The Charity of Saint Martin","notes":"聖馬丁的仁慈 The Charity of Saint Martin\n\n\n作者不詳(法國)\n\n十六世紀\n\n聖馬丁割袍贈與乞丐的故事,顧露聖馬丁仁慈 的美德。此作描繪當時身為軍人的聖馬丁將斗 這篇在倚著拐杖的乞丐身上,並拿劍欲割斗蓬 的時刻。雕刻家刻劃出聖馬丁裝飾豐富的衣装 和馬具,但人物和馬匹的肢體生動中又带有古 拙之感,相當可愛逗趣","cat":"奇美博物館","details":["藝術廳","13至16 世紀:神性與人性"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619167361889_1103947721249956573.jpg","1619167369723_6667298769885285121.jpg"]},{"id":"recNSgqt0trUgsKEG","name":"唐風宋韻 中國茶文化","notes":"中國飲茶文化淵遠流長，西元七世紀飲茶習慣已遍及全國。唐人烹茶，先將茶葉輾成粉末，投入茶鍑中煎煮，再分酌於茶碗飲用。茶碗以越窯青瓷及邢窯白瓷最為普遍，通稱「冰瓷雪碗」。\n宋人改將茶末置於茶盞，以茶瓶注湯點啜，故稱「點茶」。宋人也愛鬥茶，將茶湯打出茶沫湯花，為利觀察多用黑釉茶盞，一般則用青、白釉色茶碗。","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—唐風宋韻","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}],"artists":[],"attachments":[]},{"id":"recNXB0yZEGFG87XU","name":"漢式亭閣佛龕 內供銀製綠度母","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第5單元　密教的神奇","period":"原存熱河(今歸河北省) 佛龕：清(1644-1911) 西元18世紀； 度母：西藏西部 / 西元14世紀","number":"中雜000110","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619247364019_3015237136858466701.jpg","1619247374620_3930525242369830429.jpg"]},{"id":"recNa3MwGAbar8GbS","name":"清拓劉君殘碑墨拓本翁方綱安陽訪碑行書　軸 ","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第一檔）","period":"","number":"購書001103N000000000","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recNb4iXPw  培農民們在客棧休息的情景,人物多為 畫家帽府,其中身穿白衫衙神的男子, 被認為是畫家所創造的農民英雄角色。 他提著鐵鞦並昂首挺坐在椅子上的安 想,樸資有力的體態流露花崗的氣勢, 办西垣英雄氣質,更反映著畫家對赞民 的推崇。","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619166309912_7379472389770499412.jpg","1619166323499_102036973450662363.jpg"]},{"id":"recPxSDiYu6BX5jaz","name":"","notes":"","cat":"故宮","details":["青銅饗宴：古代的禮儀與樂曲"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619250357806_4113109684808907416.jpg","1619250367417_917193346422250275.jpg"],"displayTitle":"青銅饗宴：古代的禮儀與樂曲｜待辨識紀錄（X5jaz）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recPy7uKurob82EzN","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619147304552_5549969995590308892.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（82EzN）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recPzGJDsiYkKpncD","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619146286520_1993152823076256607.jpg","1619146302044_2473048302513298699.jpg","1619146340637_3818004832924915474.jpg","1619146368605_2530708095416935361.jpg","1619146416203_2753356524989038723.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（KpncD）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recQ1MMhiMKdyGu7Q","name":"05荷蘭東印度公司時期","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619149080597_2353893500006667523.jpg","1619149090860_840289971125365924.jpg"]},{"id":"recQ1uddD88JUkbWA","name":"七連佛像組","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第2單元　佛陀的智慧","period":"唐（618-907） 西元8世紀","number":"贈銅000172 贈銅000173","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619243070057_6467557931640490538.jpg \n說明文：\n　　沈源，乾隆時（西元一七三六－一七九五年）供奉內廷，善畫佛像，並工山水界畫。 　沈源「清明上河圖」的構圖，與清院本「清明上河圖」幾乎相同，但以水墨為主，在用色方面，更只用赭色稍加鉤染，自有一番清新雅淡的韻味。用筆熟練，界畫橋樑、屋宇、人物皆極為精細工整，亦清畫院中之佳作。","cat":"故宮","details":["畫琳瑯—貨郎圖特展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1620460380371_9162834340681544975.jpg","1620460395601_6198135504214350904.jpg","img4_1.jpg","img4_2.jpg","img4_3.jpg","img4_4.jpg","img4_5.jpg","img4_6.jpg","img4_7.jpg","img4_8.jpg","img4_9.jpg","img4_10.jpg","img4_11.jpg","img4_12.jpg","img4_13.jpg","img4_14.jpg","img4_15.jpg","img4_16.jpg","img4_17.jpg","img4_18.jpg","img4_19.jpg","img4_20.jpg","img4_21.jpg","img4_22.jpg","img4_23.jpg","img4_24.jpg"]},{"id":"recRO8GjnOaEwduYe","name":"中美洲文化","notes":"中美洲文化\n\nCentral American cultures\n\n鄰近瓜地馬拉蒙太格(Motagua)河一帶是中美洲輝玉產地,也曾有喜愛使 用玉器的文化,包含有奥梅克(Olmec)文化(約距今3200-2300年前)、馬雅 (Maya)文化(約距今3100-800年前)、哥斯大黎加古文化(約距今2500-1300 年前),其中以馬雅最為著名。對馬雅人來說,玉象徵著生命與不朽,墓 葬中都有玉製的陪葬品。最著名是在1952年發現的帕卡爾二世玉製面具 ,其全身裝飾品皆以玉打造,包含耳飾、冠冕、項飾、胸飾、手鐲和戒 指等。此外,馬雅人崇尚太陽神,以玉製作太陽神雕像和面具,並作出 美洲豹獨有的T字形牙齒,象徵不朽。","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1618993424179_4032766097686063887.jpg"]},{"id":"recROMn1VfXqOsFDE","name":"","notes":"","cat":"奇美博物館","details":["羅丹"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619169792468_8013638349987971843.jpg"],"displayTitle":"羅丹｜待辨識紀錄（OsFDE）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recRYN0KRhebpexIk","name":"代表性遺址 卑南遺址","notes":"代表性遺址\n\nRepresentative archaeological sites\n\n卑南遺址\n\nPeinan site\n\n卑南文化的遗址中出土大量玉器,以卑南遺址最具代表。卑南遺址位於臺 東市南王里,西南依卑南山與中央山脈,又臨卑南大溪與太平溪,與臺東 沖積平原相接。最早是日人鳥居龍藏,記錄卑南遺址上的石柱,爾後則是 鹿野忠雄發表「卑南遺跡」的研究,也奠下卑南的名稱。1945年日本人首 次進行發掘,1950與1953年陸續有考古學者調查,直到1980年因東線鐵路 施工而進行大規模搶救發掘工作。該遺址在臺灣考古有其重要性,玉器特 色是其一。該遺址玉器數量為全臺之冠,品項類型與製作技術令人讚嘆, 推測應是臺灣史前玉器重鎮,也是東亞地區玉器中心之一。","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":""
