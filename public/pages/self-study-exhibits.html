宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"南購銅000033-37","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recSe2DOPyC4nKL1f","name":"","notes":"","cat":"奇美博物館","details":["藝術修復"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619161684136_4058240374633610474.jpg","1619161699067_3139566026122979457.jpg"],"displayTitle":"藝術修復｜待辨識紀錄（nKL1f）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recShpA3EQ6lJzOTH","name":"","notes":"","cat":"故宮","details":["青銅饗宴：古代的禮儀與樂曲"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619250671513_2565512331850408677.jpg","1619250717661_6445935147699654960.jpg","1619250730061_8609647255861485632.jpg","1619250744226_3708664131122901708.jpg"],"displayTitle":"青銅饗宴：古代的禮儀與樂曲｜待辨識紀錄（JzOTH）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recSt7AEZ8db8sgcw","name":"林間浴女\n\nBathers at a Woodland Pool","notes":"林間浴女\n\nBathers at a Woodland Pool\n\n那爾西斯·威吉勒·迪亞茲·德·拉·塔納 ( 1807-1876) 年代不詳,油彩、畫布\n\nNarcisse Virgile DIAZ de LA PEÑA\n\n(French 18071876)\n\nUndated, Oil on canvas\n\n「浴女」是法國巴比松畫派成員培納較為 著名的主題類型。此作運用墨綠色系營 造林木的蒼鬱感,並在橘、黃及棕色系 的點綴下,展現林葉的層次感,以及流 動其中的光影變化,營造出一片富含蛋 味的自然林景。林間浴女們各個姿態悠 間,並有可愛小狗相伴,宛如一幅田園 鼓式風景畫。","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619166286794_3654653792529835992.jpg","1619166298559_1112846083388195615.jpg"]},{"id":"recStaeFeiNqCSsgA","name":"明 嘉靖 甜白八方茶鍾","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—明人雅集","period":"","number":"故瓷005042","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recSx2bJhAd3GB22z","name":"海外存珍-順天美術館藏品歸鄉展","notes":"展名：海外存珍-順天美術館藏品歸鄉展\n策展人：蕭瓊瑞教授\n展期：110年 3月20日 至 6月27日\n地點：國立臺灣美術館102-107展覽室及美術街\n展件：預計共232件（另包含相關文獻與檔案）\n\n==================================================================================\n\n這是一個收藏家族美好的故事。藥學博士許鴻源先生，以一生的歲月，秉持「藥物醫人身，文化冶人心」的信念，在那個臺灣還沒有官辦近代美術館的艱難時刻，以企業家一己之力，支持藝術家的創作，為臺灣留下大批藝術作品。在他去世後，夫人賡續其志，成立「順天美術館」，展出、推廣這些藝術家的作品。最後，家族遵其遺願，在臺灣可能變得更好的時刻，將這批原本就屬於這塊土地的作品，全部六百餘件，如數捐回臺灣，讓她成為建構臺灣美術史不可或缺的一個區塊。\n\n許氏家族的用心，正逢臺灣文化部鄭麗君前部長提出「重建臺灣藝術史」政策宣示的時刻，在官民同心的努力下，克服困難，李永得部長踵繼支持，成就了這段前後長達半個世紀的文化傳承使命。\n\n本展正是站在收藏家、也是捐贈者的立場，呈顯這位心胸寬大、志氣清遠的藝術愛好者，一生關照的視野，及付出的熱忱。全展195位藝術家，出生的年代從最早的1871年到最年輕的1989年，前後橫跨一世紀，這也正是收藏家畢生接觸、收藏、支持的藝術家名單。\n\n本展依藝術家生年順序排序，劃分四個時代，也是四個子題，分別為：\n\n甲、蓊鬱──百歲前輩典範：\n\n從石川欽一郎（1871-1945）到1920年以前出生者，合計49位藝術家。這是一批年歲都在百年以上的前輩藝術家，他們分屬兩大系統；一是活耀於臺灣的日治時期，一是出身於中國大陸、卻在1949年的政治變局中，來到臺灣。成為共同建構臺灣歷史文化的兩股重要力量，也都是收藏家一體關照、同樣支持的對象。\n\n乙、豐采──豐實、沈澱、光采：\n\n從1921年出生到1935年以前出生者，合計43位藝術家。這是屬於時代激烈變動的一個階段，這個階段出生者，都面臨了1920年代世界性民族自決的思想劇變，卻也是文化、藝術相當活絡多元的時代挑戰；而1945年至1949年的政治變局，也是這個世代的藝術家，正逢青春年少的生命階段。\n\n丙、斐然──跨越時代的一代：\n\n從1936年出生到1944年之前出生者，合計43位藝術家，都是屬於戰前出生的藝術家。他們出生於戰火連天的時代，在世局交替的矛盾中成長。他們當中的許多人，甚至是屬於「失學」的一代；但是憑著各自的努力，他們在困頓的時代中，走出了屬於自己的生命成果。\n\n丁、初炳──當代新風貌：\n\n從1945年以後出生到1989年出生者，包含幾位生平未詳者，合計60位藝術家。基本上，這已經全屬戰後出生成長的世代，從危機挑戰到安定茁壯，從困頓艱難到經濟起飛，這個世代的藝術家見證了戰後臺灣社會，政經發展的軌跡，卻也在自由、民主的追求主張中，建構了屬於當代文明的驕傲。他們之中，有人堅守本土、有人出國留學，但臺灣和他們的生命劃上了等號；族群、性別，乃至媒材、形式，都不再是制約他們創作的桎梏，反而成為理解、交流的重要管道。\n\n除了以順天美術館捐藏的作品所構成的四大主題外，國立臺灣美術館更將文化部自2017年以來推動的「重建臺灣藝術史」成果，一併統整呈現，見證臺灣文化主體建構的階段性努力。\n\n \n\n參展藝術家名單:\n\n第一子題\n\n石川欽一郎、倪蔣懷、陳澄波、余承堯、呂鐵州、吳李玉哥、郭柏川、廖繼春、李梅樹、藍蔭鼎、顏水龍、楊啟東、林玉山、陳慧坤、李澤藩、陳進、沈耀初、楊三郎、郭雪湖、李石樵、葉火城、張萬傳、蔡蔭堂、劉啟祥、葉醉白、張啟華、陳德旺、許玉燕、吳棟材、陳敬輝、蘇秋東、袁樞真、劉其偉、洪瑞麟、陳永森、陳清汾、陳庭詩、張義雄、呂基正、鄭世璠、江寶珠、林之助、鐘泗濱、許深州、蔡草如、羅美棧、許武勇、洪通、廖德政\n\n第二子題\n\n陳其寬、吳承硯、蔣瑞坑、林顯模、王藍、金潤作、蕭如松、陳慶熇、席德進、徐藍松、張炳南、沈國仁、李洸洋、江兆申、楊乾鐘、賴傳鑑、沈哲哉、林天瑞、郭東榮、江漢東、曾培堯、張炳堂、何肇衢、吳昊、何文杞、陳銀輝、鄭善禧、秦松、馮騰慶、林壽宇、林顯宗、高山嵐、陳景容、羅清雲、曾茂煌、王守英、梁丹丰、董日福、歐豪年、陳誠、陳瑞福、陳正雄、潘景友\n\n第三子題\n\n張義、陳錦芳、廖修平、林智信、蘇嘉男、陳國展、杜若洲、戚維義、藍清輝、林榮德、王再添、張秋台、謝里法、朱銘、劉耿一、潘朝森、陳輝東、侯壽峰、黃照芳、楊興生、石嵩、林惺嶽、謝孝德、陳英德、李茂宗、李義弘、姚慶章、黃志超、陳昭宏、陳重文、江明賢、冉茂芹、王雙寬、賴武雄、吳炫三、江韶瑩、陳文石、林文強、顧重光、席慕蓉、陳政宏、藍榮賢、王美幸\n\n第四子題\n\n李欽賢、李淑櫻、陳陽春、戴壁吟、許坤成、蔡蕙香、施並錫、林人信、黃銘哲、陳主明、林順雄、吳永欽、袁金塔、曹志漪、江隆芳、許郭璜、蔡永明、陳幸婉、李隆吉、劉白、曾孝德、李健儀、吳祚昌、詹金水、陳東元、翁清土、鄭在東、賴純純、黃楫、馮盛光、梅丁衍、粘素真、陳飛龍、謝明錩、楊永福、于彭、顏貽成、許自貴、薛保瑕、楊恩生、詹楊彬、葉子奇、程代勒、張振宇、白丰中、簡正雄、王微微、陳香吟、李仁豪、鄭榮得、李柏毅、蔣中山、韓道希、載琴琴、柯翠娟、任竹章、孫萍花、瞿立齊、趙修","cat":"國美館","details":["海外存珍"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["Screenshot_20210424215004.jpg","Screenshot_20210424215014.jpg","10017_00.pdf"]},{"id":"recT2HhEywgkb6mvj","name":"","notes":"","cat":"奇美博物館","details":["19世紀沙龍廳"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619165518977_614279801527131488.jpg","1619165531656_6939182000160672356.jpg"],"displayTitle":"19世紀沙龍廳｜待辨識紀錄（b6mvj）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recT4db8kYFDgnSGo","name":"供養曼荼羅","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第5單元　密教的神奇","period":"原存紫禁城慈寧宮 / 清（1644-1911） 西元18世紀","number":"故雜000577","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recT5EfuMFPAfsuBV","name":"立佛","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第2單元　佛陀的智慧","period":"北魏（386-534） 西元6世紀上半葉","number":"贈銅000133","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619242722611_3169810919988973784.jpg","1619242734886_8545965660904376545.jpg","1619242760563_3022720073953499.jpg"]},{"id":"recT6XrVrvsWbK6va","name":"清\t黃易\t隸書五言聯\t軸","notes":"","cat":"故宮","details":["筆墨見真章"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1620454798795_8372397990275099494.jpg","1620454809334_928910927879414962.jpg","1620456520032_8474792720683511241.jpg"]},{"id":"recT8H2ghkfMQ7fd2","name":"聖母子 Madonna and Child","notes":"聖母子 Madonna and Child\n\n班納多·達第和工作坊\n\n(義大利,1320-1348活躍於佛羅倫斯) 年代不詳,蛋彩、金箔和木板\n\nBernardo DADDI and workshop (Italian, 1320-1348 active in Florence) Undated, Tempera and gilding on panel\n\n小耶穌伸手抓著母親的衣領,並望著母 親的臉龐,而聖母則輕撫耶穌的小手, 展現母子間的親密情感。耶穌的右手抓 著一隻金翅雀,象徵著他日後的受難, 而畫框上方的圖像則是鵜鶘啄開自己的 胸口,以自身的血哺育其後代,同樣象 微耶穌為拯救世人而被釘於十字架。","cat":"奇美博物館","details":["藝術廳","13至16 世紀:神性與人性"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619167102942_418522484021515667.jpg","1619167073781_2307059501049000568.jpg"]},{"id":"recTA9BarAEn5dLts","name":"明 萬曆 青花白地玲壠銀裡茶鍾","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—明人雅集","period":"","number":"故瓷009170","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recTFAuGeRQJ2wxgW","name":"林之助 (1917-2008)，〈彩塘〉","notes":"林之助 (1917-2008)，〈彩塘〉，1948，\r\n膠彩、紙，117.9×79.3 公分。\r\nLin Chih-Chu (1917-2008), Colorful Pond, 1948, \r\ngouache on paper, 117.9 × 79.3 cm.","cat":"國美館","details":["海外存珍"],"sub":"甲、蓊鬱─百歲前輩典範","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recTHGw94OtKb9mMt","name":"祕密馬頭觀音","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第5單元　密教的神奇","period":"西藏 / 清（1644-1911） 西元18世紀","number":"贈銅000117","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recTOxVSsw9ZV5kxX","name":"青銅饗宴：古代的禮儀與樂曲","notes":"青銅饗宴：古代的禮儀與樂曲\n展覽概述\n人類早期文化發展一般可劃分為石器時代、青銅時代與鐵器時代。在歷經漫長的石器時代以後，逐漸掌握採掘、冶煉金屬礦的技術，更發展出銅與錫、鉛等金屬的青銅合金，用來製作生活所需的工具、武器、器皿及裝飾品等。青銅，具有熔點低、硬度高及性質穩定等特點。在經過了數千年的地下埋藏後，原本金黃的色澤被綠色的銅鏽覆蓋，變成了青綠色，因此被後人稱之為青銅。青銅材質的廣泛運用，促成了經濟生產的躍進，也改變了社會生活的樣貌，被視為人類早期文化發展的重要里程碑。\n\n本展覽聚焦於距今約三千年前的華夏文明青銅禮器，介紹當時的重要器類與豐富裝飾。此次精選展出本院典藏之青銅文物，同時運用創新的影音多媒體科技，打造大型沉浸式劇場，並特別設置複製文物觸摸體驗區，邀請觀眾在多元的感官體驗中，一窺古代人們的物質生活與精神世界。\n\n\n華夏文明的青銅時代\n華夏文明的青銅時代開始於距今約四千年前，經過歷史文獻中所記載的夏代、商代、周代，延續一千六百年左右。青銅器剛鑄造完成時，外觀上呈現閃亮耀眼的金黃色，因此人們又稱其為「金」或「吉金」。當時的王室貴族不僅利用將珍貴的青銅合金鑄造為生產工具、軍事武器，還有數量龐大且製作精美的禮儀用器，主要使用於祭祀、宴饗與儀式等重要場合，藉此溝通祖先與神靈，並彰顯使用者的身分與階級，充分反映出宗教信仰與禮儀制度在當時的重要地位。\n \n\n豐富多元的裝飾紋樣\n華麗的裝飾是華夏文明青銅禮器的重要特色，豐富的紋樣不僅具有美化器身的功能，同時也扮演人類與超自然世界之間感通的媒介。青銅器紋飾多半源於古人們對於大自然的觀察與轉化，大致可分為動物紋、植物紋、幾何紋，另外還有透過想像創造出來的圖案，例如神秘的獸面紋、祥瑞的鳳鳥紋、尊崇的龍紋等等。\n\n \n青銅器的器類與功能\n在遙遠的青銅時代，日常生活中最重要的事情就是祭祀，當時鑄造的青銅器大多為此用途。為表示虔誠和遵守禮節，人們在禮儀中致力追求潔淨，使得盥洗與相關水器成為儀式的重要部分，而帶有圈足的「盤」即是主要的盥洗用具，做為澆水洗手的承水盤，也可注水於盤中當鏡子使用。\n\n美酒佳餚既可用於供奉祖先神靈，也是生者的飲食，酒和食物各有專用的青銅器具。商代人以嗜酒聞名，酒器種類繁多，例如「爵」的三足之間可受熱，用以溫熱酒，圓弧狀口部可傾倒液體；存放大容量酒的「尊」，特徵是喇叭形大口，多數體型龐大，裝飾華美。周代時，食器成為青銅禮器中的主角，並以「鼎」和「簋」為核心。三足而立的鼎，是主要的炊具，底部可受熱，用來烹煮牛、羊等肉食。簋，是盛裝食物的容器，多與鼎搭配使用。\n\n在儀式場合裡，除了水器、酒器、食器之外，還有青銅樂器，例如懸掛使用的「鐘」，多由數件組合成套，敲擊後發出鏗鏘悠遠的聲音，使得氣氛和諧而隆重。透過各式各樣的青銅禮器，可以窺見古代人們對於祭祀的慎重和珍視。\n \n\n大雅韶音‧宗周寶鐘 \n〈宗周鐘〉是國立故宮博物院典藏中極為重要的國寶文物，目前展示於北部院區的銅器陳列室。此鐘為西周晚期厲王（約西元前9世紀）所下令製作的祭祖樂器，鐘體裝飾有三十六枚高突的長形乳丁「枚」，以及迴旋盤繞的龍紋，並鑄有長篇紀錄文字，是存世少見的天子自作器，具有高度的歷史與藝術價值。\n \n〈宗周鐘〉的銘文共一百二十三字（含重文九字、合文三字），內容說明了製作此鐘的緣由：西周厲王時期，南方外族入侵周國領土，周王親自率兵征伐，使得南方及東方的二十六個小國皆稱臣降服。周王為了感謝祖先與神靈的庇祐，並頌揚自身的豐功偉業，故下令鑄造此件宗周寶鐘，希望為後世子孫祈福，永保國泰民安。\n \n故宮從院藏國寶文物〈宗周鐘〉汲取靈感，創作〈大雅韶音〉沉浸式劇場，運用包覆式投影特有的情境效果，使觀眾沉浸在想像與寫實並存的故事情境中。本影片以交響詩的韻律，結合現代科學理論來演繹周代人的宇宙觀，以及與先祖感通交流的儀式，同時突顯青銅器在西周禮樂制度中的重要角色。\n","cat":"故宮","details":["青銅饗宴：古代的禮儀與樂曲"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["Screenshot_20210424103648.jpg"]},{"id":"recTPLAxtTEb2LCf9","name":"坐佛三尊像","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第2單元　佛陀的智慧","period":"巴基斯坦斯瓦特地區 / 西元9世紀","number":"贈銅000056","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619243199113_7357582732929875476.jpg","1619243213934_7637683651256650058.jpg"]},{"id":"recTRUofEDlWNMS4K","name":"","notes":"","cat":"北美館","details":["大遷徙：盧明德"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1620472102043_3636321400711045797.jpg","1620472156153_7824248732549804738.jpg"],"displayTitle":"大遷徙：盧明德｜待辨識紀錄（NMS4K）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recTVRGlset6BJcF5","name":"擇地建城","notes":"擇地建城\n\n\n十五、十六世紀歐洲進入大航海時代,東、西交通的 貿易網絡形成。福爾摩沙因位於東亞貿易航線的要衝,\n\n\n成為海權勢力的角逐地。 熱蘭遮城是荷蘭人在1624~34年間建造完成。初名奧 倫治(Oranje)城,1627年易名為熱蘭遮(Zeelandia)城 ,為荷蘭貿易及控制福爾摩沙的中心。\n\n荷人選擇臺江內海的沙洲上建熱蘭遮城為東亞貿易 的根據地及轉運中心,史學家有下列三點推想理由: 1.位置優勢:位處於全島最西點,亦是出入福爾摩沙 海峽的良好位置,可輕易阻斷葡萄牙人、西班牙人 前往中國或日本的航路。 2.防衛優勢:此地為易守難攻之處;對外掌握內海之\n\n咽喉,亦可輕易離開本島。 3.人口優勢:當時居住臺江內海有眾多漢人及平埔族 人,對荷人建立商業據點及農業殖民地,提供充足 的人力支援。","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619145507242_5538795505251799621.jpg","1619145521819_1973186875756485507.jpg"]},{"id":"recTeDamh8OmuysEA","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619146894910_2872701887363588807.jpg","1619146924867_3781690665782039096.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（uysEA）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recTkvFenrcVHT69c","name":"","notes":"","cat":"奇美博物館","details":["羅丹"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619160106586_6073391263205586350.jpg","1619160122464_1269035943536214968.jpg"],"displayTitle":"羅丹｜待辨識紀錄（HT69c）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recTnQVe5eZIT9sFH","name":"","notes":"","cat":"奇美博物館","details":["19世紀沙龍廳"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619166171639_6435834370635394188.jpg","1619166158811_515450282915511509.jpg"],"displayTitle":"19世紀沙龍廳｜待辨識紀錄（T9sFH）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recToBYT7i1e0qBdT","name":"二十四臂觀音","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第5單元　密教的神奇","period":"明（1368-1644） 西元16-17世紀","number":"贈銅000213","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recTqN1wjXlEFHs0M","name":"13至20世紀西洋藝術","notes":"13至20世紀西洋藝術 The Western Arts from 13th - 20th Century\n\n藝術不僅是藝術家的個人表現,也反映著委託者的期待,同時又龜含 了時代脈動,人文思想、傾伯體系。宗教信仰、政治變動以及當下時 代的品味與美莓,甜個時代的藝術皆承難過往的傳統,攜索著當代的 表現方式,並預示下個時代的來臨;了解藝術作品便成為人們認識道 去,體驗現在以及编望未來的最佳途徑。本展以史為經,以地域為 案,將西方藝術從13至20世紀的藝術作品分成四個時期循序展出。\n\nArt is not merely personal expressions of the artists, but also reflects the expectations of their patrons, while encompassing trends, humanism, value systems, beliefs, a socio-political context and contemporary tastes and aesthetics. In every period, art inherits earlier conventions but presents a unique expression of its time while presaging the arrival of the next. Thus, understanding works of art has become one of the best ways for people to learn about the past, to experience the present and to envision the future. This exhibition attempts to present western art sequentially in its progress of four periods from the 13th to 20th century.\n\n13至16 世紀:神性與人性\n\n13 th 16 th Century :\n\nDivinity and Humanity\n\n西元四世紀末驱馬帝國改革基因教後,開啟藝術與宗教長達一千多年如影 雜形的密切關係。這時期無論是裝飾教堂的繪畫或理塑,都是為了彰顯上 帝的尊蛙:主牌多以教誨,告膩,聖人和聖經裏的故事為主。而藝術表現 方式則充滿了象徵性與裝飾性。自中古盛期開始,人們對自身價值、現世 生活與客机世界的醬注日益濃厚,並在文藝復興風潮與古典希臘菜馬藝術 的影響下,逐步發展出再現自然、寫實和莖合理地性的藝術之美。\n\nThe conversion to Christianity of the Roman Empire at the end of the 4th century initiated 1000-year-long relationship of art inextricably intertwined with faith. In this era, church decorations of either paintings or sculptures all served to glorify the Lord. The themes mainly involved religious doctrines, moral teachings, the saints, Bible stories and parables while the works remained symbolic and decorative in their artistic expressions. Since the High Middle Ages, however, people became increasingly concerned with their own values, the secular life, and the objective world,","cat":"奇美博物館","details":["藝術廳","13至16 世紀:神性與人性"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619166860226_9024049082822623521.jpg","1619166873027_2507264952881217314.jpg"]},{"id":"recU8zIhln0jnVX3o","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619148440843_1678554540477424031.jpg","1619148456851_3161476142665081062.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（nVX3o）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recUBlgUivvO6kD5K","name":"清 英和 臨趙孟頫蘭亭跋","notes":"清 英和 臨趙孟頫蘭亭跋\n　　索綽絡．英和（1771-1840），初名石桐，字樹琴，滿洲內務府正白旗包衣，乾隆五十八年（1793）進士。\n\n　　本幅節臨《快雪堂法帖》〈元趙孟頫蘭亭序十三跋及臨本〉其中三札，章法雖經移行換位，且有脫字，然其用筆圓潤遒勁，結體規模與原帖十分相近，應是對臨之作，從中得以窺探書家入古出新的方法與態度。","cat":"故宮","details":["筆墨見真章"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1620456008976_6290790011699307761.jpg","Screenshot_20210508135838.jpg","Screenshot_20210508135920.jpg","Screenshot_20210508135854.jpg","Screenshot_20210508135910.jpg","Screenshot_20210508135943.jpg","1620454278285_1012290760172312528.jpg","1620454297080_8545626145321706030.jpg","1620454306089_4652157200415024320.jpg","1620454316087_7946579858805775898.jpg","1620454325570_353842057514736862.jpg","1620456375744_362464186735500641.jpg"]},{"id":"recUEB8EgUbdwnQUu","name":"聖母子\n\nMadonna and Child","notes":"聖母子\n\nMadonna and Child\n\n漢斯·赫茲赫風格\n\n(德國,十五世紀\n\n约1400年,但金彩晶振木\n\n頭戴冠冕的聖母瑪利亞,左手抱小耶穌,右手 則可能握著權杖,而比出祝福手勢的小耶穌, 則握著暗示權力的球體,本作被認為是當時 「漢斯·蒂茲赫風格」風潮下的作品:聖母的 甜美臉龐與優雅身線,富含國際哥德風格特 色,但腹前和腿部的大片厚重衣裙則屬哥德晚 期的「縮風格」。","cat":"奇美博物館","details":["藝術廳","13至16 世紀:神性與人性"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619167467496_3948870368014951511.jpg","1619167478558_2521003069062718141.jpg"]},{"id":"recUKcIqmj159uvJc","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619145775814_8528360503316140719.jpg","1619145804900_5518077307409460361.jpg"],"displayTitle":"熱蘭遮城與大員市鎮","titleBasis":"依展場照片標示或內容整理"},{"id":"recULpQT0bLeUC7eg","name":"","notes":"","cat":"故宮","details":["青銅饗宴：古代的禮儀與樂曲"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619250175212_944752893399562967.jpg"],"displayTitle":"青銅饗宴：古代的禮儀與樂曲｜待辨識紀錄（UC7eg）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recUMvSl00E1mBa6O","name":"","notes":"","cat":"奇美博物館","details":["羅丹"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619160903622_77019559654 displayTitle":"藝術修復｜待辨識紀錄（Mpx1F）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recV5HULO8TSAZtfU","name":"最後的眼淚習作 The Study of The Last Tears'","notes":"最後的眼淚習作 The Study of The Last Tears'\n\n那爾西斯·威吉勒·迪亞茲·德·拉·培納\n\n(法國,1807-1876)\n\n1855年,油彩、木板\n\nNarcisse Virgile DIAZ de LA PEÑA\n\n(French, 1807-1876)\n\n1855, Oil on panel\n\n這件作品是培納的習作,這位乘風飛揚 的女子正是【最後的眼淚】的人物。她略 為扭轉的身軀帶出美麗的背部線條,吸 引著觀者的目光。而她逐漸隱沒在背景 中的腿部,以及環繞四周的淺棕灰色系 雲霧則營造了一股奇幻朦朧之感,予人 無限遐想。\n\n0001218","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619165150638_4167453918986327418.jpg","1619165162727_4611515536005221719.jpg"]},{"id":"recV8e45ACUHjQgsp","name":"民國傅狷夫對高嶽 ","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第二檔）","period":"","number":"贈畫000964N000000000","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recV8p4U5Bxz20SzN","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619147570919_5169442480324617224.jpg","1619147585946_4147415925885795765.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（20SzN）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recV8wjukYHqlCHKv","name":"日本 桃山時代 瀨戶窯 驢蹄口茶末罐","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"南購瓷000138","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recVE9yUKfRuEkG0T","name":"茶葉貿易圖 d.烘乾 ","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"臺灣工夫茶","period":"","number":"南購畫000099","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recVJZfYCsvr0oiON","name":"漢\t \t大吉買山地記墨拓本\t軸","notes":"","cat":"故宮","details":["筆墨見真章"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recVJaAtlLCETIUYU","name":"家庭團聚 A Family Gathering","notes":"家庭團聚 A Family Gathering\n\n溫佐·托爾諾\n\n(丹麥:1844-1907) 1898,油彩、出布\n\nWenzel TORNOE (Danish, 184419071 1898, Oil on canvas .\n\n陰暗破舊的居所裡,微光照亮了座聚在\n\n一起的家人們,蓝衣男子正與老人交 談,身穿粉紅洋裝的小女孩低頭者苦于 中的玩偶路繞害羞,而涮繞在桌子後方 的女子和男孩們。其樸素的衣裝和環境 反映著他們清貧的生活。但平和的神情 與溫暖的光線,則呈現市井小民生活裡 的空福時刻。","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619166660831_77473597609731862.jpg","1619166669923_6468825228389920606.jpg"]},{"id":"recVLxGTQFr8nrtKh","name":"人氣國寶展","notes":"人氣國寶展\n本院典藏了許多藝術史上的名品，以及備受喜愛的人氣國寶。為了讓南部觀眾有更多機會親近院藏精粹，於南部院區S302展廳延續「人氣國寶展」，自109年10月底重新規劃展示主軸與設計，除了在展陳上詳細說明文物，讓觀眾對每件人氣國寶，皆能有完整且深入的認識，同時以小主題串聯局部展件，提高觀展的樂趣。\n","cat":"故宮","details":["人氣國寶展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["Screenshot_20210424102912.jpg"]},{"id":"recVODPhKK1rMDWES","name":"明 宣德 青花轉枝海棠紋茶葉罐","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—明人雅集","period":"","number":"故瓷010939","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recVOp9Las65GQIBO","name":"明\n文伯仁 圓嶠書屋圖","notes":"明\n文伯仁 圓嶠書屋圖\n文伯仁（1502-1575），字德承，號五峰，江蘇蘇州人，為文徵明(1470-1559)姪兒，受其畫風影響甚深。\n本幅為以「圓嶠書屋」設計的山水畫，是明代流行的齋室圖，也是文氏最早的青綠作品。建有道教寺觀的仙島圓嶠山，隔著遼闊水域與文人書齋相望，岸邊設置小船暗示仙境與人境的可親近性。山石樹木造型與設色皆承襲自文徵明，整體清潤而秀雅。","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第一檔）","period":"","number":"","url":"","wiki":"","years":[{"id":"recj9BkloPzQZSvTC","name":"明朝"}],"exhibitions":[],"artists":[],"attachments":["Screenshot_20210424102303.jpg"]},{"id":"recVRV5QX3gpiA6RZ","name":"","notes":"","cat":"奇美博物館","details":["19世紀沙龍廳"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619165549746_6890910630231986583.jpg","1619165565554_7649032447060543910.jpg"],"displayTitle":"19世紀沙龍廳｜待辨識紀錄（iA6RZ）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recVYJ6lPiCwCvVva","name":"商代晚期\n獸面紋爵","notes":"商代晚期\n獸面紋爵\n此爵有著卵形底，腹部裝飾獸面紋。器足修長，且口部呈兩端上揚的圓弧狀，再搭配聳立的菌形立柱，顯得優美均衡。","ca xhibitions":[],"artists":[],"attachments":["1619244778274_7839779986372641614.jpg"]},{"id":"recW3f2IdgqCX5hxs","name":"","notes":"","cat":"奇美博物館","details":["藝術修復"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619164433569_7372432456865816658.jpg","1619164442610_7097399507897077946.jpg"],"displayTitle":"藝術修復｜待辨識紀錄（X5hxs）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recW6WWfZbhVAelCW","name":"漢文《妙法蓮華經》 七卷","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第4單元　經藏的流轉","period":"元至順2年（1331）嘉興路顧逢祥等刊本","number":"故佛000194〜000200","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recW8bjucnmATH7Al","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619147331902_742010786960965859.jpg"],"displayTitle":"福建漳州窯釉上彩、青花與青瓷","titleBasis":"依展場照片標示或內容整理"},{"id":"recW9C2NFHFaIWpJa","name":"宋人虎溪三笑圖 / 藝林集玉　冊","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第一檔）","period":"","number":"故畫001296N000000001","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recWAsgrufNTrbu0a","name":"掐絲琺瑯五供","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第2單元　佛陀的智慧","period":"清(1644-1911) 西元18世紀 ","number":"中琺000296〜000300","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recWBr4T72fq09Hg3","name":"","notes":"","cat":"奇美博物館","details":["17至18世紀：宮廷與市井"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619169216634_3459391623471490011.jpg","1619169227427_2909722674189702578.jpg"],"displayTitle":"17至18世紀：宮廷與市井｜待辨識紀錄（09Hg3）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recWIpQw2S4XutNDQ","name":"清 白玉茶鍾一對","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—清代品茗","period":"","number":"故玉001666 故玉001667","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recWNaH5lYuCMIdEu","name":"飾件 良渚文化 國立自然科學博物館典藏","notes":"","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1618993350785_3293345701042903263.jpg"]},{"id":"recWRs7WdYxydxZPE","name":"北宋\n定窯 牙白劃花回紋茶托","notes":"北宋\n定窯 牙白劃花回紋茶托\n高 5.0公分 口徑 14.5公分 底徑 3.5公分\n斗笠形茶盞，通體施黑釉，口沿鑲扣銅邊，內底一點凸起，內壁貼飾枯葉紋，葉紋褐黃、帶藍白條縷斑紋。底足無釉，胎質粗鬆，呈色灰黃，碗壁顯見拉坯遺痕，外底圈足淺遺有沾釉痕跡。釉色漆黑，釉面偶現黃色棕 眼氣孔點。 \n\n剪紙貼花黑釉碗器為江西吉州窯獨創一格的裝飾技法，常見木葉、梅花、龍鳳、或文字等貼花圖案紋。黑釉木葉碗為 其代表作，其技法先於生坯器上施含鐵質的黑褐色底釉，後將處理過、沾染含鐵較低的褐黃釉木葉貼著於黑釉之上，一次燒成，因而產生黑地枯葉饒富趣味的裝飾，啜茶時枯葉若隱若現，別具情趣。這類木葉紋現經學者研究，應為桑葉紋，與江西百丈寺的禪院茶禮流行有關，《百丈清規》〈赴茶湯〉內不少條文中均提及茶在寺院的使用方式、作用和意義，此亦與南宋江西派詩人陳與義「柏樹解說法，桑葉能通禪」的禪茶文化美學相關。 \n\n典型宋代茶托形制「形如碗帶托盤，中空，下有足。」，上方深腹碗形為茶托的托圈，壁深用以承盞，中空無底。盤 口及圈足均鑲銅扣，圈口則未加圈扣。托盤寬圓平出微有弧度，圈足略高外撇，圈口及盤口皆刻劃回紋一周為飾，釉色牙白瑩潤 ，胎質細膩。 \n\n南宋末周密《齊東野語》書內曾提及宋人舉茶是茶盞與茶托一起，足見茶托與茶盞配套使用，遼宋壁畫或茶畫上所繪茶盞與茶托，一般都是成組出現，形影不離，舉茶時可隻手扣持盤沿，隻手持盞。此於南宋周季常‧林庭珪所繪〈五百羅漢圖〉（1178-88），或1959年出土的金代山西孝義縣張家莊金墓〈磚雕仕女圖〉上皆可見及宋人持盞方式。 \n\n宋代定窯燒造數量極大，除精品上貢外，一般民間日常用器亦有生產，碗盤類最為常見，茶托存世較少，可能是宮廷訂製器皿。北宋早期還見托圈有底，如定州靜志寺塔基出土帶「官」字款茶托，形為宋制，但有底，不中空，可視為唐五代至宋 代過渡時期製品。宋代中期以後托多為中空，汝窯、官窯、景德鎮青白瓷等或漆器、金銀器皆然。黑漆茶托搭配白釉茶盞，或朱漆茶托與黑釉茶盞成套，形成黑白、或紅黑對比的時尚美感。而《齊東野語》內則提及家中有喪則不宜舉用朱色茶托。","cat":"故宮","details":["東亞茶文化展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[{"id":"rec7cWNyAX3EyGlbO","name":"北宋"}],"exhibitions":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}],"artists":[],"attachments":["Screenshot_20210424101505.jpg"]},{"id":"recWT7qXSmoGEl8ws","name":"","notes":"https://peekingbehind.chimeimuseum.org/Theme/paintings/2011251746122\n風車前的旅人\n回上一層\n\n\n奇美博物館計劃型助理研究員 徐鈺涵\n奇美博物館 油畫修復師 李文元\n\n \n \n\n案例概述\n\n十七世紀法蘭德斯的畫家－楊‧布魯赫爾二世來自著名的藝術世家。〈風車前的旅人〉是他承自父親創作的「風車鄉景畫」類型，簡單樸實的鄉村景緻，實則每一個物件隱含了很多道德教化寓意。隨著時間流逝，原有的獸骨似乎消失在畫作之中，該如何找到它？又該如何解釋它消失的原因？\n\n \n\n風車前的旅人畫作\n風車前的旅人, 楊‧布魯赫爾二世 (法蘭德斯，1601-1678), 年代不詳, 27.6 x 17.65 公分, 油彩、銅版\n\n \n畫家是誰？\n\n楊‧布魯赫爾二世是十七世紀尼德蘭地區南部（法蘭德斯）的畫家。他來自於著名的藝術世家，祖父是皮耶特‧布魯赫爾（Pieter Bruegel I, 1525- 1569），所創作的寓意畫和風景畫對當時的北方繪畫發展有著巨大的影響，父親楊‧布魯赫爾一世（Jan Breughel I, 1568-1625）擅長花卉靜物畫與風景畫。\n\n\n楊‧布魯赫爾二世自幼就在父親的工作坊學習，深受父親畫作類型與風格的影響，在1625年接手父親的工作坊後，經常模仿父親的畫風進行創作。\n\n\n畫了什麼？為什麼畫這個？ 1\n\n作品描繪深具尼德蘭特色的「風車鄉景畫」，人們正在蜿蜒的鄉間小徑各自忙活，或搬運貨物，或幫忙卸載貨物，或駕著馬車運送物品。每個人雖各自忙碌於工作，但也因在各地來來去去而成為旅人。\n\n\n風車＋旅人＋鄉間道路是當地典型的村落景致，〈風車前的旅人〉也因此看起來像是一幅簡單易懂的風景風俗畫。但是有趣的是，尼德蘭地區自十五世紀起就開始鼓吹要將對基督教新信仰落實於生活中，要能在日常生活的事物中進行道德、信仰的聯想。也因此，看畫不只是單純的美感體驗，而是要能從中聯想到道德與信仰的精神性啟示，當時的畫家在創作時也會刻意緊扣著這個核心：看似平常無奇的日常景緻，實際上處處充滿著當時代常見的警世元素。\n\n\n〈風車前的旅人〉中的風車、鄉村田野、天色、鄉間道路上的旅人們就都有多元的寓意，甚至有凡事一體兩面的道德警世意味。","cat":"奇美博物館","details":["17至18世紀：宮廷與市井"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619169097194_3394845252737822745.jpg","1619169107491_9035787561555746157.jpg"],"displayTitle":"風車前的旅人","titleBasis":"依原始說明"},{"id":"recWUs54Ip1j1j5bj","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619147183357_3862639351986553117.jpg","1619147200588_6473782933713238230.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（1j5bj）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recWcVFrwsNuV4frM","name":"瑪瑙","notes":"","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1618992811003_3723040101320664482.jpg"]},{"id":"recWd0wMI84D6NMB7","name":"玉鏟\n\n新石器時代 國立自然科學博物館典藏","notes":"","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1618993189934_8150330483143352125.jpg","1618993203981_6051036738611013001.jpg"]},{"id":"recWki6Y2E4eQa3WW","name":"21日治時期","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619149759931_6567544385050866312.jpg","1619149822321_4227470414475381447.jpg"]},{"id":"recWqofuK44pan1Q6","name":"唐 玄宗 開元十三年\n禪地祇玉冊","notes":"唐 玄宗 開元十三年\n禪地祇玉冊\n本套唐玄宗禪地玉冊共十五簡，記載玄宗敬告地衹神的祝禱文，在祝禱之際，也向世人宣告天子承運而生的正統地位。可以補足、刊正史籍的闕如與錯植，可謂國之重寶。 封禪大典是天子祭祀天地最高等級的儀式。「封」是登泰山祭天；「禪」則是在泰山旁的小丘祭祀地祀的典禮。\n \n「封禪」是歷史中最耗費人力、物力的典禮，自秦始皇以降，總共只有七位皇帝舉行此一祭典。幸賴本套玉冊出土現世，得有研究禪地典禮的第一手史料。和本玉冊同時出土者，尚有宋真宗的禪地玉冊，是馬鴻逵將軍（1892-1970）於民國二十年（1931）率領軍隊在山東泰安蒿里山整地時所發現，後由其夫人捐出轉至本院收藏。本套玉冊實為白色大理石質，一般稱為漢白玉。長短不一，簡與簡之間以金屬線串聯。冊文係以斜刀鐫刻後貼以金箔，但現在多已剝落。其中，除玄宗署名「隆基」二字為楷體外，餘為隸書，字跡清晰，保留了原來書寫的筆意，端整豐勻，經研究與玄宗的書風相符，或是他親筆御書之作。","cat":"故宮","details":["人氣國寶展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[{"id":"recAy0YwrnSNYTGDk","name":"唐朝"}],"exhibitions":[],"artists":[],"attachments":["2020102216521388997.jpg","1619244673364_346880265673223583.jpg","1619244689575_5959309699326678754.jpg"]},{"id":"recWrLfNHZbAeOFP9","name":"玉器\n\n良渚文化\n\n國立自然科學博物館典藏","notes":"","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1618993315841_254665095919182073.jpg"]},{"id":"recWrvXoz9xzGcwLO","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619147106394_5851937961926232682.jpg","1619147123550_2045948513500256973.jpg","1619147139533_7599415422268614905.jpg","1619147154327_3720626739290242248.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（GcwLO）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recX1ZkoQrOE2hZjP","name":"","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第4單元　經藏的流轉","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619246594756_8846600097704136031.jpg","1619246605508_1034424854742665721.jpg","1619246622205_9138775386943086671.jpg","1619246636768_2491666823901174778.jpg","1619246660853_7306523189973041783.jpg","1619246709618_4205057313246017753.jpg","1619246728545_3786977401314090556.jpg","1619246741192_1788214945488191574.jpg","1619246752009_5972332617164367954.jpg"],"displayTitle":"佛陀形影—院藏亞洲佛教藝術之美｜待辨識紀錄（2hZjP）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recX6VMK6lN1STCLq","name":"菩薩立像","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第3單元　菩薩的慈悲","period":"北魏（386-534） 西元6世紀初 ","number":"贈銅000130","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619247498926_8359465857804946405.jpg","1619247510160_2221872256751647959.jpg"]},{"id":"recX88p6CJ4gkTyRU","name":"佛與二菩薩(殘件)","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第2單元　佛陀的智慧","period":"吉林省半拉城遺址出土 / 北朝(420-589) 西元6世紀","number":"中日雕000009","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619242862657_2588058543679773483.jpg","1619242873279_6161122471191431449.jpg"]},{"id":"recX9XkeMklOsXS39","name":"聖約瑟與聖子 St. Joseph and the Christ Child","notes":"聖約瑟與聖子 St. Joseph and the Christ Child\n\n吉多·雷尼和工作坊 (義大利,1575-1642) 約1636-1637、油彩、丑布\n\nGuido RENI and workshop (Italian 1575=1642 ) ca.1636-1637 Oil on canvas\n\n「聖約瑟與聖子」是巴洛克的家雷尼晚年 後經常創作的主题,曰至黃蓉的約瑟將 耶穌安产地病在胸前,並用橘色的外泡 小心翼翼地将耶穌包裹於其中,展現父 親叫魂孩子的關愛之情。倘臥在约瑟曹 通上的耶穌,明亮的眼眸正带购琴柔和 的目光交望,快速親子間的親暱情感。","cat":"奇美博物館","details":["17至18世紀：宮廷與市井"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619168548301_3985223554360034767.jpg","1619168555819_6081797928833657547.jpg"]},{"id":"recXBCJWbjHyoJ2lC","name":"","notes":"","cat":"奇美博物館","details":["自動樂器"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619162925561_3712440780059395747.jpg","1619162936375_6674885388870090055.jpg"],"displayTitle":"自動樂器｜待辨識紀錄（oJ2lC）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recXGghfs5yEcGrPU","name":"佛陀形影—院藏亞洲佛教藝術之美","notes":"常設展覽/ 佛教藝術展廳\n\n佛教起源於印度，是構成亞洲文化的重要成分。自西元前六世紀釋迦牟尼創教以來，至十二世紀末回教徒大舉入侵為止，歷經一千七百餘年的發展。在佛教發展的過程中，教理與時俱進，宗教內容不斷充實，思想體系也愈趨完備，隨著各個王朝統治階級的護持推廣、僧侶不斷弘揚、以及商旅往來等，印度佛教信仰日益擴大，影響及於中亞、中國、西藏、蒙古、斯里蘭卡、東南亞等地。東北亞因與中國往來頻繁，佛教也順勢傳到了朝鮮半島與日本。如今，佛教已在亞洲各地綻放出豐富多元的文化花朵。\n \n\n亞洲各地的佛教造像或經典雖然都以解決眾生痛苦，傳達成就佛果等宗教訊息，但各地的文化沃土有別，在當地養分的滋潤下，發展出許多「同源異流」的地方特色，造就出千變萬化的佛、菩薩、天王、護法等形象，與各式不同的寫經方式與裝裱形制，使得亞洲佛教藝術顯得異彩紛呈、璀璨奪目。\n \n\n本展覽分為「誕生的喜悅」、「佛陀的智慧」、「菩薩的慈悲」、「經藏的流轉」和「密教的神奇」五單元，以時間為軸，將各地的佛教造像與經典等並列，呈現佛教藝術的「不變」與「變」。引領觀眾欣賞同一時期、不同地區的佛教藝術之美，以及其深邃的宗教哲理。\n \n\n第一單元\n\n誕生的喜悅\n\n傳說中，迦毗羅衛國太子悉達多從其母摩耶夫人的右脇而生，繼而腳踏七步，步步生蓮，指天指地，宣告：「天上天下，唯我為尊，三界皆苦，吾當安之。」其後便有龍王吐出香水為太子洗浴。這則傳奇故事中的悉達多太子，就是後來的佛教創始者釋迦牟尼，而也因此通稱佛誕日為「浴佛節」。直至今天，每逢農曆四月初八的佛誕日，許多佛寺仍舉辦「浴佛」的宗教儀式。現存許多一手指天、一手指地的誕生佛像或與「浴佛節」的儀式有關。\n \n\n第二單元\n\n佛陀的智慧\n\n深具智慧的釋迦牟尼佛悟得解脫之道，祂是早期佛教所獨尊的宗教導師，但是主張「眾生皆有佛性」的大乘佛教，卻認為在不同的時空中，還有許多佛的存在，如彌勒佛、無量壽佛、藥師佛等。亞洲各地的佛像，或受印度影響，或從中國汲取養分，隨著各地佛教文化的日趨成熟，發展出獨特的藝術風格，並反映在各類佛陀的圖像中，形成不同的地方與民族特色。\n \n\n第三單元\n\n菩薩的慈悲\n\n「利他精神」是大乘佛教的精髓，發願度化眾生的菩薩就是大乘佛教最佳的代表。菩薩種類眾多，其中，以即將在未來世成佛的彌勒菩薩和大慈大悲的觀音菩薩尤受信眾推崇，造像數量可觀，流傳時間最長、分佈地區也最廣。同時，在佛教傳播的過程中，菩薩的信仰和圖像也與各地文化緊密結合，發展出與印度截然不同的菩薩圖像，例如中國的送子觀音、大理國的易長觀音等。\n\n第四單元\n\n經藏的流轉\n\n釋迦牟尼所說的教法最初以口語傳承，釋迦牟尼本人也認為教法應以當地的語言來傳授。進入文本時代，主要先是梵文、巴利文，後隨著佛教在各地的傳播，而有漢文、藏文、西夏文、蒙文、滿文、緬甸文等各種版本的佛典。經典以多種文字並存遂成為佛教文化的一大特徵。 本單元選展院藏各類佛典。以文字而論，包含前述漢文、藏文、滿文、西夏文等；技法含刻印、寫繪與織繡等；年代則橫跨10世紀後半至20世紀初。\n\n第五單元\n\n密教的神奇\n\n密教即「秘密佛教」，為佛教在印度發展的最後階段。此時為與印度教抗衡，佛教在以唯識哲學為基礎的本尊觀想法中，吸收了印度傳統的咒語、設壇（曼荼羅）、火供等儀式，並出現了大量多面多臂、忿怒相與女性尊等尊像。密續（Tantra，密教典籍）依據成立年代以及內容，一般可分為「事續」、「行續」、「瑜伽續」、「無上瑜伽續」四類，而無上瑜伽又可分為「父續」與「母續」。在中國唐代和日本的密教，以行續與瑜伽續為主，而西藏的密教，則以無上瑜伽為特色。密教美術的內容豐富，風貌多元。","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[{"id":"recW7stqlCuUEnKHh","name":"佛陀形影—院藏亞洲佛教藝術之美"}],"artists":[],"attachments":["Screenshot_20210424110305.jpg","1619245507114_1450186498583373154.jpg"]},{"id":"recXJsI03obTGHvPH","name":"明 成化 青花紅彩花卉茶鍾 一對","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—明人雅集","period":"","number":"故瓷017966 故瓷017967","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recXPyyb02p7QfhPv","name":"","notes":"","cat":"故宮","details":["青銅饗宴：古代的禮儀與樂曲"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619250212363_9156887162117126984.jpg"],"displayTitle":"青銅器的器類與功能","titleBasis":"依展場照片標示或內容整理"},{"id":"recXQBmL4Wv0NLdSb","name":"男性尊","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"印度教","period":"柬埔寨或泰國 / 高棉王朝（802-1432） 西元12-13世紀","number":"贈銅000076","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619247464169_1335688554736137246.jpg","1619247476536_4717398686021350798.jpg"]},{"id":"recXR5MbeqzM0R4pF","name":"清 銀絲編長方形嵌螺鈿茶盤","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"蒙藏奶茶","period":"","number":"中雜000085","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recXqIxnF8g1Uvrsi","name":"彌勒菩薩","notes":"巴基斯坦（古犍陀羅）、 貴霜王朝（西元1 世紀-320）、西元3 世紀\n彌勒菩薩\n片岩、通高168.5 公分\n犍陀羅是古印度的國名，位於肥沃的印度河和喀布爾河流域之間，包括今日阿富汗和巴基斯坦的部份地區。該地是連結長安和羅馬絲路的必經之地，是東西文化的薈萃之地。又因曾被亞歷山大大帝征服，深受希臘化文化的影響，所以發展出西方色彩濃厚的造像風格，與朱木納（Jumna）河畔的秣菟羅並稱為印度貴霜王朝兩大造像中心。\n\n這尊菩薩像深目高鼻，波浪捲髮長及至肩，合理的身體結構展現雄健挺立之姿，身戴多重精緻瓔珞，厚重的天衣和下裳的衣褶立體寫實，在在顯示其風格深受西方文化強烈的影響。\n\n這尊菩薩右手施無畏印，而左手所提拎的淨瓶就是彌勒菩薩常見的持物，祂將於未來世度化眾生，現存許多類似的貴霜遺例正足以說明當時彌勒菩薩信仰之盛行。","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第3單元　菩薩的慈悲","period":"巴基斯坦（古犍陀羅）/ 貴霜王朝（西元1世紀-320） 西元3世紀","number":"購雜001195 ","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["20190524183949942866.jpg","1619245601564_3735418071978371864.jpg","1619245612778_303398368020665757.jpg","1619245625859_6829242965974779098.jpg","1619245636584_6006587304000053819.jpg"]},{"id":"recXyXq9PM25yzbM5","name":"明 景德鎮窯 青花羅漢圖提梁方盤","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"南購瓷000143 ","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recXzOSTn5yn1MNJk","name":"","notes":"","cat":"奇美博物館","details":["羅丹"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619159591244_1610624534869061686.jpg","1619159601614_8898315658734673344.jpg"],"displayTitle":"羅丹｜待辨識紀錄（1MNJk）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recY6wKpBJNAJcL6X","name":"麥子的祝福 The Blessing of the Wheat","notes":"麥子的祝福 The Blessing of the Wheat\n\n裘勒·布荷東\n\n(法國,1827-1906)\n\n1872、油彩、盡布\n\nJules BRETON\n\n(French, 1827-1906) 1872, Oil on canvas\n\n布荷東是法國十九世紀中期最著名的農 民畫家之一。本作是1872年重縮的版本 (原作於1857年獲沙龍展二等獎),神職人 員帶領地主們走進麥田,後方則是常 民,而持長劍的士兵則於隊伍中維持秩 序、蓝天、麥田與祈禱節遊行,記錄著 大自然、人民和宗教間的依存關係。","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619166534533_2696901454399504567.jpg","1619166525184_6563718590939528166.jpg"]},{"id":"recY8EZGPwLfMxGhY","name":"明 永樂 甜白暗花折枝靈芝紋菱花式茶鍾","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—明人雅集","period":"","number":"故瓷003350","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recY9fwUEqtl3hhAF","name":"","notes":"","cat":"奇美博物館","details":["羅丹"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619169803927_4888347332137592654.jpg"],"displayTitle":"羅丹｜待辨識紀錄（3hhAF）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recYFKn7vZIJL6V0S","name":"南宋 哥窯 灰青葵口茶碗","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—唐風宋韻","period":"","number":"故瓷015875","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recYLCki3WoL8T7OY","name":"宋蘇漢臣貨郎圖　軸 軸 故畫000090","notes":"","cat":"故宮","details":["畫琳瑯—貨郎圖特展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1620459585849_5462123054590602037.jpg","1620459567017_9092138112335380519.jpg","1620459576803_5769688459671667823.jpg","1620459595200_3349011405192466080.jpg","1620459605192_6788025136503727464.jpg","1620459617117_2673033252104490446.jpg","1620459626747_7927257530916579197.jpg","1620459636626_2272578595234981297.jpg"]},{"id":"recYNj6jlcCJRcyij","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619147254829_65846 me":"清 銀鍍金裡纍絲奶茶碗","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"蒙藏奶茶","period":"","number":"中琺001476","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recaFbBXKUgd5K9ry","name":"","notes":"","cat":"奇美博物館","details":["羅丹"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619160981442_242678262556550690.jpg","1619160991344_2789160942507289089.jpg","1619161009006_3828783963823820076.jpg"],"displayTitle":"羅丹｜待辨識紀錄（5K9ry）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recaIDRH9Z3bjLE1O","name":"唐李觀墓誌銘墨拓本","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第二檔）","period":"","number":"購拓000167N000000000","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recaJVXgzMihbyu0f","name":"明 嘉靖 霽青茶鍾","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—明人雅集","period":"","number":"故瓷017837","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recaJarPFOuUdE3eU","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619146508304_8452165474918077242.jpg","1619146537727_8744381718537509015.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（dE3eU）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recaJiXpc5hQULqEz","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619147000045_5236290137156134223.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（ULqEz）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recacUqEeaDzrIWzX","name":"宋\n\n吉州窯 黑釉木葉紋茶碗\n","notes":"宋\n\n吉州窯 黑釉木葉紋茶碗\n\n高 6.8公分 口徑 11.0公分 足徑 8.2公分\n\n斗笠形茶盞，通體施黑釉，口沿鑲扣銅邊，內底一點凸起，內壁貼飾枯葉紋，葉紋褐黃、帶藍白條縷斑紋。底足無釉，胎質粗鬆，呈色灰黃，碗壁顯見拉坯遺痕，外底圈足淺遺有沾釉痕跡。釉色漆黑，釉面偶現黃色棕 眼氣孔點。 \n\n剪紙貼花黑釉碗器為江西吉州窯獨創一格的裝飾技法，常見木葉、梅花、龍鳳、或文字等貼花圖案紋。黑釉木葉碗為 其代表作，其技法先於生坯器上施含鐵質的黑褐色底釉，後將處理過、沾染含鐵較低的褐黃釉木葉貼著於黑釉之上，一次燒成，因而產生黑地枯葉饒富趣味的裝飾，啜茶時枯葉若隱若現，別具情趣。這類木葉紋現經學者研究，應為桑葉紋，與江西百丈寺的禪院茶禮流行有關，《百丈清規》〈赴茶湯〉內不少條文中均提及茶在寺院的使用方式、作用和意義，此亦與南宋江西派詩人陳與義「柏樹解說法，桑葉能通禪」的禪茶文化美學相關。 \n\n典型宋代茶托形制「形如碗帶托盤，中空，下有足。」，上方深腹碗形為茶托的托圈，壁深用以承盞，中空無底。盤 口及圈足均鑲銅扣，圈口則未加圈扣。托盤寬圓平出微有弧度，圈足略高外撇，圈口及盤口皆刻劃回紋一周為飾，釉色牙白瑩潤 ，胎質細膩。 \n\n南宋末周密《齊東野語》書內曾提及宋人舉茶是茶盞與茶托一起，足見茶托與茶盞配套使用，遼宋壁畫或茶畫上所繪茶盞與茶托，一般都是成組出現，形影不離，舉茶時可隻手扣持盤沿，隻手持盞。此於南宋周季常‧林庭珪所繪〈五百羅漢圖〉（1178-88），或1959年出土的金代山西孝義縣張家莊金墓〈磚雕仕女圖〉上皆可見及宋人持盞方式。 \n\n宋代定窯燒造數量極大，除精品上貢外，一般民間日常用器亦有生產，碗盤類最為常見，茶托存世較少，可能是宮廷訂製器皿。北宋早期還見托圈有底，如定州靜志寺塔基出土帶「官」字款茶托，形為宋制，但有底，不中空，可視為唐五代至宋 代過渡時期製品。宋代中期以後托多為中空，汝窯、官窯、景德鎮青白瓷等或漆器、金銀器皆然。黑漆茶托搭配白釉茶盞，或朱漆茶托與黑釉茶盞成套，形成黑白、或紅黑對比的時尚美感。而《齊東野語》內則提及家中有喪則不宜舉用朱色茶托。\n\n","cat":"故宮","details":["東亞茶文化展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[{"id":"rec7cWNyAX3EyGlbO","name":"北宋"}],"exhibitions":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}],"artists":[],"attachments":["17023766.jpg","17023762.jpg"]},{"id":"recag1N4OOm0O4tkc","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619146878035_4773887057064222589.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（O4tkc）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recamA8VtXX1IJ95L","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619146481840_7294741648881679253.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（IJ95L）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recaxAm3sw8cUIePM","name":"","notes":"","cat":"奇美博物館","details":["17至18世紀：宮廷與市井"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619168803498_6079489678588530079.jpg","1619168819634_2303522996164585741.jpg"],"displayTitle":"17至18世紀：宮廷與市井｜待辨識紀錄（UIePM）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recayMBWateJmASF2","name":"","notes":"","cat":"奇美博物館","details":["羅丹"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619159447115_3642226341843565814.jpg","1619159464965_8015472131431926428 (1).jpg"],"displayTitle":"羅丹｜待辨識紀錄（mASF2）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recazQtgNHDgPumqv","name":"04荷蘭東印度公司時期","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619149042323_6834411509022761368.jpg","1619149054310_6684162291019329064.jpg"]},{"id":"recazd7M1MZeSknjj","name":"明\t董其昌\t仿古三種\t冊","notes":"","cat":"故宮","details":["筆墨見真章"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1620456394770_223141146418746796.jpg","1620454479718_5426793876708492013.jpg","1620454491257_1691585469512694178.jpg","1620454504065_5454560746869622694.jpg","1620454511214_8160120340908643380.jpg","1620454519354_2288541065814896303.jpg","1620454528241_271938939956164997.jpg","1620454535053_8350186475794993149.jpg","1620454541854_605671915176849518.jpg","1620454548022_4839150770104520814.jpg","1620454554231_3390480758284089031.jpg","1620454561098_6083510541441792024.jpg","1620454569240_7787944789591454816.jpg","1620454576407_5530388489239758298.jpg","1620454584013_2427648255972967722.jpg","1620456503149_466068045419408056.jpg"]},{"id":"recb30xQNAwQbsDtz","name":"展覽介紹","notes":"後銅器時代—秦至漢的銅器\n  秦漢帝國時期，青銅器的主要用途由禮器向日用器轉化，而日漸深入一般人的生活。\n\n  過去的許多傳統禮器，或如簋、簠、敦、豆等基本消失，或如鼎、壺等器形變得更為實用。此時流行的則多是新器類，如博山爐、筒形樽、銗鏤及各式燈具等，以供應焚香、貯酒、盛放羹湯、照明等個人生活享受所需。\n\n  紋飾上則展現了或簡樸或靈動的新風貌，有時則充滿著對神仙的浪漫想像。而秦漢金文銘刻的內容除工官記錄外，也出現了許多吉祥祝賀之語。\n\n  在帝國統治下，一個波瀾壯闊的新時代已經到來。這種後銅器時代的轉變，幷非一夕完成，却影響著後世的朝代。","cat":"故宮","details":["吉金耀采—院藏銅器精華展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["Screenshot_20210426092934.jpg"]},{"id":"recb4y3HM2JE6Issx","name":"","notes":"","cat":"奇美博物館","details":["藝術修復"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619164495133_5705420524857433197.jpg","1619164504533_714819783001797984.jpg"],"displayTitle":"藝術修復｜待辨識紀錄（6Issx）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recb6D0HZCxCRPsiE","name":"彼拉多之妻的夢境 The Dream of Pilate's Wife","notes":"彼拉多之妻的夢境 The Dream of Pilate's Wife\n\n耶路羅·也洛利\n\n(義大利,1854-1916)\n\n年代不詳,油彩、畫布\n\nErulo EROLI\n\n(Italian, 1854-1916) Undated, Oil on canvas\n\n本作取自《聖經》,羅馬巡撫彼拉多開庭 審判耶穌時,他的妻子派人傳訊:「那無 辜者的事,你不要管,因為我昨晚在夢 中為他吃盡苦頭,也洛利跳脫文本,選 擇描繪在長椅熟睡的巡撫夫人,夢見耶 穌受釘刑的時刻,抓住皮草的右手正暗 示夢中不安與痛苦的情境。","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619165272268_1250312343301416073.jpg","1619165286170_6165355192818989523.jpg"]},{"id":"recb7jFrafD1qUZVe","name":"元趙孟頫書師說","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第二檔）","period":"","number":"故書000488N000000000","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recbCSubSte29X7DS","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619148490318_3159497807453327013.jpg","1619148507498_891734502567566409.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（9X7DS）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recbMNVLOYgEcMHkW","name":"清郎世寧畫仙萼長春 ","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第二檔）","period":"","number":"故畫001222N000000001","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recbN1i6wkLPBYz0T","name":"清\n乾隆 紫檀博古圖長方匣","notes":"清\n乾隆 紫檀博古圖長方匣\n外盒以紫檀木精雕博古圖為裝飾，打開以紫檀木為內盒，外飾填金松、竹、梅、荷四季植物，及鹿、鶴圖，象徵鹿鶴同春、天地欣欣向榮。內盒兩側又淺雕開窗，以葫蘆、蝙蝠、方勝、芭蕉等各種吉祥圖案為造型，透過開窗可見裡面各種材質與造型的小古玩。將開窗屜板拉開，裡面分成許多小格，每格各有一件古玩，並設有屜板可再抽出。從正上方看，可見琺瑯、日本漆器、鼻煙壺、西洋鼻煙盒和扇子等。中間屜可以完全取出，取出後可看到下面也是各式古玩。取出的中間屜，底部另設暗屜，內藏小尺寸的書畫。","cat":"故宮","details":["皇帝的多寶格"],"sub":"","period":"","number":"","url":"","wiki":"","years":[{"id":"recTL4AlTXJe0JgVt","name":"清朝"}],"exhibitions":[],"artists":[],"attachments":["20200221141857238487.jpg"]},{"id":"recbRiGuQAuUuLPrF","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619147514285_5517933965560680830.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（uLPrF）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recbT8RDmX4RqUWOe","name":"臺灣工夫茶","notes":"明末清初，隨著中國東南沿海移民活動，飲茶習慣亦傳至臺灣，並逐漸生根發展。臺灣早期的茶文化，承繼自閩南「工夫茶」的傳統，以潮汕四寶的潮汕烘爐、玉書煨、孟臣壺、若深杯為主要的茶器。\n據《臺灣通史》記載，嘉慶年間自福建引進武夷茶，同治時期又有英商推廣種植烏龍茶並大量外銷。二十世紀後期烏龍茶成為臺灣茶的特色，注重茶的色香味，同時也帶動飲茶風氣的興盛。七Ｏ年代後，臺灣興起「新人文茶」現代茶藝，結合現代時尚與在地文化，形成精緻多元的品茗風潮。","cat":"故宮","details":["東亞茶文化展"],"sub":"臺灣工夫茶","period":"","number":"","url":"","wiki":"","years":[{"id":"recTL4AlTXJe0JgVt","name":"清朝"}],"exhibitions":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}],"artists":[],"attachments":[]},{"id":"recbWTan0YSN3ScCK","name":"餵食時刻 Feeding Time","notes":"餵食時刻 Feeding Time\n\n朱利安·杜培\n\n(法國,1851-1910)\n\n年代不詳,油彩、畫布\n\nJulien DUPRE\n\n(French 1851-1910) Undated, Oil on canvas\n\n本作曾於1999年被借展至阿姆斯特丹梵 谷美術館。朱利安·杜培為巴比松畫派成 員裘勒·杜培(Jules Dupré 1811-1889) 的姪子,鍾情於描繪農作和生活的情景, 被視為是米勒、布荷東等人理念與畫風 的接班人。畫中的農婦拿麵包餵食著眼 前成群的雞鴨,嘱線的雞鴨們個個伸長 脖子緊盯農婦手中的麵包店:一旁觀看 家商舉動的小女孩則露出甜甜的微笑。\n\n9002401","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619166469313_5362775167790686912.jpg","1619166482058_8140833834419699610.jpg"]},{"id":"recbYbMx4uqbRAE4A","name":"","notes":"","cat":"奇美博物館","details":["17至18世紀：宮廷與市井"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619169048149_125662378583702038.jpg","1619169057399_2705741982353916732.jpg"],"displayTitle":"17至18世紀：宮廷與市井｜待辨識紀錄（RAE4A）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recbbg2zm00Fp4A9O","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619146388136_8817277660128497059.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（p4A9O）"," bbles\n\n亞力克斯·阿勒謝維奇·哈拉莫夫\n\n( 1840-1922/1925)\n\n年代不詳,油彩、畫布\n\nAlexis Alexeievich HARLAMOFF (Russian, 1840-1922/1925 )\n\nUndated, Oil on canvas\n\n哈拉莫夫向來以孩童畫作著稱,並曾獲 得英國維多利亞女王的讚賞。三位身穿 破舊俄羅斯傳統農村服飾的小女孩無視 散布在旁的玩具,一臉專注在吹泡泡遊 戲裡。孩子們身處貧困的生活環境,但 白皙的肌膚、紅潤的面頰和沉浸在遊戲 的神情,更加烘托著專屬孩子的純真與 無慮。\n\n0001221","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619166238093_3881326201291325620.jpg","1619166249924_6755409888447351887.jpg"]},{"id":"reccavFHgKA65mhNP","name":"","notes":"","cat":"奇美博物館","details":["羅丹"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619160843976_1475138108166989387.jpg","1619160855396_5472206580195255304.jpg"],"displayTitle":"羅丹｜待辨識紀錄（5mhNP）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recch0vL2uMEmOeP0","name":"釋迦牟尼佛","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第2單元　佛陀的智慧","period":"北周武平元年（570）","number":"贈銅000139","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619242912805_1249205222608440220.jpg","1619242923912_7309039075394340039.jpg"]},{"id":"recchgrd0dJPlhEC6","name":"彌勒菩薩","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第3單元　菩薩的慈悲","period":"喀什米爾 / 西元9世紀","number":"贈銅000053","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"reccm83kxkCPJLQe8","name":"清丁觀鵬摹顧愷之洛神圖 ","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第二檔）","period":"","number":"故畫001714N000000000","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"reccrtLdS4UZA9vbD","name":"坐佛","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第2單元　佛陀的智慧","period":"印尼爪哇 / 中爪哇時期 西元9-10世紀","number":"贈銅000105 ","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619243351067_3574431263320712777.jpg","1619243362464_1415119682984826955.jpg"]},{"id":"recd0Xie1YHahFkM1","name":"清 乾隆 描紅 66199290282492390.jpg"],"displayTitle":"羅丹｜待辨識紀錄（dPvyQ）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recgD5ybHpGpFYtCD","name":"","notes":"","cat":"奇美博物館","details":["藝術修復"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619164364141_3074472055841976571.jpg","1619164375373_5929191591741058424.jpg"],"displayTitle":"藝術修復｜待辨識紀錄（FYtCD）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recgJhE2R2Hc1HG1g","name":"釋迦牟尼佛","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第2單元　佛陀的智慧","period":"印尼爪哇 / 中爪哇時期 西元9世紀","number":"贈銅000103","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619243412140_3921052079206436517.jpg","1619243426443_5721279007822447448.jpg"]},{"id":"recgPpNBKYhvxvTuV","name":"元人春景貨郎圖　軸 軸 故畫000363","notes":"元人 春景貨郎圖\n\n專賣鳥雀的貨郎擔,流行於元明之際,也是 官制貨郎圖的樣式。畫中貨郎與助手在柳蔭下擺 攤,兜售各種鸚鵡、雀鳥,貨架上還有各式鳥 籠,籠內有黃鸝、麻雀、白頭翁、八哥等,以及 兩隻小白鼠。\n\n老貨郎左手立著一隻紅嘴綠鸚哥,乖巧馴 服,右手向婦女孩童推銷介紹。小男童指著鸚 哥,躍躍欲試。通幅設色妍雅,服飾細節考究, 神情活潑生動。\n故畫000363N000000000\n資料類型：\n類型:繪畫\n型式:靜態圖像\n主題與關鍵字：\n仕女 孩童 侍從（侍女、童僕） 貨郎 春景 溪澗、湍泉 竹 楊柳 桃花 猴 鼠 麻雀 壽帶 八哥（鴝鵒） 白頭翁 臘嘴 黃鸝 雲雀 山雀 山鷓 鸚鵡 欄杆 童玩 服飾（對人） 鳥籠\n出版者：\n數位化執行單位:國立故宮博物院\n格式：\n本幅 196.8x104.3公分、全幅 106.7公分\n關聯：\n石渠寶笈三編（延春閣），第四冊，頁1688&*故宮書畫錄（卷五），第三冊，頁261&*故宮書畫圖錄，第五冊，頁203-204&*貨郎圖自宋代以降，常被畫家引為表現主題。本幅無名款，畫春日郊園中，桃花初綻，新柳泛綠，雜草野卉叢生於小溪石畔。柳蔭下停放一貨擔，架上滿置鳥籠，籠中鳥色品種殊異，四周并綴有各式童玩。貨郎二人，一人手執鸚鵡兜售，另一婦人攜二童立於擔前，舉手雀躍作欲索取狀。人物設色妍雅，神情活潑生動，表現出古代農業社會純樸閒適的生活情態。","cat":"故宮","details":["畫琳瑯—貨郎圖特展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1620457701313_5331562914212674515.jpg","PXL_20210508_070449024.jpg","1620457716350_7143208474994402396.jpg"]},{"id":"recgVFl2bsJyizPCZ","name":"集珍壽古　冊　宋蘇漢臣柳陌嬰嬉 冊 故畫003485-2","notes":"","cat":"故宮","details":["畫琳瑯—貨郎圖特展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1620458333806_536179377220720441.jpg","1620458324320_2175204062136966284.jpg","1620458344175_5240748444746141461.jpg"]},{"id":"recgZPbdefuztajFI","name":"貓眼閃玉","notes":"","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1618993092511_8570634682911927993.jpg"]},{"id":"recgbQUVPkXU5ibdg","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619145863218_4182427069563515782.jpg","1619145878170_3652251054644564585.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（5ibdg）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recgdaQBIFJqjsGiZ","name":"臺灣閃玉產在哪裡?","notes":"臺灣閃玉產在哪裡?\n\nWhere are Taiwan nephrite located?\n\n臺灣閃玉主要分布在花蓮縣壽豐鄉豐田的荖腦山一帶,小部分在萬榮鄉 西南王武塔山附近出露,另外,在蘇澳粉鳥林、花蓮木瓜山東側、玉里 清水溪等地也曾有發現報導。就地質環境而言,大南澳變質雜岩也稱為 大南澳片岩,為臺灣地區變質度較高的區域,也是臺灣最古老的地層。 依據岩相和變質度的不同,可分為二個不同溫壓條件的變質帶,即高溫 低壓的太魯閣帶和高壓低溫的玉里帶。臺灣閃玉出露的地區是位於大南 澳變質雜岩的玉里帶,其形成推測與板塊運動有關。","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1618993889783_1129217460135893660.jpg","1618993899966_3508886381771608352.jpg","1618993909497_2715547174911828792.jpg","1618993927401_3424695075301146070.jpg","1618993937975_726873540325667508.jpg","1618993948479_7645696145923568648.jpg","1618993961119_3013979883427632361.jpg"]},{"id":"recglebYWTSGqH1Xx","name":"","notes":"","cat":"奇美博物館","details":["17至18世紀：宮廷與市井"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619169308237_3121403303368212329.jpg","1619169317468_8423876106310661789.jpg"],"displayTitle":"17至18世紀：宮廷與市井｜待辨識紀錄（qH1Xx）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"rech0cS16mM7RiFfx","name":"將小孩都帶到我這兒來 Suffer the Little Children to Come unto Me","notes":"將小孩都帶到我這兒來 Suffer the Little Children to Come unto Me\n\n\n盧卡斯·克拉納赫二世\n\n(德國,1515-1586) 約1540,油彩、橡木板\n\nLucas CRANACH the Younger ( German, 1515-1586) ca. 1540, Oil on oak panel\n\n克拉納赫二世是德國文藝復興時期的代 表畫家。此作描述耶穌祝福小孩,並解 釋兒童的純真信賴是天國子民的模範。 這個主題在十六世紀大肆流行,與新教 徒辯護嬰兒洗禮、解釋救恩的概念有關: 得救的條件在於信者的單純接受,好比 柔弱如嬰孩,亦能得到神的關愛眷顧。\n\nCC00282","cat":"奇美博物館","details":["藝術廳","13至16 世紀:神性與人性"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619167660749_113946253385951725.jpg","1619167677090_3072462688829689303.jpg","1619167688721_127393059036345029.jpg"]},{"id":"rechCAbrOZ6gv9VWX","name":"漢熹平殘碑 ","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第二檔）","period":"","number":"故帖000107N000000000","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rechFoyKUOPvMwihj","name":"佛羅倫斯貴族半身像 Bust of a Florentine Nobleman","notes":"佛羅倫斯貴族半身像 Bust of a Florentine Nobleman\n\n作者不詳(佛羅倫斯)\n\n十六世紀早期\n\n陶土彩繪\n\n中世紀時便已出現彩繪陶土半身像,並在文藝復興 時期蓬勃發展。十五至十六世紀期間,佛羅倫斯為 生產陶土半身像的重鎮,曾出產許多品質優良的作 品。面帶微笑的男子,有著堅挺的鷹勾鼻、高而飽 滿的顴骨與鬍渣,傳神地展現其面容特色,展現當 時雕塑家的嫻熟功力。\n\nAnonymous(Florentine)\n\nEarly 16th century Polychromed terracotta\n\n0012004\n\n義大利法蘭德斯學派鍍金彩繪胡桃木珠寶櫃 An Italo-Flemish Gilt and Painted Walnut Jewellry Cabinet\n\n德尼·卡爾瓦特風格\n\n(1540-1619)\n\n十七世紀\n\n胡桃木\n\n這個珠寶櫃的抽屜裝飾以聖經人物為主,僅下方 兩側的青年與中年夫婦(身分不明)為例外。其 中,有幾個畫面描繪的則是聖經中的情節而非單 純的人物表現,如位於最下方中間的是「耶穌誕 生」,可見聖母與約瑟雙手合十敬拜該出生的耶 穌嬰孩,後方亦有該主題常見的牛與驢元素。\n\nManner of Denis Calvart\n\n(ca. 1540-1619)\n\n17th century\n\nWalnut\n\n0002419","cat":"奇美博物館","details":["藝術廳","13至16 世紀:神性與人性"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619167264165_6714774284240519926.jpg","1619167279126_7909948935148004385.jpg","1619167287111_5264249861675788576.jpg"]},{"id":"rechOnR3qwWL7Vryp","name":"清 乾隆\n霽青描金游魚轉心瓶","notes":"套瓶，造型呈斂口捲邊，長頸，豐肩，斂腹，矮圈足，器肩飾有四圓環形繫耳。瓶腹分內外兩層，內層施淺青湖綠色釉表現出湖水一樣的背景，其間以粉彩畫水草、落花及金魚。器外底施湖綠釉，書有「大清乾隆年製」青花篆體款識。外瓶器腹部上作四鏤空開光，觀者可自頸部握住轉動，透過外瓶開光看見內瓶所繪之水草魚紋悠游嬉戲於眼前，如同走馬燈一般，故名「轉心瓶」。","cat":"故宮","details":["人氣國寶展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[{"id":"recTL4AlTXJe0JgVt","name":"清朝"}],"exhibitions":[],"artists":[],"attachments":["20201022165500077750.jpg","1619245019244_5830379730646401393.jpg","1619245029635_3694427828318150417.jpg","1619245039454_2918738690369935826.jpg","1619245049019_8585797865528197393.jpg"]},{"id":"rechWJnvY2Jai25FT","name":"民國江兆申草嶺","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第二檔）","period":"","number":"贈畫000866N000000000","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rechZAUIXpHnSVKyC","name":"清 乾隆\n瓷仿拉古里木紋茶碗及多穆壺","notes":"清 乾隆\n瓷仿拉古里木紋茶碗及多穆壺\n茶碗（高4.6公分 口徑13.6公分 底徑9.1公分）；穆壺（高46.5公分 口徑9.0公分 底徑13.5公分 通寬25.0公分）\n奶茶碗與多穆壺均為景德鎮御窯廠以瓷仿古拉里木紋理製作而成。多穆壺是滿蒙藏民族共通使用的奶茶用具。《西藏志》中有所謂「拉庫爾」木，拉庫爾亦稱拉古里木，木色黃褐，帶不規則紋理，傳說具解百毒、避邪功效，因此清宮非常珍重以拉庫爾木作成的木奶茶碗及多穆壺。除以珍貴木材製作之外，亦令景德鎮御窯廠仿製具西藏風格的茶具，形制、木頭紋理，維妙維肖。\n\n藏人熬製穌油茶多使用木筒形多穆壺，多穆為藏語，讀音為「Mdog-mo 董莫或多穆」，即奶茶壺之意。這件瓷製多穆壺口沿呈僧帽狀，帶拱形蓋上塑獅鈕頂，圓直筒身，器身上飾四道凸稜，夔龍把，鳳首流，全器除僧帽沿、四凸稜、及獅鈕施金彩外，器內外均掛仿木紋黃褐釉。\n\n奶茶碗寬口外撇，矮壁闊足，全器與多穆壺同，均施仿木紋黃褐釉。清宮在雍正七（1729）年已見檔案有「花梨木磁桶」的製作，由院藏雍正仿木紋花盆，模仿之逼真寫實，令人難辨真假。乾隆二十八（1763）年《活計檔》亦見載景德鎮御窯場為熱河行宮燒造「仿拉古里茶碗」的記事。寬口淺壁類似墩碗的奶茶碗，清宮自康熙朝以來時有製作，有金銀、玉、木質、匏製、象牙、宜興紫砂、及各種釉彩等，本院所藏康熙、雍正朝銅胎或瓷胎畫琺瑯尤為多見。","cat":"故宮","details":["東亞茶文化展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[{"id":"recTL4AlTXJe0JgVt","name":"清朝"}],"exhibitions":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}],"artists":[],"attachments":["Screenshot_20210424101152.jpg"]},{"id":"recheHP0XSWwUAROI","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619147383582_376228218120961626.jpg","1619147409768_2382062030140882628.jpg","1619147443795_6118846301436670540.jpg","1619147467052_2634368750129285960.jpg","1619147485970_6229828017042599768.jpg"],"displayTitle":"熱蘭遮城遺址考古簡介","titleBasis":"依展場照片標示或內容整理"},{"id":"rechpRAfz8PHJuPLu","name":"","notes":"","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"https://web3.nmns.edu.tw/Exhibits/110/TaiwanNephrite/HuangNanqiang.html","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1636867437655_1086018050096457850.jpg","1636867491046_1162084164907494278.jpg"],"displayTitle":"玉言故事展｜待辨識紀錄（JuPLu）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recht6Z0Y8eyzBszH","name":"畫琳瑯—貨郎圖特展","notes":"貨郎是古代賣雜貨的小販，他們挑著貨擔或推著獨輪車，走村串巷，手搖撥浪小鼓，並且以悠揚婉轉的吟唱，介紹商品樣式和用法，賣力推銷，藉以吸引婦女、孩童為主的顧客上門。\n\n貨郎擔上層層疊疊，擺放了品項繁多的商品，宛如縮小版的超市，除了日用百物、玩具、胭脂水粉及農具外，還有糖果、菜蔬等食物，滿載著老少村人的盼望，是流動的幸福滋味。貨郎動人嘹亮的吟唱曲調，則是農村小鎮平淡生活中的小確幸。\n\n「畫琳瑯—貨郎圖」特展除了陳列古代形形色色的貨郎圖，貨郎擔上琳瑯滿目的貨品，與舊時台灣流動商販叫賣「喝玲瓏賣什細」的鄉村文化，也有異曲同工之妙。展覽分成「畫琳瑯—貨郎圖」和「國寶—宋李嵩市擔嬰戲」兩單元，前者介紹宋元明清的各式貨郎圖，後者則聚焦於南宋聲名顯赫的李嵩（1170-1255）〈市擔嬰戲〉，具體呈現貨郎作品的多元面向。希望透過古代豐富的畫作與文化視野，重新找回藝術與生活的對話，讓博物館成為現代人日常生活的養分。","cat":"故宮","details":["畫琳瑯—貨郎圖特展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["08023290.jpg","08023180.jpg","08023179.jpg","08023181.jpg","1620458038105_252656464471467575.jpg","1620458055097_272507972566766140.jpg","1620458064487_514200792042878681.jpg","1620460302381_4555788433141434255.jpg"]},{"id":"rechu5YYufVZdHPnr","name":"","notes":"大理國（雲南，937-1254）、西元12 世紀上半葉\n阿嵯耶觀音菩薩","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["20190524184042546565.jpg"],"displayTitle":"阿嵯耶觀音菩薩","titleBasis":"依原始說明"},{"id":"reci78cZNwadtj76W","name":"","notes":"","cat":"故宮","details":["皇帝的多寶格"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619248387685_4822453416559111314.jpg","1619248401713_5536389511219891020.jpg","1619248413658_2746638962059651869.jpg","1619248427127_3911835500058034082.jpg","1619248443874_8533418301657412691.jpg","1619248455890_2318650130120137471.jpg"],"displayTitle":"皇帝的多寶格｜待辨識紀錄（tj76W）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"reciBwkLQi70Ygqp0","name":"維納斯與阿多尼斯 Venus and Adonis","notes":"維納斯與阿多尼斯 Venus and Adonis\n\n\n(仿)法體巨斯可·阿爾邦尼\n\nAfter Francesco ALBANI\n\n| Italian, 1578-1600)\n\nUndated Oil on canva\n\n平圈邦尼是擅長古典实用的墨宝,以持 合神话頭材的画面坐杀出席名。俊美的 阿多尼斯因與旅納斯相戀,引来戰神的 更低。在時被戰神派來的猛攻擊 致亮,举人四周的小愛神鬥烘托著甜美 的愛情,但空中的戰神與密林中的山豬 身形卻暗示著即將到來的悲劇。","cat":"奇美博物館","details":["17至18世紀：宮廷與市井"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619168507872_1865012000785894776.jpg","1619168518249_3112629368500285470.jpg"]},{"id":"reciEPR4TUdmbnFmU","name":"日本 江戶時代 平戶窯 青瓷太鼓形水罐","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"南購瓷000137","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"reciF5z2ZngNmKTt5","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619146662897_6050699055931516972.jpg","1619146675280_3752863855619392590.jpg","1619146686770_6452041334988029542.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（mKTt5）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"reciMP4xhsMXTteR3","name":"石灣窯　陸羽像","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—唐風宋韻","period":"","number":"唐 驪山石單柄壺","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"reciNGASo1g7yqBOh","name":"","notes":"","cat":"奇美博物館","details":["17至18世紀：宮廷與市井"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619168667593_32098949849958272.jpg","1619168683350_4060370333686100353.jpg","1619168697966_976316893669010730.jpg"],"displayTitle":"17至18世紀：宮廷與市井｜待辨識紀錄（yqBOh）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"reciNSNsUsWvIpOmm","name":"鏤雕卍字八角彩瓷爐座 ","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"南購瓷000152","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"reciOW81ggjrIfeGN","name":"日本 江戶時代 乳丁紋鐵茶釜","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"南購銅000030","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"reciQ1AragiuivAfF","name":"商代中期\n魚紋盤","notes":"商代中期\n魚紋盤\n此件是本院收藏中年代最早的一件銅盤，尺寸頗為可觀。器外裝飾著夔龍紋及連珠紋組合而成的帶狀紋飾，是當時青銅器上流行的圖樣。長長的夔龍在雲雷紋中若隱若現。相對地，盤內的紋飾相當清楚。中心是一個帶有旋轉意向的圓形渦紋，外側為四隻順勢排列的魚紋。兩相結合，呈現魚兒們隨著水流順時鐘排列游動的景象。","cat":"故宮","details":["青銅饗宴：古代的禮儀與樂曲"],"sub":"","period":"","number":"","url":"","wiki":"","years":[{"id":"recOun39ZtAVJxF66","name":"商"}],"exhibitions":[],"artists":[],"attachments":["20200521161955764863.jpg"]},{"id":"reciStO3SFa6gDTZA","name":"清 乾隆 琺瑯彩紅地開光四季花卉茶鍾","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—清代品茗","period":"","number":"故瓷017027","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"reciYIW93vRJnwXyP","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619146450068_2876406821318140035.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（nwXyP）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"reciZjFWHCFHoiaCh","name":"觀音菩薩三尊像","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第3單元　菩薩的慈悲","period":"隋（581-618）- 唐（618-907）初 西元6-7世紀 ","number":"贈銅000150","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619247558143_7771979128957982666.jpg","1619247576080_3667307065830618131.jpg"]},{"id":"reciaAlmf8xEqjRaA","name":"坐佛","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第2單元　佛陀的智慧","period":"五胡十六國（304-439） 西元4世紀下半葉","number":"贈銅000122","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619242591812_5377238815229926310.jpg","1619242608356_3793071447496816848.jpg"]},{"id":"reciaFxWA21tNzWU2","name":"明 田坑窯 素三彩鴨形香盒","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"南購瓷000134","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recieXAy2v8C7temk","name":"清 雍正 松石綠茶盃","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—清代品茗","period":"","number":"故瓷002911","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recihGSeuZMXmQL2t","name":"奧賽羅 Othello","notes":"奧賽羅 Othello\n\n\n皮耶多·卡維\n\n( 1833-1884) 1869,大理石、青銅\n\n《奧賽羅》是莎翁的四大悲劇之一,來自北非的奥 賽羅,因軍事長才成為將領,並娶得美嬌娘。然 而卻遭人用計讓奧賽羅懷疑妻子出軌,最後親手 掐死妻子。奧賽羅拿著手帕的時刻,可能是他誤 會妻子或懊悔誤殺妻子的情景,他溢滿淚水的左 眼,融合著憤怒和悲慟,並藉由白色大理石與深 色青銅的對比,呈現強烈的戲劇張力。\n\nPietro CALVI\n\n(Italian, 1833-1884 ) 1869. Marble, bronze\n\n0002220","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619165207599_4613279916759357441.jpg","1619165224566_5998991416653529168.jpg"]},{"id":"recinycHYROQ1EauW","name":"唐人書瑜珈師地論 ","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第二檔）","period":"","number":"故書000145N000000044","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recj5cY621VrCEoI3","name":"","notes":"","cat":"奇美博物館","details":["羅丹"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619159881732_8416054201783169219.jpg","1619159896643_3465089114469805523.jpg","1619159912299_6735673637092649933.jpg"],"displayTitle":"羅丹｜待辨識紀錄（CEoI3）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recjFT4MbRsy2F1xb","name":"常設展覽\n110-02-03 110-08-29\n翰墨空間─故宮書畫賞析\nS203 2F","notes":"翰墨空間─故宮書畫賞析\n本展透過院藏歷代書畫，系統性地介紹繪畫與書法的發展脈絡。但古典書畫多屬紙、絹類材質，相對脆弱，因此具體展件均以展出三個月為原則，屆期將更換展件。\n \n \n繪畫\n\n　　本院所藏歷代繪畫，型式上有立軸、長卷、冊頁、扇面等之不同；依其內容主題，則可概分為人物、花鳥、山水三類。\n　　中唐（八世紀）以前，人物畫盛行，以東晉顧愷之、唐代吳道子為代表，到了五代，山水畫與花鳥畫取代原本人物畫的中心地位，花鳥畫奉西蜀黃筌「鈎勒」、南唐徐熙「沒骨」技法為圭臬，山水畫則有華北的荊浩、關仝與華南的董源、巨然等名家。\n　　宋代（960-1279）范寬、郭熙、李唐等人的巨碑式構圖，將山水畫推向高峰，尤其南宋畫院在宮廷倡導下盛況空前，花鳥畫精緻古典，人物畫則細密恢弘並陳，山水畫則強調觀察自然與詩意入畫，以留白與對角線構圖，來凸顯意境與象徵性。\n　　元代（1279-1368）趙孟頫的「書法入畫」，承接蘇軾、米芾等文人「心畫」寄情、不求「形似」的藝術理念，將文人畫帶往新方向，「元末四大家」黃公望、吳鎮、倪瓚、王蒙等繼而創造更豐富的風格，成為文人畫的典範。\n　　明代（1368-1644）畫派因地域發展而有不同，如蘇州「吳派」的優雅細膩，閩浙「浙派」的粗放水墨，各具特色。明末「松江派」董其昌，以其豐富的藝術見解，建立將風格對立體系化的藝術史觀，影響後世至深。其後，王時敏、王鑑、王翬和王原祁等「清初四王」繼而發揚，形成「正統派」。\n　　清代（1644-1911）「正統派」奉職於宮廷，也包容歐洲傳教士帶來的西洋畫法，立體與透視成為再造傳統的新工具。宮廷之外，活躍在揚州的一批標榜「怪奇」的畫家，筆墨造型皆非正統，成為後世追求變革的先聲。\n \n\n書法\n\n　　書法以其別具一格的漢文字結構、形體、線條與筆畫運行，組成為一門獨特的藝術形式，並衍生出古文、篆、隸、草、行、楷等不同書體風範。\n　　秦漢時代（221BCE-220）是書法發展的關鍵期，從獸骨龜甲上刀刻的甲骨文、鐘鼎食器上鑄造鐫刻的銘文、以及自由多變的大篆石鼓文等，統一成結構標準的小篆，而為了書寫上的快捷，筆畫平正的隸書，逐漸取代小篆，成為漢代通行的書體。\n　　草書、行書、楷書等書體，都由隸書持續演變形成。魏晉南北朝（220-589）時，書體參雜與發展中的書風時而可見。草書，書寫最為便捷，漢初竹簡即可見其雛形；楷書，為隸書逐漸演變的正規字體，形體方正，易於辨識；行書，則介於兩者間，比楷書流暢，較草書易於辨認，實用性最強，極盛於晉。王羲之是行書成熟時期最具代表性的人物。\n　　隋唐兩代（581-907）書體承繼魏碑的峻整風格，政治統一則使南北各地書風融會，筆法更臻完備，楷書遂成通行書體，顏真卿為集大成者。顏真卿之行書體，納入張旭、懷素的筆法及草書精神，兼容魏晉隋唐風流氣骨，與王羲之比肩。\n　　宋代（960-1279）以後，書法家繼承傳統之餘，又積極探索表現個人情性。蘇軾、黃庭堅、米芾、蔡襄等「蘇黃米蔡」四大家，也多以行書體取勝。\n　　元代（1279-1368）提倡復古，延續晉唐傳統，趙孟頫楷書尤為精絕，與唐代歐陽詢、顏真卿、柳公權並稱「歐顏柳趙」。\n　　明代（1368-1644）書法面貌紛雜，行草書特別活潑自由，如「吳中三大家」祝允明、文徵明、王寵，「南董北王」董其昌、王鐸，都是凸顯個性自成一格的書家，與依循傳統法度者形成對比。\n　　清代（1644-1911）以降，書法受到考據學的影響，為隸篆兩體開創新局，更利用篆、隸書法的線條趣味來寫楷書或行書，開啟「碑學」大門，引領新的書法風尚。\n \n ","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第一檔）","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["Screenshot_20210424101548.jpg"]},{"id":"recjFhNrVrF0ZaGGl","name":"東菱玉\n\n鉻雲母石英岩","notes":"","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1618993117927_9134730460498640862.jpg"]},{"id":"recjLVYGBWm4Pkrkn","name":"明沈度隸書歸去來辭　軸","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第一檔）","period":"","number":"故書000011N000000000","url":"","wiki":"","years":[{"id":"recj9BkloPzQZSvTC","name":"明朝"}],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recjMhDemqKP06VL0","name":"米拉日巴","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第5單元　密教的神奇","period":"西藏 / 西元16世紀","number":"贈銅000460","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recjWBGNugmDx6jBO","name":"明唐寅函關雪霽","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第二檔）","period":"","number":"故畫000470N000000000","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recjndyh8gpcNidGE","name":"大員(Tayouan)","notes":"大員(Tayouan):荷蘭人據臺之時,臺南(包含安平)一帶是西拉雅族的活動範圍,當地人稱此地為Tayouan,漢人依河洛語之音,譯為 「大員」、「台員」或「台窩灣」。由於此地是臺灣最早發展之地, 中國沿海之地也常以「大員」代表整個臺灣。 本展示中,為還原當年時空的情境,並避免閱讀的困擾,統一以大員 代表安平。\n\n福爾摩沙(Formosa):來自拉丁文及葡萄牙文的「Formosa」,均為 「美麗」之意,臺灣島在早期被歐洲稱為「福爾摩沙」,而臺灣海峽 則稱為「福爾摩沙海峽」,至19世紀清廷設置臺灣省以來,國際上逐 漸採用「臺灣」的稱呼。\n\n本展示以福爾摩沙稱呼臺灣。\n\n熱蘭遮城(Zeelandia):荷語zee是海的意思,land為陸地,所以 Zeelandia為「海陸之城」,因為熱蘭遮城當時是位於一沙洲上,面海 路交會之場域。 熱蘭遮城初稱「奧倫治城」,鄭成功病逝後普遍稱為「王城」,清代 又稱「台灣城」、「紅毛城」、或「磚城」,日據時期日人改稱「荷 蘭城」,現今則定名為「安平古堡」。","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619145552253_2820508198519102260.jpg"]},{"id":"reck7gplOKroQdDQ3","name":"緬甸字體巴利文貝葉經典》","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第4單元　經藏的流轉","period":"緬甸 / 西元19-20世紀","number":"故善025795〜025797、 故善025811〜025860、 故善025869〜025932","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"reck9Ws6KB4FkonsQ","name":"宋蔡襄書尺牘","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第二檔）","period":"","number":"故書000237N000000007","url":"","wiki":"","years":[{"id":"rec7cWNyAX3EyGlbO","name":"北宋"}],"exhibitions":[],"artists":[{"id":"recMNuwVEiUDhpMIv","name":"蔡襄（或蔡京）"}],"attachments":[]},{"id":"reckAzvpPWeJrxO3s","name":"麵包 The Bread","notes":"麵包 The Bread\n\n亞伯特·巴托洛美 ( 1848-1928) 1884,油彩、畫布\n\nAlbert BARTHOLOMÉ (French 1848-1928) 1884, Oil on canvas\n\n來自左上方窗户的光線照亮了婦人的面 容和手中的麵包,她憂愁地看著麵包, 並分食給孩子們。抱著聖孩的男童患精 會神地注視婦人手上的麵包,而後方的 男孩則專心地望著手中的麵包等待開 動。巴托洛美透過所營造出的抑鬱氛圍, 刻著勞動階級人民缺糧的愛感。","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619166600907_8884645769223188443.jpg","1619166609165_6830775248055925885.jpg"]},{"id":"reckBZYuw6Yyhgnq9","name":"民國曹容書淡江十詠之二","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第二檔）","period":"","number":"贈書000521N000000000","url":"","wiki":"","years":[],"exhibiti ","notes":"聖母子\n\nMadonna and Child\n\n西恩那畫派\n\n(義大利。十六世紀)\n\n年代不詳,蛋彩、金箔和木板\n\nSienese School\n\n(Sienese, 16th century)\n\nUndated, Tempera and gilding on panel\n\n西恩那畫派是指十三到十五世紀義大利 西恩那地區盛行的畫風,強調描繪奧祕 事件而不注重比例、時空的變化。此作 沿襲十五世紀早期的祈禱畫傳統,聖母 子的兩側分別站有聖人,畫面下方寫著 「神聖的貞女」,讚頌聖母無染原罪生 下耶穌的神蹟。","cat":"奇美博物館","details":["藝術廳","13至16 世紀:神性與人性"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619167124205_1130861895647433580.jpg","1619167133052_6915866036865768249.jpg"]},{"id":"reckYnN9ZOTdUlRUT","name":"","notes":"","cat":"奇美博物館","details":["羅丹"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619159560418_7333550586402679589.jpg"],"displayTitle":"羅丹｜待辨識紀錄（UlRUT）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"reckaQBxaOuhaVNjv","name":"清 乾隆六年\n洋彩番蓮紋紅地茶壺","notes":"清 乾隆六年\n洋彩番蓮紋紅地茶壺\n高 16.5公分 口徑 5.5公分 足徑 5.7公分\n直圓口，短頸，橢圓腹，底微斂，長曲流，弓形把，把內側上方一通氣孔，矮圈足微撇，帶圓紐拱形蓋，紐側及蓋內各有一相連通氣孔。器內及底全施湖綠釉，器外除頸、圈足外，通體於紫紅地上錐刻卷草紋，餘隙彩繪洋蓮四朵，頸飾螭龍二對，肩為如意紋一周，底邊蕉葉紋一周，圈足則飾黃地花卉圖案紋一周。蓋紐塗金，圍繞蓮瓣紋一周，蓋面畫轉枝花葉紋四朵。胎薄透光，壺底藍料書「乾隆年製」四字二行篆款，外加雙方框。茶鍾口微敞，深直壁，矮圈足，內底微凸。器內白釉無紋，外壁紫紅地上錐劃卷草紋，其上加飾彩繪番蓮花三朵。胎骨略重，底青花書「大清乾隆年製」六字三行篆款。這類直弧，深壁，口徑九公分左右的碗器，形制常於宮廷繪畫中出現，作為啜茗茶鍾。 此為清宮檔案中乾隆六年、七年製作的「乾隆款洋彩錦花紅地茶鍾」，另還有相同技法、敞口、口徑較大約十二公分的「乾隆款洋彩錦上添花紅地茶碗」。 \n\n此類紫紅地錐刻洋彩器，剔、畫工精密，不僅器內外滿施彩釉，壺蓋內及底部，甚至圈足、蓋圈足底部也全施金彩。雖然紋飾繁褥，但見錐、畫工序之講究。茶壺與與茶鍾紋飾極為接近，惟茶壺款識為料款；茶鍾則為六字青花篆款。","cat":"故宮","details":["東亞茶文化展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[{"id":"recTL4AlTXJe0JgVt","name":"清朝"}],"exhibitions":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}],"artists":[],"attachments":["Screenshot_20210424101257.jpg"]},{"id":"reckePrWvmTxbpZrC","name":"宋大觀聖作碑墨拓本　軸","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第一檔）","period":"","number":"購拓000421N000000000","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recklZMVjgFWN1eh0","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619145633239_3407937002738445512.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（N1eh0）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recklp9rw8YDw4JVV","name":"金剛怖畏","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第5單元　密教的神奇","period":"西藏 / 清（1644-1911） 西元18世紀","number":"贈銅000118 ","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"reckmJ4VQ7lvKoxMb","name":"音樂的寓意 English Title\tFour Allegories of Music","notes":"作品中文名稱\nChinese Title\t音樂的寓意\n作品英文名稱\nEnglish Title\tFour Allegories of Music\n作者中文姓名\nArtist (Chinese Name)\t翰思．馬卡\n作者原文姓名\nArtist\tHans MAKART\n國籍\nNationality\t奧地利\n生卒年\nArtist Dates\t1840-1884\n年代\nDate Made\t1871-1873\n材質\nMedium\t油彩、畫布\n尺寸\nDimensions\t504 x 450 公分\n典藏編號\nAccession Number\t0011124\n \n翰思‧馬卡（Hans Makart, 1840-1884）出生於薩爾茲堡（Salzburg），1859到1865年跟隨當時重要的歷史畫畫家馮‧皮洛第（Carl Theodor von Piloty, 1826-1886）接受訓練，並於1860年進入慕尼黑藝術學院，皮洛第對馬卡日後的創作有深遠影響；不同於皮洛第，馬卡的歷史畫主要為表達色彩的感性、輝煌而創，故其特別偏愛寓意性題材。\n\n馬卡的創作涵蓋不同的範疇如舞台設計、室內設計或服裝等領域，對當時的奧地利和德國有著重要的影響；本幅作品【音樂的寓意】即是馬卡為尼可拉斯‧頓巴（Nicholas Dumba, 1830-1900）的圖書室所設計的系列作品之一。\n\n1871年頓巴委託畫家馬卡為他的圖書室進行整體的裝飾與規劃。除了天井畫【音樂的寓意】之外，尚包含6幅鑲嵌於牆上的作品，分別以人物寓意畫的形式影射頓巴多方的興趣與家族事業如「貿易與工業」等題材。\n\n【音樂的寓意】，為一近正方形的面積，整體畫面藉由正方形的四個角，以透視法繪製出向上延伸的錐形柱區隔出四個畫面區塊，並將最終的視點聚焦於由四個小天使們環抱圍繞的圓形天體；由四錐形柱區隔的三角空間分別表現宗教性音樂、舞蹈音樂、軍樂及狩獵音樂。\n\n馬卡的設計可謂開啟了新式資產階級用來表現自身的全新概念及這一群人在文化上的自我認知；馬卡所設計的頓巴圖書室在十九世紀下葉成為資產階級室內裝飾的典範，並將其晉升為一備受讚頌的整體藝術（total work of art）創作。\n\n馬卡於1870年代在環道（Ringstrasse）所做的公共建築裝飾設計，決定了維也納十九世紀的文化風格，故又稱為馬卡風格（Makart style）；馬卡除了影響當時代的學院藝術和維也納上階層文化外，亦對後繼的畫家及裝飾設計者有多面向的啓發，其中最著名者為克林姆（Gustav Klimt, 1862-1918）和查茲卡（Hans Zatzka, 1859-1949）；克林姆在繪畫風格上深受馬卡的影響，強調畫面平面性、裝飾性特色，在對女性情慾感官的描繪同樣受到馬卡作品的啟發。(蔡敏玲)","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["CTCCC-CC00031-Si-001-i.jpg","1619164766547_3283394528549654356.jpg","1619169986627_1587381375135494966.jpg","16191700633 tions":[],"artists":[],"attachments":[]},{"id":"recmLZxUNH9kcRTNQ","name":"日本 桃山時代 信樂窯 一重口水罐","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"南購瓷000135 ","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recmYRROKb2SbJd8o","name":"白泥風爐","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"清末民初 工夫茶器一組","period":"","number":"研14(研究品) ","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recme2vXiQJeHKo8l","name":"","notes":"","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1618992735048_6122562266450024207.jpg"],"displayTitle":"玉言故事展｜待辨識紀錄（HKo8l）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recme90DCQvMc4M5S","name":"豐饒:大地的禮物 Abundantia: the Gifts of the Earth","notes":"豐饒:大地的禮物 Abundantia: the Gifts of the Earth\n\nHans MAKART\n\n翰思·馬卡\n\n(1840-1884)\n\n約1870,油彩、畫布\n\nco. 187.Olocamas\n\n【豐鎮:大地的禮物】是馬卡為霍的所豪宅(Palais Hoyos)用快室所設計的兩件作品之一, 霍的斯豪宅與執巴的居所城位於維也納中心環城大道(Ringgshasse)上,皆是卡自 1870年起所承接的室內設計案,奠定當時環城大道住所獨特的裝飾特色。 馬卡所設計的豐饒系列之作共有兩幅:【獄號:大地的禮物】和【網上大海的糖精、 展現大地與海洋的豐裕和多產,同時也暗示益投福著能的斯家族的富足與子孫興旺,這 兩件作品完成後便在維也納造成轟動,馬卡因而陸續製作不同版本的糖繞系列,目前藏 於奇美博物館的作品即為其中一個版本·直中的女子抱著孩子象微著其大地之母的身時, 環繞於四周的水果、花卉和動物都說明著大地的繁榮。","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619165075364_8062832958440782849.jpg","1619165093307_2219050056289892558.jpg"]},{"id":"recmhEVpYVuKhQbtD","name":"清\n高宗乾隆 行書七言絕句","notes":"清\n高宗乾隆 行書七言絕句\n清高宗(1711-1799)，名愛新覺羅弘曆。天賦聰穎，詩書畫無一不能，又兼富收藏。熱愛書法的乾隆在聽政餘暇，經常以寫字自娛，晉唐以來書家都是他學習的對象。\n乾隆最愛王羲之(303-361)〈快雪時晴帖〉，深受此帖書法風格所影響，偏好圓潤的用筆，線條雖然看似含蓄，卻蘊含書寫勁道，通篇寫來意態悠閒。","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第一檔）","period":"","number":"","url":"","wiki":"","years":[{"id":"recTL4AlTXJe0JgVt","name":"清朝"}],"exhibitions":[],"artists":[],"attachments":["Screenshot_20210424102742.jpg"]},{"id":"recmkkCwejdYLdU9e","name":"賽普爾人的潰敗 Defeat of the Cimbri","notes":"http://cm.chimeimuseum.org/wSite/ct?ctNode=307&mp=chimei&xItem=25729\n賽普爾人的潰敗 Defeat of the Cimbri\n\n亨利·菲利斯·艾曼紐·菲利波多 (法國,1815-1884)\n\n1855,油彩、畫布\n\nHenri Félix Emmanuel PHILIPPOTEAUX (French, 1815-1884) 1855, Oil on canvas\n\n西元前二世紀初,遷徙的賽普爾人因威 齊到羅馬領地而引發戰爭,當時羅馬帝 國壓倒性地戰勝賽普爾人。殘弱的塞普 爾人卻在此展現高揚的情緒,縱然敵方 的馬匹緊追在後,死殘的景象也傳達出 精疲力竭的戰況,但塞普爾人高昂的神 情卻好似永不止息的生命力。\n作品中文名稱\nChinese Title\t賽普爾人的潰敗\n作品英文名稱\nEnglish Title\tDefeat of the Cimbri\n作者中文姓名\nArtist (Chinese Name)\t亨利‧菲利斯‧艾曼紐‧菲利波多\n作者原文姓名\nArtist\tHenri Félix Emmanuel PHILIPPOTEAUX\n國籍\nNationality\t法國\n生卒年\nArtist Dates\t1815-1884\n年代\nDate Made\t1855\n材質\nMedium\t油彩、畫布\n典藏編號\nAccession Number\t0012450\n \n亨利‧菲利斯‧艾曼紐‧菲利波多（Henri Félix Emmanuel Philippoteaux, 1815-1884）為十九世紀的法國畫家，其一生創作的題材以戰爭歷史畫類為最多，並皆廣受當代好評。菲利波多由於青年時期受過學院藝術之訓練，擁有對人體與實物的高超描繪技巧。\n\n菲利波多的這幅畫作呈現一場黃昏時刻的沙場戰爭。前景可見眾多雜亂人群向前行進，馬、犬、牛隻混雜其中。在地面上躺著許多死傷的裸體嬰孩與上半身裸露的年輕男女。牛車乘載多位半裸上身的女人，她們手持武器作出備戰姿勢。其餘多為老人，身披長袍潦倒坐於車內。在後方可見沙煙瀰漫於山脈之間，煙霧底下湧進一支精壯的軍隊，每位兵士皆著盔甲，前方將士更是身披紅色戰袍驍勇騎於馬上，所有戰士手持武器高舉於空，朝前方敵人邁進。\n\n畫作中央的半裸女子為此圖的焦點，她站在中央的牛車內，處於最高位置，右手持斧頭高舉在空中，左腳踏在牛車之上，一如指揮者的邁進姿勢。此畫描繪羅馬人與賽普爾人對戰的歷史，西元前二世紀初，賽普爾人向西南邊的大遷徙威脅到羅馬人之領地，於是雙方開戰。由於當時羅馬共和國之強盛使他們壓倒性地戰勝賽普爾人，使之潰敗逃亡。然而在作者筆下殘弱的塞普爾人卻持續著高揚的應戰情緒，縱然敵方的馬匹已緊追在後，且死殘的景象與黃昏的氛圍都傳達出早該精疲力竭的戰況，此部落之生命力卻好似永不止息。作者的構圖張力與人物情緒將眾多情感帶給觀者，使觀者如身歷其境般感染此戰役的緊張氛圍，並反映出十九世紀浪漫主義強調情感傳遞之特點。(陳歆梅)","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["CTCCC-CC00525-Si-001-i.jpg","1619164705494_6406220685557633477.jpg","1619164718834_6078327017851625010.jpg"]},{"id":"recmnKDyBo99xJcCD","name":"","notes":"","cat":"奇美博物館","details":["藝術修復"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619161504478_3663425221475971299.jpg"],"displayTitle":"藝術修復｜待辨識紀錄（xJcCD）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recmuaheprbBpFIFu","name":"14明鄭時期","notes":"","cat":"安平古堡","details
