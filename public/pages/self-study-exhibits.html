r":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619164311081_1690391812403307325.jpg","1619164323716_185537425636353321.jpg"],"displayTitle":"藝術修復｜待辨識紀錄（y1IIZ）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recnUOMGZGDXjVXRn","name":"西周早期\n獸紋簋","notes":"西周早期\n獸紋簋\n此簋腹壁上的複合獸極具特色，可見兩獸相對，口部大張，露出上下交錯的立體獠牙。獸身以蝸殼為主要特徵，再配上觸角、浮凸的大眼、長卷鼻，以及四趾利爪，充滿想像力和神秘性。","cat":"故宮","details":["青銅饗宴：古代的禮儀與樂曲"],"sub":"","period":"","number":"","url":"","wiki":"","years":[{"id":"recwR1PHYemP0Fomt","name":"西周"}],"exhibitions":[],"artists":[],"attachments":["20200521163124860872.jpg"]},{"id":"recnVkQs6AYigTRbt","name":"木方香盒","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"南購雜000022","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recnXya454iCubjvT","name":"余承堯（1898-1993），〈山水之一〉，1983","notes":"余承堯（1898-1993），〈山水之一〉，1983，\r\n彩墨、紙，45×34 公分。\r\nYu Cheng-Yao (1898-1993), Landscape I, 1983, \r\ncolored ink on paper, 45×34 cm.","cat":"國美館","details":["海外存珍"],"sub":"甲、蓊鬱─百歲前輩典範","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["Screenshot_20210424232914.jpg"]},{"id":"recnZyWzwNIt5ENCz","name":"1644-1911年國寶","notes":"","cat":"故宮","details":["人氣國寶展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619244908462_3594205793994657835.jpg","1619244917782_1595202101865857817.jpg","1619244925837_4354877530058628092.jpg","1619244934866_6535046012131085853.jpg","1619244949328_8842652445662457075.jpg","1619244959375_8718254236488579374.jpg","1619244968712_2918945543180182329.jpg","1619244978125_1549551790454259761.jpg","1619244993710_1501288305803987418.jpg","1619245001715_5801412904400160458.jpg"]},{"id":"recnm8Zt3XbszRJas","name":"皇帝的多寶格","notes":"皇帝的多寶格\n720°VR 線上展覽：皇帝的多寶格\n故宮南院《皇帝的多寶格》本次展出619件組珍奇古玩， 箱匣中的寶物有哪些，皇帝又如何收藏歸納與陳設?! \nhttps://www.ner.gov.tw/program/5a83f4eac5fd8a01e2df012e/5e588f19c6cfac00068aedeb\n\nhttps://vrsouth.npm.gov.tw/\n所謂多寶格可以理解成是一種文物的組合，而「皇帝的多寶格」展顧名思義展出清宮傳世經過皇帝降旨處理過的一組組文物。雖然聚集文物使之成組的舉措，並非帝王專利。但是由於國立故宮博物院藏品的組成，有一大部分來自於清宮舊藏，且其中充滿著歷代皇帝的鑑賞痕跡，同時對照造辦處檔案紀錄，也得以追溯出多數文物群重裝、成組於乾隆朝。故展覽又將聚焦於乾隆皇帝（1736-1795），看他如何在前朝既有的文物整理與組裝基礎上，進一步發揮創意讓清宮文物的收納與陳設顯得更為井然有序。\n \n從收納方式與藏品特色出發，可將展覽分成三個單元。第一單元「收納古玩」展出雍正朝（1722-1735）聚組成形的官窯瓷器收藏，以及與之類似的依照質材分類，經由乾隆皇降旨包裝、命名的銅、瓷器組合。第二單元「開箱趣味」主要透過七件不同樣式的箱匣，以開箱概念重現盒內的原裝樣態，讓大家理解皇帝寶物的來源遠遠超越古今中外的限制，同時專門設計的藏寶箱在盒屜相套和明屜與暗屜多層次交錯規劃中，完現地表最強的收納藝術。第三單元「藏物格架」則嘗試藉由兩份清單，重建紫禁城養心殿中的兩組多寶格文物，說明清宮製造多寶格的緣由與目的。\n\n\n\n收納古玩\n \n收納古玩包含聚集和分類兩個面向。通過清宮檔案得知聚集文物使之成組，無論做為陳設或裝匣貯存，在康熙皇帝時代（1662-1722）已經出現﹔至雍正朝也看得到皇帝經常降旨製作各種匣盒收納古玩。至於具體依材質進行分類、裝匣，雖然目前未見明文載錄的起始點，但從實物可以追溯出十八世紀雍乾時期確已具備此類收納樣態。相較於康熙和雍正兩位皇帝，乾隆皇帝更進一步發揮才情，引經據典吟詠清宮琳瑯滿目的收藏，同時也積極考證校異，展現個人博覽古今、識別文物的能力。在以古為貴前提下，一方面運用現代文保概念，重新包裝前朝文物為不同組別命名，另一方面亦聚集銅、瓷器古玩，隨附手繪本，加以裝匣，盡現文人藏家之集古雅興。\n\n\n開箱趣味\n \n在清宮檔案中被稱為「百什件」，到了國立故宮博物院則被叫做「多寶格」，這種將各式小古玩貯放於箱匣內的有趣陳設與裝置，在有限空間中放入許多古玩，因此匣盒的設計與製作，都是極盡巧思且引人入勝。選展七件乾隆時期之「百什件」為代表，呈現箱、盒、櫃甚至外出用小桌等外觀不同的百什件，可看到從外箱的選擇或製作，在材質與造型上結合，根據外觀不同再處理內部空間，工匠如同空間魔法師般，在固定的空間中，想方設法收貯各種材質且造型各異的古玩物件，於是區隔出為各式古玩量身訂作或上或下、或左或右內部空間，還有各種座架運用，以及大小不同之明、暗屜，甚至盒中有物的收貯。除了放置妥適外，更有尋寶的樂趣。進入層層疊疊的空間中，在驚呼聲或歡笑聲中找出一件又一件精巧的古玩，是玩賞「百什件」中最令人愉悅的過程，更是對這些巧手工匠的致敬。\n\n\n藏物格架\n \n在這個展區，我們嘗試復原兩組多寶格。首先，根據清室善後委員會清點紫禁城宮殿的紀錄，發現兩組展出的文物均登錄於「多寶格」項下，其次對照嘉慶年間（1802）的陳設檔，而能對照出其中一組文物原來隸屬養心殿前殿東暖閣內的博古格﹔另一組則裝置於養心殿後殿的左面牆。\n由此回溯乾隆皇帝對清宮各式古玩、時作和異國奇珍的整理、分類與收納，而可綜整出因遭遇文物時間有早晚之別，故讓他降旨經手管理的貯存、包裝和組合也存在各種不同的樣貌。但是，通過展覽的梳理，毫無疑問能夠得出多寶格堪稱是一種以格架貯存、陳列文物的方式。特別因為養心殿是乾隆皇帝日常處理政務和起居休閒的場所，因此陳設其中的文物，不僅烙印有鑑識痕跡，亦不乏數百年前即被追蹤、關注的珍稀寶物。","cat":"故宮","details":["皇帝的多寶格"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["Screenshot_20210424104319.jpg","皇帝的多寶格__展件清單(1).pdf"]},{"id":"recnxpV3j1R9Y4Fig","name":"聖馬丁與乞丐 Saint Martin and the Beggar","notes":"聖馬丁與乞丐 Saint Martin and the Beggar\n\n103\n\n艾爾·葛雷柯和工作坊 ( 1541-1614) 1599年後,油彩、畫布\n\nEI GRECO and workshop (Greek, 1541-1614) After 1599, Oil on canvas\n\n四世紀的一個冬日,聖馬丁遇到一位受 凍的乞丐,便將自己的斗篷割予他。當 晚耶穌基督便穿著那片斗篷,在夢裡對 圍繞著祂的天使讚揚聖馬丁的善行,讓 聖馬丁成為信徒眼中「仁慈」的象徵,甚 雷柯誇張變形的人物形象,以及鮮明豐 富的色彩皆體現出他專有的獨特風格。","cat":"奇美博物館","details":["藝術廳","13至16 世紀:神性與人性"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619167343270_8286647935157725132.jpg","1619167352354_1895015993973558019.jpg"]},{"id":"recoM59VvLXJHPQPA","name":"唐 歐陽詢 書般若波羅密多心經","notes":"唐 歐陽詢 書般若波羅密多心經\n\n歐陽詢(557-641),字信本,潭州臨湘\n\n人。楷書宏整遒勁,森嚴肅穆,世稱「歐體」。 《心經》全文二百六十字,為佛教著名經 典之一。本幅書體為小楷,用筆精謹,結體 端正。 然據落款可知成書時間在貞觀九年 (635),是年〈心經〉譯者玄奘(602-664)在印 度那爛陀寺修習佛法,尚未返唐,應為後人 偽託之作。","cat":"故宮","details":["筆墨見真章"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1620454621424_5525713187747142967.jpg","1620454633009_6167556829769673668.jpg","1620454643655_6179192462580847422.jpg","1620455566138_8621790435491565286.jpg"]},{"id":"recoQ943hZLYOCvzk","name":"展覽概述","notes":"展覽概述\n  中國青銅時代開始於夏代晚期（約西元前十七世紀初），歷經商、西周、至東周，前後一千五百年左右。秦、漢以後鐵器興起，但銅器仍沿用不替。\n\n  珍貴的青銅鑄器只有貴族才能使用，所謂「國之大事，在祀與戎」，青銅除了部分用來鑄造兵器、樂器外，主要鑄成祭祀容器，以盛裝祭品、獻祭祖先，祈求家族生命之綿延不絕；而經由祀典中禮器陳設的多寡，也突顯了貴族的身分與階級。銅器，是構成商周貴族社會中最重要的禮器。\n\n  商周時代（1600-220 B.C.E.）是中華文化建構的重要時代。政治上，由政權與神權合一，轉為禮教和人文意識之覺醒；物質上，青銅冶鑄的發達，開啟了禮兵器用的新紀元；工藝技術的突破，促成了百業的勃興；精神上，將國之大事的「祀」與「戎」，透過銅器的造型與紋飾，寄託對天神祖先的敬畏和心靈的溝通，也經由「銘文」的鑄刻，實錄了當時祭饗、征伐、賞賜、冊命等場景。\n\n  青銅文明，在鐘鼎彝器的「禮與樂」中讚揚；在立功祭祖的「祀與戎」中頌讚，在周人範鑄紀銘的「其命維新」與「郁郁周文」裡娓娓訴說；歷經東周繁華絢麗的新階段；到秦漢的統一，銅器雖逐步退出禮制的中心，卻轉化成為一種典型，更加的深入思想、文化的底蘊，而中華文化之美，即深藏在此一器一物之間，致廣大而盡精微，極高明而道中庸。","cat":"故宮","details":["吉金耀采—院藏銅器精華展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["Screenshot_20210426093201.jpg"]},{"id":"recocMxYWhBxcTi85","name":"玉壁\n\n新石器時代","notes":"","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1618993284922_4383353417345104590.jpg"]},{"id":"recp5azKHu7S6EzJb","name":"金剛手菩薩","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第5單元　密教的神奇","period":"喀什米爾 / 西元8世紀","number":"贈銅000052","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recp6PcNMtFVMYL0e","name":"歷史時代治玉技術","notes":"歷史時代治玉技術\n\nJade treatment techniques throughout history\n\n史前時代的治玉技術須從遺址出土遺留進行推測,而中國歷史時代則有 將治玉技術的步驟依序以圖像方式記錄下來,如明宋應星天工開物,琢 玉圖《天工開物·琢玉圖》,清朝李澄淵《玉作圖》,這些圖像紀錄技 術工法外,也將相關設備材料一一詳實記載,可做為史前治玉技術的推 論參考,也是近代治玉技法演進的良好基礎。","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1618993654563_1969545016361421079.jpg","1618993664295_3794705069899664325.jpg","1618993672758_3762495285869739728.jpg","1618993679708_4478023444353526229.jpg","1618993691470_9001035311494019181.jpg","1618993702620_3983020265489824701.jpg","1618993712509_8509021529997193411.jpg","1618993722632_4296073292292607416.jpg","1618993732376_1549417207057628346.jpg","1618993743220_629178468877410562.jpg","1618993753618_2822220373783483203.jpg","1618993764358_6755652462364593136.jpg"]},{"id":"recp9R8ZzqYIaFmyD","name":"","notes":"","cat":"奇美博物館","details":["17至18世紀：宮廷與市井"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619168733863_2600795314339373026.jpg","1619168742666_923932515819566526.jpg"],"displayTitle":"17至18世紀：宮廷與市井｜待辨識紀錄（aFmyD）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recpBB1ZX9vylonMU","name":"09荷蘭東印度公司時期","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619149235459_3058518762571977139.jpg","1619149252352_7502566635468718680.jpg"]},{"id":"recpCOAc30friGt3K","name":"清王文治行書　軸","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第一檔）","period":"","number":"購書000945N000000000","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recpNRQfvA8VewUme","name":"","notes":"","cat":"北美館","details":["塩田千春：顫動的靈魂"],"sub":"","period":"","number":"","url" umber":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["Screenshot_20210424232957.jpg"]},{"id":"recq5E066ci70KC1F","name":"明 永樂 甜白暗花葵花式茶鍾","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—明人雅集","period":"故瓷017643","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recq9ETUXmdqQeGfO","name":"北宋\n汝窯青瓷無紋水仙盆","notes":"北宋\n汝窯青瓷無紋水仙盆\n這件水仙盆全器無一絲開片，幾近完美的程度令人聯想起明人曹昭《格古要論》「有蟹爪紋者真，無紋者尤好」的相關描述，可將之視為是1459年以來，即備受人們追蹤、關注的明星展件。到了十八世紀，無紋水仙盆成為乾隆皇帝的收藏品，皇帝品鑑之餘做了兩件事使之從此改頭換面。其中一件是在器底雕琢一首「猧食盆」御製詩。透過詩文分享了他認為這件作品是宋朝的官窯，可是一些人卻告訴他，這樣的器型很像唐朝皇宮使用的貓食盒。第二件是請皇家作坊的工匠為水仙盆特製一個帶抽屜的木座，然後把一本臨摹宋元名家的習作放在裡面，有一種將個人手記和經典宋瓷同時並藏的含意。","cat":"故宮","details":["皇帝的多寶格"],"sub":"","period":"","number":"","url":"","wiki":"","years":[{"id":"rec7cWNyAX3EyGlbO","name":"北宋"}],"exhibitions":[],"artists":[],"attachments":["20200513144921590857.jpg"]},{"id":"recqFVVTbEAFXDr1y","name":"閃玉項鏈","notes":"","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1618994424093_8240669910130883705.jpg"]},{"id":"recqFdbNNUuUmLRcn","name":"清 乾隆 洋彩番蓮紋藍地方壺","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—清代品茗","period":"","number":"中瓷003318","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recqbHwiYmBz3gMUe","name":"聖母子坐像\n\nMadonna Enthroned","notes":"聖母子坐像\n\nMadonna Enthroned\n\n西班牙學派\n\n十四世紀末\n\n木質彩繪\n\n「聖母子」的圖像傳統悠遠流長。西元五世紀以 弗所會議確立聖母地位後,聖母圖像逐漸增加。 在這些圖像中,聖子都會伴隨著瑪利亞出現,以 凸顯她為「天主之母」的身分。本作的聖母戴冠 冕、披金色披風,顯得神聖尊榮,而身穿紫袍的 小耶穌則暗示著其君王身分。","cat":"奇美博物館","details":["藝術廳","13至16 世紀:神性與人性"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619167004893_5193807438594679688.jpg","1619167016229_9094501497341550649.jpg"]},{"id":"recqqyy8tpXk7cYBc","name":"清梁啟超楷書八言聯　軸","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第一檔）","period":"","number":"贈書000390N000000000","url":"http://chinapalacemuseum.com/%E6%B8%85%E6%A2%81%E5%95%9F%E8%B6%85%E6%A5%B7%E6%9B%B8%E5%85%AB%E8%A8%80%E8%81%AF_%E8%BB%B8_%E8%B4%88-%E6%9B%B8-000390-00000/","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recr2dWqOHdyTIEfd","name":"普通閃玉飾品","notes":"","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1618994413647_5505176082567509601.jpg"]},{"id":"recr9Yfutnt3jugeb","name":"坐佛","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第2單元　佛陀的智慧","period":"印尼爪哇 / 中爪哇時期 西元9-10世紀","number":"贈銅000105 ","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recrB7mKHTFGboFNZ","name":"清 雍正窯 茶葉末茶壺","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—清代品茗","period":"","number":"中瓷005112","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recrD9E62JZdzR9Se","name":"","notes":"","cat":"奇美博物館","details":["羅丹"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619169722485_7557881230928030784.jpg","1619169765139_4951547816346700442.jpg"],"displayTitle":"羅丹｜待辨識紀錄（zR9Se）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recrFocO4fWmHbzxM","name":"清末民初\n工夫茶器一組","notes":"清末民初\n工夫茶器一組\n白泥風爐（高21.6公分 口徑14.0公分 底徑12.8公分）\n​白泥風爐（高21.6公分 口徑14.0公分 底徑12.8公分）；白泥單柄壺（高7.5公分 口徑6.8公分 底徑8.0公分）；宜興窯朱泥壺（寬9.8公分 高9.8公分 口徑3.7公分 足徑3.4公分）；青花花卉紋茶杯一組四件（高3.0 公分 口徑5.0公分 足徑2.5公分）；青花萊菔紋茶盤（高3.8公分 口徑16.8公分 底徑13.0公分）\n\n整組為後配茶器：包含白泥風爐、白泥側把燒水壺、朱泥茶壺、青花花卉紋四小茶杯及青花茶池（亦稱茶船）等共五項茶器。此為清代以來閩粵地區常見的基本工夫茶器組合，清中葉閩粵工夫茶普遍使用所謂「潮汕四寶」茶器，亦稱「烏龍茶四寶」或「四寶茶器」 ，四寶為潮汕風爐、玉書煨、孟臣壺、若深杯等四種茶器。前兩器為燒煮湯水用器，後二器則為泡飲茶器。\n白泥風爐與單柄側把燒水壺乃潮汕工夫茶器中的特有造型，不僅流行於閩粵，亦外銷東南亞，十九世紀初外銷至日本後，至今仍是日本煎茶道最為普遍使用的茶器。兩器為近代作品，白泥玉書煨燒水壺胎薄，側把內中空，把下印「昌平」、 「寶山」款識；白泥風爐通風口呈鏤空卍字形，外圍菱形花邊，其上刻「百事如意」為十八世紀以後外銷日本煎茶道具上常見造型。\n朱泥梨形小壺，彎流曲把，平底內凹，底刻「龍溪魏梓敬珍藏」二行楷款。全器胎泥細膩，器面均帶微小突起砂質顆粒，即愛壺家所謂梨皮泥壺。\n小型茶壺為閩南、潮汕一帶喜用來泡飲烏龍茶工夫茶的重要茶器，此壺應為閩南龍溪魏姓愛茶者所持。這類略高的梨形小壺又稱「思亭壺」，傳為清初陸思亭（生卒不詳）所創，長久以來也是晚清工夫茶壺中常見的造型之一。\n青花茶盤通常作為燙壺與燙杯保溫或盛杯之用，盤以青花描繪萊菔（蘿蔔菜葉）紋。四小青花茶杯，外壁畫花卉紋，口沿鑲金，底青花書「錦福堂記」，常見於清末民初外銷泰國茶器。","cat":"故宮","details":["東亞茶文化展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[{"id":"recTL4AlTXJe0JgVt","name":"清朝"}],"exhibitions":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}],"artists":[],"attachments":["Screenshot_20210424101045.jpg"]},{"id":"recrG9U5rPjHLkqM0","name":"藏文《甘珠爾大藏》","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第4單元　經藏的流轉","period":"清乾隆35年（1770）內府泥金寫本","number":"故藏000111〜000122","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619246142235_2205918617844926514.jpg","1619246153532_1703194027767718590.jpg","1619246166101_3754026438683768736.jpg"]},{"id":"recrKUtkdvoFLfOEB","name":"清 翠玉奶茶碗","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"蒙藏奶茶","period":"","number":"故玉000968","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recrKrWUPAnMlX9Fm","name":"郭雪湖 (1908-2012)，〈月下美人〉","notes":"郭雪湖 (1908-2012)，〈月下美人〉，1945，\r\n膠彩、絹，43.2×49.3 公分。\r\nKuo Hsueh-Hu (1908-2012), Beauty Under the Moonlight, \r\n1945, gouache on silk, 43.2 × 49.3 cm.","cat":"國美館","details":["海外存珍"],"sub":"甲、蓊鬱─百歲前輩典範","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["Screenshot_20210424233638.jpg"]},{"id":"recrL4HKz2LqI7vYx","name":"","notes":"","cat":"奇美博物館","details":["羅丹"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619160480262_4279722025908118451.jpg","1619160491003_6449740353857123320.jpg"],"displayTitle":"羅丹｜待辨識紀錄（I7vYx）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recrQVozqVsPlS1xc","name":"16日治時期","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619149578436_1855907005077984005.jpg","1619149590612_3870913926770482053.jpg"]},{"id":"recrSNBKK03fY4qms","name":"立佛","notes "notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第2單元　佛陀的智慧","period":"吉林省半拉城遺址出土 / 北朝(420-589) 西元6世紀","number":"中日雕000009","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recsKcWNavOTfziNR","name":"","notes":"","cat":"奇美博物館","details":["羅丹"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619159336751_7513951731728265230.jpg","1619159352405_7885569548417766277.jpg"],"displayTitle":"羅丹｜待辨識紀錄（fziNR）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recsO7quuYxirj0vN","name":"","notes":"","cat":"奇美博物館","details":["羅丹"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619169735555_4100188092844257926.jpg"],"displayTitle":"羅丹｜待辨識紀錄（rj0vN）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recsUkHuUJkaUY4pz","name":"立佛","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第2單元　佛陀的智慧","period":"北齊（550-577） 西元6世紀中葉","number":"贈雜000186","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619242960847_8447466013200599801.jpg","1619242974219_5628001563046310255.jpg"]},{"id":"recsWMjbG7tSwRQ0y","name":"","notes":"","cat":"北美館","details":["大遷徙：盧明德"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1620472244531_2097449357906647198.jpg"],"displayTitle":"大遷徙：盧明德｜待辨識紀錄（wRQ0y）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recsjoMshp8lCBFB7","name":"宋錢選畫盧仝烹茶圖　軸","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—唐風宋韻","period":"","number":"故畫000130","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recspcSSJYomVvKS6","name":"明太祖御筆（二）　冊　七言詩","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第一檔）","period":"","number":"中書000015N000000035","url":"","wiki":"","years":[{"id":"recj9BkloPzQZSvTC","name":"明朝"}],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recsxTpc3gXFsOQO4","name":"「天子須嘗陽羨茶」桐器局","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"南購雜000015 ","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rect1PmDdCigLTZhE","name":"日本 江戶時代 狩野探幽 二十四孝圖 軸","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"南購畫000102","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rect6x0wHFAx8kq4P","name":"塩田千春：顫動的靈魂","notes":"塩田千春：顫動的靈魂\n2021.05.01-2021.08.29\n \n「塩田千春：顫動的靈魂」是以柏林為據點、現今活躍於世界舞台的藝術家塩田千春舉辦迄今規模最大的個展。此次展出作品共計一百多件，從90年代的早期創作直到近期，除了大型裝置之外，另外包括雕塑、行為藝術錄像、攝影、素描，以及舞台設計相關圖稿，全面性介紹她橫跨二十五年的藝術生涯。\n\n其中，由紅線或黑線交纏而成、鋪天蓋地貫串整個空間的大型裝置，可以說是塩田的代表系列。千絲萬縷勾勒出無法計數的線條，不僅暗指各式各樣的事物與錯綜複雜的連結，同時也在召喚我們思索存在的奧義。這些作品的底蘊，來自藝術家始終關注的生與死，以及一個根本的提問：我們生命中究竟要追求什麼，又要去向何處？\n\n展覽副標名為「顫動的靈魂」，精確點出藝術家無法言喻的內心衝擊，以及她希冀傳達這份洶湧感受的渴望。鑒於今日一切變化十分急速，價值體系也正不斷遞嬗，整個社會賴以安身的堅實觀點似乎已然消失，我們相信，藉由塩田作品的深刻、敏銳，及其本質上引發共鳴的特性，本次展出必定能在我們回望這個世界之際，提供一股不可或缺的省思力量。","cat":"北美館","details":["塩田千春：顫動的靈魂"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["Screenshot_20210508183239.jpg","1620470234117_5222331999771804781.jpg","1620470248878_4781024265266460218.jpg"]},{"id":"rect7JNYEQ2MeC0fU","name":"誕生佛","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第1單元　誕生的喜悅","period":"明天啟4年（1624）","number":"贈銅000219","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619242463065_6773136731779948307.jpg","1619242479725_4556985599985983794.jpg"]},{"id":"rectJ55nwQgjAxv8n","name":"清 銀貼鏤金龍紋把壺 一對","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"蒙藏奶茶","period":"","number":"中雜000098 中雜000099","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rectOPNgF061BMjLU","name":"","notes":"","cat":"奇美博物館","details":["藝術修復"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619161564413_123092524364045393.jpg"],"displayTitle":"藝術修復｜待辨識紀錄（BMjLU）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"rectTTiXLPxhdQzEE","name":"洪瑞麟（1912-1996），〈礦工頌〉","notes":"洪瑞麟（1912-1996），〈礦工頌〉，1960，\r\n油彩、畫布，65.2×91 公分。\r\nHung Rui-Lin (1912-1996), Ode of the Miners, \r\n1960, oil on canvas, 65.2 × 91 cm.","cat":"國美館","details":["海外存珍"],"sub":"甲、蓊鬱─百歲前輩典範","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["Screenshot_20210424233727.jpg"]},{"id":"rectUGowyMyyHUvxT","name":"日本 桃山時代 美濃窯 志野卷草紋香盒","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"南購瓷000133","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"rectWCYTVHYB4quvK","name":"19世紀沙龍廳","notes":"19世紀沙龍廳\n\n沙龍(Salon)是歐洲上流社會聚會的一種方式,始於養大 利文藝復興時期,流行於17,18世紀,但盛行於19世纪。 沙龍的主人常為女性,並擁有良好的教育背景,在沙龍裏可 談論文學、藝術、音樂、戲劇及最新時事等議題,成為上流 社會互相交流資訊和結識朋友的場所。沙龍主人對沙龍應的 佈置十分講究,為了再現沙龍華嚴樣貌,本展特麗一展廳模 擬當時擺設。","cat":"奇美博物館","details":["藝術廳","19世紀沙龍廳"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619165315291_1058649052493975877.jpg","1619165300421_84138572168144957.jpg","1619165323925_6438209111369458608.jpg","1619165335551_8000013089051614214.jpg"]},{"id":"rectZWg34GBticXhk","name":"","notes":"","cat":"北美館","details":["塩田千春：顫動的靈魂"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1620471425854_461628892096600790.jpg","1620471438220_6211356577452480168.jpg","1620471456302_5082481742232673884.jpg"],"displayTitle":"塩田千春：顫動的靈魂｜待辨識紀錄（icXhk）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"rectZeIeg6Ii3AJwr","name":"石川欽一郎（1871-1945），〈木曾之山村（日本）〉","notes":"石川欽一郎（1871-1945），〈木曾之山村（日本）〉，\r\n創作年不詳，水彩、紙，24×33.3公分。\r\nIshikawa Kinichiro (1871-1945), \r\nKiso Mountain Village (Japan), date unknown, \r\nwatercolor on paper, 24 × 33.3 cm.","cat":"國美館","details":["海外存珍"],"sub":"甲、蓊鬱─百歲前輩典範","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["石川欽一郎_〈木曾之山村（ 作曾是美國費城觀 光手冊的重要參訪景點。","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619166745708_5055848504437402566.jpg","1619166764851_2598027004504088993.jpg"]},{"id":"recttXyCIzTKme3yQ","name":"普通閃玉 壽豐","notes":"","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1618993611947_1343219947904973054.jpg","1618993625465_3767694005226117607.jpg"]},{"id":"recu30aIjN6FEtVtm","name":"宋蘇軾書跋語 ","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第二檔）","period":"","number":"故書000237N000000001","url":"","wiki":"","years":[{"id":"rec7cWNyAX3EyGlbO","name":"北宋"}],"exhibitions":[],"artists":[{"id":"recAAdv6K4ajkMoFP","name":"蘇軾"}],"attachments":[]},{"id":"recu5S8kdtUcAmcPM","name":"觀音菩薩","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第3單元　菩薩的慈悲","period":"明（1368-1644）西元16-17世紀","number":"贈銅000205","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619247257503_3409593938233090704.jpg","1619247267635_5538946885049890686.jpg"]},{"id":"recu6cFMToatJYF1t","name":"宋米芾清和帖 ","notes":"https://digitalarchive.npm.gov.tw/Painting/Content?pid=22810&Dept=P\n芾啟。久違傾仰。夏序清和。起居何如。衰年趍召。不得久留。伏惟珍愛。米一斛。將微意。輕尠悚仄。餘惟加愛。加愛。芾頓首。竇先生侍右。\n米芾《清和帖》，亦稱《致竇先生尺牘》\n\n米芾《清和帖》，約書於北宋徽宗崇寧二年（1103年）五月。此帖曾經項子京、笪重光等人收藏。此帖為行書，共八行，縱28.3厘米，橫38.5厘米，台北故宮博物院藏。\n\n《清和帖》是米芾寫給友人竇先生的一封信，應是晚年的友人。信中提到與竇先生很久未見，表達傾慕敬仰之意。米芾並藉由描述夏初氣候，詢問對方起居生活如何？他接著自述年事衰老，卻必須赴任官職，因此不能久留，恭敬地希望對方保重。當時米芾正準備前往汴京（河南開封）接任書畫學博士。信中內容雖然簡單，卻表現了即將接下官職的心情。\n\n米芾能接掌書畫學博士，是由於蔡京的推薦。米芾比蔡京小四歲，兩人很早就已認識。當時的蔡京並非政壇的權力核心，蔡京甚至在1101年還曾想投靠在真州任官的米芾。不過，蔡京之後在官場迅速竄紅，而米芾之所以能擔任書畫博士的官職，或許正是因為蔡京的大力拔擢所致，然而，兩人的友誼卻變質為依附權位的交往，無法回復到早年單純的友誼關係了。\n\n「清和帖」是米芾的精品之一，寫的瀟灑超逸，不激不勵，用筆比較含蓄，與其它帖比較，溫和了許多，但筆劃的輕重時有對比，字的造型欹側變化，又使此帖平添了幾分俊邁之氣。\n\n\n\n原文網址：https://read01.com/6GJK347.html","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第二檔）","period":"","number":"故書000237N000000005","url":"https://catalog.digitalarchives.tw/item/00/11/12/8b.html","wiki":"","years":[{"id":"rec7cWNyAX3EyGlbO","name":"北宋"}],"exhibitions":[],"artists":[{"id":"recQOjWuhbIRGVPym","name":"米芾"}],"attachments":["f0.jpg","0.jpeg"]},{"id":"recuDWwV7dk4yc4aa","name":"明 嘉靖 青花雲龍紋梨形壺","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—明人雅集","period":"","number":"故瓷000046","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recuFxJmt32Tdoq6k","name":"明 文徵明 書太上老君說常清靜經","notes":"明 文徵明 書太上老君說常清靜經\n　　文徵明（1470-1559），長洲人，名壁。詩文書畫並佳，與沈周（1427-1509）、唐寅（1470-1524）、仇英（約1482-1559）並稱「明四大家」。\n\n　　〈常清靜經〉為道教重要經典教義之一，全文三百九十一字，上章言好清靜則得道，下章勸戒勿因貪求而獲煩惱，沉淪苦海，最終迷失真道。本幅用筆勁健爽利，間架明整開闊，可見文氏小楷風格逐漸確立成形，時年四十二。","cat":"故宮","details":["筆墨見真章"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["Screenshot_20210508135650.jpg","Screenshot_20210508135703.jpg","Screenshot_20210508135717.jpg","1620454663912_7475229305646975875.jpg","1620454674290_1960817054907623308.jpg","1620454696945_210373306970868823.jpg","1620454724111_5609815962803003834.jpg","1620455539040_3210445943393212347.jpg"]},{"id":"recuNQcv37RDbj5TH","name":"清 如意紋漆方盤","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"南購漆000049","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recuSM4YMixjRxfTC","name":"坐佛","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第2單元　佛陀的智慧","period":"東魏(534-550)","number":"贈銅000135","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619242887713_1769683139283005855.jpg","1619242898592_5648247276772626022.jpg"]},{"id":"recuVYhGJHiYb8mlE","name":"在以馬忤斯的晚餐 The Supper at Emmaus","notes":"在以馬忤斯的晚餐 The Supper at Emmaus\n\n吉諾拉莫·達·龐特,亦稱巴薩諾\n\n(義大利,1566-1621)\n\n年代不詳,油彩、畫布\n\nGerolamo da PONTE, called Bassano\n\n(Italian. 1566-1621)\n\nUndated, Oil on canvas\n\n巴薩諾家族泛指十六、十七世紀在威尼 斯及威尼托等地的義大利吉家家族。本 作取自《聖經》,兩位前往以馬忤斯的信 徒未認出眼前的是復活的耶穌,直到用 餐時耶穌分開麵包,兩位信徒才認出 他。左側的廚房景象結合右側耶穌與信 徒們的用餐景象,強調世俗與宗教教義 的扣合。","cat":"奇美博物館","details":["藝術廳","13至16 世紀:神性與人性"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619167745891_555390209461436081.jpg","1619167753898_3933027596108649643.jpg"]},{"id":"recuXSbg6zT3PxuIU","name":"尼可拉·莫林的夫人半身像 Bust of Nicolo Molin's Wife","notes":"尼可拉·莫林的夫人半身像 Bust of Nicolo Molin's Wife\n\n西莫尼·班可\n\n(姜大利·1480/90-1553)\n\n約1540年\n\n大理石\n\n班可是義大利文藝復興盛期的藝術家,作品具有 自古希臘羅馬以來的古典美感,曾獲得當時著名 藝術家瓦薩利的稱讚。莫林夫人是當時威尼斯地 區的貴族,作品中她沉靜的神情,典雅的裝扮和 端莊的氣息,曾讓班可獲得許多讚揚。\n\nSimone BIANCO Gulian 1480990-1553)\n\nC.1540 Marble","cat":"奇美博物館","details":["藝術廳","13至16 世紀:神性與人性"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619167226227_3918729496232114111.jpg","1619167234020_852669174740964887.jpg"]},{"id":"recubg8kkrfUNIUUZ","name":"01荷蘭東印度公司時期","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619148901926_5086906191693099063.jpg","1619148914732_376496593006804928.jpg"]},{"id":"recudS12AfGHEg2y4","name":"","notes":"","cat":"自然博物館","details":["玉言故事展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1618992798600_1099565887621246405.jpg"],"displayTitle":"玉言故事展｜待辨識紀錄（Eg2y4）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recuhQDaIxrvWS4Za","name":"希律王向猶太文士詢問 伯利恆之星之事\n\nKing Herod Asks the Sanhedrin About the Star Over Bethlehem","notes":"希律王向猶太文士詢問 伯利恆之星之事\n\nKing Herod Asks the Sanhedrin About the Star Over Bethlehem\n\n尼德蘭畫派\n\n(尼德蘭,十六世紀)\n\n約1500,油彩、木板\n\nNetherlandish School\n\n(Netherlander, 16th century) ca. 1500, Oil on panel\n\n耶穌降生之際,東方賢士前來朝拜猶太 人的新生王,不安的希律王便向猶太祭 司長與文士詢問此事。頭戴東方巾帽、 身穿紅袍與金底黑線繡花的男子是希律 王,一旁的祭司與文士身穿鑲邊毛領、 兩側開叉的毛邊寬領外套、紅色扁帽與 褲襪等,都透露出當時的流行時尚。\n\n0010915","cat":"奇美博物館","details":["藝術廳","13至16 世紀:神性與人性"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619167575073_4779198745300770892.jpg","1619167586633_1489210207989039678.jpg"]},{"id":"recukPZKu1xFNxTKV","name":"唐 長沙窯 綠釉單柄壺","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—唐風宋韻","period":"","number":"購瓷000065","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recuu7AoYGVgaBu5u","name":"清 嘉慶 洋彩萬福長壽紅地茶鍾","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—清代品茗","period":"","number":"故瓷014747","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recuyTy0vUvdSmEsU","name":"08荷蘭東印度公司時期","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619149199287_7812307330184078444.jpg","1619149213059_4637694335402714072.jpg"]},{"id":"recv9MBQrpxX8P5mq","name":"蝶圖竹爐團扇","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"南購扇000002","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recvAvppqO2lxnybh","name":"暮秋習作\n\nThe Study of An Autumn Evening'","notes":"暮秋習作\n\nThe Study of An Autumn Evening'\n\n路易·艾密勒·亞當 ( 1839-1937) 年代不詳、油彩、畫布\n\nLouis Emile ADAN\n\nT French, 1839-1937 ) Undated, Oil on canvas\n\n綿延的長矮牆、沿直線排列的大樹、倚 靠在矮牆上的女子,略帶昏黃的整體色 調,皆與【暮秋】的元素、構圖與氣氛相 似。在此望向遠方的女子是畫家之妻。 身形更小且五官模糊,彷彿多了幾分调 張與秋意。然而,趴臥在路上的小狗, 同樣望向遠方,不僅與女子的姿態相呼 應,又多了幾分俏皮。\n\n0009243","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619166425806_6882925958789013186.jpg","1619166438038_5328046250104912159.jpg"]},{"id":"recvBmVHqznhi8us1","name":"清末民初 錫茶葉罐 一對","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"清末民初 工夫茶器一組","period":"","number":"南購銅000024 南購銅000025","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recvCwPWdVs1TISdS","name":"","notes":"","cat":"奇美博物館","detai :[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recwWwQd8AAnUPqzn","name":"民國孫文墨寶天下為公　卷","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第一檔）","period":"","number":"贈書000724N000000000","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recwX3s7axHPUp3in","name":"清 乾隆七年\n洋彩錦上添花紅地茶鍾一對","notes":"清 乾隆七年\n洋彩錦上添花紅地茶鍾一對\n高 5.5公分 口徑 9.2公分 足徑 3.9公分/一只\n直圓口，短頸，橢圓腹，底微斂，長曲流，弓形把，把內側上方一通氣孔，矮圈足微撇，帶圓紐拱形蓋，紐側及蓋內各有一相連通氣孔。器內及底全施湖綠釉，器外除頸、圈足外，通體於紫紅地上錐刻卷草紋，餘隙彩繪洋蓮四朵，頸飾螭龍二對，肩為如意紋一周，底邊蕉葉紋一周，圈足則飾黃地花卉圖案紋一周。蓋紐塗金，圍繞蓮瓣紋一周，蓋面畫轉枝花葉紋四朵。胎薄透光，壺底藍料書「乾隆年製」四字二行篆款，外加雙方框。茶鍾口微敞，深直壁，矮圈足，內底微凸。器內白釉無紋，外壁紫紅地上錐劃卷草紋，其上加飾彩繪番蓮花三朵。胎骨略重，底青花書「大清乾隆年製」六字三行篆款。這類直弧，深壁，口徑九公分左右的碗器，形制常於宮廷繪畫中出現，作為啜茗茶鍾。 此為清宮檔案中乾隆六年、七年製作的「乾隆款洋彩錦花紅地茶鍾」，另還有相同技法、敞口、口徑較大約十二公分的「乾隆款洋彩錦上添花紅地茶碗」。 \n\n此類紫紅地錐刻洋彩器，剔、畫工精密，不僅器內外滿施彩釉，壺蓋內及底部，甚至圈足、蓋圈足底部也全施金彩。雖然紋飾繁褥，但見錐、畫工序之講究。茶壺與與茶鍾紋飾極為接近，惟茶壺款識為料款；茶鍾則為六字青花篆款。","cat":"故宮","details":["東亞茶文化展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[{"id":"recTL4AlTXJe0JgVt","name":"清朝"}],"exhibitions":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}],"artists":[],"attachments":["Screenshot_20210424101225.jpg"]},{"id":"recwXza3ExoBJYZRp","name":"","notes":"","cat":"奇美博物館","details":["羅丹"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619159802906_5846031280304430049.jpg","1619159813542_5002476351555758881.jpg","1619159824776_4488308536497882967.jpg"],"displayTitle":"羅丹｜待辨識紀錄（JYZRp）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recwal0LYGwDVe0Lk","name":"清 康熙 青花山水人物六方茶葉罐 ","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—清代品茗","period":"","number":"中瓷005496","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recwbURp6F8m7NaQa","name":"","notes":"","cat":"奇美博物館","details":["羅丹"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619169814588_3810438721255022059.jpg"],"displayTitle":"羅丹｜待辨識紀錄（7NaQa）","t 619167720057_7969132006947663481.jpg","1619167732108_8750235693937002349.jpg"]},{"id":"recx7j56jvTHInHEW","name":"七政寶","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第5單元　密教的神奇","period":"原存熱河(今歸河北省) / 清(1644-1911) 西元18世紀","number":"中銅002428〜002434","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recx7vgZppf1vXpjn","name":"13明鄭時期","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619149450381_725741113054613460.jpg","1619149460463_7534964690325402921.jpg"]},{"id":"recxFvchGrAreIJ6a","name":"印度喀什米爾坐佛","notes":"西元645 或653 年、​印度喀什米爾\n坐佛\n黃銅，鑲嵌銀、紅銅 高29 公分\n梵文題記羅馬轉寫： (正面) saṃvatsare 2[0 or 9] ... (左側) mahārāja navasurendrasya // (背面) [devadharmo] yab mahāśraddhopāsaka gaṃjjapatiputra varṣasya tathā sādhaṃ bhāryā (右側) śiriyena (背面) tathā sādhaṃ gi(rṇa) rasiṃghena // sādhaṃ putra siṃghena tathā sādhaṃ putra śiriena. \n\n題記中譯：在Navasurendra大王統治的第二十（或二十九）年，司庫之子Varṣa是具大誠信之優婆塞（居士），連同其妻Śirī、Girṇarasiṃgha、與其子Siṃgha和Śiri共造此(像)。（劉國威譯）\n\n這尊佛坐像的主體是以黃銅澆注而成，眼白和雙唇分別嵌有銀和紅銅，這類工藝技法常見於喀什米爾的造像中。該地佛教根基深厚，不但受過貴霜王朝犍陀羅藝術的洗禮，也歷經笈多王朝的盛世光輝，造就出喀什米爾造像的獨特性。\n\n此尊坐佛結跏趺坐於自岩石獅子座升起的仰覆蓮臺上，頂有繁密的螺髮，圓臉豐頤，月眉細長。在雙手結轉法輪印的同時，右手還握有衣角。除了保有犍陀羅壯碩寫實的身軀和肅穆表情外，衣紋稠密規律，身體的結構和曲線交待清楚，完全符合臺座銘文所示之時代風格。臺座上供養人身著交領衣衫和長褲，具有當地皇室服飾之特徵。此件造像不但是一件喀什米爾七世紀中葉的精品，也是該地現存帶有明確紀年的重要造像之一，彌足珍貴。","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"","period":"西元645 或653 年","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["20190524183842456217.jpg"]},{"id":"recxLHraAyng17jes","name":"07荷蘭東印度公司時期","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619149165227_8812612368289037357.jpg","1619149174762_6034448255742617890.jpg"]},{"id":"recxLVlUBnihZ7RRh","name":"阿彌陀佛","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第2單元　佛陀的智慧","period":"遼（907-1125） 西元11世紀","number":"贈銅000190","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recxLsTjRgGdADUvS","name":"","notes":"","cat":"奇美博物館","details":["藝術修復"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619164409164_1128473332847807696.jpg"],"displayTitle":"藝術修復｜圖像缺了","titleBasis":"依展場照片標示或內容整理"},{"id":"recxRJZxexRhLaupi","name":"明\n太祖 御筆七言詩","notes":"明\n太祖 御筆七言詩\n根據記載，朱元璋(1328-1398)出家後，深受佛家薰陶，不僅能詩，還練就一手好字，尤以行草書見長。\n此作夾雜楷、行、草，頗有法度，用筆遒勁有力，率真流暢，章法上也不拘陳規，展現出開國君王的氣度與魅力，誠如康有為(1858-1927)「雄強無敵」的評語。","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第一檔）","period":"","number":"","url":"","wiki":"","years":[{"id":"recj9BkloPzQZSvTC","name":"明朝"}],"exhibitions":[],"artists":[],"attachments":["Screenshot_20210424102519.jpg"]},{"id":"recxd3Lcwt0VM2BUA","name":"","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第4單元　經藏的流轉","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619245756364_5418275650976090509.jpg","1619245782654_2454265209699176114.jpg","1619245800537_2184167731259676380.jpg","1619245816157_7556540405681950850.jpg","1619245826410_7741027696058466860.jpg","1619245841014_5231601605073163507.jpg","1619245857595_6234137035999685830.jpg","1619245867296_378341750987799709.jpg","1619245884945_4059204274127283167.jpg"],"displayTitle":"佛陀形影—院藏亞洲佛教藝術之美｜待辨識紀錄（M2BUA）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recxlNMRoQcRNaF2g","name":"","notes":"","cat":"奇美博物館","details":["17至18世紀：宮廷與市井"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619169069768_6421708927190688167.jpg","1619169086693_2632819773806739370.jpg"],"displayTitle":"17至18世紀：宮廷與市井｜待辨識紀錄（NaF2g）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recxlbRL15gsbGoFT","name":"藏式佛塔 內供白玉無量壽佛","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第5單元　密教的神奇","period":"清（1644-1911）西元18世紀","number":"中雜000089","url":"","wiki":"","years":[ 9435272_7708276475803691975.jpg","1620459466678_6276081446847073463.jpg","1620459479757_808257595369870133.jpg"]},{"id":"recyM3sjSwE97a3hg","name":"06荷蘭東印度公司時期","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619149136206_3411981673183127507.jpg","1619149145240_2493674057826556056.jpg"]},{"id":"recyPMBGF2IYEw0Tz","name":"","notes":"","cat":"奇美博物館","details":["羅丹"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619159848963_6829545903925559265.jpg","1619159863216_4086982911357358929.jpg"],"displayTitle":"羅丹｜待辨識紀錄（Ew0Tz）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recyRzMEbarSsvY8B","name":"明沈周汲泉煮茗圖　軸","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—唐風宋韻","period":"","number":"故畫002148","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recySP9oNAPKjMuqv","name":"明 德化窯 瑩白蟠螭把壺","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"中國茶文化—明人雅集","period":"","number":"故瓷009586 ","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recya75OxguWOFJXB","name":"日本 室町時代 牡丹花肖柏 和歌 軸","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"南購書000006","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recycQKTn07wKV6ST","name":"東亞茶文化展","notes":"品茶，是生活，是時尚，是藝術，也是文化。\n茶的原鄉在中國，自古發展迄今，已由原初的解渴藥飲、煎煮點啜，到今日的沖泡慢品。隨著製茶方式的改變，茶器形式與品茗方法也隨之變化。漢地飲茶習俗，通過使臣與貿易的傳播，融入蒙藏人民的生活，發展出游牧民族的飲茶方式與器皿。\n唐宋時期，茶文化透過遣唐使、留學僧及商賈自中國傳入日本，並融入當地的文化精神與行茶禮儀，發展成一套嚴謹的日式茶道。明末，福建僧侶又將閩式飲茶法及宜興茶器帶入，結合日本文人清談的飲茶方法，形成「煎茶道」。\n明末清初，飲茶習慣也跟隨中國東南沿海移民的足跡傳到臺灣，延續閩粵地區「工夫茶」的飲茶傳統，發展至今已將喝茶氛圍推至藝術領域。\n展覽依前述脈絡分為「中國茶文化」、「日本茶文化」、「蒙藏奶茶」、「臺灣工夫茶」等四單元，展出院藏茶文化相關文物，並藉由明代茶寮、日本茶室、蒙藏奶茶區及現代茶席等情境空間展示，營造出不同的飲茶氛圍，呈現各區域特有的品茗文化與多元性。","cat":"故宮","details":["東亞茶文化展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}],"artists":[],"attachments":["Screenshot_20210424095944.jpg"]},{"id":"recydQlUSpLV83bqe","name":"","notes":"","cat":"安平古堡","details":[],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619148562294_7836172856988306194.jpg","1619148571082_6809021995680461548.jpg","1619148581047_180257667867582658.jpg"],"displayTitle":"安平古堡｜待辨識紀錄（83bqe）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"recz0zAhcyDkxx4hC","name":"菲德烈克・范・馬瑟萊爾肖像","notes":"\nhttps://peekingbehind.chimeimuseum.org/Theme/paintings/2011251323851菲德烈克・范・馬瑟萊爾肖像\n\n\n奇美博物館計劃型助理研究員 徐鈺涵\n奇美博物館 油畫修復師 李文元\n \n \n\n\n案例概述\n\n〈菲德烈克‧范‧馬瑟萊爾肖像〉是十七世紀知名肖像畫家－安東尼‧范‧戴克的作品。畫中的馬瑟萊爾是當時活躍於安特衛普地區政治界的人物，可能與范‧戴克相識，因而委託他創作肖像畫。但是范‧戴克在這張畫布上描繪馬瑟萊爾之前，其實已經先被畫上其他東西了！\n \n\n菲德烈克・范・馬瑟萊爾肖像\n菲德烈克‧范‧馬瑟萊爾肖像, 安東尼‧范‧戴克 (法蘭德斯，1599-1641), \n年代不詳, 71.1 x 58.4 公分, 油彩、畫布 \n\n\n畫家是誰？\n\n安東尼‧范‧戴克（Anthony van Dyck, 1599-1641）是著名的法蘭德斯畫家，以肖像畫聞名，作品尤其受到當時英國王宮貴族的喜愛，因而活躍於英國貴族圈和藝術圈，曾為英王查理一世（Charles I,1600-1649）的御用畫家。\n\n\n范‧戴克被認為曾進入魯本斯（Peter Paul Rubens, 1577-1640）工作坊學習，深受魯本斯的影響，也成為繼魯本斯之後最重要的法蘭德斯畫家之一。他的肖像畫尤其以能真實、細膩地捕捉人物的個性氣韻而廣受讚美和歡迎。\n\n\n畫裡面的人是誰？\n\n畫中的男子是一位真實的歷史人物－菲德烈克‧范‧馬瑟萊爾（Frederick van Marselaer, 1584-1670）。馬瑟萊爾來自安特衛普，曾經擔任外交官或其他行政要職。當時的達官顯要經常委託畫家繪製肖像畫，馬瑟萊爾也不例外，但他曾說自己最好的肖像便是出自范・戴克之手 ，可見范・戴克的作品真的是相當受歡迎。","cat":"奇美博物館","details":["17至18世紀：宮廷與市井"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619168897429_9090635446957224922.jpg","1619168946970_6387988269225232758.jpg"]},{"id":"reczAOJrXarDCGez0","name":"","notes":"","cat":"奇美博物館","details":["藝術修復"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619161744165_2815590009217356914.jpg"],"displayTitle":"藝術修復｜畫怎麼了","titleBasis":"依展場照片標示或內容整理"},{"id":"reczGk3bqWIt9RUYu","name":"","notes":"","cat":"北美館","details":["塩田千春：顫動的靈魂"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1620471517655_8199157282904775607.jpg","1620471510299_8011106031812879729.jpg","1620471529921_8748208854850087140.jpg"],"displayTitle":"塩田千春：顫動的靈魂｜待辨識紀錄（9RUYu）","titleBasis":"原始名稱空白，依分類暫列，內容待辨識"},{"id":"reczKVeOju6fqRsxf","name":"明沈士充雪景山水　卷","notes":"","cat":"故宮","details":["翰墨空間─故宮書畫賞析"],"sub":"翰墨空間（第一檔）","period":"","number":"故畫001075N000000000","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"reczO3KBQmKS33c4X","name":"青花金蓮御燭圖煎茶碗（五件）","notes":"","cat":"故宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"南購瓷000146- 150","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"reczOhTOqN7BMjtFy","name":"漢文《妙法蓮華經》 七卷","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第4單元　經藏的流轉","period":"元刊蘇體本","number":"故佛000451〜000457","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619246386477_6953769144602995744.jpg","1619246397438_7021649215497222291.jpg","1619246409873_8794276550958240905.jpg","1619246466582_1913232448491625373.jpg","1619246422387_1108294275950333453.jpg","1619246438982_174679529779375024.jpg","1619246376863_443126067363829087.jpg"]},{"id":"reczOxwVy8RIbvJDZ","name":"和敬清寂 日本茶文化","notes":"西元八世紀中葉，中國飲茶文化隨著遣唐使及僧人初傳日本。十二世紀末榮西禪師（1141-1215）從南宋帶回禪院喫茶法，掀起日本飲茶風氣。十五世紀，室町幕府將軍足利義政（1436-1490）融合武士、貴族、禪僧等文化，在書院茶室中舉行茶會，時稱「書院茶」。其後，村田珠光（1423-1502）創立古樸簡約的茶室，主張通過修行來領悟茶道的內在精神。千利休（1522-1591）提倡「和敬清寂」的茶道精神，不再拘泥來自中國的「唐物」茶器，簡素的和式茶器應運而生。","cat":"故宮","details":["東亞茶文化展"],"sub":"日本茶文化—和敬清寂","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}],"artists":[],"attachments":[]},{"id":"reczX3ixWfSlHp8g3","name":"唐代 長沙窯 綠釉單柄壺","notes":"唐代\n\n長沙窯 綠釉單柄壺\n\n通蓋高 18‧5公分 口徑 4‧9公分 足徑 7‧4公 分\n\n東亞茶文化展\n\n壺圓口，橢圓腹，短流，長方形空心橫柄，柄中段附圓穿孔，以便串連蓋上繫孔。全器除口沿及圈足無釉外，均施綠釉。釉色青綠乳濁，釉層較厚，釉面滿佈細碎開片紋，器蓋釉色偏藍，積釉處雜呈藍斑。\n\n側把單柄壺盛行於唐代晚期，浙江越窯、湖南長沙窯等南北各窯均有燒造，石製器亦有製作 。長沙窯製作多種日常茶器如單柄壺、茶瓶、茶碗、茶末盒等多帶器銘如「荼埦」、「荼盞子」、「大茶合」、「鎮國茶瓶」， 可見飲茶風氣在湖南地區頗為盛行。\n\n單柄壺在唐晚期與短流茶瓶一樣，皆作為注湯點茶之用，其形制與與院藏驪山石單柄壺，以及及國立臺中自然科學博物館收藏的一組唐代滑石茶器中的小型單柄壺極為接近，此為唐代晚期盛行於茶盞內點茶的帶柄 茶瓶，或亦可稱之為「急須」，因單柄壺形制在宋人黃裳〈龍鳳茶寄照覺禪師〉詩中稱「急須」為東南之茶器，用以煎煮茶湯， 這類造型，由唐至今造型、胎釉雖經演變，然千餘年來仍為茶家所愛，明清時期宜興紫砂或閩粵所製白泥尤為多見。 ​\n\n","cat":"故宮","details":["東亞茶文化展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[{"id":"recAy0YwrnSNYTGDk","name":"唐朝"}],"exhibitions":[{"id":"reclbrBsaOBZ292XY","name":"東亞茶文化展"}],"artists":[],"attachments":["PB1B000065N000000000PAB.jpg","PB1B000065N000000000PAG.jpg","PB1B000065N000000000PAF.jpg"]},{"id":"reczXAKSkZWbuEUd6","name":"960-1279年國寶","notes":"","cat":"故宮","details":["人氣國寶展"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619244792877_874844512793991252.jpg","1619244806550_9079768222275833256.jpg","1619244819805_7766437173192178519.jpg","1619244833661_263335476655852617.jpg","1619244844423_2095796526412508496.jpg"]},{"id":"reczdvXxO47ATGYNb","name":"長壽寶瓶","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第5單元　密教的神奇","period":"清嘉慶24年(1819)收 原存紫禁城毓慶宮惇本殿 / 西藏 / 清(1644-\n1911) 西元19世紀初","number":"故雜001850","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":[]},{"id":"recziXs6UrBLulAMo","name":"安卓米達 Andromeda","notes":"安卓米達 Andromeda\n\n保羅·居斯塔夫·鐸芮 (法國,1832-1883)\n\n1869,油彩、畫布\n\nPaul Gustave DORÉ (French, 1832-1883) 1869, Oil on canvas\n\n鐸芮以插畫聞名,但仍創作許多精彩的 油畫作品。安卓米達為拯救國家而被綁 在岩石上等待海怪吞噬。赤裸柔弱的女 性身軀為主角,對比身後巨大陡峭的岩 石、詭譎陰沉的夜景,以及下方張牙怒 咀的海怪與洶湧噴濺的浪潮,傳達著人 類的恐懼與大自然的宏偉壯觀。\n\n000600","cat":"奇美博物館","details":["藝術廳","19世紀：傳統與創新"],"sub":"","period":"","number":"","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1619165122437_8011175934442688744.jpg","1619165136915_9045165875163915935.jpg"]},{"id":"reczkfzA5U9XuzB1o","name":"漢文《大方廣佛華嚴經》八十卷","notes":"","cat":"故宮","details":["佛陀形影—院藏亞洲佛教藝術之美"],"sub":"第4單元　經藏的流轉","period":"北宋淳化間杭州龍興寺刊本","number":"故佛000516〜000525、 故佛000557〜000558","url":"","wiki":"","years":[],"exhibitions":[],"artists":[],"attachments":["1
