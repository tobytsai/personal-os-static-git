<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>注音關聯｜字・簡易啟動器</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#263f38;font:16px system-ui,sans-serif}header{background:#286c5a;color:white;padding:26px max(20px,calc((100% - 1100px)/2))}header a{color:white}h1{margin:10px 0 4px}main{max-width:1100px;margin:auto;padding:20px}.bar{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;border:1px solid #cad9d2;border-radius:9px;background:white;padding:10px}input{flex:1;min-width:200px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:18px 0}.card{background:white;border:1px solid #dce8e0;border-radius:15px;padding:16px;text-align:left;cursor:pointer;color:inherit;min-height:120px}.card:hover{box-shadow:0 4px 15px #a8bcb655}.title{font-size:25px;font-weight:bold}.muted{color:#65776f;font-size:14px;margin:8px 0}.chars{display:flex;flex-wrap:wrap;gap:8px}.chars a,.links a{display:inline-block;background:#e5f3eb;color:#155941;padding:7px 11px;border-radius:8px;text-decoration:none}.chars a{font-size:22px;min-width:48px;text-align:center}dialog{border:0;border-radius:16px;width:min(820px,94vw);max-height:85vh;padding:24px;box-shadow:0 15px 50px #0004}dialog::backdrop{background:#0008}.close{float:right;cursor:pointer}.links{display:flex;gap:8px;flex-wrap:wrap}#status{margin-top:15px}.notes{white-space:pre-wrap}</style></head><body><header><a href="character-simple.html">← 返回字・簡易啟動器</a><h1>注音關聯</h1><div>依照注音、拼音與聲韻分類探索相關漢字</div></header><main><div class="bar"><input id="search" placeholder="搜尋注音、拼音或關聯字" aria-label="搜尋"><select id="initial" aria-label="聲母"><option value="">全部聲母</option></select></div><div id="status" class="muted">正在載入資料…</div><div id="grid" class="grid"></div><div class="bar"><button id="prev">上一頁</button><span id="page"></span><button id="next">下一頁</button></div></main><dialog id="detail"><button class="close" id="close">關閉 ✕</button><div id="detailContent"></div></dialog><script>
const $=x=>document.getElementById(x);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data=[],filtered=[],page=0;const size=60;
function safeUrl(url){try{let u=new URL(url);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
function draw(reset=false){if(reset)page=0;let q=$('search').value.trim().toLowerCase(),initial=$('initial').value;
filtered=data.filter(r=>(!initial||r.initial===initial)&&(!q||[r.name,r.notes,r.initial,r.medial,r.final,...r.symbols,...r.types,...r.chars.map(c=>c.name)].join(' ').toLowerCase().includes(q)));
let max=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,max-1);
$('status').textContent='符合 '+filtered.length.toLocaleString()+' 筆／共 '+data.length.toLocaleString()+' 筆';
$('grid').innerHTML=filtered.slice(page*size,(page+1)*size).map((r,i)=>'<button class="card" data-i="'+i+'"><div class="title">'+esc(r.name||'未命名')+'</div><div class="muted">'+esc(r.symbols.join(' · '))+'</div><div>關聯 '+r.chars.length.toLocaleString()+' 個字</div></button>').join('')||'<p>找不到符合的卡片。</p>';
$('page').textContent='第 '+(page+1)+' / '+max+' 頁';$('prev').disabled=page===0;$('next').disabled=page>=max-1}
function openCard(r){let url=safeUrl(r.audio);let chars=r.chars.map(c=>'<a href="character-simple.html?record='+encodeURIComponent(c.id)+'" title="查看字卡 '+esc(c.name)+'">'+esc(c.name||'□')+'</a>').join('');
let fields=[['注音符號',r.symbols.join('、')],['聲韻分類',r.types.join('、')],['前音',r.initial],['介音',r.medial],['尾音',r.final]].filter(x=>x[1]).map(x=>'<p><strong>'+esc(x[0])+'：</strong>'+esc(x[1])+'</p>').join('');
$('detailContent').innerHTML='<h2>'+esc(r.name||'未命名')+'</h2><p class="muted">關聯 '+r.chars.length.toLocaleString()+' 個字</p>'+fields+(r.notes?'<p class="notes">'+esc(r.notes)+'</p>':'')+(url?'<p><audio controls preload="none" src="'+esc(url)+'">您的瀏覽器不支援音訊。</audio></p><div class="links"><a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">開啟教育百科音檔 ↗</a></div>':'')+'<div class="links"><a href="https://airtable.com/appf1ZIjcI2DnuQmq/tblFyIT9MikxIWPpT/'+encodeURIComponent(r.id)+'" target="_blank" rel="noopener noreferrer">Airtable 原始資料 ↗</a></div><h3>相關字卡</h3><div class="chars">'+(chars||'此卡目前沒有關聯字。')+'</div>';
if(!$('detail').open)$('detail').showModal();history.replaceState(null,'','?card='+encodeURIComponent(r.id))}
$('grid').addEventListener('click',e=>{let b=e.target.closest('[data-i]');if(b)openCard(filtered[page*size+Number(b.dataset.i)])});
$('close').onclick=()=>{$('detail').close();history.replaceState(null,'',location.pathname)};
$('detail').addEventListener('cancel',()=>history.replaceState(null,'',location.pathname));
$('search').addEventListener('input',()=>draw(true));$('initial').addEventListener('change',()=>draw(true));
$('prev').onclick=()=>{page--;draw();window.scrollTo(0,0)};$('next').onclick=()=>{page++;draw();window.scrollTo(0,0)};
fetch('../data/character-simple/phonetic-cards.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{data=d.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));[...new Set(data.map(r=>r.initial).filter(Boolean))].sort().forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;$('initial').append(o)});draw();let id=new URLSearchParams(location.search).get('card'),r=data.find(x=>x.id===id);if(r)openCard(r)}).catch(()=>$('status').textContent='資料載入失敗，請稍後重新整理。');
</script></body></html>
