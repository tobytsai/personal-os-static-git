<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#9d7622"><meta name="description" content="收藏 Facebook 自學與閱讀分享，快速開啟喬喬來了、Claire - 愛閱讀的雙寶媽與國小自學網。"><title>Facebook 自學啟動器｜Toby</title><link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>

*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:radial-gradient(circle at 6% 8%,#fff0bf 0 9rem,transparent 9.1rem),radial-gradient(circle at 96% 40%,#c9f1e8 0 10rem,transparent 10.1rem),linear-gradient(145deg,#fff8e4,#f1f5fb 58%,#e6f7ef);overflow-x:hidden}a{color:inherit}main{width:min(1120px,100%);margin:auto;padding:18px 21px 46px}.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;padding:9px 14px;border:1px solid white;border-radius:999px;background:#ffffffdd;color:#35536a;text-decoration:none;font-size:13px;font-weight:850;box-shadow:0 5px 15px #24344d12}
.hero{position:relative;isolation:isolate;overflow:hidden;padding:clamp(24px,5vw,43px);border-radius:29px;color:#fff;background:linear-gradient(120deg,#a17a20,#d5a12a 48%,#4cae9f);box-shadow:0 18px 40px #81651d35}.hero:before,.hero:after{position:absolute;z-index:-1;content:"";border:2px solid #ffffff50;border-radius:50%}.hero:before{width:250px;height:250px;right:-50px;top:-125px}.hero:after{width:150px;height:150px;right:22%;bottom:-108px}.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.eyebrow{display:inline-block;padding:7px 11px;border:1px solid #ffffff66;border-radius:999px;background:#ffffff24;font-size:12px;font-weight:850;letter-spacing:.06em}h1{display:inline-block;margin:12px 0 9px;padding:8px 17px;border-radius:10px;background:var(--gold);font-size:clamp(34px,7vw,52px);line-height:1.15;box-shadow:0 8px 20px #65481534}.hero p{max-width:680px;margin:0;color:#fffaf0;font-size:15px;line-height:1.7}.notes-link{flex:none;padding:11px 13px;border:1px solid #ffffff90;border-radius:16px;background:#fff;color:#35536a;text-decoration:none;text-align:center;font-weight:900;box-shadow:0 7px 18px #573d1628}.notes-link small{display:block;margin-top:2px;color:#738092;font-size:10px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.stats span{padding:7px 10px;border:1px solid #ffffff50;border-radius:999px;background:#ffffff20;font-size:12px;font-weight:750}
.venue-feature{display:flex;align-items:center;gap:13px;background:linear-gradient(110deg,#e8f8f1,#f3fbff);border:1px solid #c9e8e0;border-radius:19px;padding:15px 17px;margin:16px 0 5px;text-decoration:none;box-shadow:0 7px 22px #2457520f}
.venue-feature-icon{flex:none;width:49px;height:49px;border-radius:14px;background:#d6eee5;display:grid;place-items:center;font-size:27px}
.venue-feature div{flex:1;min-width:0}.venue-feature strong{font-size:17px;display:block;color:#2a6c62}.venue-feature small{font-size:11px;display:block;color:#68887f;line-height:1.6;margin-top:3px}
.venue-feature .arrow{font-size:21px;color:#2a8b82}
@media(max-width:540px){.venue-feature{padding:11px 12px}.venue-feature strong{font-size:14px}.venue-feature-icon{width:43px;height:43px}}
.searchbox{position:relative;margin:18px 0 10px}.searchbox:before{content:"⌕";position:absolute;left:15px;top:6px;color:#9098a4;font-size:24px}.search{width:100%;height:49px;padding:0 15px 0 44px;border:1px solid var(--line);border-radius:15px;background:white;outline:none;font:inherit;box-shadow:0 8px 20px #24344d0b}.search:focus{border-color:#59aa9d;box-shadow:0 0 0 4px #59aa9d25}.filters{display:flex;gap:8px;overflow:auto;padding:4px 2px 8px}.filter{flex:none;padding:8px 13px;border:1px solid #e2e7ec;border-radius:999px;background:#ffffffdc;color:#45536a;font:inherit;font-size:12px;font-weight:850;cursor:pointer}.filter.active{background:#263c57;border-color:#263c57;color:white}
.panel{margin-top:20px}.panelhead{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:0 2px 11px}.panelhead h2{margin:0;font-size:20px}.hint{color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{--tone:#e3ad2e;position:relative;display:flex;min-width:0;min-height:126px;flex-direction:column;overflow:hidden;padding:14px;border:1px solid #fff;border-radius:20px;background:#fff;box-shadow:0 8px 20px #263a5110;transition:transform .18s,box-shadow .18s}.tile:before{position:absolute;inset:0 0 auto;height:6px;background:var(--tone);content:""}.tile:after{position:absolute;right:-28px;bottom:-48px;width:94px;height:94px;border-radius:50%;background:color-mix(in srgb,var(--tone) 13%,white);content:"";pointer-events:none}.tile:hover{transform:translateY(-3px);box-shadow:0 14px 28px #263a511b}.tiletop{position:relative;z-index:1;display:flex;align-items:center;gap:10px;min-width:0}.brand{display:grid;flex:none;width:42px;height:42px;place-items:center;border-radius:14px;background:color-mix(in srgb,var(--tone) 13%,white);color:var(--tone);font-size:18px;font-weight:950;letter-spacing:-.04em}.brand.word{font-size:13px}.tilelink{min-width:0;text-decoration:none}.name{margin:0;font-size:15px;font-weight:900;line-height:1.35;overflow-wrap:anywhere}.category{margin-top:3px;color:var(--muted);font-size:10px;font-weight:750}.desc{position:relative;z-index:1;margin:11px 0 9px;color:#6c7889;font-size:11px;line-height:1.55}.tilefoot{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:7px;margin-top:auto}.help{border:0;border-radius:999px;background:#f0f4f4;color:#3d615d;padding:6px 9px;font:800 10px system-ui;cursor:pointer}.help:hover,.help:focus-visible{background:#dcf1e9;outline:2px solid #59aa9d;outline-offset:2px}.open{color:var(--tone);font-size:10px;font-weight:900;text-decoration:none}.origin-link{color:#466d7a;font-size:10px;font-weight:750;white-space:nowrap;text-decoration:none}.tilefoot{flex-wrap:wrap}.star{border:0;background:transparent;color:#aeb5bf;font-size:20px;line-height:1;cursor:pointer}.star.on{color:#f0b21c}.empty{display:none;padding:23px;border:1px dashed #c9d4df;border-radius:17px;background:#ffffffb7;color:var(--muted);text-align:center}.overlay{position:fixed;inset:0;z-index:10;display:none;place-items:center;padding:17px;background:#17263888}.overlay.show{display:grid}.dialog{width:min(440px,100%);padding:22px;border:1px solid white;border-radius:22px;background:white;box-shadow:0 20px 54px #101b2c55}.dialog h2{margin:0 0 8px;font-size:20px}.dialog p{margin:0;color:#657286;line-height:1.7}.close{display:block;margin:17px 0 0 auto;padding:9px 14px;border:0;border-radius:12px;background:#263c57;color:white;font:800 13px system-ui;cursor:pointer}.footnote{margin-top:24px;color:var(--muted);text-align:center;font-size:11px}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){main{padding:13px 12px 35px}.hero{border-radius:23px}.hero-top{align-items:flex-start}.grid{gap:8px}.tile{min-height:131px;padding:12px;border-radius:17px}.name{font-size:13px}.brand{width:36px;height:36px;border-radius:12px}.desc{font-size:10px}.notes-link{padding:9px 10px;font-size:13px}}
</style>
</head><body><main>

<header class="hero"><div class="hero-top"><div><span class="eyebrow">自學啟動器 → FACEBOOK</span><br><h1>Facebook 自學啟動器</h1><p>收藏自學與閱讀分享，把值得參考的 Facebook 連結放在一起。依分類搜尋，或點選星號收藏常用卡片。</p></div></div><div class="stats"><span>📘 <strong id="resourceCount">—</strong> 個 Facebook 入口</span><span>⭐ 收藏僅存於此瀏覽器</span></div></header>
<div class="searchbox"><input id="search" class="search" type="search" placeholder="搜尋名稱、閱讀或自學…"></div><nav id="filters" class="filters" aria-label="自學資源分類"></nav>
<section class="panel"><div class="panelhead"><h2>⭐ 我的收藏</h2><span class="hint">點選卡片上的星號收藏</span></div><div class="grid" id="favoritesGrid"></div><div class="empty" id="favoritesEmpty">還沒有收藏。點卡片上的 ☆，常用資源就會出現在這裡。</div></section>
<section class="panel"><div class="panelhead"><h2 id="allTitle">✨ 全部 Facebook 資源</h2><span class="hint" id="count"></span></div><div class="grid" id="allGrid"></div><div class="empty" id="allEmpty">找不到符合的資源，換個關鍵字試試吧。</div></section>
<p class="footnote">Facebook 內容可能需要登入；保留你提供的原始分享網址。收藏資料保存在目前使用的瀏覽器。</p></main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog"><h2 id="dialogTitle"></h2><p id="dialogBody"></p><button class="close" id="close">知道了</button></div></div>
<script>
const resources=[
{
  "id": "elementary-self-study-facebook",
  "name": "國小自學網",
  "category": "自學社群",
  "icon": "👥",
  "url": "https://www.facebook.com/share/g/1BgAxG8ADb/",
  "description": "收藏的 Facebook 社團連結；點選開啟前往國小自學網。",
  "tone": "#5b9d8f"
},
  {
    "id": "qiaoqiao",
    "name": "喬喬來了",
    "category": "自學分享",
    "icon": "🌱",
    "url": "https://www.facebook.com/share/1CG2eFcoDh/",
    "description": "收藏的 Facebook 自學參考連結；點選開啟查看原頁面。",
    "tone": "#4b9b89"
  },
  {
    "id": "claire-reading-mom",
    "name": "Claire - 愛閱讀的雙寶媽",
    "category": "閱讀分享",
    "icon": "📚",
    "url": "https://www.facebook.com/share/19tzHsa1qc/",
    "description": "收藏的 Facebook 閱讀參考連結；點選開啟查看原頁面。",
    "tone": "#668acc"
  }
];
document.getElementById("resourceCount").textContent=resources.length;
const categories=["全部",...new Set(resources.map(x=>x.category))];let active="全部",query="";
const favKey="tobyFacebookSelfStudyFavoritesV1";let favorites=readFavs();
function readFavs(){try{return JSON.parse(localStorage.getItem(favKey)||"[]")}catch{return []}}
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function normLink(u){return String(u||"").replace(/\?.*$/,"").replace(/\/+$/,"")}
function card(x,i){return '<article class="tile" style="--tone:'+x.tone+'"><div class="tiletop"><span class="brand '+(Array.from(x.icon).length>2?"word":"")+'">'+esc(x.icon)+'</span><a class="tilelink" href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer"><h3 class="name">'+esc(x.name)+'</h3><div class="category">'+esc(x.category)+'</div></a></div><p class="desc">'+esc(x.description)+'</p><div class="tilefoot"><button class="help" data-help="'+esc(x.id)+'">？ 說明</button><a class="open" href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">開啟 ↗</a>'+(x.related&&normLink(x.related)!==normLink(x.url)?'<a class="origin-link" href="'+esc(x.related)+'" target="_blank" rel="noopener noreferrer">相關 ↗</a>':'')+(x.trello?'<a class="origin-link" href="'+esc(x.trello)+'" target="_blank" rel="noopener noreferrer">Trello ↗</a>':'')+'<button class="star '+(favorites.includes(x.id)?"on":"")+'" data-star="'+esc(x.id)+'" aria-label="'+(favorites.includes(x.id)?"取消收藏":"加入收藏")+'">'+(favorites.includes(x.id)?"★":"☆")+'</button></div></article>'}
function renderFilters(){const node=document.getElementById("filters");node.innerHTML=categories.map(c=>'<button class="filter '+(active===c?"active":"")+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join("");node.querySelectorAll("button").forEach(b=>b.onclick=()=>{active=b.dataset.cat;renderFilters();renderAll()})}
function renderGrid(id,list,emptyId){const node=document.getElementById(id);node.innerHTML=list.map(card).join("");document.getElementById(emptyId).style.display=list.length?"none":"block";node.querySelectorAll("[data-star]").forEach(b=>b.onclick=()=>{const key=b.dataset.star;favorites=favorites.includes(key)?favorites.filter(x=>x!==key):[key,...favorites];localStorage.setItem(favKey,JSON.stringify(favorites));renderAll()});node.querySelectorAll("[data-help]").forEach(b=>b.onclick=()=>showHelp(b.dataset.help))}
function renderAll(){const shown=resources.filter(x=>(active==="全部"||x.category===active)&&(!query||(x.name+" "+x.category+" "+x.description).toLowerCase().includes(query.toLowerCase())));renderGrid("allGrid",shown,"allEmpty");renderGrid("favoritesGrid",favorites.map(id=>resources.find(x=>x.id===id)).filter(Boolean),"favoritesEmpty");document.getElementById("count").textContent=shown.length+" / "+resources.length+" 個資源";document.getElementById("allTitle").textContent=active==="全部"?"✨ 全部 Facebook 資源":"📚 "+active}
function showHelp(id){const x=resources.find(r=>r.id===id);if(!x)return;document.getElementById("dialogTitle").textContent="？ "+x.name;document.getElementById("dialogBody").textContent=x.description+" 分類依收藏用途整理；點「開啟」可前往 Facebook 原頁面。";document.getElementById("overlay").classList.add("show");document.getElementById("close").focus()}
document.getElementById("search").addEventListener("input",e=>{query=e.target.value;renderAll()});document.getElementById("close").onclick=()=>document.getElementById("overlay").classList.remove("show");document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")e.currentTarget.classList.remove("show")});document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("overlay").classList.remove("show")});renderFilters();renderAll();
</script><script src="../shared-nav.js?v=20261025-2" defer></script><script defer src="../launcher-activity.js?v=20261028-1" data-mode="recent" data-track="#allGrid a[href], #favoritesGrid a[href], a.notes-link"></script>
</body></html>
