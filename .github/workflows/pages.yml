name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Exclude launcher pages from search indexes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = list(Path("public").rglob("*.html"))
          if not pages:
              raise SystemExit("No HTML pages found")
          for page in pages:
              html = page.read_text(encoding="utf-8")
              # Remove prior robots directives to avoid conflicting instructions.
              html = re.sub(r'<meta\b(?=[^>]*\bname\s*=\s*["\x27]robots["\x27])[^>]*>', '', html, flags=re.I)
              html, count = re.subn(r'(<head\b[^>]*>)', r'\1\n<meta name="robots" content="noindex, follow">', html, count=1, flags=re.I)
              if count != 1:
                  raise SystemExit(f"Missing head element: {page}")
              page.write_text(html, encoding="utf-8")
          print(f"Added noindex to {len(pages)} HTML pages")
          PY
      - name: Collect Song Feng Ge official frame photos
        run: |
          python3 -m pip install -q --disable-pip-version-check beautifulsoup4 || true
          python3 scripts/build_songfeng_photos.py
      - name: Collect Song Feng Ge matboard products and verified photos
        run: |
          python3 scripts/build_songfeng_matboards.py
      - name: Collect Song Feng Ge silk fabric products and verified photos
        run: |
          python3 scripts/build_songfeng_silk_fabrics.py
      - name: Collect Song Feng Ge juan fabric products and official photos
        run: |
          python3 scripts/build_songfeng_juan_fabrics.py
      - name: Upload public directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
