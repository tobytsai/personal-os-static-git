name: Import first images from public Yinxiang notes for 仕事 cards
on:
  push:
    branches: [main]
    paths:
      - scripts/import_frame_note_covers.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: frame-note-covers
  cancel-in-progress: false
jobs:
  import-note-covers:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install browser and image dependencies
        run: python3 -m pip install --disable-pip-version-check -q playwright Pillow
      - name: Collect public note first images and convert to durable card covers
        run: python3 scripts/import_frame_note_covers.py
      - name: Commit image covers, catalog and safe report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/images/frame-tech-notes/ public/data/frame-tech-work.json public/data/frame-note-cover-import-report.json
          if git diff --cached --quiet; then
            echo "No note cover updates"
          else
            git commit -m "Add first-image covers from public Yinxiang notes to 仕事 cards"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
