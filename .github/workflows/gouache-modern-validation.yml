name: Gouache modern web isolated validation
on:
  push:
    branches: [test/gouache-modern-web-v2]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Official Modern Web Guidance legacy scan (advisory)
        continue-on-error: true
        run: |
          mkdir -p validation
          set +e
          npx --yes modern-web-guidance@1.0.0 legacy-scan public/pages/gouache-product-catalog-20261103.html > validation/modern-web-scan.txt 2>&1
          result=$?
          cat validation/modern-web-scan.txt
          exit "$result"
      - name: Install browser test tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Test product catalog in three browser engines
        run: npx playwright test --config=playwright.gouache.config.mjs --reporter=list
      - name: Lighthouse before and after (isolated localhost)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p validation/lighthouse
          git show ef0d3398a90f7205e3458c8dd5c75293049b5fa1:public/pages/gouache-product-catalog-20261103.html > public/pages/gouache-baseline-ci-only.html
          python3 -m http.server 8766 --bind 127.0.0.1 --directory public > validation/lighthouse/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; rm -f public/pages/gouache-baseline-ci-only.html' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8766/pages/gouache-baseline-ci-only.html >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          npx --yes --package=lighthouse@12.8.2 lighthouse --version
          for preset in mobile desktop; do
            extra=()
            if [ "$preset" = desktop ]; then extra+=(--preset=desktop); fi
            for i in 1 2 3; do
              for version in before after; do
                if [ "$version" = before ]; then file=gouache-baseline-ci-only.html; else file=gouache-product-catalog-20261103.html; fi
                npx --yes --package=lighthouse@12.8.2 lighthouse "http://127.0.0.1:8766/pages/$file" "${extra[@]}" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices --output=json --output-path="validation/lighthouse/$preset-$version-$i.json" --quiet
              done
            done
          done
          node scripts/gouache-lighthouse-summary.mjs | tee validation/lighthouse/summary.txt
      - name: Preserve diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gouache-modern-validation
          path: |
            validation/
            test-results/
          if-no-files-found: ignore
