name: Stock launcher — official TWSE/TPEx daily close

on:
  schedule:
    # 19:25 and 20:10 Taiwan time, Mon–Fri; the second check catches late reports.
    - cron: '25 11 * * 1-5'
    - cron: '10 12 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-stock-close.yml'
      - 'scripts/update-stock-close.cjs'

permissions:
  contents: write

concurrency:
  group: main-write-queue
  queue: max
  cancel-in-progress: false

jobs:
  update-close:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Always collect against the newest main, including manual re-runs
          # of historical jobs; avoid rebasing a stale stock snapshot.
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Collect only source-verified official market data
        run: node scripts/update-stock-close.cjs
      - name: Commit dated public snapshot and immutable history
        id: publish
        run: |
          if [ ! -f public/data/stocks-latest.json ]; then
            echo "Official same-day prices not yet available; no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/data/stocks-latest.json public/data/stocks-history
          if git diff --cached --quiet; then
            echo "No new verified data to commit."
            exit 0
          fi
          git commit -m "Refresh official stock close for $(date -u +%F)"
          bash scripts/git-safe-push.sh
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Notify LINE of updated stock close data
        if: steps.publish.outputs.changed == 'true'
        continue-on-error: true
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO_USER_ID: ${{ secrets.LINE_TO_USER_ID }}
          LINE_MESSAGE: |-
            📈 Personal OS｜股票收盤資料已更新
            新的官方行情已寫入觀察資料。
            https://github.com/tobytsai/personal-os-static-git/blob/main/public/data/stocks-latest.json
        run: python3 scripts/send_line_notification.py
