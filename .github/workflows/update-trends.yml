name: Daily trend radar

on:
  schedule:
    - cron: '20 0 * * *' # 08:20 Asia/Taipei (UTC+8), subject to GitHub scheduler delay
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-trends.yml'
      - 'scripts/update-trends.py'

permissions:
  contents: write
  actions: write

concurrency:
  group: main-write-queue
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Check Python syntax
        run: python -m py_compile scripts/update-trends.py
      - name: Collect public trend sources
        run: python scripts/update-trends.py
      - name: Publish daily snapshot with conflict-safe rebase
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/data/trends-latest.json public/data/trends-history-index.json public/data/trends-history
          if git diff --cached --quiet; then
            echo 'No changes in trend data.'
            exit 0
          fi
          git commit -m "Refresh trend radar rankings"
          bash scripts/git-safe-push.sh
      - name: Dispatch Pages deployment for refreshed ranking
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
