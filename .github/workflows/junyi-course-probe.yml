name: Inspect Junyi public course structure
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/junyi-course-probe.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: pip install requests beautifulsoup4
      - run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          for url in ['https://www.junyiacademy.org/topics/coocele-c5','https://www.junyiacademy.org/topics/jnc-5-03-1a','https://www.junyiacademy.org/topics/es-10th-grade','https://www.junyiacademy.org/topics/j-m10a']:
              soup=BeautifulSoup(requests.get(url,timeout=40).text,'html.parser')
              for st in soup(['style','script']):st.decompose()
              print('URL',url)
              c=soup.select_one('[data-testid="section-card"]') or soup.select_one('[data-testid="topic-card"]')
              print('CARD',str(c)[:13000])
          PY