name: Probe shared note images after JavaScript rendering
on:
  push:
    branches: [main]
    paths:
      - scripts/probe_frame_note_browser.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -q --disable-pip-version-check playwright
      - name: Probe public notes using installed Chrome
        run: python3 scripts/probe_frame_note_browser.py
      - name: Commit safe diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/frame-note-browser-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Record JS-rendered public note diagnostic metadata"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
